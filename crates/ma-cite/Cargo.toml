[package]
name = "ma-cite"
description = "Moroccan legal citations read from running text or a search query."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ma-text = { path = "../ma-text" }
regex = { version = "1", default-features = false, features = ["std", "perf"] }

[dev-dependencies]
serde_json = "1"
