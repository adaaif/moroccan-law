[package]
name = "ma-wasm"
description = "Browser bindings (WASM) for ma-text and ma-cite: the citation checker reads a pasted document on the device."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
ma-text = { path = "../ma-text" }
ma-cite = { path = "../ma-cite" }
wasm-bindgen = "0.2"
serde_json = "1"
