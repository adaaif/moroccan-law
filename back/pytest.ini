[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests.py test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers --tb=short -n auto
testpaths = apps
markers =
    needs(name, ...): the test needs these from the system (ffmpeg, tesseract, fribidi): back/conftest.py
