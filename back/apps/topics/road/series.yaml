# The road in numbers (R17 of the road plan): deaths within thirty days of an accident, as the National Road Safety
# Agency (NARSA) counts them, each year from the report that prints it, read on its page on 20 Oct 2026 (2024 from
# NARSA's open data, sheet 1, cell D3). Definitive figures only; 2025's are the Bilan's. The 2017–2026 strategy aimed
# at half of 2015's deaths by 2026: a note, never drawn as a forecast. A year without an official figure stays empty.

