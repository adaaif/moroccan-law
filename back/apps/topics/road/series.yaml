series:
  - key: deaths
    title: {ar: 'الوفيات في حوادث السير', fr: 'Les tués sur les routes'}
    lead:
      ar: 'عدد القتلى داخل ثلاثين يوما من الحادثة، حسب الأرقام النهائية للوكالة الوطنية للسلامة الطرقية.'
      fr: 'Le nombre de tués dans les trente jours qui suivent l’accident, selon les chiffres définitifs de la NARSA.'
    table: 'الوفيات حسب السنة ومصدر كل رقم'
    unit: count
    lines:
      - {key: deaths, label: {ar: الوفيات, fr: Tués}}
