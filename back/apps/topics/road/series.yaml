    # The year told first (N1 of the road tools review): the newest figure and its change, who died by the Bilan's
    # page 4, each group leading to the rule that is theirs (N2); the strategy's goal as a stated line, never drawn.
    story:
      year: 2025
      value: 4786
      change: 18.94
      from: bilan2025
      page: 2
      words: {ar: 'قتيلا في طرقنا سنة 2025، أكثر سنة منذ 2011', fr: 'tués sur nos routes en 2025, l’année la plus lourde depuis 2011'}
      who_from: {from: bilan2025, page: 4}
      who:
        - {key: two, share: 45, label: {ar: 'على دراجات بمحرك ذات عجلتين أو ثلاث', fr: 'sur des deux- ou trois-roues motorisés'}, rule: {ar: 'الخوذة المربوطة والمصادق عليها واجبة للسائق والراكب', fr: 'Le casque attaché et homologué, pour le conducteur comme pour le passager'}, to: journeys/riders}
        - {key: walk, share: 26.1, label: {ar: 'راجلون', fr: 'des piétons'}, rule: {ar: 'للراجل الذي دخل الممر أسبقية المرور', fr: 'Le piéton engagé sur le passage a la priorité'}, to: pages/walking}
        - {key: cars, share: 18.4, label: {ar: 'في السيارات السياحية', fr: 'en voitures de tourisme'}, rule: {ar: 'الحزام إجباري، ولا طفل دون عشر سنوات في المقاعد الأمامية', fr: 'La ceinture est obligatoire, et pas d’enfant de moins de dix ans à l’avant'}, to: pages/rules}
        - {key: bikes, share: 4.5, label: {ar: 'على الدراجات', fr: 'à vélo'}, rule: {ar: 'الخوذة لسائقي الدراجات أيضا، ولا سماعات', fr: 'Le casque pour les cyclistes aussi, et pas d’écouteurs'}, to: journeys/riders}
      goal: {ar: 'كانت الاستراتيجية الوطنية 2017–2026 تهدف إلى نصف وفيات 2015 (3.776) في أفق 2026.', fr: 'La stratégie nationale 2017–2026 visait la moitié des tués de 2015 (3 776) à l’horizon 2026.'}
    notes:
      - {ar: 'كانت الاستراتيجية الوطنية 2017–2026 تهدف إلى خفض عدد الوفيات بـ50% في أفق 2026 مقارنة بسنة 2015 (تقرير 2023، ص. 7)، وكان هدفها المرحلي لسنة 2023 أقل من 2.454 قتيلا (ص. 4)؛ وسجلت تلك السنة 3.819.', fr: 'La stratégie nationale 2017–2026 visait à réduire de 50 % le nombre de tués d’ici 2026 par rapport à 2015 (Rapport 2023, p. 7) ; son objectif intermédiaire pour 2023 était de moins de 2 454 tués (p. 4) ; l’année en a compté 3 819.'}
