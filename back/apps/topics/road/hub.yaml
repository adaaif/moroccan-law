# The road topic's page (R5 of the road plan): where the reader stands, then doors by what just happened, in the words
# people use, each leading to a journey or a page; then the tools. A door, a tool or a page says whom it is for (`for`,
# the keys of the profile's answers); the reader's answer, kept on the phone, fades the others with the reason. The
# insurance of a vehicle lives here (Q7 of the plan). A door's `means` is the law's own phrase for its words: a
# question that is one of them is searched as that phrase first (R6: search learns the road's words).
doors_title: {ar: شنو وقع ليك؟, fr: 'Que vous arrive-t-il ?'}
# The emergency, always in reach at the top of the topic's page (T6, U1 of the road tools review).
urgent:
  title: {ar: درت أكسيدة؟, fr: 'Un accident ?'}
  lead: {ar: 'شنو دير دابا، خطوة بخطوة', fr: 'Que faire maintenant, étape par étape'}
  to: tools/now
  # Its first three acts (A7 of the road-signposted review): the answers of the accident journey's steps, as the journey says
  # them, once it may be shown.
  acts: {journey: accident, steps: [0, 2, 5]}
  # A number shows only with the official page that gives it (C1): the DGSN's header links tel:19 (kept with its hash in
  # data/sources/road/). The Royal Gendarmerie's and the Civil Protection's sites did not answer on 26 Oct 2026, so
  # their numbers wait for their own pages.
  numbers:
    - number: '19'
      name: {ar: الأمن الوطني, fr: 'Police (Sûreté nationale)'}
      source:
        name: {ar: موقع المديرية العامة للأمن الوطني, fr: Site de la DGSN}
        url: https://www.dgsn.gov.ma/ar
        file: road/dgsn_home_ar_2026-10-26.html
        sha256: 6508185563d2a3d3a64418a06946a9ed4713aede103429c6014cc3be48f5e7b6
# Learning the road as one path (T4): each part's progress kept on the phone.
learn: [tools/scenes, tools/signs, tools/practice, pages/rules]

# The order a reviewer opens the topic in (R2 of the road tools review): the moments people meet most first; the
# victim, compensation and insurance with a lawyer last. A wave opens when its items pass the desk (/topics/road/review).
waves:
  1: [journeys/radar, journeys/ticket, pages/points, pages/rules, pages/where, tools/fine, tools/speed, tools/points, tools/scenes, tools/signs]
  2: [journeys/accident, tools/now, journeys/impound, journeys/used-car, journeys/riders, pages/two-wheels, pages/walking, checklists/carry, pages/licence, journeys/foreign, tools/practice, pages/numbers, series/deaths, reform/fines-2025, reform/victims-2026, reform/registration-2026, reform/rules-2026, reform/vehicles-2026]
  3: [journeys/victim, tools/compensation, pages/insurance, rates/capital, rates/fines]

# Each answer's facts (A4 of the road-signposted review): the two or three figures that are the reader's, each with the
# articles that set it, said under the one question instead of a line of article numbers.
profile:
  question: {ar: شنو وضعك؟, fr: 'Quelle est votre situation ?'}
  options:
    - key: learner
      first: licence
      main: true
      label: {ar: كنقرا البيرمي, fr: J’apprends à conduire}
      law: {ar: 'رخصة السياقة في القانون 52.05 (المواد 7 إلى 12)، ومرسوم رخصة السياقة 2.10.311، وقرار شروط طلبها 2709.10، ومرسوم تعليم السياقة 2.10.432.', fr: 'Le permis dans la loi 52-05 (art. 7 à 12), le décret 2-10-311 sur le permis, l’arrêté 2709-10 sur sa demande et le décret 2-10-432 sur l’enseignement de la conduite.'}
      facts:
        - {value: '14', label: {ar: 'عام لصنف «أم»: الموطور الصغير', fr: 'ans pour la catégorie AM : le cyclomoteur'}, cites: [/ma/loi/52-05/art_11]}
        - {value: '18', label: {ar: 'عام لصنف «ب»: الطوموبيل', fr: 'ans pour la catégorie B : la voiture'}, cites: [/ma/loi/52-05/art_11]}
        - {value: '20', label: {ar: 'نقطة فالعامين الأولين', fr: 'points les deux premières années'}, cites: [/ma/loi/52-05/art_23]}
      to: pages/licence
    - key: probation
      first: points
      label: {ar: عندي البيرمي جديد, fr: J’ai un permis récent}
      law: {ar: 'رخصتك اختبارية: 20 نقطة لمدة سنتين (المادة 23)، وما تفوتش 90 كلم فالساعة حتى فالطريق السيار (المادة 16 من مرسوم قواعد السير).', fr: 'Votre permis est probatoire : 20 points pendant deux ans (art. 23), et jamais plus de 90 km/h, autoroute comprise (art. 16 du décret sur les règles de circulation).'}
      facts:
        - {value: '90', label: {ar: 'كلم/س على الأكثر، حتى فالطريق السيار', fr: 'km/h au plus, autoroute comprise'}, cites: [/ma/decret/2-10-420/art_16]}
        - {value: '20', label: {ar: 'نقطة فرخصتك', fr: 'points sur votre permis'}, cites: [/ma/loi/52-05/art_23]}
        - {value: '2', label: {ar: 'سنين ديال الفترة الاختبارية', fr: 'ans de période probatoire'}, cites: [/ma/loi/52-05/art_23]}
    - key: driver
      first: radar
      main: true
      label: {ar: كنسوق طوموبيل, fr: Je conduis une voiture}
      law: {ar: 'رصيدك 30 نقطة (المادة 27)، والمخالفات ثلاث درجات بغراماتها (المواد 184 إلى 186 و219)، وقواعد السير في المرسوم 2.10.420.', fr: 'Votre solde est de 30 points (art. 27) ; les contraventions sont de trois classes avec leurs amendes (art. 184 à 186 et 219) ; les règles de circulation sont dans le décret 2-10-420.'}
      facts:
        - {value: '30', label: {ar: 'نقطة فرخصتك', fr: 'points sur votre permis'}, cites: [/ma/loi/52-05/art_27]}
        - {value: '60 · 100 · 120', label: {ar: 'كلم/س: المدينة، برا، الطريق السيار', fr: 'km/h : ville, route, autoroute'}, cites: [/ma/decret/2-10-420/art_15, /ma/decret/2-10-420/art_17, /ma/decret/2-10-420/art_18]}
        - {value: '3', label: {ar: 'درجات للمخالفات، كل وحدة بغرامتها', fr: 'classes de contraventions, chacune son amende'}, cites: [/ma/loi/52-05/art_184, /ma/loi/52-05/art_185, /ma/loi/52-05/art_186]}
    - key: two-wheels
      first: two-wheels
      main: true
      label: {ar: موطور ولا تروتينيت, fr: Deux-roues ou trottinette}
      law: {ar: 'الخوذة واجبة (المادة 110 من مرسوم قواعد السير)، والتروتينيت بمحرك 25 كلم فالساعة على الأكثر منذ 24 غشت 2026 (المادة 19)، والموطور الصغير بصنف «أم» من 14 عام (المادتان 7 و11).', fr: 'Le casque est obligatoire (art. 110 du décret sur les règles de circulation) ; la trottinette à moteur roule à 25 km/h au plus depuis le 24 août 2026 (art. 19) ; le cyclomoteur se conduit avec la catégorie AM dès 14 ans (art. 7 et 11).'}
      facts:
        - {value: {ar: الكاسك, fr: Casque}, label: {ar: 'واجب على الموطور والتروتينيت', fr: 'obligatoire à deux-roues et en trottinette'}, cites: [/ma/decret/2-10-420/art_110]}
        - {value: '25', label: {ar: 'كلم/س على الأكثر للتروتينيت بمحرك', fr: 'km/h au plus en trottinette à moteur'}, cites: [/ma/decret/2-10-420/art_19]}
        - {value: '14', label: {ar: 'عام لصنف «أم»', fr: 'ans pour la catégorie AM'}, cites: [/ma/loi/52-05/art_11]}
      to: journeys/riders
    - key: walker
      first: walking
      main: true
      label: {ar: على رجلي, fr: À pied}
      law: {ar: 'للراجلين فصل في مرسوم قواعد السير (المواد 116 إلى 124)، وللراجل الذي دخل الممر أسبقية المرور (المادة 126).', fr: 'Les piétons ont leur chapitre du décret sur les règles de circulation (art. 116 à 124) ; le piéton engagé sur le passage a la priorité (art. 126).'}
      facts:
        - {value: {ar: الممر, fr: Passage}, label: {ar: 'الأسبقية للراجل اللي دخل ليه', fr: 'priorité au piéton engagé'}, cites: [/ma/decret/2-10-420/art_126]}
        - {value: '116–124', label: {ar: 'مواد الراجلين فمرسوم قواعد السير', fr: 'les articles des piétons dans le décret'}, cites: [/ma/decret/2-10-420/art_116]}
      to: pages/walking
    - key: pro
      first: ticket
      label: {ar: سائق مهني, fr: Je suis conducteur professionnel}
      law: {ar: 'البطاقة المهنية والتكوين المستمر (المادتان 40 و41)، وجهاز قياس السرعة وزمن السياقة (المادة 176)، والسياقة المهنية في المرسوم 2.10.314.', fr: 'La carte professionnelle et la formation continue (art. 40 et 41), le chronotachygraphe et les temps de conduite (art. 176), la conduite professionnelle dans le décret 2-10-314.'}
      facts:
        - {value: {ar: البطاقة, fr: Carte}, label: {ar: 'المهنية، واجبة للسياقة المهنية', fr: 'professionnelle, obligatoire'}, cites: [/ma/loi/52-05/art_40]}
        - {value: '5', label: {ar: 'سنين: التكوين المستمر باش تجدد البطاقة', fr: 'ans : la formation continue pour la renouveler'}, cites: [/ma/loi/52-05/art_41]}
    - key: foreign
      first: foreign
      label: {ar: عندي بيرمي ديال برا, fr: J’ai un permis étranger}
      law: {ar: 'كتسوق بيه عام من نهار الإقامة فالمغرب (المادة 2)، ومن بعد كتبدلو ولا كدوز الامتحان (المادة 3 والقرار 02.11).', fr: 'Il vaut un an à compter de votre installation au Maroc (art. 2) ; ensuite il s’échange, ou vous passez l’examen (art. 3 et arrêté 02-11).'}
      facts:
        - {value: '1', label: {ar: 'عام من نهار الإقامة فالمغرب', fr: 'an à compter de l’installation au Maroc'}, cites: [/ma/loi/52-05/art_2]}
        - {value: {ar: التبديل, fr: Échange}, label: {ar: 'ولا الامتحان من بعد', fr: 'ou l’examen ensuite'}, cites: [/ma/loi/52-05/art_3]}
      to: journeys/foreign
    - key: injured
      first: victim
      label: {ar: تصابيت فحادثة, fr: J’ai été blessé dans un accident}
      law: {ar: 'التعويض في ظهير 1.84.177 كما غيره القانون 70.24 للحوادث الواقعة ابتداء من 29 يناير 2026، والتأمين الإجباري في مدونة التأمينات 17.99.', fr: 'L’indemnisation suit le dahir 1-84-177 tel que modifié par la loi 70-24 pour les accidents survenus depuis le 29 janvier 2026 ; l’assurance obligatoire, le code des assurances 17-99.'}
      facts:
        - {value: {ar: 29 يناير 2026, fr: 29 janvier 2026}, label: {ar: 'الجدول الجديد للحوادث من هاد النهار', fr: 'le nouveau barème pour les accidents depuis'}, cites: [/ma/loi/70-24/art_7]}
        - {value: '60', label: {ar: 'يوما لعرض شركة التأمين فالنص الجديد، والقديم باقي حتى يصدرو نصين', fr: 'jours pour l’offre de l’assureur dans le nouveau texte ; l’ancien reste jusqu’à deux textes'}, cites: [/ma/dahir/1-84-177/art_19, /ma/loi/70-24/art_8]}
      to: journeys/victim

