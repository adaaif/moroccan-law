tools:
  # «بطاقتي» (the card): a birth date and the card's date in, its last valid day, the age-16 duty, the renewals art. 13
  # names, the fines, what to bring and the stamp. It waits for a person's check.
  - key: card
    icon: idcard
    words: [فوقاش كتسالي البطاقة, شحال باقي فالبطاقة, البطاقة ديالي صالحة, validité de ma carte]
    means: مدة صلاحيتها
    tool: true
    title: {ar: البطاقة ديالي, fr: 'Ma carte'}
    lead: {ar: 'فوقاش كتسالي، فوقاش خاصك تجددها، وشحال', fr: 'Quand elle expire, quand la renouveler, combien'}
    cites: [/ma/decret/2-20-521/art_1, /ma/loi/4-20/art_2, /ma/loi/4-20/art_13, /ma/loi/4-20/art_15, /ma/code/cgi/art_252]
  # The civil-status clock: a birth or death, in Morocco or abroad, a request for a material error's correction or for a
  # late inscription → the last day the texts leave.
  - key: clock
    icon: clock
    words: [آخر أجل للتصريح بالولادة, آخر أجل للتصريح بالوفاة, délai de déclaration naissance, délai déclaration décès]
    means: أجل تتميم التصريح بالولادة أو الوفاة
    tool: true
    title: {ar: آجال الحالة المدنية, fr: 'Les délais de l’état civil'}
    lead: {ar: 'من النهار ديال الولادة ولا الوفاة ولا الطلب', fr: 'Dès le jour de la naissance, du décès ou de la demande'}
    cites: [/ma/decret/2-22-04/art_40, /ma/decret/2-22-04/art_41, /ma/loi/36-21/art_51]
  # The administration's counter (law 55.19): the day the file was complete → the day it must answer, the 30 days to
  # appeal, the 15 days the higher authority has.
  - key: counter
    icon: clock
    words: [شحال خاص الإدارة تجاوب, الإدارة طولات, آجال الإدارة, délai administration 60 jours]
    means: الآجال القصوى لدراسة طلبات المرتفقين
    tool: true
    title: {ar: الإدارة ما جاوباتش, fr: 'L’administration n’a pas répondu'}
    lead: {ar: 'نهار الملف الكامل: آخر نهار للجواب، والطعن', fr: 'Le jour du dossier complet : réponse, recours'}
    cites: [/ma/loi/55-19/art_10, /ma/loi/55-19/art_16, /ma/loi/55-19/art_21, /ma/loi/55-19/art_19, /ma/loi/55-19/art_20, /ma/loi/55-19/art_31]
  # «واش هاد السمية مقبولة؟»: the rules of art. 34 a machine can check (two names at most, no title, no number), the rest
  # said as the officer's and the High Commission's.
  - key: names
    icon: tag
    words: [واش السمية مقبولة, نختار سمية, prénom accepté]
    means: الاسم الشخصي الذي اختاره من يقدم التصريح بالولادة
    tool: true
    title: {ar: 'واش هاد السمية مقبولة؟', fr: 'Ce prénom est-il accepté ?'}
    lead: {ar: 'القواعد اللي كيكتبها القانون، وشكون كيقرر فالباقي', fr: 'Les règles écrites, et qui décide du reste'}
    cites: [/ma/loi/36-21/art_34, /ma/decret/2-22-04/art_33, /ma/loi/36-21/art_19]
  # When a sentence is wiped from card no. 3: rehabilitation by law (22.01 art. 688, 689) or a request (art. 692).
  - key: rehab
    icon: scales
    words: [فوقاش يتمسح الحكم, رد الاعتبار شحال, quand la réhabilitation]
    means: يكتسب المحكوم عليه رد الاعتبار بقوة القانون
    tool: true
    title: {ar: 'فوقاش يتمسح الحكم؟', fr: 'Quand la condamnation s’efface-t-elle ?'}
    lead: {ar: 'رد الاعتبار بقوة القانون، ولا بطلب', fr: 'La réhabilitation de plein droit, ou sur demande'}
    cites: [/ma/loi/22-01/art_688, /ma/loi/22-01/art_689, /ma/loi/22-01/art_692, /ma/loi/22-01/art_667, /ma/loi/22-01/art_702]
