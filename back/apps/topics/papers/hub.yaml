# The papers topic's page (the papers review, 27 Oct 2026: what a reader needs to understand their papers under
# Moroccan law). One question first, since the office, the limits and the papers depend on where the reader does them:
# in Morocco (the commune, the DGSN), at a consulate (law 36.21 arts 4 and 7, decree 2.20.521 art. 8), or as a foreigner
# (law 02.03). Then the doors in the stages a paper lives through, each led by the national identity card drawn small
# (`marks: card`) with the one figure the law sets for it where the photo sits, or its pictogram. Written from the texts
# as the site holds them on 27 Oct 2026: 04.20 and decree 2.20.521 (the card), 36.21 and decree 2.22.04 (civil status),
# decree 2.08.310 as changed by 2.26.551 (the passport), dahir 1.58.250 (nationality), law 55.19 and its decrees,
# decrees 2.22.047 and 2.22.048 (legalisation, certified copies), the criminal procedure 22.01 (the criminal record),
# 72.18, 09.08, 02.03 and decree 2.09.607, the tax code's stamp duties (arts 250, 252). Nothing here reaches a reader
# before a person checks it.
doors_title: {ar: شنو خاصك فالوراق؟, fr: 'De quel papier avez-vous besoin ?'}
marks: card
stages:
  - {key: card, title: {ar: البطاقة الوطنية, fr: La carte nationale}, doors: [card-first, card-valid, card-renew, card-lost, card-child, card-abroad]}
  - {key: civil, title: {ar: الحالة المدنية, fr: L’état civil}, doors: [birth, error, name, naming, copies, abroad-marriage, death]}
  - {key: travel, title: {ar: 'الباسبور والجنسية', fr: 'Le passeport et la nationalité'}, doors: [passport, nationality-mother, nationality-spouse, nationality-proof]}
  - {key: counter, title: {ar: 'فالإدارة: حقوقك فالشباك', fr: 'À l’administration : vos droits au guichet'}, doors: [counter-copies, counter-wait, counter-refused, legalize]}
  - {key: record, title: {ar: السجل العدلي, fr: Le casier judiciaire}, doors: [record, rehab]}
  - {key: data, title: {ar: 'المعطيات ديالك والأجانب', fr: 'Vos données, et les étrangers'}, doors: [data, register, foreigner-stay]}
  - {key: elsewhere, title: {ar: فمواضيع أخرى, fr: 'Dans d’autres thèmes'}, doors: [licence, marry, kafala], links: true}

# The band: the moment a paper is suddenly missing. Its acts are the lost-card journey's first answers. No number is shown:
# a lost card is declared at a police station or a gendarmerie, not by a call.
urgent:
  title: {ar: ضاعت ليك البطاقة ولا الباسبور؟, fr: 'Carte ou passeport perdu ?'}
  lead: {ar: 'شنو كيقول القانون من النهار الأول', fr: 'Ce que dit la loi dès le premier jour'}
  to: journeys/card-lost
  tone: deep
  acts: {journey: card-lost, steps: [0, 1, 2]}

learn: [pages/counter, journeys/card-first, pages/copies, pages/nationality, pages/beliefs]

# What people believe, and what the law says, each card leading to the page that answers it.
beliefs:
  - claim: {ar: عقد الازدياد كيتسالا من بعد 3 شهور, fr: 'L’extrait de naissance expire après 3 mois'}
    truth: {ar: 'الـ3 شهور مكتوبة غير لملف أول بطاقة وطنية؛ والبطاقة نفسها كتعفيك من عقد الازدياد.', fr: 'Les 3 mois ne valent que pour le dossier de la première carte ; la carte elle-même dispense de l’extrait.'}
    to: pages/beliefs
  - claim: {ar: خاصني نصحح الإمضاء ونجيب نسخة مطابقة للأصل لكل ملف, fr: 'Il faut légaliser et certifier conformes toutes les pièces'}
    truth: {ar: 'القانون 55.19 كيمنع الإدارة تطلبهم منك فملف القرار الإداري؛ النسخة المطابقة غير مرة وحدة إلا شكات، وبتعليل.', fr: 'La loi 55.19 l’interdit pour un dossier de décision administrative ; la copie conforme une seule fois en cas de doute, motivée.'}
    to: pages/beliefs
  - claim: {ar: البطاقة ما كتتبدلش حتى تسالي, fr: 'On ne change la carte qu’à son expiration'}
    truth: {ar: 'بدلتي السكنى؟ خاصك تجددها، وإلا غرامة من 200 حتى 300 درهم.', fr: 'Un changement d’adresse oblige à la renouveler, sinon 200 à 300 DH d’amende.'}
    to: pages/beliefs
  - claim: {ar: الباسبور القديم ما بقاش صالح مع الجديد, fr: 'L’ancien passeport ne vaut plus avec le nouveau'}
    truth: {ar: 'الباسبور اللي عندك كيبقى صالح حتى تسالي مدتو.', fr: 'Votre passeport reste valable jusqu’à son expiration.'}
    to: pages/beliefs
  - claim: {ar: ولد المغربية من أب أجنبي ماشي مغربي, fr: 'L’enfant d’une Marocaine et d’un étranger n’est pas marocain'}
    truth: {ar: 'مغربي: كل من تزاد من أب مغربي ولا أم مغربية.', fr: 'Il l’est : est marocain l’enfant né d’un père ou d’une mère marocains.'}
    to: pages/beliefs
  - claim: {ar: الإدارة تقدر تبقى ساكتة على الطلب ديالي, fr: 'L’administration peut ne jamais répondre'}
    truth: {ar: '60 يوم على الأكثر، والرفض بالتعليل، وعندك 30 يوم للطعن.', fr: '60 jours au plus, un refus motivé, et 30 jours pour le recours.'}
    to: pages/beliefs

# The order a reviewer opens the topic in: what people meet most first (the card, the counter, copies), then civil status
# and nationality, then the criminal record, the data, the foreigners and the changes.
waves:
  1: [journeys/card-first, journeys/card-renew, journeys/card-lost, pages/counter, pages/copies, pages/beliefs, tools/card, tools/counter, checklists/card-first, checklists/card-renew]
  2: [journeys/correct, journeys/name, journeys/appeal, pages/passport, pages/nationality, pages/card, pages/legalize, tools/clock, tools/names, checklists/card-abroad, checklists/card-marital]
  3: [journeys/record, journeys/spouse, journeys/abroad-marriage, pages/data, pages/foreigners, tools/rehab, reform/passport-2026, reform/naturalisation-2023, reform/high-commission-2026]

# The one question: where the reader does their papers. Each answer names its law and its office, three figures with
# their articles, and leads with its own door; it is kept on the phone.
profile:
  question: {ar: فين كتقضي الوراق ديالك؟, fr: 'Où faites-vous vos papiers ?'}
  options:
    - key: morocco
      first: card-first
      main: true
      label: {ar: فالمغرب, fr: Au Maroc}
      law: {ar: 'البطاقة الوطنية عند الأمن الوطني (القانون 04.20)، والحالة المدنية فالجماعة ديالك (القانون 36.21)، وكل إدارة ملزمة بالقانون 55.19 فاش كتطلب منك الوراق.', fr: 'La carte nationale auprès de la Sûreté nationale (loi 04.20), l’état civil à votre commune (loi 36.21), et chaque administration tenue par la loi 55.19 quand elle vous demande des pièces.'}
      facts:
        - {value: {ar: '16 عام', fr: '16 ans'}, label: {ar: 'البطاقة الوطنية واجبة من هاد السن', fr: 'la carte nationale est obligatoire à cet âge'}, cites: [/ma/loi/4-20/art_2]}
        - {value: {ar: '30 يوم', fr: '30 jours'}, label: {ar: 'باش تصرح بالولادة ولا الوفاة، من النهار اللي من بعد', fr: 'pour déclarer une naissance ou un décès, dès le lendemain'}, cites: [/ma/decret/2-22-04/art_40]}
        - {value: {ar: '60 يوم', fr: '60 jours'}, label: {ar: 'أقصى أجل باش تجاوبك الإدارة على طلب', fr: 'au plus pour que l’administration réponde à une demande'}, cites: [/ma/loi/55-19/art_16]}
    - key: abroad
      first: card-abroad
      main: true
      label: {ar: فالقنصلية (ساكن فالخارج), fr: 'Au consulat (à l’étranger)'}
      law: {ar: 'القنصلية هي مكتب الحالة المدنية ديالك والقنصل ضابطها (القانون 36.21، المادتان 4 و7)، والبطاقة الوطنية كتطلبها فالقنصلية ولا فالمغرب.', fr: 'Le consulat est votre bureau d’état civil et le consul son officier (loi 36.21, arts 4 et 7) ; la carte se demande au consulat ou au Maroc.'}
      facts:
        - {value: {ar: '1 عام', fr: '1 an'}, label: {ar: 'باش تصرح بالولادة ولا الوفاة فالخارج', fr: 'pour déclarer une naissance ou un décès à l’étranger'}, cites: [/ma/decret/2-22-04/art_40]}
        - {value: {ar: 'التسجيل', fr: 'L’inscription'}, label: {ar: 'شهادة التسجيل القنصلي كتعوض شهادة السكنى فملف البطاقة', fr: 'le certificat d’immatriculation consulaire remplace le certificat de résidence'}, cites: [/ma/decret/2-20-521/art_8]}
        - {value: {ar: '0 درهم', fr: '0 DH'}, label: {ar: 'تمبر الباسبور لولاد الجالية اللي تحت 18 عام', fr: 'de timbre pour le passeport des enfants de la diaspora de moins de 18 ans'}, cites: [/ma/code/cgi/art_250]}
    - key: foreigner
      first: foreigner-stay
      main: true
      label: {ar: أنا أجنبي فالمغرب, fr: 'Étranger au Maroc'}
      law: {ar: 'إقامتك بالقانون 02.03: بطاقة التسجيل من عام حتى 10 سنين، وبطاقة الإقامة؛ والولادة والوفاة اللي وقعو فالمغرب تقدر تسجلهم فالحالة المدنية (القانون 36.21، المادة 1).', fr: 'Votre séjour relève de la loi 02.03 : la carte d’immatriculation, d’un à dix ans, et la carte de résidence ; une naissance ou un décès au Maroc peut être inscrit à l’état civil (loi 36.21, art. 1).'}
      facts:
        - {value: {ar: '90 يوم', fr: '90 jours'}, label: {ar: 'باش تطلب سند الإقامة إلا ما كانتش عليك فيزا، ولا قبل ما تسالي الفيزا', fr: 'pour demander un titre de séjour sans visa, ou avant la fin du visa'}, cites: [/ma/decret/2-09-607/art_1]}
        - {value: {ar: '4 سنين', fr: '4 ans'}, label: {ar: 'ديال الإقامة باش تطلب بطاقة الإقامة؛ وزوج المغربية ولا زوجة المغربي كياخدها', fr: 'de séjour pour demander la carte de résidence ; le conjoint d’un Marocain la reçoit'}, cites: [/ma/loi/2-03/art_16, /ma/loi/2-03/art_17]}
        - {value: {ar: '100 درهم', fr: '100 DH'}, label: {ar: 'تمبر وثائق الإقامة على كل عام من مدتها', fr: 'de timbre par année de validité du titre de séjour'}, cites: [/ma/code/cgi/art_252]}
      to: pages/foreigners

