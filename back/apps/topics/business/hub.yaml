# The business topic's page (the business review, 27 Oct 2026, built as the papers topic was, $5 of Haiku at most).
# One question first, since the law, the register and the duties depend on how the reader works: alone as an
# auto-entrepreneur (law 114.13), as a trader in their own name (the commerce code 15.95), through a company (law 5.96),
# in a cooperative (law 112.12), or selling to the administration (decree 2.22.431). Then the doors in a business's
# life, each led by the rubber stamp every Moroccan business presses on its invoices and letters (`marks: cachet`), with
# the one figure the law sets for it in the middle, or its pictogram. Written from the texts as the site holds them on 27
# Oct 2026: the commerce code (Adala's consolidation of 29 Jan 2026, with law 71.24 on cheques and law 69.21 on payment
# terms), 5.96 (Adala, 22 Aug 2024), 114.13 and decrees 2.15.258, 2.15.263 and 2.21.928, 112.12 (Adala, 21 Aug 2017),
# decree 2.22.92 on creating a business online, decree 2.22.431 on public procurement, the investment charter 03.22,
# decree 2.23.1 and law 47.18, and the tax code (arts 20, 42 bis, 42 ter, 73, 82 bis, 145, 148). Nothing here reaches a
# reader before a person checks it.
doors_title: {ar: شنو كتحتاج فالمقاولة ديالك؟, fr: 'De quoi votre activité a-t-elle besoin ?'}
marks: cachet
stages:
  - {key: start, title: {ar: كنبدا, fr: Je démarre}, doors: [auto, auto-excluded, sarl, capital, register, online, cooperative, declare]}
  - {key: run, title: {ar: كنخدم, fr: Je travaille}, doors: [invoice, terms, late, books, accounts, shop-sale]}
  - {key: cheque, title: {ar: الشيك, fr: Le chèque}, doors: [cheque-present, cheque-bounced, cheque-penalty, cheque-guarantee]}
  - {key: trouble, title: {ar: إلا تعقدات, fr: 'Quand ça se complique'}, doors: [alert, safeguard, stop-paying, losses]}
  - {key: grow, title: {ar: كنكبر, fr: Je grandis}, doors: [markets, markets-guarantee, investment, investment-appeal]}
  - {key: elsewhere, title: {ar: فمواضيع أخرى, fr: 'Dans d’autres thèmes'}, doors: [tax-own, shop-lease, employer], links: true}

# The band: the moment a cheque comes back unpaid, the business emergency everyone in Morocco knows. Its acts are the
# bounced-cheque journey's first answers. No number is shown: no official page gives one for this.
urgent:
  title: {ar: شيك رجع بلا رصيد؟, fr: 'Un chèque revenu impayé ?'}
  lead: {ar: 'شنو كيقول القانون من النهار الأول، للي عندو الشيك وللي كتبو', fr: 'Ce que dit la loi dès le premier jour, à qui le détient et à qui l’a signé'}
  to: journeys/cheque-bounced
  tone: umber
  acts: {journey: cheque-bounced, steps: [0, 1, 2]}

learn: [pages/forms, journeys/auto-start, pages/invoice, pages/cheque, pages/beliefs]

# What people believe, and what the law says, each card leading to the page that answers it.
beliefs:
  - claim: {ar: 'باش تدير SARL خاصك 10.000 درهم', fr: 'Il faut 10 000 DH pour créer une SARL'}
    truth: {ar: 'الرأسمال كيحددوه الشركاء بحرية فالنظام الأساسي، والربع ديال الحصص النقدية هو اللي كيتخلص فالأول.', fr: 'Le capital est fixé librement par les associés dans les statuts, et un quart des apports en numéraire est versé d’abord.'}
    to: pages/beliefs
  - claim: {ar: 'الشيك ديال الضمانة ماشي مشكل', fr: 'Le chèque de garantie ne pose pas de problème'}
    truth: {ar: 'اللي قبل شيك على أساس ما يخلصوش دابا ويخليه ضمانة كيتعاقب بغرامة 2% من قيمتو.', fr: 'Qui accepte un chèque pour ne pas l’encaisser et le garder en garantie encourt une amende de 2 % de son montant.'}
    to: pages/beliefs
  - claim: {ar: 'المقاول الذاتي ممكن يحجزو ليه الدار', fr: 'On peut saisir la maison de l’auto-entrepreneur'}
    truth: {ar: 'محل السكنى الرئيسي ديال المقاول الذاتي ما يتحجزش بسبب ديون النشاط ديالو.', fr: 'La résidence principale de l’auto-entrepreneur est insaisissable pour les dettes de son activité.'}
    to: pages/beliefs
  - claim: {ar: 'الزبون يقدر يخلصني فوقما بغا', fr: 'Le client paie quand il veut'}
    truth: {ar: 'بلا اتفاق: 60 يوم من الفاتورة. بالاتفاق: 120 يوم على الأكثر؛ ومن بعد غرامة لفائدة الخزينة.', fr: 'Sans accord : 60 jours après la facture. Avec accord : 120 jours au plus ; au-delà, une amende au Trésor.'}
    to: pages/beliefs
  - claim: {ar: 'الشيك المؤخر ما يتخلصش قبل التاريخ ديالو', fr: 'Un chèque postdaté ne se paie pas avant sa date'}
    truth: {ar: 'الشيك كيتخلص بمجرد الاطلاع؛ واللي تقدم قبل التاريخ ديالو كيتخلص نهار تقديمه.', fr: 'Le chèque est payable à vue ; présenté avant sa date, il se paie le jour de sa présentation.'}
    to: pages/beliefs
  - claim: {ar: 'المقاول الذاتي خاصو السجل التجاري', fr: 'L’auto-entrepreneur doit s’inscrire au registre du commerce'}
    truth: {ar: 'معفي من التقييد فالسجل التجاري ومن مسك المحاسبة؛ كيتسجل فالسجل الوطني للمقاول الذاتي.', fr: 'Il est dispensé du registre du commerce et de la comptabilité ; il s’inscrit au registre national de l’auto-entrepreneur.'}
    to: pages/beliefs

# The order a reviewer opens the topic in: what people meet most first (the auto-entrepreneur, the cheque, the company),
