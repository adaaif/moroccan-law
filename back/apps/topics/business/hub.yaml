# The one question: how the reader works. Each answer names its law and where it registers, three figures with their
# articles, and leads with its own door; it is kept on the phone.
profile:
  question: {ar: شنو كتدير؟, fr: 'Comment travaillez-vous ?'}
  options:
    - key: auto
      first: auto
      main: true
      label: {ar: خدام بحسابي (مقاول ذاتي), fr: 'À mon compte (auto-entrepreneur)'}
      law: {ar: 'القانون 114.13: كتتسجل فالسجل الوطني للمقاول الذاتي عند بريد المغرب، بلا سجل تجاري وبلا محاسبة، وكتخلص الضريبة على رقم المعاملات.', fr: 'La loi 114.13 : vous vous inscrivez au registre national de l’auto-entrepreneur chez Barid Al-Maghrib, sans registre du commerce ni comptabilité, et payez l’impôt sur le chiffre d’affaires.'}
      facts:
        - {value: {ar: '500.000 درهم', fr: '500 000 DH'}, label: {ar: 'سقف رقم المعاملات فالتجارة والصناعة والحرف، و200.000 فالخدمات', fr: 'plafond de chiffre d’affaires en commerce, industrie, artisanat ; 200 000 en services'}, cites: [/ma/loi/114-13/art_1]}
        - {value: {ar: '0,5%', fr: '0,5 %'}, label: {ar: 'الضريبة على رقم المعاملات المحصل فالتجارة، و1% فالخدمات', fr: 'd’impôt sur le chiffre encaissé en commerce ; 1 % en services'}, cites: [/ma/code/cgi/art_73]}
        - {value: {ar: 'الدار', fr: 'La maison'}, label: {ar: 'محل السكنى الرئيسي ما يتحجزش بسبب ديون النشاط', fr: 'la résidence principale est insaisissable pour les dettes de l’activité'}, cites: [/ma/loi/114-13/art_4]}
    - key: trader
      first: register
      main: true
      label: {ar: تاجر باسمي (حانوت، ورشة), fr: 'Commerçant en nom propre (boutique, atelier)'}
      law: {ar: 'مدونة التجارة: الممارسة الاعتيادية لنشاط تجاري كتعطيك صفة تاجر، وكتلزمك بالسجل التجاري وبمسك المحاسبة.', fr: 'Le code de commerce : l’exercice habituel d’une activité commerciale vous donne la qualité de commerçant, et vous oblige au registre du commerce et à la comptabilité.'}
      facts:
        - {value: {ar: '3 شهور', fr: '3 mois'}, label: {ar: 'باش تطلب التسجيل فالسجل التجاري من نهار فتحتي', fr: 'pour demander l’immatriculation au registre dès l’ouverture'}, cites: [/ma/loi/15-95/art_75]}
        - {value: {ar: '1.000 – 5.000', fr: '1 000 – 5 000'}, label: {ar: 'درهم غرامة على اللي ما طلبش التقييد، شهر من بعد الإنذار', fr: 'DH d’amende pour qui ne demande pas l’inscription, un mois après la mise en demeure'}, cites: [/ma/loi/15-95/art_62]}
        - {value: {ar: '30 يوم', fr: '30 jours'}, label: {ar: 'باش توجه التصريح بالتأسيس للضرائب من بداية النشاط', fr: 'pour la déclaration d’existence aux impôts dès le début de l’activité'}, cites: [/ma/code/cgi/art_148]}
    - key: company
      first: sarl
      main: true
      label: {ar: عندي شركة (SARL), fr: 'J’ai une société (SARL)'}
      law: {ar: 'القانون 5.96: الشركة ذات المسؤولية المحدودة من شخص واحد حتى 50، كل واحد مسؤول فحدود حصصو، وكتتسجل فالسجل التجاري عبر المنصة الإلكترونية.', fr: 'La loi 5.96 : la SARL, d’une à cinquante personnes, chacune responsable à hauteur de ses apports, immatriculée au registre du commerce via la plateforme électronique.'}
      facts:
        - {value: {ar: '1 – 50', fr: '1 – 50'}, label: {ar: 'عدد الشركاء؛ الشريك الوحيد كيمارس سلطات الجمعية', fr: 'associés ; l’associé unique exerce les pouvoirs de l’assemblée'}, cites: [/ma/loi/5-96/art_44, /ma/loi/5-96/art_47]}
        - {value: {ar: 'الربع', fr: 'Le quart'}, label: {ar: 'من الحصص النقدية كيتخلص فالأول، والباقي فـ5 سنين', fr: 'des apports en numéraire versé d’abord, le reste en 5 ans'}, cites: [/ma/loi/5-96/art_51]}
        - {value: {ar: '6 شهور', fr: '6 mois'}, label: {ar: 'من نهاية السنة المحاسبية باش تصادق الجمعية على الحسابات', fr: 'après la clôture pour que l’assemblée approuve les comptes'}, cites: [/ma/loi/5-96/art_70]}
    - key: cooperative
      first: cooperative
      label: {ar: فتعاونية, fr: 'Dans une coopérative'}
      law: {ar: 'القانون 112.12: التعاونية خمسة أعضاء على الأقل، صوت واحد لكل عضو، كتتسجل فسجل التعاونيات عند كتابة الضبط بالمحكمة الابتدائية.', fr: 'La loi 112.12 : cinq membres au moins, une voix par membre, inscrite au registre des coopératives au greffe du tribunal de première instance.'}
      facts:
        - {value: {ar: '5 أعضاء', fr: '5 membres'}, label: {ar: 'على الأقل، عند التأسيس وطول حياة التعاونية', fr: 'au moins, à la création et toute la vie de la coopérative'}, cites: [/ma/loi/112-12/art_14]}
        - {value: {ar: '2 أيام', fr: '2 jours'}, label: {ar: 'باش يصادق مكتب تنمية التعاون على السمية', fr: 'pour que l’Office du développement de la coopération approuve le nom'}, cites: [/ma/loi/112-12/art_7]}
        - {value: {ar: '30%', fr: '30 %'}, label: {ar: 'حد المعاملات مع الأغيار، من بعد عام من التسجيل', fr: 'limite des opérations avec les tiers, un an après l’inscription'}, cites: [/ma/loi/112-12/art_6]}
    - key: supplier
      first: markets
      label: {ar: كنبيع للإدارة (الصفقات), fr: 'Je vends à l’administration (marchés)'}
      law: {ar: 'المرسوم 2.22.431: كل صاحب مشروع كيخصص 30% من صفقاتو للمقاولات الصغيرة والتعاونيات والمقاولين الذاتيين، والضمان المؤقت ما يفوتش 2%.', fr: 'Le décret 2.22.431 : chaque maître d’ouvrage réserve 30 % de ses marchés aux petites entreprises, coopératives et auto-entrepreneurs, et le cautionnement provisoire ne dépasse pas 2 %.'}
      facts:
        - {value: {ar: '30%', fr: '30 %'}, label: {ar: 'من المبلغ المتوقع للصفقات محفوظ للمقاولات الصغرى والتعاونيات والمقاولين الذاتيين', fr: 'du montant prévu des marchés réservé aux TPME, coopératives et auto-entrepreneurs'}, cites: [/ma/decret/2-22-431/art_148]}
        - {value: {ar: '2%', fr: '2 %'}, label: {ar: 'أقصى الضمان المؤقت من الكلفة التقديرية', fr: 'au plus de cautionnement provisoire sur le coût estimé'}, cites: [/ma/decret/2-22-431/art_24]}
        - {value: {ar: '60 يوم', fr: '60 jours'}, label: {ar: 'كيبقى العرض ديالك ملزم من فتح الأظرفة', fr: 'votre offre vous engage dès l’ouverture des plis'}, cites: [/ma/decret/2-22-431/art_36]}
      to: pages/markets

