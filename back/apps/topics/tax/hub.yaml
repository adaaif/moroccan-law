# The tax topic's page (the tax review, T5–T9, T19, T22–T23; 26 Oct 2026): where a Moroccan's money meets the
# tax code. One question first, «منين كيجيك الدخل؟», since the rules hang on where income comes from; then the doors in
# the life of a taxpayer, each led by a fiscal stamp carrying the one figure the law sets for it (a rate, an amount, a
# deadline); the deadlines band; the beliefs the law answers. Written from the DGI's 2026 edition of the CGI
# (/ma/code/cgi, unofficial: the BO prevails), finance laws 60.24 (art. 8) and 50.25 (art. 7) as the BO printed them,
# and law 47.06 on local taxes as the SGG consolidated it (June 2025). Every sentence is a draft until a person checks it.
doors_title: {ar: شنو كيهمك فالضريبة؟, fr: 'Qu’est-ce qui vous concerne ?'}
# T6: a door's `mark` is drawn on a fiscal stamp (`marks: stamp`), the perforated edge everyone knows tax by; a door no
# single figure governs carries its pictogram on the same stamp. The doors stand in the life of a taxpayer (`stages`),
# all in view, no fold (T8).
marks: stamp
stages:
  # The 2027 bill while Parliament debates it (the finance-bill review, P5): one door, first, said as a bill.
  - {key: bill, title: {ar: فالبرلمان دابا, fr: 'Au Parlement en ce moment'}, doors: [bill2027]}
  - {key: income, title: {ar: شنو كيدخل ليك, fr: 'Ce que vous gagnez'}, doors: [salary, children, pension, rent, savings, declare]}
  - {key: own, title: {ar: شنو عندك, fr: 'Ce que vous possédez'}, doors: [housing, land, car]}
  - {key: deal, title: {ar: بعتي، شريتي ولا ورثتي, fr: 'Vendre, acheter, hériter'}, doors: [sell, buy, gift]}
  - {key: work, title: {ar: خدام بحسابك, fr: 'À votre compte'}, doors: [own]}
  - {key: wrong, title: {ar: إلا ما تحلاتش, fr: 'Si ça se passe mal'}, doors: [late, notice]}
  - {key: more, title: {ar: فالخارج ولا عندك شركة, fr: 'À l’étranger ou en société'}, doors: [abroad, company]}
learn: [pages/map, tools/salary, pages/beliefs, journeys/declare, pages/business]

# The deadlines band (T9, C1 «band»): the tax year's dates, the next two for the reader's answer with the days left. In
# the ochre's dark: no one is hurt, but a penalty starts the day after (art. 184, 208; law 47.06 art. 147). A date is the
# day the law says «before» (`before`, month-day: the last day is the one before it) or the month it names (`in`).
urgent:
  title: {ar: الآجال ديالك, fr: 'Vos échéances'}
  lead: {ar: 'من بعد الأجل كتزاد الذعيرة', fr: 'Après l’échéance, la pénalité s’ajoute'}
  to: pages/calendar
  tone: ochre
  dates:
    - key: car
      what: {ar: 'الضريبة الخصوصية على المركبات (الفينييت)', fr: 'La taxe spéciale annuelle sur les véhicules (vignette)'}
      in: '01'
      article: {ar: المادة 261, fr: art. 261}
      cites: [/ma/code/cgi/art_261]
      to: tools/car
    - key: income
      what: {ar: 'التصريح بالدخل الإجمالي (الكراء، أكثر من أجر، معاش…)', fr: 'La déclaration du revenu global (loyers, plusieurs salaires, pension…)'}
      before: '03-01'
      for: [salary, pension, rent, abroad]
      article: {ar: المادة 82, fr: art. 82}
      cites: [/ma/code/cgi/art_82, /ma/code/cgi/art_86]
      to: journeys/declare
    - key: land
      what: {ar: 'الإقرار بالأرض الحضرية غير المبنية وأداء رسمها', fr: 'La déclaration et le paiement de la taxe sur les terrains urbains non bâtis'}
      before: '03-01'
      for: [property]
      article: {ar: 'القانون 47.06، المادتان 46 و47', fr: 'loi 47.06, art. 46 et 47'}
      cites: [/ma/loi/47-06/art_46, /ma/loi/47-06/art_47]
      to: tools/local
    - key: professional
      what: {ar: 'التصريح بالدخل المهني (النتيجة الصافية الحقيقية ولا المبسطة)', fr: 'La déclaration des revenus professionnels (résultat net réel ou simplifié)'}
      before: '05-01'
      for: [self, company]
      article: {ar: المادة 82, fr: art. 82}
      cites: [/ma/code/cgi/art_82]
      to: pages/calendar
    - key: quarter
      what: {ar: 'تصريح المقاول الذاتي ديال الربع وأداؤه', fr: 'La déclaration trimestrielle de l’auto-entrepreneur et son paiement'}
      quarterly: true
      for: [self]
      article: {ar: 'المادة 82 المكررة', fr: 'art. 82 bis'}
      cites: [/ma/code/cgi/art_82-bis]
      to: tools/own
  for: [salary, pension, rent, property, self, abroad, company]

beliefs:
  - claim: {ar: إلا زادت ليا الأجرة نقدر نخسر, fr: 'Une augmentation peut me faire perdre de l’argent'}
    truth: {ar: 'غير الدرهم اللي فوق العتبة كيتخلص بالسعر الأعلى؛ الأجرة الصافية ديما كتزيد (المادة 73).', fr: 'Seul le dirham au-dessus du seuil paie le taux supérieur ; le net augmente toujours (art. 73).'}
    to: pages/beliefs
  - claim: {ar: المعاش ما فيهش الضريبة, fr: 'La pension n’est pas imposée'}
    truth: {ar: 'منذ 2026 معاشات أنظمة التقاعد الأساسي معفية؛ المعاشات التكميلية الأخرى لا (المادة 57).', fr: 'Depuis 2026, les pensions des régimes de base sont exonérées ; les autres régimes complémentaires non (art. 57).'}
    to: pages/beliefs
  - claim: {ar: رسم السكن كيخلصو الكاري, fr: 'La taxe d’habitation est payée par le locataire'}
    truth: {ar: 'كيتفرض باسم المالك ولا صاحب حق الانتفاع (القانون 47.06، المادة 20).', fr: 'Elle est établie au nom du propriétaire ou de l’usufruitier (loi 47.06, art. 20).'}
    to: pages/beliefs
  - claim: {ar: بعت الدار ديالي، ما عليا والو, fr: 'J’ai vendu ma maison, je ne dois rien'}
    truth: {ar: 'السكن الرئيسي معفي إلا سكنتي فيه 5 سنين على الأقل، وفوق 4 ملايين درهم كتبقى 3% على الزائد (المادتان 63 و144).', fr: 'L’habitation principale est exonérée après 5 ans d’occupation ; au-delà de 4 millions de dirhams, 3 % restent dus sur l’excédent (art. 63 et 144).'}
    to: pages/beliefs
  - claim: {ar: الأجير ديما خاصو يصرح, fr: 'Un salarié doit toujours déclarer'}
    truth: {ar: 'اللي عندو غير أجر واحد كيحجزو المشغل ما مطلوبش يصرح، إلا بغا يستافد من خصم ولا شاف راسو خلص بزاف (المادة 86).', fr: 'Un seul salaire retenu à la source dispense de déclarer, sauf pour une déduction ou si l’on s’estime surtaxé (art. 86).'}
    to: pages/beliefs

# The order a reviewer opens the topic in (T23): the salary and the year's changes, the home's local taxes, rent and
# property, then the rest.
waves:
  # P23: the bill's salary tool and the claims first, each claim read by two people.
  1: [tools/bill, pages/bill-claims, pages/bill-2027, reform/lf-2027, reform/announced-pensions, reform/announced-electricity,
      reform/announced-support, pages/allowances-2031, pages/fifa-2030]
  2: [tools/salary, reform/lf-2026, reform/lf-2025, pages/beliefs, pages/calendar, journeys/declare]
  3: [tools/local, tools/car, pages/map, journeys/notice, tools/late]
  4: [tools/rent, tools/pension, tools/sell, tools/buy, journeys/sell, journeys/rent-out]
  5: [tools/own, journeys/own, pages/business, pages/abroad, checklists/sell-papers]

# T7: one question, «منين كيجيك الدخل؟»; each answer names its rules and three figures with their articles. A door that
# does not concern the answer fades, with the law's reason (`not`).
profile:
  question: {ar: منين كيجيك الدخل؟, fr: 'D’où viennent vos revenus ?'}
  options:
    - key: salary
      first: salary
      main: true
      label: {ar: أجير, fr: Salarié}
      law: {ar: 'من الأجر الإجمالي كيتنقصو المصاريف المهنية (35%، و25% فوق 78.000 درهم فالعام، 35.000 على الأكثر) والاقتطاعات ديال التقاعد والتغطية الصحية (المادة 59)، ومن بعد كيتطبق الجدول شريحة بشريحة (المادة 73) وكتنقص 600 درهم على كل واحد فتكلفك (المادة 74). المشغل كيحجز الضريبة فالمنبع (المادة 156)؛ إلا عندك غير مشغل واحد ما خاصكش تصرح (المادة 86).', fr: 'Du salaire brut se déduisent les frais professionnels (35 %, 25 % au-delà de 78 000 dirhams par an, 35 000 au plus) et les cotisations de retraite et de santé (art. 59) ; le barème s’applique ensuite tranche par tranche (art. 73), moins 600 dirhams par personne à charge (art. 74). L’employeur retient l’impôt à la source (art. 156) ; avec un seul employeur, aucune déclaration n’est due (art. 86).'}
      facts:
        - {value: {ar: '40.000 درهم', fr: '40 000 DH'}, label: {ar: 'فالعام بلا ضريبة: الشريحة الأولى معفية', fr: 'par an sans impôt : la première tranche est exonérée'}, cites: [/ma/code/cgi/art_73]}
        - {value: '37%', label: {ar: 'على ما فوق 180.000 درهم فالعام، غير على داك الجزء', fr: 'sur la part au-delà de 180 000 DH par an, elle seule'}, cites: [/ma/code/cgi/art_73]}
        - {value: {ar: '600 درهم', fr: '600 DH'}, label: {ar: 'على كل واحد فتكلفك، 3.600 على الأكثر', fr: 'par personne à charge, 3 600 au plus'}, cites: [/ma/code/cgi/art_74]}
      to: tools/salary
    - key: pension
      first: pension
      main: true
      label: {ar: متقاعد, fr: Retraité}
      law: {ar: 'منذ فاتح يناير 2026 معاشات أنظمة التقاعد الأساسي معفية، وكذلك معاشات عقود التقاعد التكميلي الجماعية للقطاع الخاص عند الصندوق المهني المغربي للتقاعد بشروطها (المادة 57-27°). المعاشات التكميلية الأخرى: إسقاط 70% حتى 168.000 درهم فالعام و40% على الزائد (المادة 60)، ومن بعد الجدول.', fr: 'Depuis le 1er janvier 2026, les pensions des régimes de retraite de base sont exonérées, comme celles des contrats de retraite complémentaire de groupe du privé servies par la CIMR, à leurs conditions (art. 57-27°). Les autres pensions complémentaires : abattement de 70 % jusqu’à 168 000 dirhams par an et 40 % au-delà (art. 60), puis le barème.'}
      facts:
        - {value: '0%', label: {ar: 'على معاش نظام التقاعد الأساسي منذ 2026', fr: 'sur la pension d’un régime de base depuis 2026'}, cites: [/ma/code/cgi/art_57]}
        - {value: '70%', label: {ar: 'إسقاط على المعاش التكميلي حتى 168.000 درهم', fr: 'd’abattement sur une pension complémentaire jusqu’à 168 000 DH'}, cites: [/ma/code/cgi/art_60]}
        - {value: '80%', label: {ar: 'تخفيض على ضريبة معاش أجنبي محول بالدرهم', fr: 'de réduction sur l’impôt d’une pension étrangère transférée en dirhams'}, cites: [/ma/code/cgi/art_76]}
      to: tools/pension
    - key: rent
      first: rent
      main: true
      label: {ar: كنكري دار ولا محل, fr: 'Je loue un bien'}
      law: {ar: 'الكراء كيتنقص منو 40% (المادة 64-II) ويتزاد للدخل الإجمالي فالتصريح قبل فاتح مارس (المادة 82). إلا كان المكتري شركة ولا إدارة، كيحجز 10% تحت 120.000 درهم فالعام و15% فوقها (المادتان 73 و160 المكررة)؛ وتقدر تختار السعر الإبرائي 20% على المبلغ الإجمالي (المادة 64-IV).', fr: 'Le loyer est abattu de 40 % (art. 64-II) et ajouté au revenu global déclaré avant le 1er mars (art. 82). Si le locataire est une société ou une administration, il retient 10 % sous 120 000 dirhams par an et 15 % au-delà (art. 73 et 160 bis) ; vous pouvez opter pour le taux libératoire de 20 % sur le montant brut (art. 64-IV).'}
      facts:
        - {value: '40%', label: {ar: 'إسقاط من الكراء الإجمالي', fr: 'd’abattement sur le loyer brut'}, cites: [/ma/code/cgi/art_64]}
        - {value: '20%', label: {ar: 'السعر الإبرائي إلا اخترتيه', fr: 'le taux libératoire, sur option'}, cites: [/ma/code/cgi/art_64, /ma/code/cgi/art_73]}
        - {value: {ar: 'قبل 1 مارس', fr: 'Avant le 1er mars'}, label: {ar: 'التصريح بالدخل ديال العام اللي فات', fr: 'la déclaration des revenus de l’année passée'}, cites: [/ma/code/cgi/art_82]}
      to: tools/rent
    - key: property
      first: sell
      main: true
      label: {ar: بعت ولا شريت عقار, fr: 'J’ai vendu ou acheté un bien'}
      law: {ar: 'البيع: 20% من الربح العقاري، وما تقلش الضريبة على 3% من ثمن البيع (المادتان 73 و144)؛ السكن الرئيسي معفي بعد 5 سنين ديال السكنى (المادة 63)؛ التصريح والأداء داخل 30 يوما من البيع (المادتان 83 و173). الشرا: واجبات التسجيل 4% على المحل المبني و5% على الأرض العارية (المادة 133)، داخل 30 يوما (المادة 128).', fr: 'La vente : 20 % du profit foncier, jamais moins de 3 % du prix (art. 73 et 144) ; l’habitation principale est exonérée après 5 ans d’occupation (art. 63) ; déclaration et paiement dans les 30 jours de la vente (art. 83 et 173). L’achat : droits d’enregistrement de 4 % sur un local construit et 5 % sur un terrain nu (art. 133), dans les 30 jours (art. 128).'}
      facts:
        - {value: '20%', label: {ar: 'من الربح، و3% من الثمن على الأقل', fr: 'du profit, 3 % du prix au moins'}, cites: [/ma/code/cgi/art_73, /ma/code/cgi/art_144]}
        - {value: {ar: '5 سنين', fr: '5 ans'}, label: {ar: 'ديال السكنى كتعفي السكن الرئيسي', fr: 'd’occupation exonèrent l’habitation principale'}, cites: [/ma/code/cgi/art_63]}
        - {value: '4%', label: {ar: 'واجبات التسجيل على مسكن مبني', fr: 'de droits d’enregistrement sur un logement construit'}, cites: [/ma/code/cgi/art_133]}
      to: journeys/sell
    - key: self
      first: own
      label: {ar: خدام بحسابي, fr: 'À mon compte'}
      law: {ar: 'المقاول الذاتي: 0,5% من رقم المعاملات المحصل للتجارة والصناعة والحرف حتى 500.000 درهم فالعام، و1% للخدمات حتى 200.000 (المادتان 42 المكررة مرتين و73-III)؛ ومع زبون واحد فوق 80.000 درهم فالعام، الزبون كيحجز 30% على الزائد (المادة 42 المكررة). المساهمة المهنية الموحدة: 10% على دخل كيتحسب من رقم المعاملات بمعامل المهنة (المادتان 40 و73).', fr: 'L’auto-entrepreneur : 0,5 % du chiffre d’affaires encaissé pour le commerce, l’industrie et l’artisanat jusqu’à 500 000 dirhams par an, 1 % pour les services jusqu’à 200 000 (art. 42 ter et 73-III) ; au-delà de 80 000 dirhams par an chez un même client, celui-ci retient 30 % sur l’excédent (art. 42 bis). La contribution professionnelle unique : 10 % d’un revenu tiré du chiffre d’affaires par le coefficient de la profession (art. 40 et 73).'}
      facts:
        - {value: '0,5%', label: {ar: 'التجارة والصناعة والحرف، حتى 500.000 درهم', fr: 'commerce, industrie, artisanat, jusqu’à 500 000 DH'}, cites: [/ma/code/cgi/art_73, /ma/code/cgi/art_42-ter]}
        - {value: '1%', label: {ar: 'الخدمات، حتى 200.000 درهم', fr: 'services, jusqu’à 200 000 DH'}, cites: [/ma/code/cgi/art_73, /ma/code/cgi/art_42-ter]}
        - {value: {ar: '80.000 درهم', fr: '80 000 DH'}, label: {ar: 'مع زبون واحد: فوقها كيحجز 30%', fr: 'chez un même client : au-delà, il retient 30 %'}, cites: [/ma/code/cgi/art_42-bis]}
      to: journeys/own
    - key: abroad
      first: abroad
      label: {ar: ساكن فالخارج, fr: 'Je vis à l’étranger'}
      law: {ar: 'اللي ما عندوش موطنه الضريبي فالمغرب كيخلص غير على الدخل اللي مصدره المغرب، واللي عندو كيخلص على كلشي (المادة 23)؛ والموطن فالمغرب: السكن الدائم، ولا مركز المصالح الاقتصادية، ولا إقامة كتفوت 183 يوما فـ365 يوما (المادة 23-II). المسكن اللي كيحتفظ بيه المغاربة المقيمين فالخارج كسكن رئيسي كيستافد من إعفاء الربح العقاري (المادة 63).', fr: 'Sans domicile fiscal au Maroc, seuls les revenus de source marocaine sont imposés ; avec, tous le sont (art. 23). Le domicile au Maroc : le foyer permanent, le centre des intérêts économiques, ou plus de 183 jours de séjour sur 365 (art. 23-II). Le logement que les Marocains résidant à l’étranger gardent comme habitation principale bénéficie de l’exonération du profit foncier (art. 63).'}
      facts:
        - {value: {ar: '183 يوما', fr: '183 jours'}, label: {ar: 'فالمغرب فـ365 يوما كتعطيك موطنا ضريبيا', fr: 'au Maroc sur 365 font un domicile fiscal'}, cites: [/ma/code/cgi/art_23]}
        - {value: {ar: 'مصدر مغربي', fr: 'Source marocaine'}, label: {ar: 'هو اللي كيتخلص بلا موطن فالمغرب', fr: 'seule imposée sans domicile au Maroc'}, cites: [/ma/code/cgi/art_23]}
        - {value: '0%', label: {ar: 'على ربح السكن الرئيسي اللي كتحتفظ بيه فالمغرب', fr: 'sur le profit de l’habitation principale gardée au Maroc'}, cites: [/ma/code/cgi/art_63]}
      to: pages/abroad
    - key: company
      first: company
      label: {ar: عندي شركة, fr: 'J’ai une société'}
      law: {ar: 'الضريبة على الشركات 20%، و35% على ربح صافي كيوصل 100 مليون درهم (المادة 19)؛ الضريبة على القيمة المضافة 20% فالأصل (المادة 99)؛ الرسم المهني ورسم الخدمات الجماعية ديال الجماعة (القانون 47.06). صفحة قصيرة كتجمع الأساسي.', fr: 'L’impôt sur les sociétés : 20 %, 35 % sur un bénéfice net de 100 millions de dirhams ou plus (art. 19) ; la TVA : 20 % au taux normal (art. 99) ; la taxe professionnelle et la taxe de services communaux (loi 47.06). Une page courte rassemble l’essentiel.'}
      facts:
        - {value: '20%', label: {ar: 'الضريبة على الشركات فالأصل', fr: 'l’impôt sur les sociétés, en principe'}, cites: [/ma/code/cgi/art_19]}
        - {value: '35%', label: {ar: 'على ربح صافي من 100 مليون درهم فما فوق', fr: 'sur un bénéfice net de 100 millions de DH ou plus'}, cites: [/ma/code/cgi/art_19]}
        - {value: '20%', label: {ar: 'السعر العادي للضريبة على القيمة المضافة', fr: 'le taux normal de la TVA'}, cites: [/ma/code/cgi/art_99]}
      to: pages/business

events:
  - key: bill2027
    mark: {value: '2027', unit: {ar: مشروع, fr: projet}}
    icon: briefcase
    words: [قانون المالية 2027, مشروع قانون المالية, مشروع قانون المالية 2027, PLF 2027, loi de finances 2027, projet de loi de finances, الضريبة على الدخل 2027, barème IR 2027, IR 2027, شحال غادي نربح, الإعفاء ديال 10.000 درهم, 10.000 درهم معفية, الأجور تحت 10000, الجدول الجديد, الإصلاح الضريبي 2027, réforme IR 2027, التعديل الضريبي, la9anoun lmalia 2027, 10.000 درهم, 10000 درهم, تحت 10000, تحت 10.000, impôt 2027, revenu 2027, finances 2027, الرسم المهني 2027, نتسجل فالرسم المهني, عقد عرفي قديم, عقد قديم ما تسجلش, تسجيل عقد قديم]
