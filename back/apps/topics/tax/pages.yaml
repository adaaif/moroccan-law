- key: allowances-2031
  bill: /ma/projet-loi/60-26
  reform: lf-2027
  for: [salary]
  title: {ar: 'التعويضات ديال الأجر فـ2031', fr: 'Les indemnités du salaire en 2031'}
  lead:
    ar: 'المشروع كيبدل المادة 57-1° من 2031: قبل ما يفاجئك، هاد الصفحة كتقول شنو كيبقى معفي وشنو كيولي أجر.'
    fr: 'Le projet change l’article 57-1° dès 2031 : avant que cela vous surprenne, ce qui reste exonéré et ce qui devient du salaire.'
  sections:
    - title: {ar: 'اليوم وحتى آخر 2030', fr: 'Aujourd’hui et jusqu’à fin 2030'}
      facts:
        - text: {ar: 'التعويضات الخاصة اللي كيعطيها المشغل باش يرجع مصاريف تحملتيها فالخدمة معفية، كيفما كانت: بالأوراق ولا جزافية. والمادة 57-1° اللي كاينة نهار 31 دجنبر 2026 كتبقى كتطبق على الدخول حتى 31 دجنبر 2030.', fr: 'Les indemnités spéciales que l’employeur verse pour rembourser des frais engagés dans le service sont exonérées, sur états ou forfaitaires. L’article 57-1° en vigueur au 31 décembre 2026 reste applicable aux revenus acquis jusqu’au 31 décembre 2030.'}
          cites: [/ma/code/cgi/art_57, /ma/projet-loi/60-26/art_7]
    - title: {ar: 'من فاتح يناير 2031، حسب المشروع', fr: 'Dès le 1er janvier 2031, selon le projet'}
      facts:
        - text: {ar: 'كتبقى معفية غير التعويضات اللي كترجع مصاريف حقيقية ومبررة، تحملتيها غير لمصلحة المشغل. التعويضات اللي كتخلص كل شهر على الخدمة العادية (النقل، التمثيل، القفة…) كتولي تكملة للأجر وكتخلص عليها الضريبة.', fr: 'Ne restent exonérées que les indemnités qui remboursent des frais réels et justifiés, engagés dans le seul intérêt de l’employeur. Celles versées chaque mois pour l’exercice normal de l’emploi (transport, représentation, panier…) deviennent un complément de salaire imposable.'}
          cites: [/ma/code/cgi/art_57, /ma/code/cgi/art_56]
        - text: {ar: 'والمصاريف المهنية 45% ما كتجتمعش مع التعويضات المعفية على نفس المصاريف.', fr: 'Et les frais professionnels de 45 % ne se cumulent pas avec les indemnités exonérées pour les mêmes frais.'}
          cites: [/ma/code/cgi/art_57, /ma/code/cgi/art_59]
    - title: {ar: 'شنو تدير من دابا', fr: 'Ce que vous pouvez faire dès maintenant'}
      facts:
        - text: {ar: 'شوف فورقة الأجر شنو من سطر «تعويض» كيتخلص كل شهر بنفس المبلغ، وشنو كيرجع مصاريف بالأوراق. الأول هو اللي غادي يتبدل.', fr: 'Regardez sur votre bulletin quelles lignes « indemnité » reviennent chaque mois au même montant, et lesquelles remboursent des frais sur justificatifs. Ce sont les premières qui changeraient.'}
          cites: [/ma/code/cgi/art_57]
      tool: tools/salary

- key: fifa-2030
  bill: /ma/projet-loi/60-26
  reform: lf-2027
  title: {ar: 'كأس العالم 2030 والضريبة', fr: 'La Coupe du monde 2030 et l’impôt'}
  lead:
    ar: 'شكون معفي من شنو، وحتى لامتى، حسب المشروع: المادتين 247 المكررة ثلاث مرات و247 المكررة أربع مرات الجداد فالمدونة، والمادة 6 من المشروع للجمارك.'
    fr: 'Qui est exonéré de quoi, et jusqu’à quand, selon le projet : les nouveaux articles 247 quater et 247 quinquies du code, et l’article 6 du projet pour la douane.'
  sections:
    - title: {ar: 'الفيفا والجهات ديالها', fr: 'La FIFA et ses entités'}
      facts:
        - text: {ar: 'الفيفا والجهات التابعة ليها، والمستضيفين والمتعاقدين معاها، معفيين من الضريبة على الشركات، والاقتطاع من المنبع، والقيمة المضافة، وواجبات التسجيل والتمبر، على العمليات ديال كأس العالم 2030، من 2027 حتى 2031.', fr: 'La FIFA, ses entités, les hôtes et ses contractants sont exonérés de l’IS, des retenues à la source, de la TVA, des droits d’enregistrement et de timbre pour leurs opérations de la Coupe du monde 2030, de 2027 à 2031.'}
          cites: [/ma/projet-loi/60-26/art_7]
        - text: {ar: 'الجمارك: السلع والمعدات اللي كتدخل باسم الفيفا ولا لحسابها معفية من 1 يناير 2027 حتى 31 دجنبر 2032.', fr: 'La douane : les biens et matériels importés par la FIFA ou pour son compte sont exonérés du 1er janvier 2027 au 31 décembre 2032.'}
          cites: [/ma/projet-loi/60-26/art_6]
    - title: {ar: 'اللاعبين والحكام والمتطوعين', fr: 'Joueurs, arbitres, bénévoles'}
      facts:
        - text: {ar: 'اللاعبين وحكام الماتشات والمتطوعين معفيين من الضريبة على الدخل على اللي كيتخلصو عليه فكأس العالم.', fr: 'Les joueurs, les officiels de match et les bénévoles sont exonérés de l’impôt sur le revenu sur ce qu’ils perçoivent pour la Coupe du monde.'}
          cites: [/ma/projet-loi/60-26/art_7]
    - title: {ar: 'صندوق الإرث', fr: 'Le Fonds d’Héritage'}
      facts:
        - text: {ar: 'صندوق الإرث (Fonds d’Héritage) معفي من الضريبة على الشركات على جميع أنشطته، ومن الضريبة الخصوصية على المركبات ديالو، ومن الرسم على عقود التأمين ديالو.', fr: 'Le Fonds d’Héritage est exonéré de l’IS sur l’ensemble de ses activités, de la taxe spéciale sur ses véhicules et de la taxe sur ses contrats d’assurance.'}
          cites: [/ma/code/cgi/art_6, /ma/code/cgi/art_260, /ma/code/cgi/art_282]

# «شنو كيقولو» (the bill-story review, Y8–Y12, 26 Oct 2026: sourced beyond the text itself, with links to the
# media and the press). Who said what about the bill outside its text: Parliament,
# unions, experts, the press. Each item: the outlet, the date, the headline as printed (`title`, in its language), what
# it says in one attributed sentence of ours (`said`: never the article's body; C3), a proposal said as one, and the
# private copy kept with its hash (C4: `file`, `sha256`). What a named person said is in `quotes`, each `says` one
# sentence of ours in reported speech («كيقول بلي …», «estime que …»), drawn after their name: never their words.
# Never a source for the law or its figures: those come from the bill and the code (docs/rules.md, «What people say
# is linked, never the law»).
