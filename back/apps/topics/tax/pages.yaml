      quotes:
        - who: {ar: 'فوزي لقجع، وزير الاقتصاد والمالية والنجاعة العمومية، كما لخص جوابو بلاغ المجلس', fr: 'Fouzi Lekjaa, ministre de l’Économie, des Finances et de la Performance publique, selon le communiqué de la Chambre'}
          says: {ar: 'كيقول بلي فرضيات النمو مبنية على معدل «واقعي وحذر»، وبلي الرفع التدريجي ديال الضريبة على الشركات اللي كتربح فوق 100 مليون درهم جا باسم المنافسة والشفافية، وبلي الحكومة كتوجد إجراءات لدعم الأسر اللي كتستهلك أقل من 100 درهم ديال الضو فالشهر.', fr: 'affirme que les hypothèses de croissance sont réalistes et prudentes, que la hausse progressive de l’IS des sociétés aux bénéfices de plus de 100 millions de DH répond à la concurrence et à la transparence, et que des mesures se préparent pour les ménages qui consomment moins de 100 DH d’électricité par mois.'}
