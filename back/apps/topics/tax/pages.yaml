      quotes:
        - who: {ar: 'فوزي لقجع، وزير الاقتصاد والمالية والنجاعة العمومية، فجوابو فلجنة المالية', fr: 'Fouzi Lekjaa, ministre de l’Économie, des Finances et de la Performance publique, en réponse à la commission'}
          says: {ar: 'كيقول بلي نسبة الأجراء المعفيين من الضريبة على الدخل كتطلع من 80% لـ87%، وبلي أجر خام ديال 10.506 درهم كيخلص 250 درهم فالشهر، وبالخصوم العائلية كيوصل الصافي لـ10.000، وبلي المعاش الأدنى كيولي 1.700 درهم فـ2027 ثم 2.000 فـ2028 و2.500 فـ2029 و3.000 فـ2030.', fr: 'indique que la part des salariés exonérés d’IR passe de 80 % à 87 %, qu’un brut de 10 506 DH paie 250 DH par mois et qu’avec les charges de famille le net atteint 10 000, et que la pension minimale passe à 1 700 DH en 2027, puis 2 000 en 2028, 2 500 en 2029 et 3 000 en 2030.'}
      file: sources/press/plf2027/medias24-1031-lekjaa.html
      sha256: f0101a223a1a33349bc6473ed9b12f701af3e752d969672c7e30c64b59ed8e73
