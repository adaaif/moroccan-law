      quotes:
        - who: {ar: 'ياسين عكاشا، رئيس الفريق النيابي للتجمع الوطني للأحرار، من المعارضة', fr: 'Le président du groupe RNI à la Chambre des représentants, dans l’opposition'}
          says: {ar: 'كيقول بلي فريقو كيعارض المشروع لعشرة ديال الأسباب، منها وعود انتخابية ما تترجماتش لاعتمادات وإصلاحات اجتماعية وضريبية مأجلة لآخر الولاية، وبلي مراجعة الضريبة على الدخل، حسب الأرقام اللي قدم، ما كيستافد منها غير 5,5 مليون مغربي، وبلي 6 مليار درهم مقسومة على 8 مليون شاب كتجي 750 درهم فالعام لكل واحد.', fr: 'explique que son groupe s’oppose au projet pour dix raisons, dont des promesses électorales non traduites en crédits et des réformes sociales et fiscales renvoyées à la fin de la législature ; selon les chiffres qu’il avance, la révision de l’IR ne profite qu’à 5,5 millions de Marocains, et 6 milliards de DH répartis sur 8 millions de jeunes font 750 DH par an chacun.'}
