      title: 'Pouvoir d’achat : ce que le PLF 2027 prévoit pour la classe moyenne'
      url: 'https://leseco.ma/maroc/pouvoir-dachat-ce-que-le-plf-2027-prevoit-pour-la-classe-moyenne.html'
      said: {ar: 'الإجراءات ما كتمسش نفس الناس: الضريبة على الدخل كتنفع الأجير اللي كيخلصها، الدعم كيمنع الأثمنة تطلع بلا ما ينقص الفاتورة، ومساعدة السكن ما كتنفعش اللي كيكري؛ إذن ما كاينش ربح متوسط واحد للطبقة الوسطى.', fr: 'Les mesures ne touchent pas les mêmes ménages : la baisse de l’IR profite au salarié imposable, la compensation évite des hausses sans baisser les factures, l’aide au logement ne soulage pas les locataires ; pas de gain moyen pour la classe moyenne.'}
      file: sources/press/plf2027/leseco-1028.html
      sha256: 9a56ef16c2e0b193ba88f4ca0f11733c34781057d9afb66f142b74793e367137
