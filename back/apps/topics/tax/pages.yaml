      said: {ar: 'نواب ثمنو التدابير الاجتماعية والضريبية ورفع الاستثمار العمومي لـ400 مليار درهم، ونواب آخرين شافو فالمشروع استمرارية للحكومة السابقة وطالبو بمراجعة مرسوم الصفقات العمومية وبتوزيع عادل للمشاريع على الجهات.', fr: 'Des députés saluent les mesures sociales et fiscales et l’investissement public porté à 400 milliards de DH ; d’autres y voient la continuité du gouvernement précédent et demandent de revoir le décret sur les marchés publics et de mieux répartir les projets entre les régions.'}
