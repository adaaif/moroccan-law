      date: '2026-11-13'
      lang: ar
      title: 'أقصبي ينتقد إعفاءات "الفيفا" الضريبية في مشروع قانون مالية 2027'
      url: 'https://saispress.com/news/1978/%D8%A3%D9%82%D8%B5%D8%A8%D9%8A-%D9%8A%D9%86%D8%AA%D9%82%D8%AF-%D8%A5%D8%B9%D9%81%D8%A7%D8%A1%D8%A7%D8%AA-%D8%A7%D9%84%D9%81%D9%8A%D9%81%D8%A7-%D8%A7%D9%84%D8%B6%D8%B1%D9%8A%D8%A8%D9%8A%D8%A9-%D9%81%D9%8A-%D9%85%D8%B4%D8%B1%D9%88%D8%B9-%D9%82%D8%A7%D9%86%D9%88%D9%86-%D9%85%D8%A7%D9%84%D9%8A%D8%A9-1978'
      quotes:
        - who: {ar: 'نجيب أقصبي، اقتصادي', fr: 'Najib Akesbi, économiste'}
          says: {ar: 'كيسمي الإعفاءات ديال الفيفا وشركائها جنة ضريبية، وكيقول بلي التدابير اللي كتتخلى فيها الدولة على مداخيلها وصلات 283، وبلي رفع الضريبة على شركات المحروقات لـ40% فيه نزعة ديال الانتقام، وبلي العجز الحقيقي ديال الميزانية، حسب الحساب ديالو، 159 مليار درهم.', fr: 'qualifie de « paradis fiscal » les exonérations accordées à la FIFA et à ses partenaires ; selon lui, les mesures par lesquelles l’État renonce à des recettes sont au nombre de 283, la hausse à 40 % de l’IS des distributeurs de carburants relève d’un esprit de revanche, et le déficit réel du budget atteint 159 milliards de DH selon son calcul.'}
      file: sources/press/plf2027/saispress-1113-akesbi.html
      sha256: 1589521b34e0c25bafead4788d88542e102163ff0fc26787b0ad60317a903812
    - key: leseco-1113-douanes
      type: press
      outlet: {ar: 'ليزيكو', fr: 'LesEco'}
      date: '2026-11-13'
      lang: fr
      title: 'Douanes, viandes, médicaments… Les arbitrages du PLF 2027 se précisent'
      url: 'https://leseco.ma/business/douanes-viandes-medicaments-les-arbitrages-du-plf-2027-se-precisent.html'
      said: {ar: 'حسب الجريدة، اللجنة لغات المادة 68 على المعشّرين ولقجع وعد بقانون خاص بالمهنة، ووافق على مبدأ رسوم جمركية متدرجة على الدوا اللي كيتصنع فالمغرب ولكن طلب اللائحة، حيت الرسوم دابا بين 10% و17,5% حسب الأصناف، وعرض يقدم كل ثلاث شهور تقييم على استيراد اللحوم.', fr: 'Selon le journal, la commission a abrogé l’article 68 sur les transitaires en douane et Fouzi Lekjaa promet une loi dédiée ; il accepte le principe de droits de douane progressifs sur les médicaments produits au Maroc mais demande la liste des produits, les droits actuels allant de 10 % à 17,5 % selon les catégories, et propose une évaluation trimestrielle des importations de viandes.'}
      file: sources/press/plf2027/leseco-1113-douanes.html
      sha256: 5e50844e32d96989d63106af9d7fb678c4bb5b249cb629b883f45fc6f30a5fd1
    - key: hespress-1113-opposition
      type: parliament
      outlet: {ar: 'هسبريس', fr: 'Hespress'}
      date: '2026-11-13'
      lang: ar
      title: 'المعارضة: الحكومة تنتقل من الوعود بالجملة إلى "التنزيل بالتقسيط"'
      url: 'https://www.hespress.com/%d8%a7%d9%84%d9%85%d8%b9%d8%a7%d8%b1%d8%b6%d8%a9-%d8%a7%d9%84%d8%ad%d9%83%d9%88%d9%85%d8%a9-%d8%aa%d9%86%d8%aa%d9%82%d9%84-%d9%85%d9%86-%d8%a7%d9%84%d9%88%d8%b9%d9%88%d8%af-%d8%a8%d8%a7%d9%84%d8%ac-1839312.html'
      quotes:
        - who: {ar: 'إدريس الأزمي الإدريسي، رئيس فريق العدالة والتنمية بمجلس النواب', fr: 'Driss El Azami El Idrissi, président du groupe PJD à la Chambre des représentants'}
          says: {ar: 'كيشوف فالمشروع استمرارية ماشي تغيير ديال المسار، وكيقول بلي الربح من الضريبة على الدخل، فحدود 500 درهم، غادي تاكلو الأسعار، وبلي الحكومة رحّلات رفع المعاش الأدنى لـ3.000 درهم وإصلاح الضريبة على الدخل حتى 2031.', fr: 'voit dans le projet la continuité plutôt qu’un changement de cap ; selon lui, le gain d’IR, de l’ordre de 500 DH, sera vite absorbé par les prix, et le gouvernement renvoie à 2031 la pension minimale de 3 000 DH comme la réforme de l’IR.'}
        - who: {ar: 'ريم شباط، رئيسة الفريق الحركي', fr: 'Rim Chabat, présidente du groupe Haraki'}
          says: {ar: 'كتوصف الميزانية بأنها محاسباتية كتعتمد بالأساس على الضرائب، وكتقول بلي من حوالي 272 مؤسسة ومقاولة عمومية غير 5 اللي كيساهمو فالمالية العمومية، وكتحذر من ثقل الدين مع حوالي 120 مليار درهم ديال القروض المتوسطة والطويلة الأمد.', fr: 'qualifie le budget de purement comptable, reposant surtout sur l’impôt ; selon elle, sur quelque 272 établissements et entreprises publics, 5 seulement contribuent aux finances publiques, et elle met en garde contre le poids de la dette, avec près de 120 milliards de DH d’emprunts à moyen et long terme.'}
      file: sources/press/plf2027/hespress-1113-opposition.html
      sha256: 5f6e94ae18b84aaedd8df927793b7bf7cb28b012c23eb415f54114994cc05e3b
    - key: hespress-1114-livestock
      type: parliament
      outlet: {ar: 'هسبريس', fr: 'Hespress'}
      date: '2026-11-14'
      lang: ar
      title: 'إعفاء استيراد المواشي يعيد جدل "الفراقشية" ومستقبل القطيع الوطني'
      url: 'https://www.hespress.com/%d8%a5%d8%b9%d9%81%d8%a7%d8%a1-%d8%a7%d8%b3%d8%aa%d9%8a%d8%b1%d8%a7%d8%af-%d8%a7%d9%84%d9%85%d9%88%d8%a7%d8%b4%d9%8a-%d9%8a%d8%b9%d9%8a%d8%af-%d8%ac%d8%af%d9%84-%d8%a7%d9%84%d9%81%d8%b1%d8%a7%d9%82-1839659.html'
      quotes:
        - who: {ar: 'إدريس الأزمي الإدريسي، رئيس فريق العدالة والتنمية', fr: 'Driss El Azami El Idrissi, président du groupe PJD'}
          says: {ar: 'كيدافع فالجلسة العامة على تعديل كيحيد الإعفاء الدائم من رسوم استيراد البقر والغنم واللحوم، حيت حسب رأيو ما نزّلش أثمنة اللحم وغادي يقضي على القطيع الوطني؛ والتعديل طاح، حسب الجريدة، بـ77 صوت معاه و171 ضدو و40 امتنعو.', fr: 'défend en plénière un amendement supprimant l’exonération permanente des droits d’importation sur les bovins, ovins et viandes, qui selon lui n’a pas fait baisser les prix et menace d’en finir avec le cheptel national ; l’amendement est rejeté par 171 voix contre 77, avec 40 abstentions, selon le journal.'}
          proposal: true
        - who: {ar: 'هشام المهاجري، فريق الأصالة والمعاصرة ورئيس لجنة المالية', fr: 'Hicham Mhajri, groupe PAM, président de la commission des finances'}
          says: {ar: 'كيقول بلي الاستيراد بكميات محدودة فالسنين اللي فاتت هو اللي فتح الباب للبونات والمزايدات اللي تسماو «الفراقشية»، وبلي الإعفاء طول العام غادي يخلق منافسة بين المستوردين تبان فثمن اللحم.', fr: 'estime que les importations par quantités limitées des années passées ont ouvert la voie aux bons d’importation et à la spéculation, et que l’exonération toute l’année créera entre importateurs une concurrence qui se verra dans le prix de la viande.'}
      file: sources/press/plf2027/hespress-1114-livestock.html
      sha256: 6f0317409697011b500b5c7a675c6e3f873d9389199ad8d32648589a8f59a2f2
    - key: le360-1114-pjd
      type: parliament
      outlet: {ar: 'لو360', fr: 'Le360'}
      date: '2026-11-14'
      lang: fr
      title: 'PLF 2027: le PJD explique pourquoi il a voté contre la surtaxe de 40% sur les sociétés pétrolières'
      url: 'https://fr.le360.ma/politique/plf-2027-le-pjd-explique-pourquoi-il-a-vote-contre-la-surtaxe-de-40-sur-les-societes-petrolieres_GFODRTQAURE3HEBJ4Y7KL7IQNQ/'
      quotes:
        - who: {ar: 'إدريس الأزمي الإدريسي، رئيس فريق العدالة والتنمية، فبلاغ ديال الفريق', fr: 'Driss El Azami El Idrissi, président du groupe PJD, dans un communiqué'}
          says: {ar: 'كيقول بلي الفريق صوت ضد المادة كما جابتها الحكومة، ماشي ضد رفع الضريبة على شركات المحروقات، حيت التعديل ديالو رقم 21 كان باغي يطبق نفس الـ40% على الشركات الكبرى ديال الاتصالات والإسمنت، وبلي خلاه باش يدافع عليه فالجلسة العامة.', fr: 'affirme que le groupe a voté contre l’article dans la rédaction du gouvernement, et non contre la hausse de l’impôt des sociétés pétrolières, parce que son amendement n° 21 voulait appliquer le même taux de 40 % aux grandes sociétés des télécoms et du ciment, amendement qu’il maintient pour la plénière.'}
          proposal: true
      file: sources/press/plf2027/le360-1114-pjd.html
      sha256: 81f3b667386424d1429f44c2ae4471c4f26cea5398b1917eeb0ca62c52863357
    - key: alakhbar-1114-commission
      type: press
      outlet: {ar: 'الأخبار', fr: 'Al Akhbar'}
      date: '2026-11-14'
      lang: ar
      title: 'النواب يصادقون على الجزء الأول من مشروع قانون المالية'
      url: 'https://www.alakhbar.press.ma/%D8%A7%D9%84%D9%86%D9%88%D8%A7%D8%A8-%D9%8A%D8%B5%D8%A7%D8%AF%D9%82%D9%88%D9%86-%D8%B9%D9%84%D9%89-%D8%A7%D9%84%D8%AC%D8%B2%D8%A1-%D8%A7%D9%84%D8%A3%D9%88%D9%84-%D9%85%D9%86-%D9%85%D8%B4%D8%B1%D9%88-303874.html'
      said: {ar: 'الجريدة كتحكي الليلة ديال لجنة المالية، حوالي 18 ساعة حتى الربعة ديال الصباح: لقجع رفض تعديل العدالة والتنمية اللي كان باغي يخصم مصاريف المدرسة الخاصة من الدخل الخاضع للضريبة (حتى 6.000 درهم على كل ولد)، وعاتب نوابها بلي هاد الخصم كينفع غير اللي كيخلصو الضريبة على الدخل وكيشجع الخاص على حساب العمومي، وشرح بلي الـ40% غادي تمس 11 شركة ديال المحروقات.', fr: 'Le journal raconte la nuit de la commission des finances, environ 18 heures jusqu’à 4 heures du matin : Fouzi Lekjaa a refusé l’amendement du PJD qui voulait déduire du revenu imposable les frais de l’école privée (jusqu’à 6 000 DH par enfant), en reprochant au groupe une mesure qui ne profite qu’aux contribuables imposables et favorise le privé au détriment du public, et a expliqué que l’IS à 40 % toucherait 11 sociétés de carburants.'}
      file: sources/press/plf2027/alakhbar-1114-commission.html
      sha256: d4d181b9951f70643cd0f81b8aa5139dbbf577613051f33283f61625a69703c0
    - key: le360-1114-lekjaa
      type: government
      outlet: {ar: 'لو360', fr: 'Le360'}
      date: '2026-11-14'
      lang: fr
      title: 'Carburants: Fouzi Lekjaa justifie la surtaxe des pétroliers et laisse ouverte la piste d’un plafonnement des marges'
      url: 'https://fr.le360.ma/economie/carburants-fouzi-lekjaa-justifie-la-surtaxe-des-petroliers-et-laisse-ouverte-la-piste-dun_4B4T6YY3SRFCHFSTGUIOIR3FUM/'
      quotes:
        - who: {ar: 'فوزي لقجع، وزير الاقتصاد والمالية والنجاعة العمومية، فالجلسة العامة', fr: 'Fouzi Lekjaa, ministre de l’Économie, des Finances et de la Performance publique, en séance plénière'}
          says: {ar: 'كيقول بلي الضريبة على الشركات بـ40% كتمس 11 شركة ديال المحروقات اللي كتربح فوق 100 مليون درهم، وبلي الاتصالات بقات برا حيت عندها مساهمات خاصة والإسمنت حيت باقي كيرجع من الركود، وبلي ما كايناش علاقة بين الضريبة وثمن البيع فالمحطة؛ أما تسقيف هوامش الربح فالحكومة تقدر تدرسو كموضوع بوحدو.', fr: 'affirme que l’IS à 40 % vise onze sociétés pétrolières qui gagnent plus de 100 millions de DH, que les télécoms restent à part parce qu’ils paient déjà des contributions spécifiques et les cimentiers parce qu’ils sortent à peine d’un long ralentissement, et qu’il n’y a pas de lien entre l’impôt et le prix à la pompe ; un plafonnement des marges peut en revanche être étudié, comme une question distincte.'}
      file: sources/press/plf2027/le360-1114-lekjaa.html
      sha256: f3679087591fc0638d3c5c26ed589006a6af3599deef590f5bf781bb610d6c9c
    - key: akhbarona-1115-lekjaa
      type: government
      outlet: {ar: 'أخبارنا', fr: 'Akhbarona'}
      date: '2026-11-15'
      lang: ar
      title: 'ضريبة الثروة تثير السجال في البرلمان.. لقجع: خاصنا نعرفو شنو هو الغنى أولا'
      url: 'https://www.akhbarona.com/national/435792.html'
      quotes:
        - who: {ar: 'فوزي لقجع، وزير الاقتصاد والمالية والنجاعة العمومية، فجوابو على النواب', fr: 'Fouzi Lekjaa, ministre de l’Économie, des Finances et de la Performance publique, en réponse aux députés'}
          says: {ar: 'كيقول بلي المطالبة برفع الضريبة على الشركات لـ70% باسم العدالة الاجتماعية ساهلة ولكن كتنسى المنافسة بين الدول على المستثمرين، وبلي خاص المعارضة تعرّف أولا شنو هو الغنى وشنو هي الثروة قبل ما تقترح ضريبة عليها.', fr: 'juge facile de réclamer un impôt sur les sociétés à 70 % au nom de la justice sociale, mais estime que cela ignore la concurrence entre pays pour attirer les investisseurs, et demande à l’opposition de définir d’abord la richesse avant de proposer de la taxer.'}
      file: sources/press/plf2027/akhbarona-1115-lekjaa.html
      sha256: 96604b7942983b688f8133ca4864a90cdf72b32b5a377cb4fc8c1d03b6d0a378
    - key: medias24-1115-vote
      type: press
      outlet: {ar: 'ميدياس24', fr: 'Médias24'}
      date: '2026-11-15'
      lang: fr
      title: 'Le PLF 2027 adopté en première lecture à la Chambre des représentants'
      url: 'https://medias24.com/2026/11/15/le-plf-2027-adopte-en-premiere-lecture-a-la-chambre-des-representants-1791295/'
      said: {ar: 'الجريدة كتحكي كيفاش داز التصويت: الجزء الأول نهار السبت فالصباح من بعد جواب الحكومة، ومن الجوج ديال العشية الجزء الثاني والمشروع كامل، والجلسة سالات فالحداش ديال الليل؛ ودابا، حسب الجريدة، عند مجلس المستشارين 22 يوم على الأكثر، ومن بعد 6 أيام لمجلس النواب فالقراءة الثانية.', fr: 'Le journal retrace le vote : la première partie samedi matin après la réponse du gouvernement, la deuxième partie et l’ensemble à partir de 14 heures, jusqu’à 23 heures ; selon lui, la Chambre des conseillers dispose désormais de 22 jours au plus, puis la Chambre des représentants de 6 jours pour la deuxième lecture.'}
      file: sources/press/plf2027/medias24-1115-vote.html
      sha256: 33cd2ffa20a17487522486cf554cdafc4615aef6ca0144dc937a703a464c9706
