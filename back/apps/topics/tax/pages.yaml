      facts:
        - text: {ar: 'حسب الخطاب نفسه، 600 درهم فـ2027 (زيادة 100)، و1.000 فآخر الولاية؛ معلن، ماشي فمواد المشروع. المبلغ اليوم كيحددو المرسوم 2.23.1067.', fr: 'Selon le discours lui-même, 600 DH en 2027 (100 de plus) et 1 000 à la fin du mandat ; annoncé, pas dans les articles du projet. Le montant d’aujourd’hui est fixé par le décret 2.23.1067.'}
