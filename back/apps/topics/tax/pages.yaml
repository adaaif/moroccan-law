          says: {ar: 'كتقول بلي الاعتمادات ديال دعم المواد الأساسية كتنقص من 22 لـ19,4 مليار درهم، حسب الأرقام اللي قدمات فاللجنة، وكتتسائل واش الإصلاح المتدرج للضريبة على الدخل يقدر يجاوب دابا على هموم الطبقة الوسطى.', fr: 'relève que les crédits de soutien aux produits de première nécessité reculent de 22 à 19,4 milliards de DH, selon les chiffres qu’elle a avancés en commission, et demande si la réforme graduelle de l’IR peut répondre tout de suite aux préoccupations des classes moyennes.'}
        - who: {ar: 'رحال المكاوي، رئيس الفريق الاستقلالي', fr: 'Rahhal El Makkaoui, président du groupe istiqlalien'}
