- key: bill-amendments
  bill: /ma/projet-loi/60-26
  # The Chamber-vote update (15 Nov 2026): what the Finance committee of the Chamber of Representatives changed in bill
  # 60.26 on 11–12 Nov 2026, amendment by amendment, and what it did not take, read from the committee's report (second
  # part). `amended` / `refused` give who filed it, the vote [for, against, abstain] and the page in the report;
  # `filed` is the bill's own figure where it had one. The text as the Chamber adopted it is not published yet.
  layout: changes
  reform: lf-2027
  chamber: amendments
  report: *committee_report
  title: {ar: 'شنو بدلو النواب فمشروع قانون المالية 2027', fr: 'Ce que les députés ont changé au projet de loi de finances 2027'}
  lead:
    ar: 'كل تعديل قبلاتو لجنة المالية بمجلس النواب نهار 11 و12 نونبر 2026: شكون قدمو، كيفاش تصوت عليه، والصفحة ديالو فتقرير اللجنة؛ ومن بعد شنو ما قبلاتش. النص كما صادق عليه المجلس ما تنشرش بعد، فهاد الصفحة كتقرا تقرير اللجنة.'
    fr: 'Chaque amendement retenu par la commission des finances de la Chambre des représentants les 11 et 12 novembre 2026 : qui l’a déposé, son vote, sa page dans le rapport ; puis ce qu’elle n’a pas retenu. Le texte adopté par la Chambre n’est pas encore publié : cette page lit le rapport de la commission.'
  sections:
    - key: people
      for: [salary, pension, rent, property]
      chip: {ar: 'أجير، متقاعد ولا مالك', fr: 'Salarié, retraité ou propriétaire'}
      title: {ar: 'إلا كنتي أجير ولا متقاعد ولا عندك عقار', fr: 'Si vous êtes salarié ou retraité, ou si vous avez un bien'}
      line: {ar: 'تعويض الستاج معفي حتى 8.000، الكراء من شركة بلا اقتطاع حتى 60.000، والبيع الصغير معفي حتى 200.000', fr: 'L’indemnité de stage exonérée jusqu’à 8 000, le loyer payé par une société sans retenue jusqu’à 60 000, la petite vente exonérée jusqu’à 200 000'}
      rows:
        - headline: {ar: 'تعويض التدريب (الستاج) فشركة خاصة', fr: 'L’indemnité de stage dans une entreprise privée'}
          plain: {ar: 'التعويض الشهري اللي كتعطيه شركة خاصة لمتدرب ما كتخلصش عليه الضريبة حتى لسقف معين.', fr: 'L’indemnité mensuelle qu’une entreprise privée verse à un stagiaire ne paie pas d’impôt jusqu’à un plafond.'}
          then: '8.000'
          now: '6.000'
          unit: {ar: 'درهم فالشهر', fr: 'DH par mois'}
          from: '2027-01-01'
          when: {ar: 'العقود من فاتح يناير 2027', fr: 'contrats conclus dès le 1er janvier 2027'}
          amended: {by: committee, vote: unanimous, page: 743}
          detail: {ar: 'ما كانش فالمشروع كما أودع. فريق العدالة والتنمية طلب 10.000 درهم؛ اللجنة كتبات 8.000 بصيغتها. الشروط الأخرى ديال الإعفاء ما تبدلوش.', fr: 'Absent du projet déposé. Le groupe Justice et développement demandait 10 000 DH ; la commission a écrit 8 000 dans sa rédaction. Les autres conditions de l’exonération ne changent pas.'}
          cites: [/ma/code/cgi/art_57]
        - headline: {ar: 'إلا طلبات منك الإدارة ترجع أجر ولا معاش تخلص ليك بالغلط', fr: 'Si l’administration vous réclame un salaire ou une pension versés par erreur'}
          plain: {ar: 'كيهم الموظفين والمتقاعدين ديال الدولة والجماعات والمؤسسات العمومية: المبلغ اللي تخلص بلا حق كيترجع بأمر بالمداخيل.', fr: 'Pour les agents et retraités de l’État, des collectivités et des établissements publics : la somme versée à tort se rembourse sur ordre de recette.'}
          then: {ar: 'بلا زيادة', fr: 'sans majoration'}
          now: {ar: '6% فالعام', fr: '6 % par an'}
          now_note: {ar: 'زيادة على التأخير فوق المبلغ', fr: 'majoration de retard, en plus de la somme'}
          from: '2027-01-01'
          amended: {by: majority, vote: unanimous, page: 775}
          detail: {ar: 'مادة جديدة زادوها النواب: الأوامر بالمداخيل اللي كتسترجع أجور وتعويضات ومعاشات تخلصات بغير حق ما بقاتش كتزاد عليها زيادة 6% ديال مدونة تحصيل الديون العمومية.', fr: 'Un article ajouté par les députés : les ordres de recette qui récupèrent des traitements, indemnités et pensions versés à tort ne portent plus la majoration de 6 % du code de recouvrement des créances publiques.'}
          cites: [/ma/loi/15-97/art_23]
        - headline: {ar: 'الكراء اللي كتخلصو ليك شركة ولا مهني', fr: 'Le loyer que vous paie une société ou un professionnel'}
          plain: {ar: 'إلا كاري لشركة، ولا لمهني كيتحاسب بالنتيجة الحقيقية ولا المبسطة، هو اللي كيقطع الضريبة من الكراء قبل ما يخلصك. تحت مبلغ معين فالعام ما كيقطعش.', fr: 'Si votre locataire est une société, ou un professionnel au résultat net réel ou simplifié, c’est lui qui retient l’impôt sur le loyer avant de vous payer. Sous un montant annuel, il ne retient rien.'}
          then: '60.000'
          now: '40.000'
          unit: {ar: 'درهم فالعام', fr: 'DH par an'}
          from: '2027-01-01'
          amended: {by: groups, vote: unanimous, page: 759}
          detail: {ar: 'ما كانش فالمشروع كما أودع: زادوه تعديلان، واحد ديال فرق الأغلبية وواحد ديال فريق العدالة والتنمية. كيطبق على الكراء المدفوع من فاتح يناير 2027.', fr: 'Absent du projet déposé : deux amendements l’ajoutent, l’un des groupes de la majorité, l’autre du groupe Justice et développement. S’applique aux loyers versés dès le 1er janvier 2027.'}
          cites: [/ma/code/cgi/art_160-bis]
        - headline: {ar: 'بيع عقار بثمن صغير', fr: 'Vendre un bien de petite valeur'}
          plain: {ar: 'اللي باع فالعام عقارات مجموع قيمتها ما كيفوتش مبلغ معين، الربح ديالو معفي من الضريبة على الدخل.', fr: 'Qui vend dans l’année des biens dont la valeur totale ne dépasse pas un montant ne paie pas d’impôt sur le profit.'}
          then: '200.000'
          now: '140.000'
          unit: {ar: 'درهم فالعام', fr: 'DH par an'}
          from: '2027-01-01'
          amended: {by: mp, vote: [39, 0, 1], page: 746}
          detail: {ar: 'ما كانش فالمشروع كما أودع. فريق الحركة الشعبية طلب 280.000 درهم؛ اللجنة كتبات 200.000 بصيغتها. كيطبق على البيوعات من فاتح يناير 2027.', fr: 'Absent du projet déposé. Le groupe du Mouvement populaire demandait 280 000 DH ; la commission a écrit 200 000 dans sa rédaction. S’applique aux cessions dès le 1er janvier 2027.'}
          cites: [/ma/code/cgi/art_63]
        - headline: {ar: 'تسجيل عقد قديم تقادمو الواجبات ديالو', fr: 'Enregistrer un acte ancien aux droits prescrits'}
          plain: {ar: 'عقد تقادمو الواجبات ديال التسجيل ديالو، وطلبو الأطراف ولا واحد منهم يتسجل.', fr: 'Un acte dont les droits d’enregistrement sont prescrits, et que les parties, ou l’une d’elles, demandent à enregistrer.'}
          then: {ar: 'بلا ذعيرة، داخل الآجال العادية', fr: 'sans pénalité, dans les délais ordinaires'}
          then_note: {ar: 'محسوبة من نهار طلب التسجيل', fr: 'comptés du jour de la demande'}
          filed: {ar: 'بلا ذعيرة', fr: 'sans pénalité'}
          now: {ar: 'بالذعيرة', fr: 'avec pénalités'}
          from: '2027-01-01'
          amended: {by: majority, vote: [39, 1, 0], page: 755}
          detail: {ar: 'المشروع كما أودع كيسجلو بالأسعار ديال نهار التسجيل، بلا ذعيرة ولا زيادات. النواب زادو: الواجبات كتتخلص داخل الآجال العادية ديال التسجيل، محسوبة من النهار اللي طلبو فيه الأطراف ولا واحد منهم التسجيل.', fr: 'Le projet déposé l’enregistre aux taux du jour, sans pénalité ni majoration. Les députés ont ajouté : les droits se paient dans les délais ordinaires d’enregistrement, comptés du jour où les parties, ou l’une d’elles, le demandent.'}
          cites: [/ma/code/cgi/art_128]
        - headline: {ar: 'عقد بيع عقار: شهادة أداء الضرائب ديالو', fr: 'L’acte de vente d’un bien : l’attestation de ses impôts payés'}
          plain: {ar: 'اللي كيحرر عقد كينقل ملكية عقار خاصو يكتب فيه معلومات على الضرائب ديال هاد العقار.', fr: 'Qui rédige un acte transférant un bien doit y écrire des informations sur les impôts de ce bien.'}
          then: {ar: 'حتى مراجع شهادة الأداء', fr: 'aussi les références de l’attestation de paiement'}
          now: {ar: 'رقم القيد فرسم السكن ورسم الخدمات الجماعية', fr: 'le numéro d’inscription à la taxe d’habitation et de services communaux'}
          from: '2027-01-01'
          when: {ar: 'العقود اللي تسجلات من فاتح يناير 2027', fr: 'actes enregistrés dès le 1er janvier 2027'}
          amended: {by: majority, vote: [39, 0, 1], page: 757}
          detail: {ar: 'ما كانش فالمشروع كما أودع. العقد، والنموذج ديال الإدارة اللي كيتقدم معاه، خاصهم يذكرو مراجع الشهادة اللي كتسلمها مصالح التحصيل وكتثبت بلي الضرائب والرسوم ديال العقار تخلصات على العام اللي تنقلات فيه الملكية والسنين اللي قبل. العقد اللي ما معاهش النموذج كيترفض تسجيلو؛ وفالتسجيل الإلكتروني، إلا تنسات هاد المراجع، كاينة ذعيرة ديال 1.000 درهم (تعديل ثاني، 39 مع و1 ضد).', fr: 'Absent du projet déposé. L’acte, et le formulaire de l’administration déposé avec lui, doivent donner les références de l’attestation délivrée par les services de recouvrement prouvant que les impôts et taxes du bien sont payés pour l’année du transfert et les années antérieures. Un acte sans le formulaire est refusé à l’enregistrement ; à l’enregistrement électronique, l’oubli de ces références est puni d’une amende de 1 000 DH (un second amendement, 39 pour et 1 contre).'}
          cites: [/ma/code/cgi/art_139, /ma/code/cgi/art_206-bis]
        - headline: {ar: 'بيع الأسهم غير المدرجة', fr: 'La cession de titres non cotés'}
          then: {ar: 'كل بيعة، بالإنترنت', fr: 'chaque cession, en ligne'}
          filed: {ar: 'كل بيعة', fr: 'chaque cession'}
          now: {ar: 'مرة فالعام', fr: 'une fois par an'}
          from: '2027-01-01'
          amended: {by: majority, vote: unanimous, page: 750}
          detail: {ar: 'تصريح على كل بيعة فالشهر اللي من بعدها، مع الأداء. النواب زادو بلي التصريح كيتدار بطريقة إلكترونية.', fr: 'Une déclaration par cession dans le mois qui suit, avec le paiement. Les députés ont ajouté qu’elle se dépose par procédé électronique.'}
          cites: [/ma/code/cgi/art_84, /ma/code/cgi/art_173]
    - key: self
      for: [self]
      chip: {ar: 'خدام بحسابك', fr: 'À votre compte'}
      title: {ar: 'إلا كتخدم بحسابك ولا بلا تسجيل', fr: 'Si vous travaillez à votre compte, ou sans être déclaré'}
      line: {ar: 'عامين باش تتسجل عوض عام، 20% عوض 30% فوق 100.000 مع زبون واحد، والأتعاب من 30% لـ20% حتى 2031', fr: 'Deux ans pour s’inscrire au lieu d’un, 20 % au lieu de 30 % au-delà de 100 000 avec un même client, et les honoraires de 30 % à 20 % d’ici 2031'}
      rows:
        - headline: {ar: 'المدة باش يتسجل فالرسم المهني اللي خدام بلا تسجيل', fr: 'Le temps pour s’inscrire à la taxe professionnelle quand on travaille sans être déclaré'}
          plain: {ar: 'اللي تسجل داخل هاد المدة كيتحاسب غير على اللي ربح من نهار التسجيل، ماشي على اللي فات.', fr: 'Qui s’inscrit dans ce délai n’est imposé que sur ce qu’il gagne depuis son inscription, pas sur le passé.'}
          then: {ar: 'عامين', fr: 'deux ans'}
          then_note: {ar: 'من فاتح يناير 2027 حتى 31 دجنبر 2028', fr: 'du 1er janvier 2027 au 31 décembre 2028'}
          filed: {ar: 'عام واحد', fr: 'un an'}
          filed_note: {ar: 'حتى 31 دجنبر 2027', fr: 'jusqu’au 31 décembre 2027'}
          now: {ar: 'ما كايناش', fr: 'aucun'}
          now_note: {ar: 'اللي تسجل كيتحاسب على اللي فات', fr: 'qui s’inscrit est imposé sur le passé'}
          from: '2027-01-01'
          amended: {by: majority, vote: unanimous, page: 767}
          detail: {ar: 'إلا خدام بلا ما تكون مسجل: اللي تسجل فالرسم المهني من فاتح يناير 2027 كيتحاسب غير على الدخول والعمليات من نهار التسجيل. المشروع كما أودع كان كيسد الباب فـ31 دجنبر 2027؛ النواب زادو عام.', fr: 'Si vous travaillez sans être inscrit : en vous inscrivant à la taxe professionnelle dès le 1er janvier 2027, vous n’êtes imposé que sur ce que vous gagnez depuis l’inscription. Le projet déposé fermait la fenêtre le 31 décembre 2027 ; les députés ajoutent un an.'}
          cites: [/ma/code/cgi/art_247]
        - headline: {ar: 'المقاول الذاتي اللي كيخدم بزاف مع زبون واحد', fr: 'L’auto-entrepreneur qui travaille beaucoup pour un même client'}
          plain: {ar: 'إلا فات اللي فكتيرتي لزبون واحد فالعام مبلغ معين، الزبون كيقطع الضريبة من الزيادة قبل ما يخلصك.', fr: 'Quand ce que vous facturez à un même client dans l’année dépasse un montant, ce client retient l’impôt sur le surplus avant de vous payer.'}
          then: {ar: '20% فوق 100.000', fr: '20 % au-delà de 100 000'}
          now: {ar: '30% فوق 80.000', fr: '30 % au-delà de 80 000'}
          unit: {ar: 'درهم مع نفس الزبون فالعام', fr: 'DH par an avec un même client'}
          from: '2027-01-01'
          amended: {by: majority, vote: [39, 0, 1], page: 741}
          detail: {ar: 'ما كانش فالمشروع كما أودع. كيطبق على المكافآت المدفوعة من فاتح يناير 2027، دقة وحدة بلا تدرج، والاقتطاع كيبرئ من الضريبة. تعريف «الزائد» والتصريح ديالو تبعو نفس الحد ديال 100.000 درهم.', fr: 'Absent du projet déposé. S’applique aux rémunérations versées dès le 1er janvier 2027, d’un coup, et la retenue est libératoire. La définition de « l’excédent » et sa déclaration suivent le même seuil de 100 000 DH.'}
          cites: [/ma/code/cgi/art_42-bis, /ma/code/cgi/art_45-bis, /ma/code/cgi/art_73]
        - headline: {ar: 'المساهمة المهنية الموحدة مع زبون واحد', fr: 'La contribution professionnelle unique avec un même client'}
          plain: {ar: 'نفس القاعدة لأصحاب المساهمة المهنية الموحدة: فوق مبلغ معين فالعام مع نفس الزبون، الزبون كيقطع الضريبة من المنبع.', fr: 'La même règle pour la contribution professionnelle unique : au-delà d’un montant par an avec un même client, ce client retient l’impôt à la source.'}
          then: {ar: '20% فوق 100.000', fr: '20 % au-delà de 100 000'}
          now: {ar: '30% فوق 80.000', fr: '30 % au-delà de 80 000'}
          unit: {ar: 'درهم مع نفس الزبون فالعام', fr: 'DH par an avec un même client'}
          from: '2027-01-01'
          amended: {by: majority, vote: [29, 11, 0], page: 740}
          detail: {ar: 'ما كانش فالمشروع كما أودع. الاقتطاع كيدوز من السعر الخاص 30% لـ20% كيبرئ من الضريبة، من فاتح يناير 2027 بلا تدرج.', fr: 'Absent du projet déposé. La retenue passe du taux spécial de 30 % à 20 % libératoire, dès le 1er janvier 2027, sans paliers.'}
          cites: [/ma/code/cgi/art_40, /ma/code/cgi/art_73]
        - headline: {ar: 'الأتعاب والعمولات اللي كيتقطع منها 30%', fr: 'Les honoraires et commissions retenus à 30 %'}
          plain: {ar: 'أتعاب كتخلصها مقاولة لواحد ماشي من المستخدمين ديالها، وأجور الفنانين، وعمولات الممثلين والجوالين التجاريين: الضريبة كتتقطع من المنبع بسعر خاص.', fr: 'Les honoraires qu’une entreprise verse à quelqu’un hors de son personnel, les cachets des artistes, les commissions des représentants : l’impôt est retenu à la source à un taux spécial.'}
          then: '28%'
          then_note: {ar: 'فـ2027، ثم 26% و24% و22%، و20% من 2031', fr: 'en 2027, puis 26 %, 24 % et 22 %, et 20 % dès 2031'}
          now: '30%'
          from: '2027-01-01'
          amended: {by: majority, vote: unanimous, page: 768}
          detail: {ar: 'ما كانش فالمشروع كما أودع. السعر الخاص 30% كيتحذف: 28% فـ2027، 26% فـ2028، 24% فـ2029، 22% فـ2030، و20% من فاتح يناير 2031؛ والاقتطاع كيبرئ من الضريبة من 2027.', fr: 'Absent du projet déposé. Le taux spécial de 30 % disparaît : 28 % en 2027, 26 % en 2028, 24 % en 2029, 22 % en 2030, 20 % dès le 1er janvier 2031 ; la retenue est libératoire dès 2027.'}
          cites: [/ma/code/cgi/art_73, /ma/code/cgi/art_247, /ma/code/cgi/art_58, /ma/code/cgi/art_60, /ma/code/cgi/art_156]
        - headline: {ar: 'الربح من ألعاب الحظ الأجنبية فالإنترنت', fr: 'Les gains des jeux de hasard étrangers en ligne'}
          plain: {ar: 'الضريبة على الأرباح من ألعاب الحظ عبر الإنترنت اللي أصلها من الخارج كتتقطع من المنبع بسعر خاص.', fr: 'L’impôt sur les gains des jeux de hasard en ligne d’origine étrangère est retenu à la source à un taux spécial.'}
          then: '28%'
          then_note: {ar: 'فـ2027، ثم 26% و24% و22%، و20% من 2031', fr: 'en 2027, puis 26 %, 24 % et 22 %, et 20 % dès 2031'}
          now: '30%'
          from: '2027-01-01'
          amended: {by: majority, vote: [23, 0, 17], page: 760}
          detail: {ar: 'ما كانش فالمشروع كما أودع. نفس التدرج ديال الأتعاب: 28% فـ2027، 26% فـ2028، 24% فـ2029، 22% فـ2030، و20% من فاتح يناير 2031.', fr: 'Absent du projet déposé. Les mêmes paliers que les honoraires : 28 % en 2027, 26 % en 2028, 24 % en 2029, 22 % en 2030, 20 % dès le 1er janvier 2031.'}
          cites: [/ma/code/cgi/art_73, /ma/code/cgi/art_247]
    - key: company
      for: [company]
      chip: {ar: 'عندك شركة', fr: 'Société'}
      title: {ar: 'إلا عندك شركة', fr: 'Si vous avez une société'}
      line: {ar: 'التسبيق على الاستيراد 3% عوض 5%، دفتر المعشرين تحيد، وبيع الرملة بلا إعفاء', fr: 'L’avance à l’importation à 3 % au lieu de 5 %, le cahier des déclarants en douane retiré, la vente de sable sans exonération'}
      rows:
        - headline: {ar: 'التسبيق على الاستيراد باش تبيع', fr: 'L’avance sur les importations destinées à la revente'}
          plain: {ar: 'اللي كيستورد سلع باش يبيعها كيخلص فالديوانة تسبيق على الضريبة ديالو.', fr: 'Qui importe des marchandises pour les revendre paie à la douane une avance sur son impôt.'}
          then: '3%'
          then_note: {ar: 'لمدة 36 شهر', fr: 'pendant 36 mois'}
          filed: '5%'
          filed_note: {ar: 'لمدة 60 شهر', fr: 'pendant 60 mois'}
          unit: {ar: 'من القيمة الجمركية', fr: 'de la valeur en douane'}
          new: true
          from: '2027-07-01'
          amended: {by: committee, vote: unanimous, page: 761}
          detail: {ar: 'على كل استيراد لمدة 36 شهر، ومن بعد غير اللي ما جابش شهادة الإبراء الضريبي عندها أقل من 30 يوم (المشروع كما أودع كان كاتب شهادة ديال ستة شهور)؛ كيتخصم من الضريبة. فريق الحركة الشعبية سحب التعديلات ديالو مقابل تعديل اللجنة.', fr: 'Sur chaque importation pendant 36 mois, puis seulement sans attestation de régularité fiscale de moins de 30 jours (le projet déposé écrivait six mois) ; imputée sur l’impôt. Le groupe du Mouvement populaire a retiré ses amendements en échange de celui de la commission.'}
          cites: [/ma/code/cgi/art_170, /ma/code/cgi/art_173]
        - headline: {ar: 'دفتر التحملات ديال المعشرين فالديوانة', fr: 'Le cahier des charges des déclarants en douane'}
          plain: {ar: 'المشروع كان كيفرض على اللي طلب رخصة المعشر فالديوانة يلتزم بدفتر تحملات كتعدو الإدارة، ويرفق معاه الوثائق اللي كتحددها هي.', fr: 'Le projet obligeait qui demande la licence de déclarant en douane à respecter un cahier des charges rédigé par l’administration, avec les pièces qu’elle fixe.'}
          then: {ar: 'محذوف', fr: 'supprimé'}
          then_note: {ar: 'مع البند الانتقالي ديالو', fr: 'avec sa disposition transitoire'}
          filed: {ar: 'دفتر كتعدو الإدارة', fr: 'rédigé par l’administration'}
          filed_note: {ar: 'و12 شهر للمعشرين المقبولين قبل فاتح يناير 2027 باش يودعوه', fr: 'et 12 mois aux déclarants agréés avant le 1er janvier 2027 pour le déposer'}
          now: {ar: 'ما كاينش', fr: 'aucun'}
          when: {ar: 'ما كيتبدل والو', fr: 'rien ne change'}
          amended: {by: committee, vote: unanimous, page: 727}
          detail: {ar: 'خمسة ديال الفرق والمجموعات قدمو تعديلات على هاد القاعدة: فرق الأغلبية، وفريق التجمع الوطني للأحرار، وفريق العدالة والتنمية، وفريق الحركة الشعبية، ومجموعة تحالف اليسار. اللجنة حذفات التغيير ديال الفصل 68 من مدونة الجمارك كامل، والصيغ ديال الفرق ما دخلاتش؛ قواعد الرخصة كتبقى كيف هي.', fr: 'Cinq groupes avaient déposé des amendements sur cette règle : les groupes de la majorité, le groupe du Rassemblement national des indépendants, le groupe Justice et développement, le groupe du Mouvement populaire et le groupement de l’Alliance de la gauche. La commission a supprimé tout le changement de l’article 68 du code des douanes, sans reprendre les rédactions des groupes ; les règles de la licence restent telles quelles.'}
          cites: [/ma/projet-loi/60-26/art_3]
        - headline: {ar: 'إعفاء بيع الرملة من الضريبة على القيمة المضافة', fr: 'L’exonération de TVA des ventes de sable'}
          then: {ar: 'محذوف', fr: 'supprimée'}
          filed: {ar: 'معفي بلا حق فالخصم', fr: 'exonérées sans droit à déduction'}
          now: {ar: 'ما كاينش', fr: 'aucune'}
          when: {ar: 'ما كيتبدل والو', fr: 'rien ne change'}
          amended: {by: groups, vote: unanimous, page: 751}
          detail: {ar: 'المشروع كما أودع كان كيزيد بيع الرملة للبيوعات المعفية من الضريبة على القيمة المضافة بلا حق فالخصم. أربعة ديال الفرق والمجموعات طلبو يتحيد: فرق الأغلبية، وفريق العدالة والتنمية، وفريق الحركة الشعبية، ومجموعة تحالف اليسار. بيع الرملة كيبقى تحت قواعد القيمة المضافة اللي خدامة دابا.', fr: 'Le projet déposé ajoutait les ventes de sable aux ventes exonérées de TVA sans droit à déduction. Quatre groupes ont demandé de le retirer : les groupes de la majorité, le groupe Justice et développement, le groupe du Mouvement populaire et le groupement de l’Alliance de la gauche. Les ventes de sable restent aux règles de TVA en vigueur.'}
          cites: [/ma/code/cgi/art_91]
        - headline: {ar: 'شهادة الوضعية الجبائية فالحجز ديال القيمة المضافة', fr: 'L’attestation de régularité fiscale dans la retenue de TVA'}
          plain: {ar: 'فالحجز من المنبع ديال القيمة المضافة على موردي سلع التجهيز والأشغال، القاعدة كتعتمد على شهادة كتسلمها إدارة الضرائب.', fr: 'Dans la retenue à la source de TVA sur les fournisseurs de biens d’équipement et de travaux, la règle s’appuie sur une attestation que l’administration fiscale délivre.'}
          then: {ar: 'أقل من 30 يوم', fr: 'moins de 30 jours'}
          now: {ar: '6 شهور', fr: '6 mois'}
          unit: {ar: 'عمر الشهادة', fr: 'âge de l’attestation'}
          from: '2027-01-01'
          when: {ar: 'الشهادات اللي تسلمات من فاتح يناير 2027', fr: 'attestations délivrées dès le 1er janvier 2027'}
          amended: {by: majority, vote: [23, 0, 17], page: 753}
          detail: {ar: 'ما كانش فالمشروع كما أودع. اللجنة قبلاتو بصيغة الحكومة: الشهادة خاصها تكون تسلمات من أقل من 30 يوم عوض 6 شهور.', fr: 'Absent du projet déposé. La commission l’a accepté dans la rédaction du gouvernement : l’attestation doit dater de moins de 30 jours au lieu de 6 mois.'}
          cites: [/ma/code/cgi/art_117]
        - headline: {ar: 'القيمة المضافة على شراء النفايات الصناعية والمعادن المستعملة', fr: 'La TVA sur les achats de déchets industriels et de métaux usagés'}
          plain: {ar: 'اللي شرى هاد المواد كيصرح وكيخلص بنفسو القيمة المضافة ديالها.', fr: 'Qui achète ces matières déclare et paie lui-même leur TVA.'}
          then: {ar: 'حتى التجار اللي كيعطيو التحويل بالمناولة', fr: 'aussi les négociants qui font transformer en sous-traitance'}
          now: {ar: 'غير معامل التحويل', fr: 'les seules usines de transformation'}
          from: '2027-01-01'
          amended: {by: majority, vote: [39, 0, 1], page: 754}
          detail: {ar: 'ما كانش فالمشروع كما أودع. التجار اللي كيعطيو لمقاولات أخرى، تحت المسؤولية ديالهم وفإطار المناولة، تحويل النفايات الصناعية الجديدة والمعادن والمواد الأخرى المستعملة، خاصهم يصرحو ويخلصو القيمة المضافة على هاد المشتريات بنفس الشروط ديال معامل التحويل.', fr: 'Absent du projet déposé. Les négociants qui confient à d’autres entreprises, sous leur responsabilité et en sous-traitance, la transformation des déchets industriels neufs, métaux et autres matières usagées doivent déclarer et payer la TVA sur ces achats aux mêmes conditions que les usines de transformation.'}
          cites: [/ma/code/cgi/art_125-quater]
        - headline: {ar: 'عقود تخفيض رأسمال الشركات', fr: 'Les actes de réduction du capital des sociétés'}
          then: {ar: 'معفية من واجبات التسجيل', fr: 'exonérés des droits d’enregistrement'}
          new: true
          from: '2027-01-01'
          when: {ar: 'العقود اللي تسجلات من فاتح يناير 2027', fr: 'actes enregistrés dès le 1er janvier 2027'}
          amended: {by: majority, vote: [32, 7, 1], page: 756}
          detail: {ar: 'ما كانش فالمشروع كما أودع. إعفاء جديد لعقود التخفيض من رأسمال الشركات ولا المجموعات ذات النفع الاقتصادي، إلا كان التخفيض بسبب الخسائر ولا كيترجعو بيه فلوس للشركاء حسب المساهمة ديال كل واحد.', fr: 'Absent du projet déposé. Une exonération nouvelle pour les actes réduisant le capital des sociétés ou des groupements d’intérêt économique, que la réduction vienne de pertes ou rende de l’argent aux associés selon la part de chacun.'}
          cites: [/ma/code/cgi/art_129]
        - headline: {ar: 'استرداد القيمة المضافة اللي تحجزات من المنبع', fr: 'La restitution de la TVA retenue à la source'}
          plain: {ar: 'المورد اللي تقطعات ليه القيمة المضافة من المنبع وما قدرش يخصمها كيطلب يرجعوها ليه.', fr: 'Le fournisseur dont la TVA a été retenue à la source et qu’il n’a pas pu imputer en demande la restitution.'}
          then: {ar: 'بعد الشهر', fr: 'après le mois'}
          then_note: {ar: 'للي كيصرح كل شهر', fr: 'pour qui déclare chaque mois'}
          filed: {ar: 'بعد ربع العام', fr: 'après le trimestre'}
          new: true
          from: '2027-01-01'
          amended: {by: majority, vote: [39, 0, 1], page: 766}
          detail: {ar: 'الطلب كيتودع بعد ما يسالي الشهر ولا ربع العام اللي تعاين فيه الفائض، عوض ما يتسنى ربع العام كما فالمشروع كما أودع.', fr: 'La demande se dépose après la fin du mois ou du trimestre où l’excédent a été constaté, au lieu d’attendre la fin du trimestre comme dans le projet déposé.'}
          cites: [/ma/code/cgi/art_240]
    - key: buy
      chip: {ar: 'كتشري', fr: 'Vous achetez'}
      title: {ar: 'إلا كتشري: اللحم، الدخان، الطوموبيل', fr: 'Si vous achetez : viande, tabac, voiture'}
      line: {ar: 'استيراد المواشي بإجراءات كتحددها الإدارة، السيكار والسائل الإلكتروني كيطلعو، والطوموبيل فوق مليون 25%', fr: 'Le bétail importé selon des procédures que l’administration fixe, cigares et liquides en hausse, la voiture au-delà d’un million à 25 %'}
      rows:
        - headline: {ar: 'استيراد المواشي ولحومها', fr: 'L’importation du bétail et de ses viandes'}
          then: {ar: 'معفي', fr: 'exonérée'}
          then_note: {ar: 'بإجراءات مؤطرة كتحددها الإدارة', fr: 'selon des procédures encadrées que l’administration fixe'}
          now: {ar: 'معلق مؤقتا', fr: 'suspendu'}
          from: '2027-01-01'
          amended: {by: majority, vote: [22, 17, 0], page: 727}
          detail: {ar: 'المشروع كيزيد البقر والغنم والمعز والجمال الحية، واللحوم والأحشاء ديالها طرية ولا مبردة ولا مجمدة، للاستيرادات المعفية من رسوم الديوانة والضرائب الأخرى. النواب خلاو الإعفاء وزادو بلي هاد الاستيراد كيدوز «وفق إجراءات مؤطرة تحددها الإدارة لبلوغ الأهداف المتوخاة»؛ ما تبدل حتى سعر ولا رقم. ثلاثة ديال الاقتراحات اللي كانت باغية تحيدو ولا تحدو ما تقبلوش (تحت).', fr: 'Le projet ajoute les bovins, ovins, caprins et camelins vivants, et leurs viandes et abats frais, réfrigérés ou congelés, aux importations exonérées des droits de douane et autres taxes. Les députés gardent l’exonération et ajoutent que ces importations se font « selon des procédures encadrées que l’administration fixe pour atteindre les objectifs visés » ; aucun taux ni chiffre ne change. Trois propositions qui la supprimaient ou la limitaient n’ont pas été retenues (plus bas).'}
          cites: [/ma/projet-loi/60-26/art_3]
        - headline: {ar: 'السيكار الكبير والصغير', fr: 'Les cigares et cigarillos'}
          then: '1.125'
          then_note: {ar: 'و50% من ثمن البيع', fr: 'et 50 % du prix de vente'}
          now: '750'
          now_note: {ar: 'و35% من ثمن البيع', fr: 'et 35 % du prix de vente'}
          unit: {ar: 'درهم لكل 1.000 وحدة', fr: 'DH les 1 000 unités'}
          from: '2027-01-01'
          amended: {by: majority, vote: unanimous, page: 733}
          detail: {ar: 'ما كانش فالمشروع كما أودع، اللي كان كيطلع غير السجائر. المبلغ الأدنى كيولي 2.250 درهم عوض 1.500.', fr: 'Absent du projet déposé, qui ne relevait que les cigarettes. Le minimum de perception passe à 2 250 DH au lieu de 1 500.'}
          cites: [/ma/projet-loi/60-26/art_5]
        - headline: {ar: 'السائل ديال السيجارة الإلكترونية', fr: 'Le liquide de cigarette électronique'}
          then: {ar: '10 و20', fr: '10 et 20'}
          then_note: {ar: '10 بلا نيكوتين و20 بالنيكوتين', fr: '10 sans nicotine, 20 avec'}
          now: {ar: '5 و10', fr: '5 et 10'}
          now_note: {ar: '5 بلا نيكوتين و10 بالنيكوتين', fr: '5 sans nicotine, 10 avec'}
          unit: {ar: 'درهم لكل 10 ملل', fr: 'DH les 10 ml'}
          from: '2027-01-01'
          amended: {by: majority, vote: unanimous, page: 734}
          detail: {ar: 'ما كانش فالمشروع كما أودع: المشروع كان مبدل غير الضريبة على السيجارة الإلكترونية نفسها.', fr: 'Absent du projet déposé, qui ne changeait que la taxe sur la cigarette électronique elle-même.'}
          cites: [/ma/projet-loi/60-26/art_5]
        - headline: {ar: 'التمبر ديال الطوموبيل الغالية', fr: 'Le timbre de la voiture chère'}
          then: '25%'
          filed: '24%'
          now: '20%'
          unit: {ar: 'فوق مليون درهم', fr: 'au-delà d’un million'}
          from: '2027-01-01'
          amended: {by: majority, vote: unanimous, page: 770}
          detail: {ar: 'عند أول تسجيل: 5% من 400.000 حتى 600.000 (بحال اليوم؛ المشروع كما أودع كان كاتب 6%)، و12% حتى 800.000، و18% حتى مليون، و25% فوق (اليوم 5 و10 و15 و20%).', fr: 'À la première immatriculation : 5 % de 400 000 à 600 000 (comme aujourd’hui ; le projet déposé écrivait 6 %), 12 % jusqu’à 800 000, 18 % jusqu’à un million, 25 % au-delà (5, 10, 15 et 20 % aujourd’hui).'}
          cites: [/ma/code/cgi/art_252]
    - key: state
      chip: {ar: 'ميزانية الدولة', fr: 'Budget de l’État'}
      title: {ar: 'ميزانية الدولة: المناصب والحسابات والتوازن', fr: 'Le budget de l’État : postes, comptes, équilibre'}
      line: {ar: '49.654 منصب مالي عوض 34.454، حساب جديد للنظام العام، و1,6 مليار درهم زايدة من الضريبة على الشركات', fr: '49 654 postes budgétaires au lieu de 34 454, un nouveau compte pour l’ordre public, et 1,6 milliard de DH de plus d’impôt sur les sociétés'}
      rows:
        - headline: {ar: 'المناصب المالية فـ2027', fr: 'Les postes budgétaires de 2027'}
          then: '49.654'
          filed: '34.454'
          unit: {ar: 'منصب مالي', fr: 'postes budgétaires'}
          when: {ar: 'السنة المالية 2027', fr: 'année budgétaire 2027'}
          amended: {by: government, vote: [39, 0, 1], page: 776}
          detail: {ar: 'وزارة الداخلية من 14.200 لـ29.200 منصب (+15.000)، ووزارة التشغيل والحوار الاجتماعي من 20 لـ220 (+200، باش توظف مفتشي الشغل). الـ500 منصب ديال البند الثاني ما تبدلوش.', fr: 'Le ministère de l’Intérieur passe de 14 200 à 29 200 postes (+15 000), celui de l’Emploi et du Dialogue social de 20 à 220 (+200, pour recruter des inspecteurs du travail). Les 500 postes du point 2 ne changent pas.'}
          cites: [/ma/projet-loi/60-26/art_21]
        - headline: {ar: 'حساب خصوصي جديد للحفاظ على النظام العام', fr: 'Un nouveau compte spécial pour l’ordre public'}
          plain: {ar: 'حساب خصوصي ديال الخزينة كيتمول من الميزانية العامة، ووزير الداخلية هو الآمر بقبض الموارد ديالو وصرف النفقات ديالو.', fr: 'Un compte spécial du Trésor alimenté par le budget général, dont le ministre de l’Intérieur ordonne les recettes et les dépenses.'}
          then: {ar: 'حساب جديد', fr: 'compte nouveau'}
          new: true
          from: '2027-01-01'
          amended: {by: government, vote: unanimous, page: 775}
          detail: {ar: 'ما كانش فالمشروع كما أودع. كيخلص مشاريع البنيات التحتية (حتى شراء الأراضي)، والعربات، وتجهيزات الاتصال، والمعدات الأخرى ديال الحفاظ على النظام العام. فجدول الموارد ديال الحسابات الخصوصية كيبان «للتذكرة»، بلا مبلغ.', fr: 'Absent du projet déposé. Il paie les projets d’infrastructure (achat de terrains compris), les véhicules, le matériel de communication et les autres équipements du maintien de l’ordre public. Le tableau des ressources des comptes spéciaux l’inscrit « pour mémoire », sans montant.'}
        - headline: {ar: 'شحال يقدر يلتزم بيه وزير الداخلية مسبقا من هاد الحساب', fr: 'Ce que le ministre de l’Intérieur peut engager d’avance sur ce compte'}
          then: '11,5'
          unit: {ar: 'مليار درهم من اعتمادات 2028', fr: 'milliards de DH des crédits de 2028'}
          new: true
          when: {ar: 'خلال 2027', fr: 'pendant 2027'}
          amended: {by: government, vote: [39, 0, 1], page: 777}
          detail: {ar: 'ما كانش فالمشروع كما أودع. وزير الداخلية يقدر يلتزم مسبقا خلال 2027 بنفقات حتى 11.500.000.000 درهم من الاعتمادات اللي غادي تترصد ليه فـ2028، على الحساب الجديد.', fr: 'Absent du projet déposé. Le ministre de l’Intérieur peut engager d’avance, pendant 2027, jusqu’à 11 500 000 000 DH de dépenses sur les crédits qui lui seront ouverts en 2028, sur le nouveau compte.'}
        - headline: {ar: 'حساب معدات القوات المسلحة الملكية', fr: 'Le compte d’équipement des Forces armées royales'}
          then: '210,5'
          filed: '190,5'
          unit: {ar: 'مليار درهم من اعتمادات 2028', fr: 'milliards de DH des crédits de 2028'}
          when: {ar: 'خلال 2027', fr: 'pendant 2027'}
          amended: {by: government, vote: unanimous, page: 777}
          detail: {ar: 'المبلغ اللي يقدر يلتزم بيه مسبقا خلال 2027 الوزير المنتدب المكلف بإدارة الدفاع الوطني زاد 20 مليار درهم. والحساب تبدلات سميتو لـ«اقتناء وإصلاح معدات القوات المسلحة الملكية ودعم تطوير الصناعة والبنيات التحتية العسكرية»، وولا يقدر يخلص التشييد والتهيئة وشراء المعدات ومواد البناء ديال البنيات التحتية العسكرية.', fr: 'Ce que le ministre délégué chargé de l’administration de la défense nationale peut engager d’avance pendant 2027 augmente de 20 milliards de DH. Le compte prend le nom « Acquisition et réparation des matériels des Forces armées royales et soutien au développement de l’industrie et des infrastructures militaires », et peut payer la construction, l’aménagement, l’achat de matériel et de matériaux de construction des infrastructures militaires.'}
        - headline: {ar: 'المداخيل المتوقعة من الضريبة على الشركات', fr: 'Les recettes prévues de l’impôt sur les sociétés'}
          then: '127.608'
          filed: '126.008'
          unit: {ar: 'مليون درهم', fr: 'millions de DH'}
          when: {ar: 'السنة المالية 2027', fr: 'année budgétaire 2027'}
          amended: {by: government, vote: unanimous, page: 778}
          detail: {ar: 'زيادة 1.600 مليون درهم فالتقديرات. المداخيل العادية والنفقات العادية ديال الميزانية العامة زادو بنفس المبلغ، والرصيد العادي ما تبدلش: نفقات الموظفين +650 مليون درهم، ونفقات المعدات والنفقات المختلفة +950 مليون. الفلوس كتمشي لـ950 مليون درهم زايدة للمجموعات الصحية الترابية، و50 مليون لمناصب مفتشي الشغل الجداد، ولمناصب الداخلية الزايدة.', fr: 'Une hausse de 1 600 millions de DH des prévisions. Les recettes et les dépenses ordinaires du budget général augmentent d’autant, et le solde ordinaire ne change pas : dépenses de personnel +650 millions de DH, matériel et dépenses diverses +950 millions. L’argent va à 950 millions de DH de plus pour les groupements sanitaires territoriaux, 50 millions pour les nouveaux postes d’inspecteurs du travail, et aux postes supplémentaires de l’Intérieur.'}
          cites: [/ma/projet-loi/60-26/art_38]
        - headline: {ar: 'صندوق تفعيل الطابع الرسمي للأمازيغية', fr: 'Le fonds pour le caractère officiel de l’amazighe'}
          then: {ar: 'تطبيق القانون التنظيمي 26.16', fr: 'appliquer la loi organique 26.16'}
          then_note: {ar: 'فالتعليم وفمجالات الحياة العامة ذات الأولوية', fr: 'dans l’enseignement et les domaines prioritaires de la vie publique'}
          filed: {ar: 'تفعيل الطابع الرسمي للأمازيغية', fr: 'mettre en œuvre le caractère officiel de l’amazighe'}
          filed_note: {ar: 'وإدماجها فمجالات الحياة العامة ذات الأولوية', fr: 'et son intégration dans les domaines prioritaires de la vie publique'}
          from: '2027-01-01'
          amended: {by: mp, vote: unanimous, page: 775}
          detail: {ar: 'الحساب جديد فالمشروع. النواب كتبو الهدف ديالو من جديد: كيذكر القانون التنظيمي 26.16 والتعليم، وكيقول بلي الصندوق كيوفر الموارد المالية باش تتطبق أحكامو. ما تبدل حتى مبلغ ولا ضريبة.', fr: 'Le compte est nouveau dans le projet. Les députés ont réécrit son objet : il nomme la loi organique 26.16 et l’enseignement, et dit que le fonds apporte les moyens financiers d’appliquer ses dispositions. Aucun montant ni impôt ne change.'}
          cites: [/ma/projet-loi/60-26/art_13]
    - key: refused
      chip: {ar: 'ما تقبلش', fr: 'Non retenu'}
      title: {ar: 'شنو ما قبلاتش اللجنة', fr: 'Ce que la commission n’a pas retenu'}
      line: {ar: '720 درهم على كل واحد فتكلفك، مصاريف المدرسة، 85% على المعاش، و40% فوق مليون: ما تقبلوش', fr: '720 DH par personne à charge, les frais d’école, 85 % sur la pension, 40 % au-delà d’un million : non retenus'}
      rows:
        - headline: {ar: 'الخصم على كل واحد فتكلفك', fr: 'La réduction par personne à charge'}
          plain: {ar: 'مبلغ كيتنقص من الضريبة ديال العام على كل شخص فتكلفك.', fr: 'Une somme retirée de l’impôt de l’année pour chaque personne à votre charge.'}
          then: '720'
          then_note: {ar: 'والسقف 4.320', fr: 'plafond 4 320'}
          now: '600'
          now_note: {ar: 'والسقف 3.600', fr: 'plafond 3 600'}
          unit: {ar: 'درهم فالعام على كل واحد', fr: 'DH par an et par personne'}
          refused: {by: pjd, vote: [6, 23, 11], page: 228}
          detail: {ar: 'الاقتراح كان كيعطي حتى 2.000 درهم على كل شخص فوضعية إعاقة فالأسرة.', fr: 'La proposition donnait aussi 2 000 DH pour chaque personne handicapée du foyer.'}
          cites: [/ma/code/cgi/art_74]
        - headline: {ar: 'خصم على الإعاقة', fr: 'Une déduction pour handicap'}
          then: '3.000'
          unit: {ar: 'درهم فالعام', fr: 'DH par an'}
          new: true
          refused: {by: majority, withdrawn: true, page: 56}
          detail: {ar: 'خصم زايد إلا كان الملزم ولا شي واحد فتكلفو فوضعية إعاقة.', fr: 'Une déduction en plus lorsque le contribuable ou une personne à sa charge est handicapé.'}
          cites: [/ma/code/cgi/art_74]
        - headline: {ar: 'مصاريف المدرسة الخاصة', fr: 'Les frais d’école privée'}
          then: '6.000'
          unit: {ar: 'درهم فالعام على كل ولد', fr: 'DH par an et par enfant'}
          new: true
          refused: {by: pjd, vote: [6, 23, 14], page: 205}
          detail: {ar: 'خصم من الدخل الخاضع ديال واجبات التسجيل والتمدرس اللي كتخلص لمؤسسات التعليم الأولي والابتدائي والثانوي الخاصة المرخص ليها، على الولاد اللي فتكلفك. اليوم ما كاين حتى خصم بحال هادا فالمادة 28.', fr: 'Une déduction du revenu imposable des frais d’inscription et de scolarité payés aux écoles privées autorisées, du préscolaire au secondaire, pour les enfants à charge. Aucune déduction de ce genre n’existe aujourd’hui à l’article 28.'}
          cites: [/ma/code/cgi/art_28]
        - headline: {ar: 'الخصم الجزافي على المعاش', fr: 'L’abattement forfaitaire sur la pension'}
          plain: {ar: 'جزء من المعاش الخام اللي كيتخلص عليه كيتنقص قبل ما تتحسب الضريبة.', fr: 'Une part de la pension brute imposable se retire avant le calcul de l’impôt.'}
          then: '85%'
          then_note: {ar: 'حتى 216.000 درهم فالعام', fr: 'jusqu’à 216 000 DH par an'}
          now: '70%'
          now_note: {ar: 'حتى 168.000 درهم فالعام', fr: 'jusqu’à 168 000 DH par an'}
          refused: {by: pjd, vote: [6, 23, 11], page: 225}
          detail: {ar: 'السقف المقترح هو 18.000 درهم فالشهر. 70% و168.000 درهم هوما اللي خدامين اليوم، والمشروع ما مسهمش.', fr: 'Le plafond proposé fait 18 000 DH par mois. 70 % et 168 000 DH sont les chiffres en vigueur, que le projet ne touche pas.'}
          cites: [/ma/code/cgi/art_60]
        - headline: {ar: 'السقف ديال المصاريف المهنية', fr: 'Le plafond des frais professionnels'}
          then: '45.000'
          now: '35.000'
          unit: {ar: 'درهم فالعام', fr: 'DH par an'}
          refused: {by: pjd, vote: [6, 23, 11], page: 223}
          detail: {ar: 'المشروع كيطلع المصاريف المهنية لـ45% لكل الأجراء وكيخلي السقف فـ35.000 درهم فالعام؛ الاقتراح كان باغي يطلع السقف لـ45.000.', fr: 'Le projet porte les frais professionnels à 45 % pour tous les salariés et garde le plafond à 35 000 DH par an ; la proposition le portait à 45 000.'}
          cites: [/ma/code/cgi/art_59]
        - headline: {ar: 'فوائد قرض السكن الرئيسي الأول', fr: 'Les intérêts du prêt pour une première résidence principale'}
          plain: {ar: 'اللي شرى ولا بنى سكن ديالو بقرض كينقص الفوائد (ولا هامش المرابحة والإجارة) من الدخل الخاضع، حتى لنسبة منو.', fr: 'Qui achète ou construit son logement à crédit retire les intérêts (ou la marge de mourabaha et d’ijara) de son revenu imposable, jusqu’à une part de celui-ci.'}
          then: '15%'
          then_note: {ar: 'فالعشر سنين الأولى ديال القرض', fr: 'les 10 premières années du prêt'}
          now: '10%'
          unit: {ar: 'من الدخل الإجمالي الخاضع', fr: 'du revenu global imposable'}
          refused: {by: pjd, vote: [6, 23, 14], page: 203}
          detail: {ar: 'لأول شراء ديال سكن رئيسي ثمنو ما كيفوتش 1.000.000 درهم بلا القيمة المضافة. والخصم كان غادي يبقى طول مدة القرض ما دام السكن رئيسي.', fr: 'Pour le premier achat d’une résidence principale de 1 000 000 DH au plus hors TVA. La déduction restait pour toute la durée du prêt tant que le logement reste la résidence principale.'}
          cites: [/ma/code/cgi/art_28]
        - headline: {ar: 'الشريحة المعفية من الضريبة على الدخل', fr: 'La tranche exonérée de l’impôt sur le revenu'}
          then: '80.000'
          filed: '60.000'
          now: '40.000'
          unit: {ar: 'درهم فالعام', fr: 'DH par an'}
          refused: {by: mp, withdrawn: true, page: 342}
          detail: {ar: 'الشريحة ديال 10% كانت غادي تبدا من 80.001 درهم؛ 20% و30% كيبقاو كيف فالمشروع.', fr: 'La tranche à 10 % aurait commencé à 80 001 DH ; 20 % et 30 % restaient comme dans le projet.'}
          cites: [/ma/code/cgi/art_73]
        - headline: {ar: 'المشغل يدوز للأجير الربح ديال الجدول الجديد', fr: 'L’employeur reverse au salarié le gain du nouveau barème'}
          then: {ar: 'واجب على المشغل', fr: 'obligatoire pour l’employeur'}
          new: true
          refused: {by: majority, withdrawn: true, page: 57}
          detail: {ar: 'الاقتراح كان كيفرض على المشغلين يدوزو للأجراء الربح اللي كيجي من الجدول الجديد، ويراجعو للفوق العقود اللي فيها الأجر صافي.', fr: 'La proposition obligeait les employeurs à faire passer aux salariés le gain du nouveau barème, et à réviser à la hausse les contrats en salaire net.'}
        - headline: {ar: 'سعر 40% على الدخل الكبير', fr: 'Un taux de 40 % sur les gros revenus'}
          then: '40%'
          then_note: {ar: 'على اللي فوق 1.000.000 درهم فالعام', fr: 'au-delà de 1 000 000 DH par an'}
          filed: '30%'
          filed_note: {ar: 'أعلى سعر فالمشروع من 2031، فوق 500.000', fr: 'le taux le plus haut du projet dès 2031, au-delà de 500 000'}
          now: '37%'
          now_note: {ar: 'على اللي فوق 180.000 درهم صافية فالعام', fr: 'au-delà de 180 000 DH nets par an'}
          refused: {by: left, vote: [1, 23, 16], page: 468}
          detail: {ar: 'كل الشرائح والأسعار ديال المشروع كانو غادي يبقاو حتى 1.000.000 درهم، وسعر 40% كيتزاد فوقها، فالجدول ديال 2031 وفكل جدول من 2027 حتى 2030.', fr: 'Toutes les tranches et tous les taux du projet restaient jusqu’à 1 000 000 DH, avec 40 % au-delà, dans le barème de 2031 et dans chaque barème de 2027 à 2030.'}
          cites: [/ma/code/cgi/art_73, /ma/code/cgi/art_247]
        - headline: {ar: 'الإعفاء ديال استيراد المواشي ولحومها', fr: 'L’exonération des importations de bétail et de viande'}
          then: {ar: 'حذف ولا حد بعام ولا عامين', fr: 'supprimée, ou limitée à un an ou deux'}
          filed: {ar: 'معفي بلا حد', fr: 'exonérée sans limite'}
          now: {ar: 'معلق مؤقتا', fr: 'suspendu'}
          refused: {by: groups, page: 155}
          detail: {ar: 'ثلاثة ديال الاقتراحات: فريق العدالة والتنمية بغا يحذف الإعفاء (7 مع، 23 ضد، 9 ممتنعين)؛ فريق الحركة الشعبية بغا يحدو فالاستيراد من فاتح يناير 2027 حتى 31 دجنبر 2028، فحدود كميات كيحددها نص تنظيمي مسبقا (10 مع، 22 ضد، 7 ممتنعين)؛ ومجموعة تحالف اليسار بغات تحدو فـ2027 بوحدها، من رسم الاستيراد ومن القيمة المضافة عند الاستيراد (7 مع، 22 ضد، 11 ممتنعين).', fr: 'Trois propositions : le groupe Justice et développement supprimait l’exonération (7 pour, 23 contre, 9 abstentions) ; le groupe du Mouvement populaire la limitait aux importations du 1er janvier 2027 au 31 décembre 2028, dans des quantités fixées à l’avance par un texte réglementaire (10 pour, 22 contre, 7 abstentions) ; le groupement de l’Alliance de la gauche la limitait à 2027, pour le droit d’importation et la TVA à l’importation (7 pour, 22 contre, 11 abstentions).'}
          cites: [/ma/projet-loi/60-26/art_3]
        - headline: {ar: 'شركات الاتصالات والإسمنت', fr: 'Les opérateurs télécoms et les cimentiers'}
          then: '40%'
          now: '35%'
          now_note: {ar: 'على ربح صافي من 100 مليون درهم فما فوق', fr: 'sur un bénéfice net de 100 millions de DH ou plus'}
          refused: {by: pjd, vote: [10, 23, 7], page: 199}
          detail: {ar: 'الاقتراح كان كيدخل الشركات الكبرى ديال خدمات الاتصالات وإنتاج الإسمنت فأعلى سعر ديال الضريبة على الشركات، 40%، اللي كيطبقو المشروع على مستوردي وموزعي المحروقات. فرق الأغلبية حتى هي قدمات اقتراح ديال 40% على المحروقات والإسمنت والاتصالات اللي ربحها الصافي 100 مليون درهم فما فوق، وسحباتو.', fr: 'La proposition plaçait les grands opérateurs télécoms et les cimentiers au taux le plus haut de l’impôt sur les sociétés, 40 %, que le projet applique aux importateurs et distributeurs de carburants. Les groupes de la majorité avaient aussi déposé un taux de 40 % pour les carburants, le ciment et les télécoms au bénéfice net de 100 millions de DH ou plus, puis l’ont retiré.'}
          cites: [/ma/code/cgi/art_19]
        - headline: {ar: 'إعفاء القطاني والطماطم المصبرة والضو ديال الدار من القيمة المضافة', fr: 'Exonérer de TVA les légumineuses, la tomate en conserve et l’électricité du foyer'}
          then: {ar: 'معفية', fr: 'exonérées'}
          new: true
          refused: {by: pjd, withdrawn: true, page: 235}
          detail: {ar: 'ثلاثة ديال الاقتراحات: القطاني الجافة (العدس، الحمص، الفول، الفاصوليا)، ومصبرات الطماطم ومركزاتها، وأول 150 كيلوواط ساعة فالشهر ديال الضو ديال الدار على كل عداد، والباقي كيبقى خاضع للسعر ديال المادة 99.', fr: 'Trois propositions : les légumineuses sèches (lentilles, pois chiches, fèves, haricots), les conserves et concentrés de tomate, et les 150 premiers kWh par mois d’électricité domestique par compteur, le reste demeurant au taux de l’article 99.'}
          cites: [/ma/code/cgi/art_91]
        - headline: {ar: 'إعفاء السخانات والأجهزة اللي كتقتصد الما من القيمة المضافة', fr: 'Exonérer de TVA les chauffe-eau et les appareils économes en eau'}
          then: {ar: 'معفية', fr: 'exonérés'}
          new: true
          refused: {by: mp, withdrawn: true, page: 347}
          detail: {ar: 'السخانات والمضخات الحرارية الكهربائية، والتجهيزات المنزلية اللي كتقتصد الما: رؤوس الدوش الذكية، والصنابير اللي كتحس بالحرارة، والغسالات الكهربائية الاقتصادية.', fr: 'Les chauffe-eau et pompes à chaleur électriques, et les équipements ménagers économes en eau : pommeaux de douche intelligents, robinets thermostatiques, lave-linge économes.'}
          cites: [/ma/code/cgi/art_91]
        - headline: {ar: 'ثمن المحروقات فالمحطة', fr: 'Le prix du carburant à la pompe'}
          then: '2'
          unit: {ar: 'درهم أقل فاللتر', fr: 'DH de moins par litre'}
          new: true
          refused: {by: left, vote: [1, 23, 16], page: 448}
          detail: {ar: 'الاقتراح جا فالسطر ديال 40% على مستوردي وموزعي المحروقات اللي ربحهم الصافي 100 مليون درهم فما فوق: يتحيد الدعم الموجه للنقل، وينقص الثمن فمحطات التوزيع بـ2 دراهم للتر.', fr: 'La proposition venait dans la ligne des 40 % sur les importateurs et distributeurs de carburants au bénéfice net de 100 millions de DH ou plus : supprimer le soutien au transport et baisser le prix de 2 DH le litre dans les stations.'}
          cites: [/ma/code/cgi/art_19]
  next: [pages/bill-2027, pages/bill-claims, reform/lf-2027]

- key: bill-claims
  bill: /ma/projet-loi/60-26
  # «قالو | مكتوب» (V13): each claim with its neutral marker (`mark`: as, if, later, not, other; its words) and the text's
  # figure first (`figure`); never «كذب» or «خطأ». `repeated`: the press items (pages/bill-press) that printed it (Y9).
  # A draft, never `open`: it weighs a named minister's figures against the text, so it waits until a person has read
  # each claim against its page (the review desk records that check).
  layout: claims
  reform: lf-2027
  press: bill-press
  title: {ar: 'شنو قالو، وشنو مكتوب', fr: 'Ce qui a été dit, et ce qui est écrit'}
  lead:
    ar: 'الأرقام اللي كتسمع هاد الأيام، كل وحدة بالصفحة اللي قالتها، وحدها المادة والحساب ديالنا بالفرضيات ديالو. حسب النص، ماشي حسب الكلام.'
    fr: 'Les chiffres qu’on entend ces jours-ci, chacun avec la page qui le dit, à côté de l’article et de notre calcul avec ses hypothèses. Selon le texte, pas selon les mots.'
  sections:
    - title: {ar: '«الأجور الصافية اللي تحت 10.000 درهم ما غاديش تخلص الضريبة على الدخل»', fr: '« Les salaires nets sous 10 000 DH seront exonérés »'}
      repeated: [le360-1024, hespress-1025, madar-1023]
      mark: if
      mark_words: {ar: 'بشرط', fr: 'Sous condition'}
      figure: {ar: '9.416 درهم صافي، بثلاثة فتكلفك', fr: '9 416 DH nets, avec trois personnes à charge'}
      source: {name: {ar: 'خطاب وزير الاقتصاد والمالية أمام البرلمان، الصفحة 11 من الملف', fr: 'Discours du ministre de l’Économie et des Finances au Parlement, page 11 du fichier'}, url: 'https://www.finances.gov.ma/Publication/db/2027/DiscoursPLF2027devantlesdeuxChambres.pdf', file: sources/mef/plf2027/DiscoursPLF2027devantlesdeuxChambres.pdf, sha256: cb8fb571874253ea969b35f6bcdfe096c52ae8c90012dbd270e75230560e3ae1}
      facts:
        - text: {ar: 'حسب النص، بالشريحة المعفية 60.000 والمصاريف 45% (35.000 على الأكثر)، الأجير فالضمان الاجتماعي ما كيخلص والو فـ2027 حتى 9.416 درهم صافي (9.909 خام) مع ثلاثة فتكلفو، الفرضية اللي بنا عليها الخطاب أرقامو الأخرى؛ وحتى 7.916 صافي بلا أعباء. الصافي كيوصل 10.000 تقريبا (9.999) غير مع خمسة فتكلفو.', fr: 'Selon le texte, avec la tranche exonérée à 60 000 et les frais à 45 % (35 000 au plus), un salarié CNSS ne paie rien en 2027 jusqu’à 9 416 DH nets (9 909 bruts) avec trois personnes à charge, l’hypothèse des autres chiffres du discours ; jusqu’à 7 916 nets sans charge. Le net n’atteint presque 10 000 (9 999) qu’avec cinq personnes à charge.'}
          cites: [/ma/code/cgi/art_73, /ma/code/cgi/art_59, /ma/code/cgi/art_74]
      tool: tools/bill
    - title: {ar: '«أجر خام ديال 10.506 درهم كيخلص 250 درهم فالشهر، وبالخصوم العائلية كيوصل الصافي لـ10.000»', fr: '« Un salaire brut de 10 506 DH paie 250 DH par mois, et avec les charges de famille le net atteint 10 000 »'}
      repeated: [medias24-1031-lekjaa]
      mark: as
      mark_words: {ar: 'كيفما قال، بخمسة فتكلفو', fr: 'Comme dit, avec cinq personnes à charge'}
      figure: {ar: '249,95 درهم؛ 0 بخمسة فتكلفو', fr: '249,95 DH ; 0 avec cinq personnes à charge'}
      source: {name: {ar: 'جواب الوزير فلجنة المالية، 30 أكتوبر 2026، كما نقلاتو ميدياس24', fr: 'Réponse du ministre à la commission des finances, 30 octobre 2026, rapportée par Médias24'}, url: 'https://medias24.com/2026/10/31/plf-2027-les-reponses-de-lekjaa-a-la-commission-des-finances-1786030/', file: sources/press/plf2027/medias24-1031-lekjaa.html, sha256: f0101a223a1a33349bc6473ed9b12f701af3e752d969672c7e30c64b59ed8e73}
      facts:
        - text: {ar: 'حسب النص، فـ2027: من 10.506 درهم خام كيتنقصو 268,80 للضمان الاجتماعي، و237,44 للتأمين الإجباري الأساسي عن المرض، و2.916,67 للمصاريف المهنية (45%، 35.000 فالعام على الأكثر)؛ كيبقى 7.083,10 فالشهر، وهادي 2.999,43 درهم ديال الضريبة فالعام: 249,95 فالشهر بلا حتى واحد فتكلفك. الخصم العائلي 600 درهم على كل شخص، إذن خاص خمسة باش تولي الضريبة 0 والصافي 9.999,76. اليوم، نفس الأجر كيخلص 711,98 فالشهر بلا حتى واحد فتكلفك.', fr: 'Selon le texte, en 2027 : de 10 506 DH bruts on retire 268,80 de CNSS, 237,44 d’AMO et 2 916,67 de frais professionnels (45 %, au plus 35 000 par an) ; restent 7 083,10 par mois, soit 2 999,43 DH d’impôt par an : 249,95 par mois sans personne à charge. La réduction est de 600 DH par personne : il en faut cinq pour un impôt nul et un net de 9 999,76. Aujourd’hui, le même salaire paie 711,98 par mois sans personne à charge.'}
          cites: [/ma/code/cgi/art_73, /ma/code/cgi/art_59, /ma/code/cgi/art_74, /ma/projet-loi/60-26/art_7]
      tool: tools/bill
    - title: {ar: '«حوالي 500 درهم فالشهر زايدة فـ2027 لأغلب المعنيين»', fr: '« Environ 500 DH de plus par mois en 2027 pour la plupart »'}
      repeated: [le360-1024]
      mark: as
      mark_words: {ar: 'كيفما قالو، فوق 11.800 خام', fr: 'Comme dit, au-delà de 11 800 bruts'}
      figure: {ar: '500 درهم بالضبط', fr: '500 DH exactement'}
      source: {name: {ar: 'خطاب الوزير، الصفحة 11 من الملف', fr: 'Discours du ministre, page 11 du fichier'}, url: 'https://www.finances.gov.ma/Publication/db/2027/DiscoursPLF2027devantlesdeuxChambres.pdf', file: sources/mef/plf2027/DiscoursPLF2027devantlesdeuxChambres.pdf, sha256: cb8fb571874253ea969b35f6bcdfe096c52ae8c90012dbd270e75230560e3ae1}
      facts:
        - text: {ar: 'حسب النص، 500 درهم بالضبط لكل واحد الدخل الصافي الخاضع ديالو فوق 100.000 فالعام (تقريبا 11.800 خام فالشهر)؛ وأقل تحت هاد الحد: 443 درهم لأجر خام ديال 10.000، و331 لأجر ديال 8.374.', fr: 'Selon le texte, exactement 500 DH pour tout revenu net imposable au-dessus de 100 000 par an (environ 11 800 bruts par mois) ; moins en dessous : 443 DH pour un salaire brut de 10 000, 331 pour 8 374.'}
          cites: [/ma/code/cgi/art_73, /ma/code/cgi/art_247]
      tool: tools/bill
    - title: {ar: '«1.186 درهم فالشهر لأجر ديال 11.829، و3.079 لأجر ديال 18.737»', fr: '« 1 186 DH par mois pour un salaire de 11 829, 3 079 pour 18 737 »'}
      mark: as
      mark_words: {ar: 'كيفما قالو، لأجير بثلاثة فتكلفو', fr: 'Comme dit, pour un salarié avec trois personnes à charge'}
      figure: {ar: '1.186 و3.079 درهم فـ2031', fr: '1 186 et 3 079 DH en 2031'}
      source: {name: {ar: 'خطاب الوزير، الصفحة 12 من الملف', fr: 'Discours du ministre, page 12 du fichier'}, url: 'https://www.finances.gov.ma/Publication/db/2027/DiscoursPLF2027devantlesdeuxChambres.pdf', file: sources/mef/plf2027/DiscoursPLF2027devantlesdeuxChambres.pdf, sha256: cb8fb571874253ea969b35f6bcdfe096c52ae8c90012dbd270e75230560e3ae1}
      facts:
        - text: {ar: 'حسب النص، الرقمين كيخرجو بالضبط لأجير فالضمان الاجتماعي عندو ثلاثة فتكلفو، والأجر اللي كيذكر الخطاب هو الصافي ديال اليوم: أجر خام ديال 14.000 درهم (صافي 11.829) كيربح 1.186 فالشهر فـ2031، وأجر خام ديال 25.000 (صافي 18.737) كيربح 3.079. فـ2027 بجوج كيربحو 500 درهم.', fr: 'Selon le texte, les deux chiffres se retrouvent exactement pour un salarié CNSS avec trois personnes à charge, le salaire cité étant le net d’aujourd’hui : 14 000 DH bruts (11 829 nets) gagnent 1 186 DH par mois en 2031, 25 000 bruts (18 737 nets) 3 079 DH. En 2027, les deux gagnent 500 DH.'}
          cites: [/ma/code/cgi/art_73, /ma/code/cgi/art_74, /ma/code/cgi/art_247]
      tool: tools/bill
    - title: {ar: '«السعر الأعلى كينزل من 37% لـ30%»', fr: '« Le taux supérieur passe de 37 % à 30 % »'}
      repeated: [skynews-1024, hespress-1025]
      mark: later
      mark_words: {ar: 'فوقت آخر', fr: 'Plus tard'}
      figure: {ar: 'فـ2030 و2031', fr: 'En 2030 et 2031'}
      source: {name: {ar: 'خطاب الوزير، الصفحة 11 من الملف', fr: 'Discours du ministre, page 11 du fichier'}, url: 'https://www.finances.gov.ma/Publication/db/2027/DiscoursPLF2027devantlesdeuxChambres.pdf', file: sources/mef/plf2027/DiscoursPLF2027devantlesdeuxChambres.pdf, sha256: cb8fb571874253ea969b35f6bcdfe096c52ae8c90012dbd270e75230560e3ae1}
      facts:
        - text: {ar: 'حسب النص، فـ2030 و2031. 37% كيبقى فـ2027 و2028، و35% فـ2029، و30% فوق 200.000 فـ2030 وفوق 500.000 من 2031.', fr: 'Selon le texte, en 2030 et 2031. 37 % reste en 2027 et 2028, 35 % en 2029, 30 % au-delà de 200 000 en 2030 et au-delà de 500 000 dès 2031.'}
          cites: [/ma/code/cgi/art_73, /ma/code/cgi/art_247]
    - title: {ar: '«المعاش الأدنى 3.000 درهم، و1.700 فـ2027، والأرامل 100%»', fr: '« Pension minimale à 3 000 DH, 1 700 en 2027, veuves à 100 % »'}
      repeated: [le360-1024, madar-1023, medias24-1031-lekjaa, leseco-1030-social]
      mark: not
      mark_words: {ar: 'ماشي فالمشروع', fr: 'Pas dans le projet'}
      figure: {ar: 'معلن', fr: 'Annoncé'}
      source: {name: {ar: 'خطاب الوزير، الصفحة 12 من الملف', fr: 'Discours du ministre, page 12 du fichier'}, url: 'https://www.finances.gov.ma/Publication/db/2027/DiscoursPLF2027devantlesdeuxChambres.pdf', file: sources/mef/plf2027/DiscoursPLF2027devantlesdeuxChambres.pdf, sha256: cb8fb571874253ea969b35f6bcdfe096c52ae8c90012dbd270e75230560e3ae1}
      facts:
        - text: {ar: 'حسب النص، ما كاينش فمواد المشروع. خاص نص ديالو (مرسوم، أنظمة صناديق التقاعد) باش يولي قاعدة.', fr: 'Selon le texte, ce n’est pas dans les articles du projet. Il faudra un texte à part (un décret, les règles des caisses de retraite) pour que cela devienne une règle.'}
          cites: []
      more: reform/announced-pensions
    - title: {ar: '«الدولة كتخلص كل فاتورة ضو ديال 100 درهم ولا أقل»', fr: '« L’État paie toute facture d’électricité de 100 DH ou moins »'}
      repeated: [le360-1024, medias24-1031-lekjaa]
      mark: not
      mark_words: {ar: 'ماشي فالمشروع', fr: 'Pas dans le projet'}
      figure: {ar: 'معلن', fr: 'Annoncé'}
      source: {name: {ar: 'خطاب الوزير، الصفحة 12 من الملف', fr: 'Discours du ministre, page 12 du fichier'}, url: 'https://www.finances.gov.ma/Publication/db/2027/DiscoursPLF2027devantlesdeuxChambres.pdf', file: sources/mef/plf2027/DiscoursPLF2027devantlesdeuxChambres.pdf, sha256: cb8fb571874253ea969b35f6bcdfe096c52ae8c90012dbd270e75230560e3ae1}
      facts:
        - text: {ar: 'حسب النص، ما كاينة حتى مادة. هادي نفقة، وكيفاش ومن امتى ما مكتوبش فالمشروع.', fr: 'Selon le texte, aucun article. C’est une dépense ; comment et à partir de quand, le projet ne l’écrit pas.'}
          cites: []
      more: reform/announced-electricity
    - title: {ar: '«النمو 4,7%»', fr: '« Une croissance de 4,7 % »'}
      mark: other
      mark_words: {ar: 'رقم آخر', fr: 'Un autre chiffre'}
      figure: {ar: '3,7%', fr: '3,7 %'}
      source: {name: {ar: 'مذكرة تقديم المشروع، الصفحة 26', fr: 'Note de présentation du projet, page 26'}, url: 'https://www.finances.gov.ma/Publication/db/2027/Note-presentation_Fr.pdf', file: sources/mef/plf2027/Note-presentation_Fr.pdf, sha256: 8b5653939c7f0ad6ffebd2e7f697b9a2620ec0f03598aae64828c53ceabc2459}
      facts:
        - text: {ar: 'حسب المذكرة، النمو المعتمد لـ2027 هو 3,7%. الرقم 4,7% اللي كيدور فبعض المقالات هو التضخم العالمي اللي كتذكرو المذكرة.', fr: 'Selon la note, la croissance retenue pour 2027 est de 3,7 %. Le 4,7 % repris par certains articles est l’inflation mondiale que la note cite.'}
          cites: []
    - title: {ar: '«الدعم الاجتماعي المباشر من 500 لـ1.000 درهم»', fr: '« L’aide sociale directe de 500 à 1 000 DH »'}
