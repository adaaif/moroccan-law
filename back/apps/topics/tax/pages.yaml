# The tax topic's pages (the tax review, T19, T20, T22): facts, each on its articles, from the DGI's 2026 edition
# of the code (unofficial; the BO prevails), finance laws 60.24 and 50.25, and law 47.06 for the communes' taxes. Who
# taxes what is said once: the code is the State's, 47.06 the communes'. A page says whom it is for (`for`).

- key: map
  title: {ar: 'المدونة العامة للضرائب بكلمات الناس', fr: 'Le Code général des impôts, en mots de tous les jours'}
  lead:
    ar: 'المدونة ديال الدولة فيها ثلاثة أجزاء: الضرائب، والإجراءات، والواجبات والرسوم الأخرى. والجماعة عندها قانونها: القانون 47.06 (رسم السكن، رسم الخدمات، الأراضي غير المبنية، الرسم المهني).'
    fr: 'Le code de l’État a trois livres : les impôts, les procédures, les droits et autres taxes. La commune a sa loi : la loi 47.06 (taxe d’habitation, de services communaux, sur les terrains non bâtis, taxe professionnelle).'
  sections:
    - title: {ar: 'الأجر والمعاش والكراء والمدخرات: الضريبة على الدخل', fr: 'Salaire, pension, loyers, épargne : l’impôt sur le revenu'}
      facts:
        - text: {ar: 'الضريبة على الدخل كتشمل الدخول المهنية والفلاحية، والأجور والمعاشات، والدخول والأرباح العقارية، ودخول رؤوس الأموال المنقولة.', fr: 'L’impôt sur le revenu porte sur les revenus professionnels et agricoles, les salaires et pensions, les revenus et profits fonciers, les revenus de capitaux mobiliers.'}
          cites: [/ma/code/cgi/art_21, /ma/code/cgi/art_22]
        - text: {ar: 'الأجر: المواد 56 حتى 60؛ الجدول: المادة 73؛ الأعباء العائلية: المادة 74؛ التصريح: المادتان 82 و86.', fr: 'Le salaire : articles 56 à 60 ; le barème : article 73 ; les charges de famille : article 74 ; la déclaration : articles 82 et 86.'}
          cites: [/ma/code/cgi/art_56, /ma/code/cgi/art_59, /ma/code/cgi/art_73, /ma/code/cgi/art_74, /ma/code/cgi/art_82]
        - text: {ar: 'الكراء وبيع العقار: المواد 61 حتى 65، والمادة 144-II للحد الأدنى.', fr: 'Les loyers et la vente d’un bien : articles 61 à 65, et l’article 144-II pour le minimum.'}
          cites: [/ma/code/cgi/art_61, /ma/code/cgi/art_63, /ma/code/cgi/art_64, /ma/code/cgi/art_65, /ma/code/cgi/art_144]
    - title: {ar: 'الشراء والهبة والفينييت: الواجبات والرسوم', fr: 'Achat, donation, vignette : les droits et taxes'}
      facts:
        - text: {ar: 'واجبات التسجيل على العقود (المواد 126 حتى 143)، وواجبات التمبر (المواد 249 حتى 258)، والضريبة الخصوصية السنوية على المركبات (المواد 259 حتى 266).', fr: 'Les droits d’enregistrement des actes (articles 126 à 143), les droits de timbre (articles 249 à 258), la taxe spéciale annuelle sur les véhicules (articles 259 à 266).'}
          cites: [/ma/code/cgi/art_133, /ma/code/cgi/art_252, /ma/code/cgi/art_262]
    - title: {ar: 'الشركات: الضريبة على الشركات والقيمة المضافة', fr: 'Les sociétés : IS et TVA'}
      facts:
        - text: {ar: 'الضريبة على الشركات: المواد 1 حتى 20؛ الضريبة على القيمة المضافة: المواد 87 حتى 125.', fr: 'L’impôt sur les sociétés : articles 1 à 20 ; la TVA : articles 87 à 125.'}
          cites: [/ma/code/cgi/art_19, /ma/code/cgi/art_99]
    - title: {ar: 'إلا ما تحلاتش: المراقبة والتظلم والجزاءات', fr: 'Quand ça se passe mal : contrôle, réclamation, sanctions'}
      facts:
        - text: {ar: 'الجزاءات: المواد 184 حتى 208؛ المراقبة والتصحيح: المواد 210 حتى 234؛ التظلم والاسترداد والمحكمة: المواد 235 حتى 243.', fr: 'Les sanctions : articles 184 à 208 ; le contrôle et la rectification : articles 210 à 234 ; la réclamation, la restitution et le juge : articles 235 à 243.'}
          cites: [/ma/code/cgi/art_184, /ma/code/cgi/art_208, /ma/code/cgi/art_220, /ma/code/cgi/art_235, /ma/code/cgi/art_241-bis]
    - title: {ar: 'الجماعة: الدار والأرض والمحل', fr: 'La commune : le logement, le terrain, le local'}
      facts:
        - text: {ar: 'رسم السكن (المواد 19 حتى 31)، ورسم الخدمات الجماعية (المواد 33 حتى 38)، والرسم على الأراضي الحضرية غير المبنية (المواد 39 حتى 48)؛ وكلها كتتفرض باسم المالك.', fr: 'La taxe d’habitation (articles 19 à 31), la taxe de services communaux (33 à 38), la taxe sur les terrains urbains non bâtis (39 à 48) ; toutes établies au nom du propriétaire.'}
          cites: [/ma/loi/47-06/art_20, /ma/loi/47-06/art_33, /ma/loi/47-06/art_39]

- key: beliefs
  title: {ar: 'ما يقال، وما تقوله المدونة', fr: 'Ce qu’on entend, et ce que dit le code'}
  lead:
    ar: 'جمل كيسمعها كل واحد على الضريبة، وكل وحدة بجانب المادة اللي كتجاوب عليها.'
    fr: 'Des phrases que chacun entend sur l’impôt, chacune à côté de l’article qui y répond.'
  sections:
    - title: {ar: '«إلا زادت ليا الأجرة نقدر نخسر»', fr: '« Une augmentation peut me faire perdre de l’argent »'}
      facts:
        - text: {ar: 'الجدول كيطبق شريحة بشريحة: كل جزء من الدخل كيتخلص بسعر الشريحة ديالو. الدرهم اللي كيفوت العتبة وحدو كيتخلص بالسعر الأعلى، والباقي ما كيتبدلش؛ إذن الصافي ديما كيزيد ملي كتزيد الأجرة.', fr: 'Le barème s’applique tranche par tranche : chaque part du revenu paie le taux de sa tranche. Seul le dirham au-dessus du seuil paie le taux supérieur, le reste ne change pas ; le net augmente donc toujours avec le salaire.'}
          cites: [/ma/code/cgi/art_73]
      tool: tools/salary
    - title: {ar: '«المعاش ما فيهش الضريبة»', fr: '« La pension n’est pas imposée »'}
      facts:
        - text: {ar: 'منذ فاتح يناير 2026 معاشات أنظمة التقاعد الأساسي معفية، وكذلك معاشات عقود التقاعد التكميلي الجماعية للقطاع الخاص عند الصندوق المهني المغربي للتقاعد بشروطها؛ المعاشات التكميلية الأخرى كتخلص بعد الإسقاط.', fr: 'Depuis le 1er janvier 2026, les pensions des régimes de base sont exonérées, comme celles des contrats de retraite complémentaire de groupe du privé servies par la CIMR, à leurs conditions ; les autres pensions complémentaires sont imposées après abattement.'}
          cites: [/ma/code/cgi/art_57, /ma/code/cgi/art_60]
      tool: tools/pension
    - title: {ar: '«رسم السكن كيخلصو الكاري»', fr: '« La taxe d’habitation, c’est le locataire qui la paie »'}
      facts:
        - text: {ar: 'رسم السكن كيتفرض باسم المالك ولا صاحب حق الانتفاع، ولا باسم الحائز إلا ما عرفناش المالك؛ وكيتفرض على السكن اللي كيسكن فيه المالك ولا اللي عطاه مجانا لزوجه ولا أصوله ولا فروعه.', fr: 'La taxe d’habitation est établie au nom du propriétaire ou de l’usufruitier, ou du possesseur si le propriétaire est inconnu ; elle frappe le logement que le propriétaire occupe ou laisse gratuitement à son conjoint, ses ascendants ou descendants.'}
          cites: [/ma/loi/47-06/art_19, /ma/loi/47-06/art_20]
      tool: tools/local
    - title: {ar: '«بعت الدار ديالي، ما عليا والو»', fr: '« J’ai vendu ma maison, je ne dois rien »'}
      facts:
        - text: {ar: 'الربح على بيع السكن الرئيسي معفي إلا كنتي ساكن فيه خمس سنين على الأقل نهار البيع، مرة وحدة فداك الخمس سنين؛ والثمن اللي فوق 4 ملايين درهم كتخلص عليه 3% على الأقل.', fr: 'Le profit sur la vente de l’habitation principale est exonéré après au moins cinq ans d’occupation au jour de la vente, une seule fois sur ces cinq ans ; au-delà de 4 millions de dirhams de prix, 3 % restent dus sur l’excédent.'}
          cites: [/ma/code/cgi/art_63, /ma/code/cgi/art_144]
        - text: {ar: 'وخارج هاد الحالة، الضريبة 20% من الربح وما تقلش على 3% من الثمن ولو ما ربحتي والو؛ والتصريح والأداء داخل 30 يوما.', fr: 'Hors ce cas, l’impôt est de 20 % du profit et jamais moins de 3 % du prix, même sans profit ; déclaration et paiement dans les 30 jours.'}
          cites: [/ma/code/cgi/art_73, /ma/code/cgi/art_144, /ma/code/cgi/art_83]
      tool: tools/sell
    - title: {ar: '«الأجير ديما خاصو يصرح»', fr: '« Un salarié doit toujours déclarer »'}
      facts:
        - text: {ar: 'اللي عندو غير أجر واحد كيحجز عليه المشغل الضريبة ما مطلوبش منو التصريح، إلا بغا يستافد من الخصومات ولا شاف راسو خلص أكثر من اللازم.', fr: 'Qui n’a qu’un salaire retenu à la source par un seul employeur n’a pas à déclarer, sauf pour obtenir une déduction ou s’il s’estime surtaxé.'}
          cites: [/ma/code/cgi/art_86]
      to: journeys/declare

- key: calendar
  title: {ar: 'الآجال ديال العام', fr: 'Les échéances de l’année'}
  lead:
    ar: 'كل أجل بالمادة ديالو. من بعد الأجل كتزاد الزيادة، وفالأداء المتأخر الذعيرة والزيادة شهر بشهر.'
    fr: 'Chaque échéance avec son article. Passé le délai, la majoration s’ajoute ; pour un paiement tardif, la pénalité et la majoration mois par mois.'
  sections:
    - title: {ar: 'يناير', fr: 'Janvier'}
      facts:
        - text: {ar: 'الفينييت ديال العام كتتخلص فشهر يناير؛ والطوموبيل اللي دخلات للطريق خلال العام داخل 60 يوما من وصل إيداع ملف البطاقة الرمادية.', fr: 'La vignette de l’année se paie en janvier ; un véhicule mis en circulation en cours d’année, dans les 60 jours du récépissé du dossier de carte grise.'}
          cites: [/ma/code/cgi/art_261]
    - title: {ar: 'قبل فاتح مارس', fr: 'Avant le 1er mars'}
      facts:
        - text: {ar: 'التصريح بالدخل الإجمالي ديال العام اللي فات، لكل دخل ماشي دخل مهني: الكراء، أكثر من أجر، معاش تكميلي من عدة جهات فوق العتبة…', fr: 'La déclaration du revenu global de l’année passée, pour tout revenu autre que professionnel : loyers, plusieurs salaires, pensions complémentaires de plusieurs débirentiers au-delà du seuil…'}
          cites: [/ma/code/cgi/art_82, /ma/code/cgi/art_86]
        - text: {ar: 'الإقرار بالأراضي الحضرية غير المبنية، ولو معفية، وأداء رسمها للجماعة.', fr: 'La déclaration des terrains urbains non bâtis, même exonérés, et le paiement de leur taxe à la commune.'}
          cites: [/ma/loi/47-06/art_46, /ma/loi/47-06/art_47]
    - title: {ar: 'قبل فاتح ماي', fr: 'Avant le 1er mai'}
      facts:
        - text: {ar: 'التصريح بالدخل المهني المحدد حسب نظام النتيجة الصافية الحقيقية ولا المبسطة.', fr: 'La déclaration des revenus professionnels déterminés au résultat net réel ou simplifié.'}
          cites: [/ma/code/cgi/art_82]
    - title: {ar: 'كل شهر ولا كل ربع', fr: 'Chaque mois ou chaque trimestre'}
      facts:
        - text: {ar: 'المقاول الذاتي كيصرح برقم المعاملات ويخلص قبل نهاية الشهر اللي من بعد الشهر ولا الربع اللي تحصل فيه.', fr: 'L’auto-entrepreneur déclare son chiffre d’affaires et paie avant la fin du mois qui suit le mois ou le trimestre d’encaissement.'}
          cites: [/ma/code/cgi/art_82-bis]
    - title: {ar: 'من نهار العقد', fr: 'À compter de l’acte'}
      facts:
        - text: {ar: 'بيع عقار: التصريح بالربح وأداء الضريبة داخل 30 يوما من البيع.', fr: 'Vente d’un bien : déclaration du profit et paiement dans les 30 jours de la cession.'}
          cites: [/ma/code/cgi/art_83, /ma/code/cgi/art_173]
        - text: {ar: 'شراء ولا هبة: تسجيل العقد وأداء الواجبات داخل 30 يوما من تاريخه.', fr: 'Achat ou donation : enregistrement de l’acte et paiement des droits dans les 30 jours de sa date.'}
          cites: [/ma/code/cgi/art_128]
    - title: {ar: 'إلا فات الأجل', fr: 'Une fois le délai passé'}
      facts:
        - text: {ar: 'التصريح المتأخر: 5% داخل 30 يوما، و15% من بعد، و20% إلا فرضاتها الإدارة تلقائيا.', fr: 'La déclaration tardive : 5 % sous 30 jours, 15 % ensuite, 20 % en cas d’imposition d’office.'}
          cites: [/ma/code/cgi/art_184]
        - text: {ar: 'الأداء المتأخر: ذعيرة 10% (5% داخل 30 يوما)، و5% عن الشهر الأول و0,5% عن كل شهر من بعد.', fr: 'Le paiement tardif : pénalité de 10 % (5 % sous 30 jours), 5 % le premier mois et 0,5 % par mois ensuite.'}
          cites: [/ma/code/cgi/art_208]
      tool: tools/late

- key: savings
  title: {ar: 'الفوائد والأسهم والادخار', fr: 'Intérêts, actions, épargne'}
  lead:
    ar: 'دخول المدخرات كتتحجز عليها الضريبة فالمنبع بسعر إبرائي: البنك ولا الوسيط كيخلصها، وما كتزادش للتصريح.'
    fr: 'Les revenus de l’épargne sont retenus à la source à un taux libératoire : la banque ou l’intermédiaire paie, rien à ajouter à la déclaration.'
  sections:
    - title: {ar: 'الفوائد والأرباح الموزعة', fr: 'Intérêts et dividendes'}
      facts:
        - text: {ar: 'فوائد الودائع والسندات ديال شخص ذاتي: 30%. الأرباح الموزعة على الأسهم: 10%.', fr: 'Les intérêts de dépôts et d’obligations d’une personne physique : 30 %. Les dividendes : 10 %.'}
          cites: [/ma/code/cgi/art_73]
        - text: {ar: 'فوائد دفاتر صندوق التوفير الوطني معفية.', fr: 'Les intérêts des livrets de la Caisse d’épargne nationale sont exonérés.'}
          cites: [/ma/code/cgi/art_68]
    - title: {ar: 'بيع الأسهم', fr: 'Vendre des actions'}
      facts:
        - text: {ar: 'الربح على الأسهم المدرجة فالبورصة: 15%؛ على الأسهم غير المدرجة: 20%. والبيوع اللي ما كتفوتش 30.000 درهم فالعام معفية.', fr: 'Le profit sur des actions cotées : 15 % ; sur des actions non cotées : 20 %. Les cessions qui ne dépassent pas 30 000 dirhams dans l’année sont exonérées.'}
          cites: [/ma/code/cgi/art_73, /ma/code/cgi/art_68]
    - title: {ar: 'مخططات الادخار', fr: 'Les plans d’épargne'}
      facts:
        - text: {ar: 'مخطط الادخار السكني: فوائده معفية إلا كانت الفلوس لشراء ولا بناء السكن الرئيسي وبقات ثلاث سنين على الأقل، والدفوعات ما فاتتش 400.000 درهم.', fr: 'Le plan d’épargne logement : intérêts exonérés si l’épargne va à l’achat ou la construction de l’habitation principale, gardée trois ans au moins, versements jusqu’à 400 000 dirhams.'}
          cites: [/ma/code/cgi/art_68]
        - text: {ar: 'مخطط الادخار للتعليم: خمس سنين على الأقل و300.000 درهم على كل ولد؛ ومخطط الادخار فالأسهم: خمس سنين على الأقل.', fr: 'Le plan d’épargne éducation : cinq ans au moins et 300 000 dirhams par enfant ; le plan d’épargne en actions : cinq ans au moins.'}
          cites: [/ma/code/cgi/art_68]

- key: gift
  title: {ar: 'الهبة والإرث', fr: 'Donation et héritage'}
  lead:
    ar: 'الهبة بين الأقارب القريبين ما فيهاش ضريبة على الربح، وفيها واجبات تسجيل قليلة. والإرث نفسه ما فيه حتى ضريبة؛ البيع من بعد هو اللي فيه.'
    fr: 'La donation entre proches parents ne paie pas d’impôt sur le profit, et peu de droits d’enregistrement. L’héritage lui-même n’est pas imposé ; c’est la vente ensuite qui l’est.'
  sections:
    - title: {ar: 'الهبة فالعائلة', fr: 'La donation en famille'}
      facts:
        - text: {ar: 'الهبة ديال عقار بين الأصول والفروع، والأزواج، والإخوة والأخوات، وبين الكافل والطفل المكفول: معفية من الضريبة على الربح.', fr: 'La donation d’un bien entre ascendants et descendants, époux, frères et sœurs, et entre le kafil et l’enfant recueilli : exonérée de l’impôt sur le profit.'}
          cites: [/ma/code/cgi/art_63]
        - text: {ar: 'واجبات التسجيل على هاد الهبة: 1,5%، داخل 30 يوما من العقد.', fr: 'Les droits d’enregistrement sur cette donation : 1,5 %, dans les 30 jours de l’acte.'}
          cites: [/ma/code/cgi/art_133, /ma/code/cgi/art_128]
    - title: {ar: 'بيع عقار ورثتيه', fr: 'Vendre un bien hérité'}
      facts:
        - text: {ar: 'ثمن الشرا اللي كيتحسب بيه الربح هو قيمة العقار نهار الوفاة، كما كتبوها الورثة فالجرد، ولا كما صرحتي بيها.', fr: 'Le prix d’acquisition retenu pour le profit est la valeur du bien au jour du décès, inscrite à l’inventaire des héritiers, ou déclarée.'}
          cites: [/ma/code/cgi/art_65]
        - text: {ar: 'بيع حصص مشاعة فأرض فلاحية خارج المدار الحضري بين الورثة: معفي.', fr: 'La cession de droits indivis sur des terres agricoles hors périmètre urbain entre cohéritiers : exonérée.'}
          cites: [/ma/code/cgi/art_63]
      tool: tools/sell

- key: abroad
  title: {ar: 'ساكن فالخارج', fr: 'Vous vivez à l’étranger'}
  for: [abroad]
  lead:
    ar: 'الضريبة المغربية كتتبع الموطن الضريبي: اللي موطنه فالمغرب كيخلص على كلشي، واللي لا كيخلص غير على اللي مصدره المغرب، مع الاتفاقيات الضريبية.'
    fr: 'L’impôt marocain suit le domicile fiscal : domicilié au Maroc, on est imposé sur tout ; sinon, sur la source marocaine seulement, conventions fiscales réservées.'
  sections:
    - title: {ar: 'الموطن الضريبي', fr: 'Le domicile fiscal'}
      facts:
        - text: {ar: 'عندك موطن ضريبي فالمغرب إلا كان فيه السكن الدائم ديالك، ولا مركز المصالح الاقتصادية ديالك، ولا إلا فاتت الإقامة ديالك فيه 183 يوما فكل 365 يوما.', fr: 'Votre domicile fiscal est au Maroc s’il y a votre foyer permanent, le centre de vos intérêts économiques, ou si vous y séjournez plus de 183 jours sur 365.'}
          cites: [/ma/code/cgi/art_23]
        - text: {ar: 'الاتفاقيات لتفادي الازدواج الضريبي كتقرر شكون عندو الحق يفرض الضريبة على شي دخل.', fr: 'Les conventions contre la double imposition décident quel État peut imposer tel revenu.'}
          cites: [/ma/code/cgi/art_23]
    - title: {ar: 'الدار اللي فالمغرب', fr: 'Le logement au Maroc'}
      facts:
        - text: {ar: 'المسكن اللي كيحتفظ بيه المغاربة المقيمين بالخارج كسكن رئيسي ليهم فالمغرب، ولا اللي ساكنين فيه مجانا الزوج ولا الوالدين ولا الأولاد: كيستافد من إعفاء الربح عند البيع بشروطه.', fr: 'Le logement que les Marocains résidant à l’étranger gardent comme habitation principale au Maroc, ou qu’occupent gratuitement leur conjoint, parents ou enfants : exonéré du profit à la vente, à ses conditions.'}
          cites: [/ma/code/cgi/art_63]
        - text: {ar: 'ولرسم السكن، نفس الدار كتستافد من إسقاط 75%.', fr: 'Pour la taxe d’habitation, ce même logement bénéficie de l’abattement de 75 %.'}
          cites: [/ma/loi/47-06/art_24]
    - title: {ar: 'معاش من الخارج', fr: 'Une pension de l’étranger'}
      facts:
        - text: {ar: 'اللي موطنه فالمغرب وكيتقاضى معاش من الخارج كيستافد من تخفيض 80% من الضريبة على الجزء اللي كيحولو نهائيا بالدرهم غير القابل للتحويل.', fr: 'Domicilié au Maroc avec une pension de source étrangère, vous bénéficiez d’une réduction de 80 % de l’impôt sur la part transférée à titre définitif en dirhams non convertibles.'}
          cites: [/ma/code/cgi/art_76]

- key: business
  title: {ar: 'للشركات: الأساسي', fr: 'Pour les entreprises : l’essentiel'}
  for: [company, self]
  lead:
    ar: 'صفحة قصيرة، كتكبر مع الوقت: الأسعار والآجال الأساسية، وكل سطر بالمادة ديالو.'
    fr: 'Une page courte, qui s’enrichira : les taux et échéances essentiels, chaque ligne avec son article.'
  sections:
    - title: {ar: 'الضريبة على الشركات', fr: 'L’impôt sur les sociétés'}
      facts:
        - text: {ar: 'السعر 20%، و35% للشركات اللي ربحها الصافي كيوصل 100 مليون درهم ولا كيفوتها، مع استثناءات المادة 19.', fr: 'Le taux est de 20 %, et de 35 % pour un bénéfice net de 100 millions de dirhams ou plus, sauf les exceptions de l’article 19.'}
          cites: [/ma/code/cgi/art_19]
        - text: {ar: 'المساهمة الدنيا: حد أدنى كتخلصو الشركة ولو ما ربحاتش.', fr: 'La cotisation minimale : un minimum dû même sans bénéfice.'}
          cites: [/ma/code/cgi/art_144]
    - title: {ar: 'الضريبة على القيمة المضافة', fr: 'La TVA'}
      facts:
        - text: {ar: 'السعر العادي 20%، وأسعار مخفضة لعمليات معينة (10% للفندقة والمطاعم مثلا).', fr: 'Le taux normal est de 20 %, avec des taux réduits pour certaines opérations (10 % pour l’hébergement et la restauration, par exemple).'}
          cites: [/ma/code/cgi/art_99]
        - text: {ar: 'التصريح شهريا ولا كل ربع حسب رقم المعاملات.', fr: 'La déclaration est mensuelle ou trimestrielle selon le chiffre d’affaires.'}
          cites: [/ma/code/cgi/art_108, /ma/code/cgi/art_110, /ma/code/cgi/art_111]
    - title: {ar: 'خدام بحسابك', fr: 'À votre compte'}
      facts:
        - text: {ar: 'المقاول الذاتي: 0,5% ولا 1% من رقم المعاملات المحصل، فحدود 500.000 ولا 200.000 درهم، مع الانخراط فالضمان الاجتماعي.', fr: 'L’auto-entrepreneur : 0,5 % ou 1 % du chiffre d’affaires encaissé, dans la limite de 500 000 ou 200 000 dirhams, avec l’adhésion à la sécurité sociale.'}
          cites: [/ma/code/cgi/art_42-ter, /ma/code/cgi/art_73]
        - text: {ar: 'المساهمة المهنية الموحدة: 10% على الدخل المحسوب بمعامل المهنة من رقم المعاملات، حتى مليونين درهم للتجارة و500.000 للخدمات.', fr: 'La contribution professionnelle unique : 10 % du revenu tiré du chiffre d’affaires par le coefficient de la profession, jusqu’à 2 millions de dirhams pour le commerce et 500 000 pour les services.'}
          cites: [/ma/code/cgi/art_40, /ma/code/cgi/art_41, /ma/code/cgi/art_73]
      tool: tools/own
    - title: {ar: 'الرسم المهني', fr: 'La taxe professionnelle'}
      facts:
        - text: {ar: 'الجماعة كتفرض الرسم المهني على كل نشاط مهني، ورسم الخدمات الجماعية على المحلات.', fr: 'La commune perçoit la taxe professionnelle sur toute activité professionnelle, et la taxe de services communaux sur les locaux.'}
          cites: [/ma/loi/47-06/art_5, /ma/loi/47-06/art_33]
    # P14: what the 2027 bill would change for a business, said as a bill (each line its date).
    - title: {ar: 'فمشروع قانون المالية 2027 (مشروع، ماشي قانون)', fr: 'Dans le projet de loi de finances 2027 (un projet, pas une loi)'}
      bill: /ma/projet-loi/60-26
      facts:
        - text: {ar: 'التجار اللي كيستوردو باش يبيعو بحالتها: تسبيق 3% من القيمة الجمركية على كل استيراد (المشروع كما أودع كان كاتب 5%؛ لجنة المالية بمجلس النواب نقصاتو)، من 1 يوليوز 2027، لمدة 36 شهر، ومن بعد غير بلا شهادة الإبراء الضريبي عندها أقل من 30 يوم؛ كيتخصم من الضريبة.', fr: 'Les commerçants qui importent pour revendre en l’état : une avance de 3 % de la valeur en douane sur chaque importation (le projet déposé écrivait 5 % ; la commission des finances de la Chambre des représentants l’a baissée), dès le 1er juillet 2027, pendant 36 mois, puis seulement sans attestation de régularité fiscale de moins de 30 jours ; imputée sur l’impôt.'}
          cites: [/ma/code/cgi/art_170, /ma/code/cgi/art_173, /ma/projet-loi/60-26/art_7]
        - text: {ar: 'مستوردو وموزعو المحروقات: 40% على ربح صافي من 100 مليون درهم فما فوق، على السنوات المحاسبية اللي كتبدا من 2027.', fr: 'Les importateurs et distributeurs de carburants : 40 % sur un bénéfice net de 100 millions de DH ou plus, pour les exercices ouverts dès 2027.'}
          cites: [/ma/code/cgi/art_19, /ma/projet-loi/60-26/art_7]
        - text: {ar: 'تجار العقارات المبنية: اختيار أداء القيمة المضافة على الهامش وخصم القيمة المضافة ديال أشغال الترميم، على البيوعات من 1 يوليوز 2027.', fr: 'Les marchands de biens immeubles bâtis : l’option de la TVA sur la marge, avec déduction de la TVA sur les travaux de rénovation, pour les ventes dès le 1er juillet 2027.'}
          cites: [/ma/code/cgi/art_90, /ma/code/cgi/art_96, /ma/projet-loi/60-26/art_7]
        - text: {ar: 'اللي خدام بلا تسجيل: اللي تسجل فالرسم المهني فـ2027 ولا 2028 كيتحاسب غير من نهار تسجل (المشروع كما أودع كان كيعطي 2027 بوحدو؛ النواب زادو عام).', fr: 'Qui travaille sans être inscrit : qui s’inscrit à la taxe professionnelle en 2027 ou en 2028 n’est imposé qu’à partir de cette date (le projet déposé ne donnait que 2027 ; les députés ajoutent un an).'}
          cites: [/ma/code/cgi/art_247, /ma/projet-loi/60-26/art_7]
        - text: {ar: 'الطعون أمام اللجان والمساطر ديال المراقبة كتبدل فبعض الآجال والقواعد، على اللي كيبدا من 2027.', fr: 'Les recours devant les commissions et les procédures de contrôle changent sur certains délais et règles, pour ce qui commence dès 2027.'}
          cites: [/ma/code/cgi/art_220, /ma/code/cgi/art_225, /ma/code/cgi/art_222, /ma/code/cgi/art_228, /ma/projet-loi/60-26/art_7]
      more: pages/bill-2027

# The 2027 finance bill (the finance-bill review, P5, P7, P9, P12–P15; 26 Oct 2026). A page with `bill` speaks
# of a bill, never of law: the web draws the bill's band above it. Every line names the bill's article and the code's
# article it would change; the dates are the bill's own (its art. 7-IV). Owner-provisional until a person checks it,
# the claims page by two (P23).
- key: bill-2027
  bill: /ma/projet-loi/60-26
  # The bill-page review (V1–V12, 26 Oct 2026): the changes as data, drawn as amendment lines (`then` the bill's
  # figure, `now` today's, `from` the bill's date of effect, `when` said otherwise, `check` a date a person must confirm,
  # `announced` not in the bill at all), a section per reader (`for` the topic's answers; none: everyone), the reader's
  # own first. `detail` is the sentence the row stands on; `cites` the code's articles only, since every change here is
  # in the bill's article 7 (said once, in the lead: V5). `calendar` is the bill's own dates of effect (V7).
  layout: changes
  reform: lf-2027
  # The Chamber-vote update (15 Nov 2026): the page opens on the Chamber's vote.
  chamber: vote
  # The committee's report, second part: the amendments, their votes and the final wording of each amended article. A
  # row's `amended.page` opens it there. The text as the Chamber adopted it is not published yet (15 Nov 2026).
  report: &committee_report
    name: {ar: 'تقرير لجنة المالية والتنمية الاقتصادية بمجلس النواب حول المشروع، الجزء الثاني', fr: 'Rapport de la commission des finances de la Chambre des représentants sur le projet, deuxième partie'}
    url: 'https://www.chambredesrepresentants.ma/sites/default/files/2emepUP2.pdf'
    file: sources/parliament/plf2027/2emepUP2.pdf
    sha256: f983ee219d6e93524606f9b34cd91edfdae03e2331da04113dfb978a141831ca
  press: bill-press
  # The bill-story review (Y1–Y7): the guess and the curve above the changes, four people, the road to 2031 and the
  # method after them; «شنو كيقولو» at the end (pages/bill-press).
  story: [bill-story]
  after: [bill-people, bill-road, bill-method]
  title: {ar: 'مشروع قانون المالية 2027: شنو غادي يتبدل ليك', fr: 'Le projet de loi de finances 2027 : ce qui changerait pour vous'}
  lead:
    ar: 'كل تغيير هنا مكتوب فالمشروع كما عدلاتو لجنة المالية وصادق عليه مجلس النواب، بالتاريخ اللي كيعطيه المشروع نفسه. اللي بدلوه النواب معلّم بقلم.'
    fr: 'Chaque changement est écrit dans le projet tel que la commission des finances l’a amendé et que la Chambre des représentants l’a adopté, avec la date que le projet donne lui-même. Ce que les députés ont modifié porte un crayon.'
  sections:
    - key: salary
      for: [salary]
      chip: {ar: أجير, fr: Salarié}
      title: {ar: 'إلا كنتي أجير', fr: 'Si vous êtes salarié'}
      line: {ar: 'الشريحة المعفية 60.000، المصاريف 45%، والجدول كيتبدل كل عام حتى 2031', fr: 'Tranche exonérée à 60 000, frais à 45 %, et un barème par an jusqu’en 2031'}
      note: {ar: 'النواب ما بدلو والو فالجدول ولا فالمصاريف 45%: دازو كما أودعتهم الحكومة. وما تقبلوش اقتراحات كانت باغية تزيد: 720 درهم عوض 600 على كل واحد فتكلفك، وخصم مصاريف المدرسة الخاصة حتى 6.000 درهم على كل ولد.', fr: 'Les députés n’ont touché ni au barème ni aux 45 % de frais : ils passent tels que déposés. Deux propositions qui allaient plus loin n’ont pas été retenues : 720 DH au lieu de 600 par personne à charge, et la déduction des frais d’école privée jusqu’à 6 000 DH par enfant.'}
      note_more: pages/bill-amendments
      note_link: {ar: 'شنو بدلو النواب وشنو رفضو', fr: 'Ce que les députés ont changé, et refusé'}
      aside: bill-gain
      rows:
        - headline: {ar: 'الشريحة المعفية من الضريبة على الدخل', fr: 'La tranche exonérée de l’impôt sur le revenu'}
          plain: {ar: 'أول جزء من الدخل الصافي ديال العام ما كتخلص عليه حتى درهم ديال الضريبة، كيفما كان أجرك.', fr: 'La première part du revenu net de l’année ne paie aucun impôt, quel que soit votre salaire.'}
          then: '60.000'
          now: '40.000'
          unit: {ar: درهم فالعام, fr: DH par an}
          from: '2027-01-01'
          detail: {ar: 'من 2027 حتى 2030 جدول جديد كل عام؛ و2031 الجدول الأخير: 10% حتى 150.000، و20% حتى 500.000، و30% فوق.', fr: 'De 2027 à 2030, un barème par an ; en 2031 le dernier : 10 % jusqu’à 150 000, 20 % jusqu’à 500 000, 30 % au-delà.'}
          cites: [/ma/code/cgi/art_73, /ma/code/cgi/art_247]
        # The bill-rows rewrite (27 Oct 2026: the four rows rewritten to be clear): what the thing is
        # (`plain`), today's and the bill's figure each with its note (`now_note`, `then_note`), and the reader's
        # own figure from the salary on the page (`you`, a PAGE_WIDGETS name).
        - headline: {ar: 'المصاريف المهنية', fr: 'Les frais professionnels'}
          plain: {ar: 'جزء من الأجر الخام كيتحسب مصاريف ديال الخدمة وكيتنقص قبل ما تتحسب الضريبة، بلا ما تبرر بالأوراق.', fr: 'Une part du salaire brut compte comme frais du métier et se retire avant le calcul de l’impôt, sans justificatifs.'}
          then: '45%'
          then_note: {ar: 'لكل الأجراء، و35.000 درهم فالعام على الأكثر', fr: 'pour tous les salariés, 35 000 DH par an au plus'}
          now: {ar: '35% ولا 25%', fr: '35 % ou 25 %'}
          now_note: {ar: '35% حتى 6.500 درهم خام فالشهر، و25% فوق', fr: '35 % jusqu’à 6 500 DH bruts par mois, 25 % au-delà'}
          you: bill-you-expenses
          from: '2027-01-01'
          detail: {ar: 'لكل الأجراء، و35.000 درهم فالعام على الأكثر؛ والنسب الخاصة ديال الصحافيين والفنانين وطواقم الطيران كتمشي.', fr: 'Pour tous les salariés, 35 000 DH par an au plus ; les taux propres aux journalistes, artistes et équipages disparaissent.'}
          cites: [/ma/code/cgi/art_59]
        - headline: {ar: 'أعلى نسبة ديال الضريبة على الدخل', fr: 'Le taux le plus haut de l’impôt sur le revenu'}
          plain: {ar: 'ما كتطبقش على الأجر كامل: كتطبق غير على الجزء من الدخل الصافي اللي فوق حد معين، والباقي كيتخلص بنسب أقل.', fr: 'Il ne s’applique pas à tout le salaire : seulement à la part du revenu net au-delà d’un seuil ; le reste paie des taux plus bas.'}
          then: '30%'
          then_note: {ar: 'من 2030، على اللي فوق 200.000؛ ومن 2031 على اللي فوق 500.000', fr: 'dès 2030, au-delà de 200 000 ; dès 2031, au-delà de 500 000'}
          now: '37%'
          now_note: {ar: 'على اللي فوق 180.000 درهم صافية فالعام', fr: 'au-delà de 180 000 DH nets par an'}
          you: bill-you-top
          from: '2030-01-01'
          when: {ar: من 2030, fr: dès 2030}
          detail: {ar: '37% كيبقى فـ2027 و2028، و35% فـ2029؛ و30% فوق 200.000 فـ2030، وفوق 500.000 من 2031.', fr: '37 % reste en 2027 et 2028, 35 % en 2029 ; 30 % au-delà de 200 000 en 2030, au-delà de 500 000 dès 2031.'}
          cites: [/ma/code/cgi/art_73, /ma/code/cgi/art_247]
        - headline: {ar: 'التعويضات اللي كتزاد على الأجر كل شهر', fr: 'Les indemnités qui s’ajoutent au salaire chaque mois'}
          plain: {ar: 'النقل، التمثيل، القفة… اللي كيعطيها المشغل كل شهر بنفس المبلغ، فوق الأجر.', fr: 'Transport, représentation, panier… ce que l’employeur verse chaque mois au même montant, en plus du salaire.'}
          then: {ar: خاضعة, fr: imposables}
          then_note: {ar: 'كتولي جزء من الأجر؛ كيبقى معفي غير اللي كيرجع مصاريف حقيقية بالأوراق', fr: 'elles deviennent du salaire ; seul reste exonéré le remboursement de frais réels justifiés'}
          now: {ar: معفية, fr: exonérées}
          now_note: {ar: 'ما كتخلصش عليها الضريبة، بالأوراق ولا جزافية', fr: 'aucun impôt, sur états ou forfaitaires'}
          you: bill-you-allowance
          from: '2031-01-01'
          detail: {ar: 'كتولي أجر خاضع للضريبة؛ كتبقى معفية غير التعويضات اللي كترجع مصاريف حقيقية ومبررة، والمصاريف 45% ما كتجتمعش معاها.', fr: 'Elles deviennent du salaire imposable ; seules restent exonérées celles qui remboursent des frais réels et justifiés, et les 45 % ne s’y cumulent pas.'}
          cites: [/ma/code/cgi/art_57]
          more: pages/allowances-2031
        - headline: {ar: 'التصريح السنوي بالدخل', fr: 'La déclaration annuelle de revenus'}
          plain: {ar: 'كيخص غير اللي عندو دخل آخر ولا أكثر من مشغل: اللي عندو غير أجر من مشغل واحد، المشغل كيقطع الضريبة من الأجر وما كيصرحش.', fr: 'Elle ne concerne que qui a un autre revenu ou plusieurs employeurs : avec un seul salaire d’un seul employeur, l’impôt est retenu sur la paie et vous ne déclarez pas.'}
          then: {ar: بالإنترنت, fr: en ligne}
          then_note: {ar: 'المشروع كيكتب «بطريقة إلكترونية»', fr: 'le projet écrit « par procédé électronique »'}
          now: {ar: 'بالورق ولا بالإنترنت', fr: 'papier ou en ligne'}
          now_note: {ar: 'كيف بغيتي', fr: 'au choix'}
          you: bill-you-declare
          when: {ar: التاريخ ما محددش, fr: date non fixée}
          check: true
          detail: {ar: 'المشروع كيكتب «بطريقة إلكترونية» وما كيعطيش لهاد الجملة تاريخ بوحدها (1 يوليوز 2027 كيخص التسبيق على الاستيراد). كنتحققو مع المادة 155 قبل ما نقولو شنو تدير.', fr: 'Le projet écrit « par procédé électronique » sans dater cette phrase à part (le 1er juillet 2027 vise l’avance sur importations). Nous vérifions avec l’article 155 avant de vous dire quoi faire.'}
          cites: [/ma/code/cgi/art_86, /ma/code/cgi/art_82, /ma/code/cgi/art_155]
        - headline: {ar: 'تعويض التدريب (الستاج) فشركة خاصة', fr: 'L’indemnité de stage dans une entreprise privée'}
          plain: {ar: 'التعويض الشهري اللي كتعطيه شركة خاصة لمتدرب ما كتخلصش عليه الضريبة حتى لسقف معين.', fr: 'L’indemnité mensuelle qu’une entreprise privée verse à un stagiaire ne paie pas d’impôt jusqu’à un plafond.'}
          then: '8.000'
          now: '6.000'
          unit: {ar: درهم فالشهر, fr: DH par mois}
          from: '2027-01-01'
          when: {ar: 'العقود من فاتح يناير 2027', fr: 'contrats conclus dès le 1er janvier 2027'}
          amended: {by: committee, vote: unanimous, page: 743}
          detail: {ar: 'ما كانش فالمشروع كما أودع. فريق العدالة والتنمية طلب 10.000 درهم؛ اللجنة كتبات 8.000 بصيغتها. الشروط الأخرى ديال الإعفاء ما تبدلوش.', fr: 'Absent du projet déposé. Le groupe Justice et développement demandait 10 000 DH ; la commission a écrit 8 000 dans sa rédaction. Les autres conditions de l’exonération ne changent pas.'}
          cites: [/ma/code/cgi/art_57]
      tool: tools/bill
    - key: pension
      for: [pension]
      chip: {ar: متقاعد, fr: Retraité}
      title: {ar: 'إلا كنتي متقاعد', fr: 'Si vous êtes retraité'}
      line: {ar: 'الضريبة على المعاش ما تبدلاتش؛ المعاش الأدنى معلن، ماشي فالمشروع', fr: 'L’impôt sur la pension ne change pas ; la pension minimale est annoncée, pas dans le projet'}
      note: {ar: 'ما تقبلش اقتراح كان باغي يطلع الخصم الجزافي على المعاشات اللي كيتخلص عليها من 70% لـ85%: 6 مع، 23 ضد، 11 ممتنع.', fr: 'Une proposition qui portait de 70 % à 85 % l’abattement sur les pensions imposées n’a pas été retenue : 6 pour, 23 contre, 11 abstentions.'}
      note_more: pages/bill-amendments
      note_link: {ar: 'شنو بدلو النواب وشنو رفضو', fr: 'Ce que les députés ont changé, et refusé'}
      rows:
        - headline: {ar: 'معاشات أنظمة التقاعد الأساسي', fr: 'Les pensions des régimes de base'}
          then: {ar: معفية, fr: exonérées}
          now: {ar: معفية, fr: exonérées}
          same: true
          detail: {ar: 'المشروع ما كيبدلش الضريبة على المعاش: معفية منذ 2026. والمعاش التكميلي اللي كيتخلص عليه كيستافد من الجدول الجديد.', fr: 'Le projet ne change pas l’impôt sur les pensions : exonérées depuis 2026. Une pension complémentaire imposée profite du nouveau barème.'}
          cites: [/ma/code/cgi/art_57, /ma/code/cgi/art_73]
        - headline: {ar: 'المعاش الأدنى', fr: 'La pension minimale'}
          then: '1.700'
          unit: {ar: درهم فالشهر, fr: DH par mois}
          announced: true
          detail: {ar: 'معلن من الوزير: 1.700 درهم فـ2027، ثم 2.000 فـ2028 و2.500 فـ2029 و3.000 فـ2030 (جوابو فلجنة المالية)، والأرامل 100% من المعاش. ماشي فمواد المشروع: خاص نص ديالو.', fr: 'Annoncé par le ministre : 1 700 DH en 2027, puis 2 000 en 2028, 2 500 en 2029 et 3 000 en 2030 (sa réponse en commission), les veuves à 100 %. Pas dans les articles du projet : il faut un texte à part.'}
          more: reform/announced-pensions
        - headline: {ar: 'إلا طلبات منك الإدارة ترجع أجر ولا معاش تخلص ليك بالغلط', fr: 'Si l’administration vous réclame un salaire ou une pension versés par erreur'}
          plain: {ar: 'كيهم الموظفين والمتقاعدين ديال الدولة والجماعات والمؤسسات العمومية: المبلغ اللي تخلص بلا حق كيترجع بأمر بالمداخيل.', fr: 'Pour les agents et retraités de l’État, des collectivités et des établissements publics : la somme versée à tort se rembourse sur ordre de recette.'}
          then: {ar: بلا زيادة, fr: sans majoration}
          now: {ar: '6% فالعام', fr: '6 % par an'}
          now_note: {ar: 'زيادة على التأخير فوق المبلغ', fr: 'majoration de retard, en plus de la somme'}
          from: '2027-01-01'
          amended: {by: majority, vote: unanimous, page: 775}
          detail: {ar: 'مادة جديدة زادوها النواب: الأوامر بالمداخيل اللي كتسترجع أجور وتعويضات ومعاشات تخلصات بغير حق ما بقاتش كتزاد عليها زيادة 6% ديال مدونة تحصيل الديون العمومية.', fr: 'Un article ajouté par les députés : les ordres de recette qui récupèrent des traitements, indemnités et pensions versés à tort ne portent plus la majoration de 6 % du code de recouvrement des créances publiques.'}
          cites: [/ma/loi/15-97/art_23]
    - key: rent
      for: [rent, property]
      chip: {ar: كتكري ولا عندك عقار, fr: Bailleur ou propriétaire}
      title: {ar: 'إلا كتكري ولا عندك عقار', fr: 'Si vous louez ou possédez un bien'}
      line: {ar: 'العقود القديمة بلا ذعيرة، الكراء من شركة بلا اقتطاع حتى 60.000، والبيع الصغير معفي حتى 200.000', fr: 'Les actes anciens sans pénalité, le loyer payé par une société sans retenue jusqu’à 60 000, la petite vente exonérée jusqu’à 200 000'}
      rows:
        - headline: {ar: 'تسجيل عقد قديم تقادمو الواجبات ديالو', fr: 'Enregistrer un acte ancien aux droits prescrits'}
          then: {ar: بلا ذعيرة, fr: sans pénalité}
          now: {ar: بالذعيرة, fr: avec pénalités}
          from: '2027-01-01'
          amended: {by: majority, vote: [39, 1, 0], page: 755}
          detail: {ar: 'كيتسجل بالأسعار ديال نهار التسجيل، بلا ذعيرة ولا زيادات؛ وكل تسجيل كيعطي شهادة. النواب زادو: الواجبات كتتخلص داخل الآجال العادية ديال التسجيل، محسوبة من نهار طلبتي التسجيل.', fr: 'Il s’enregistre aux taux du jour, sans pénalité ni majoration ; chaque enregistrement donne une attestation. Les députés ont ajouté : les droits se paient dans les délais ordinaires d’enregistrement, comptés du jour de votre demande.'}
          cites: [/ma/code/cgi/art_133, /ma/code/cgi/art_135, /ma/code/cgi/art_126, /ma/code/cgi/art_128]
        - headline: {ar: 'الكراء اللي كيتخلص بالجدول', fr: 'Les loyers imposés au barème'}
          then: '60.000'
          now: '40.000'
          unit: {ar: درهم معفية فالعام, fr: DH exonérés par an}
          from: '2027-01-01'
          detail: {ar: 'كيستافد من الجدول الجديد؛ نسب الاقتطاع والسعر الإبرائي 20% ما تبدلوش.', fr: 'Ils profitent du nouveau barème ; les taux de retenue et le taux libératoire de 20 % ne changent pas.'}
          cites: [/ma/code/cgi/art_73, /ma/code/cgi/art_64]
        - headline: {ar: 'الكراء اللي كتخلصو ليك شركة ولا مهني', fr: 'Le loyer que vous paie une société ou un professionnel'}
          plain: {ar: 'إلا كاري لشركة، ولا لمهني كيتحاسب بالنتيجة الحقيقية ولا المبسطة، هو اللي كيقطع الضريبة من الكراء قبل ما يخلصك. تحت مبلغ معين فالعام ما كيقطعش.', fr: 'Si votre locataire est une société, ou un professionnel au résultat net réel ou simplifié, c’est lui qui retient l’impôt sur le loyer avant de vous payer. Sous un montant annuel, il ne retient rien.'}
          then: '60.000'
          now: '40.000'
          unit: {ar: درهم فالعام, fr: DH par an}
          from: '2027-01-01'
          amended: {by: groups, vote: unanimous, page: 759}
          detail: {ar: 'ما كانش فالمشروع كما أودع: زادوه تعديلان، واحد ديال فرق الأغلبية وواحد ديال فريق العدالة والتنمية. كيطبق على الكراء المدفوع من فاتح يناير 2027.', fr: 'Absent du projet déposé : deux amendements l’ajoutent, l’un des groupes de la majorité, l’autre du groupe Justice et développement. S’applique aux loyers versés dès le 1er janvier 2027.'}
          cites: [/ma/code/cgi/art_160-bis]
        - headline: {ar: 'بيع عقار بثمن صغير', fr: 'Vendre un bien de petite valeur'}
          plain: {ar: 'اللي باع فالعام عقارات مجموع قيمتها ما كيفوتش مبلغ معين، الربح ديالو معفي من الضريبة على الدخل.', fr: 'Qui vend dans l’année des biens dont la valeur totale ne dépasse pas un montant ne paie pas d’impôt sur le profit.'}
          then: '200.000'
          now: '140.000'
          unit: {ar: درهم فالعام, fr: DH par an}
          from: '2027-01-01'
          amended: {by: mp, vote: [39, 0, 1], page: 746}
          detail: {ar: 'ما كانش فالمشروع كما أودع. فريق الحركة الشعبية طلب 280.000 درهم؛ اللجنة كتبات 200.000 بصيغتها. كيطبق على البيوعات من فاتح يناير 2027.', fr: 'Absent du projet déposé. Le groupe du Mouvement populaire demandait 280 000 DH ; la commission a écrit 200 000 dans sa rédaction. S’applique aux cessions dès le 1er janvier 2027.'}
          cites: [/ma/code/cgi/art_63]
        - headline: {ar: 'بيع الأسهم غير المدرجة', fr: 'La cession de titres non cotés'}
          then: {ar: 'كل بيعة، بالإنترنت', fr: 'chaque cession, en ligne'}
          filed: {ar: كل بيعة, fr: chaque cession}
          now: {ar: مرة فالعام, fr: une fois par an}
          from: '2027-01-01'
          amended: {by: majority, vote: unanimous, page: 750}
          detail: {ar: 'تصريح على كل بيعة فالشهر اللي من بعدها، مع الأداء. النواب زادو بلي التصريح كيتدار بطريقة إلكترونية.', fr: 'Une déclaration par cession dans le mois qui suit, avec le paiement. Les députés ont ajouté qu’elle se dépose par procédé électronique.'}
          cites: [/ma/code/cgi/art_84, /ma/code/cgi/art_173]
    - key: self
      for: [self]
      chip: {ar: خدام بحسابك, fr: À votre compte}
      title: {ar: 'إلا كتخدم بحسابك ولا بلا تسجيل', fr: 'Si vous travaillez à votre compte, ou sans être déclaré'}
      line: {ar: 'عامين باش تتسجل عوض عام، والمقاول الذاتي 20% عوض 30% فوق 100.000 مع زبون واحد', fr: 'Deux ans pour s’inscrire au lieu d’un, et l’auto-entrepreneur à 20 % au lieu de 30 % au-delà de 100 000 avec un même client'}
      rows:
        - headline: {ar: 'المدة باش يتسجل فالرسم المهني اللي خدام بلا تسجيل', fr: 'Le temps pour s’inscrire à la taxe professionnelle quand on travaille sans être déclaré'}
          plain: {ar: 'اللي تسجل داخل هاد المدة كيتحاسب غير على اللي ربح من نهار التسجيل، ماشي على اللي فات.', fr: 'Qui s’inscrit dans ce délai n’est imposé que sur ce qu’il gagne depuis son inscription, pas sur le passé.'}
          then: {ar: عامين, fr: deux ans}
          then_note: {ar: 'من فاتح يناير 2027 حتى 31 دجنبر 2028', fr: 'du 1er janvier 2027 au 31 décembre 2028'}
          filed: {ar: عام واحد, fr: un an}
          filed_note: {ar: 'حتى 31 دجنبر 2027', fr: 'jusqu’au 31 décembre 2027'}
          now: {ar: ما كايناش, fr: aucun}
          now_note: {ar: 'اللي تسجل كيتحاسب على اللي فات', fr: 'qui s’inscrit est imposé sur le passé'}
          from: '2027-01-01'
          amended: {by: majority, vote: unanimous, page: 767}
          detail: {ar: 'إلا خدام بلا ما تكون مسجل: اللي تسجل فالرسم المهني من فاتح يناير 2027 كيتحاسب غير على الدخول والعمليات من نهار التسجيل. المشروع كما أودع كان كيسد الباب فـ31 دجنبر 2027؛ النواب زادو عام.', fr: 'Si vous travaillez sans être inscrit : en vous inscrivant à la taxe professionnelle dès le 1er janvier 2027, vous n’êtes imposé que sur ce que vous gagnez depuis l’inscription. Le projet déposé fermait la fenêtre le 31 décembre 2027 ; les députés ajoutent un an.'}
          cites: [/ma/code/cgi/art_247]
        - headline: {ar: 'المقاول الذاتي اللي كيخدم بزاف مع زبون واحد', fr: 'L’auto-entrepreneur qui travaille beaucoup pour un même client'}
          plain: {ar: 'إلا فات اللي فكتيرتي لزبون واحد فالعام مبلغ معين، الزبون كيقطع الضريبة من الزيادة قبل ما يخلصك. نفس القاعدة لأصحاب المساهمة المهنية الموحدة.', fr: 'Quand ce que vous facturez à un même client dans l’année dépasse un montant, ce client retient l’impôt sur le surplus avant de vous payer. Même règle pour la contribution professionnelle unique.'}
          then: {ar: '20% فوق 100.000', fr: '20 % au-delà de 100 000'}
          now: {ar: '30% فوق 80.000', fr: '30 % au-delà de 80 000'}
          unit: {ar: درهم مع نفس الزبون فالعام, fr: DH par an avec un même client}
          from: '2027-01-01'
          amended: {by: majority, vote: [39, 0, 1], page: 741}
          detail: {ar: 'ما كانش فالمشروع كما أودع. كيطبق على المكافآت المدفوعة من فاتح يناير 2027، دقة وحدة بلا تدرج، والاقتطاع كيبرئ من الضريبة. لأصحاب المساهمة المهنية الموحدة التصويت كان 29 مع و11 ضد.', fr: 'Absent du projet déposé. S’applique aux rémunérations versées dès le 1er janvier 2027, d’un coup, et la retenue est libératoire. Pour la contribution professionnelle unique, le vote a été de 29 pour et 11 contre.'}
          cites: [/ma/code/cgi/art_42-bis, /ma/code/cgi/art_40, /ma/code/cgi/art_45-bis, /ma/code/cgi/art_73]
        - headline: {ar: 'الأتعاب والعمولات اللي كيتقطع منها 30%', fr: 'Les honoraires et commissions retenus à 30 %'}
          plain: {ar: 'أتعاب كتخلصها مقاولة لواحد ماشي من المستخدمين ديالها، وأجور الفنانين، وعمولات الممثلين والجوالين التجاريين: الضريبة كتتقطع من المنبع بسعر خاص.', fr: 'Les honoraires qu’une entreprise verse à quelqu’un hors de son personnel, les cachets des artistes, les commissions des représentants : l’impôt est retenu à la source à un taux spécial.'}
          then: '28%'
          then_note: {ar: 'فـ2027، ثم 26% و24% و22%، و20% من 2031', fr: 'en 2027, puis 26 %, 24 % et 22 %, et 20 % dès 2031'}
          now: '30%'
          from: '2027-01-01'
          amended: {by: majority, vote: unanimous, page: 768}
          detail: {ar: 'ما كانش فالمشروع كما أودع. السعر الخاص 30% كيتحذف: 28% فـ2027، 26% فـ2028، 24% فـ2029، 22% فـ2030، و20% من فاتح يناير 2031؛ والاقتطاع كيبرئ من الضريبة من 2027.', fr: 'Absent du projet déposé. Le taux spécial de 30 % disparaît : 28 % en 2027, 26 % en 2028, 24 % en 2029, 22 % en 2030, 20 % dès le 1er janvier 2031 ; la retenue est libératoire dès 2027.'}
          cites: [/ma/code/cgi/art_73, /ma/code/cgi/art_247, /ma/code/cgi/art_58, /ma/code/cgi/art_60, /ma/code/cgi/art_156]
      tool: tools/own
    - key: company
      for: [company]
      chip: {ar: عندك شركة, fr: Société}
      title: {ar: 'إلا عندك شركة', fr: 'Si vous avez une société'}
      line: {ar: 'التسبيق على الاستيراد 3% عوض 5%، المحروقات 40%، وتجار العقار', fr: 'L’avance à l’importation à 3 % au lieu de 5 %, les carburants à 40 %, les marchands de biens'}
      note: {ar: 'سعر 40% على شركات المحروقات داز كما أودع. ما تقبلش اقتراح كان باغي يزيد شركات الاتصالات والإسمنت لنفس السعر: 10 مع، 23 ضد، 7 ممتنعين.', fr: 'Le taux de 40 % des sociétés de carburants passe tel que déposé. Une proposition qui y ajoutait les opérateurs télécoms et les cimentiers n’a pas été retenue : 10 pour, 23 contre, 7 abstentions.'}
      note_more: pages/bill-amendments
      note_link: {ar: 'شنو بدلو النواب وشنو رفضو', fr: 'Ce que les députés ont changé, et refusé'}
      rows:
        - headline: {ar: 'التسبيق على الاستيراد باش تبيع', fr: 'L’avance sur les importations destinées à la revente'}
          then: '3%'
          then_note: {ar: 'لمدة 36 شهر', fr: 'pendant 36 mois'}
          filed: '5%'
          filed_note: {ar: 'لمدة 60 شهر', fr: 'pendant 60 mois'}
          unit: {ar: من القيمة الجمركية, fr: de la valeur en douane}
          new: true
          from: '2027-07-01'
          amended: {by: committee, vote: unanimous, page: 761}
          detail: {ar: 'على كل استيراد لمدة 36 شهر، ومن بعد غير اللي ما جابش شهادة الإبراء الضريبي عندها أقل من 30 يوم؛ كيتخصم من الضريبة. فريق الحركة الشعبية سحب التعديلات ديالو مقابل تعديل اللجنة.', fr: 'Sur chaque importation pendant 36 mois, puis seulement sans attestation de régularité fiscale de moins de 30 jours ; imputée sur l’impôt. Le groupe du Mouvement populaire a retiré ses amendements en échange de celui de la commission.'}
          cites: [/ma/code/cgi/art_170, /ma/code/cgi/art_173]
        - headline: {ar: 'مستوردو وموزعو المحروقات', fr: 'Importateurs et distributeurs de carburants'}
          then: '40%'
          now: '35%'
          from: '2027-01-01'
          detail: {ar: 'على ربح صافي من 100 مليون درهم فما فوق، على السنوات المحاسبية اللي كتبدا من 2027.', fr: 'Sur un bénéfice net de 100 millions de DH ou plus, pour les exercices ouverts dès 2027.'}
          cites: [/ma/code/cgi/art_19]
        - headline: {ar: 'تجار العقارات المبنية', fr: 'Les marchands de biens immeubles bâtis'}
          then: {ar: على الهامش, fr: sur la marge}
          now: {ar: على الثمن, fr: sur le prix}
          from: '2027-07-01'
          detail: {ar: 'اختيار أداء القيمة المضافة على الهامش، مع خصم القيمة المضافة ديال أشغال الترميم.', fr: 'L’option de la TVA sur la marge, avec déduction de la TVA sur les travaux de rénovation.'}
          cites: [/ma/code/cgi/art_90, /ma/code/cgi/art_96]
      more: pages/business
    - key: buy
      chip: {ar: كتشري, fr: Vous achetez}
      title: {ar: 'إلا كتشري: اللحم، الدخان، الطوموبيل', fr: 'Si vous achetez : viande, tabac, voiture'}
      line: {ar: 'اللحم المستورد معفي، الدخان والسيكار كيطلعو، والطوموبيل فوق مليون 25%', fr: 'La viande importée exonérée, tabac et cigares en hausse, la voiture au-delà d’un million à 25 %'}
      rows:
        - headline: {ar: 'استيراد المواشي ولحومها', fr: 'L’importation du bétail et de ses viandes'}
          then: {ar: معفي, fr: exonérée}
          then_note: {ar: 'بإجراءات كتحددها الإدارة', fr: 'selon des procédures que l’administration fixe'}
          now: {ar: معلق مؤقتا, fr: suspendu}
          from: '2027-01-01'
          amended: {by: majority, vote: [22, 17, 0], page: 727}
          detail: {ar: 'من رسم الاستيراد ومن الضريبة على القيمة المضافة عند الاستيراد، بصفة دائمة؛ اليوم رسم الاستيراد معلق بمرسوم 2.26.584 لمدة محددة. النواب زادو بلي هاد الاستيراد كيدوز «وفق إجراءات مؤطرة تحددها الإدارة». وما تقبلوش ثلاثة ديال الاقتراحات كانت باغية تحيد الإعفاء ولا تحدو فعام ولا عامين. الإعفاء الضريبي ماشي ثمن: الثمن فالسوق.', fr: 'Du droit d’importation et de la TVA à l’importation, de façon permanente ; aujourd’hui le droit est suspendu pour un temps par le décret 2.26.584. Les députés ont ajouté que ces importations se font « selon des procédures encadrées que l’administration fixe ». Trois propositions qui supprimaient l’exonération ou la limitaient à un an ou deux n’ont pas été retenues. Une exonération n’est pas un prix : le prix se fait au marché.'}
          cites: [/ma/code/cgi/art_123, /ma/projet-loi/60-26/art_3]
        - headline: {ar: 'السيجارة الإلكترونية', fr: 'La cigarette électronique'}
          then: '100'
          now: '50'
          unit: {ar: درهم للوحدة, fr: DH l’unité}
          from: '2027-01-01'
          detail: {ar: 'بجميع أنواعها (اليوم غير اللي كتستعمل مرة وحدة)؛ والضريبة على السجائر كتطلع كل عام حتى 2031.', fr: 'De tout type (aujourd’hui les jetables seulement) ; la taxe sur les cigarettes monte chaque année jusqu’en 2031.'}
          cites: [/ma/projet-loi/60-26/art_5]
        - headline: {ar: 'السائل ديال السيجارة الإلكترونية', fr: 'Le liquide de cigarette électronique'}
          then: {ar: '10 و20', fr: '10 et 20'}
          then_note: {ar: '10 بلا نيكوتين و20 بالنيكوتين', fr: '10 sans nicotine, 20 avec'}
          now: {ar: '5 و10', fr: '5 et 10'}
          now_note: {ar: '5 بلا نيكوتين و10 بالنيكوتين', fr: '5 sans nicotine, 10 avec'}
          unit: {ar: درهم لكل 10 ملل, fr: DH les 10 ml}
          from: '2027-01-01'
          amended: {by: majority, vote: unanimous, page: 734}
          detail: {ar: 'ما كانش فالمشروع كما أودع: المشروع كان مبدل غير الضريبة على السيجارة الإلكترونية نفسها.', fr: 'Absent du projet déposé, qui ne changeait que la taxe sur la cigarette électronique elle-même.'}
          cites: [/ma/projet-loi/60-26/art_5]
        - headline: {ar: 'السيكار الكبير والصغير', fr: 'Les cigares et cigarillos'}
          then: '1.125'
          then_note: {ar: 'و50% من ثمن البيع', fr: 'et 50 % du prix de vente'}
          now: '750'
          now_note: {ar: 'و35% من ثمن البيع', fr: 'et 35 % du prix de vente'}
          unit: {ar: درهم لكل 1.000 وحدة, fr: DH les 1 000 unités}
          from: '2027-01-01'
          amended: {by: majority, vote: unanimous, page: 733}
          detail: {ar: 'ما كانش فالمشروع كما أودع، اللي كان كيطلع غير السجائر. المبلغ الأدنى كيولي 2.250 درهم عوض 1.500.', fr: 'Absent du projet déposé, qui ne relevait que les cigarettes. Le minimum de perception passe à 2 250 DH au lieu de 1 500.'}
          cites: [/ma/projet-loi/60-26/art_5]
        - headline: {ar: 'التمبر ديال الطوموبيل الغالية', fr: 'Le timbre de la voiture chère'}
          then: '25%'
          filed: '24%'
          now: '20%'
          unit: {ar: فوق مليون درهم, fr: au-delà d’un million}
          from: '2027-01-01'
          amended: {by: majority, vote: unanimous, page: 770}
          detail: {ar: 'عند أول تسجيل: 5% من 400.000 حتى 600.000 (بحال اليوم؛ المشروع كما أودع كان كاتب 6%)، و12% حتى 800.000، و18% حتى مليون، و25% فوق (اليوم 5 و10 و15 و20%).', fr: 'À la première immatriculation : 5 % de 400 000 à 600 000 (comme aujourd’hui ; le projet déposé écrivait 6 %), 12 % jusqu’à 800 000, 18 % jusqu’à un million, 25 % au-delà (5, 10, 15 et 20 % aujourd’hui).'}
          cites: [/ma/code/cgi/art_252]
  calendar:
    - date: '2027-01-01'
      for: [salary, rent, self, company, buy]
      text: {ar: 'الجدول الجديد، المصاريف 45%، العقود القديمة والكراء والبيع الصغير، باب التسجيل فالرسم المهني، المقاول الذاتي 20%، المحروقات، اللحم والدخان والطوموبيل', fr: 'Le nouveau barème, les frais à 45 %, actes anciens, loyers et petites ventes, la fenêtre de la taxe professionnelle, l’auto-entrepreneur à 20 %, les carburants, viande, tabac et voiture'}
    - date: '2027-07-01'
      for: [company]
      text: {ar: 'التسبيق 3% على الاستيراد، وتجار العقار', fr: 'L’avance de 3 % à l’importation, les marchands de biens'}
    - date: '2028-01-01'
      to: '2030-01-01'
      for: [salary, rent, self]
      text: {ar: 'جدول جديد كل عام، والأتعاب 26% ثم 24% ثم 22%', fr: 'Un nouveau barème chaque année ; les honoraires à 26 %, 24 % puis 22 %'}
    - date: '2031-01-01'
      for: [salary, rent, self]
      text: {ar: 'الجدول الأخير، التعويضات الشهرية كتولي أجر، والأتعاب 20%', fr: 'Le dernier barème, les indemnités mensuelles deviennent du salaire, les honoraires à 20 %'}
