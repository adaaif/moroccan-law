# The health topic's page (the health review, S6–S11, 27 Oct 2026: every picture readable by Moroccans). One
# question first, since most answers depend on the reader's regime: the AMO law 65.00 (Adala, consolidated to 29 Jan
# 2026), the AMO for the self-employed 98.15 (SGG), AMO Achamil 60.22, AMO
# Tadamon's decree 2.22.797, law 54.23 (CNOPS to the CNSS on 1 Feb 2027). Then the doors in the order of a care, each
# led by the label cut from a box of medicine (`marks: vignette`) with the one figure the law sets for it, or its
# pictogram. Written from the texts as the site holds them on 27 Oct 2026; nothing here reaches a reader before a person
# checks it (approve_topic).
doors_title: {ar: شنو وقع ليك؟, fr: 'Que vous arrive-t-il ?'}
marks: vignette
stages:
  - {key: doctor, title: {ar: عند الطبيب والصيدلية, fr: 'Chez le médecin et à la pharmacie'}, doors: [rights, record, medicines, sick]}
  - {key: hospital, title: {ar: فالسبيطار ولا فالمصحة, fr: 'À l’hôpital ou en clinique'}, doors: [emergency, cheque, hospital, birth]}
  - {key: refund, title: {ar: 'من بعد: التعويض', fr: 'Après : le remboursement'}, doors: [refund, refused, long-illness, family-cover]}
  - {key: cover, title: {ar: التغطية ديالك, fr: 'Votre couverture'}, doors: [tadamon, tadamon-lost, cnops2027, self, achamil, students]}
  - {key: wrong, title: {ar: إلا ما تحلاتش, fr: 'Si ça ne s’arrange pas'}, doors: [error]}
  - {key: life, title: {ar: الإعاقة، التبرع، الوفاة, fr: 'Handicap, don, décès'}, doors: [disability, donation, death]}
  - {key: elsewhere, title: {ar: فمواضيع أخرى, fr: 'Dans d’autres thèmes'}, doors: [not-declared, work-accident, maternity, direct-support], links: true}

# The band (S10): the moments the law matters most at a hospital's or a clinic's door. Its acts are the emergency
# journey's first answers; a number shows only with the official page that gives it (C2 «sourced»): the SAMU's 141 from
# the Health Ministry's page of its launch, kept with its hash under data/sources/health/.
urgent:
  title: {ar: فالمستعجلات ولا فالمصحة؟, fr: 'Aux urgences ou en clinique ?'}
  lead: {ar: 'شنو كيقول القانون فالباب', fr: 'Ce que dit la loi à la porte'}
  to: journeys/emergency
  acts: {journey: emergency, steps: [0, 1, 2]}
  numbers:
    - number: '141'
      name: {ar: المساعدة الطبية المستعجلة (SAMU), fr: 'Aide médicale urgente (SAMU)'}
      source:
        name: {ar: 'وزارة الصحة، كلمة إطلاق الرقم الوطني 141', fr: 'Ministère de la Santé, allocution de lancement du 141'}
        url: https://www.sante.gov.ma/Ministre/Documents/allocution%20SAMU%2019%20mars.pdf
        file: health/samu_141_sante_gov_ma.pdf
        sha256: '5b42fe6bbdb1504bd1c234881124b8b0c21b3389d49a9576d7183ebbb1ea2774'

learn: [pages/rights, journeys/refund, pages/regimes, journeys/clinic, pages/beliefs]

# What people believe, and what the law says (S16), each card leading to the page that answers it.
beliefs:
  - claim: {ar: المصحة عندها الحق تطلب شيك ضمان, fr: 'La clinique peut exiger un chèque de garantie'}
    truth: {ar: 'إلا كان عندك التحمل، ما عندهاش الحق: غير الجزء اللي باقي عليك، وبوصل.', fr: 'Avec la prise en charge, non : seulement la part qui reste à votre charge, contre reçu.'}
    to: pages/beliefs
  - claim: {ar: الكنوبس تحيد, fr: 'La CNOPS est supprimée'}
    truth: {ar: 'ماشي قبل فاتح فبراير 2027، ومن بعد التغطية كتكمل عند الضمان الاجتماعي.', fr: 'Pas avant le 1er février 2027 ; ensuite la couverture continue à la CNSS.'}
    to: pages/beliefs
  - claim: {ar: راميد مازال خدام, fr: 'Le RAMED existe toujours'}
    truth: {ar: 'ولى أمو تضامن: اللي كانو فراميد دازو ليه بلا طلب، والدولة كتخلص الاشتراك.', fr: 'Il est devenu l’AMO Tadamon : ses bénéficiaires y sont passés d’office, l’État paie la cotisation.'}
    to: pages/beliefs
  - claim: {ar: الطبيب ما يقدرش يقول ليا الثمن قبل, fr: 'Le médecin ne peut pas dire le prix avant'}
    truth: {ar: 'خاصو يقول ليك التشخيص والمخاطر وخطة العلاج وتكلفتها، بكلام مفهوم.', fr: 'Il doit vous dire le diagnostic, les risques, le plan de soins et son coût, en mots clairs.'}
    to: pages/beliefs
  - claim: {ar: ورقة العلاج نصيفطها فاش ما بغيت, fr: 'J’envoie la feuille de soins quand je veux'}
    truth: {ar: 'داخل شهرين من أول فحص، وإلا كيضيع الحق فالتعويض، إلا فحالة قوة قاهرة.', fr: 'Dans les deux mois du premier acte, sinon le droit au remboursement est perdu, sauf force majeure.'}
    to: pages/beliefs

# The order a reviewer opens the topic in: what people meet most first (the refund, the clinic, the rights, AMO Tadamon),
# then the long illness and the regimes, then the end of life and the changes.
waves:
  1: [journeys/emergency, journeys/refund, journeys/clinic, pages/rights, pages/regimes, pages/tadamon, pages/beliefs, tools/refund, tools/clock]
  2: [journeys/refused, journeys/long-illness, journeys/tadamon-lost, journeys/record, journeys/sick, pages/hospital, pages/medicines, pages/birth, checklists/refund-file, tools/illness]
  3: [journeys/error, journeys/death, pages/donation, pages/disability, reform/cnops-2027, reform/medicine-prices-2026, reform/pharmacy-2026, reform/lf-2027, rates/refund-cnss, rates/refund-cnops]

# The one question (S7): «شنو التغطية ديالك؟». Each answer names its law and who manages it, three figures with their
# articles, and leads with its own door; it is kept on the phone.
profile:
  question: {ar: شنو التغطية ديالك؟, fr: 'Quelle est votre couverture ?'}
  options:
    - key: private
      first: refund
      main: true
      label: {ar: خدام فالقطاع الخاص, fr: Salarié du privé}
      law: {ar: 'التأمين الإجباري الأساسي عن المرض (القانون 65.00) عند الصندوق الوطني للضمان الاجتماعي: 70% من التعريفة المرجعية، و90% للمرض الطويل فالمستشفى العمومي (المرسوم 2.05.737).', fr: 'L’AMO (loi 65.00) à la CNSS : 70 % du tarif national de référence, 90 % pour une longue maladie soignée à l’hôpital public (décret 2.05.737).'}
      facts:
        - {value: '70%', label: {ar: 'من التعريفة المرجعية الوطنية، و90% للمرض الطويل فالعمومي', fr: 'du tarif national de référence ; 90 % pour une longue maladie au public'}, cites: [/ma/decret/2-05-737/art_2]}
        - {value: {ar: '2 شهور', fr: '2 mois'}, label: {ar: 'باش تدفع ورقة العلاج من أول فحص، وإلا كيضيع الحق', fr: 'pour déposer la feuille de soins dès le premier acte, sinon le droit est perdu'}, cites: [/ma/decret/2-05-733/art_12]}
        - {value: {ar: '21 · 26', fr: '21 · 26'}, label: {ar: 'عام: ولادك مغطيين حتى 21، وحتى 26 إلا كيقراو قراية عليا؛ 30 من فبراير 2027', fr: 'ans : vos enfants couverts jusqu’à 21 ans, 26 en études supérieures ; 30 dès février 2027'}, cites: [/ma/loi/65-00/art_5, /ma/loi/116-12/art_29, /ma/loi/54-23/art_1]}
    - key: cnops
      first: cnops2027
      main: true
      label: {ar: موظف (الكنوبس), fr: Fonctionnaire (CNOPS)}
      law: {ar: 'التأمين الإجباري الأساسي عن المرض (القانون 65.00) عند الصندوق الوطني لمنظمات الاحتياط الاجتماعي حتى 31 يناير 2027، ومن فاتح فبراير 2027 عند الصندوق الوطني للضمان الاجتماعي (القانون 54.23).', fr: 'L’AMO (loi 65.00) à la CNOPS jusqu’au 31 janvier 2027, à la CNSS dès le 1er février 2027 (loi 54.23).'}
      facts:
        - {value: {ar: '1 فبراير', fr: '1er février'}, label: {ar: '2027: التأمين ديالك كيدوز للضمان الاجتماعي', fr: '2027 : votre assurance passe à la CNSS'}, cites: [/ma/loi/54-23/art_19, /ma/loi/54-23/art_6]}
        - {value: '80%', label: {ar: 'فالعلاج الخارجي، و90% فالاستشفاء، و100% فالمستشفى العمومي', fr: 'en ambulatoire, 90 % à l’hôpital, 100 % à l’hôpital public'}, cites: [/ma/decret/2-05-736/art_1]}
        - {value: '10%', label: {ar: 'أقصى ما كيبقى عليك فالمرض الطويل، و0 فالمكلف', fr: 'au plus à votre charge pour une longue maladie, 0 pour une coûteuse'}, cites: [/ma/decret/2-05-736/art_2]}
    - key: tadamon
      first: tadamon
      main: true
      label: {ar: أمو تضامن (كان عندي راميد), fr: 'AMO Tadamon (ex-RAMED)'}
      law: {ar: 'التأمين اللي كتخلص الدولة الاشتراك ديالو على اللي ما يقدرش (القانون 65.00، الكتاب الثالث)، والضمان الاجتماعي هو اللي كيدبر (المرسوم 2.22.797).', fr: 'L’assurance dont l’État paie la cotisation pour qui ne peut pas (loi 65.00, livre III), gérée par la CNSS (décret 2.22.797).'}
      facts:
        - {value: {ar: 'الطلب', fr: 'La demande'}, label: {ar: 'عند السلطة المحلية بالاستمارة، ولا فالموقع', fr: 'à l’autorité locale par le formulaire, ou en ligne'}, cites: [/ma/decret/2-22-797/art_3]}
        - {value: {ar: 'العمومي', fr: 'Le public'}, label: {ar: 'فالسبيطار العمومي: التحمل مباشر، والدولة كتخلص الباقي', fr: 'à l’hôpital public : prise en charge directe, l’État paie le reste'}, cites: [/ma/loi/65-00/art_120-bis]}
        - {value: '9,3264284', label: {ar: 'العتبة ديال المؤشر؛ كتراجع بشكل دوري', fr: 'le seuil de l’indice ; vérifié périodiquement'}, cites: [/ma/decret/2-22-923/art_1, /ma/decret/2-22-797/art_5]}
    - key: self
      first: self
      main: true
      label: {ar: خدام بحسابي, fr: Indépendant}
      law: {ar: 'التأمين الخاص بالمهنيين والعمال المستقلين (القانون 98.15)، عند الضمان الاجتماعي.', fr: 'L’AMO des professionnels et travailleurs indépendants (loi 98.15), à la CNSS.'}
      facts:
        - {value: {ar: '3 شهور', fr: '3 mois'}, label: {ar: 'مدة التدريب قبل التعويض', fr: 'de stage avant le remboursement'}, cites: [/ma/loi/98-15/art_13]}
        - {value: {ar: '30 يوم', fr: '30 jours'}, label: {ar: 'باش تصرح بكل تغيير فالسكنى ولا العائلة', fr: 'pour déclarer un changement d’adresse ou de famille'}, cites: [/ma/loi/98-15/art_9]}
        - {value: {ar: '6 شهور', fr: '6 mois'}, label: {ar: 'باش تطعن فالتسجيل من نهار الإشعار', fr: 'pour contester l’immatriculation dès l’avis'}, cites: [/ma/loi/98-15/art_8]}
    - key: achamil
      first: achamil
      label: {ar: كنخلص التأمين بوحدي (أمو الشامل), fr: 'Je cotise seul (AMO Achamil)'}
      law: {ar: 'التأمين الخاص باللي يقدر يخلص وما خدامش (القانون 60.22)، عند الضمان الاجتماعي.', fr: 'L’AMO de qui peut cotiser sans exercer d’activité (loi 60.22), à la CNSS.'}
      facts:
        - {value: {ar: '144 درهم', fr: '144 DH'}, label: {ar: 'أقل اشتراك فالشهر، حتى 1.164 حسب المؤشر', fr: 'la plus petite cotisation mensuelle, jusqu’à 1 164 selon l’indice'}, cites: [/ma/decret/2-23-690/art_6]}
        - {value: {ar: '3 شهور', fr: '3 mois'}, label: {ar: 'مدة التدريب قبل التعويض', fr: 'de stage avant le remboursement'}, cites: [/ma/loi/60-22/art_7]}
        - {value: {ar: 'خلّص قبل', fr: 'Payer d’abord'}, label: {ar: 'الخدمات مرتبطة بأداء الاشتراك', fr: 'les prestations dépendent des cotisations payées'}, cites: [/ma/loi/60-22/art_6]}
    - key: student
      first: students
      label: {ar: طالب, fr: Étudiant}
      law: {ar: 'حتى 31 يناير 2027 تأمين الطلبة (القانون 116.12)؛ من فاتح فبراير 2027 كيتنسخ، واللي كانت الدولة كتخلص عليهم كيدوزو لأمو تضامن (القانون 54.23).', fr: 'Jusqu’au 31 janvier 2027 l’AMO des étudiants (loi 116.12) ; abrogée le 1er février 2027, ceux dont l’État payait la cotisation passent à l’AMO Tadamon (loi 54.23).'}
      facts:
        - {value: {ar: '26 عام', fr: '26 ans'}, label: {ar: 'مغطي مع الوالدين إلا كتقرا قراية عليا؛ 30 من فبراير 2027', fr: 'couvert avec vos parents en études supérieures ; 30 ans dès février 2027'}, cites: [/ma/loi/116-12/art_29, /ma/loi/54-23/art_1]}
        - {value: {ar: '1 فبراير', fr: '1er février'}, label: {ar: '2027: تأمين الطلبة كيتنسخ', fr: '2027 : l’AMO des étudiants est abrogée'}, cites: [/ma/loi/54-23/art_13, /ma/loi/54-23/art_14]}
        - {value: {ar: 'الأجانب', fr: 'Étrangers'}, label: {ar: 'الطلبة الأجانب مغطيين حتى هوما', fr: 'les étudiants étrangers sont couverts aussi'}, cites: [/ma/loi/54-23/art_15]}
    - key: unknown
      first: tadamon
      label: {ar: ما عارفش ولا ما عنديش, fr: 'Je ne sais pas / aucune'}
      law: {ar: 'القانون 65.00 كيبغي التغطية للجميع: بالمساهمة للي يقدر، وبالتضامن للي ما يقدرش (المادة 1).', fr: 'La loi 65.00 veut couvrir tout le monde : par la cotisation qui peut, par la solidarité qui ne peut pas (art. 1).'}
      facts:
        - {value: {ar: 'خدام؟', fr: 'Salarié ?'}, label: {ar: 'المشغل خاصو يسجلك، وإلا غرامة 1.000 درهم على كل أجير', fr: 'l’employeur doit vous immatriculer, sinon 1 000 DH d’amende par salarié'}, cites: [/ma/loi/65-00/art_131]}
        - {value: {ar: 'المؤشر', fr: 'L’indice'}, label: {ar: 'تحت العتبة؟ أمو تضامن', fr: 'sous le seuil ? l’AMO Tadamon'}, cites: [/ma/decret/2-22-797/art_1]}
        - {value: {ar: 'فوقها؟', fr: 'Au-dessus ?'}, label: {ar: 'أمو الشامل باشتراك حسب المؤشر', fr: 'l’AMO Achamil, cotisation selon l’indice'}, cites: [/ma/loi/60-22/art_3]}
      to: pages/regimes

