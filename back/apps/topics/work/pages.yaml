- key: employers
  title: {ar: 'أنا مشغّل', fr: 'Je suis employeur'}
  lead:
    ar: 'نفس المواد، من الجهة الأخرى: ما يفرضه القانون على المشغل الصغير وعلى الأسرة التي تشغل عاملا منزليا.'
    fr: 'Les mêmes articles, de l’autre côté : ce que la loi impose au petit employeur et à la famille qui emploie un travailleur domestique.'
  sections:
    - title: {ar: حقوق المشغل كذلك, fr: Les droits de l’employeur aussi}
      facts:
        - text: {ar: 'فترة التجربة تنهى دون تعويض، والخطأ الجسيم للأجير يبرر الفصل دون إخطار ولا تعويض. والمادة 40 تعدد الأخطاء الجسيمة للمشغل، ومنها العنف والتحرش الجنسي، وتعد مغادرة الأجير بسببها فصلا تعسفيا.', fr: 'La période d’essai prend fin sans indemnité, et la faute grave du salarié justifie un licenciement sans préavis ni indemnité. L’article 40 énumère les fautes graves de l’employeur, dont la violence et le harcèlement sexuel ; le départ du salarié pour l’une d’elles vaut licenciement abusif.'}
          cites: [/ma/loi/65-99/art_13, /ma/loi/65-99/art_39, /ma/loi/65-99/art_61, /ma/loi/65-99/art_40]
  next: [checklists/employer-hire, checklists/employer-home]
  links:
    - name: {ar: 'نموذج عقد العاملة أو العامل المنزلي', fr: 'Le modèle de contrat du travailleur domestique'}
      url: https://miepeec.gov.ma/wp-content/uploads/2020/01/Contrat_2018_Ar.doc
      note: {ar: وزارة التشغيل, fr: Ministère de l’Emploi}

- key: numbers
  title: {ar: 'الشغل بالأرقام', fr: 'Le travail en chiffres'}
  lead:
    ar: 'الحد الأدنى للأجر من مراسيمه في الجريدة الرسمية، والبطالة من المندوبية السامية للتخطيط. لكل رقم ملفه وصفحته.'
    fr: 'Le salaire minimum d’après ses décrets au Bulletin officiel, le chômage d’après le HCP. Chaque chiffre avec son fichier et sa page.'
  series: [minimum-wage, unemployment]
