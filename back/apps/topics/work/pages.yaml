      url: https://www.macnss.ma/
      note: {ar: 'أيامك وأجورك المصرح بها', fr: 'Vos jours et salaires déclarés'}
    - name: {ar: 'طلبات التعويضات (تعويضاتي)', fr: 'Demandes de prestations (Taawidaty)'}
      url: https://taawidaty.cnss.ma/
    - name: {ar: 'موعد في وكالة الضمان الاجتماعي', fr: 'Rendez-vous dans une agence CNSS'}
      url: https://cnss.rdv.gov.ma/
    - name: {ar: 'محاكي الوزارة للتعويض عن الفصل', fr: 'Le simulateur du ministère pour les indemnités de licenciement'}
      url: https://miepeec.gov.ma/simulation/?lang=ar
    - name: {ar: 'مسطرة التعويض عن فقدان الشغل على إداراتي', fr: 'La procédure de l’indemnité pour perte d’emploi sur idarati'}
      url: https://www.idarati.ma/idarati-procedures/procedures/procedure/ccae907c-8c8e-4db1-8b58-3627bb132b7b
