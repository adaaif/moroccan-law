# Work in numbers (T15 of the work plan). The minimum wage from its own decrees, as the BO printed them (the issues are
# our own files); unemployment from the HCP's yearly «Activité, emploi et chômage», each year read from the edition
# named in `from`, on its page, checked against the PDF's text on 20 Oct 2026. The HCP's 2026 survey counts otherwise,
# so 2026 is never put on the same line. A year's minimum wage is the one in force on its 31 December (2026: today).

