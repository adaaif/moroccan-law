  - key: unemployment
    title: {ar: 'البطالة، كل الأعمار ومن 15 إلى 24 سنة', fr: 'Le chômage, tous âges et de 15 à 24 ans'}
    lead:
      ar: 'نسبة البطالة بالمائة، حسب البحث الوطني حول التشغيل للمندوبية السامية للتخطيط.'
      fr: 'Le taux de chômage en pourcentage, selon l’enquête nationale sur l’emploi du HCP.'
    table: 'Activité, emploi et chômage, résultats annuels'
    unit: percent
    lines:
      - {key: all, label: {ar: كل الأعمار, fr: Tous âges}}
      - {key: young, label: {ar: من 15 إلى 24 سنة, fr: 15 à 24 ans}}
    years:
      - {year: 2018, all: 9.5, young: 25.6, from: hcp2019, page: 10}   # national: p. 7
      - {year: 2019, all: 9.2, young: 24.9, from: hcp2019, page: 10}
      - {year: 2020, all: 11.9, young: 31.2, from: hcp2020, page: 12}
      - {year: 2021, all: 12.3, young: 31.8, from: hcp2022, page: 8}
      - {year: 2022, all: 11.8, young: 32.7, from: hcp2022, page: 4}
      - {year: 2023, all: 13.0, young: 35.8, from: hcp2023, page: 4}
      - {year: 2024, all: 13.3, young: 36.7, from: hcp2024, page: 4}
      - {year: 2025, all: 13.0, young: 37.2, from: hcp2025, page: 4}
    notes:
      - ar: 'نسبة كل الأعمار لسنتي 2018 و2019 في الصفحة 7 من طبعة 2019، ولسنة 2021 في الصفحة 4 من طبعة 2022.'
        fr: 'Le taux tous âges de 2018 et 2019 est page 7 de l’édition 2019, celui de 2021 page 4 de l’édition 2022.'
      - ar: 'من 2026، تحسب المندوبية البطالة ببحث جديد وتعريف أضيق: 9,5% في الفصل الثاني من 2026، و27,2% من 15 إلى 24 سنة. ليس نفس المقياس، فلا يوضع على نفس الخط.'
        fr: 'Depuis 2026, le HCP mesure le chômage par une nouvelle enquête et une définition plus stricte : 9,5 % au deuxième trimestre 2026, 27,2 % chez les 15-24 ans. Ce n’est pas la même mesure ; elle n’est pas mise sur la même ligne.'
