  - key: minimum-wage
    title: {ar: 'الحد الأدنى للأجر عن ساعة الشغل', fr: 'Le salaire minimum de l’heure'}
    lead:
      ar: 'في الصناعة والتجارة والخدمات، بالدرهم، كما في الجريدة الرسمية في 31 دجنبر من كل سنة.'
      fr: 'Dans l’industrie, le commerce et les services, en dirhams, tel qu’en vigueur au 31 décembre de chaque année.'
    cites: [/ma/loi/65-99/art_356, /ma/decret/2-25-983/art_1]
