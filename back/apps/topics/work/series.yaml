  - key: farm-minimum
    title: {ar: 'الحد الأدنى للأجر عن يوم الشغل في الفلاحة', fr: 'Le salaire minimum de la journée agricole'}
    lead:
      ar: 'بالدرهم، كما في الجريدة الرسمية في 31 دجنبر من كل سنة. ارتفع منذ 2022 أسرع من الحد الأدنى في غير الفلاحة، والتوحيد معلن في أفق 2028.'
      fr: 'En dirhams, tel qu’en vigueur au 31 décembre de chaque année. Il augmente plus vite que le minimum non agricole depuis 2022 ; l’unification est annoncée pour 2028.'
    cites: [/ma/loi/65-99/art_358, /ma/decret/2-25-983/art_2]
    table: 'المراسيم 2.19.424 و2.22.606 و2.23.799 و2.24.1122 و2.25.983'
