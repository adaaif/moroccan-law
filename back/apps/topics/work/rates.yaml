# The figures the work tools read (T17 of the work plan): each set by a decree or a law, in force from a date, with the
# article that sets it. A new decree is one row more. `open: true`: the end-of-contract tool, shown, as chosen, before a
# professional's review, reads them; they are the decrees' own numbers.

- key: smig
  open: true
  title: {ar: 'الحد الأدنى للأجر عن ساعة الشغل (غير الفلاحة)', fr: 'Salaire minimum horaire (hors agriculture)'}
  unit: {ar: درهم للساعة, fr: DH de l’heure}
  rows:
    - {from: '2019-07-01', values: {hour: 14.13}, cites: [/ma/decret/2-19-424/art_1]}
    - {from: '2020-07-01', values: {hour: 14.81}, cites: [/ma/decret/2-19-424/art_2]}
    - {from: '2022-09-01', values: {hour: 15.55}, cites: [/ma/decret/2-22-606/art_1],
       note: {ar: 'في القطاع السياحي من فاتح يناير 2023', fr: 'dans le tourisme à partir du 1er janvier 2023'}}
    - {from: '2023-09-01', values: {hour: 16.29}, cites: [/ma/decret/2-23-799/art_1]}
    - {from: '2025-01-01', values: {hour: 17.10}, cites: [/ma/decret/2-24-1122/art_1]}
    - {from: '2026-01-01', values: {hour: 17.92}, cites: [/ma/decret/2-25-983/art_1]}

