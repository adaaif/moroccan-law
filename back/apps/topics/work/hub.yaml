    for: [employer]

# The tools run on the reader's phone; `tool: true` ones wait for a person's check (checked.yaml: tools/<key>), unless
# `open: true` shows one before, with a note that no professional has reviewed it yet (C2 «wait»: the end tool alone).
# The three the page draws as instruments (E6: registry INSTRUMENTS) are not listed again; the strike and the numbers
# sit among the texts (`place: whole`, E2 and E8).
tools:
  - key: end
    words: [شنو كيتسالني, التعويض عن الفصل, مستحقات, indemnité de licenciement, solde de tout compte]
    cites: [/ma/loi/65-99/art_43, /ma/decret/2-04-469/art_1, /ma/loi/65-99/art_53, /ma/loi/65-99/art_52, /ma/loi/65-99/art_41]
    tool: true
    open: true            # call T8 of the work plan (20 Oct 2026): shown before a professional's review
    title: {ar: شنو كيتسالني؟, fr: 'Qu’est-ce qui m’est dû ?'}
    lead: {ar: 'كل عام خدمة بساعاتو، وكل مبلغ بمادتو', fr: 'Chaque année de service en heures, chaque somme avec son article'}
    for: [company, farm, guard, employer]
  - key: pay
    words: [واش الخلصة قانونية, السميك, الساعات الإضافية, الأقدمية, ورقة الأداء, heures supplémentaires, prime d’ancienneté, bulletin de paie]
    tool: true
    title: {ar: ورقة الأداء, fr: Le bulletin de paie}
    lead: {ar: 'كل سطر كما يكتبه القانون، بمادته', fr: 'Chaque ligne comme la loi l’écrit, avec son article'}
    for: [company, farm, guard, home, employer]
  - key: cnss
    words: [التقاعد, الشوماج, التعويض عن فقدان الشغل, المعاش, أيامي فالضمان, retraite, chômage, ipe, perte d’emploi]
    tool: true
    title: {ar: أيامي فالضمان, fr: Mes jours à la CNSS}
    lead: {ar: 'المعاش والتعويض عن فقدان الشغل من أيامك', fr: 'La pension et l’indemnité pour perte d’emploi d’après vos jours'}
    for: [company, farm, guard, home]
  - key: dates
    icon: clock
    words: [آجال الشغل, آجال الخدمة, الآجال ديال الخدمة, آجال مدونة الشغل, délais du travail, délais code du travail]
    tool: true
    title: {ar: الآجال, fr: Les délais}
    lead: {ar: 'من نهار الحدث، كل أجل بتاريخه ومادته', fr: 'À partir du jour de l’événement, chaque délai à sa date'}
  - key: where
    icon: where
    words: [مفتش الشغل, مفتشية الشغل, فين نمشي, نشتكي, نشكي بالباطرون, فين نشكي بالباطرون, نشكي بالمشغل, inspecteur du travail, se plaindre]
    to: pages/where
    title: {ar: فين نمشي؟, fr: 'Où aller ?'}
    lead: {ar: 'مفتش الشغل، الضمان، المحكمة: ما يعطيه القانون عند كل باب', fr: 'Inspecteur, CNSS, tribunal : ce que la loi donne à chaque porte'}
  - key: proof
    icon: list
    words: [نثبت, الإثبات, الأوراق, preuve, prouver]
    to: checklists/proof
    title: {ar: خبّي هادشي من النهار الأول, fr: Ce qu’il faut garder dès le premier jour}
    lead: {ar: 'العقد، أوراق الأداء، كشف الضمان، والشهود', fr: 'Le contrat, les bulletins, le relevé CNSS, les témoins'}
  - key: strike
    words: [الإضراب, إضراب, قانون الإضراب, grève, droit de grève]
    to: pages/strike
    place: whole
    title: {ar: الإضراب, fr: La grève}
    lead: {ar: 'قانون الإضراب منذ 24 شتنبر 2025', fr: 'La loi sur la grève depuis le 24 septembre 2025'}
  - key: numbers
    words: [إحصائيات, أرقام, البطالة, statistiques, chômage]
    to: pages/numbers
    place: whole
    title: {ar: الشغل بالأرقام, fr: Le travail en chiffres}
    lead: {ar: 'أرقام رسمية بمصادرها', fr: 'Des chiffres officiels, avec leurs sources'}

# What workers believe (E17), each answered by the article in force and leading to its door. Drafts until a person
# checks them with the page they lead to.
beliefs:
  - claim: {ar: ما عنديش كونطرا مكتوبة، إذن ما عندي حتى حق, fr: 'Sans contrat écrit, je n’ai aucun droit'}
    truth: {ar: 'عقد الشغل يثبت بجميع وسائل الإثبات، مكتوبا كان أو لا (المادة 18).', fr: 'Le contrat de travail se prouve par tous moyens, écrit ou non (art. 18).'}
    to: checklists/proof
  - claim: {ar: وقعت توصيل تصفية كل حساب، سالات, fr: 'J’ai signé le reçu pour solde de tout compte, c’est fini'}
    truth: {ar: 'يمكن التراجع عن التوصيل داخل 60 يوما من توقيعه، برسالة مضمونة أو بدعوى (المادة 75).', fr: 'Le reçu peut être dénoncé dans les 60 jours de sa signature, par lettre recommandée ou en justice (art. 75).'}
    to: checklists/final-receipt
  - claim: {ar: التقاعد خاصو 3240 يوم فالضمان, fr: 'Il faut 3 240 jours CNSS pour une pension'}
    truth: {ar: 'المعاش يستحق من 1320 يوما منذ القانون 02.24؛ و3240 يوما تعطي نسبة 50%.', fr: 'La pension est due dès 1 320 jours depuis la loi 02.24 ; 3 240 jours donnent 50 %.'}
    to: journeys/retire

# The order a reviewer opens the topic in (E18): the dismissal, wages and the CNSS first, with the open tool and the
# band's articles; then the moments of a working life; the particular statuses and the numbers last.
waves:
  1: [journeys/dismissed, journeys/unpaid, journeys/not-declared, tools/end, checklists/final-receipt, checklists/proof]
  2: [journeys/accident, journeys/maternity, pages/leave, pages/new-job, journeys/resign, tools/pay, tools/cnss, tools/dates, pages/where]
  3: [journeys/home, pages/guards, pages/strike, journeys/retire, pages/civil-servants, pages/self-employed, pages/employers, checklists/employer-hire, checklists/employer-home, pages/numbers, reform/minimum-wage, reform/strike]
