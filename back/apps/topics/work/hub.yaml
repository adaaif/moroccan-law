      أجل الإخطار: [الإنذار قبل الطرد, الإنذار قبل الفصل, شحال ديال الإنذار, مدة الإنذار, مهلة الإخطار, الإخطار قبل الفصل,
                    الإنذار ديال الطرد, préavis, préavis de licenciement, durée du préavis, délai de préavis]
    title: {ar: 'أجل الإخطار قبل الطرد', fr: 'Le préavis avant le licenciement'}
    lead: {ar: 'من 8 أيام حتى 3 شهور، حسب الأقدمية والصنف', fr: 'De 8 jours à 3 mois, selon l’ancienneté et la catégorie'}
