# The work topic's page (T4–T5 of the work plan; the work-counted review, 26 Oct 2026): who you are, then what is happening,
# in the words people use, in a working life's order (E2: starting, pay, the CNSS, leave, a child, an accident,
# resigning, retiring), each door leading to a journey or a page; then the tools. A door, a tool or a page says whom it
# is for (`for`, the keys of the profile's answers); the reader's answer, kept on the phone, fades the others with the
# reason. A door marked `own` is listed only for the answers its `for` names: it is that answer's first door.
#
# A door's `mark` (E1) is the one number the law sets for it, drawn on a punch card with its unit: the reader came for
# it. `by` gives an answer its own number (the minimum by the day on a farm, as a share at home). A door no single
# number governs carries its paper instead (`icon` on the same card).
doors_title: {ar: شنو وقع ليك؟, fr: 'Que vous arrive-t-il ?'}

# The first days after a dismissal (E5, C1 «band»): the kit's band in ink, its acts the answers of the dismissal
# journey's steps (the decision, the receipt, the papers after), the days left once the reader gave that journey its
# day. Drawn whole for the readers the Labour Code governs and those who have not answered; one line for the others.
urgent:
  title: {ar: طردوك؟, fr: 'Licencié ?'}
  lead: {ar: 'الأيام الأولى بعد مقرر الفصل', fr: 'Les premiers jours après la décision de licenciement'}
  to: journeys/dismissed
  tone: ink
  day: {ar: نهار توصلت بالمقرر؟, fr: 'Décision reçue quand ?'}
  for: [company, farm, guard]
  acts: {journey: dismissed, steps: [2, 3, 7]}
  tool: tools/end

profile:
  question: {ar: فين خدام؟, fr: 'Où travaillez-vous ?'}
  options:
    - key: company
      label: {ar: شركة أو محل أو ورشة, fr: 'Entreprise, commerce, atelier'}
      law: {ar: 'قانونك هو مدونة الشغل (القانون 65.99).', fr: 'Votre loi est le Code du travail (loi 65.99).'}
      facts:
        - {value: '17,92', label: {ar: 'درهم للساعة: الحد الأدنى للأجر منذ فاتح يناير 2026', fr: 'DH de l’heure : le salaire minimum depuis le 1er janvier 2026'}, cites: [/ma/decret/2-25-983/art_1]}
        - {value: {ar: '44 ساعة', fr: '44 heures'}, label: {ar: 'مدة الشغل العادية في الأسبوع', fr: 'la durée normale de travail par semaine'}, cites: [/ma/loi/65-99/art_184]}
        - {value: {ar: '1,5 يوم', fr: '1,5 jour'}, label: {ar: 'عطلة سنوية عن كل شهر شغل', fr: 'de congé annuel par mois de travail'}, cites: [/ma/loi/65-99/art_231]}
    - key: farm
      label: {ar: فالفلاحة, fr: Agriculture}
      law: {ar: 'مدونة الشغل بقواعد الفلاحة: 2496 ساعة فالعام، والحد الأدنى للأجر محسوب باليوم.', fr: 'Le Code du travail, avec ses règles agricoles : 2 496 heures par an, un salaire minimum à la journée.'}
      facts:
        - {value: '97,44', label: {ar: 'درهم لليوم: الحد الأدنى في الفلاحة منذ فاتح أبريل 2026', fr: 'DH la journée : le minimum agricole depuis le 1er avril 2026'}, cites: [/ma/decret/2-25-983/art_2]}
        - {value: {ar: '2496 ساعة', fr: '2 496 heures'}, label: {ar: 'مدة الشغل العادية في السنة', fr: 'la durée normale de travail par an'}, cites: [/ma/loi/65-99/art_184]}
        - {value: {ar: '1,5 يوم', fr: '1,5 jour'}, label: {ar: 'عطلة سنوية عن كل شهر شغل', fr: 'de congé annuel par mois de travail'}, cites: [/ma/loi/65-99/art_231]}
    - key: guard
      first: guards
      label: {ar: سيكيريتي أو نظافة عند شركة, fr: Gardiennage ou nettoyage pour une société}
      law: {ar: 'مدونة الشغل. حراس شركات الحراسة خرجوا من نظام «ساعات الحضور» منذ 16 يوليوز 2026 (القانون 032.26).', fr: 'Le Code du travail. Les gardiens des sociétés de gardiennage sortent du régime des heures de présence depuis le 16 juillet 2026 (loi 032.26).'}
      facts:
        - {value: {ar: '16 يوليوز', fr: '16 juillet'}, label: {ar: '2026: ساعات الحراس ساعات شغل فعلي، لا ساعات حضور', fr: '2026 : les heures des gardiens sont du travail effectif, non de la présence'}, cites: [/ma/loi/32-26/art_1]}
        - {value: '17,92', label: {ar: 'درهم للساعة: الحد الأدنى للأجر', fr: 'DH de l’heure : le salaire minimum'}, cites: [/ma/decret/2-25-983/art_1, /ma/loi/65-99/art_356]}
        - {value: {ar: '1,5 يوم', fr: '1,5 jour'}, label: {ar: 'عطلة سنوية عن كل شهر، عند مقاولتك', fr: 'de congé par mois, chez votre entreprise'}, cites: [/ma/loi/65-99/art_231]}
      to: pages/guards
    - key: home
      first: home
      label: {ar: فدار (خدمة منزلية), fr: Dans une maison (travail domestique)}
      law: {ar: 'قانونك هو القانون 19.12 الخاص بالعاملات والعمال المنزليين، وليس مدونة الشغل.', fr: 'Votre loi est la loi 19.12 sur les travailleurs domestiques, pas le Code du travail.'}
      facts:
        - {value: '60%', label: {ar: 'من الحد الأدنى للأجر، نقدا، دون الأكل والسكن', fr: 'du salaire minimum, en espèces, hors repas et logement'}, cites: [/ma/loi/19-12/art_19]}
        - {value: {ar: '48 ساعة', fr: '48 heures'}, label: {ar: 'مدة الشغل في الأسبوع', fr: 'de travail par semaine'}, cites: [/ma/loi/19-12/art_13]}
        - {value: {ar: '18 سنة', fr: '18 ans'}, label: {ar: 'السن الأدنى للشغل في البيوت', fr: 'l’âge minimum du travail domestique'}, cites: [/ma/loi/19-12/art_6]}
      to: journeys/home
    - key: state
      first: civil-servants
      label: {ar: موظف فالدولة أو الجماعة, fr: Fonctionnaire de l’État ou d’une commune}
      law: {ar: 'قانونك هو النظام الأساسي العام للوظيفة العمومية، ونزاعاتك أمام المحكمة الإدارية. قانون الإضراب يشملك.', fr: 'Votre loi est le statut général de la fonction publique ; vos litiges vont au tribunal administratif. La loi sur la grève vous concerne.'}
      facts:
        - {value: {ar: 'النظام الأساسي', fr: 'Le statut'}, label: {ar: 'العام للوظيفة العمومية، لا مدونة الشغل', fr: 'général de la fonction publique, pas le Code du travail'}, cites: [/ma/dahir/1-58-008/art_1]}
        - {value: {ar: 'الإضراب', fr: 'La grève'}, label: {ar: 'قانونه يسري على القطاع العام كذلك', fr: 'sa loi s’applique aussi au secteur public'}, cites: [/ma/loi-organique/97-15/art_4]}
      to: pages/civil-servants
    - key: self
      first: self-employed
      label: {ar: بوحدي, fr: À mon compte}
      law: {ar: 'مدونة الشغل لا تحكمك: لك التأمين عن المرض (98.15) والتقاعد (99.15) ونظام المقاول الذاتي (114.13).', fr: 'Le Code du travail ne vous régit pas : vous relevez de l’AMO des indépendants (98.15), de leur retraite (99.15) et du statut d’auto-entrepreneur (114.13).'}
      facts:
        - {value: '98.15', label: {ar: 'التأمين عن المرض للمستقلين', fr: 'l’assurance maladie des indépendants'}, cites: [/ma/loi/98-15/art_1]}
        - {value: '99.15', label: {ar: 'التقاعد للمستقلين', fr: 'la retraite des indépendants'}, cites: [/ma/loi/99-15/art_1]}
        - {value: '114.13', label: {ar: 'نظام المقاول الذاتي', fr: 'le statut d’auto-entrepreneur'}, cites: [/ma/loi/114-13/art_1]}
      to: pages/self-employed
    # The employer (E4): the same articles from the other side, a door rather than a tool card.
    - key: employer
      first: employer-hire
      label: {ar: أنا اللي كنشغّل, fr: 'J’emploie quelqu’un'}
      law: {ar: 'نفس المواد من الجهة الأخرى: ما يفرضه القانون على المشغل.', fr: 'Les mêmes articles, de l’autre côté : ce que la loi impose à l’employeur.'}
      facts:
        - {value: '17,92', label: {ar: 'درهم للساعة: أقل أجر يؤديه المشغل', fr: 'DH de l’heure : le salaire le plus bas que verse l’employeur'}, cites: [/ma/decret/2-25-983/art_1]}
        - {value: {ar: 'ورقة الأداء', fr: 'Le bulletin'}, label: {ar: 'تسلم للأجير عند كل أداء', fr: 'remis au salarié à chaque paie'}, cites: [/ma/loi/65-99/art_370]}
        - {value: {ar: 'الضمان', fr: 'La CNSS'}, label: {ar: 'تسجيل الأجير والتصريح به', fr: 'immatriculer et déclarer le salarié'}, cites: [/ma/dahir/1-72-184/art_15]}
      to: pages/employers

events:
  # The notice before a dismissal (HM9 of the hard-moment review, 7 Nov 2026): asked «شحال ديال الإنذار», answered
  # by its own figure, never by the 90 days to sue. Found by search, never listed; it opens the end tool, which counts it
  # (decree 2.04.469 art. 1: executives one to three months, employees and workers eight days to two months).
  - key: notice
    listed: false
    moment: false         # search's alone: the topics page lists the moments people live, not their figures
    mark: {value: '3', unit: {ar: شهور على الأكثر, fr: mois au plus}}
    to: tools/end
    words: [الإنذار قبل الطرد, الإنذار قبل الفصل, شحال ديال الإنذار, مدة الإنذار, أجل الإخطار, مهلة الإخطار, الإخطار قبل الفصل,
            الإنذار ديال الطرد, préavis, préavis de licenciement, durée du préavis, délai de préavis, l2indar, l'indar]
