# The digital topic's page (the digital review, 27 Oct 2026, $5 of Haiku at most: what Moroccans need to
# understand their life online under Moroccan law). One question first, since the law a reader meets depends on what
# they do online: use apps and sites, suffer an attack, run a business that collects data, create content, ask the
# administration for information, or sign and buy online. Then the doors, each led by the message bubble every
# Moroccan's online life runs through (`marks: bubble`), with the one figure the law sets for the door inside it, or its
# pictogram. Written from the texts as the site holds them on 27 Oct 2026: law 09.08 on personal data and decree 2.09.165,
# law 31.13 on the right to information, law 2.00 on copyright (the SGG's consolidation with law 13.26 of 10 Aug 2026),
# the penal code (offences against data systems, privacy, extortion, fraud, harassment), the press code 88.13 (Adala, as
# published in 2016), law 43.20 on trust services with the DOC's arts 417-1 to 417-3, and law 05.20 on cybersecurity.
# Nothing here reaches a reader before a person checks it.
doors_title: {ar: شنو كتحتاج فالأنترنت؟, fr: 'De quoi avez-vous besoin en ligne ?'}
marks: bubble
stages:
  - {key: data, title: {ar: معطياتي الشخصية, fr: Mes données personnelles}, doors: [consent, access, rectify, spam, cndp]}
  - {key: attack, title: {ar: تعدّاو عليّا فالأنترنت, fr: 'On m’a attaqué en ligne'}, doors: [hacked, scam, extortion, intimate, montage, harassment, defamed]}
  - {key: info, title: {ar: معلومة من الإدارة, fr: 'Une information de l’administration'}, doors: [request, urgent-info, refused]}
  - {key: create, title: {ar: المحتوى ديالي وديال الناس, fr: 'Mes contenus et ceux des autres'}, doors: [protection, private-copy, quote, piracy]}
  - {key: sign, title: {ar: التوقيع والوثائق الإلكترونية, fr: 'Signature et documents électroniques'}, doors: [e-document, e-signature, trusted]}
  - {key: company, title: {ar: إلا عندي مقاولة ولا تطبيق, fr: 'Si j’ai une entreprise ou une application'}, doors: [declare, sensitive, abroad, incident]}
  - {key: elsewhere, title: {ar: فمواضيع أخرى, fr: 'Dans d’autres thèmes'}, doors: [online-buy, complaint, prescription, violence, card-data], links: true}

# The band: the moment someone threatens to publish your pictures or messages, the online emergency every family
# fears. Its acts are the extortion journey's first answers; its tool is the offences tool. No number is shown: no
# official page gives one.
urgent:
  title: {ar: كيبتزوك ولا نشرو صورك؟, fr: 'Menacé ou vos photos publiées ?'}
  lead: {ar: 'شنو كيقول القانون من النهار الأول', fr: 'Ce que dit la loi dès le premier jour'}
  to: journeys/extortion
  tone: slate
  acts: {journey: extortion, steps: [0, 1, 2]}
  tool: tools/offence
  tool_label: {ar: 'شنو كيقول القانون على اللي وقع ليك؟', fr: 'Que dit la loi de ce qui vous arrive ?'}

learn: [pages/data, pages/offences, journeys/info-request, pages/copyright, pages/beliefs]

# What people believe, and what the law says, each card leading to the page that answers it.
beliefs:
  - claim: {ar: 'اللي سجل مكالمة خاصة ولا صور واحد فدارو ما عندو حتى مشكل', fr: 'Enregistrer un appel privé ou filmer quelqu’un chez lui, ce n’est rien'}
    truth: {ar: 'تسجيل أو نشر كلام خاص، أو صورة شخص فمكان خاص، بلا موافقتو: الحبس من 6 أشهر حتى 3 سنين.', fr: 'Enregistrer ou diffuser des propos privés, ou l’image d’une personne dans un lieu privé, sans son accord : six mois à trois ans de prison.'}
    to: pages/beliefs
  - claim: {ar: 'التشهير فالفيسبوك ماشي صحافة، ما فيه عقوبة', fr: 'Diffamer sur Facebook n’est pas de la presse, ce n’est pas puni'}
    truth: {ar: 'قانون الصحافة كيشمل الوسائل الإلكترونية: القذف فحق الأفراد غرامتو من 10.000 حتى 100.000 درهم؛ والقانون الجنائي كيعاقب على نشر ادعاءات كاذبة للتشهير بالحبس.', fr: 'Le code de la presse vise les moyens électroniques : la diffamation envers un particulier coûte 10 000 à 100 000 DH ; le code pénal punit de prison la diffusion d’allégations fausses pour diffamer.'}
    to: pages/beliefs
  - claim: {ar: 'نقدر نشكي على السب فالأنترنت فوقما بغيت', fr: 'On peut porter plainte pour injure en ligne quand on veut'}
    truth: {ar: 'جرائم قانون الصحافة كتتقادم بستة أشهر كاملة من نهار النشر.', fr: 'Les délits du code de la presse se prescrivent par six mois révolus à compter de la publication.'}
    to: pages/beliefs
  - claim: {ar: 'الشركة عندها نمرتي، يعني تقدر تصيفط ليا الإشهار', fr: 'L’entreprise a mon numéro, elle peut m’envoyer de la publicité'}
    truth: {ar: 'الاستقراء المباشر بالرسائل والبريد الإلكتروني ممنوع بلا رضاك المسبق.', fr: 'La prospection directe par messages ou courriel est interdite sans votre consentement préalable.'}
    to: pages/beliefs
  - claim: {ar: 'الإدارة ما ملزماش تعطيني المعلومة', fr: 'L’administration n’est pas tenue de me répondre'}
    truth: {ar: 'خاصها تجاوب داخل 20 يوم عمل، والرفض خاصو يكون مكتوب ومعلل، ومن بعد الشكاية واللجنة والمحكمة الإدارية.', fr: 'Elle répond dans les 20 jours ouvrables, tout refus est écrit et motivé, puis viennent la réclamation, la commission et le tribunal administratif.'}
    to: pages/beliefs
  - claim: {ar: 'إلا سالات مدة الحماية، الاستغلال التجاري فابور', fr: 'Une œuvre tombée dans le domaine public s’exploite gratuitement'}
    truth: {ar: 'منذ القانون 13.26، الاستغلال التجاري لمصنف سالات حمايتو خاصو ترخيص من المكتب المغربي لحقوق المؤلف ومستحقات.', fr: 'Depuis la loi 13.26, l’exploitation commerciale d’une œuvre dont la protection a expiré requiert une autorisation du BMDA et une redevance.'}
    to: pages/beliefs
  - claim: {ar: 'التوقيع الإلكتروني ما عندو قيمة أمام المحكمة', fr: 'La signature électronique ne vaut rien devant le juge'}
    truth: {ar: 'الوثيقة الإلكترونية عندها نفس قوة الإثبات ديال الورق؛ والتوقيع المؤهل مع الختم الزمني بحال التوقيع المصادق عليه.', fr: 'Le document électronique a la même force probante que le papier ; la signature qualifiée avec horodatage vaut signature légalisée.'}
    to: pages/beliefs

# The order a reviewer opens the topic in: the attacks people suffer most first, then their data and the
# administration's information, then creation, signature and the company's duties.
waves:
  1: [journeys/extortion, journeys/hacked, journeys/scam, journeys/defamed, pages/offences, pages/beliefs, tools/offence, checklists/complaint]
  2: [journeys/data-request, journeys/cndp, journeys/info-request, pages/data, pages/info, tools/letter, tools/info, checklists/data-request, checklists/info-request]
  3: [journeys/copyright, journeys/company, pages/copyright, pages/esign, pages/company, tools/copyright, checklists/company-duties, reform/access-2019, reform/cyber-2021, reform/trust-2023, reform/copyright-2026]

# The one question: what the reader does online. Each answer names the law that governs it, three figures with their
# articles, and leads with its own door; it is kept on the phone.
profile:
  question: {ar: شنو كتدير فالأنترنت؟, fr: 'Que faites-vous en ligne ?'}
  options:
    - key: user
      first: access
      main: true
      label: {ar: كنستعمل التطبيقات والمواقع, fr: 'J’utilise des applications et des sites'}
      law: {ar: 'القانون 09.08: معطياتك ما كتعالجش بلا رضاك، ومن حقك تعرف شنو عندهم وتصححو ولا تمسحو.', fr: 'La loi 09.08 : vos données ne sont pas traitées sans votre consentement, et vous pouvez savoir ce qu’on détient, le corriger ou l’effacer.'}
      facts:
        - {value: {ar: 'الرضى', fr: 'Le consentement'}, label: {ar: 'شرط لمعالجة معطياتك، إلا فحالات يعددها القانون', fr: 'condition du traitement, sauf les cas que la loi énumère'}, cites: [/ma/loi/9-08/art_4]}
        - {value: {ar: '0 درهم', fr: '0 DH'}, label: {ar: 'باش تعرف شنو كيعالجو من معطياتك، فالحين', fr: 'pour savoir quelles données on traite sur vous, sans délai'}, cites: [/ma/loi/9-08/art_7]}
        - {value: {ar: '10 أيام', fr: '10 jours'}, label: {ar: 'كاملة باش يصححو ولا يمسحو، وإلا اللجنة الوطنية', fr: 'francs pour corriger ou effacer, sinon la CNDP'}, cites: [/ma/loi/9-08/art_8]}
    - key: victim
      first: extortion
      main: true
      label: {ar: تعدّاو عليّا فالأنترنت, fr: 'J’ai été attaqué en ligne'}
      law: {ar: 'القانون الجنائي وقانون الصحافة: القرصنة والنصب والابتزاز ونشر الصور الخاصة والتحرش والتشهير جرائم، والشكاية لوكيل الملك.', fr: 'Le code pénal et le code de la presse : piratage, escroquerie, chantage, diffusion d’images privées, harcèlement et diffamation sont des infractions ; la plainte va au procureur.'}
      facts:
        - {value: {ar: '1–5 سنين', fr: '1 à 5 ans'}, label: {ar: 'حبس على الابتزاز بالتهديد بالفضيحة', fr: 'de prison pour le chantage à la révélation'}, cites: [/ma/dahir/1-59-413/art_538]}
        - {value: {ar: '6 شهور–3 سنين', fr: '6 mois à 3 ans'}, label: {ar: 'حبس على نشر صورة فمكان خاص بلا موافقة', fr: 'de prison pour diffuser une image prise dans un lieu privé sans accord'}, cites: [/ma/dahir/1-59-413/art_447-1]}
        - {value: {ar: '15 يوم', fr: '15 jours'}, label: {ar: 'باش يعلمك وكيل الملك بمآل الشكاية من نهار القرار', fr: 'pour que le procureur vous informe de la suite, après sa décision'}, cites: [/ma/loi/22-01/art_40]}
    - key: business
      first: declare
      main: true
      label: {ar: عندي مقاولة ولا تطبيق كيجمع المعطيات, fr: 'J’ai une entreprise ou une application qui collecte des données'}
      law: {ar: 'القانون 09.08: التصريح للجنة الوطنية قبل المعالجة، وإذن مسبق للمعطيات الحساسة، واحترام حقوق الناس؛ والقانون 05.20 للأمن السيبراني.', fr: 'La loi 09.08 : déclarer à la CNDP avant de traiter, une autorisation préalable pour les données sensibles, respecter les droits des personnes ; et la loi 05.20 sur la cybersécurité.'}
      facts:
        - {value: {ar: '10.000–100.000', fr: '10 000 à 100 000'}, label: {ar: 'درهم غرامة على المعالجة بلا تصريح ولا إذن', fr: 'DH d’amende pour un traitement sans déclaration ni autorisation'}, cites: [/ma/loi/9-08/art_52, /ma/loi/9-08/art_12]}
        - {value: {ar: '20.000–200.000', fr: '20 000 à 200 000'}, label: {ar: 'درهم على كل رفض لحقوق الولوج والتصحيح والتعرض', fr: 'DH pour chaque refus des droits d’accès, de rectification et d’opposition'}, cites: [/ma/loi/9-08/art_53]}
        - {value: {ar: 'الرضى', fr: 'Le consentement'}, label: {ar: 'مسبق قبل أي رسالة إشهارية', fr: 'préalable avant tout message publicitaire'}, cites: [/ma/loi/9-08/art_10]}
    - key: creator
      first: protection
      main: true
      label: {ar: كنصنع وننشر محتوى, fr: 'Je crée et je publie des contenus'}
      law: {ar: 'القانون 2.00: المصنف محمي بلا إجراء، طيلة حياة المؤلف و70 سنة من بعد وفاته، والحقوق المعنوية ديما.', fr: 'La loi 2.00 : l’œuvre est protégée sans formalité, la vie de l’auteur et 70 ans après sa mort, le droit moral pour toujours.'}
      facts:
        - {value: {ar: '70 سنة', fr: '70 ans'}, label: {ar: 'من بعد وفاة المؤلف كتبقى الحقوق المادية', fr: 'après la mort de l’auteur pour les droits patrimoniaux'}, cites: [/ma/loi/2-00/art_25]}
        - {value: {ar: 'الاستشهاد', fr: 'La citation'}, label: {ar: 'مسموح بلا إذن، مع ذكر المصدر واسم المؤلف', fr: 'permise sans autorisation, en citant la source et l’auteur'}, cites: [/ma/loi/2-00/art_14]}
        - {value: {ar: '2–6 شهور', fr: '2 à 6 mois'}, label: {ar: 'حبس، و10.000 حتى 100.000 درهم، على القرصنة بقصد الاستغلال التجاري', fr: 'de prison et 10 000 à 100 000 DH pour le piratage à but commercial'}, cites: [/ma/loi/2-00/art_64]}
    - key: citizen
      first: request
      label: {ar: بغيت معلومة من الإدارة, fr: 'Je veux une information de l’administration'}
      law: {ar: 'القانون 31.13: الحق فالمعلومة اللي عند الإدارات والمحاكم والجماعات، مجانا، وبجواب داخل أجل محدد.', fr: 'La loi 31.13 : le droit aux informations détenues par les administrations, tribunaux et collectivités, gratuitement, avec une réponse dans un délai fixé.'}
      facts:
        - {value: {ar: '20 يوم عمل', fr: '20 jours ouvrables'}, label: {ar: 'باش تجاوب الإدارة، وتقدر تزيد 20 بإشعار مكتوب', fr: 'pour répondre, prolongeables de 20 avec un avis écrit'}, cites: [/ma/loi/31-13/art_16]}
        - {value: {ar: '3 أيام', fr: '3 jours'}, label: {ar: 'فالحالة المستعجلة لحماية الحياة والسلامة والحرية', fr: 'en urgence, pour protéger la vie, la sécurité ou la liberté'}, cites: [/ma/loi/31-13/art_17]}
        - {value: {ar: '60 يوم', fr: '60 jours'}, label: {ar: 'باش تطعن أمام المحكمة الإدارية من جواب اللجنة', fr: 'pour saisir le tribunal administratif après la commission'}, cites: [/ma/loi/31-13/art_21]}
    - key: signer
      first: e-document
      label: {ar: كنوقع ولا كنشري من الأنترنت, fr: 'Je signe ou j’achète en ligne'}
      law: {ar: 'قانون الالتزامات والعقود والقانون 43.20: الوثيقة الإلكترونية بحال الورق، والتوقيع الإلكتروني ثلاث مستويات؛ وقانون حماية المستهلك للشراء عن بعد.', fr: 'Le DOC et la loi 43.20 : le document électronique vaut le papier, la signature électronique a trois niveaux ; et la loi sur le consommateur pour l’achat à distance.'}
      facts:
        - {value: {ar: 'بحال الورق', fr: 'Comme le papier'}, label: {ar: 'قوة إثبات الوثيقة الإلكترونية، إلا تعرفنا على صاحبها وتحفظت مزيان', fr: 'force probante du document électronique, si son auteur est identifié et son intégrité garantie'}, cites: [/ma/code/doc/art_417-1]}
        - {value: {ar: '3 مستويات', fr: '3 niveaux'}, label: {ar: 'للتوقيع الإلكتروني: بسيط، متقدم، مؤهل', fr: 'de signature électronique : simple, avancée, qualifiée'}, cites: [/ma/loi/43-20/art_5, /ma/loi/43-20/art_6, /ma/loi/43-20/art_7]}
        - {value: {ar: '7 أيام', fr: '7 jours'}, label: {ar: 'باش تتراجع على شي حاجة شريتيها عن بعد', fr: 'pour se rétracter d’un achat à distance'}, cites: [/ma/loi/31-08/art_36]}

