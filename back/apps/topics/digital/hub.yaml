tools:
  # «شنو كيقول القانون؟»: what happened online → the offence the texts name, its penalty as they print it (prison and
  # fine ranges), whether the victim's complaint is needed, the prescription, where to complain; drawn as the law
  # answering in a conversation. It never says what a court will decide. It waits for a person's check.
  - key: offence
    icon: hush
    words: [شنو العقوبة على الابتزاز, عقوبة القرصنة, عقوبة التشهير, sanction diffusion photos, peine piratage maroc]
    means: كل من دخل إلى مجموع أو بعض نظام للمعالجة الآلية للمعطيات عن طريق الاحتيال
    tool: true
    title: {ar: 'شنو كيقول القانون على اللي وقع ليا؟', fr: 'Que dit la loi de ce qui m’arrive ?'}
    lead: {ar: 'قول شنو وقع: الجريمة، العقوبة، التقادم، وفين تشكي', fr: 'Dites ce qui s’est passé : l’infraction, la peine, la prescription, où porter plainte'}
    cites: [/ma/dahir/1-59-413/art_607-3, /ma/dahir/1-59-413/art_607-6, /ma/dahir/1-59-413/art_540, /ma/dahir/1-59-413/art_538, /ma/dahir/1-59-413/art_447-1, /ma/dahir/1-59-413/art_447-2, /ma/dahir/1-59-413/art_447-3, /ma/dahir/1-59-413/art_503-1-1, /ma/loi/88-13/art_83, /ma/loi/88-13/art_85, /ma/loi/88-13/art_99, /ma/loi/88-13/art_101, /ma/loi/9-08/art_53, /ma/loi/9-08/art_28, /ma/loi/22-01/art_5, /ma/loi/22-01/art_40]
  # The information request's road (31.13): the day the request was received and whether it is urgent → the last day
  # to answer, the extension, the window for the complaint to the head, his answer, the commission and the
  # administrative court, in working days where the law counts them so.
  - key: info
    icon: clock
    words: [حساب أجل جواب الإدارة, délai réponse administration information, شحال باقي باش تجاوب الإدارة]
    means: يجب على المؤسسة أو الهيئة المعنية الرد على طلب الحصول على المعلومات داخل أجل لا يتعدى عشرين (20) يوما من أيام العمل
    tool: true
    title: {ar: 'فوقاش خاص الإدارة تجاوب؟', fr: 'Quand l’administration doit-elle répondre ?'}
    lead: {ar: 'من نهار توصلات بالطلب: الجواب، التمديد، الشكاية، اللجنة، والمحكمة', fr: 'Du jour de la réception : la réponse, la prolongation, la réclamation, la commission, le tribunal'}
    cites: [/ma/loi/31-13/art_16, /ma/loi/31-13/art_17, /ma/loi/31-13/art_19, /ma/loi/31-13/art_20, /ma/loi/31-13/art_21, /ma/loi/31-13/art_5]
  # The data request: which rights, to whom → a letter that names its articles (09.08 arts 7, 8, 9, 10), the ten full
  # days to correct, and what follows a refusal (the CNDP, art. 28; the fine of art. 53).
  - key: letter
    icon: letter
    words: [نموذج طلب الولوج للمعطيات, lettre droit d'accès données, demande suppression données modèle, طلب مسح المعطيات]
    means: يحق للشخص المعني بعد الإدلاء بما يثبت هويته أن يحصل من المسؤول عن المعالجة
    tool: true
    title: {ar: 'طلب لشركة على معطياتي', fr: 'Une demande à une entreprise sur mes données'}
    lead: {ar: 'اختار الحق، وكتبنا ليك الطلب بالمواد ديالو والأجل', fr: 'Choisissez le droit : la demande écrite avec ses articles et son délai'}
    cites: [/ma/loi/9-08/art_7, /ma/loi/9-08/art_8, /ma/loi/9-08/art_9, /ma/loi/9-08/art_10, /ma/loi/9-08/art_28, /ma/loi/9-08/art_53]
  # Copyright's term (2.00 arts 25–29, 1-7): the kind of work and the death or the first publication → the last day of
  # protection, the first day it is free, and that commercial use still needs the copyright office's licence.
  - key: copyright
    icon: seal
    words: [حساب مدة حماية حقوق المؤلف, calcul domaine public maroc, واش هاد الكتاب ولا الأغنية مازال محمي]
    means: تحمى الحقوق المادية لمؤلف مصنف ما طيلة حياته وخلال سبعين سنة بعد وفاته
    tool: true
    title: {ar: 'واش هاد العمل مازال محمي؟', fr: 'Cette œuvre est-elle encore protégée ?'}
    lead: {ar: 'من وفاة المؤلف ولا أول نشر: آخر نهار ديال الحماية', fr: 'De la mort de l’auteur ou de la première publication : le dernier jour de protection'}
    cites: [/ma/loi/2-00/art_25, /ma/loi/2-00/art_26, /ma/loi/2-00/art_27, /ma/loi/2-00/art_28, /ma/loi/2-00/art_29, /ma/loi/2-00/art_1-7]
