# What changed online (the digital review): one item per change, its stage said first, its dated official record.
# Stages: in_force, coming, bill, announced. Checked against the BO on 27 Oct 2026; each item is followed on its own.

- key: access-2019
  title: {ar: 'الحق في الحصول على المعلومات (القانون 31.13)', fr: 'Le droit d’accès à l’information (loi 31.13)'}
  stage: in_force
  stages: &stages
    - {key: announced, label: {ar: معلن, fr: Annoncé}}
    - {key: bill, label: {ar: مشروع في البرلمان, fr: Projet au Parlement}}
    - {key: coming, label: {ar: قانون لم يدخل حيز التنفيذ, fr: Loi pas encore en vigueur}}
    - {key: in_force, label: {ar: نافذ, fr: En vigueur}}
  checked_on: '2026-10-27'
  line: {ar: 'منذ 12 مارس 2019: طلب مكتوب ومجاني، جواب داخل 20 يوم عمل، ثم الشكاية واللجنة والمحكمة الإدارية.', fr: 'Depuis le 12 mars 2019 : une demande écrite et gratuite, une réponse en 20 jours ouvrables, puis la réclamation, la commission et le tribunal administratif.'}
  timeline:
    - date: '2018-03-12'
      text: {ar: 'نشر القانون 31.13 في الجريدة الرسمية؛ يدخل حيز التنفيذ بعد سنة من نشره.', fr: 'Publication de la loi 31.13 au BO ; entrée en vigueur un an après.'}
      source: {name: {ar: 'الجريدة الرسمية عدد 6655', fr: 'BO n° 6655'}}
      cites: [/ma/loi/31-13/art_30]
    - date: '2019-03-12'
      text: {ar: 'دخول القانون 31.13 حيز التنفيذ.', fr: 'Entrée en vigueur de la loi 31.13.'}
      cites: [/ma/loi/31-13/art_30]

- key: cyber-2021
  title: {ar: 'الأمن السيبراني (القانون 05.20)', fr: 'La cybersécurité (loi 05.20)'}
  stage: in_force
  stages: *stages
  checked_on: '2026-10-27'
  line: {ar: 'منذ غشت 2021: سياسة أمن لكل هيئة، وإبلاغ السلطة الوطنية فور العلم بحادث.', fr: 'Depuis août 2021 : une politique de sécurité pour chaque organisme, et l’avis à l’autorité nationale dès un incident.'}
  timeline:
    - date: '2020-07-30'
      text: {ar: 'نشر القانون 05.20 المتعلق بالأمن السيبراني؛ يدخل حيز التنفيذ بنشر نصوصه التطبيقية.', fr: 'Publication de la loi 05.20 sur la cybersécurité ; entrée en vigueur avec ses textes d’application.'}
      source: {name: {ar: 'الجريدة الرسمية عدد 6904', fr: 'BO n° 6904'}}
      cites: [/ma/loi/5-20/art_53]
    - date: '2021-08-09'
      text: {ar: 'نشر المرسوم 2.21.406 بتطبيق القانون 05.20.', fr: 'Publication du décret 2.21.406 d’application de la loi 05.20.'}
      source: {name: {ar: 'الجريدة الرسمية عدد 7011', fr: 'BO n° 7011'}}
      cites: [/ma/decret/2-21-406/art_1]

- key: trust-2023
  title: {ar: 'خدمات الثقة والتوقيع الإلكتروني (القانون 43.20)', fr: 'Les services de confiance et la signature électronique (loi 43.20)'}
  stage: in_force
  stages: *stages
  checked_on: '2026-10-27'
  line: {ar: 'منذ يناير 2023: ثلاثة مستويات للتوقيع الإلكتروني، والختم والختم الزمني، ومقدمو خدمات معتمدون؛ ونسخ جزء من القانون 53.05.', fr: 'Depuis janvier 2023 : trois niveaux de signature électronique, cachet et horodatage, prestataires agréés ; une partie de la loi 53.05 abrogée.'}
  timeline:
    - date: '2021-01-11'
      text: {ar: 'نشر القانون 43.20 المتعلق بخدمات الثقة؛ يدخل حيز التنفيذ بنشر نصوصه التطبيقية، وينسخ الباب التمهيدي والقسم الثاني من القانون 53.05.', fr: 'Publication de la loi 43.20 sur les services de confiance ; entrée en vigueur avec ses textes d’application ; abrogation du titre préliminaire et du titre II de la loi 53.05.'}
      source: {name: {ar: 'الجريدة الرسمية عدد 6951', fr: 'BO n° 6951'}}
      cites: [/ma/loi/43-20/art_83, /ma/loi/43-20/art_84]
    - date: '2023-01-12'
      text: {ar: 'نشر المرسوم 2.22.687 بتطبيق القانون 43.20.', fr: 'Publication du décret 2.22.687 d’application de la loi 43.20.'}
      source: {name: {ar: 'الجريدة الرسمية عدد 7160', fr: 'BO n° 7160'}}
      cites: [/ma/decret/2-22-687/art_1]

- key: copyright-2026
  title: {ar: 'تعديل حقوق المؤلف (القانون 13.26)', fr: 'La réforme du droit d’auteur (loi 13.26)'}
  stage: in_force
  stages: *stages
  checked_on: '2026-10-27'
  line: {ar: 'في 10 غشت 2026: الاستغلال التجاري للمصنفات التي انقضت حمايتها بترخيص من المكتب المغربي لحقوق المؤلف ومستحقات، وتعديل عقوبات المادة 64.', fr: 'Le 10 août 2026 : l’exploitation commerciale des œuvres dont la protection a expiré soumise à l’autorisation du BMDA et à redevance, et l’article 64 modifié.'}
  timeline:
    - date: '2026-08-10'
      text: {ar: 'نشر القانون 13.26 بتغيير وتتميم القانون 2.00: المادة 1-7 الجديدة، وتغيير المواد 1 و7 و10 و64 وغيرها.', fr: 'Publication de la loi 13.26 modifiant la loi 2.00 : le nouvel article 7-1, et les articles 1, 7, 10, 64 notamment modifiés.'}
      source: {name: {ar: 'الجريدة الرسمية عدد 7533', fr: 'BO n° 7533'}}
      cites: [/ma/loi/13-26/art_1, /ma/loi/13-26/art_2]
