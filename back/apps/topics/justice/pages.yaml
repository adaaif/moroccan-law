# The justice topic's pages (the justice review): the courts and what each decides, every deadline in one table, the
# lawyer, legal aid, the alternative sentences, prison, unpaid fines and the prescription of sentences, and what people
# believe. Every fact names its articles, as the site holds them on 27 Oct 2026.

- key: courts
  title: {ar: 'المحاكم: من يحكم في ماذا', fr: 'Les tribunaux : qui juge quoi'}
  lead:
    ar: 'منذ 23 غشت 2026 يوزع القانون 58.25 القضايا المدنية بين قضاء القرب والمحاكم الابتدائية وأقسامها المتخصصة والمحاكم الإدارية والتجارية، ثم محاكم الاستئناف ومحكمة النقض.'
    fr: 'Depuis le 23 août 2026, la loi 58.25 répartit les affaires civiles entre la proximité, les tribunaux de première instance et leurs sections, les juridictions administratives et commerciales, puis les cours d’appel et la Cour de cassation.'
  cites: [/ma/loi/58-25/art_29]
  sections:
    - title: {ar: 'جنبا إلى جنب', fr: 'Côte à côte'}
      table:
        head: [{ar: '', fr: ''}, {ar: 'ما يحكم فيه', fr: 'Ce qu’il juge'}, {ar: 'الطعن', fr: 'Le recours'}]
        rows:
          - [{ar: 'قاضي القرب', fr: 'Juge de proximité'}, {ar: 'الدعاوى الشخصية والمنقولة دون 5.000 درهم، لا الأسرة ولا العقار ولا الاجتماعي ولا الإداري ولا الإفراغ', fr: 'Actions personnelles et mobilières sous 5 000 DH, hors famille, immobilier, social, administratif, expulsions'}, {ar: 'طلب الإلغاء داخل 15 يوما في حالات محددة', fr: 'Demande d’annulation sous 15 jours dans des cas précis'}]
          - [{ar: 'المحكمة الابتدائية', fr: 'Tribunal de première instance'}, {ar: 'المدني والاجتماعي والأسرة، وكل ما لم يسند لغيرها', fr: 'Civil, social, famille, et tout ce qui n’est pas attribué ailleurs'}, {ar: 'حتى 10.000 درهم لا استئناف؛ وفوقها الاستئناف داخل 30 يوما', fr: 'Jusqu’à 10 000 DH sans appel ; au-delà, appel sous 30 jours'}]
          - [{ar: 'القسم التجاري أو المحكمة التجارية', fr: 'Section ou tribunal de commerce'}, {ar: 'القضايا التجارية؛ والمحكمة الابتدائية تحكم فيها حتى 80.000 درهم حيث لا محكمة تجارية', fr: 'Affaires commerciales ; le tribunal de première instance en juge jusqu’à 80 000 DH là où il n’y a pas de tribunal de commerce'}, {ar: 'الاستئناف داخل 30 يوما', fr: 'Appel sous 30 jours'}]
          - [{ar: 'القسم الإداري أو المحكمة الإدارية', fr: 'Section ou tribunal administratif'}, {ar: 'إلغاء قرارات الإدارة، العقود الإدارية، تعويض أضرار أشخاص القانون العام، المعاشات، الانتخابات، نزع الملكية', fr: 'Annulation des décisions, contrats administratifs, dommages des personnes publiques, pensions, élections, expropriation'}, {ar: 'الاستئناف معفى من الرسم القضائي', fr: 'Appel exonéré du droit judiciaire'}]
          - [{ar: 'محكمة النقض', fr: 'Cour de cassation'}, {ar: 'النقض في الأحكام الانتهائية، فوق 30.000 درهم وخارج الكراء', fr: 'Pourvois contre les décisions en dernier ressort, au-delà de 30 000 DH et hors loyers'}, {ar: 'بمحام مقبول أمامها، داخل 30 يوما', fr: 'Par avocat agréé, sous 30 jours'}]
      cites: [/ma/loi/58-25/art_331, /ma/loi/58-25/art_32, /ma/loi/58-25/art_29, /ma/loi/58-25/art_30, /ma/loi/58-25/art_31, /ma/loi/58-25/art_38, /ma/loi/58-25/art_215, /ma/loi/58-25/art_375, /ma/loi/58-25/art_376]
      tool: tools/court
    - title: {ar: 'القضايا الاجتماعية', fr: 'Les affaires sociales'}
      facts:
        - text: {ar: 'تختص المحاكم الابتدائية بنزاعات عقود الشغل والتدريب، وتعويض حوادث الشغل والأمراض المهنية، ونزاعات الضمان الاجتماعي.', fr: 'Les tribunaux de première instance connaissent des litiges du contrat de travail et de stage, de la réparation des accidents du travail et maladies professionnelles, et de la sécurité sociale.'}
          cites: [/ma/loi/58-25/art_33]
        - text: {ar: 'يستفيد الأجير وذوو حقوقه من المساعدة القضائية بقوة القانون في جميع الدرجات وفي التنفيذ.', fr: 'Le salarié et ses ayants droit bénéficient de plein droit de l’assistance judiciaire à tous les degrés et pour l’exécution.'}
          cites: [/ma/loi/58-25/art_311]
    - title: {ar: 'المسطرة الشفوية', fr: 'La procédure orale'}
      facts:
        - text: {ar: 'المسطرة كتابية في الأصل، وشفوية في القضايا حتى 10.000 درهم، والزواج والنفقة وبيت الزوجية والطلاق الاتفاقي والحضانة والزيارة، والحالة المدنية، والاجتماعي، والكراء.', fr: 'La procédure est écrite en principe, orale jusqu’à 10 000 DH, pour le mariage, la pension, le logement conjugal, le divorce par consentement, la garde et la visite, l’état civil, le social et les loyers.'}
          cites: [/ma/loi/58-25/art_95, /ma/loi/58-25/art_96]
    - title: {ar: 'في القضايا الزجرية', fr: 'Au pénal'}
      facts:
        - text: {ar: 'ترفع الدعوى العمومية إلى المحكمة الابتدائية بالاستدعاء المباشر أو بإحالة من النيابة العامة أو من قاضي التحقيق أو بالتقديم الفوري؛ والجنايات أمام غرفة الجنايات بمحكمة الاستئناف، بمحام إلزاما.', fr: 'L’action publique est portée devant le tribunal de première instance par citation directe, renvoi du parquet ou du juge d’instruction, ou comparution immédiate ; les crimes devant la chambre criminelle de la cour d’appel, avec un avocat obligatoire.'}
          cites: [/ma/loi/22-01/art_384, /ma/loi/22-01/art_316]

- key: deadlines
  title: {ar: 'الآجال: كل أجل بمادته', fr: 'Les délais : chacun avec son article'}
  lead:
    ar: 'في القانونين معا الأجل كامل: لا يحسب يوم التبليغ ولا اليوم الأخير، وإذا صادف اليوم الأخير يوم عطلة امتد إلى أول يوم عمل.'
    fr: 'Dans les deux codes, le délai est franc : ni le jour de la notification ni le dernier ne comptent, et un dernier jour férié reporte au premier jour ouvrable.'
  cites: [/ma/loi/58-25/art_602, /ma/loi/22-01/art_750]
  sections:
    - title: {ar: 'في المدني', fr: 'Au civil'}
      table:
        head: [{ar: 'ماذا', fr: 'Quoi'}, {ar: 'الأجل', fr: 'Délai'}, {ar: 'من', fr: 'À compter de'}]
        rows:
          - [{ar: 'استئناف حكم ابتدائي', fr: 'Appel d’un jugement'}, {ar: '30 يوما', fr: '30 jours'}, {ar: 'التبليغ', fr: 'la notification'}]
          - [{ar: 'التعرض على حكم غيابي غير قابل للاستئناف', fr: 'Opposition à un jugement par défaut sans appel'}, {ar: '15 يوما', fr: '15 jours'}, {ar: 'التبليغ', fr: 'la notification'}]
          - [{ar: 'استئناف أمر استعجالي', fr: 'Appel d’une ordonnance de référé'}, {ar: '15 يوما', fr: '15 jours'}, {ar: 'التبليغ', fr: 'la notification'}]
          - [{ar: 'التعرض على الأمر بالأداء', fr: 'Opposition à injonction de payer'}, {ar: '15 يوما', fr: '15 jours'}, {ar: 'التبليغ', fr: 'la notification'}]
          - [{ar: 'استئناف الحكم في التعرض على الأمر بالأداء', fr: 'Appel du jugement sur opposition à injonction'}, {ar: '15 يوما', fr: '15 jours'}, {ar: 'التبليغ', fr: 'la notification'}]
          - [{ar: 'استئناف مقرر في الحالة المدنية', fr: 'Appel d’une décision d’état civil'}, {ar: '15 يوما', fr: '15 jours'}, {ar: 'التبليغ', fr: 'la notification'}]
          - [{ar: 'طلب إلغاء حكم انتهائي (القرب، أو حتى 10.000 درهم)', fr: 'Annulation d’un jugement en dernier ressort (proximité, ou jusqu’à 10 000 DH)'}, {ar: '15 يوما', fr: '15 jours'}, {ar: 'التبليغ', fr: 'la notification'}]
          - [{ar: 'الطعن بالنقض', fr: 'Pourvoi en cassation'}, {ar: '30 يوما', fr: '30 jours'}, {ar: 'التبليغ', fr: 'la notification'}]
          - [{ar: 'الاعتراض على الحجز التحفظي', fr: 'Contester une saisie conservatoire'}, {ar: '8 أيام', fr: '8 jours'}, {ar: 'تبليغ الأمر', fr: 'la notification de l’ordonnance'}]
      cites: [/ma/loi/58-25/art_204, /ma/loi/58-25/art_200, /ma/loi/58-25/art_230, /ma/loi/58-25/art_239, /ma/loi/58-25/art_242, /ma/loi/58-25/art_279, /ma/loi/58-25/art_32, /ma/loi/58-25/art_380, /ma/loi/58-25/art_496]
      tool: tools/deadline
    - title: {ar: 'في الزجري', fr: 'Au pénal'}
      table:
        head: [{ar: 'ماذا', fr: 'Quoi'}, {ar: 'الأجل', fr: 'Délai'}, {ar: 'من', fr: 'À compter de'}]
        rows:
          - [{ar: 'استئناف حكم جنحي حضوري', fr: 'Appel d’un jugement correctionnel contradictoire'}, {ar: '10 أيام', fr: '10 jours'}, {ar: 'النطق بالحكم', fr: 'le prononcé'}]
          - [{ar: 'استئناف من لم يحضر ولم يشعر', fr: 'Appel de qui n’était ni présent ni avisé'}, {ar: '10 أيام', fr: '10 jours'}, {ar: 'التبليغ', fr: 'la notification'}]
          - [{ar: 'التعرض على حكم غيابي', fr: 'Opposition à un jugement par défaut'}, {ar: '10 أيام', fr: '10 jours'}, {ar: 'التبليغ', fr: 'la notification'}]
          - [{ar: 'طلب النقض', fr: 'Pourvoi en cassation'}, {ar: '10 أيام', fr: '10 jours'}, {ar: 'صدور القرار', fr: 'la décision'}]
          - [{ar: 'الطعن في أمر الإيداع في السجن', fr: 'Contester un placement en détention'}, {ar: 'إلى اليوم الموالي', fr: 'jusqu’au lendemain'}, {ar: 'صدور الأمر', fr: 'l’ordonnance'}]
