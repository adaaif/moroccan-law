# The one question: where the reader stands in the case. Each answer names the law that governs it, three figures with
# their articles, and leads with its own door; it is kept on the phone.
profile:
  question: {ar: فين واقف فالقضية؟, fr: 'Où en êtes-vous dans l’affaire ?'}
  options:
    - key: family
      first: custody
      main: true
      label: {ar: شي حد ديالي تشد ولا فالحبس, fr: 'Un proche est arrêté ou détenu'}
      law: {ar: 'قانون المسطرة الجنائية: الحراسة النظرية تدبير استثنائي، بمدة محسوبة بالساعة، وبحقوق كيتعلم بيها الموقوف من الأول.', fr: 'Le code de procédure pénale : la garde à vue est une mesure exceptionnelle, comptée en heures, avec des droits notifiés dès le début.'}
      facts:
        - {value: {ar: '48 ساعة', fr: '48 heures'}, label: {ar: 'أقصى مدة للحراسة النظرية، وتزاد 24 مرة وحدة بإذن كتابي', fr: 'au plus de garde à vue, prolongeable une fois de 24 heures sur autorisation écrite'}, cites: [/ma/loi/22-01/art_66, /ma/loi/22-01/art_66-2]}
        - {value: {ar: 'الساعة 1', fr: '1re heure'}, label: {ar: 'من الحراسة النظرية كيبدا الاتصال بالمحامي، 30 دقيقة', fr: 'de garde à vue : le contact avec l’avocat, 30 minutes'}, cites: [/ma/loi/22-01/art_66-2]}
        - {value: {ar: 'العائلة', fr: 'La famille'}, label: {ar: 'كيعلمها الضابط فور الوضع تحت الحراسة، إلا رفض الموقوف', fr: 'est prévenue par l’officier dès la garde à vue, sauf refus de la personne'}, cites: [/ma/loi/22-01/art_67]}
    - key: victim
      first: complaint
      main: true
      label: {ar: تعدّاو عليّا وبغيت نشكي, fr: 'Je suis victime et veux porter plainte'}
      law: {ar: 'قانون المسطرة الجنائية: الشكاية كتوصل لوكيل الملك، وهو اللي كيقرر واش يتابع ولا يحفظ، وكيعلمك بالمآل.', fr: 'Le code de procédure pénale : la plainte va au procureur du Roi, qui décide de poursuivre ou de classer, et vous informe de la suite.'}
      facts:
        - {value: {ar: '15 يوم', fr: '15 jours'}, label: {ar: 'باش يعلمك وكيل الملك بمآل الشكاية من نهار القرار', fr: 'pour que le procureur vous informe de la suite, après sa décision'}, cites: [/ma/loi/22-01/art_40]}
        - {value: {ar: '4 سنين', fr: '4 ans'}, label: {ar: 'تقادم الدعوى العمومية فالجنحة؛ 15 فالجناية وعام فالمخالفة', fr: 'de prescription de l’action publique pour un délit ; 15 pour un crime, 1 pour une contravention'}, cites: [/ma/loi/22-01/art_5]}
        - {value: {ar: 'الصلح', fr: 'La conciliation'}, label: {ar: 'ممكن أمام وكيل الملك قبل المتابعة، ولا بالوساطة', fr: 'possible devant le procureur avant les poursuites, ou par médiation'}, cites: [/ma/loi/22-01/art_41]}
    - key: accused
      first: lawyer-hour
      main: true
      label: {ar: تشكاو بيا ولا متابع, fr: 'Je suis mis en cause ou poursuivi'}
      law: {ar: 'قانون المسطرة الجنائية: البراءة هي الأصل، والصمت ماشي اعتراف، والمحامي ضروري فالجنايات وفبعض الجنح.', fr: 'Le code de procédure pénale : la présomption d’innocence, le silence n’est pas un aveu, l’avocat est obligatoire pour les crimes et certains délits.'}
      facts:
        - {value: {ar: 'الصمت', fr: 'Le silence'}, label: {ar: 'من حقك، وما كيتحسبش اعتراف', fr: 'est votre droit, et ne vaut pas aveu'}, cites: [/ma/loi/22-01/art_66-2]}
        - {value: {ar: '10 أيام', fr: '10 jours'}, label: {ar: 'باش تستأنف حكم جنحي من نهار النطق بيه', fr: 'pour faire appel d’un jugement correctionnel, dès son prononcé'}, cites: [/ma/loi/22-01/art_400]}
        - {value: {ar: 'إلزامي', fr: 'Obligatoire'}, label: {ar: 'المحامي فالجنايات، وفالجنح للقاصر وذوي العاهات', fr: 'l’avocat pour les crimes, et pour les délits d’un mineur ou d’une personne handicapée'}, cites: [/ma/loi/22-01/art_316]}
    - key: claimant
      first: which-court
      main: true
      label: {ar: عندي حق بغيت نطالب بيه, fr: 'Je veux réclamer un droit'}
      law: {ar: 'قانون المسطرة المدنية 58.25 (نافذ منذ 23 غشت 2026): الدعوى بمقال مكتوب فيه بيانات محددة، والمحكمة حسب الموضوع والمبلغ.', fr: 'Le code de procédure civile 58.25 (en vigueur depuis le 23 août 2026) : la demande par requête écrite avec des mentions fixées, le tribunal selon l’objet et le montant.'}
      facts:
        - {value: {ar: '5.000 درهم', fr: '5 000 DH'}, label: {ar: 'أقل منها: قاضي القرب، شفوي ومجاني', fr: 'en dessous : le juge de proximité, oral et gratuit'}, cites: [/ma/loi/58-25/art_331, /ma/loi/58-25/art_329]}
        - {value: {ar: '10.000 درهم', fr: '10 000 DH'}, label: {ar: 'حتى ليها: المحكمة الابتدائية كتحكم ابتدائيا وانتهائيا', fr: 'jusqu’à ce montant : le tribunal de première instance juge en premier et dernier ressort'}, cites: [/ma/loi/58-25/art_30]}
        - {value: {ar: 'المقال', fr: 'La requête'}, label: {ar: 'مكتوب ومؤرخ وموقع، والوثائق مقابل وصل', fr: 'écrite, datée, signée, les pièces contre récépissé'}, cites: [/ma/loi/58-25/art_76, /ma/loi/58-25/art_77]}
    - key: defendant
      first: summons
      label: {ar: جاني استدعاء للمحكمة, fr: 'J’ai reçu une convocation'}
      law: {ar: 'قانون المسطرة المدنية 58.25: الاستدعاء كيوصل مع نسخة من المقال، والآجال كتبدا من التبليغ.', fr: 'Le code de procédure civile 58.25 : la convocation arrive avec la copie de la requête, et les délais courent de la notification.'}
      facts:
        - {value: {ar: 'نسخة المقال', fr: 'La requête'}, label: {ar: 'كتوصلك مع الاستدعاء، باش تعرف شنو كيطلبو منك', fr: 'vous est remise avec la convocation, pour savoir ce qu’on vous demande'}, cites: [/ma/loi/58-25/art_84]}
        - {value: {ar: '15 يوم', fr: '15 jours'}, label: {ar: 'باش تتعرض على حكم غيابي ما كيتستأنفش', fr: 'pour faire opposition à un jugement par défaut non susceptible d’appel'}, cites: [/ma/loi/58-25/art_200]}
        - {value: {ar: '30 يوم', fr: '30 jours'}, label: {ar: 'باش تستأنف حكم ابتدائي من التبليغ', fr: 'pour faire appel d’un jugement dès la notification'}, cites: [/ma/loi/58-25/art_204]}
    - key: judgment
      first: appeal-civil
      label: {ar: عندي حكم, fr: 'J’ai un jugement'}
      law: {ar: 'الطعن داخل أجله ولا الحكم كيولي نهائي؛ والتنفيذ بطلب لقاضي التنفيذ.', fr: 'Le recours dans son délai, sinon le jugement devient définitif ; l’exécution sur demande au juge de l’exécution.'}
      facts:
        - {value: {ar: '30 يوم', fr: '30 jours'}, label: {ar: 'الاستئناف والنقض فالمدني من التبليغ', fr: 'pour l’appel et la cassation en matière civile, dès la notification'}, cites: [/ma/loi/58-25/art_204, /ma/loi/58-25/art_380]}
        - {value: {ar: 'كامل', fr: 'Franc'}, label: {ar: 'الأجل: ما كيتحسبش نهار التبليغ ولا النهار الأخير', fr: 'le délai : ni le jour de la notification ni le dernier ne comptent'}, cites: [/ma/loi/58-25/art_602, /ma/loi/22-01/art_750]}
        - {value: {ar: '10 أيام', fr: '10 jours'}, label: {ar: 'باش يبلغ المكلف بالتنفيذ المنفذ عليه من نهار الطلب', fr: 'pour que l’agent d’exécution notifie le débiteur après la demande'}, cites: [/ma/loi/58-25/art_486]}

