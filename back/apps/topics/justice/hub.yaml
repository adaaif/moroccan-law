tools:
  # «شحال باقي ليا؟»: what was decided (a civil, urgent or payment order, a correctional judgment, a cassation, a judgment
  # by default, or the facts for a complaint) and the day it started → the last day, as both codes count a full delay
  # (58.25 art. 602, 22.01 art. 750), a holiday or weekend end moved to the next working day. It waits for a person's check.
  - key: deadline
    icon: clock
    words: [حساب أجل الاستئناف, حساب الآجال القضائية, calcul délai d'appel, آخر أجل للطعن, شحال باقي ليا نستأنف, délai franc, آجال كاملة, احتساب الآجال, آخر نهار عطلة]
    means: تكون جميع الآجال المنصوص عليها في هذا القانون كاملة
    tool: true
    title: {ar: 'شحال باقي ليا؟', fr: 'Combien de temps me reste-t-il ?'}
    lead: {ar: 'من نهار التبليغ ولا الحكم ولا الأفعال: آخر نهار، بمادتو', fr: 'De la notification, du jugement ou des faits : le dernier jour, avec son article'}
    cites: [/ma/loi/58-25/art_602, /ma/loi/22-01/art_750, /ma/loi/58-25/art_200, /ma/loi/58-25/art_204, /ma/loi/58-25/art_230, /ma/loi/58-25/art_239, /ma/loi/58-25/art_242, /ma/loi/58-25/art_279, /ma/loi/58-25/art_32, /ma/loi/58-25/art_380, /ma/loi/22-01/art_393, /ma/loi/22-01/art_400, /ma/loi/22-01/art_527, /ma/loi/22-01/art_5]
  # The custody clock: the hour of arrest and the kind of case → the 48 hours' end, the end with the one extension, the
  # lawyer's contact from the first hour; state security 96 + 96, terrorism 96 + 96 + 96 (22.01 arts 66, 66-2, 80).
  - key: custody
    icon: clock
    words: [حساب مدة الحراسة النظرية, فوقاش غادي يخرج من الكوميسارية, calcul garde à vue]
    means: لمدة لا تتجاوز ثمان وأربعين ساعة تحتسب ابتداء من ساعة إيقافهم
    tool: true
    title: {ar: 'فوقاش خاصو يتقدم؟', fr: 'Quand doit-il être présenté ?'}
    lead: {ar: 'من ساعة الإيقاف: نهاية 48 ساعة، والتمديد، وساعة المحامي', fr: 'De l’heure de l’arrestation : la fin des 48 heures, la prolongation, l’avocat'}
    cites: [/ma/loi/22-01/art_66, /ma/loi/22-01/art_66-2, /ma/loi/22-01/art_67, /ma/loi/22-01/art_80]
  # «فين نمشي؟»: what the dispute is about and how much → the court and section that decides it (58.25 arts 29–33, 38,
  # 331), whether its judgment can be appealed (art. 30) or taken to cassation (art. 375), whether a lawyer is needed
  # (art. 376; 22.01 art. 316) and what it costs (art. 329). It never says who is right.
  - key: court
    icon: scales
    words: [شنو المحكمة المختصة, اشمن محكمة نمشي ليها, quel tribunal saisir]
    means: تختص المحاكم الابتدائية بالنظر في
    tool: true
    title: {ar: 'فين نمشي؟', fr: 'Où aller ?'}
    lead: {ar: 'الموضوع والمبلغ: المحكمة، الاستئناف والنقض، والمحامي', fr: 'L’objet et le montant : le tribunal, l’appel et la cassation, l’avocat'}
    cites: [/ma/loi/58-25/art_29, /ma/loi/58-25/art_30, /ma/loi/58-25/art_31, /ma/loi/58-25/art_33, /ma/loi/58-25/art_38, /ma/loi/58-25/art_329, /ma/loi/58-25/art_331, /ma/loi/58-25/art_375, /ma/loi/58-25/art_376, /ma/loi/22-01/art_316]
  # The alternative sentence: the prison term a court would set, the offence, a first offence or not → whether the
  # penal code opens an alternative (35-1, 35-3), the hours of community work (three a day, 40 to 3,600: 35-6), the
  # day-fine's range (100 to 2,000 DH a day: 35-15) and its condition (35-14), the six months to carry it out.
  - key: alternative
    icon: scales
    words: [حساب ساعات العمل لأجل المنفعة العامة, حساب الغرامة اليومية, calcul peine alternative, شحال غادي نخلص على الحبس]
    means: موازاة كل يوم من مدة العقوبة الحبسية المحكوم بها لثلاث ساعات من العمل
    tool: true
    title: {ar: 'واش كاينة عقوبة بديلة؟', fr: 'Une peine alternative est-elle possible ?'}
    lead: {ar: 'من مدة الحبس: الساعات ديال الخدمة، والغرامة اليومية، والشروط', fr: 'De la durée de prison : les heures de travail, les jours-amende, les conditions'}
    cites: [/ma/dahir/1-59-413/art_35-1, /ma/dahir/1-59-413/art_35-2, /ma/dahir/1-59-413/art_35-3, /ma/dahir/1-59-413/art_35-5, /ma/dahir/1-59-413/art_35-6, /ma/dahir/1-59-413/art_35-7, /ma/dahir/1-59-413/art_35-14, /ma/dahir/1-59-413/art_35-15]
