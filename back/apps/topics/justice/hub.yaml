# The justice topic's page (the justice review, 27 Oct 2026, $5 of Haiku at most: what Moroccans need to understand
# going to court, a complaint, a lawyer, legal aid, deadlines and judgments). One question first, since the law a reader
# meets depends on where they stand in a case: someone of theirs arrested, a victim, the one prosecuted, the one who
# claims, the one summoned, or the one holding a judgment. Then the doors in a case's road, each led by the court file
# every Moroccan who went to court carries home a number of (`marks: file`), the one figure the law sets for the door on
# its cover, or its pictogram. Written from the texts as the site holds them on 27 Oct 2026: the criminal procedure 22.01
# (Adala's consolidation with law 03.23, in force since 8 Dec 2025), the civil procedure 58.25 (BO 7485, 23 Feb 2026, in
# force six months after), the penal code (Adala, 22 Aug 2024, with law 43.22's alternative sentences, arts 35-1 to
# 35-15), decree 2.25.386 on them, the lawyers' law 66.23 (BO of 20 Aug 2026), royal decree 514.65 on legal aid (Adala,
# 26 Oct 2011) and order 2787.19, the judicial organisation 38.15 and the prisons law 10.23. Nothing here reaches a
# reader before a person checks it.
doors_title: {ar: شنو كتحتاج فالقضية ديالك؟, fr: 'De quoi avez-vous besoin dans votre affaire ?'}
marks: file
stages:
  - {key: police, title: {ar: عند البوليس, fr: Chez la police}, doors: [custody, silence, lawyer-hour, detention]}
  - {key: complaint, title: {ar: الشكاية, fr: La plainte}, doors: [complaint, prescription, settlement, direct]}
  - {key: lawyer, title: {ar: المحامي والمساعدة القضائية, fr: 'L’avocat et l’assistance judiciaire'}, doors: [need-lawyer, aid, fees, lawyer-complaint]}
  - {key: case, title: {ar: القضية المدنية, fr: 'Une affaire civile'}, doors: [which-court, small, lawsuit, debt-paper, summons]}
  - {key: judgment, title: {ar: الحكم والطعن, fr: 'Le jugement et les recours'}, doors: [appeal-civil, appeal-criminal, opposition, cassation, final]}
  - {key: after, title: {ar: من بعد الحكم, fr: 'Après le jugement'}, doors: [enforce, coercion, alternative, release, visit]}
  - {key: elsewhere, title: {ar: فمواضيع أخرى, fr: 'Dans d’autres thèmes'}, doors: [rehab, record, protection, accident, cheque, dismissed], links: true}

# The band: the moment someone of yours is taken to the station, the justice emergency every family knows. Its acts are
# the custody journey's first answers; its tool is the custody clock. No number is shown: no official page gives one.
urgent:
  title: {ar: شي حد ديالك تشد؟, fr: 'Un proche arrêté ?'}
  lead: {ar: 'شنو كيقول القانون من الساعة الأولى ديال الحراسة النظرية', fr: 'Ce que dit la loi dès la première heure de la garde à vue'}
  to: journeys/custody
  tone: indigo
  acts: {journey: custody, steps: [0, 1, 2]}
  tool: tools/custody
  tool_label: {ar: 'فوقاش خاصو يتقدم؟', fr: 'Quand doit-il être présenté ?'}

learn: [pages/courts, journeys/complaint, journeys/lawsuit, pages/deadlines, pages/beliefs]

# What people believe, and what the law says, each card leading to the page that answers it.
beliefs:
  - claim: {ar: 'البوليس يقدر يخليك حتى يكمل البحث', fr: 'La police peut vous garder jusqu’à la fin de l’enquête'}
    truth: {ar: 'الحراسة النظرية 48 ساعة، وتزاد 24 ساعة مرة وحدة بإذن كتابي معلل من النيابة العامة، إلا فأمن الدولة والإرهاب.', fr: 'La garde à vue dure 48 heures, prolongeable une fois de 24 heures sur autorisation écrite motivée du parquet, sauf sûreté de l’État et terrorisme.'}
    to: pages/beliefs
  - claim: {ar: 'إلا سكتي، كيحسبوها عليك', fr: 'Se taire, c’est avouer'}
    truth: {ar: 'من حقك تسكت على الأفعال اللي تشديتي عليها، والصمت ماشي اعتراف.', fr: 'Vous avez le droit de garder le silence sur les faits, et le silence n’est pas un aveu.'}
    to: pages/beliefs
  - claim: {ar: 'المحامي ما كيدخلش حتى تمشي للمحكمة', fr: 'L’avocat n’intervient qu’au tribunal'}
    truth: {ar: 'الاتصال بالمحامي من الساعة الأولى ديال الحراسة النظرية، 30 دقيقة فسرية.', fr: 'Le contact avec l’avocat se fait dès la première heure de garde à vue, 30 minutes en toute confidentialité.'}
    to: pages/beliefs
  - claim: {ar: 'إلا تنازل المشتكي، القضية كتسالي', fr: 'Si la victime retire sa plainte, l’affaire s’arrête'}
    truth: {ar: 'التنازل كيوقف الدعوى العمومية غير إلا كانت الشكاية شرط للمتابعة؛ وإلا النيابة العامة كتكمل.', fr: 'Le désistement n’éteint l’action publique que si la plainte conditionne les poursuites ; sinon le parquet poursuit.'}
    to: pages/beliefs
  - claim: {ar: 'القفة مسموحة فالحبس', fr: 'On peut apporter le panier à la prison'}
    truth: {ar: 'القانون كيمنع على المعتقل يتوصل بالمؤونة، إلا فأحوال ومناسبات خاصة كتسمح بيها الإدارة.', fr: 'La loi interdit au détenu de recevoir des provisions, sauf cas et occasions particuliers autorisés par l’administration.'}
    to: pages/beliefs
  - claim: {ar: 'المحامي ياخد نسبة من الحكم', fr: 'L’avocat prend un pourcentage du jugement'}
    truth: {ar: 'الاتفاق المسبق على أتعاب مرتبطة بنتيجة الدعوى باطل بقوة القانون.', fr: 'Convenir d’avance d’honoraires liés au résultat du procès est nul de plein droit.'}
    to: pages/beliefs

# The order a reviewer opens the topic in: the arrest and the complaint first, then the civil case and the deadlines,
