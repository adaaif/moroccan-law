      url: https://tl.tax.gov.ma/tl/public/login.do?method=connectAnonymous&forward=paiementTHTSC

- key: numbers
  title: {ar: 'السكن بالأرقام', fr: 'Le logement en chiffres'}
  lead:
    ar: 'من يملك ومن يكتري، من الإحصاء العام. ولكل رقم ملفه وصفحته.'
    fr: 'Qui possède et qui loue, d’après le recensement. Chaque chiffre avec son fichier et sa page.'
  series: [tenure]
  sections:
    - title: {ar: أسعار العقار السكني, fr: Les prix de l’immobilier résidentiel}
      facts:
        - text: {ar: 'حسب مؤشر أسعار الأصول العقارية لبنك المغرب: تراجعت أسعار العقار السكني 1.2% سنة 2020 و4% سنة 2021 و1.3% سنة 2022، وشبه استقرت سنتي 2023 و2024، وارتفعت 0.8% سنة 2025.', fr: 'Selon l’indice des prix des actifs immobiliers de Bank Al-Maghrib : les prix du résidentiel ont baissé de 1,2 % en 2020, 4 % en 2021 et 1,3 % en 2022, ont quasiment stagné en 2023 et 2024, et ont augmenté de 0,8 % en 2025.'}
        - text: {ar: 'ولا ينشر عدد البيوع، بل تطوره فقط: البيوع السكنية زادت 1.3% سنة 2025.', fr: 'Le nombre de ventes n’est pas publié, seulement son évolution : les ventes résidentielles ont augmenté de 1,3 % en 2025.'}
  links:
    - name: {ar: 'مؤشر أسعار الأصول العقارية، الفصل الرابع 2025', fr: 'Indice des prix des actifs immobiliers, T4 2025'}
      url: https://www.bkam.ma/content/download/840349/9114486/Publication-IPAI%20T4%202025.pdf
      note: {ar: بنك المغرب, fr: Bank Al-Maghrib}
    - name: {ar: 'نشرات المؤشر حسب السنة', fr: 'Les notes de l’indice par année'}
      url: https://www.bkam.ma/Statistiques/Prix/Publications-ipai/Indice-des-prix-des-actifs-immobiliers
      note: {ar: بنك المغرب, fr: Bank Al-Maghrib}
