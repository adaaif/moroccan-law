      - {year: 2024, owners: 61.5, renters: 28.0, from: hcp2024, page: 31}
    notes:
      - {ar: 'في المغرب كله سنة 2024: 69.4% ملاك و19.7% مكترون؛ وفي البادية 3.2% فقط يكترون.', fr: 'Pour tout le Maroc en 2024 : 69,4 % de propriétaires et 19,7 % de locataires ; à la campagne, 3,2 % seulement louent.'}
