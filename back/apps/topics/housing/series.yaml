# Housing in numbers (H15 of the housing plan). Who owns and who rents in the towns, from the census: 2004 and 2014 as
# the housing ministry's «RGPH 2014 – volet habitat» prints them (p. 12; owners are owners and co-owners plus those
# buying), 2024 from the HCP's census results (slide 31). Each file was fetched and checked against its text on 20 Oct
# 2026. The census counts households, so a year is the census's, never a year in between.

