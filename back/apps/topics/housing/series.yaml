  hcp2024: {title: 'RGPH 2024 – Principaux résultats (HCP, 17 décembre 2024)', url: 'https://hcp.ma/file/242665', path: sources/hcp/hcp_rgph2024_principaux_resultats.pdf, sha256: 368fe28f02e73a50441229d7ccb6c1df0175ea6b5fb56a91c1f4194b10615758}

series:
  - key: tenure
    title: {ar: 'الأسر الحضرية: ملاك ومكترون', fr: 'Ménages urbains : propriétaires et locataires'}
    lead:
