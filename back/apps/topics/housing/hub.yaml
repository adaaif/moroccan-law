# The tools run on the reader's phone; `tool: true` ones wait for a person's check (checked.yaml: tools/<key>), unless
# `open: true` shows one before, with a note that no professional has reviewed it yet.
tools:
  - key: rent
    words: [واش الزيادة قانونية, الزيادة في الكراء, شحال الزيادة, الضمانة, augmentation du loyer, caution]
    means: الزيادة في الوجيبة الكرائية
    tool: true
    open: true            # call H10 of the housing plan (20 Oct 2026): shown before a professional's review
    title: {ar: واش الزيادة قانونية؟, fr: 'L’augmentation est-elle légale ?'}
    lead: {ar: 'أقرب تاريخ وأقصى زيادة، والضمانة، والآجال', fr: 'La date la plus proche, l’augmentation maximale, la garantie, les délais'}
    for: [tenant, landlord, shop]
  - key: eviction
    words: [بغا يخرجني, التعويض عن الإفراغ, الإشعار بالإفراغ]
    means: الإشعار بالإفراغ
    tool: true
    title: {ar: بغا يخرجني, fr: 'Mon bailleur veut me faire partir'}
    lead: {ar: 'واش الإشعار صحيح، وشنو كيتسال', fr: 'Le congé est-il valable, et que me doit-on ?'}
    for: [tenant, landlord, shop]
  - key: offplan
    words: [على التصميم, البروموتور تعطل, VEFA]
    means: العقار في طور الإنجاز
    tool: true
    title: {ar: شريت على التصميم, fr: J’achète sur plan}
    lead: {ar: 'المراحل والأقساط، والتعويض على التأخير', fr: 'Les étapes et les versements, l’indemnité de retard'}
    for: [buyer]
  - key: aid
    words: [دعم السكن, واش عندي الحق فالدعم, aide au logement]
    means: إعانة الدولة لدعم السكن
    tool: true
    title: {ar: دعم السكن, fr: L’aide au logement}
    lead: {ar: 'واش عندك الحق، شحال، والخمس سنوات من بعد', fr: 'Y avez-vous droit, combien, et les cinq ans qui suivent'}
    for: [buyer]
  - key: where
    words: [فين نمشي, المحكمة, الجماعة, الموثق, où aller]
    to: pages/where
    title: {ar: فين نمشي؟, fr: 'Où aller ?'}
    lead: {ar: 'المحكمة، الجماعة، الموثق، والمنصات الرسمية', fr: 'Le tribunal, la commune, le notaire, les plateformes officielles'}
