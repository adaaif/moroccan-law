    title_by: {landlord: {ar: 'بغيت نخرج المكتري', fr: 'Je veux reprendre mon logement'}}
    lead: {ar: 'إشعار بشهرين على الأقل، وكراء سنة إذا صححته المحكمة', fr: 'Un préavis d’au moins deux mois, un an de loyer si le tribunal le valide'}
