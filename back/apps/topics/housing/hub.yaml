# The housing topic's page (H6–H7 of the housing plan): where the reader stands, then doors by what is happening, in the
# words people use, each leading to a journey or a page; then the tools. A door, a tool or a page says whom it is for
# (`for`, the keys of the profile's answers); the reader's answer, kept on the phone, fades the others with the reason.
# Buying a home and the shop's lease live here (a call of 20 Oct 2026); permits stay in the land topic. A door's `means`
# is the law's own phrase for its words: a question that is one of them is searched as that phrase first (H7 of the
# housing plan: search learns the doors' words), as an everyday word is.
# Housing, by its receipt (HM19 of the hard-moment review, 7 Nov 2026): each door led by the rent receipt's
# counterfoil with the law's figure (kit/Sign.tsx RentReceipt), and the band of the papers that start a clock.
doors_title: {ar: شنو وقع ليك؟, fr: 'Que vous arrive-t-il ?'}
marks: receipt
urgent:
  title: {ar: توصلت بإنذار؟, fr: 'Vous avez reçu un congé ou une mise en demeure ?'}
  lead: {ar: 'ورقتان كيبدا معاهم أجل، وما كيخرجك من الدار حتى حكم', fr: 'Deux papiers qui ouvrent un délai ; seul un jugement fait partir de chez soi'}
  to: journeys/eviction
  tone: pine
  day: {ar: نهار توصلت بالإشعار؟, fr: 'Congé reçu quand ?'}
  for: [tenant, landlord]
  papers:
    - paper: {ar: الإشعار بالإفراغ, fr: Le congé}
      limit: {ar: شهران على الأقل, fr: deux mois au moins}
      for: {ar: من يوم توصلت به، والمحكمة هي اللي كتصححو, fr: 'à compter de sa réception ; seul le tribunal le valide'}
      article: {ar: المادة 46, fr: art. 46}
      cites: [/ma/loi/67-12/art_46]
      to: journeys/eviction
      key: eviction
    - paper: {ar: الإنذار بالأداء, fr: La mise en demeure de payer}
      limit: {ar: 15 يوما على الأقل, fr: 15 jours au moins}
      for: {ar: من يوم تبليغه، باش تخلص بوصل ولا تحويل ولا فصندوق المحكمة, fr: 'à compter de sa notification, pour payer contre quittance, par virement ou à la caisse du tribunal'}
      article: {ar: المادة 25, fr: art. 25}
      cites: [/ma/loi/67-12/art_25]
      to: journeys/arrears
      key: arrears

profile:
  question: {ar: شنو وضعك؟, fr: 'Quelle est votre situation ?'}
  options:
    - key: tenant
      label: {ar: مكتري دار, fr: Je loue un logement}
      law: {ar: 'قانونك هو القانون 67.12 المتعلق بكراء المحلات المعدة للسكنى أو للاستعمال المهني، وقانون الالتزامات والعقود فيما سكت عنه.', fr: 'Votre loi est la loi 67.12 sur les baux d’habitation et à usage professionnel, et le DOC pour ce qu’elle ne dit pas.'}
    - key: landlord
      label: {ar: مكري, fr: Je loue à quelqu’un}
      law: {ar: 'نفس القانون 67.12، من الجهة الأخرى: الإنذار بالأداء، والإفراغ، والضمانة.', fr: 'La même loi 67.12, de l’autre côté : la mise en demeure, l’éviction, la garantie.'}
    - key: shop
      label: {ar: حانوت أو محل تجاري, fr: Un local commercial}
      law: {ar: 'قانونك هو القانون 49.16 المتعلق بكراء المحلات التجارية والصناعية والحرفية، وليس 67.12.', fr: 'Votre loi est la loi 49.16 sur les baux commerciaux, industriels et artisanaux, pas la loi 67.12.'}
      to: journeys/shop
    - key: building
      label: {ar: ساكن فعمارة, fr: J’habite un immeuble en copropriété}
      law: {ar: 'قانونك هو القانون 18.00 المتعلق بنظام الملكية المشتركة: الجمع العام، ووكيل الاتحاد، والتكاليف المشتركة.', fr: 'Votre loi est la loi 18.00 sur la copropriété : l’assemblée, le syndic, les charges.'}
      to: journeys/syndic
    - key: buyer
      label: {ar: غادي نشري, fr: J’achète un logement}
      law: {ar: 'البيع في طور الإنجاز في قانون الالتزامات والعقود (الفصول 618-1 إلى 618-20)، والدعم المباشر في قانون المالية لسنة 2023 ومرسوم 2.23.350، وكل بيع بمحرر رسمي منذ 16 يوليوز 2026.', fr: 'La vente en l’état futur d’achèvement dans le DOC (art. 618-1 à 618-20), l’aide directe dans la loi de finances 2023 et le décret 2.23.350, et tout achat par acte authentique depuis le 16 juillet 2026.'}
    - key: owner
      label: {ar: ساكن فدار ديالي, fr: J’habite chez moi}
      law: {ar: 'رسم السكن ورسم الخدمات الجماعية في القانون 47.06، وصيانة المبنى في القانون 94.12.', fr: 'La taxe d’habitation et la taxe de services communaux (loi 47.06), l’entretien du bâtiment (loi 94.12).'}

events:
