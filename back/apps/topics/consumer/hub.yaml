# The consumer topic's page (D1–D5 of the consumer plan, 24 Oct 2026): how the reader bought first, since a right
# depends on the channel (withdrawing exists at a distance and at the door, never in a shop); then the doors by what
# happened, in the words people use, each leading to a journey or a page; the beliefs the law contradicts; the tools.
# A door's `means` is the law's own phrase for its words: a question that is one of them is searched as that phrase
# first (S2). Written from law 31.08 as the SGG consolidated it (to law 78.20), decree 2.12.503 and the 2014 orders from
# Adala, and the DOC's articles on hidden defects, as the site holds them on 24 Oct 2026.
doors_title: {ar: شنو وقع ليك؟, fr: 'Que vous arrive-t-il ?'}
# The consumer-receipt review (26 Oct 2026): a door's `mark` is the number the law sets for it, drawn on a price
# tag (`marks: tag`): 7 days to withdraw, a year of guarantee, 3,000 dirhams for a written date, 4 % at most; a door no
# single number governs carries its pictogram on the same tag. The doors stand in the life of a purchase (`stages`):
# before buying, paying, after, when it goes wrong; another topic's doors as links at the end. All in view, no fold.
marks: tag
stages:
  - {key: before, title: {ar: قبل ما تشري, fr: 'Avant d’acheter'}, doors: [price, tied, clause]}
  - {key: paying, title: {ar: فاش كتخلص, fr: 'Au moment de payer'}, doors: [invoice, credit, default, home-loan]}
  - {key: after, title: {ar: من بعد ما شريتي, fr: 'Après l’achat'}, doors: [defect, online, no-return, late, door, subscription]}
  - {key: wrong, title: {ar: إلا ما تحلاتش, fr: 'Si ça ne s’arrange pas'}, doors: [complain, bank, bills, internet, unsafe]}
  - {key: elsewhere, title: {ar: فمواضيع أخرى, fr: 'Dans d’autres thèmes'}, doors: [used-car, insurance, offplan], links: true}
learn: [pages/beliefs, journeys/defect, journeys/online, journeys/credit, pages/where]
# What people believe, and what the law says (D3 of the plan): short cards under the doors, each leading to the page.
beliefs:
  - claim: {ar: لا ترد ولا تستبدل, fr: Ni reprise ni échange}
    truth: {ar: 'إلا كان فيها عيب، الضمان القانوني باقي، وهاد الورقة ما كتحيدوش.', fr: 'En cas de vice, la garantie légale demeure ; cette mention ne l’écarte pas.'}
    to: pages/beliefs
  - claim: {ar: الضمان عام من الفاتورة, fr: La garantie, un an après la facture}
    truth: {ar: 'من التسليم ماشي من الفاتورة، وما يقدر حتى شرط يقصرها.', fr: 'À partir de la livraison, pas de la facture, et aucune clause ne la raccourcit.'}
    to: pages/beliefs
  - claim: {ar: أونلاين ديما نقدر نرجعها, fr: En ligne, on peut toujours renvoyer}
    truth: {ar: 'سبعة أيام كاملة من التسلم، و30 بلا تأكيد مكتوب، ومن بعد غير الضمان.', fr: 'Sept jours francs dès la réception, trente sans confirmation, ensuite la garantie seulement.'}
    to: pages/beliefs
  - claim: {ar: البنك هو اللي كيقرر شحال كندين ليه, fr: La banque décide de ce que je dois}
    truth: {ar: 'إلا وقفتي، القانون كيحدد: 4 % على الأكثر، وبلا مصاريف جزافية.', fr: 'En cas d’impayé, la loi plafonne : 4 % au plus, aucun forfait.'}
    to: pages/beliefs
  - claim: {ar: سنيت، ما بقا ما يدار, fr: J’ai signé, c’est fini}
    truth: {ar: 'سبعة أيام بعد البيع فالدار ولا قبول الكريدي، والشرط التعسفي باطل.', fr: 'Sept jours après une vente à domicile ou un crédit, et la clause abusive est nulle.'}
    to: pages/beliefs

# The order a reviewer opens the topic in (R1 of the plan): what people meet most, then credit and contracts, then the
# sectors and the prices the state sets.
waves:
  1: [journeys/online, journeys/defect, journeys/late, pages/where, tools/receipt, tools/return, tools/guarantee, tools/late, tools/where]
  2: [journeys/credit, journeys/home-loan, journeys/door, journeys/clause, journeys/prices, journeys/subscription, pages/beliefs, checklists/invoice, checklists/offer, tools/credit, tools/clause]
  3: [pages/bank, pages/bills, pages/safety, pages/numbers, series/bank-complaints, series/mediation, rates/sugar, tools/prices, tools/letters, reform/prices-2022, reform/bags-2023, reform/medicines-2026, reform/federations-2024, reform/court-2020]

profile:
  question: {ar: كيفاش شريتي؟, fr: 'Comment avez-vous acheté ?'}
  options:
    - key: shop
      first: defect
      main: true
      label: {ar: فحانوت, fr: En magasin}
      law: {ar: 'فالحانوت ما كاينش حق التراجع (المادة 36 كتخص البيع عن بعد)، ولكن الضمان القانوني لعيوب الشيء المبيع سنة بعد التسليم للمنقولات (المادة 65)، والفاتورة حق (المادة 4)، والثمن المكتوب هو الثمن الإجمالي (المادة 5).', fr: 'En magasin, pas de droit de rétractation (l’article 36 vise la vente à distance), mais la garantie légale des vices dure un an après la livraison pour un meuble (art. 65), la facture est un droit (art. 4) et le prix affiché est le prix total (art. 5).'}
      facts:
        - {value: {ar: '1 عام', fr: '1 an'}, label: {ar: 'الضمان القانوني من يوم التسليم، وما كيتقصرش', fr: 'la garantie légale dès la livraison, jamais raccourcie'}, cites: [/ma/loi/31-08/art_65]}
        - {value: {ar: 'الفاتورة', fr: 'La facture'}, label: {ar: 'حقك: فيها التاريخ والثمن وكيفية الأداء', fr: 'un droit : date, prix et mode de paiement'}, cites: [/ma/loi/31-08/art_4, /ma/decret/2-12-503/art_25]}
        - {value: {ar: 'لا تراجع', fr: 'Pas de rétractation'}, label: {ar: 'فالحانوت؛ التراجع غير عن بعد وخارج المحلات', fr: 'en magasin ; elle n’existe qu’à distance et hors établissement'}, cites: [/ma/loi/31-08/art_36, /ma/loi/31-08/art_49]}
      to: journeys/defect
    - key: online
      first: online
      main: true
      label: {ar: أونلاين ولا فالأنستغرام, fr: En ligne ou sur les réseaux}
      law: {ar: 'البيع عن بعد: سبعة أيام كاملة للتراجع من تسلم السلعة، أو ثلاثون يوما إلا ما وصلكش تأكيد مكتوب (المادة 36)، والرد داخل 15 يوما (المادة 37)، والطلبية داخل 30 يوما (المادة 39).', fr: 'Vente à distance : sept jours francs pour vous rétracter dès la réception, trente sans confirmation écrite (art. 36) ; remboursement sous 15 jours (art. 37) ; commande exécutée sous 30 jours (art. 39).'}
      facts:
        - {value: {ar: '7 أيام', fr: '7 jours'}, label: {ar: 'للتراجع من تسلم السلعة، بلا تبرير', fr: 'pour se rétracter dès la réception, sans motif'}, cites: [/ma/loi/31-08/art_36, /ma/loi/31-08/art_203]}
        - {value: {ar: '30 يوما', fr: '30 jours'}, label: {ar: 'إلا ما وصلك تأكيد مكتوب', fr: 'sans confirmation écrite'}, cites: [/ma/loi/31-08/art_36]}
        - {value: {ar: '15 يوما', fr: '15 jours'}, label: {ar: 'باش يرجع ليك المبلغ كاملا', fr: 'pour être remboursé en entier'}, cites: [/ma/loi/31-08/art_37]}
      to: journeys/online
    - key: door
      first: door
      main: true
      label: {ar: بائع جا لعندي, fr: Un vendeur est venu chez moi}
      law: {ar: 'البيع خارج المحلات: عقد مكتوب باستمارة للتراجع (المادة 47)، سبعة أيام من الطلبية (المادة 49)، وما تخلص والو قبل ما يسالي الأجل (المادة 50).', fr: 'Vente hors établissement : contrat écrit avec un formulaire de rétractation (art. 47), sept jours dès la commande (art. 49), rien à payer avant la fin du délai (art. 50).'}
      facts:
        - {value: {ar: '7 أيام', fr: '7 jours'}, label: {ar: 'للتراجع من الطلبية، بالاستمارة', fr: 'pour se rétracter dès la commande, par le formulaire'}, cites: [/ma/loi/31-08/art_49, /ma/loi/31-08/art_203]}
        - {value: {ar: '0 درهم', fr: '0 DH'}, label: {ar: 'قبل ما يفوت أجل التراجع', fr: 'avant la fin du délai de rétractation'}, cites: [/ma/loi/31-08/art_50]}
        - {value: {ar: '15 يوما', fr: '15 jours'}, label: {ar: 'باش يرجع ليك ما خلصتي إلا تراجعتي', fr: 'pour rendre ce qui a été payé après la rétractation'}, cites: [/ma/loi/31-08/art_50]}
      to: journeys/door
    - key: credit
      first: credit
      main: true
      label: {ar: بالكريدي ولا بالتقسيط, fr: À crédit ou en plusieurs fois}
      law: {ar: 'القرض الاستهلاكي: عرض مسبق (المادة 77)، سبعة أيام للتراجع من قبول العرض (المادة 85)، والتسديد المبكر بلا تعويض (المادة 103)، وما كيطالبك المقرض بأكثر من 4 % إلا توقفتي (المادتان 104 و105).', fr: 'Crédit à la consommation : offre préalable (art. 77), sept jours pour vous rétracter après l’acceptation (art. 85), remboursement anticipé sans indemnité (art. 103), et pas plus de 4 % réclamés en cas de défaillance (art. 104 et 105).'}
      facts:
        - {value: {ar: '7 أيام', fr: '7 jours'}, label: {ar: 'للتراجع من قبول العرض', fr: 'pour se rétracter après l’acceptation'}, cites: [/ma/loi/31-08/art_85]}
        - {value: {ar: 'بلا تعويض', fr: 'Sans indemnité'}, label: {ar: 'التسديد المبكر فأي وقت', fr: 'le remboursement anticipé, à tout moment'}, cites: [/ma/loi/31-08/art_103]}
        - {value: '4%', label: {ar: 'أقصى ما يطالبك به المقرض إلا توقفتي', fr: 'le plus que réclame le prêteur en cas de défaillance'}, cites: [/ma/loi/31-08/art_104, /ma/loi/31-08/art_105]}
      to: journeys/credit
    - key: home-loan
      first: home-loan
      label: {ar: كريدي ديال الدار, fr: Un prêt immobilier}
      law: {ar: 'القرض العقاري: العرض كيبقى 15 يوما، وما تقبلوش حتى تفوت 10 أيام (المادة 120)، والبيع رهين بالحصول على القرض (المادة 127).', fr: 'Crédit immobilier : l’offre est maintenue 15 jours et ne s’accepte qu’après 10 jours (art. 120) ; la vente dépend de l’obtention du prêt (art. 127).'}
      facts:
        - {value: {ar: '10 أيام', fr: '10 jours'}, label: {ar: 'قبل ما تقبل العرض', fr: 'avant de pouvoir accepter l’offre'}, cites: [/ma/loi/31-08/art_120]}
        - {value: {ar: '15 يوما', fr: '15 jours'}, label: {ar: 'كيبقى العرض صالح', fr: 'de validité de l’offre'}, cites: [/ma/loi/31-08/art_120]}
        - {value: '2%', label: {ar: 'أقصى تعويض على التسديد المبكر', fr: 'l’indemnité maximale de remboursement anticipé'}, cites: [/ma/loi/31-08/art_132]}
      to: journeys/home-loan
    - key: subscription
      first: subscription
      label: {ar: اشتراك (أنترنيت، صالة، مدرسة), fr: 'Un abonnement (internet, salle, école)'}
      law: {ar: 'المورد خاصو يذكرك كتابة شهرا قبل نهاية العقد ولا تجديدو؛ وإلا ما ذكركش والعقد كيتجدد بوحدو، تقدر تنهيه فأي وقت بلا غرامة (المادة 7).', fr: 'Le fournisseur doit vous rappeler par écrit un mois avant la fin ou la reconduction ; s’il ne le fait pas et que le contrat se reconduit seul, vous pouvez y mettre fin à tout moment sans pénalité (art. 7).'}
      facts:
        - {value: {ar: '1 شهر', fr: '1 mois'}, label: {ar: 'قبل الأجل: التذكير المكتوب بالتجديد', fr: 'avant le terme : le rappel écrit de la reconduction'}, cites: [/ma/loi/31-08/art_7]}
        - {value: {ar: 'بلا غرامة', fr: 'Sans pénalité'}, label: {ar: 'تحبسو متى بغيتي إلا تجدد بلا تذكير', fr: 'l’arrêter à tout moment s’il se reconduit sans rappel'}, cites: [/ma/loi/31-08/art_7]}
        - {value: {ar: 'نسخة', fr: 'Une copie'}, label: {ar: 'من العقد لك، والشك كيتفسر لصالحك', fr: 'du contrat pour vous ; le doute s’interprète en votre faveur'}, cites: [/ma/loi/31-08/art_8, /ma/loi/31-08/art_9]}
      to: journeys/subscription
    - key: bill
      first: bills
      label: {ar: فاتورة (الما، الضو، التيليفون), fr: 'Une facture (eau, électricité, téléphone)'}
      law: {ar: 'المفوض ليهم تسيير مرفق عام ملزمين بالتزامات المورد (المادة 2)، والفاتورة خاصها تبين الثمن الإجمالي (المادتان 4 و5)، والشروط التعسفية باطلة (المادة 19).', fr: 'Les délégataires d’un service public sont tenus des obligations du fournisseur (art. 2) ; la facture doit montrer le prix total (art. 4 et 5) ; les clauses abusives sont nulles (art. 19).'}
      facts:
        - {value: {ar: 'المورد', fr: 'Le fournisseur'}, label: {ar: 'المفوض ليه فالما والضو ملزم بالتزامات المورد', fr: 'le délégataire de l’eau et de l’électricité en a les obligations'}, cites: [/ma/loi/31-08/art_2]}
        - {value: {ar: 'الفاتورة', fr: 'La facture'}, label: {ar: 'مفصلة: كل خدمة وثمنها والمبلغ الإجمالي', fr: 'détaillée : chaque service, son prix, le total'}, cites: [/ma/loi/31-08/art_4, /ma/loi/31-08/art_5]}
        - {value: {ar: '0 درهم', fr: '0 DH'}, label: {ar: 'رقم تتبع الشكايات بلا رسوم إضافية', fr: 'le numéro de suivi des réclamations, sans surcoût'}, cites: [/ma/loi/31-08/art_32]}
      to: pages/bills

