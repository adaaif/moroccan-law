# The consumer in numbers (N1 of the consumer plan, K7: only the bodies' own reports): the complaints Bank
# Al-Maghrib's banking supervision department received from the credit institutions' customers, and the files the
# Moroccan Centre for Banking Mediation received, each year from the annual banking supervision report that prints it,
# read on its page on 24 Oct 2026 (the PDF's page). A year's figure comes from the newest report that gives it; 2025's
# CMMB figure is «demandes de médiation», the earlier ones «dossiers complets». The ministry's portal and the ANRT
# publish no yearly count the site could find on an official page; nothing is drawn for them.

