  stages: *stages
  checked_on: '2026-10-24'
  line: {ar: 'إذنان لثلاث سنوات: للجامعة الوطنية لجمعيات المستهلك (قرار 11 نونبر 2022، لا يجد «قانون» تجديده)، وللجامعة المغربية لحقوق المستهلك (قرار 23 فبراير 2024).', fr: 'Deux autorisations de trois ans : la Fédération nationale des associations du consommateur (arrêté du 11 novembre 2022, 3adala n’en trouve pas le renouvellement) et la Fédération marocaine des droits du consommateur (arrêté du 23 février 2024).'}
  timeline:
