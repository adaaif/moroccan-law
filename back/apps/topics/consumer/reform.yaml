      cites: [/ma/arrete/3094-22/art_1]
    - date: '2024-04-08'
      text: {ar: 'نشر القرار 504.24 بمنح الإذن الخاص بالتقاضي للجامعة المغربية لحقوق المستهلك لمدة ثلاث سنوات.', fr: 'Publication de l’arrêté 504-24 accordant pour trois ans l’autorisation d’ester à la Fédération marocaine des droits du consommateur.'}
      source: {name: {ar: 'الجريدة الرسمية عدد 7289', fr: 'BO n° 7289'}, url: 'https://www.sgg.gov.ma/BO/AR/3111/2024/BO_7289_Ar.pdf'}
      cites: [/ma/arrete/504-24/art_1, /ma/loi/31-08/art_157]

# The 2027 finance bill's line for this topic (the finance-bill review, P11, P13): a bill, never law; its way
# through Parliament is the tax topic's (/topics/tax/reform/lf-2027).
- key: lf-2027
  title: {ar: 'مشروع قانون المالية 2027: اللحم والدخان', fr: 'Le projet de loi de finances 2027 : viande et tabac'}
  stage: bill
  stages: *stages
  checked_on: '2026-11-15'
  line: {ar: 'مشروع، ماشي قانون: استيراد المواشي الحية ولحومها معفي بصفة دائمة من رسم الاستيراد والقيمة المضافة (والإعفاء ماشي ثمن)؛ والضريبة على السجائر كتطلع كل عام حتى 2031، والسيجارة الإلكترونية 100 درهم للوحدة. مجلس النواب صادق عليه فالقراءة الأولى، وزاد: استيراد المواشي كيدوز بإجراءات كتحددها الإدارة، والضريبة على السيكار وعلى سائل السيجارة الإلكترونية كتطلع.', fr: 'Un projet, pas une loi : l’importation du bétail vivant et de ses viandes exonérée durablement du droit d’importation et de la TVA (une exonération n’est pas un prix) ; la taxe sur les cigarettes monte chaque année jusqu’en 2031, la cigarette électronique à 100 DH l’unité. La Chambre des représentants l’a adopté en première lecture, et ajouté : l’importation du bétail suit des procédures que l’administration fixe, et la taxe sur les cigares et sur le liquide de cigarette électronique augmente.'}
  timeline:
    - date: '2026-10-20'
      text: {ar: 'أودعت الحكومة مشروع قانون المالية 60.26: المادة 3 (مدونة الجمارك، الفصل 164) والمادة 7 (المدونة العامة للضرائب، المادة 123) للمواشي واللحوم، والمادة 5 للدخان والسيجارة الإلكترونية.', fr: 'Dépôt du projet de loi de finances 60.26 : l’article 3 (code des douanes, art. 164) et l’article 7 (CGI, art. 123) pour le bétail et les viandes, l’article 5 pour le tabac et la cigarette électronique.'}
      source: {name: {ar: 'وزارة الاقتصاد والمالية، نص المشروع', fr: 'Ministère de l’Économie et des Finances, texte du projet'}, url: 'https://www.finances.gov.ma/Publication/db/2027/corps-plf-2027_Ar.pdf', file: sources/mef/plf2027/corps-plf-2027_Ar.pdf, sha256: a6a1e342ac4bf36f20dee10206e85e55f3da476a50b32818e9af360382dc54e7}
      cites: [/ma/projet-loi/60-26/art_3, /ma/projet-loi/60-26/art_5, /ma/code/cgi/art_123]
    - date: '2026-11-12'
      text: {ar: 'لجنة المالية بمجلس النواب خلات الإعفاء ديال استيراد المواشي ولحومها وزادت بلي كيدوز «وفق إجراءات مؤطرة تحددها الإدارة» (22 مع، 17 ضد)، وما قبلاتش ثلاثة ديال التعديلات كانت باغية تحيدو ولا تحدو فالزمان. وزادت بالإجماع: السيكار 1.125 درهم لكل 1.000 وحدة عوض 750 و50% عوض 35%، وسائل السيجارة الإلكترونية 10 و20 درهم لكل 10 ملل عوض 5 و10.', fr: 'La commission des finances de la Chambre des représentants garde l’exonération du bétail et de ses viandes à l’importation et ajoute qu’elle se fait « selon des procédures encadrées que l’administration fixe » (22 pour, 17 contre) ; elle écarte trois amendements qui la supprimaient ou la limitaient dans le temps. Elle ajoute à l’unanimité : les cigares à 1 125 DH les 1 000 unités au lieu de 750 et 50 % au lieu de 35 %, le liquide de cigarette électronique à 10 et 20 DH les 10 ml au lieu de 5 et 10.'}
      source: {name: {ar: 'مجلس النواب، تقرير لجنة المالية حول المشروع، الجزء الثاني، ص. 727', fr: 'Chambre des représentants, rapport de la commission des finances sur le projet, deuxième partie, p. 727'}, url: 'https://www.chambredesrepresentants.ma/sites/default/files/2emepUP2.pdf#page=727', file: sources/parliament/plf2027/2emepUP2.pdf, sha256: f983ee219d6e93524606f9b34cd91edfdae03e2331da04113dfb978a141831ca}
      cites: [/ma/projet-loi/60-26/art_3, /ma/projet-loi/60-26/art_5]
    - date: '2026-11-14'
      text: {ar: 'مجلس النواب صادق على المشروع فالقراءة الأولى: 179 مع و126 ضد؛ دابا عند مجلس المستشارين.', fr: 'La Chambre des représentants adopte le projet en première lecture : 179 pour, 126 contre ; il est maintenant devant la Chambre des conseillers.'}
      source: {name: {ar: 'وزارة الاقتصاد والمالية، بلاغ 14 نونبر 2026', fr: 'Ministère de l’Économie et des Finances, communiqué du 14 novembre 2026'}, url: 'https://www.finances.gov.ma/Fr/Pages/detail-actualite.aspx?fiche=7861', file: sources/mef/plf2027/actualite-7861.html, sha256: cc406f246a985d226ee03d702794c156c014254c39d68178f08cb5fe9eb9dc35}
