- key: court-2020
  title: {ar: 'المحكمة المختصة في نزاعات الاستهلاك (القانون 78.20)', fr: 'Le tribunal compétent pour les litiges de consommation (loi 78-20)'}
  stage: in_force
  stages: &stages
    - {key: announced, label: {ar: معلن, fr: Annoncé}}
    - {key: bill, label: {ar: مشروع في البرلمان, fr: Projet au Parlement}}
    - {key: coming, label: {ar: نص لم يدخل حيز التنفيذ, fr: Texte pas encore en vigueur}}
    - {key: in_force, label: {ar: نافذ, fr: En vigueur}}
  checked_on: '2026-10-24'
  line: {ar: 'نافذ منذ 21 دجنبر 2020: المحكمة الابتدائية وحدها، في مدينة المستهلك أو مكان الضرر، رغم أي شرط مخالف.', fr: 'En vigueur depuis le 21 décembre 2020 : le tribunal de première instance seul, dans la ville du consommateur ou au lieu du dommage, malgré toute clause contraire.'}
  timeline:
    - date: '2020-12-21'
      text: {ar: 'نشر القانون 78.20 الذي غير المادة 202 من القانون 31.08.', fr: 'Publication de la loi 78-20, qui modifie l’article 202 de la loi 31-08.'}
      source: {name: {ar: 'الجريدة الرسمية عدد 6945', fr: 'BO n° 6945'}, url: 'https://www.sgg.gov.ma/BO/bo_ar/2020/BO_6945_Ar.pdf'}
      cites: [/ma/loi/78-20/art_1, /ma/loi/31-08/art_202]

