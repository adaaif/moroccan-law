- key: bills
  for: [bill, subscription]
  title: {ar: 'الماء، الكهرباء، الاتصالات', fr: 'L’eau, l’électricité, les télécommunications'}
  lead:
    ar: 'من يسير مرفقا عاما بالتفويض ملزم بما يلزم به المورد، والإدارة التي تسيره كذلك مع مراعاة قواعد المرفق العام. فالفاتورة، والثمن الإجمالي، والشروط التعسفية، والاشتراك، كلها تخضع للقانون رقم 31.08.'
    fr: 'Qui gère un service public par délégation est tenu des obligations du fournisseur, et l’administration qui le gère aussi, sous les règles du service public. La facture, le prix total, les clauses abusives et l’abonnement relèvent donc de la loi 31-08.'
  sections:
    - title: {ar: 'المفوض لهم والإدارات', fr: 'Délégataires et administrations'}
      facts:
        - text: {ar: 'يتقيد الأشخاص الخاضعون للقانون الخاص المفوض لهم تسيير مرفق عام بالالتزامات التي يفرضها هذا القانون على المورد، ويتقيد بها كذلك الأشخاص المعنويون الخاضعون للقانون العام مع مراعاة قواعد المرفق الذي يسيرونه.', fr: 'Les personnes de droit privé délégataires d’un service public sont tenues des obligations que la loi impose au fournisseur ; les personnes morales de droit public aussi, sous réserve des règles du service public qu’elles gèrent.'}
          cites: [/ma/loi/31-08/art_2]
    - title: {ar: 'الفاتورة', fr: 'La facture'}
      facts:
        - text: {ar: 'تذكر الفاتورة المورد، والخدمة وكشفها المفصل عند الاقتضاء، والتاريخ، وسعر كل خدمة والمبلغ الإجمالي بكل الرسوم والضريبة، وكيفيات الأداء. والثمن الإجمالي يشمل كل خدمة يلزم المستهلك بأدائها.', fr: 'La facture indique le fournisseur, la prestation et son relevé détaillé le cas échéant, la date, le prix de chaque prestation et le total toutes taxes comprises, le mode de paiement. Le prix total comprend toute prestation imposée.'}
          cites: [/ma/loi/31-08/art_4, /ma/decret/2-12-503/art_25, /ma/loi/31-08/art_5]
      tool: tools/where
    - title: {ar: 'العقد والاشتراك', fr: 'Le contrat et l’abonnement'}
      facts:
        - text: {ar: 'الشرط التعسفي في عقد الاشتراك باطل، كالشرط الذي يخول المورد تغيير بنود العقد وحده دون سبب منصوص عليه، أو رفع الثمن دون حق مماثل للمستهلك في الفسخ.', fr: 'La clause abusive d’un contrat d’abonnement est nulle, comme celle qui permet au fournisseur de modifier seul le contrat sans motif prévu, ou d’augmenter le prix sans droit équivalent de résiliation.'}
          cites: [/ma/loi/31-08/art_18, /ma/loi/31-08/art_19]
        - text: {ar: 'في الاشتراك محدد المدة، يذكر المورد المستهلك كتابة شهرا قبل نهاية العقد أو تجديده؛ وإلا فللمستهلك أن ينهيه بعد التجديد في أي وقت.', fr: 'Pour un abonnement à durée déterminée, le fournisseur rappelle par écrit un mois avant la fin ou la reconduction ; sinon le consommateur peut y mettre fin à tout moment après la reconduction.'}
          cites: [/ma/loi/31-08/art_7]
    - title: {ar: 'عن بعد وبالهاتف', fr: 'À distance et par téléphone'}
      facts:
        - text: {ar: 'أرقام الهاتف المخصصة لتتبع العقد ودراسة الشكايات لا تخضع لرسوم إضافية، ويشار إليها في العقد والمراسلات.', fr: 'Les numéros dédiés au suivi du contrat et aux réclamations ne peuvent être surtaxés ; ils figurent dans le contrat et les courriers.'}
          cites: [/ma/loi/31-08/art_32]
  links:
    - name: {ar: 'الوكالة الوطنية لتقنين المواصلات', fr: 'ANRT'}
      url: https://www.anrt.ma
      note: {ar: 'شكايات الاتصالات، بعد المتعهد', fr: 'réclamations télécoms, après l’opérateur'}
    - name: {ar: 'البوابة الوطنية للشكايات', fr: 'Portail national des réclamations'}
      url: https://www.chikaya.ma

- key: bank
  for: [credit, home-loan]
  title: {ar: 'البنك والقرض', fr: 'La banque et le crédit'}
  lead:
    ar: 'القروض للمستهلكين، الاستهلاكية والعقارية، يحكمها القانون رقم 31.08. والشكاية على البنك تمر بالبنك نفسه، ثم بالوساطة البنكية، ثم ببنك المغرب، كما يصفها بنك المغرب.'
    fr: 'Les crédits aux consommateurs, à la consommation et immobiliers, relèvent de la loi 31-08. Une réclamation contre une banque passe par la banque, puis par la médiation bancaire, puis par Bank Al-Maghrib, comme Bank Al-Maghrib la décrit.'
  sections:
    - title: {ar: 'ما يقوله القانون رقم 31.08', fr: 'Ce que dit la loi 31-08'}
      facts:
        - text: {ar: 'عرض مسبق قبل كل قرض استهلاكي، وسبعة أيام للتراجع من قبوله، والتسديد المبكر دون تعويض، وحدود لما يطالب به عند التوقف.', fr: 'Une offre préalable avant tout crédit à la consommation, sept jours de rétractation après l’acceptation, le remboursement anticipé sans indemnité, des plafonds en cas de défaillance.'}
          cites: [/ma/loi/31-08/art_77, /ma/loi/31-08/art_85, /ma/loi/31-08/art_103, /ma/loi/31-08/art_104]
        - text: {ar: 'في القرض العقاري: عرض يبقى خمسة عشر يوما ولا يقبل إلا بعد عشرة أيام، وتعويض التسديد المبكر لا يتجاوز 2 % من الباقي إن نص عليه العقد.', fr: 'En crédit immobilier : une offre maintenue quinze jours, acceptée seulement après dix, et une indemnité de remboursement anticipé d’au plus 2 % du restant dû si le contrat la prévoit.'}
          cites: [/ma/loi/31-08/art_120, /ma/loi/31-08/art_132]
        - text: {ar: 'المقرض الذي لا يشير إلى السعر الفعلي الإجمالي في عقد القرض يعاقب بغرامة من 20.000 إلى 30.000 درهم.', fr: 'Le prêteur qui n’indique pas le taux effectif global dans le contrat encourt une amende de 20 000 à 30 000 dirhams.'}
          cites: [/ma/loi/31-08/art_143, /ma/loi/31-08/art_193]
      tool: tools/credit
    - title: {ar: 'الشكاية', fr: 'La réclamation'}
      facts:
        - text: {ar: 'حسب بنك المغرب: الشكاية مكتوبة مع الوثائق، بعد أن تقدم إلى البنك نفسه؛ والمركز المغربي للوساطة البنكية يتدخل بين البنك وزبونه قبل ذلك.', fr: 'Selon Bank Al-Maghrib : une réclamation écrite avec les pièces, après l’avoir adressée à la banque elle-même ; le Centre marocain de médiation bancaire intervient avant, entre la banque et son client.'}
  links:
    - name: {ar: 'بنك المغرب: معالجة شكايات زبناء مؤسسات الائتمان', fr: 'Bank Al-Maghrib : réclamations de la clientèle des établissements de crédit'}
      url: https://www.bkam.ma/Trouvez-l-information-concernant/Services-rendus-au-public/Resolution-des-differends-entre-les-etablissements-de-credit-et-leur-clientele/Traitement-des-reclamations-de-la-clientele-des-etablissements-de-credit
    - name: {ar: 'المركز المغربي للوساطة البنكية', fr: 'Centre marocain de médiation bancaire'}
      url: https://cmmb.ma

- key: safety
  title: {ar: 'سلامة ما يشتريه المستهلك', fr: 'La sécurité de ce qu’on achète'}
  lead:
    ar: 'ثلاثة قوانين: سلامة المنتوجات والخدمات (24.09)، والسلامة الصحية للمنتجات الغذائية (28.07)، والزجر عن الغش في البضائع (13.83).'
    fr: 'Trois lois : la sécurité des produits et des services (24-09), la sécurité sanitaire des produits alimentaires (28-07), la répression des fraudes sur les marchandises (13-83).'
  sections:
    - title: {ar: 'منتوج أو خدمة غير سليمة', fr: 'Un produit ou un service dangereux'}
      facts:
        - text: {ar: 'لا يعرض المنتج أو المستورد أو مقدم الخدمة في السوق إلا ما هو سليم: ما لا يشكل خطرا في شروط الاستعمال العادية أو المعقول توقعها، أو يشكل أخطارا محدودة مقبولة. والأغذية والأدوية لها قوانينها.', fr: 'Producteurs, importateurs et prestataires ne mettent sur le marché que des produits et services sûrs : sans danger dans les conditions d’usage normales ou raisonnablement prévisibles, ou avec des risques limités et acceptables. Aliments et médicaments ont leurs lois.'}
          cites: [/ma/loi/24-09/art_4, /ma/loi/24-09/art_5, /ma/loi/24-09/art_2]
        - text: {ar: 'من علم أن ما عرضه غير سليم يخبر الإدارة فورا؛ وللإدارة أن توقف المنتوج سنة على الأكثر، وتسحبه، وتأمر باسترجاعه لاستبداله أو رد ثمنه.', fr: 'Qui sait que ce qu’il a mis sur le marché n’est pas sûr en informe aussitôt l’administration ; celle-ci peut suspendre le produit un an au plus, le retirer et en ordonner le rappel pour échange ou remboursement.'}
          cites: [/ma/loi/24-09/art_28, /ma/loi/24-09/art_36]
        - text: {ar: 'والبيانات الموجهة للمستعمل، كالعنونة وطرق الاستعمال والتحذيرات، تحرر على الأقل بالعربية.', fr: 'Les informations destinées à l’usager, étiquetage, mode d’emploi, avertissements, sont rédigées au moins en arabe.'}
          cites: [/ma/loi/24-09/art_31]
    - title: {ar: 'الأغذية', fr: 'Les aliments'}
      facts:
        - text: {ar: 'لا يعرض في السوق أي منتوج غذائي يشكل خطرا على حياة الإنسان أو صحته، ومن علم بذلك يخبر السلطات فورا، فتفرض سحبه، أو تسحبه على نفقته.', fr: 'Aucun aliment dangereux pour la vie ou la santé ne peut être mis sur le marché ; qui le sait prévient aussitôt les autorités, qui imposent le retrait ou y procèdent à ses frais.'}
          cites: [/ma/loi/28-07/art_4, /ma/loi/28-07/art_10]
    - title: {ar: 'الغش', fr: 'La fraude'}
      facts:
        - text: {ar: 'يعد غشا خداع المتعاقد في جوهر الشيء أو كميته أو تغييرهما بالتدليس، ويعاقب عليه بالحبس من ستة أشهر إلى خمس سنوات وبغرامة، وتضاعف العقوبة إذا كان فيه خطر على الصحة.', fr: 'Est une fraude le fait de tromper le contractant sur la substance ou la quantité de la chose, ou de les altérer frauduleusement ; six mois à cinq ans d’emprisonnement et une amende, doublés s’il y a danger pour la santé.'}
          cites: [/ma/loi/13-83/art_1, /ma/loi/13-83/art_2]
  links:
    - name: {ar: 'المكتب الوطني للسلامة الصحية للمنتجات الغذائية', fr: 'ONSSA'}
      url: https://www.onssa.gov.ma
      note: {ar: 'العنوان كما يذكره المكتب', fr: 'l’adresse que donne l’Office'}

- key: numbers
  for: [credit, home-loan]
  title: {ar: 'شحال من شكاية على البنوك؟', fr: 'Combien de réclamations contre les banques ?'}
  lead:
    ar: 'أرقام بنك المغرب، سنة بسنة، ولكل رقم تقريره وصفحته. هي الشكايات التي وصلت إلى بنك المغرب والوساطة، لا كل ما قدم إلى البنوك.'
    fr: 'Les chiffres de Bank Al-Maghrib, année par année, chacun avec son rapport et sa page. Ce sont les réclamations arrivées à Bank Al-Maghrib et à la médiation, non toutes celles faites aux banques.'
  series: [bank-complaints, mediation]
  links:
    - name: {ar: 'التقرير السنوي حول الإشراف البنكي', fr: 'Rapport annuel sur la supervision bancaire'}
      url: https://www.bkam.ma/fr/Publications-et-recherche/Publications-institutionnelles/Rapport-annuel-sur-la-supervision-bancaire
      note: {ar: بنك المغرب, fr: Bank Al-Maghrib}
