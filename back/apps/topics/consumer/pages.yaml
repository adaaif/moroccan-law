# The consumer topic's pages (D3, D4 and K3 of the consumer plan): facts, each on its articles, and the official
# services by name and link (`links`: cited and linked, never copied, never logged into). What is a body's own practice
# rather than the law is said to be that body's. A page says whom it is for (`for`).

- key: beliefs
  title: {ar: 'ما يقال، وما يقوله القانون', fr: 'Ce qu’on entend, et ce que dit la loi'}
  lead:
    ar: 'جمل يسمعها المستهلك كل يوم، وكل واحدة بجانب ما يقوله القانون رقم 31.08 في حالاتها.'
    fr: 'Des phrases que le consommateur entend chaque jour, chacune à côté de ce que dit la loi 31-08 dans ses cas.'
  sections:
    - title: {ar: '«لا ترد ولا تستبدل»', fr: '« Ni reprise ni échange »'}
      facts:
        - text: {ar: 'إذا كان الشيء سليما واشتري في المحل، فالقانون لا يعطي حقا في إرجاعه: حق التراجع للبيع عن بعد وللبيع خارج المحلات. والمحل الذي يقبل الاستبدال يفعل ذلك باختياره.', fr: 'Un bien sans défaut acheté en magasin : la loi ne donne pas de droit de le rendre ; la rétractation vaut pour la vente à distance et hors établissement. Le magasin qui échange le fait de son plein gré.'}
          cites: [/ma/loi/31-08/art_36, /ma/loi/31-08/art_49]
        - text: {ar: 'إذا كان فيه عيب، فالضمان القانوني يطبق، ولا يطبق على المستهلك الشرط الذي يعفي البائع من كل ضمان. فهذه العبارة لا تلغي الضمان.', fr: 'S’il a un vice, la garantie légale s’applique, et la clause qui libère le vendeur de toute garantie ne s’applique pas au consommateur. Cette mention n’écarte donc pas la garantie.'}
          cites: [/ma/loi/31-08/art_65, /ma/code/doc/art_571]
    - title: {ar: '«الضمان عام من الفاتورة»', fr: '« La garantie, c’est un an à partir de la facture »'}
      facts:
        - text: {ar: 'الضمان القانوني يحسب من التسليم لا من الفاتورة: سنة للمنقولات وسنتان للعقارات، ولا يقصره أي اتفاق.', fr: 'La garantie légale court de la livraison, non de la facture : un an pour un meuble, deux ans pour un immeuble, et aucune convention ne la raccourcit.'}
          cites: [/ma/loi/31-08/art_65]
        - text: {ar: 'ضمان المحل أو الصانع ضمان إضافي، ومدته تمدد بالأيام التي بقي فيها الشيء عند المورد للإصلاح.', fr: 'La garantie du magasin ou du fabricant s’ajoute ; sa durée s’allonge des jours où le bien est resté chez le fournisseur pour réparation.'}
          cites: [/ma/loi/31-08/art_66, /ma/loi/31-08/art_73]
      tool: tools/guarantee
    - title: {ar: '«أونلاين ديما نقدر نرجعها»', fr: '« En ligne, on peut toujours renvoyer »'}
      facts:
        - text: {ar: 'سبعة أيام كاملة من التسلم، وثلاثون إذا لم يصل تأكيد كتابي؛ وبعدها لا تراجع، إلا الضمان إن كان عيب.', fr: 'Sept jours francs dès la réception, trente sans confirmation écrite ; ensuite plus de rétractation, seulement la garantie en cas de vice.'}
          cites: [/ma/loi/31-08/art_36]
        - text: {ar: 'ولا تراجع في السلع المصنوعة حسب الطلب أو سريعة التلف، ولا في البرامج المفتوحة، ولا في الجرائد، ولا في خدمة بدأت بموافقة المستهلك.', fr: 'Pas de rétractation non plus pour un bien sur mesure ou périssable, un logiciel descellé, un journal, ou un service commencé avec l’accord du consommateur.'}
          cites: [/ma/loi/31-08/art_38]
      tool: tools/return
    - title: {ar: '«البنك هو اللي كيقرر شحال كندين ليه»', fr: '« C’est la banque qui décide de ce que je dois »'}
      facts:
        - text: {ar: 'في القرض الاستهلاكي، عند التوقف عن الأداء، لا يطالب المقرض إلا بما حدده القانون: فوائد تأخير لا تتعدى 4 % من رأس المال المتبقي، أو تعويض لا يزيد على 4 % من الأقساط الحالة غير المؤداة؛ ولا أي تكلفة أخرى.', fr: 'En crédit à la consommation, en cas de défaillance, le prêteur ne réclame que ce que fixe la loi : des intérêts de retard d’au plus 4 % du capital restant, ou une indemnité d’au plus 4 % des échéances échues impayées ; aucun autre coût.'}
          cites: [/ma/loi/31-08/art_104, /ma/loi/31-08/art_105, /ma/loi/31-08/art_108]
        - text: {ar: 'والتسديد المبكر جائز في أي وقت دون تعويض، وكل شرط مخالف باطل.', fr: 'Et le remboursement anticipé est permis à tout moment sans indemnité ; toute clause contraire est nulle.'}
          cites: [/ma/loi/31-08/art_103]
      tool: tools/credit
    - title: {ar: '«سنيت، ما بقا ما يدار»', fr: '« J’ai signé, c’est fini »'}
      facts:
        - text: {ar: 'سبعة أيام للتراجع بعد البيع خارج المحلات، وسبعة أيام بعد قبول عرض القرض، والشرط التعسفي باطل ولو وقعه المستهلك.', fr: 'Sept jours de rétractation après une vente hors établissement, sept jours après l’acceptation d’une offre de crédit, et une clause abusive est nulle même signée.'}
          cites: [/ma/loi/31-08/art_49, /ma/loi/31-08/art_85, /ma/loi/31-08/art_19]
    - title: {ar: '«العقد بالفرنسية، ما فهمت والو»', fr: '« Le contrat est en français, je n’ai rien compris »'}
      facts:
        - text: {ar: 'كل عقد محرر بلغة أجنبية يصحب وجوبا بترجمة إلى العربية، والشروط تحرر بصورة واضحة، وعند الشك يفسر الشرط لصالح المستهلك.', fr: 'Tout contrat rédigé en langue étrangère est obligatoirement accompagné d’une traduction arabe ; les clauses sont claires, et en cas de doute l’interprétation favorable au consommateur l’emporte.'}
          cites: [/ma/loi/31-08/art_206, /ma/loi/31-08/art_9]
    - title: {ar: '«الثمن فالكاس ماشي بحال المكتوب»', fr: '« Le prix en caisse n’est pas celui affiché »'}
      facts:
        - text: {ar: 'الثمن المعلن هو الثمن الإجمالي الذي يدفعه المستهلك، بالضريبة على القيمة المضافة وكل الرسوم وتكلفة كل خدمة يلزم بها.', fr: 'Le prix annoncé est le prix total que paie le consommateur, TVA, taxes et coût de toute prestation imposée compris.'}
          cites: [/ma/loi/31-08/art_5]

- key: where
  title: {ar: 'فين تشكي', fr: 'Où réclamer'}
  lead:
    ar: 'المورد أولا، ثم الإدارة المختصة، أو جمعية لحماية المستهلك، ثم المحكمة الابتدائية لمدينتك. ولكل قطاع منظم خدمته الرسمية للشكايات.'
    fr: 'Le fournisseur d’abord, puis l’administration compétente ou une association de consommateurs, puis le tribunal de première instance de votre ville. Chaque secteur régulé a son service officiel de réclamation.'
  sections:
    - title: {ar: 'المورد أولا', fr: 'Le fournisseur d’abord'}
      facts:
        - text: {ar: 'في البيع عن بعد، يجب أن يتوصل المستهلك بعنوان المورد الذي يقدم إليه شكاياته، ولا تخضع أرقام الهاتف المخصصة للشكايات لرسوم إضافية.', fr: 'Pour une vente à distance, le consommateur doit recevoir l’adresse où réclamer ; les numéros dédiés aux réclamations ne peuvent être surtaxés.'}
          cites: [/ma/loi/31-08/art_32]
        - text: {ar: 'والمورد يسلم نظيرا من الاتفاقات التي يقترحها عادة لكل من يطلبه، والمستهلك له نسخة من عقده المكتوب.', fr: 'Le fournisseur remet ses conventions habituelles à qui les demande, et le consommateur reçoit un exemplaire de son contrat écrit.'}
          cites: [/ma/loi/31-08/art_11, /ma/loi/31-08/art_8]
    - title: {ar: 'الإدارة', fr: 'L’administration'}
      facts:
        - text: {ar: 'يبحث عن مخالفات القانون ويثبتها، زيادة على ضباط الشرطة القضائية، باحثون محلفون تنتدبهم الإدارة المختصة، يمكنهم أن يلجوا المحلات المهنية ويطلعوا على الفاتورات والوثائق. ويحدد القرار 2.14 الباحثين التابعين لوزارة الصناعة والتجارة.', fr: 'Outre les officiers de police judiciaire, des enquêteurs assermentés de l’administration compétente recherchent et constatent les infractions ; ils accèdent aux locaux professionnels et consultent factures et documents. L’arrêté 2-14 désigne ceux du ministère de l’Industrie et du Commerce.'}
          cites: [/ma/loi/31-08/art_166, /ma/loi/31-08/art_169, /ma/arrete/2-14/art_1]
    - title: {ar: 'جمعيات حماية المستهلك', fr: 'Les associations de consommateurs'}
      facts:
        - text: {ar: 'ترفع الجامعة الوطنية والجمعيات المعترف لها بصفة المنفعة العامة الدعاوى دفاعا عن المصلحة الجماعية للمستهلكين؛ وغيرها لا ترفعها إلا بإذن خاص بالتقاضي من وزارة العدل، يمنح داخل شهرين لجمعية مضى على تأسيسها سنتان على الأقل.', fr: 'La fédération nationale et les associations reconnues d’utilité publique agissent en justice pour l’intérêt collectif des consommateurs ; les autres seulement avec une autorisation spéciale d’ester du ministère de la Justice, accordée dans les deux mois à une association d’au moins deux ans.'}
          cites: [/ma/loi/31-08/art_157, /ma/decret/2-12-503/art_35, /ma/decret/2-12-503/art_37]
        - text: {ar: 'منح وزير العدل هذا الإذن، لمدة ثلاث سنوات، للجامعة المغربية لحقوق المستهلك بالقرار 504.24 المؤرخ في 23 فبراير 2024، وللجامعة الوطنية لجمعيات المستهلك بالقرار 3094.22 المؤرخ في 11 نونبر 2022. ولا يجد «قانون» في الجريدة الرسمية، إلى أكتوبر 2026، قرارا يجدد هذا الأخير.', fr: 'Le ministre de la Justice a accordé cette autorisation, pour trois ans, à la Fédération marocaine des droits du consommateur par l’arrêté 504-24 du 23 février 2024, et à la Fédération nationale des associations du consommateur par l’arrêté 3094-22 du 11 novembre 2022. 3adala ne trouve au Bulletin officiel, jusqu’en octobre 2026, aucun arrêté qui renouvelle ce dernier.'}
          cites: [/ma/arrete/3094-22/art_1, /ma/arrete/504-24/art_1]
        - text: {ar: 'إذا تضرر عدة مستهلكين من نفس المورد ولنفس السبب، يمكن للجمعية، إذا وكلها اثنان منهم على الأقل كتابة، أن تطالب بالتعويض باسمهم، والوكالة مجانية ويمكن سحبها في أي وقت.', fr: 'Si plusieurs consommateurs ont subi un préjudice du même fournisseur et de la même origine, l’association mandatée par écrit par deux d’entre eux au moins peut demander réparation en leur nom ; le mandat est gratuit et révocable à tout moment.'}
          cites: [/ma/loi/31-08/art_158, /ma/loi/31-08/art_160, /ma/loi/31-08/art_161]
    - title: {ar: 'المحكمة', fr: 'Le tribunal'}
      facts:
        - text: {ar: 'في نزاع بين مورد ومستهلك، تختص المحكمة الابتدائية وحدها رغم أي شرط مخالف، وهي محكمة موطن المستهلك أو محل إقامته، أو مكان الضرر، باختياره.', fr: 'Dans un litige entre fournisseur et consommateur, le tribunal de première instance est seul compétent malgré toute clause contraire : celui du domicile ou de la résidence du consommateur, ou du lieu du dommage, à son choix.'}
          cites: [/ma/loi/31-08/art_202]
    - title: {ar: 'حسب القطاع', fr: 'Selon le secteur'}
      facts:
        - text: {ar: 'البنوك ومؤسسات الائتمان: البنك أولا، ثم المركز المغربي للوساطة البنكية، ثم بنك المغرب، كما يصف بنك المغرب مسطرته.', fr: 'Banques et établissements de crédit : la banque d’abord, puis le Centre marocain de médiation bancaire, puis Bank Al-Maghrib, comme Bank Al-Maghrib décrit sa procédure.'}
        - text: {ar: 'الاتصالات: المتعهد أولا، ثم الوكالة الوطنية لتقنين المواصلات. التأمين: المؤمن، ثم هيئة مراقبة التأمينات والاحتياط الاجتماعي. الأغذية: المكتب الوطني للسلامة الصحية للمنتجات الغذائية.', fr: 'Télécommunications : l’opérateur d’abord, puis l’ANRT. Assurance : l’assureur, puis l’ACAPS. Aliments : l’ONSSA.'}
      tool: tools/where
  links:
    - name: {ar: 'بوابة خدمات المستهلك (وزارة الصناعة والتجارة)', fr: 'Portail du consommateur (ministère de l’Industrie et du Commerce)'}
      url: https://www.khidmat-almostahlik.ma
      note: {ar: 'كما تذكرها صفحة الوزارة لحماية المستهلك', fr: 'telle que la donne la page du ministère sur la protection du consommateur'}
    - name: {ar: 'إيداع شكاية لدى بوابة خدمات المستهلك', fr: 'Déposer une réclamation au portail du consommateur'}
      url: http://reclamation.khidmat-almostahlik.ma/
