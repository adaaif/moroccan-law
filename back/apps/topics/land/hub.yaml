# What people believe, and what the law says (M15): short cards under the doors, each leading to the page.
beliefs:
  - claim: {ar: 'حزت الأرض عشر سنين، ولات ديالي', fr: 'Dix ans sur la terre, elle est à moi'}
    truth: {ar: 'إلا كانت ماشي محفظة، وماشي ديال الدولة ولا حبس ولا جموع (المادتان 250 و261).', fr: 'Si elle n’est pas immatriculée, ni à l’État, ni habous, ni collective (art. 250 et 261).'}
    to: pages/beliefs
  - claim: {ar: 'عقد المحامي كافي', fr: 'L’acte de l’avocat suffit'}
    truth: {ar: 'ما بقاش منذ 16 يوليوز 2026: بيع العقار بمحرر رسمي، وإلا باطل (المادة 4).', fr: 'Plus depuis le 16 juillet 2026 : la vente d’un immeuble par acte authentique, à peine de nullité (art. 4).'}
    to: pages/beliefs
  - claim: {ar: 'الرسم العقاري يتطعن فيه بحال أي عقد', fr: 'Un titre foncier se conteste comme un contrat'}
    truth: {ar: 'نهائي؛ المتضرر من التدليس عندو دعوى التعويض على المدلس (الفصلان 62 و64).', fr: 'Il est définitif ; la victime d’un dol a une action en dommages contre son auteur (art. 62 et 64).'}
    to: pages/beliefs
  - claim: {ar: 'إلا ما جاوبونيش على الرخصة نبقى نتسنى', fr: 'Sans réponse au permis, j’attends'}
    truth: {ar: 'سكوت رئيس الجماعة شهرين من الإيداع كيعتبر رخصة (المادة 48).', fr: 'Deux mois de silence du président de la commune après le dépôt valent permis (art. 48).'}
    to: pages/beliefs
  - claim: {ar: 'الدولة تقدر تاخذ الأرض بلا تعويض', fr: 'L’État peut prendre la terre sans indemnité'}
    truth: {ar: 'نزع الملكية غير بإعلان المنفعة العامة وبالمسطرة والتعويض (الفصلان 1 و20).', fr: 'L’expropriation exige la déclaration d’utilité publique, la procédure et l’indemnité (art. 1 et 20).'}
    to: pages/beliefs
  - claim: {ar: 'أرض الجموع غير للرجال', fr: 'La terre collective, c’est pour les hommes'}
    truth: {ar: 'الأعضاء ذكورا وإناثا كينتفعو بأملاك الجماعة (المادة 6).', fr: 'Les membres, hommes et femmes, jouissent des biens de la collectivité (art. 6).'}
    to: pages/beliefs

