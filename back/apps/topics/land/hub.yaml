# The land topic's page (the land review, 26 Oct 2026, M1–M19 all «Yes», C1 band, C2 names, C3 wait): what the plot
# is first (titled, being titled, not titled, collective), since every rule of land law turns on it; then the doors by
# what is happening, in the words people use, in a plot's life; the papers that start a clock in a band; the tools.
# Written from law 39.08 (Adala, to 16 Jul 2026, with law 41.25), the land-registration dahir of 12 Aug 1913 (Adala),
# law 12.90 (SGG, 2016), law 25.90 (SGG, to 10 Aug 2026, with law 34.21), decree 2.18.577, law 7.81 and laws 62.17
# and 63.17, as the site holds them on 26 Oct 2026. Flats, off-plan purchases, a building's co-ownership and leases stay in
# the housing topic, linked at the end.
doors_title: {ar: شنو وقع ليك؟, fr: 'Que vous arrive-t-il ?'}

# M2: each door is led by its plot as a surveyor draws it (`marks: plot`): a titled plot solid with its stones, an
# untitled one dashed, what is taken or disputed washed in red; the one number the law sets for the moment (`mark`) is
# written where a plan writes the area. `plot` names the drawing.
marks: plot
stages:
  - {key: before, title: {ar: قبل ما تملك, fr: 'Avant d’être propriétaire'}, doors: [buy, held]}
  - {key: prove, title: {ar: تثبت ملكك, fr: 'Prouver que c’est à vous'}, doors: [register, oppose, fraud]}
  - {key: shared, title: {ar: بين الشركاء, fr: 'Entre copropriétaires'}, doors: [inherit, preempt, divide]}
  - {key: build, title: {ar: البني, fr: 'Construire'}, doors: [build, nopermit, plan]}
  - {key: state, title: {ar: الدولة والجماعة, fr: 'L’État et la collectivité'}, doors: [expropriation, collective]}
  - {key: elsewhere, title: {ar: فمواضيع أخرى, fr: 'Dans d’autres thèmes'}, doors: [flat, syndic, property-tax], links: true}

# M5, C1 «band»: the papers that start a clock, in the soil's dark ink (no emergency: rights that close). Each paper
# with its limit and article; the band leads to the clock, which counts the days once the reader gives the day.
urgent:
  title: {ar: توصلت بورقة على أرضك؟, fr: 'Un papier sur votre terrain ?'}
  lead: {ar: 'الأوراق اللي كيبدا معاها أجل، وإلا فات كيضيع الحق', fr: 'Les papiers qui ouvrent un délai : passé, le droit se perd'}
  to: tools/clock
  tone: soil
  day: {ar: شحال بقا ليك؟, fr: 'Combien de jours ?'}
  papers:
    - paper: {ar: إعلان انتهاء التحديد فالجريدة الرسمية, fr: 'L’avis de clôture du bornage au Bulletin officiel'}
      limit: {ar: شهران, fr: deux mois}
      for: {ar: للتعرض على مطلب التحفيظ, fr: 'pour faire opposition à la réquisition'}
      article: {ar: الفصلان 24 و27, fr: art. 24 et 27}
      cites: [/ma/code/land-registration/art_24, /ma/code/land-registration/art_27]
      to: journeys/oppose
      key: oppose
    - paper: {ar: مشروع مقرر التخلي فالجماعة, fr: 'Le projet d’acte de cessibilité à la commune'}
      limit: {ar: شهران, fr: deux mois}
      for: {ar: لكتابة ملاحظاتك فالسجل, fr: 'pour inscrire vos observations au registre'}
      article: {ar: الفصل 10, fr: art. 10}
      cites: [/ma/loi/7-81/art_10]
      to: journeys/expropriation
      key: inquiry
    - paper: {ar: تبليغ بشراء حصة شريكك, fr: 'La notification de l’achat de la part d’un copropriétaire'}
      limit: {ar: 30 يوما, fr: 30 jours}
      for: {ar: للأخذ بالشفعة, fr: 'pour exercer la préemption'}
      article: {ar: المادة 304, fr: art. 304}
      cites: [/ma/loi/39-08/art_304]
      to: journeys/preempt
      key: preempt
    - paper: {ar: مقرر توزيع أرض الجموع, fr: 'La décision de répartition des terres collectives'}
      limit: {ar: 30 يوما, fr: 30 jours}
      for: {ar: للطعن أمام مجلس الوصاية الإقليمي, fr: 'pour le recours devant le conseil de tutelle provincial'}
      article: {ar: المادة 16, fr: art. 16}
      cites: [/ma/loi/62-17/art_16]
      to: journeys/collective
      key: share
  tool: tools/clock

# M4: one question, «أرضك شنو هي؟»; each answer names its law and three facts with their articles. A door that does not
# concern the answer fades with the law's own reason (`not`): a titled plot is not acquired by possession (art. 261).
profile:
  question: {ar: أرضك شنو هي؟, fr: 'Votre terrain est-il immatriculé ?'}
  options:
    - key: titled
      main: true
      label: {ar: محفظة (عندها رسم عقاري), fr: 'Immatriculé (titre foncier)'}
      law: {ar: 'الرسم العقاري نهائي ولا يقبل الطعن (الفصل 62 من ظهير التحفيظ)، والتقييدات فيه حجة على الغير (المادة 2 من مدونة الحقوق العينية)، والعقار المحفظ لا يكتسب بالحيازة (المادة 261).', fr: 'Le titre foncier est définitif et inattaquable (art. 62 du dahir sur l’immatriculation), ses inscriptions font foi à l’égard des tiers (art. 2 du code des droits réels), et un immeuble immatriculé ne s’acquiert pas par la possession (art. 261).'}
      first: buy
      facts:
        - {value: {ar: نهائي, fr: Définitif}, label: {ar: 'الرسم العقاري لا يقبل الطعن', fr: 'le titre foncier est inattaquable'}, cites: [/ma/code/land-registration/art_62]}
        - {value: {ar: '4 سنوات', fr: '4 ans'}, label: {ar: 'لدعوى المتضرر من تقييد بالتدليس أو الزور', fr: 'pour agir contre une inscription frauduleuse'}, cites: [/ma/loi/39-08/art_2]}
        - {value: {ar: لا حيازة, fr: 'Pas de possession'}, label: {ar: 'المحفظ لا يكتسب بالحيازة', fr: 'l’immatriculé ne s’acquiert pas en le possédant'}, cites: [/ma/loi/39-08/art_261]}
    - key: pending
      main: true
      label: {ar: فطور التحفيظ (عندها مطلب), fr: 'En cours d’immatriculation (réquisition)'}
      law: {ar: 'مطلب التحفيظ لا يسحب (الفصل 6)، ومن يدعي حقا يتعرض داخل شهرين من نشر الإعلان عن انتهاء التحديد (الفصلان 24 و27)، والحق الذي ينشأ أثناء المسطرة يودع بسجل التعرضات (الفصل 84).', fr: 'La réquisition ne se retire pas (art. 6) ; qui prétend un droit fait opposition dans les deux mois de la publication de l’avis de clôture du bornage (art. 24 et 27) ; un droit né pendant la procédure se dépose au registre des oppositions (art. 84).'}
      first: oppose
      facts:
        - {value: {ar: شهران, fr: '2 mois'}, label: {ar: 'للتعرض من نشر الإعلان عن انتهاء التحديد', fr: 'pour s’opposer après l’avis de clôture du bornage'}, cites: [/ma/code/land-registration/art_24, /ma/code/land-registration/art_27]}
        - {value: {ar: الإيداع, fr: 'Le dépôt'}, label: {ar: 'الحق الناشئ أثناء المسطرة يودع بسجل التعرضات', fr: 'un droit né pendant la procédure se dépose au registre'}, cites: [/ma/code/land-registration/art_84]}
        - {value: {ar: لا سحب, fr: 'Pas de retrait'}, label: {ar: 'مطلب التحفيظ المقدم لا يسحب', fr: 'la réquisition déposée ne se retire pas'}, cites: [/ma/code/land-registration/art_6]}
    - key: untitled
      main: true
      label: {ar: ماشي محفظة (ملكية أو عقد), fr: 'Non immatriculé (acte ou moulkiya)'}
      law: {ar: 'عقد التفويت لا يفيد ملكية العقار غير المحفظ إلا مع أصل التملك وحيازة مستوفية لشروطها (المادة 3)، وتكتسب الملكية بحيازة عشر سنوات بين الأجانب (المادة 250)، وكل بيع بمحرر رسمي (المادة 4).', fr: 'Un acte de cession ne donne la propriété d’un immeuble non immatriculé qu’avec l’origine de propriété et une possession qui remplit ses conditions (art. 3) ; dix ans de possession entre étrangers donnent la propriété (art. 250) ; toute vente par acte authentique (art. 4).'}
      first: held
      facts:
        - {value: {ar: '10 سنوات', fr: '10 ans'}, label: {ar: 'حيازة الأجنبي غير الشريك كتكسبو الملكية', fr: 'de possession font la propriété d’un tiers non copropriétaire'}, cites: [/ma/loi/39-08/art_250]}
        - {value: {ar: أصل التملك, fr: 'L’origine'}, label: {ar: 'بلا بيه وبلا حيازة، العقد ما كيفيدش الملكية', fr: 'sans elle et la possession, l’acte ne prouve pas la propriété'}, cites: [/ma/loi/39-08/art_3]}
        - {value: {ar: محرر رسمي, fr: 'Acte authentique'}, label: {ar: 'كل بيع ديال عقار، تحت طائلة البطلان', fr: 'pour toute vente d’immeuble, à peine de nullité'}, cites: [/ma/loi/39-08/art_4]}
    - key: collective
      main: true
      label: {ar: أرض الجموع (سلالية), fr: 'Terre collective (soulalia)'}
      law: {ar: 'أعضاء الجماعة السلالية، ذكورا وإناثا، ينتفعون بأملاكها (المادة 6 من القانون 62.17)؛ وهي لا تكتسب بالحيازة ولا بالتقادم ولا تفوت إلا كما يقول القانون (المادة 15)؛ والطعن في التوزيع داخل ثلاثين يوما (المادة 16).', fr: 'Les membres de la collectivité, hommes et femmes, jouissent de ses biens (art. 6 de la loi 62.17) ; ils ne s’acquièrent ni par possession ni par prescription et ne se cèdent que comme la loi le prévoit (art. 15) ; recours contre la répartition dans les trente jours (art. 16).'}
      first: collective
      facts:
        - {value: {ar: ذكورا وإناثا, fr: 'Hommes et femmes'}, label: {ar: 'أعضاء الجماعة كينتفعو بأملاكها', fr: 'les membres jouissent des biens de la collectivité'}, cites: [/ma/loi/62-17/art_6]}
        - {value: {ar: '30 يوما', fr: '30 jours'}, label: {ar: 'للطعن في مقرر توزيع الانتفاع', fr: 'pour contester la répartition de la jouissance'}, cites: [/ma/loi/62-17/art_16]}
        - {value: {ar: لا تقادم, fr: 'Pas de prescription'}, label: {ar: 'لا حيازة ولا تقادم ولا حجز', fr: 'ni possession, ni prescription, ni saisie'}, cites: [/ma/loi/62-17/art_15]}
    - key: unknown
      label: {ar: ما عرفتش, fr: 'Je ne sais pas'}
      law: {ar: 'الورقة اللي عندك كتقول: رقم رسم عقاري فهي محفظة، ورقم مطلب تحفيظ فهي فطور التحفيظ، وعقد أو ملكية عدلية بلا رقم فهي ماشي محفظة.', fr: 'Votre papier le dit : un numéro de titre foncier, il est immatriculé ; un numéro de réquisition, en cours ; un acte ou une moulkiya sans numéro, non immatriculé.'}
      first: register
      facts:
        - {value: {ar: رسم عقاري, fr: 'Titre foncier'}, label: {ar: 'رقم مكتوب فيه: الأرض محفظة', fr: 'un numéro de titre : immatriculé'}, cites: [/ma/code/land-registration/art_1]}
        - {value: {ar: مطلب, fr: 'Réquisition'}, label: {ar: 'رقم مطلب التحفيظ: فطور التحفيظ', fr: 'un numéro de réquisition : en cours'}, cites: [/ma/code/land-registration/art_13]}
        - {value: {ar: عقد أو ملكية, fr: 'Acte ou moulkiya'}, label: {ar: 'بلا رقم: ماشي محفظة', fr: 'sans numéro : non immatriculé'}, cites: [/ma/loi/39-08/art_3]}

