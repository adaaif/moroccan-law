# The land topic's journeys (the land review, M14): what happens to a plot, step by step, each step on the articles it
# rests on, with the limits as the texts set them. Written from law 39.08 (Adala, to 16 Jul 2026, with law 41.25), the
# land-registration dahir of 12 Aug 1913 (Adala), law 12.90 (SGG, 2016), law 25.90 (SGG, to 10 Aug 2026, with law
# 34.21), decree 2.18.577, law 7.81 and laws 62.17, 63.17 and 64.17, as the site holds them on 26 Oct 2026. A reader sees a
# journey once a person has checked it (`manage.py approve_topic land journeys/<key> --by …`). Steps say what the law
# says, never what a reader should do in their own case.

- key: buy
  for: [titled, pending, untitled, unknown]
  title: {ar: 'شراء أرض أو عقار: من الرسم العقاري إلى تقييد البيع', fr: 'Acheter un terrain ou un bien : du titre foncier à l’inscription de la vente'}
  lead:
    ar: 'في العقار المحفظ، ما قيد بالرسم العقاري هو الحجة، والبيع لا ينتج أي أثر ولو بين الطرفين إلا من تاريخ تقييده. وفي العقار غير المحفظ، لا يفيد عقد البيع الملكية إلا إذا استند إلى أصل التملك وحاز المشتري العقار حيازة مستوفية لشروطها. وفي الحالتين يحرر البيع والوعد بالبيع في محرر رسمي، تحت طائلة البطلان.'
    fr: 'Pour un immeuble immatriculé, ce qui est inscrit au titre foncier fait foi, et la vente ne produit aucun effet, même entre les parties, qu’à compter de son inscription. Pour un immeuble non immatriculé, l’acte de vente ne transfère la propriété que s’il s’appuie sur une origine de propriété et que l’acquéreur possède l’immeuble dans les conditions légales. Dans les deux cas, la vente et la promesse de vente sont faites par acte authentique, à peine de nullité.'
  steps:
    - title: {ar: 'ما يقوله الرسم العقاري', fr: 'Ce que dit le titre foncier'}
      answer: {ar: 'في العقار المحفظ، الرسم العقاري وتقييداته حجة على أن الشخص المقيد فيه هو صاحب الحقوق المبينة فيه، والمحافظ يسلم بيانا بما قيد فيه لمن يطلبه.', fr: 'Pour un immeuble immatriculé, le titre foncier et ses inscriptions prouvent que la personne inscrite est titulaire des droits qui y figurent ; le conservateur délivre sur demande un état de ce qui y est inscrit.'}
      body:
        ar: 'الرسم العقاري نهائي ولا يقبل الطعن، وهو نقطة الانطلاق الوحيدة للحقوق العينية والتحملات العقارية المترتبة على العقار وقت تحفيظه، دون ما عداها من الحقوق غير المقيدة. والرسوم العقارية وما تتضمنه من تقييدات تحفظ الحق الذي تنص عليه، وتكون حجة في مواجهة الغير على أن الشخص المعين بها هو صاحب الحقوق المبينة فيها. ويسلم المحافظ على الأملاك العقارية، عندما يطلب منه ذلك، بيانا عاما أو خاصا بما قيد بالرسم العقاري، ونسخا من الوثائق المودعة.'
        fr: 'Le titre foncier est définitif et inattaquable ; il est le point de départ unique des droits réels et charges foncières existant sur l’immeuble au jour de son immatriculation, à l’exclusion de tout droit non inscrit. Les titres fonciers et leurs inscriptions conservent le droit qu’ils mentionnent et font preuve, à l’égard des tiers, que la personne qui y est désignée est bien titulaire des droits indiqués. Le conservateur de la propriété foncière délivre, sur demande, un état général ou spécial de ce qui est inscrit au titre, et des copies des pièces déposées.'
      cites: [/ma/code/land-registration/art_62, /ma/loi/39-08/art_2, /ma/code/land-registration/art_61]
      tool: tools/before
      papers: checklists/before-buying
    - title: {ar: 'الرهون والحجوز والتقييدات الاحتياطية', fr: 'Hypothèques, saisies et prénotations'}
      answer: {ar: 'رهن أو حجز أو تقييد احتياطي مقيد بالرسم يتبع العقار: الحجز يمنع كل تقييد جديد أثناء البيع الجبري، والتقييد الاحتياطي يحفظ رتبة حق يدعيه شخص على العقار.', fr: 'Une hypothèque, une saisie ou une prénotation inscrite suit l’immeuble : la saisie bloque toute nouvelle inscription pendant la vente forcée, la prénotation réserve le rang d’un droit que quelqu’un revendique sur l’immeuble.'}
      body:
        ar: 'الرهن الرسمي حق عيني تبعي يتقرر على ملك محفظ أو في طور التحفيظ ويخصص لضمان أداء دين. وكل حجز أو إنذار بحجز عقاري يقيد بالرسم العقاري، وابتداء من تاريخ هذا التقييد لا يمكن إجراء أي تقييد جديد خلال جريان مسطرة البيع الجبري للعقار المحجوز. ولكل من يدعي حقا على عقار محفظ أن يطلب تقييدا احتياطيا للاحتفاظ به مؤقتا، وتاريخ التقييد الاحتياطي هو الذي يحدد رتبة التقييد اللاحق للحق المطلوب الاحتفاظ به. والدعاوى الرامية إلى استحقاق عقار محفظ أو إسقاط عقد منشئ أو مغير لحق عيني لا مفعول لها تجاه الغير إلا من تاريخ تقييدها احتياطيا بالرسم العقاري.'
        fr: 'L’hypothèque est un droit réel accessoire constitué sur un immeuble immatriculé ou en cours d’immatriculation pour garantir le paiement d’une dette. Toute saisie ou tout commandement de saisie immobilière est inscrit au titre foncier ; à compter de cette inscription, aucune nouvelle inscription ne peut être faite pendant la procédure de vente forcée. Quiconque prétend à un droit sur un immeuble immatriculé peut en demander la prénotation pour le conserver provisoirement ; la date de la prénotation fixe le rang de l’inscription ultérieure du droit. Les actions en revendication d’un immeuble immatriculé ou en annulation d’un acte créant ou modifiant un droit réel n’ont d’effet à l’égard des tiers qu’à compter de leur prénotation au titre.'
      cites: [/ma/loi/39-08/art_165, /ma/code/land-registration/art_87, /ma/code/land-registration/art_85, /ma/loi/39-08/art_13]
    - title: {ar: 'عقار في طور التحفيظ', fr: 'Un immeuble en cours d’immatriculation'}
      answer: {ar: 'من اشترى عقارا في طور التحفيظ يودع وثائقه بالمحافظة العقارية، فيقيد إيداعه بسجل التعرضات، ويقيد حقه بالرسم العقاري عند التحفيظ.', fr: 'Qui achète un immeuble en cours d’immatriculation dépose ses pièces à la conservation foncière ; le dépôt est porté au registre des oppositions et son droit est inscrit au titre lors de l’immatriculation.'}
      body:
        ar: 'إذا نشأ على عقار في طور التحفيظ حق خاضع للإشهار، أمكن لصاحبه، من أجل ترتيبه والتمسك به في مواجهة الغير، أن يودع بالمحافظة العقارية الوثائق اللازمة لذلك، ويقيد هذا الإيداع بسجل التعرضات، ثم يقيد الحق عند التحفيظ بالرسم العقاري في الرتبة التي عينت له إذا سمحت إجراءات المسطرة بذلك. ويمكن لصاحب الحق كذلك أن يطلب نشره بالجريدة الرسمية بعد إيداع الوثائق المثبتة له، فيكتسب صفة طالب التحفيظ في حدود الحق المعترف له به. وإذا كان الإعلان عن انتهاء التحديد قد نشر، يعاد نشره ليفتح أجل شهرين للتعرض على هذا الحق وحده.'
        fr: 'Lorsqu’un droit soumis à publicité naît sur un immeuble en cours d’immatriculation, son titulaire peut, pour le classer et l’opposer aux tiers, déposer les pièces nécessaires à la conservation foncière ; ce dépôt est porté au registre des oppositions et le droit est inscrit au titre, lors de l’immatriculation, au rang qui lui a été donné si la procédure le permet. Le titulaire peut aussi en demander la publication au Bulletin officiel après le dépôt des pièces qui le prouvent ; il acquiert alors la qualité de requérant dans la limite du droit reconnu. Si l’avis de clôture du bornage était déjà publié, il est publié à nouveau et ouvre un délai de deux mois d’opposition visant ce seul droit.'
      cites: [/ma/code/land-registration/art_84, /ma/code/land-registration/art_83]
      next: journeys/register
    - title: {ar: 'عقار غير محفظ', fr: 'Un immeuble non immatriculé'}
      answer: {ar: 'عقد البيع وحده لا يفيد ملكية العقار غير المحفظ: يلزم أن يستند إلى أصل التملك وأن يحوز المشتري العقار حيازة مستوفية لشروطها.', fr: 'L’acte de vente seul ne transfère pas la propriété d’un immeuble non immatriculé : il doit s’appuyer sur une origine de propriété et l’acquéreur doit posséder l’immeuble dans les conditions légales.'}
      body:
        ar: 'يترتب على الحيازة المستوفية للشروط القانونية اكتساب الحائز ملكية العقار غير المحفظ إلى أن يثبت العكس، ولا تفيد عقود التفويت ملكية العقارات غير المحفظة إلا إذا استندت على أصل التملك وحاز المفوت له العقار حيازة متوفرة على الشروط القانونية. ويشترط لصحة الحيازة أن يكون الحائز واضعا يده على الملك، متصرفا فيه تصرف المالك، ينسبه لنفسه والناس ينسبونه إليه، دون منازع، طول المدة المقررة في القانون. ولا تكتسب بالحيازة أملاك الدولة العامة والخاصة، ولا الأملاك المحبسة، ولا أملاك الجماعات السلالية، ولا أملاك الجماعات المحلية، ولا العقارات المحفظة.'
        fr: 'La possession remplissant les conditions légales fait acquérir au possesseur la propriété de l’immeuble non immatriculé jusqu’à preuve contraire ; les actes de cession ne transfèrent la propriété d’un immeuble non immatriculé que s’ils reposent sur une origine de propriété et que le cessionnaire possède l’immeuble dans les conditions légales. La possession suppose que le possesseur tienne le bien en main, en dispose comme un propriétaire, se l’attribue et que les gens le lui attribuent, sans contestation, pendant la durée fixée par la loi. Ne s’acquièrent pas par la possession : les biens publics et privés de l’État, les biens habous, les biens des collectivités ethniques (soulaliyates), ceux des collectivités locales et les immeubles immatriculés.'
      cites: [/ma/loi/39-08/art_3, /ma/loi/39-08/art_240, /ma/loi/39-08/art_261]
    - title: {ar: 'حصة في ملك مشاع', fr: 'Une part dans un bien indivis'}
      answer: {ar: 'من اشترى حصة شريك في ملك مشاع، يمكن لباقي الشركاء أخذها منه بالشفعة بثمنها ومصروفاتها؛ ويسقط حقهم بعد ثلاثين يوما كاملة من تبليغهم شخصيا بعقد الشراء.', fr: 'Qui achète la part d’un indivisaire s’expose au droit de préemption des autres, qui peuvent la reprendre pour son prix et ses frais ; leur droit s’éteint trente jours francs après qu’ils ont personnellement reçu notification de l’acte.'}
      body:
        ar: 'الشفعة أخذ شريك في ملك مشاع أو حق عيني مشاع حصة شريكه المبيعة بثمنها، بعد أداء الثمن ومصروفات العقد اللازمة والمصروفات الضرورية النافعة عند الاقتضاء. ويمكن للمشتري، بعد تقييد حقوقه في الرسم العقاري أو إيداعها في مطلب التحفيظ، أن يبلغ نسخة من عقد شرائه إلى من له حق الشفعة، ولا يصح التبليغ إلا إذا توصل به صاحب الحق شخصيا، ويسقط حقه إن لم يمارسه خلال ثلاثين يوما كاملة من التوصل. وإن لم يقع التبليغ، يسقط حق الشفعة بمضي سنة كاملة من تاريخ التقييد إذا كان العقار محفظا أو من الإيداع إذا كان في طور التحفيظ، وبمضي سنة على العلم بالبيع إن كان غير محفظ، وإذا لم يتحقق العلم فبمضي أربع سنوات من تاريخ العقد.'
        fr: 'La préemption est la reprise, par un indivisaire d’un bien ou d’un droit réel indivis, de la part vendue par son coïndivisaire, pour son prix, après paiement du prix, des frais nécessaires de l’acte et, le cas échéant, des impenses nécessaires et utiles. Après avoir inscrit ses droits au titre foncier ou les avoir déposés sur la réquisition, l’acquéreur peut notifier une copie de son acte à celui qui a le droit de préemption ; la notification ne vaut que reçue en personne, et le droit s’éteint s’il n’est pas exercé dans les trente jours francs de la réception. Sans notification, le droit s’éteint par une année pleine à compter de l’inscription (immeuble immatriculé) ou du dépôt (immeuble en cours d’immatriculation), par une année à compter de la connaissance de la vente (immeuble non immatriculé), et par quatre ans à compter de l’acte faute de connaissance.'
      cites: [/ma/loi/39-08/art_292, /ma/loi/39-08/art_304]
      delay: {days: 30, from: {ar: 'من توصل الشريك شخصيا بتبليغ عقد الشراء', fr: 'à compter de la réception personnelle de la notification de l’acte par l’indivisaire'}}
      tool: tools/clock?p=preempt
      next: journeys/preempt
    - title: {ar: 'العقد: محرر رسمي', fr: 'L’acte : un acte authentique'}
      answer: {ar: 'البيع والوعد بالبيع العقاري والوكالات الخاصة بهما تحرر بموجب محرر رسمي، تحت طائلة البطلان، ما لم ينص مقتضى خاص على خلاف ذلك.', fr: 'La vente, la promesse de vente immobilière et les procurations qui s’y rapportent sont faites par acte authentique, à peine de nullité, sauf disposition spéciale contraire.'}
      body:
        ar: 'يجب أن تحرر، تحت طائلة البطلان، جميع التصرفات المتعلقة بنقل ملكية العقار أو بإنشاء الحقوق العينية الأخرى أو نقلها أو تعديلها أو إسقاطها، والوعد بالبيع العقاري، وكذا الوكالات الخاصة بها، بموجب محرر رسمي، ما لم ينص مقتضى خاص على خلاف ذلك. وهذه هي الصيغة التي أعطاها القانون رقم 41.25 للمادة 4 منذ نشره في 16 يوليوز 2026، وكانت الصيغة السابقة تقبل كذلك محررا ثابت التاريخ يحرره محام مقبول للترافع أمام محكمة النقض. وغير القانون نفسه المادة 12 من قانون الملكية المشتركة، فصارت التصرفات المتعلقة بنقل الملكية المشتركة أو إنشاء حقوق عينية عليها تحرر بمحرر رسمي تحت طائلة البطلان، باستثناء العقارات التابعة للملك الخاص للدولة، وجعل عقد البيع الابتدائي للعقار في طور الإنجاز يرد في محرر رسمي تحت طائلة البطلان.'
        fr: 'Doivent être faits par acte authentique, à peine de nullité, tous les actes portant transfert de la propriété d’un immeuble ou constitution, transfert, modification ou extinction des autres droits réels, la promesse de vente immobilière et les procurations qui s’y rapportent, sauf disposition spéciale contraire. C’est la rédaction que la loi 41.25 a donnée à l’article 4 depuis sa publication le 16 juillet 2026 ; l’ancienne admettait aussi un acte à date certaine rédigé par un avocat agréé près la Cour de cassation. La même loi a modifié l’article 12 de la loi sur la copropriété : les actes portant transfert de la copropriété ou constitution de droits réels sur elle se font par acte authentique, à peine de nullité, sauf pour les immeubles du domaine privé de l’État ; et le contrat préliminaire de vente d’un immeuble en l’état futur d’achèvement est passé par acte authentique, à peine de nullité.'
      cites: [/ma/loi/39-08/art_4, /ma/loi/41-25/art_1, /ma/loi/41-25/art_2, /ma/loi/41-25/art_3]
    - title: {ar: 'نظير الرسم العقاري', fr: 'Le duplicata du titre foncier'}
      answer: {ar: 'الحق الذي يقتضي إنشاؤه موافقة المالك المقيد، كالبيع، لا يقيد إلا بالإدلاء بنظير الرسم العقاري الذي يحوزه هذا المالك.', fr: 'Un droit dont la constitution exige l’accord du propriétaire inscrit, comme une vente, n’est inscrit que sur présentation du duplicata du titre que détient ce propriétaire.'}
      body:
        ar: 'للمالك دون غيره الحق في أخذ نظير من الرسم العقاري ومن التصميم الملحق به، وفي حالة الشياع لا يسلم إلا نظير واحد للشريك المفوض له ذلك، ولباقي أصحاب الحقوق العينية شهادة خاصة بالتقييد. وإذا كان الطلب يتعلق بحق يقتضي إنشاؤه موافقة المالك المقيد والحائز لنظير الرسم العقاري، وجب على المحافظ أن يرفض التقييد عند عدم الإدلاء بالنظير. وكل ما ضمن بالرسم العقاري من تقييد أو بيان أو تقييد احتياطي يجب أن يضمن بنظيره.'
        fr: 'Le propriétaire seul a droit à un duplicata du titre foncier et du plan qui y est joint ; en indivision, un seul duplicata est remis à l’indivisaire mandaté, les autres titulaires de droits réels pouvant obtenir un certificat spécial d’inscription. Lorsque la demande porte sur un droit dont la constitution exige l’accord du propriétaire inscrit détenteur du duplicata, le conservateur doit refuser l’inscription si le duplicata n’est pas présenté. Toute inscription, mention ou prénotation portée au titre doit être reproduite sur le duplicata.'
      cites: [/ma/code/land-registration/art_58, /ma/code/land-registration/art_89, /ma/code/land-registration/art_88]
    - title: {ar: 'تقييد البيع بالرسم العقاري', fr: 'L’inscription de la vente au titre foncier'}
      answer: {ar: 'يقيد البيع بالرسم العقاري داخل ثلاثة أشهر من تاريخ تحرير المحرر الرسمي؛ وقبل التقييد لا ينتج البيع أي أثر ولو بين الطرفين.', fr: 'La vente est inscrite au titre foncier dans les trois mois de la date de l’acte authentique ; avant l’inscription, elle ne produit aucun effet, même entre les parties.'}
      body:
        ar: 'يجب أن تشهر بواسطة تقييد في الرسم العقاري جميع التصرفات والاتفاقات الناشئة بين الأحياء، مجانية كانت أو بعوض، متى كان موضوعها تأسيس حق عيني عقاري أو نقله أو تغييره أو إسقاطه. ويحدد أجل التقييد في ثلاثة أشهر، يسري بالنسبة للعقود الرسمية من تاريخ تحريرها، ولا يسري على العقود التي كانت موضوع تقييد احتياطي. وبعد انقضاء الأجل تترتب غرامة عن الشهر الأول، ثم 0,5 في المائة عن كل شهر أو جزء من شهر بعده، ويمكن لمدير الوكالة الوطنية للمحافظة العقارية الإعفاء منها في حالة القوة القاهرة. والأفعال الإرادية والاتفاقات التعاقدية الرامية إلى نقل حق عيني لا تنتج أي أثر ولو بين الأطراف إلا من تاريخ التقييد بالرسم العقاري، دون الإضرار بما لهم من دعاوى فيما بينهم بسبب عدم تنفيذ اتفاقاتهم.'
        fr: 'Doivent être publiés par une inscription au titre foncier tous les actes et conventions entre vifs, à titre gratuit ou onéreux, ayant pour objet de constituer, transférer, modifier ou éteindre un droit réel immobilier. L’inscription doit être faite dans les trois mois ; pour les actes authentiques, le délai court de leur date, et il ne court pas pour les actes qui ont fait l’objet d’une prénotation. Passé ce délai, une amende est due pour le premier mois, puis 0,5 % par mois ou fraction de mois suivant ; le directeur de l’Agence nationale de la conservation foncière peut en dispenser en cas de force majeure. Les actes volontaires et conventions tendant à transférer un droit réel ne produisent d’effet, même entre les parties, qu’à compter de leur inscription au titre, sans préjudice des actions que les parties ont entre elles pour inexécution.'
      cites: [/ma/code/land-registration/art_65, /ma/code/land-registration/art_65-bis, /ma/code/land-registration/art_67]
      delay: {months: 3, from: {ar: 'من تاريخ تحرير المحرر الرسمي', fr: 'à compter de la date de l’acte authentique'}}
      note:
        ar: 'تعتبر هوية كل طرف وصفته وأهليته محققة إذا استند طلب التقييد إلى محررات رسمية.'
        fr: 'L’identité, la qualité et la capacité de chaque partie sont tenues pour vérifiées lorsque la demande d’inscription repose sur des actes authentiques.'
        cites: [/ma/code/land-registration/art_73]
  ends: {office: registry, paper: {ar: 'نظير الرسم العقاري وقد نسخ فيه تقييد البيع باسم المشتري؛ وفي العقار غير المحفظ، المحرر الرسمي للبيع', fr: 'Le duplicata du titre foncier où l’inscription de la vente au nom de l’acheteur est reproduite ; pour un immeuble non immatriculé, l’acte authentique de vente'}, cites: [/ma/code/land-registration/art_60, /ma/loi/39-08/art_4]}
  next: [journeys/preempt, journeys/register, journeys/fraud]

- key: held
  for: [untitled, unknown]
  title: {ar: 'حزت أرضا سنين: الحيازة', fr: 'Une terre possédée depuis des années : la possession'}
  lead:
    ar: 'في الأرض غير المحفظة، تكسب الحيازة المستوفية لشروطها الحائز ملكية العقار إلى أن يثبت العكس. ومدتها عشر سنوات للأجنبي غير الشريك، وأربعون سنة بين الأقارب الذين ليس بينهم عداوة، ولا حيازة بين الشركاء. ولا تكسب بها أبدا الأرض المحفظة ولا أملاك الدولة والأحباس والجماعات السلالية والجماعات المحلية.'
    fr: 'Sur une terre non immatriculée, la possession qui remplit ses conditions rend le possesseur propriétaire, jusqu’à preuve du contraire. Elle dure dix ans pour un tiers non co-indivisaire et quarante ans entre parents sans inimitié ; il n’y a pas de possession entre co-indivisaires. Elle ne fait jamais acquérir une terre immatriculée, ni les biens de l’État, des Habous, des collectivités ethniques ou des collectivités locales.'
  steps:
    - title: {ar: 'ما هي الحيازة', fr: 'Ce qu’est la possession'}
      answer: {ar: 'السيطرة الفعلية على الملك بنية اكتسابه، وهي تكسب ملكية العقار غير المحفظ إذا استوفت شروطها.', fr: 'La maîtrise effective du bien avec l’intention de l’acquérir ; quand elle remplit ses conditions, elle fait acquérir la propriété d’un immeuble non immatriculé.'}
      body:
        ar: 'تقوم الحيازة الاستحقاقية على السيطرة الفعلية على الملك بنية اكتسابه، ولا تقوم لغير المغاربة مهما طال أمدها. ويترتب على الحيازة المستوفية للشروط القانونية اكتساب الحائز ملكية العقار غير المحفظ أو أي حق عيني آخر عليه، إلى أن يثبت العكس. ولا تفيد عقود التفويت ملكية العقار غير المحفظ إلا إذا استندت على أصل التملك وحاز المفوت له العقار حيازة مستوفية للشروط.'
        fr: 'La possession acquisitive repose sur la maîtrise effective du bien avec l’intention de l’acquérir ; elle ne vaut pas pour les non-Marocains, quelle que soit sa durée. La possession qui remplit les conditions légales fait acquérir au possesseur la propriété de l’immeuble non immatriculé ou de tout autre droit réel sur lui, jusqu’à preuve du contraire. Un acte de cession ne transfère la propriété d’un immeuble non immatriculé que s’il repose sur un titre d’origine et si le cessionnaire a possédé l’immeuble dans les conditions légales.'
      cites: [/ma/loi/39-08/art_239, /ma/loi/39-08/art_3, /ma/loi/39-08/art_260]
    - title: {ar: 'شروط الحيازة', fr: 'Les conditions de la possession'}
      answer: {ar: 'وضع اليد، والتصرف تصرف المالك، ونسبة الملك إلى الحائز، وعدم المنازعة، واستمرار الحيازة طول المدة.', fr: 'Avoir le bien en main, en user en propriétaire, se l’attribuer et se le voir attribuer, sans contestation, pendant toute la durée légale.'}
      body:
        ar: 'يشترط أن يكون الحائز واضعا يده على الملك، متصرفا فيه تصرف المالك، ينسبه لنفسه والناس ينسبونه إليه، وألا ينازعه فيه منازع، وأن تستمر الحيازة طول المدة المقررة؛ وإذا توفي الحائز اشترط أيضا عدم العلم بالتفويت. ولا تقوم الحيازة إذا بنيت على عمل غير مشروع. وإذا اقترنت بإكراه أو حصلت خفية أو كان فيها لبس، فلا أثر لها إلا من وقت زوال هذه العيوب، ولا أثر لها إذا كانت متقطعة؛ وتعتبر مستمرة إذا استغل الملك بكيفية اعتيادية ومنتظمة وبدون منازع.'
        fr: 'Le possesseur doit avoir le bien en main, en user comme un propriétaire, se l’attribuer et se le voir attribuer par les gens, sans que personne ne le lui conteste, pendant toute la durée légale ; si le possesseur est décédé, il faut en plus que la cession ne soit pas connue. La possession fondée sur un acte illicite n’existe pas. Entachée de violence, de clandestinité ou d’équivoque, elle ne produit effet qu’à partir de la disparition de ces vices, et elle n’en produit aucun si elle est interrompue ; elle est continue quand le bien est exploité de façon habituelle et régulière, sans contestation.'
      cites: [/ma/loi/39-08/art_240, /ma/loi/39-08/art_241, /ma/loi/39-08/art_245]
    - title: {ar: 'المدة', fr: 'La durée'}
      answer: {ar: 'عشر سنوات كاملة للأجنبي غير الشريك؛ وبين الأقارب غير الشركاء أربعون سنة، أو عشر سنوات إذا كانت بينهم عداوة.', fr: 'Dix années complètes pour un tiers non co-indivisaire ; entre parents non co-indivisaires, quarante ans, ou dix ans s’il y a inimitié entre eux.'}
      body:
        ar: 'إذا حاز أجنبي غير شريك ملكا حيازة مستوفية لشروطها، واستمرت دون انقطاع عشر سنوات كاملة والقائم حاضر عالم ساكت بلا مانع ولا عذر، فإنه يكتسب بحيازته ملكية العقار. وتكون المدة بين الأقارب غير الشركاء الذين ليس بينهم عداوة أربعين سنة، وعشر سنوات إذا كانت بينهم عداوة. وتحسب مدة الحيازة كاملة، ولا يجوز تعديلها بالزيادة أو بالنقصان، وكل اتفاق على ذلك باطل.'
        fr: 'Le tiers non co-indivisaire qui possède un bien dans les conditions légales, sans interruption pendant dix années complètes, le titulaire étant présent, informé et silencieux sans empêchement ni excuse, en acquiert la propriété. Entre parents non co-indivisaires sans inimitié, la durée est de quarante ans, et de dix ans s’il y a inimitié entre eux. La durée se compte en années complètes et ne peut être allongée ni raccourcie ; tout accord en ce sens est nul.'
      cites: [/ma/loi/39-08/art_250, /ma/loi/39-08/art_251, /ma/loi/39-08/art_259]
    - title: {ar: 'متى لا تقوم الحيازة', fr: 'Quand il n’y a pas de possession'}
      answer: {ar: 'لا حيازة بين الشركاء مطلقا، ولا بين الآباء والأبناء، ولا بين الأزواج، ولا بين الوكيل وموكله.', fr: 'Pas de possession entre co-indivisaires, jamais, ni entre parents et enfants, entre époux ou entre mandataire et mandant.'}
      body:
        ar: 'لا محل للحيازة بين الأب وابنه وإن سفل، ولا بين الأم وأبنائها وإن سفلوا، ولا بين الأزواج أثناء قيام الزوجية، ولا بين الشركاء مطلقا، ولا بين النائب الشرعي ومن هم إلى نظره، ولا بين الوكيل وموكله، ولا بين المكلف بإدارة الأموال العقارية وأصحابها. ولا يعتد بالحيازة إذا كان المحوز عليه فاقد الأهلية أو ناقصها بلا نائب شرعي، أو غائبا غيبة طويلة متواصلة، أو منعه من المطالبة بحقه مانع قوي كالخوف من حائز ذي سلطة، أو ظروف تجعل المطالبة مستحيلة. ولا تقوم الحيازة إذا ثبت أن أصل مدخل الحائز غير ناقل للملكية، ولا يحق له أن يغير بنفسه سبب وضع يده.'
        fr: 'Il n’y a pas de possession entre le père et ses descendants, entre la mère et ses descendants, entre époux pendant le mariage, entre co-indivisaires en aucun cas, entre le représentant légal et ceux qu’il représente, entre le mandataire et son mandant, ni entre le gérant de biens immobiliers et leurs propriétaires. La possession ne compte pas si le propriétaire est incapable sans représentant légal, absent de façon longue et continue, empêché d’agir par une contrainte sérieuse comme la crainte d’un possesseur puissant, ou placé dans l’impossibilité d’agir. Elle n’existe pas non plus s’il est prouvé que le possesseur est entré par un titre qui ne transfère pas la propriété, et il ne peut changer de lui-même la cause de sa détention.'
      cites: [/ma/loi/39-08/art_255, /ma/loi/39-08/art_256, /ma/loi/39-08/art_246]
    - title: {ar: 'حساب المدة', fr: 'Le calcul de la durée'}
      answer: {ar: 'تبدأ المدة من وضع اليد بنية التملك، وتجمع مدد الحيازات المتعاقبة، وتنقطع بفقد الحيازة أو برفع دعوى أو بالإقرار.', fr: 'La durée court de la prise en main avec l’intention d’acquérir, les possessions successives s’additionnent, et elle s’interrompt par la perte de la possession, une action en justice ou une reconnaissance.'}
      body:
        ar: 'تبدأ مدة الحيازة من تاريخ وضع الحائز يده على الملك بنية تملكه، وفي حالة توالي التفويتات من تاريخ بداية حيازة أول مفوت، وتجمع مدد الحيازات المتعاقبة. وتنقطع المدة إذا فقد الحائز حيازته أو تخلى عنها، أو رفعت ضده دعوى إلا إذا رفضتها المحكمة موضوعا أو وقع التنازل عنها، أو أقر بصحة دعوى المحوز عليه؛ وتبدأ مدة جديدة من تاريخ زوال سبب الانقطاع.'
        fr: 'La durée de la possession court du jour où le possesseur a pris le bien en main avec l’intention de l’acquérir et, en cas de cessions successives, du début de la possession du premier cédant ; les possessions successives s’additionnent. Elle est interrompue si le possesseur perd ou abandonne la possession, si une action est intentée contre lui, sauf rejet au fond ou désistement, ou s’il reconnaît le bien-fondé de la demande du propriétaire ; une nouvelle durée court alors de la fin de la cause d’interruption.'
      cites: [/ma/loi/39-08/art_253, /ma/loi/39-08/art_254, /ma/loi/39-08/art_257]
    - title: {ar: 'ما لا يكتسب بالحيازة', fr: 'Ce que la possession ne fait jamais acquérir'}
      answer: {ar: 'الأرض المحفظة، وأملاك الدولة، والأحباس، وأملاك الجماعات السلالية، وأملاك الجماعات المحلية.', fr: 'La terre immatriculée, les biens de l’État, les Habous, les terres des collectivités ethniques et les biens des collectivités locales.'}
      body:
        ar: 'لا تكتسب بالحيازة أملاك الدولة العامة والخاصة، ولا الأملاك المحبسة، ولا أملاك الجماعات السلالية، ولا أملاك الجماعات المحلية، ولا العقارات المحفظة، ولا الأملاك الأخرى المنصوص عليها صراحة في القانون. ولا يكسب التقادم أي حق عيني على العقار المحفظ في مواجهة المالك المقيد، ولا يسقط أي حق مقيد بالرسم العقاري.'
        fr: 'Ne s’acquièrent pas par la possession : le domaine public et privé de l’État, les biens Habous, les biens des collectivités ethniques, les biens des collectivités locales, les immeubles immatriculés, et les autres biens que la loi exclut expressément. La prescription ne fait acquérir aucun droit réel sur un immeuble immatriculé contre le propriétaire inscrit, et n’éteint aucun droit inscrit sur le titre foncier.'
      cites: [/ma/loi/39-08/art_261, /ma/code/land-registration/art_63]
      next: journeys/collective
    - title: {ar: 'إثبات الحيازة والتحفيظ', fr: 'Prouver la possession et immatriculer'}
      answer: {ar: 'من أثبت حيازة مستوفية لشروطها وقدم مطلبا لتحفيظ الأرض يعتبر حائزا حيازة قانونية إلى أن يثبت العكس.', fr: 'Celui qui prouve une possession conforme à ses conditions et dépose une réquisition d’immatriculation est tenu pour possesseur légal jusqu’à preuve du contraire.'}
      body:
        ar: 'من أثبت أنه يحوز ملكا حيازة مستوفية لشروطها وأدرج مطلبا لتحفيظه، يعتبر حائزا حيازة قانونية إلى أن يثبت العكس. ولا يكلف الحائز ببيان وجه مدخله إلا إذا أدلى المدعي بحجة على دعواه. وإذا تعارضت الحجج ولم يمكن الجمع بينها، عمل بقواعد الترجيح، ومنها: ذكر سبب الملك مقدم على عدم بيانه، وبينة الملك مقدمة على بينة الحوز، والبينة المؤرخة مقدمة على غير المؤرخة، والسابقة تاريخا على اللاحقة.'
        fr: 'Celui qui prouve qu’il possède un bien dans les conditions légales et en a requis l’immatriculation est tenu pour possesseur légal jusqu’à preuve du contraire. Le possesseur n’a pas à dire comment il est entré en possession, sauf si le demandeur produit une preuve à l’appui de sa demande. Quand des preuves se contredisent et ne peuvent se concilier, des règles de préférence s’appliquent, dont : la preuve qui indique la cause de la propriété l’emporte sur celle qui ne l’indique pas, la preuve de propriété sur celle de possession, la preuve datée sur celle qui ne l’est pas, la plus ancienne sur la plus récente.'
      cites: [/ma/loi/39-08/art_263, /ma/loi/39-08/art_242, /ma/loi/39-08/art_3]
      next: journeys/register
  ends: {office: registry, paper: {ar: 'مطلب التحفيظ، ومعه أصول أو نسخ رسمية للرسوم والعقود والوثائق التي تعرف بحق الملكية', fr: 'La réquisition d’immatriculation, avec les originaux ou copies officielles des titres, actes et documents qui établissent la propriété'}, cites: [/ma/loi/39-08/art_263, /ma/code/land-registration/art_13, /ma/code/land-registration/art_14]}
  next: [journeys/register, journeys/oppose, journeys/inherit]

- key: register
  for: [untitled, pending]
  title: {ar: 'تحفيظ أرض: من المطلب إلى الرسم العقاري', fr: 'Immatriculer un terrain : de la réquisition au titre foncier'}
  lead:
    ar: 'التحفيظ اختياري، لكن مطلب التحفيظ لا يمكن سحبه بعد تقديمه، ويكون إجباريا في مناطق تفتح بقرار. وتمر المسطرة بالنشر في الجريدة الرسمية، ثم التحديد في عين المكان، ثم أجل للتعرض. وفي آخرها رسم عقاري نهائي لا يقبل الطعن.'
    fr: 'L’immatriculation est facultative, mais une réquisition déposée ne peut plus être retirée ; elle est obligatoire dans les zones ouvertes par arrêté. La procédure passe par la publication au Bulletin officiel, le bornage sur place, puis un délai d’opposition. Elle aboutit à un titre foncier définitif et inattaquable.'
  steps:
    - title: {ar: 'من يطلب التحفيظ', fr: 'Qui peut requérir l’immatriculation'}
      answer: {ar: 'المالك، أو الشريك في الملك مع حفظ حق الشفعة لشركائه، أو صاحب أحد الحقوق العينية التي يعددها القانون؛ ولا يسحب المطلب بعد تقديمه.', fr: 'Le propriétaire, l’indivisaire (sous réserve du droit de préemption de ses coïndivisaires) ou le titulaire de l’un des droits réels énumérés par la loi ; une réquisition déposée ne peut être retirée.'}
      body:
        ar: 'التحفيظ أمر اختياري، غير أنه إذا قدم مطلب للتحفيظ فإنه لا يمكن سحبه مطلقا. ويكون إجباريا في الحالات المنصوص عليها في قوانين خاصة، وفي المناطق التي تفتح لهذه الغاية بقرار من الوزير الوصي على الوكالة الوطنية للمحافظة العقارية، وتدرج المطالب فيها مجانا. ولا يقدم مطلب التحفيظ إلا من المالك، أو الشريك في الملك مع الاحتفاظ بحق الشفعة لشركائه، أو المتمتع بحق الانتفاع أو السطحية أو الكراء الطويل الأمد أو الزينة أو الهواء والتعلية أو الحبس، أو المتمتع بارتفاق عقاري بعد موافقة صاحب الملك.'
        fr: 'L’immatriculation est facultative ; toutefois, une réquisition déposée ne peut jamais être retirée. Elle est obligatoire dans les cas prévus par des lois spéciales et dans les zones ouvertes à cet effet par arrêté du ministre de tutelle de l’Agence nationale de la conservation foncière, où les réquisitions sont déposées gratuitement. Seuls peuvent la requérir le propriétaire, l’indivisaire sous réserve du droit de préemption de ses coïndivisaires, le titulaire d’un droit d’usufruit, de superficie, d’emphytéose, de zina, de hawa et tâlia ou de habous, et le titulaire d’une servitude foncière avec l’accord du propriétaire.'
      cites: [/ma/code/land-registration/art_6, /ma/code/land-registration/art_7, /ma/code/land-registration/art_10]
      note:
        ar: 'في منطقة التحفيظ الإجباري، تحرر المطالب أثناء البحث التجزيئي باسم المالكين الذين أدلوا بوثائقهم، وتنجز السلطة المحلية شهادات إدارية للملكية لمن لا وثائق لهم أو وثائقهم غير كافية؛ والقطع التي لم يتعرف على مالكيها تدرج مطالبها تلقائيا في اسم الملك الخاص للدولة. وتقبل التعرضات هناك داخل أربعة أشهر من نشر الإعلان عن إيداع اللائحة والتصميم التجزيئيين في الجريدة الرسمية.'
        fr: 'Dans une zone d’immatriculation d’ensemble, l’enquête parcellaire établit les réquisitions au nom des propriétaires qui ont produit leurs titres ; l’autorité locale délivre des attestations administratives de propriété à ceux qui n’ont pas de titres ou des titres insuffisants ; les parcelles dont le propriétaire n’a pas été identifié sont requises d’office au nom du domaine privé de l’État. Les oppositions y sont reçues dans les quatre mois de la publication au Bulletin officiel de l’avis de dépôt de la liste et du plan parcellaires.'
        cites: [/ma/code/land-registration/art_6-51, /ma/code/land-registration/art_7-51, /ma/code/land-registration/art_16-51]
    - title: {ar: 'مطلب التحفيظ ووثائقه', fr: 'La réquisition et ses pièces'}
      answer: {ar: 'يقدم مطلب موقع للمحافظ على الأملاك العقارية مقابل وصل فوري، مع أصول أو نسخ رسمية للرسوم التي تعرف بحق الملكية.', fr: 'Une réquisition signée est déposée chez le conservateur contre un récépissé immédiat, avec les originaux ou copies officielles des titres qui établissent la propriété.'}
      body:
        ar: 'يقدم طالب التحفيظ للمحافظ على الأملاك العقارية، مقابل وصل يسلم له فورا، مطلبا موقعا منه أو ممن ينوب عنه بوكالة صحيحة، يتضمن هويته وحالته المدنية، وموطنا مختارا في دائرة المحافظة، ووصف العقار ببناءاته وأغراسه وموقعه ومساحته وحدوده وأسماء المجاورين، وبيان حيازته له، وتقدير قيمته التجارية، والحقوق العينية المترتبة عليه وأصحابها، وأصل التملك. ويرفق به أصول أو نسخ رسمية للرسوم والعقود والوثائق التي تعرف بحق الملكية وبالحقوق العينية المترتبة على الملك. ومصاريف التحفيظ على طالبه.'
        fr: 'Le requérant remet au conservateur de la propriété foncière, contre récépissé immédiat, une réquisition signée par lui ou par un mandataire muni d’une procuration régulière, indiquant son identité et son état civil, un domicile élu dans le ressort de la conservation, la description de l’immeuble (constructions, plantations, situation, superficie, limites, noms des riverains), sa possession, la valeur vénale estimée, les droits réels qui le grèvent et leurs titulaires, et l’origine de propriété. Il y joint les originaux ou copies officielles des titres, actes et documents établissant la propriété et les droits réels. Les frais d’immatriculation sont à la charge du requérant.'
      cites: [/ma/code/land-registration/art_13, /ma/code/land-registration/art_14, /ma/code/land-registration/art_51]
    - title: {ar: 'النشر والإعلان عن التحديد', fr: 'La publication et l’avis de bornage'}
      answer: {ar: 'داخل عشرة أيام من الإيداع ينشر ملخص المطلب في الجريدة الرسمية، وداخل شهرين من هذا النشر يحرر إعلان بتاريخ التحديد ووقته.', fr: 'Dans les dix jours du dépôt, un extrait de la réquisition est publié au Bulletin officiel ; dans les deux mois de cette publication, un avis fixe la date et l’heure du bornage.'}
      body:
        ar: 'يحرر المحافظ على الأملاك العقارية داخل أجل عشرة أيام من إيداع مطلب التحفيظ ملخصا له ينشره في الجريدة الرسمية ويبلغ مضمونه إلى علم العموم بالوسائل المتاحة، ثم يحرر داخل شهرين من تاريخ النشر إعلانا يضمنه تاريخ ووقت التحديد. ويوجه نسخا منهما، قبل تاريخ التحديد بعشرين يوما، إلى رئيس المحكمة الابتدائية وممثل السلطة المحلية ورئيس المجلس الجماعي، فيعلقها كل منهم في مقر إدارته إلى يوم التحديد. ويشهر ممثل السلطة المحلية كذلك ملخص المطلب وتاريخ التحديد في الأسواق الواقعة في دائرة نفوذه.'
        fr: 'Dans les dix jours du dépôt de la réquisition, le conservateur en rédige un extrait qu’il publie au Bulletin officiel et porte à la connaissance du public par les moyens disponibles ; dans les deux mois de cette publication, il rédige un avis fixant la date et l’heure du bornage. Vingt jours avant le bornage, il en adresse copie au président du tribunal de première instance, au représentant de l’autorité locale et au président du conseil communal, qui l’affichent chacun à leur siège jusqu’au jour du bornage. L’autorité locale les fait aussi connaître dans les souks de son ressort.'
      cites: [/ma/code/land-registration/art_17, /ma/code/land-registration/art_18]
      delay: {days: 10, from: {ar: 'من إيداع مطلب التحفيظ (لنشر الملخص)', fr: 'à compter du dépôt de la réquisition (pour publier l’extrait)'}}
    - title: {ar: 'التحديد', fr: 'Le bornage'}
      answer: {ar: 'مهندس مساح طبوغرافي محلف ينتدبه المحافظ يحدد العقار بحضور طالب التحفيظ والمجاورين، ويضع الأنصاب، ويحرر محضرا.', fr: 'Un ingénieur géomètre-topographe assermenté désigné par le conservateur borne l’immeuble en présence du requérant et des riverains, pose les bornes et dresse un procès-verbal.'}
      body:
        ar: 'يسير المحافظ عمليات التحديد وينتدب لها مهندسا مساحا طبوغرافيا محلفا، ويستدعي طالب التحفيظ والمجاورين المبينين في المطلب والمتدخلين وأصحاب الحقوق المصرح بهم. ويستفسر المهندس الحاضرين، ويبين طالب التحفيظ حدود العقار ويبدي المجاورون ملاحظاتهم ومنازعاتهم، ويعاين المهندس واقع الحيازة ومدتها وحالة العقار، ويضع الأنصاب وتصميما مؤقتا للتحديد. ثم يحرر محضرا يذكر فيه الحاضرين وتصريحاتهم والأنصاب والحدود والوثائق المدلى بها والاتفاقات التي تمت، ويوقعه هو والأطراف الحاضرة.'
        fr: 'Le conservateur dirige le bornage et désigne à cet effet un ingénieur géomètre-topographe assermenté ; il convoque le requérant, les riverains indiqués dans la réquisition, les intervenants et les titulaires de droits déclarés. Le géomètre interroge les présents ; le requérant indique les limites, les riverains font leurs observations et contestations ; le géomètre constate la possession et sa durée et l’état de l’immeuble, pose les bornes et dresse un plan provisoire de bornage. Il rédige un procès-verbal mentionnant les présents et leurs déclarations, les bornes, les limites, les pièces produites et les accords intervenus, signé par lui et les parties présentes.'
      cites: [/ma/code/land-registration/art_19, /ma/code/land-registration/art_20, /ma/code/land-registration/art_21]
      note:
        ar: 'إذا غاب طالب التحفيظ عن التحديد لم ينجز، ويعتبر المطلب لاغيا إذا لم يدل بعذر مقبول داخل شهر من توصله بالإنذار؛ ويعتبر لاغيا كذلك إذا تعذر التحديد مرتين متتاليتين بسبب نزاع حول الملك.'
        fr: 'Si le requérant est absent, le bornage n’a pas lieu, et la réquisition est réputée nulle s’il ne justifie pas d’une excuse valable dans le mois de la réception de la mise en demeure ; elle l’est aussi si le bornage n’a pu être fait deux fois de suite en raison d’un litige sur le bien.'
        cites: [/ma/code/land-registration/art_22, /ma/code/land-registration/art_23]
    - title: {ar: 'أجل التعرض', fr: 'Le délai d’opposition'}
      answer: {ar: 'بعد التحديد ينشر إعلان عن انتهائه في الجريدة الرسمية، ومن يوم نشره يبدأ أجل شهرين للتعرض.', fr: 'Après le bornage, un avis de clôture est publié au Bulletin officiel ; le délai d’opposition de deux mois court du jour de cette publication.'}
      body:
        ar: 'إذا أنجز التحديد، ينشر المحافظ ويعلق إعلانا يتضمن أن التعرضات تقدم لدى المحافظة العقارية خلال شهرين ابتداء من يوم نشره بالجريدة الرسمية، وينشر هذا الإعلان داخل أربعة أشهر على الأكثر من التحديد النهائي، ويعاد نشره في حالة تحديد تكميلي يمدد حدود العقار. ولكل من يدعي حقا على العقار أن يتعرض خلال هذا الأجل، ولا يقبل أي تعرض بعده إلا بصفة استثنائية.'
        fr: 'Une fois le bornage fait, le conservateur publie et affiche un avis indiquant que les oppositions sont reçues à la conservation foncière dans les deux mois de sa publication au Bulletin officiel ; cet avis est publié au plus tard dans les quatre mois du bornage définitif, et publié à nouveau en cas de bornage complémentaire étendant les limites. Quiconque prétend à un droit sur l’immeuble peut faire opposition dans ce délai ; passé ce délai, aucune opposition n’est reçue, sauf à titre exceptionnel.'
      cites: [/ma/code/land-registration/art_23, /ma/code/land-registration/art_24, /ma/code/land-registration/art_27]
      delay: {months: 2, from: {ar: 'من نشر الإعلان عن انتهاء التحديد في الجريدة الرسمية', fr: 'à compter de la publication de l’avis de clôture du bornage au Bulletin officiel'}}
      tool: tools/clock?p=oppose
      next: journeys/oppose
    - title: {ar: 'إذا لم يقع تعرض أو رفع', fr: 'Sans opposition, ou une fois levée'}
      answer: {ar: 'خلال الأشهر الثلاثة الموالية لانتهاء أجل التعرض، يحفظ المحافظ العقار إذا لم يقع تعرض وكانت الحجج كافية.', fr: 'Dans les trois mois qui suivent la fin du délai d’opposition, le conservateur immatricule l’immeuble s’il n’y a pas eu d’opposition et que les titres suffisent.'}
      body:
        ar: 'خلال الأشهر الثلاثة الموالية لانصرام أجل التعرض يحفظ المحافظ العقار، بعد التحقق من إنجاز جميع الإجراءات ومن شرعية الطلب وكفاية الحجج وعدم وقوع أي تعرض. وإذا وقعت تعرضات بلغ نسختها فورا إلى طالب التحفيظ، الذي يمكنه قبل انصرام الشهر الموالي لانتهاء أجل التعرض أن يثبت رفعها أو يصرح بقبولها، فيباشر المحافظ التحفيظ. وإلا أمكن للمحافظ أن يجزئ المطلب ويؤسس رسما للجزء الذي لا يشمله النزاع بعد تحديد تكميلي، وأن يعمل على تصالح الأطراف في محضر تكون لاتفاقاتهم فيه قوة الالتزام العرفي.'
        fr: 'Dans les trois mois qui suivent l’expiration du délai d’opposition, le conservateur immatricule l’immeuble après avoir vérifié l’accomplissement de toutes les formalités, la régularité de la demande, la suffisance des titres et l’absence d’opposition. S’il y a des oppositions, il en notifie aussitôt copie au requérant, qui peut, avant la fin du mois suivant l’expiration du délai d’opposition, en justifier la mainlevée ou y acquiescer ; le conservateur procède alors à l’immatriculation. Sinon, il peut scinder la réquisition et fonder un titre pour la partie non litigieuse après un bornage complémentaire, et tenter de concilier les parties dans un procès-verbal dont les accords ont la force d’un engagement sous seing privé.'
      cites: [/ma/code/land-registration/art_30, /ma/code/land-registration/art_31]
    - title: {ar: 'إذا بقيت التعرضات: المحكمة', fr: 'Si les oppositions subsistent : le tribunal'}
      answer: {ar: 'يحيل المحافظ المطلب إلى المحكمة الابتدائية، فتبت في حقوق المتعرضين وحدها، ثم يعود الملف إلى المحافظ ليقبل التحفيظ أو يرفضه.', fr: 'Le conservateur transmet la réquisition au tribunal de première instance, qui statue sur les seuls droits des opposants ; le dossier revient ensuite au conservateur, qui accepte ou rejette l’immatriculation.'}
      body:
        ar: 'خلال الأشهر الثلاثة الموالية لانصرام أجل التعرض، يوجه المحافظ مطلب التحفيظ ووثائقه إلى المحكمة الابتدائية التي يقع العقار بدائرتها. وتبت المحكمة في وجود الحق المدعى به من قبل المتعرضين وطبيعته ومشتملاته ونطاقه، وتحيل الأطراف بعد اكتساب الحكم قوة الشيء المقضي به على المحافظ، الذي له وحده النظر في قبول مطلب التحفيظ أو رفضه كلا أو بعضا. وقرار المحافظ برفض مطلب التحفيظ يكون معللا ويبلغ لطالب التحفيظ، ويقبل الطعن أمام المحكمة الابتدائية مع الحق في الاستئناف ثم النقض.'
        fr: 'Dans les trois mois qui suivent l’expiration du délai d’opposition, le conservateur transmet la réquisition et ses pièces au tribunal de première instance de la situation de l’immeuble. Le tribunal statue sur l’existence, la nature, la consistance et l’étendue du droit invoqué par les opposants et, une fois le jugement passé en force de chose jugée, renvoie les parties devant le conservateur, seul compétent pour accepter ou rejeter la réquisition en tout ou en partie. La décision de rejet du conservateur est motivée et notifiée au requérant ; elle peut être contestée devant le tribunal de première instance, avec appel puis pourvoi en cassation.'
      cites: [/ma/code/land-registration/art_32, /ma/code/land-registration/art_37, /ma/code/land-registration/art_37-bis]
    - title: {ar: 'الرسم العقاري', fr: 'Le titre foncier'}
      answer: {ar: 'يؤسس المحافظ رسما عقاريا برقم واسم خاص، وهو نهائي لا يقبل الطعن، ولا يكسب التقادم أي حق ضد المالك المقيد.', fr: 'Le conservateur fonde un titre foncier, avec un numéro et un nom propres ; il est définitif et inattaquable, et la prescription ne fait acquérir aucun droit contre le propriétaire inscrit.'}
      body:
        ar: 'كل تحفيظ يقتضي تأسيس رسم عقاري يتضمن وصفا مفصلا للعقار وحدوده ومساحته، وهوية المالك، وفي حالة الشياع نصيب كل شريك، والحقوق العينية المترتبة عليه، ويحمل رقما ترتيبيا واسما خاصا ويبقى تصميم العقار ملحقا به. والرسم العقاري نهائي ولا يقبل الطعن، ويعتبر نقطة الانطلاق الوحيدة للحقوق العينية والتحملات المترتبة على العقار وقت تحفيظه، دون ما عداها من الحقوق غير المقيدة. والتقادم لا يكسب أي حق عيني على العقار المحفظ في مواجهة المالك المقيد، ولا يسقط أي حق مقيد بالرسم العقاري.'
        fr: 'Toute immatriculation donne lieu à un titre foncier comprenant la description détaillée de l’immeuble, ses limites et sa superficie, l’identité du propriétaire et, en indivision, la part de chacun, ainsi que les droits réels qui le grèvent ; il porte un numéro d’ordre et un nom propre, et le plan de l’immeuble y reste annexé. Le titre foncier est définitif et inattaquable ; il est le point de départ unique des droits réels et charges foncières existant au jour de l’immatriculation, à l’exclusion de tout droit non inscrit. La prescription ne fait acquérir aucun droit réel sur l’immeuble immatriculé contre le propriétaire inscrit et n’éteint aucun droit inscrit.'
      cites: [/ma/code/land-registration/art_52, /ma/code/land-registration/art_62, /ma/code/land-registration/art_63]
  ends: {office: registry, paper: {ar: 'الرسم العقاري، ونظير منه ومن تصميمه يسلم للمالك', fr: 'Le titre foncier, et le duplicata du titre et de son plan remis au propriétaire'}, cites: [/ma/code/land-registration/art_52, /ma/code/land-registration/art_58]}
  next: [journeys/oppose, journeys/buy, journeys/fraud]

- key: oppose
  for: [titled, pending, untitled, unknown]
  title: {ar: 'التعرض على مطلب تحفيظ أرض فيها حق', fr: 'Faire opposition à une réquisition qui touche votre droit'}
  lead:
    ar: 'لكل من يدعي حقا على عقار طلب تحفيظه أن يتعرض خلال شهرين من يوم نشر الإعلان عن انتهاء التحديد في الجريدة الرسمية. ويودع المتعرض وثائقه ويؤدي الرسوم في الشهر الموالي، وإلا اعتبر تعرضه لاغيا. وإذا بقي التعرض، فصلت فيه المحكمة الابتدائية.'
    fr: 'Quiconque prétend à un droit sur un immeuble dont l’immatriculation est requise peut faire opposition dans les deux mois de la publication au Bulletin officiel de l’avis de clôture du bornage. L’opposant dépose ses pièces et paie les droits dans le mois suivant, faute de quoi l’opposition est réputée nulle. Si l’opposition subsiste, le tribunal de première instance tranche.'
  day: {ar: 'متى نشر الإعلان عن انتهاء التحديد في الجريدة الرسمية؟', fr: 'Quand l’avis de clôture du bornage a-t-il été publié au Bulletin officiel ?'}
  steps:
    - title: {ar: 'من يتعرض وعلى ماذا', fr: 'Qui peut s’opposer, et sur quoi'}
      answer: {ar: 'كل من ينازع في ملكية طالب التحفيظ أو مداها أو حدود العقار، أو يدعي حقا عينيا قابلا للتقييد عليه.', fr: 'Quiconque conteste la propriété du requérant, son étendue ou les limites de l’immeuble, ou revendique sur lui un droit réel susceptible d’inscription.'}
      body:
        ar: 'يمكن لكل شخص يدعي حقا على عقار تم طلب تحفيظه أن يتدخل عن طريق التعرض في مسطرة التحفيظ: في حالة المنازعة في وجود حق الملكية لطالب التحفيظ أو في مداه أو بشأن حدود العقار، أو الادعاء باستحقاق حق عيني قابل للتقييد بالرسم العقاري الذي سيؤسس، أو المنازعة في حق أعلن عنه أثناء المسطرة. ومن يتعرض باسم غيره يثبت هويته وصفته بوثائق صحيحة، ويدلي برسوم الإراثة إذا تعلق الأمر بشركاء في الإرث. ويمكن أن يتعرض باسم القاصرين والمحجورين والغائبين والمفقودين أوصياؤهم وممثلوهم الشرعيون ووكيل الملك والقاضي المكلف بشؤون القاصرين.'
        fr: 'Toute personne qui prétend à un droit sur un immeuble dont l’immatriculation est requise peut intervenir par opposition : pour contester l’existence ou l’étendue du droit de propriété du requérant ou les limites de l’immeuble, pour revendiquer un droit réel susceptible d’être inscrit au futur titre, ou pour contester un droit publié en cours de procédure. Qui s’oppose au nom d’autrui justifie de son identité et de sa qualité par des pièces régulières, et produit les actes d’hérédité s’il s’agit de cohéritiers. Les tuteurs et représentants légaux, le procureur du Roi et le juge des mineurs peuvent faire opposition au nom des mineurs, interdits, absents et disparus.'
      cites: [/ma/code/land-registration/art_24, /ma/code/land-registration/art_26]
    - title: {ar: 'الأجل: شهران', fr: 'Le délai : deux mois'}
      answer: {ar: 'شهران كاملان يبدآن من يوم نشر الإعلان عن انتهاء التحديد في الجريدة الرسمية؛ وبعدهما لا يقبل التعرض إلا بصفة استثنائية.', fr: 'Deux mois francs à compter de la publication de l’avis de clôture du bornage au Bulletin officiel ; ensuite, l’opposition n’est reçue qu’à titre exceptionnel.'}
      body:
        ar: 'يقدم التعرض خلال أجل شهرين يبتدئ من يوم نشر الإعلان عن انتهاء التحديد في الجريدة الرسمية، إن لم يكن المتعرض قد قام به من قبل، ولا يقبل أي تعرض بعد انصرام هذا الأجل، باستثناء ما ينص عليه الفصل 29. وجميع الآجال في ظهير التحفيظ العقاري آجال كاملة، تحسب وفق الفصل 512 من قانون المسطرة المدنية.'
        fr: 'L’opposition est faite dans les deux mois qui suivent la publication au Bulletin officiel de l’avis de clôture du bornage, si l’opposant ne l’a pas faite plus tôt ; passé ce délai, aucune opposition n’est reçue, hormis le cas de l’article 29. Tous les délais du dahir sur l’immatriculation foncière sont francs et se comptent selon l’article 512 du Code de procédure civile.'
      cites: [/ma/code/land-registration/art_24, /ma/code/land-registration/art_27, /ma/code/land-registration/art_107]
      delay: {on_day: true, months: 2, from: {ar: 'من يوم نشر الإعلان عن انتهاء التحديد في الجريدة الرسمية', fr: 'à compter de la publication de l’avis de clôture du bornage au Bulletin officiel'}}
      tool: tools/clock?p=oppose
      note:
        ar: 'في منطقة التحفيظ الإجباري، تقبل التعرضات داخل أربعة أشهر من نشر الإعلان عن إيداع اللائحة والتصميم التجزيئيين في الجريدة الرسمية، ولا يقبل أي تعرض بعدها.'
        fr: 'Dans une zone d’immatriculation d’ensemble, les oppositions sont reçues dans les quatre mois de la publication au Bulletin officiel de l’avis de dépôt de la liste et du plan parcellaires, et aucune n’est reçue ensuite.'
        cites: [/ma/code/land-registration/art_16-51, /ma/code/land-registration/art_18-51]
    - title: {ar: 'كيف يقدم التعرض', fr: 'Comment former l’opposition'}
      answer: {ar: 'بتصريح كتابي أو شفوي للمحافظ على الأملاك العقارية، أو للمهندس المساح أثناء التحديد، يبين المتعرض فيه هويته ورقم المطلب والحق المتنازع فيه وسنداته.', fr: 'Par déclaration écrite ou orale au conservateur de la propriété foncière, ou au géomètre pendant le bornage, indiquant l’identité de l’opposant, le numéro de la réquisition, le droit contesté et ses titres.'}
      body:
        ar: 'تقدم التعرضات بتصريح كتابي أو شفوي، إما للمحافظ على الأملاك العقارية وإما للمهندس المساح الطبوغرافي المنتدب أثناء التحديد. وتضمن التصريحات الشفوية، بحضور المتعرض، في محضر من نسختين تسلم إليه إحداهما. ويبين التصريح هوية المتعرض وحالته المدنية وعنوانه الحقيقي أو المختار، واسم الملك، ورقم مطلب التحفيظ، وطبيعة الحق المتنازع فيه ومداه، والسندات والوثائق المدعمة له. ويضمن المحافظ التعرضات في سجل التعرضات، وإذا تعلق التعرض بجزء من العقار لم يحدد بكيفية صحيحة أثناء التحديد، باشر هذا التحديد على نفقة المتعرض.'
        fr: 'Les oppositions se font par déclaration écrite ou orale, soit au conservateur de la propriété foncière, soit au géomètre-topographe désigné pendant le bornage. Les déclarations orales sont consignées, en présence de l’opposant, dans un procès-verbal en deux exemplaires dont l’un lui est remis. La déclaration indique l’identité, l’état civil et l’adresse réelle ou élue de l’opposant, le nom de la propriété, le numéro de la réquisition, la nature et l’étendue du droit contesté, et les titres et pièces à l’appui. Le conservateur porte les oppositions au registre des oppositions ; si l’opposition ne vise qu’une partie de l’immeuble qui n’a pu être correctement délimitée au bornage, ce bornage se fait aux frais de l’opposant.'
      cites: [/ma/code/land-registration/art_25]
    - title: {ar: 'الوثائق والرسوم، وإلا فالتعرض لاغ', fr: 'Pièces et droits, ou l’opposition tombe'}
      answer: {ar: 'قبل انصرام الشهر الموالي لانتهاء أجل التعرض، يودع المتعرض وثائقه ويؤدي الرسوم القضائية وحقوق المرافعة، أو يثبت المساعدة القضائية؛ وإلا اعتبر تعرضه لاغيا.', fr: 'Avant la fin du mois qui suit l’expiration du délai d’opposition, l’opposant dépose ses pièces et paie les taxes judiciaires et droits de plaidoirie, ou justifie de l’assistance judiciaire ; sinon l’opposition est réputée nulle.'}
      body:
        ar: 'يجب على المتعرضين أن يودعوا السندات والوثائق المثبتة لهويتهم والمدعمة لتعرضهم، ويؤدوا الرسوم القضائية وحقوق المرافعة أو يدلوا بما يفيد حصولهم على المساعدة القضائية، قبل انصرام الشهر الموالي لانتهاء أجل التعرض. ويعتبر التعرض لاغيا وكأن لم يكن إذا لم يقع ذلك. وتؤدى الرسوم عن كل تعرض على حدة وتستخلصها المحافظة العقارية لفائدة كتابة الضبط بالمحكمة الابتدائية، ولا تؤدى عن التعرضات المتبادلة بين مطلبين متداخلين.'
        fr: 'Les opposants doivent déposer les titres et pièces établissant leur identité et fondant leur opposition, et payer les taxes judiciaires et droits de plaidoirie ou justifier de l’assistance judiciaire, avant l’expiration du mois qui suit la fin du délai d’opposition. À défaut, l’opposition est réputée nulle et non avenue. Les droits sont dus pour chaque opposition et perçus par la conservation foncière pour le compte du greffe du tribunal de première instance ; ils ne sont pas dus pour les oppositions réciproques entre deux réquisitions qui se chevauchent.'
      cites: [/ma/code/land-registration/art_25, /ma/code/land-registration/art_32]
      delay: {on_day: true, months: 3, from: {ar: 'من نشر الإعلان: شهرا التعرض ثم الشهر الموالي لهما', fr: 'à compter de la publication de l’avis : les deux mois d’opposition puis le mois suivant'}}
    - title: {ar: 'بعد فوات الأجل', fr: 'Après l’expiration du délai'}
      answer: {ar: 'يمكن للمحافظ أن يقبل التعرض بصفة استثنائية ما دام الملف لم يوجه إلى المحكمة، وقراره بالرفض لا يقبل الطعن.', fr: 'Le conservateur peut recevoir l’opposition à titre exceptionnel tant que le dossier n’a pas été transmis au tribunal ; son refus n’est susceptible d’aucun recours.'}
      body:
        ar: 'بعد انصرام أجل التعرض، يمكن أن يقبل المحافظ على الأملاك العقارية التعرض بصفة استثنائية، ولو لم يرد على المطلب أي تعرض سابق، شريطة ألا يكون الملف قد وجه إلى المحكمة الابتدائية. ويدلي المتعرض بالوثائق المبينة للأسباب التي منعته من التعرض داخل الأجل، وبالعقود والوثائق المدعمة لتعرضه، ويؤدي الرسوم القضائية وحقوق المرافعة أو يثبت حصوله على المساعدة القضائية. وقرار المحافظ برفض التعرض غير قابل للطعن القضائي.'
        fr: 'Après l’expiration du délai d’opposition, le conservateur peut, à titre exceptionnel, recevoir une opposition, même si la réquisition n’en a reçu aucune, à condition que le dossier n’ait pas été transmis au tribunal de première instance. L’opposant produit les pièces justifiant ce qui l’a empêché de s’opposer dans le délai, et les actes et documents à l’appui de son opposition, et paie les taxes judiciaires et droits de plaidoirie ou justifie de l’assistance judiciaire. La décision du conservateur qui rejette l’opposition n’est susceptible d’aucun recours judiciaire.'
      cites: [/ma/code/land-registration/art_29]
      note:
        ar: 'بعد تأسيس الرسم العقاري لا يمكن إقامة أي دعوى في العقار بسبب حق وقع الإضرار به من جراء التحفيظ؛ ولا يبقى للمتضرر، في حالة التدليس فقط، إلا دعوى شخصية بالتعويض على مرتكب التدليس.'
        fr: 'Une fois le titre foncier fondé, aucune action ne peut être exercée sur l’immeuble à raison d’un droit lésé par l’immatriculation ; il ne reste à la personne lésée, en cas de dol seulement, qu’une action personnelle en dommages-intérêts contre l’auteur du dol.'
        cites: [/ma/code/land-registration/art_62, /ma/code/land-registration/art_64]
    - title: {ar: 'جواب طالب التحفيظ والصلح', fr: 'La réponse du requérant et la conciliation'}
      answer: {ar: 'يبلغ التعرض لطالب التحفيظ، فإما يثبت رفعه أو يقبله في الشهر الموالي لانتهاء الأجل، وإما يمكن للمحافظ أن يصالح الأطراف قبل إحالة الملف.', fr: 'L’opposition est notifiée au requérant, qui en justifie la mainlevée ou l’accepte dans le mois suivant la fin du délai ; sinon le conservateur peut concilier les parties avant de transmettre le dossier.'}
      body:
        ar: 'إذا وقعت تعرضات، بلغ المحافظ فورا نسخة من مضمونها إلى طالب التحفيظ، الذي يمكنه قبل انصرام الشهر الموالي لانتهاء أجل التعرض أن يدلي بما يثبت رفعها أو يصرح بقبولها. وإذا لم يتمكن من ذلك، أمكن للمحافظ أن يجزئ المطلب ويؤسس رسما عقاريا للجزء الذي لا يشمله النزاع بعد تحديد تكميلي. ويمكن للمحافظ، أثناء جريان المسطرة وقبل توجيه الملف إلى المحكمة، أن يعمل على تصالح الأطراف ويحرر محضرا بالصلح يوقعونه، تكون لاتفاقاتهم فيه قوة الالتزام العرفي.'
        fr: 'S’il y a des oppositions, le conservateur en notifie aussitôt copie au requérant, qui peut, avant la fin du mois qui suit l’expiration du délai d’opposition, en justifier la mainlevée ou déclarer y acquiescer. À défaut, le conservateur peut scinder la réquisition et fonder un titre pour la partie non litigieuse après un bornage complémentaire. En cours de procédure et avant la transmission au tribunal, il peut tenter de concilier les parties et dresser un procès-verbal de conciliation signé par elles, dont les accords ont la force d’un engagement sous seing privé.'
      cites: [/ma/code/land-registration/art_31]
    - title: {ar: 'أمام المحكمة الابتدائية', fr: 'Devant le tribunal de première instance'}
      answer: {ar: 'تبت المحكمة في وجود الحق الذي يدعيه المتعرض وطبيعته ونطاقه، وتبين حدود الأجزاء المحكوم بها له ومساحتها.', fr: 'Le tribunal statue sur l’existence, la nature et l’étendue du droit invoqué par l’opposant, et fixe les limites et la superficie des parties qui lui sont reconnues.'}
      body:
        ar: 'خلال الأشهر الثلاثة الموالية لانصرام أجل التعرض، يوجه المحافظ المطلب ووثائقه إلى المحكمة الابتدائية التي يقع العقار بدائرتها. ويعين رئيسها قاضيا مقررا يمكنه أن ينتقل إلى عين العقار ويطبق الرسوم ويستمع إلى الشهود، ويخبر الأطراف بيوم الجلسة قبل موعدها بثمانية أيام على الأقل. وتبت المحكمة في وجود الحق المدعى به من قبل المتعرضين وطبيعته ومشتملاته ونطاقه، وتبين حدود ومساحة الأجزاء المحكوم بها لهم، ثم تحيل الأطراف، بعد اكتساب الحكم قوة الشيء المقضي به، على المحافظ الذي له وحده النظر في قبول مطلب التحفيظ أو رفضه.'
        fr: 'Dans les trois mois qui suivent l’expiration du délai d’opposition, le conservateur transmet la réquisition et ses pièces au tribunal de première instance de la situation de l’immeuble. Son président désigne un juge rapporteur, qui peut se transporter sur les lieux, y appliquer les titres et entendre des témoins, et qui avise les parties de l’audience au moins huit jours à l’avance. Le tribunal statue sur l’existence, la nature, la consistance et l’étendue du droit invoqué par les opposants, fixe les limites et la superficie des parties qui leur sont reconnues, puis, le jugement passé en force de chose jugée, renvoie les parties devant le conservateur, seul compétent pour accepter ou rejeter la réquisition.'
      cites: [/ma/code/land-registration/art_32, /ma/code/land-registration/art_34, /ma/code/land-registration/art_37]
    - title: {ar: 'بعد الحكم: الطعن والغرامة', fr: 'Après le jugement : recours et amende'}
      answer: {ar: 'يقبل الحكم الاستئناف مهما كانت قيمة العقار ثم النقض؛ والتعرض الكيدي أو بسوء نية يوجب غرامة لا تقل عن عشرة في المائة من قيمة العقار أو الحق.', fr: 'Le jugement est susceptible d’appel quelle que soit la valeur de l’immeuble, puis de cassation ; une opposition abusive ou de mauvaise foi entraîne une amende d’au moins 10 % de la valeur de l’immeuble ou du droit.'}
      body:
        ar: 'يبلغ ملخص الحكم إلى طالب التحفيظ وجميع المتعرضين قبل انصرام ثمانية أيام من صدوره، ويمكن استئنافه داخل الأجل المحدد في قانون المسطرة المدنية، ويقبل الاستئناف في موضوع التحفيظ مهما كانت قيمة العقار. ويمكن الطعن في القرار الاستئنافي بالنقض. وكل طلب للتحفيظ أو تعرض عليه ثبت للمحكمة صدوره عن تعسف أو كيد أو سوء نية يوجب ضد صاحبه غرامة لفائدة الوكالة الوطنية للمحافظة العقارية لا تقل عن عشرة في المائة من قيمة العقار أو الحق المدعى به، دون المساس بحق المتضررين في التعويض. ومصاريف التعرض على الطرف الذي خسر الدعوى.'
        fr: 'Un extrait du jugement est notifié au requérant et à tous les opposants dans les huit jours de son prononcé ; il peut être frappé d’appel dans le délai du Code de procédure civile, et l’appel est recevable en matière d’immatriculation quelle que soit la valeur de l’immeuble. L’arrêt d’appel peut faire l’objet d’un pourvoi en cassation. Toute réquisition ou opposition dont le tribunal constate le caractère abusif, vexatoire ou de mauvaise foi entraîne contre son auteur une amende au profit de l’Agence nationale de la conservation foncière d’au moins 10 % de la valeur de l’immeuble ou du droit revendiqué, sans préjudice des dommages-intérêts des parties lésées. Les frais de l’opposition sont à la charge de la partie qui perd.'
      cites: [/ma/code/land-registration/art_40, /ma/code/land-registration/art_41, /ma/code/land-registration/art_47, /ma/code/land-registration/art_48, /ma/code/land-registration/art_51]
  ends: {office: court, paper: {ar: 'الحكم في التعرض بعد اكتسابه قوة الشيء المقضي به، يحال به الأطراف على المحافظ على الأملاك العقارية', fr: 'Le jugement sur l’opposition, passé en force de chose jugée, avec lequel les parties sont renvoyées devant le conservateur'}, cites: [/ma/code/land-registration/art_37]}
  next: [journeys/register, journeys/fraud]

- key: fraud
  for: [titled]
  title: {ar: 'تقييد بالرسم العقاري بالتدليس أو الزور', fr: 'Une inscription au titre foncier obtenue par dol ou par faux'}
  lead:
    ar: 'ما قيد بالرسم العقاري حجة في مواجهة الغير، وإبطاله لا يمكن التمسك به في مواجهة من قيد حقه بعده عن حسن نية. ويستثنى من ذلك صاحب الحق الذي تضرر بسبب تدليس أو زور أو استعماله، بشرط أن يرفع دعواه داخل أربع سنوات من تاريخ التقييد المطلوب إبطاله.'
    fr: 'Ce qui est inscrit au titre foncier fait foi à l’égard des tiers, et son annulation ne peut être opposée à celui qui a inscrit son droit de bonne foi. Il en va autrement pour le titulaire du droit lésé par un dol, un faux ou l’usage d’un faux, à condition qu’il agisse dans les quatre ans de la date de l’inscription dont il demande l’annulation.'
  day: {ar: 'متى قُيّد هذا التقييد بالرسم العقاري؟', fr: 'Quand cette inscription a-t-elle été portée au titre foncier ?'}
  steps:
    - title: {ar: 'ما يثبته الرسم العقاري', fr: 'Ce que prouve le titre foncier'}
      answer: {ar: 'الشخص المقيد في الرسم العقاري يعتبر في مواجهة الغير صاحب الحقوق المبينة فيه، والحق غير المقيد غير موجود بالنسبة للغير.', fr: 'À l’égard des tiers, la personne inscrite au titre est tenue pour titulaire des droits qui y figurent, et un droit non inscrit n’existe pas pour eux.'}
      body:
        ar: 'الرسوم العقارية وما تتضمنه من تقييدات تحفظ الحق الذي تنص عليه، وتكون حجة في مواجهة الغير على أن الشخص المعين بها هو صاحب الحقوق المبينة فيها. وكل حق عيني متعلق بعقار محفظ يعتبر غير موجود بالنسبة للغير إلا بتقييده، وابتداء من يوم تقييده. ولا يمكن في أي حال التمسك بإبطال هذا التقييد في مواجهة الغير ذي النية الحسنة.'
        fr: 'Les titres fonciers et leurs inscriptions conservent le droit qu’ils mentionnent et font preuve, à l’égard des tiers, que la personne qui y est désignée est titulaire des droits indiqués. Tout droit réel relatif à un immeuble immatriculé n’existe à l’égard des tiers que par son inscription et à compter du jour de celle-ci. L’annulation de cette inscription ne peut en aucun cas être opposée au tiers de bonne foi.'
      cites: [/ma/loi/39-08/art_2, /ma/code/land-registration/art_66]
    - title: {ar: 'النظير في يد المالك', fr: 'Le duplicata entre les mains du propriétaire'}
      answer: {ar: 'التقييد الذي يقتضي موافقة المالك المقيد يرفض إذا لم يدل بنظير الرسم العقاري؛ وضياع النظير أو سرقته يصرح به للمحافظ.', fr: 'Une inscription qui exige l’accord du propriétaire inscrit est refusée sans le duplicata du titre ; la perte ou le vol du duplicata se déclare au conservateur.'}
      body:
        ar: 'إذا كان الطلب يتعلق بحق يقتضي إنشاؤه موافقة المالك المقيد والحائز لنظير الرسم العقاري، وجب على المحافظ أن يرفض التقييد عند عدم الإدلاء بالنظير. وفي حالة ضياع نظير الرسم العقاري أو سرقته أو تلفه، يقدم صاحبه للمحافظ الوثائق المثبتة وتصريحا بهويته وظروف الحادث وكل ما لديه من معلومات عنه. ويمكن للمحافظ، إذا ظهر له صدق التصريح، أن يسلم نظيرا جديدا بعد انصرام خمسة عشر يوما من نشر إعلان بذلك في الجريدة الرسمية. ويتحقق المحافظ، تحت مسؤوليته، من هوية المفوت وأهليته ومن صحة الوثائق المدلى بها شكلا وجوهرا.'
        fr: 'Lorsque la demande porte sur un droit dont la constitution exige l’accord du propriétaire inscrit détenteur du duplicata, le conservateur doit refuser l’inscription si le duplicata n’est pas présenté. En cas de perte, de vol ou de destruction du duplicata, son titulaire remet au conservateur les pièces justificatives et une déclaration indiquant son identité, les circonstances et tout ce qu’il sait de l’incident. Si la déclaration lui paraît sincère, le conservateur peut délivrer un nouveau duplicata quinze jours après la publication d’un avis au Bulletin officiel. Le conservateur vérifie, sous sa responsabilité, l’identité et la capacité du cédant et la validité, en la forme et au fond, des pièces produites.'
      cites: [/ma/code/land-registration/art_89, /ma/code/land-registration/art_101, /ma/code/land-registration/art_72]
    - title: {ar: 'أربع سنوات من تاريخ التقييد', fr: 'Quatre ans à compter de l’inscription'}
      answer: {ar: 'من تضرر بسبب تدليس أو زور أو استعماله، يرفع دعواه داخل أربع سنوات من تاريخ التقييد المطلوب إبطاله أو تغييره أو التشطيب عليه.', fr: 'Qui a été lésé par un dol, un faux ou l’usage d’un faux agit dans les quatre ans de la date de l’inscription dont il demande l’annulation, la modification ou la radiation.'}
      body:
        ar: 'ما يقع على التقييدات من إبطال أو تغيير أو تشطيب من الرسم العقاري لا يمكن التمسك به في مواجهة الغير المقيد عن حسن نية، ولا يمكن أن يلحق به أي ضرر، إلا إذا كان صاحب الحق قد تضرر بسبب تدليس أو زور أو استعماله، شريطة أن يرفع الدعوى للمطالبة بحقه داخل أجل أربع سنوات من تاريخ التقييد المطلوب إبطاله أو تغييره أو التشطيب عليه. وكل دعوى ترمي إلى استحقاق أو حماية حق عيني واقع على عقار تعتبر دعوى عينية عقارية.'
        fr: 'L’annulation, la modification ou la radiation d’une inscription au titre foncier ne peut être opposée au tiers inscrit de bonne foi, ni lui porter préjudice, sauf si le titulaire du droit a été lésé par un dol, un faux ou l’usage d’un faux, à condition qu’il agisse en justice dans les quatre ans de la date de l’inscription dont il demande l’annulation, la modification ou la radiation. Toute action tendant à revendiquer ou protéger un droit réel sur un immeuble est une action réelle immobilière.'
      cites: [/ma/loi/39-08/art_2, /ma/loi/39-08/art_12]
      delay: {on_day: true, months: 48, from: {ar: 'من تاريخ التقييد المطلوب إبطاله', fr: 'à compter de la date de l’inscription contestée'}}
      tool: tools/clock?p=fraud
    - title: {ar: 'التقييد الاحتياطي لحفظ الحق', fr: 'La prénotation pour conserver le droit'}
      answer: {ar: 'لمن يدعي حقا على عقار محفظ أن يطلب تقييدا احتياطيا؛ ودعوى الاستحقاق أو الإبطال لا مفعول لها تجاه الغير إلا من تاريخ هذا التقييد.', fr: 'Qui prétend à un droit sur un immeuble immatriculé peut en demander la prénotation ; l’action en revendication ou en annulation n’a d’effet à l’égard des tiers qu’à compter de cette prénotation.'}
      body:
        ar: 'يمكن لكل من يدعي حقا على عقار محفظ أن يطلب تقييدا احتياطيا للاحتفاظ به مؤقتا، ويضمنه المحافظ بالرسم العقاري إما بناء على سند يثبت حقا يتعذر تقييده على حالته، وإما بناء على أمر من رئيس المحكمة الابتدائية التي يقع العقار في دائرة نفوذها، وإما بناء على نسخة من مقال دعوى في الموضوع مرفوعة أمام القضاء. وتاريخ التقييد الاحتياطي هو الذي يحدد رتبة التقييد اللاحق للحق. والدعاوى الرامية إلى استحقاق عقار محفظ أو إسقاط عقد منشئ أو مغير لحق عيني لا مفعول لها تجاه الغير إلا من تاريخ تقييدها احتياطيا بالرسم العقاري.'
        fr: 'Quiconque prétend à un droit sur un immeuble immatriculé peut en demander la prénotation pour le conserver provisoirement ; le conservateur la porte au titre soit sur la base d’un titre établissant un droit qu’il ne peut inscrire en l’état, soit sur ordonnance du président du tribunal de première instance de la situation de l’immeuble, soit sur copie d’une requête introductive d’une action au fond. La date de la prénotation fixe le rang de l’inscription ultérieure du droit. Les actions en revendication d’un immeuble immatriculé ou en annulation d’un acte créant ou modifiant un droit réel n’ont d’effet à l’égard des tiers qu’à compter de leur prénotation au titre.'
      cites: [/ma/code/land-registration/art_85, /ma/loi/39-08/art_13]
    - title: {ar: 'مدة التقييد الاحتياطي', fr: 'La durée de la prénotation'}
      answer: {ar: 'عشرة أيام على سند، وشهر على نسخة مقال الدعوى ثم يشطب عليه ما لم يدل بأمر من رئيس المحكمة؛ والأمر يحفظه ثلاثة أشهر قابلة للتمديد إلى الحكم النهائي.', fr: 'Dix jours sur titre, un mois sur copie de la requête, puis radiation d’office sauf ordonnance du président ; l’ordonnance la maintient trois mois, prorogeables jusqu’au jugement définitif.'}
      body:
        ar: 'مدة صلاحية التقييد الاحتياطي بناء على سند عشرة أيام، لا يقبل خلالها أي تقييد آخر لحق يقتضي إنشاؤه موافقة الأطراف. ومدة صلاحيته بناء على نسخة من مقال دعوى في الموضوع شهر واحد، يشطب عليه بعده تلقائيا ما لم يدل الطالب بأمر من رئيس المحكمة الابتدائية. ومفعول التقييد الاحتياطي بأمر من رئيس المحكمة ثلاثة أشهر من تاريخ صدوره، قابلة للتمديد بأمر منه شريطة تقديم دعوى في الموضوع، ويستمر التمديد إلى حين صدور حكم نهائي. ولا يصدر الرئيس الأمر إلا بعد تأكده من جدية الطلب، ولا يقدم الطالب طلبا جديدا بناء على نفس الأسباب. ومن قدم طلب التقييد الاحتياطي بصفة تعسفية أو كيدية أو عن سوء نية تحكم عليه المحكمة تلقائيا بغرامة مدنية لا تقل عن عشرة في المائة من قيمة العقار أو الحق المدعى به.'
        fr: 'La prénotation sur titre vaut dix jours, pendant lesquels aucune autre inscription d’un droit exigeant l’accord des parties n’est reçue. La prénotation sur copie d’une requête au fond vaut un mois ; elle est ensuite radiée d’office, sauf si le requérant produit une ordonnance du président du tribunal de première instance. La prénotation sur ordonnance vaut trois mois à compter de sa date, prorogeables par ordonnance du président à condition qu’une action au fond soit introduite, la prorogation durant jusqu’au jugement définitif. Le président ne rend l’ordonnance qu’après s’être assuré du sérieux de la demande, et le demandeur ne peut renouveler sa demande pour les mêmes motifs. Une prénotation demandée de façon abusive, vexatoire ou de mauvaise foi expose son auteur à une amende civile, prononcée d’office, d’au moins 10 % de la valeur de l’immeuble ou du droit revendiqué.'
      cites: [/ma/code/land-registration/art_86, /ma/code/land-registration/art_86-bis]
      delay: {months: 1, from: {ar: 'من التقييد الاحتياطي بناء على نسخة مقال الدعوى', fr: 'à compter de la prénotation sur copie de la requête'}}
    - title: {ar: 'التشطيب على التقييد', fr: 'La radiation de l’inscription'}
      answer: {ar: 'يشطب على التقييد بمقتضى حكم مكتسب لقوة الشيء المقضي به يثبت انعدام الحق، بطلب مؤرخ وموقع للمحافظ؛ ورفضه معلل وقابل للطعن.', fr: 'L’inscription est radiée sur la base d’un jugement passé en force de chose jugée établissant l’inexistence du droit, par une demande datée et signée au conservateur ; son refus est motivé et susceptible de recours.'}
      body:
        ar: 'يمكن أن يشطب على كل ما ضمن بالرسم العقاري من تقييد أو بيان أو تقييد احتياطي بمقتضى كل عقد أو حكم مكتسب لقوة الشيء المقضي به يثبت انعدام أو انقضاء الحق موضوع التضمين، في مواجهة الأشخاص الذين يعنيهم هذا الحق. ويقدم طالب التشطيب للمحافظ طلبا مؤرخا وموقعا يبين رقم الرسم العقاري، والتقييد المطلوب التشطيب عليه، وسبب التشطيب ونوع وتاريخ السند المثبت له. وإذا رفض المحافظ التقييد أو التشطيب وجب عليه أن يعلل قراره ويبلغه للمعني بالأمر، ويقبل قراره الطعن أمام المحكمة الابتدائية مع الحق في الاستئناف ثم النقض.'
        fr: 'Toute inscription, mention ou prénotation portée au titre peut être radiée en vertu de tout acte ou jugement passé en force de chose jugée établissant l’inexistence ou l’extinction du droit inscrit, à l’égard des personnes que ce droit concerne. Le demandeur remet au conservateur une demande datée et signée indiquant le numéro du titre, l’inscription à radier, la cause de la radiation et la nature et la date du titre qui l’établit. Lorsque le conservateur refuse une inscription ou une radiation, il motive sa décision et la notifie à l’intéressé ; elle peut être contestée devant le tribunal de première instance, avec appel puis pourvoi en cassation.'
      cites: [/ma/code/land-registration/art_91, /ma/code/land-registration/art_93, /ma/code/land-registration/art_96]
    - title: {ar: 'الزور جريمة', fr: 'Le faux est une infraction'}
      answer: {ar: 'تطبق أحكام القانون الجنائي على من زور رسما عقاريا أو نظيره أو شهادة، أو استعملها، أو زور محررا قدم للتقييد أو التشطيب.', fr: 'Le Code pénal s’applique à qui falsifie un titre foncier, son duplicata ou un certificat, ou en fait usage, ou commet un faux dans un acte présenté pour une inscription ou une radiation.'}
      body:
        ar: 'تطبق أحكام القانون الجنائي على من يقوم عن علم وبقصد جلب ربح غير مشروع لشخص آخر بتزوير أو تزييف أو تحريف الرسوم العقارية أو نظائرها أو القوائم أو الشهادات التي سلمها المحافظ، أو يستعمل مستندات مزورة على هذه الكيفية. وتطبق كذلك على من يقترف زورا في المحررات المقدمة بقصد التقييد أو التشطيب، بتزييف أو تحريف كتابات أو توقيعات، أو بخلق أشخاص وهميين، أو باصطناع اتفاقات أو تصرفات أو إبراءات، أو بإضافة أو تزييف شروط أو تصريحات أو وقائع بعد تحرير تلك المحررات.'
        fr: 'Les dispositions du Code pénal s’appliquent à quiconque, sciemment et pour procurer à autrui un profit illégitime, contrefait, falsifie ou altère les titres fonciers, leurs duplicatas, les bordereaux ou les certificats délivrés par le conservateur, ou fait usage de pièces ainsi falsifiées. Elles s’appliquent aussi à qui commet un faux dans les actes présentés pour une inscription ou une radiation, en contrefaisant ou altérant des écritures ou signatures, en créant des personnes fictives, en fabriquant des conventions, actes ou quittances, ou en y ajoutant ou falsifiant, après leur rédaction, des clauses, déclarations ou faits qu’ils avaient pour objet de constater.'
      cites: [/ma/code/land-registration/art_104]
    - title: {ar: 'التعويض وصندوق التأمين', fr: 'Les dommages-intérêts et le fonds d’assurance'}
      answer: {ar: 'المحافظ مسؤول شخصيا عن الضرر الناتج عن إغفال تقييد أو فساده؛ وصندوق للتأمين يضمن ما يحكم به عليه عند عسره.', fr: 'Le conservateur répond personnellement du dommage causé par l’omission ou la nullité d’une inscription ; un fonds d’assurance garantit ce qu’il est condamné à payer s’il est insolvable.'}
      body:
        ar: 'المحافظ على الأملاك العقارية مسؤول شخصيا عن الضرر الناتج عن إغفال تضمين تقييد أو بيان أو تقييد احتياطي أو تشطيب طلب منه بصفة قانونية، وعن إغفال تضمينه بالشهادات أو النظائر التي يسلمها، وعن فساد أو بطلان ما ضمن بالرسم العقاري، ما عدا الاستثناء المذكور في الفصل 73. ويؤسس صندوق للتأمين يضمن، في حالة عسر المحافظ العام أو المحافظين، أداء المبالغ التي قد يحكم بها عليهم لصالح المتضرر من خطأ في التحفيظ أو في تقييد الحق، وسقفه مائة مليون درهم. وأما من تضرر من التحفيظ نفسه، فلا يقيم دعوى في العقار، وله في حالة التدليس فقط دعوى شخصية بالتعويض على المدلس، وإذا أعسر المدلس أديت التعويضات من هذا الصندوق.'
        fr: 'Le conservateur de la propriété foncière est personnellement responsable du dommage résultant de l’omission sur ses registres d’une inscription, mention, prénotation ou radiation régulièrement requise, de son omission sur les certificats ou duplicatas qu’il délivre, et de la nullité ou de l’irrégularité de ce qui est porté au titre, sauf l’exception de l’article 73. Un fonds d’assurance garantit, en cas d’insolvabilité du conservateur général ou des conservateurs, le paiement des sommes auxquelles ils seraient condamnés au profit de la victime d’une erreur d’immatriculation ou d’inscription ; son plafond est de cent millions de dirhams. Quant à la personne lésée par l’immatriculation elle-même, elle n’a aucune action sur l’immeuble ; en cas de dol seulement, elle a une action personnelle en dommages-intérêts contre l’auteur du dol, et si celui-ci est insolvable, les indemnités sont payées par ce fonds.'
      cites: [/ma/code/land-registration/art_97, /ma/code/land-registration/art_100, /ma/code/land-registration/art_64]
  ends: {office: registry, paper: {ar: 'الحكم المكتسب لقوة الشيء المقضي به، ثم التشطيب على التقييد بالرسم العقاري ونظيره', fr: 'Le jugement passé en force de chose jugée, puis la radiation de l’inscription au titre foncier et sur son duplicata'}, cites: [/ma/code/land-registration/art_91, /ma/code/land-registration/art_88]}
  next: [journeys/buy, journeys/oppose]

- key: inherit
  for: [titled, pending, untitled, unknown]
  title: {ar: 'ورثنا أرضا: الشياع والقسمة والشفعة', fr: 'Une terre reçue en héritage : l’indivision, le partage et la préemption'}
  lead:
    ar: 'تنتقل الأرض بالإرث وفق مدونة الأسرة، ويملكها الورثة على الشياع إلى أن تقسم. ولا يجبر أحد على البقاء في الشياع: تتم القسمة بالتراضي أو بحكم المحكمة. وإذا باع أحد الشركاء نصيبه، فلشركائه أن يأخذوه بالشفعة.'
    fr: 'La terre se transmet par héritage selon le Code de la famille, et les héritiers la possèdent en indivision jusqu’au partage. Nul n’est tenu de rester dans l’indivision : le partage se fait à l’amiable ou par jugement. Si un co-indivisaire vend sa part, ses co-indivisaires peuvent la prendre par droit de préemption.'
  steps:
    - title: {ar: 'الأرض تنتقل إلى الورثة', fr: 'La terre passe aux héritiers'}
      answer: {ar: 'تنتقل ملكية الأرض بالإرث وتسري عليها أحكام مدونة الأسرة، والحيازة تنتقل بصفاتها إلى الورثة.', fr: 'La propriété passe par héritage selon le Code de la famille, et la possession passe aux héritiers avec ses caractères.'}
      body:
        ar: 'تنتقل ملكية الحقوق العينية العقارية عن طريق الإرث والوصية، وتسري عليهما أحكام مدونة الأسرة. وتسري على الملكية المشاعة أحكام مدونة الحقوق العينية، مع مراعاة قانون الالتزامات والعقود والنصوص الخاصة. وتنتقل الحيازة بسبب الإرث أو الوصية بصفاتها إلى الخلف العام.'
        fr: 'La propriété des droits réels immobiliers se transmet par l’héritage et le legs, régis par le Code de la famille. La propriété indivise est régie par le Code des droits réels, sous réserve du Dahir des obligations et des contrats et des textes particuliers. La possession passe aussi, avec ses caractères, aux héritiers et légataires à titre universel.'
      cites: [/ma/loi/39-08/art_264, /ma/loi/39-08/art_24, /ma/loi/39-08/art_247]
    - title: {ar: 'لا أحد يجبر على البقاء في الشياع', fr: 'Nul n’est tenu de rester dans l’indivision'}
      answer: {ar: 'لكل شريك أن يطلب القسمة، وكل شرط يخالف ذلك عديم الأثر.', fr: 'Chaque co-indivisaire peut demander le partage, et toute clause contraire est sans effet.'}
      body:
        ar: 'لا يجبر أحد على البقاء في الشياع، ويسوغ لكل شريك أن يطلب القسمة. ويجوز للشركاء أن يتفقوا كتابة على البقاء في الشياع لمدة معينة، ولا ينفذ هذا الاتفاق إلا في حدود تلك المدة، وللمحكمة أن تفسخه بطلب من أحدهم قبل انصرامها إن كان لذلك مبرر مشروع. وإذا اختلف الشركاء في إجراء القسمة، فلمن يريد الخروج من الشياع أن يلجأ إلى المحكمة.'
        fr: 'Nul n’est tenu de rester dans l’indivision, et chaque co-indivisaire peut demander le partage. Les co-indivisaires peuvent convenir par écrit de rester en indivision pour une durée déterminée ; cet accord ne vaut que pour cette durée, et le tribunal peut le résilier avant son terme, à la demande de l’un d’eux, pour un motif légitime. S’ils ne s’entendent pas sur le partage, celui qui veut sortir de l’indivision peut saisir le tribunal.'
      cites: [/ma/loi/39-08/art_27, /ma/loi/39-08/art_26]
    - title: {ar: 'نوعا القسمة وشروطها', fr: 'Les deux partages et leurs conditions'}
      answer: {ar: 'القسمة البتية تفرز نصيب كل شريك وينقضي بها الشياع، وقسمة المهايأة تقتصر على المنافع.', fr: 'Le partage définitif sépare la part de chacun et met fin à l’indivision ; le partage de jouissance ne porte que sur l’usage.'}
      body:
        ar: 'القسمة إما بتية أو قسمة مهايأة، وتتم بالتراضي أو بحكم قضائي مع مراعاة القوانين والضوابط الجاري بها العمل. والمهايأة زمانية حين يتناوب الشركاء الانتفاع بالعقار كله كل منهم مدة تناسب حصته، ومكانية حين يختص كل واحد بجزء مفرز يناسب حصته؛ وإن لم يتفقوا على المدة أو الجزء عينته المحكمة. ويشترط لإجراء القسمة أن يكون الملك مملوكا على الشياع عند إجرائها، وأن يكون قابلا للقسمة، وألا تزول المنفعة المقصودة منه بالنسبة لكل جزء بعد القسمة.'
        fr: 'Le partage est soit définitif, soit de jouissance, et se fait à l’amiable ou par jugement, dans le respect des lois et règlements en vigueur. Le partage de jouissance est temporel quand les co-indivisaires utilisent tour à tour tout le bien, chacun pour une durée proportionnelle à sa part, et spatial quand chacun use d’une portion séparée proportionnelle à sa part ; faute d’accord sur la durée ou la portion, le tribunal la fixe. Le partage suppose que le bien soit indivis au moment du partage, qu’il soit partageable, et que chaque lot garde l’utilité attendue du bien.'
      cites: [/ma/loi/39-08/art_313, /ma/loi/39-08/art_314, /ma/loi/39-08/art_327, /ma/loi/39-08/art_328]
      next: journeys/divide
    - title: {ar: 'القسمة بالتراضي', fr: 'Le partage amiable'}
      answer: {ar: 'يتفق الشركاء على الطريقة التي يجمعون عليها، ويمكن طلب إبطالها خلال سنة لعيب في الرضى أو لغبن لا يقل عن الثلث.', fr: 'Les co-indivisaires partagent comme ils en conviennent tous ; le partage peut être annulé dans l’année pour vice du consentement ou lésion d’au moins un tiers.'}
      body:
        ar: 'يجوز للشركاء أن يتفقوا على قسمة العقار المشاع بالطريقة التي ينعقد إجماعهم عليها، وفقا للقوانين والضوابط الجاري بها العمل. ولا تكون القسمة الرضائية نافذة بين الأطراف إلا إذا صادق عليها جميع أصحاب الحقوق العينية المترتبة على العقار. ولكل شريك أن يطلب إبطالها إذا شاب إرادته غلط أو تدليس أو إكراه، أو إذا لحقه غبن لا يقل عن الثلث بين قيمة ما آل إليه وقيمة حصته الحقيقية وقت القسمة؛ وللمدعى عليه أن يبقي القسمة إذا أكمل له ما نقص عينا أو نقدا. وتتقادم هذه الدعوى بمضي سنة من تاريخ إجراء القسمة.'
        fr: 'Les co-indivisaires peuvent partager le bien de la manière qu’ils arrêtent à l’unanimité, conformément aux lois et règlements en vigueur. Le partage amiable ne produit effet entre les parties que si tous les titulaires de droits réels sur l’immeuble l’approuvent. Chacun peut en demander l’annulation pour erreur, dol ou violence, ou pour une lésion d’au moins un tiers entre la valeur de son lot et la valeur réelle de sa part au moment du partage ; le défendeur peut alors maintenir le partage en complétant la part, en nature ou en argent. Cette action se prescrit par un an à compter du partage.'
      cites: [/ma/loi/39-08/art_25, /ma/loi/39-08/art_321, /ma/loi/39-08/art_315]
      delay: {months: 12, from: {ar: 'من تاريخ إجراء القسمة', fr: 'à compter de la date du partage'}}
    - title: {ar: 'القسمة أمام المحكمة', fr: 'Le partage judiciaire'}
      answer: {ar: 'توجه الدعوى ضد جميع الشركاء، وتقسم المحكمة الأرض عينا كلما أمكن، بناء على تصميم خبير في المسح الطبوغرافي.', fr: 'L’action vise tous les co-indivisaires, et le tribunal partage en nature chaque fois que c’est possible, sur le plan d’un expert géomètre-topographe.'}
      body:
        ar: 'لا تقبل دعوى القسمة إلا إذا وجهت ضد جميع الشركاء، وتقيد تقييدا احتياطيا إذا تعلقت بعقار محفظ، ويستمر أثر هذا التقييد إلى صدور حكم حائز لقوة الشيء المقضي به. ويدخل الشركاء في الدعوى جميع أصحاب الحقوق العينية المترتبة على العقار. وتحكم المحكمة بالقسمة العينية كلما أمكنت، بفرز الحصص وتكوين الأنصبة على أساس أصغر حصة، وبالتقويم والتعديل، ثم توزع الأنصبة بالقرعة، بناء على تصميم ينجزه خبير في المسح الطبوغرافي يعين موقع كل نصيب وحدوده ومساحته. وإذا خلص الخبير إلى أن العقار قابل للقسمة العينية، أنجز ملفا تقنيا لمشاريع القسمة يرفق بتقريره.'
        fr: 'L’action en partage n’est recevable que dirigée contre tous les co-indivisaires et, pour un immeuble immatriculé, inscrite par prénotation, dont l’effet dure jusqu’au jugement passé en force de chose jugée. Les co-indivisaires mettent en cause tous les titulaires de droits réels sur l’immeuble. Le tribunal ordonne le partage en nature chaque fois qu’il est possible : les parts sont séparées et les lots formés sur la base de la plus petite part, par estimation et compensation, puis tirés au sort, sur un plan dressé par un expert géomètre-topographe qui fixe l’emplacement, les limites et la superficie de chaque lot. L’expert qui conclut que l’immeuble est partageable en nature joint à son rapport un dossier technique des projets de partage.'
      cites: [/ma/loi/39-08/art_316, /ma/loi/39-08/art_320, /ma/loi/39-08/art_317]
    - title: {ar: 'إذا تعذرت القسمة العينية', fr: 'Quand le partage en nature est impossible'}
      answer: {ar: 'تحكم المحكمة ببيع العقار بالمزاد العلني.', fr: 'Le tribunal ordonne la vente de l’immeuble aux enchères publiques.'}
      body:
        ar: 'إذا كان العقار المشاع غير قابل للقسمة العينية، أو كانت قسمته تخالف القوانين والضوابط الجاري بها العمل أو تحدث نقصا كبيرا في قيمته، حكمت المحكمة ببيعه بالمزاد العلني. ولا يتم البيع إلا بعد أن يستنفد الحكم القاضي بالقسمة طرق الطعن العادية، والنقض عند الاقتضاء.'
        fr: 'Si l’immeuble indivis n’est pas partageable en nature, ou si son partage violerait les lois et règlements en vigueur ou en diminuerait fortement la valeur, le tribunal ordonne sa vente aux enchères publiques. La vente n’a lieu qu’une fois le jugement de partage passé par les voies de recours ordinaires et, le cas échéant, la cassation.'
      cites: [/ma/loi/39-08/art_318, /ma/loi/39-08/art_319]
    - title: {ar: 'بعد القسمة', fr: 'Après le partage'}
      answer: {ar: 'يملك كل متقاسم نصيبه المفرز وحده، ويضمن المتقاسمون بعضهم لبعض أنصبتهم، وتوزع المصروفات بقدر الحصص.', fr: 'Chacun est seul propriétaire de son lot, les copartageants se garantissent leurs lots, et les frais se répartissent selon les parts.'}
      body:
        ar: 'يعتبر كل متقاسم مالكا على وجه الاستقلال للحصة المفرزة التي آلت إليه، خالصة من كل حق عيني رتبه غيره من الشركاء، إلا إذا رتبه الشركاء مجتمعين. ويضمن المتقاسمون بعضهم لبعض أنصبتهم مما قد يقع عليها من تعرض أو استحقاق بسبب سابق عن القسمة، إلا إذا اتفقوا صراحة على الإعفاء منه أو نشأ عن خطأ المتقاسم نفسه. ويتحمل المتقاسمون جميعا مصروفات القسمة وتكاليفها، كل بقدر حصته.'
        fr: 'Chaque copartageant est seul propriétaire du lot qui lui échoit, libre de tout droit réel consenti par un autre co-indivisaire, sauf si tous l’ont consenti ensemble. Les copartageants se garantissent mutuellement contre les troubles et évictions dont la cause est antérieure au partage, sauf dispense expresse ou faute du copartageant lui-même. Les frais et charges du partage sont supportés par tous, chacun selon sa part.'
      cites: [/ma/loi/39-08/art_322, /ma/loi/39-08/art_324, /ma/loi/39-08/art_332]
    - title: {ar: 'إذا باع أحد الورثة نصيبه', fr: 'Si un héritier vend sa part'}
      answer: {ar: 'لشركائه أن يأخذوا الحصة المبيعة بالشفعة، ويقدم من يشارك البائع في السهم الواحد في الميراث.', fr: 'Ses co-indivisaires peuvent prendre la part vendue par préemption, et celui qui partage avec le vendeur la même part successorale passe en premier.'}
      body:
        ar: 'الشفعة أخذ شريك في ملك مشاع حصة شريكه المبيعة بثمنها، بعد أداء الثمن ومصروفات العقد اللازمة والمصروفات الضرورية النافعة عند الاقتضاء. وإذا اختلفت مراتب الشفعاء، قدم من يشارك البائع في السهم الواحد في الميراث، ثم باقي الورثة، ثم الموصى لهم، ثم الأجانب، ويتنزل الوارث منزلة موروثه في الأخذ بالشفعة.'
        fr: 'La préemption est le droit d’un co-indivisaire de prendre la part vendue par son co-indivisaire, à son prix, en payant le prix, les frais nécessaires du contrat et, le cas échéant, les dépenses nécessaires et utiles. Entre préempteurs de rangs différents, celui qui partage avec le vendeur la même part successorale passe en premier, puis les autres héritiers, puis les légataires, puis les étrangers ; l’héritier prend la place de son auteur pour exercer la préemption.'
      cites: [/ma/loi/39-08/art_292, /ma/loi/39-08/art_297]
      next: journeys/preempt
  ends: {office: act, paper: {ar: 'عقد القسمة الذي صادق عليه جميع الشركاء وأصحاب الحقوق العينية، أو حكم القسمة', fr: 'L’acte de partage approuvé par tous les co-indivisaires et les titulaires de droits réels, ou le jugement de partage'}, cites: [/ma/loi/39-08/art_321, /ma/loi/39-08/art_313]}
  next: [journeys/preempt, journeys/divide, journeys/register]

- key: preempt
  for: [titled, pending, untitled, unknown]
  title: {ar: 'باع شريكي نصيبه لأجنبي: الشفعة', fr: 'Mon co-indivisaire a vendu sa part à un tiers : la préemption'}
  lead:
    ar: 'الشفعة حق الشريك في أن يأخذ الحصة التي باعها شريكه بثمنها والمصروفات. ويسقط هذا الحق إن لم يمارس داخل ثلاثين يوما كاملة من التوصل شخصيا بتبليغ عقد الشراء. وبدون تبليغ، يسقط بمضي سنة، أو أربع سنوات إذا لم يعلم الشريك بالبيع.'
    fr: 'La préemption permet au co-indivisaire de prendre la part que son co-indivisaire a vendue, à son prix et avec les frais. Ce droit s’éteint s’il n’est pas exercé dans les trente jours francs suivant la réception en personne de la notification du contrat d’achat. Sans notification, il s’éteint au bout d’un an, ou de quatre ans si le co-indivisaire n’a pas eu connaissance de la vente.'
  day: {ar: 'متى توصلت بتبليغ عقد الشراء؟', fr: 'Quand avez-vous reçu la notification du contrat d’achat ?'}
  steps:
    - title: {ar: 'ما هي الشفعة', fr: 'Ce qu’est la préemption'}
      answer: {ar: 'أن يأخذ الشريك حصة شريكه المبيعة بثمنها، بعد أداء الثمن ومصروفات العقد.', fr: 'Le co-indivisaire prend la part vendue par son co-indivisaire, à son prix, en payant le prix et les frais du contrat.'}
      body:
        ar: 'الشفعة أخذ شريك في ملك مشاع أو حق عيني مشاع حصة شريكه المبيعة بثمنها، بعد أداء الثمن ومصروفات العقد اللازمة والمصروفات الضرورية النافعة عند الاقتضاء. وتكون الشفعة في العقارات، سواء كانت قابلة للقسمة أم غير قابلة لها، وفي الحقوق العينية القابلة للتداول.'
        fr: 'La préemption est le droit d’un co-indivisaire d’un bien ou d’un droit réel indivis de prendre la part vendue par son co-indivisaire, à son prix, en payant le prix, les frais nécessaires du contrat et, le cas échéant, les dépenses nécessaires et utiles. Elle s’exerce sur les immeubles, partageables ou non, et sur les droits réels cessibles.'
      cites: [/ma/loi/39-08/art_292, /ma/loi/39-08/art_298]
    - title: {ar: 'من له حق الشفعة', fr: 'Qui peut préempter'}
      answer: {ar: 'شريك كان شريكا وقت البيع، وتملك قبل المشتري، ويحوز حصته، والبيع كان بعوض.', fr: 'Un co-indivisaire qui l’était au jour de la vente, devenu propriétaire avant l’acheteur, qui possède sa part, la vente étant à titre onéreux.'}
      body:
        ar: 'يشترط في طالب الشفعة أن يكون شريكا في الملك المشاع وقت بيع حصة شريكه، وأن يكون تاريخ تملكه سابقا على تاريخ تملك المشتري للحصة، وأن يكون حائزا لحصته حيازة قانونية أو فعلية، وأن يكون المشتري قد تملك الحصة المبيعة بعوض. وعليه أن يثبت بيع الحصة، وإذا كان العقار محفظا أن يثبت تقييد البيع بالرسم العقاري. وإذا اختلفت مراتب الشفعاء، قدم من يشارك البائع في السهم الواحد في الميراث، ثم باقي الورثة، ثم الموصى لهم، ثم الأجانب.'
        fr: 'Le préempteur doit être co-indivisaire au moment de la vente, propriétaire de sa part avant que l’acheteur n’acquière la sienne, possesseur de sa part en droit ou en fait, et l’acheteur doit avoir acquis la part à titre onéreux. Il doit prouver la vente et, pour un immeuble immatriculé, son inscription sur le titre foncier. Entre préempteurs de rangs différents, celui qui partage avec le vendeur la même part successorale passe en premier, puis les autres héritiers, puis les légataires, puis les étrangers.'
      cites: [/ma/loi/39-08/art_293, /ma/loi/39-08/art_295, /ma/loi/39-08/art_297]
    - title: {ar: 'الحصة كلها أو لا شيء', fr: 'Toute la part ou rien'}
      answer: {ar: 'يأخذ الشفيع جميع المبيع المشاع أو يتركه، ولا تبعيض إلا برضى المشتري.', fr: 'Le préempteur prend toute la part indivise vendue ou la laisse ; pas de préemption partielle sans l’accord de l’acheteur.'}
      body:
        ar: 'إذا باع شريك حصته لأجنبي، وجب على الشريك أن يأخذ الحصة المبيعة بكاملها أو أن يتركها. وإذا تعدد الشفعاء أخذ كل واحد بقدر حصته يوم المطالبة، فإن ترك بعضهم وجب على الراغب أخذ الحصة كلها. وإذا بيعت الحصة أو أجزاء منها أو عدة حصص بعقد واحد، أخذ الشفيع جميع المبيع أو تركه، ولا يجوز التبعيض إلا إذا رضي المشتري. وإذا بيعت الحصة عدة مرات قبل انصرام أجل الشفعة، فللشفيع أن يأخذها من أي مشتر بالثمن الذي اشترى به وتبطل البيوع اللاحقة؛ وفي العقار المحفظ لا تؤخذ إلا من يد المشتري المقيد بالرسم العقاري.'
        fr: 'Si un co-indivisaire vend sa part à un tiers, le préempteur prend toute la part vendue ou la laisse. S’il y a plusieurs préempteurs, chacun prend à proportion de sa part au jour de la demande ; si certains renoncent, celui qui préempte doit prendre toute la part. Si la part, des fractions de part ou plusieurs parts sont vendues par un même acte, le préempteur prend tout ou laisse tout, sauf si l’acheteur accepte une préemption partielle. Si la part est vendue plusieurs fois avant la fin du délai, le préempteur peut la prendre chez n’importe quel acheteur, au prix que celui-ci a payé, et les ventes suivantes sont annulées ; pour un immeuble immatriculé, la part ne se prend que chez l’acheteur inscrit sur le titre foncier.'
      cites: [/ma/loi/39-08/art_296, /ma/loi/39-08/art_300, /ma/loi/39-08/art_299]
    - title: {ar: 'متى لا تكون شفعة', fr: 'Quand il n’y a pas de préemption'}
      answer: {ar: 'لا شفعة في البيع بالمزاد العلني، ولا في التبرع غير الصوري، ولا في الصداق أو الخلع؛ ويسقط الحق بالتنازل أو بالشراء من المشتري أو ببيع الشفيع حصته.', fr: 'Pas de préemption sur une vente aux enchères, une donation non simulée, une dot ou un khol’ ; le droit se perd par renonciation, par rachat à l’acheteur ou si le préempteur vend sa propre part.'}
      body:
        ar: 'لا يجوز الأخذ بالشفعة في الحصة المبيعة في المزاد العلني وفق الإجراءات القانونية. ولا شفعة فيما فوت تبرعا ما لم يكن التبرع صوريا أو تحايلا، ولا في الحصة التي تقدم في صداق أو خلع. ويسقط حق الشفيع إذا تنازل عنه صراحة بعد ثبوته، أو اشترى الحصة من مشتريها أو قاسمه فيها، أو باع حصته التي يشفع بها ولو كان لا يعلم أن شريكه باع قبله.'
        fr: 'La part vendue aux enchères publiques selon la procédure légale ne peut être préemptée. Il n’y a pas de préemption sur ce qui est cédé à titre gratuit, sauf donation simulée ou frauduleuse, ni sur la part donnée en dot ou en contrepartie d’un khol’. Le préempteur perd son droit s’il y renonce expressément après qu’il est né, s’il rachète la part à l’acheteur ou la partage avec lui, ou s’il vend la part qui fonde sa préemption, même sans savoir que son co-indivisaire avait vendu avant lui.'
      cites: [/ma/loi/39-08/art_302, /ma/loi/39-08/art_303, /ma/loi/39-08/art_311]
    - title: {ar: 'الأجل', fr: 'Le délai'}
      answer: {ar: 'ثلاثون يوما كاملة من التوصل شخصيا بالتبليغ؛ وبدونه سنة، أو أربع سنوات من العقد إن لم يعلم الشريك بالبيع.', fr: 'Trente jours francs après la réception en personne de la notification ; sans elle, un an, ou quatre ans après le contrat si le co-indivisaire n’a pas connu la vente.'}
      body:
        ar: 'للمشتري، بعد تقييد حقوقه في الرسم العقاري أو إيداعها في مطلب التحفيظ، أن يبلغ نسخة من عقد شرائه إلى من له حق الشفعة، ولا يصح التبليغ إلا إذا توصل به صاحب الحق شخصيا، ويسقط حقه إن لم يمارسه خلال ثلاثين يوما كاملة من التوصل. ويتضمن التبليغ، تحت طائلة البطلان، هوية البائع والمشتري، والحصة المبيعة وثمنها والمصروفات، ورقم الرسم العقاري أو مطلب التحفيظ أو مراجع العقد. وإن لم يقع التبليغ، سقط الحق بمضي سنة كاملة من التقييد إذا كان العقار محفظا، أو من الإيداع إذا كان في طور التحفيظ، أو من العلم بالبيع إذا كان غير محفظ، وبمضي أربع سنوات من إبرام العقد إذا لم يتحقق العلم بالبيع. ولا يسقط الحق بموت الشفيع، بل ينتقل إلى ورثته بالشروط نفسها، بما في ذلك ما بقي من الأجل.'
        fr: 'Après avoir inscrit ses droits sur le titre foncier ou les avoir déposés sur la réquisition d’immatriculation, l’acheteur peut notifier une copie de son contrat au titulaire du droit de préemption ; la notification ne vaut que reçue par lui en personne, et son droit s’éteint s’il ne l’exerce pas dans les trente jours francs de la réception. À peine de nullité, la notification indique l’identité du vendeur et de l’acheteur, la part vendue, son prix, les frais, et le numéro du titre foncier ou de la réquisition ou les références de l’acte. Sans notification, le droit s’éteint en tout cas un an après l’inscription pour un immeuble immatriculé, après le dépôt pour un immeuble en cours d’immatriculation, après la connaissance de la vente pour un immeuble non immatriculé, et quatre ans après la conclusion du contrat si la vente n’a pas été connue. La mort du préempteur n’éteint pas le droit : il passe à ses héritiers aux mêmes conditions, avec ce qui reste du délai.'
      cites: [/ma/loi/39-08/art_304, /ma/loi/39-08/art_312]
      delay: {days: 30, from: {ar: 'من اليوم الموالي للتوصل بالتبليغ', fr: 'à compter du lendemain de la réception de la notification'}, on_day: true}
      tool: tools/clock?p=preempt
    - title: {ar: 'أرض في طور التحفيظ', fr: 'Une terre en cours d’immatriculation'}
      answer: {ar: 'لا يعتد بطلب الشفعة إلا إذا ضمن الشفيع تعرضه بمطلب التحفيظ.', fr: 'La demande de préemption ne compte que si le préempteur a inscrit son opposition sur la réquisition d’immatriculation.'}
      body:
        ar: 'إذا كان العقار في طور التحفيظ، فلا يعتد بطلب الشفعة إلا إذا ضمن الشفيع تعرضه بمطلب التحفيظ المتعلق به. ويمكن لكل من يدعي حقا عينيا قابلا للتقييد أن يتعرض خلال شهرين من يوم نشر الإعلان عن انتهاء التحديد في الجريدة الرسمية. وبعد هذا الأجل، يمكن للمحافظ أن يقبل التعرض بصفة استثنائية ما لم يوجه الملف إلى المحكمة الابتدائية، بشرط الإدلاء بما يبين سبب التأخر وبالوثائق المدعمة وأداء الرسوم؛ وقرار الرفض غير قابل للطعن القضائي.'
        fr: 'Si l’immeuble est en cours d’immatriculation, la demande de préemption n’est prise en compte que si le préempteur a consigné son opposition sur la réquisition correspondante. Quiconque revendique un droit réel susceptible d’inscription peut faire opposition dans les deux mois de la publication au Bulletin officiel de l’avis de clôture du bornage. Passé ce délai, le conservateur peut l’admettre à titre exceptionnel tant que le dossier n’a pas été transmis au tribunal de première instance, sur justification du retard, des pièces à l’appui et paiement des droits ; son refus n’est susceptible d’aucun recours judiciaire.'
      cites: [/ma/loi/39-08/art_305, /ma/code/land-registration/art_24, /ma/code/land-registration/art_29]
      next: journeys/oppose
    - title: {ar: 'الطلب والعرض الحقيقي', fr: 'La demande et l’offre réelle'}
      answer: {ar: 'طلب إلى رئيس المحكمة الابتدائية، ثم عرض الثمن والمصروفات عرضا حقيقيا وإيداعهما عند الرفض، كل ذلك داخل الأجل.', fr: 'Une requête au président du tribunal de première instance, puis l’offre réelle du prix et des frais et leur consignation en cas de refus, le tout dans le délai.'}
      body:
        ar: 'يقدم من يرغب في الأخذ بالشفعة طلبا إلى رئيس المحكمة الابتدائية المختصة يعبر فيه عن رغبته، ويطلب الإذن له بعرض الثمن والمصروفات الظاهرة للعقد عرضا حقيقيا، ثم بإيداعهما في صندوق المحكمة إذا رفض المشتري العرض. ويجب أن يتم كل ذلك داخل الأجل القانوني، وإلا سقط الحق في الشفعة.'
        fr: 'Celui qui veut exercer la préemption présente une requête au président du tribunal de première instance compétent, où il exprime sa volonté et demande l’autorisation de faire une offre réelle du prix et des frais apparents du contrat, puis de les consigner à la caisse du tribunal si l’acheteur refuse l’offre. Tout cela doit être fait dans le délai légal, sinon le droit de préemption s’éteint.'
      cites: [/ma/loi/39-08/art_306]
    - title: {ar: 'بعد الأخذ بالشفعة', fr: 'Après la préemption'}
      answer: {ar: 'يتملك الشفيع الحصة بالتراضي أو بحكم، والثمار له من تاريخ المطالبة.', fr: 'Le préempteur devient propriétaire de la part, à l’amiable ou par jugement, et les fruits lui reviennent à compter de sa demande.'}
      body:
        ar: 'إذا تم التراضي على الأخذ بالشفعة أو حكمت بها المحكمة، تملك الشفيع الحصة المبيعة مع مراعاة ظهير التحفيظ العقاري. ولا يلتزم المشتري برد ثمار الحصة إلا من تاريخ المطالبة بالشفعة. وإذا كان العقار غير محفظ، بطلت جميع التصرفات التي أجراها المشتري على الحصة المشفوعة.'
        fr: 'Si la préemption est acceptée à l’amiable ou prononcée par le tribunal, le préempteur devient propriétaire de la part vendue, sous réserve du dahir sur l’immatriculation foncière. L’acheteur ne rend les fruits de la part qu’à compter de la demande de préemption. Pour un immeuble non immatriculé, tous les actes de l’acheteur sur la part préemptée sont annulés.'
      cites: [/ma/loi/39-08/art_307, /ma/loi/39-08/art_309, /ma/loi/39-08/art_310]
  ends: {office: court, paper: {ar: 'الطلب إلى رئيس المحكمة الابتدائية، ثم محضر العرض الحقيقي أو وصل إيداع الثمن والمصروفات بصندوق المحكمة', fr: 'La requête au président du tribunal de première instance, puis le procès-verbal d’offre réelle ou le récépissé de consignation du prix et des frais'}, cites: [/ma/loi/39-08/art_306]}
  next: [journeys/inherit, journeys/oppose, journeys/divide]

- key: divide
  for: [titled, pending, untitled, unknown]
  title: {ar: 'أريد أن أقسم البقعة: التقسيم والتجزئة والإذن', fr: 'Diviser un terrain : morcellement, lotissement et autorisation'}
  lead:
    ar: 'تقسيم عقار إلى بقعتين أو أكثر لتشييد مبان عليها تجزئة، تحتاج إذنا وأشغال تجهيز. وتقسيمه بالتفويت أو القسمة إلى بقع غير معدة للبناء تقسيم، يحتاج إذنا في الجماعات الحضرية والمراكز المحددة ومناطقها المحيطة وكل منطقة تشملها وثيقة تعمير. ولا يحرر العدول والموثقون هذه العقود ولا يسجلها المحافظون دون الإذن أو شهادة بأن العملية خارج نطاق القانون.'
    fr: 'Diviser un terrain en deux lots ou plus pour y construire, c’est un lotissement : il faut une autorisation et des travaux d’équipement. Le diviser par cession ou partage en lots non destinés à bâtir, c’est un morcellement : il faut une autorisation dans les communes urbaines, les centres délimités et leurs zones périphériques, et toute zone couverte par un document d’urbanisme. Adouls et notaires ne rédigent pas ces actes, ni le conservateur ne les inscrit, sans l’autorisation ou une attestation que l’opération sort du champ de la loi.'
  day: {ar: 'متى أودعت طلب الإذن بالتقسيم؟', fr: 'Quand avez-vous déposé la demande d’autorisation de morcellement ?'}
  steps:
    - title: {ar: 'تجزئة أم تقسيم؟', fr: 'Lotissement ou morcellement ?'}
      answer: {ar: 'إذا كانت البقع معدة للبناء فهي تجزئة؛ وإذا لم تكن معدة للبناء فهو تقسيم.', fr: 'Si les lots sont destinés à bâtir, c’est un lotissement ; s’ils ne le sont pas, c’est un morcellement.'}
      body:
        ar: 'تعتبر تجزئة عقارية تقسيم عقار، عن طريق التفويت أو الإيجار أو القسمة، إلى بقعتين أو أكثر لتشييد مبان للسكن أو لغرض صناعي أو سياحي أو تجاري أو حرفي، مهما كانت مساحة البقع. أما التقسيم فهو تفويت أو قسمة يكون هدفهما أو نتيجتهما تقسيم عقار إلى بقعتين أو أكثر غير معدة لإقامة بناء عليها، أو تفويت عقار غير معد للبناء لعدة أشخاص على الشياع في الحالات التي تحددها المادة 58. ولا يقبل طلب الإذن بالتقسيم إذا كانت الأرض في منطقة يباح فيها البناء بمقتضى وثيقة تعمير؛ وحينئذ لا يؤذن في العملية إلا وفق الشروط المقررة للتجزئات.'
        fr: 'Est un lotissement la division d’un terrain, par cession, location ou partage, en deux lots ou plus destinés à des constructions d’habitation ou à usage industriel, touristique, commercial ou artisanal, quelle que soit la surface des lots. Est un morcellement la cession ou le partage qui a pour but ou pour effet de diviser un terrain en deux lots ou plus non destinés à bâtir, ou la cession d’un terrain non destiné à bâtir à plusieurs personnes en indivision dans les cas que fixe l’article 58. La demande d’autorisation de morcellement est irrecevable si le terrain se trouve dans une zone constructible selon un document d’urbanisme ; l’opération ne peut alors être autorisée qu’aux conditions des lotissements.'
      cites: [/ma/loi/25-90/art_1, /ma/loi/25-90/art_58, /ma/loi/25-90/art_60]
    - title: {ar: 'متى يلزم الإذن بالتقسيم', fr: 'Quand l’autorisation de morcellement est exigée'}
      answer: {ar: 'في الجماعات التي يشمل مدارها الحضري كامل ترابها، والمراكز المحددة ومناطقها المحيطة، والمناطق ذات الصبغة الخاصة، وكل منطقة تشملها وثيقة تعمير موافق عليها.', fr: 'Dans les communes dont le périmètre urbain couvre tout le territoire, les centres délimités et leurs zones périphériques, les zones à caractère spécial et toute zone couverte par un document d’urbanisme approuvé.'}
      body:
        ar: 'في هذه المناطق، يلزم إذن مسبق لكل تفويت أو قسمة يؤدي إلى تقسيم عقار إلى بقعتين أو أكثر غير معدة للبناء، ولكل تفويت لعقار غير معد للبناء لعدة أشخاص على الشياع إذا كان سيحصل أحدهم على الأقل على نصيب شائع لا تقل مساحته عن المساحة الدنيا للبقع التي تحددها وثيقة التعمير، أو عن 2.500 متر مربع إذا لم تحدد هذه المساحة. ولا يلزم الإذن في تقسيم عقار للدولة أو الجماعات الترابية أو الجماعات السلالية لاستخراج أجزاء منه لمشاريع ذات نفع عام، ولا في قسمة عقار تملكه الدولة على الشياع مع الغير إذا كانت الدولة هي من بادرت بطلب القسمة. ولا يلزم كذلك في استخراج قطع أرضية لتفويتها للدولة أو للجماعات الترابية بالتراضي أو بنزع الملكية لإنجاز تجهيزات ومرافق عمومية.'
        fr: 'Dans ces zones, une autorisation préalable est exigée pour toute cession ou tout partage aboutissant à diviser un terrain en deux lots ou plus non destinés à bâtir, et pour toute cession d’un terrain non destiné à bâtir à plusieurs personnes en indivision lorsque l’un au moins d’entre eux obtient une quote-part d’une surface au moins égale à la surface minimale des lots fixée par le document d’urbanisme, ou à 2 500 mètres carrés si elle n’est pas fixée. Ne sont pas soumis à autorisation la division d’un terrain de l’État, des collectivités territoriales ou des collectivités soulaliyates pour en extraire des parties destinées à des projets d’intérêt général, ni le partage d’un terrain que l’État possède en indivision avec d’autres lorsque l’initiative du partage vient de l’État. Ne l’est pas non plus le détachement de parcelles cédées à l’État ou aux collectivités territoriales à l’amiable ou par expropriation pour réaliser des équipements publics.'
      cites: [/ma/loi/25-90/art_58, /ma/loi/34-21/art_3]
    - title: {ar: 'الطلب، وثلاثون يوما', fr: 'La demande, et trente jours'}
      answer: {ar: 'يسلم الإذن رئيس مجلس الجماعة بعد رأي الإدارة، ويعتبر ممنوحا إذا لم يبت داخل ثلاثين يوما من الإيداع.', fr: 'Le président du conseil communal délivre l’autorisation après avis de l’administration ; elle est réputée accordée s’il ne statue pas dans les trente jours du dépôt.'}
      body:
        ar: 'يسلم رئيس مجلس الجماعة الإذن بالتقسيم، بعد استطلاع رأي الإدارة، على أساس ملف تحدد وثائقه السلطة التنظيمية. ويعتبر الإذن ممنوحا إذا لم يبت الرئيس في الطلب داخل ثلاثين يوما من إيداعه، وفق الكيفيات المنصوص عليها في النصوص الجاري بها العمل. وتضم لجنة دراسة طلبات التقسيم ممثلي العمالة أو الإقليم والجماعة والوكالة الحضرية والوكالة الوطنية للمحافظة العقارية والمسح العقاري والخرائطية. والآجال في هذا القانون آجال كاملة.'
        fr: 'Le président du conseil communal délivre l’autorisation de morcellement, après avis de l’administration, sur un dossier dont les pièces sont fixées par voie réglementaire. L’autorisation est réputée accordée si le président ne statue pas sur la demande dans les trente jours de son dépôt, selon les modalités des textes en vigueur. La commission qui instruit les demandes de morcellement réunit des représentants de la préfecture ou de la province, de la commune, de l’agence urbaine et de l’Agence nationale de la conservation foncière, du cadastre et de la cartographie. Les délais de cette loi sont des délais francs.'
      cites: [/ma/loi/25-90/art_59, /ma/decret/2-18-577/art_23, /ma/loi/25-90/art_74-bis]
      delay: {days: 30, on_day: true, from: {ar: 'من اليوم الموالي لإيداع الطلب', fr: 'à compter du lendemain du dépôt'}}
    - title: {ar: 'العدول والموثقون والمحافظ', fr: 'Adouls, notaires et conservateur'}
      answer: {ar: 'لا يحررون ولا يتلقون ولا يسجلون عقد تفويت أو قسمة من هذا النوع دون الإذن بالتقسيم أو شهادة رئيس المجلس بأن العملية خارج نطاق القانون.', fr: 'Ils ne rédigent, ne reçoivent ni n’inscrivent un acte de cession ou de partage de ce type sans l’autorisation de morcellement ou l’attestation du président que l’opération sort du champ de la loi.'}
      body:
        ar: 'لا يجوز للعدول والموثقين والمحافظين على الأملاك العقارية ومأموري إدارة التسجيل أن يحرروا أو يتلقوا أو يسجلوا عقود التفويت أو القسمة المشار إليها في المادة 58 إلا بعد الإدلاء بالإذن بالتقسيم، أو بشهادة يسلمها رئيس مجلس الجماعة، بعد الموافقة المسبقة للجنة من ممثلي الوكالة الحضرية والجماعة والعمالة أو الإقليم، تثبت أن العملية لا تدخل في نطاق تطبيق القانون. ويجب أن تتضمن عقود التفويت أو القسمة بيان الإذن أو الشهادة. وعقود التفويت والإيجار والقسمة المبرمة خلافا لأحكام هذا القانون باطلة بطلانا مطلقا، ولكل ذي مصلحة وللإدارة أن يقيم دعوى البطلان.'
        fr: 'Les adouls, les notaires, les conservateurs de la propriété foncière et les agents de l’enregistrement ne peuvent rédiger, recevoir ou enregistrer les actes de cession ou de partage visés à l’article 58 que sur production de l’autorisation de morcellement, ou d’une attestation du président du conseil communal, après accord préalable d’une commission de représentants de l’agence urbaine, de la commune et de la préfecture ou province, établissant que l’opération sort du champ d’application de la loi. Les actes de cession ou de partage doivent mentionner l’autorisation ou l’attestation. Les actes de cession, de location et de partage conclus en violation de cette loi sont frappés de nullité absolue, et l’action en nullité appartient à tout intéressé et à l’administration.'
      cites: [/ma/loi/25-90/art_61, /ma/loi/25-90/art_62, /ma/loi/25-90/art_72]
      next: journeys/inherit
    - title: {ar: 'الإذن بالتجزئة', fr: 'L’autorisation de lotir'}
      answer: {ar: 'يسلمه رئيس مجلس الجماعة، ولا يقبل الطلب إلا إذا كانت الأرض محفظة، أو في طور التحفيظ وانصرم أجل التعرضات دون تعرض.', fr: 'Le président du conseil communal la délivre ; la demande n’est recevable que si le terrain est immatriculé, ou en cours d’immatriculation sans opposition une fois le délai d’opposition écoulé.'}
      body:
        ar: 'يسلم رئيس مجلس الجماعة الإذن بإحداث التجزئة، ويسلمه وزير الداخلية أو الوالي أو العامل المفوض إذا كان العقار في جماعتين أو أكثر، بعد رأي رؤساء مجالسها. ولا يقبل الطلب إذا كانت الأرض غير محفظة ولا في طور التحفيظ؛ وإذا كانت في طور التحفيظ، فلا يقبل إلا إذا انصرم أجل التعرضات دون تقديم أي تعرض. ولا يقبل كذلك إذا لم يتضمن الملف جميع المستندات المطلوبة. ويجب أن يكون الرفض معللا، ويرفض الإذن خصوصا إذا كان العقار غير موصول بشبكات الطرق والصرف الصحي والماء الصالح للشرب والكهرباء.'
        fr: 'Le président du conseil communal délivre l’autorisation de lotir ; si le terrain s’étend sur deux communes ou plus, elle est délivrée par le ministre de l’Intérieur ou le wali ou gouverneur délégué, après avis des présidents des conseils concernés. La demande est irrecevable si le terrain n’est ni immatriculé ni en cours d’immatriculation ; en cours d’immatriculation, elle n’est recevable que si le délai d’opposition a expiré sans opposition. Elle l’est aussi si le dossier ne contient pas toutes les pièces exigées. Le refus doit être motivé, et l’autorisation est refusée notamment si le terrain n’est pas raccordé aux réseaux de voirie, d’assainissement, d’eau potable et d’électricité.'
      cites: [/ma/loi/25-90/art_3, /ma/loi/25-90/art_5, /ma/loi/25-90/art_7]
    - title: {ar: 'أجل الإذن بالتجزئة', fr: 'La durée de l’autorisation de lotir'}
      answer: {ar: 'ثلاث سنوات حتى 20 هكتارا، ثم 5 و7 و10 و15 سنة بحسب المساحة؛ ويسقط الإذن إذا لم تنته أشغال التجهيز داخل أجله.', fr: 'Trois ans jusqu’à 20 hectares, puis 5, 7, 10 et 15 ans selon la surface ; l’autorisation devient caduque si les travaux d’équipement ne sont pas achevés dans ce délai.'}
      body:
        ar: 'منذ القانون رقم 34.21، يحدد أجل الإذن بحسب مساحة التجزئة: ثلاث سنوات حتى 20 هكتارا، وخمس سنوات لأكثر من 20 حتى 100 هكتار، وسبع سنوات لأكثر من 100 حتى 250 هكتارا، وعشر سنوات لأكثر من 250 حتى 400 هكتار، وخمس عشرة سنة لما فوق 400 هكتار. ويسقط الإذن إذا انقضى أجله دون أن ينهي المجزئ أشغال التجهيز، ويحتسب الأجل من تاريخ الحصول عليه. ويتوقف سريان الأجل عند التوقف الاضطراري للأشغال لظروف خارجة عن إرادة صاحب التجزئة، بطلب يودع لدى الجماعة، تبدي فيه لجنة خاصة رأيها داخل خمسة عشر يوما، ثم يقرر الرئيس داخل سبعة أيام من توصله بمحضرها. وتسري هذه الآجال الجديدة على التجزئات التي كانت آجالها سارية يوم نشر القانون رقم 34.21، بحسب مساحتها.'
        fr: 'Depuis la loi 34.21, la durée de l’autorisation dépend de la surface du lotissement : trois ans jusqu’à 20 hectares, cinq ans de plus de 20 à 100 hectares, sept ans de plus de 100 à 250 hectares, dix ans de plus de 250 à 400 hectares, quinze ans au-delà de 400 hectares. L’autorisation devient caduque si le délai expire sans que le lotisseur ait achevé les travaux d’équipement ; il court de la date d’obtention. Le délai est suspendu en cas d’arrêt forcé des travaux dû à des circonstances indépendantes de la volonté du lotisseur, sur demande déposée à la commune : une commission spéciale donne son avis dans les quinze jours, puis le président décide dans les sept jours de la réception de son procès-verbal. Ces nouveaux délais s’appliquent, selon leur surface, aux lotissements dont le délai courait encore à la publication de la loi 34.21.'
      cites: [/ma/loi/25-90/art_11, /ma/loi/25-90/art_11-bis, /ma/loi/34-21/art_5]
    - title: {ar: 'بيع البقع: بعد التسلم المؤقت', fr: 'Céder les lots : après la réception provisoire'}
      answer: {ar: 'لا تبرم عقود تفويت بقع التجزئة أو إيجارها أو قسمتها إلا بعد أن تتسلم الجماعة أشغال التجهيز تسلما مؤقتا.', fr: 'Les actes de cession, de location ou de partage des lots ne se concluent qu’après la réception provisoire des travaux d’équipement par la commune.'}
      body:
        ar: 'يتيح التسلم المؤقت للجماعة التحقق من أن أشغال التجهيز أنجزت وفق مشروع التجزئة المأذون فيه، ويجب أن يتم داخل ثلاثين يوما من التصريح بانتهاء هذه الأشغال. ولا يمكن إبرام عقود التفويت والإيجار والقسمة المتعلقة بالتجزئة إلا بعد هذا التسلم. ولا يحرر العدول والموثقون ولا يسجل المحافظون ومأمورو التسجيل هذه العقود إلا بالإدلاء بنسخة من محضر التسلم المؤقت، أو بشهادة من رئيس مجلس الجماعة، بعد موافقة لجنة، بأن العملية لا تدخل في نطاق القانون.'
        fr: 'La réception provisoire permet à la commune de vérifier que les travaux d’équipement ont été réalisés selon le projet de lotissement autorisé ; elle doit intervenir dans les trente jours de la déclaration d’achèvement de ces travaux. Les actes de cession, de location et de partage portant sur le lotissement ne peuvent être conclus qu’après cette réception. Adouls, notaires, conservateurs et agents de l’enregistrement ne rédigent ni n’enregistrent ces actes que sur production d’une copie du procès-verbal de réception provisoire, ou d’une attestation du président du conseil communal, après accord d’une commission, que l’opération sort du champ de la loi.'
      cites: [/ma/loi/25-90/art_23, /ma/loi/25-90/art_33, /ma/loi/25-90/art_35]
      delay: {days: 30, from: {ar: 'من التصريح بانتهاء أشغال التجهيز', fr: 'à compter de la déclaration d’achèvement des travaux d’équipement'}}
    - title: {ar: 'العقوبات', fr: 'Les sanctions'}
      answer: {ar: 'تقسيم مخالف للمادة 58 أو تجزئة دون إذن: غرامة من 100.000 إلى 5.000.000 درهم.', fr: 'Un morcellement contraire à l’article 58 ou un lotissement sans autorisation : une amende de 100 000 à 5 000 000 de dirhams.'}
      body:
        ar: 'يعاقب بغرامة من 100.000 إلى 5.000.000 درهم كل من أحدث تجزئة عقارية أو مجموعة سكنية دون إذن سابق، أو قام بتقسيم مخالف لأحكام المادة 58. ويعاقب بالحبس من سنة إلى خمس سنوات وبغرامة من 100.000 إلى 200.000 درهم من فوت أو أكرى أو قسم أو عرض للتفويت أو الإيجار بقعا من تجزئة لم يؤذن فيها أو لم تكن محل تسلم مؤقت لأشغالها، أو توسط في ذلك. وتضاعف العقوبات إذا عاد المخالف إلى مخالفة مماثلة داخل السنة الموالية لصيرورة الحكم الأول غير قابل لأي طعن. ويعد شريكا ويعاقب بنفس العقوبة رب العمل والمقاول والمهندس المعماري والمهندس المختص والمهندس المساح الطبوغرافي إذا لم يبلغوا عن المخالفة خلال 48 ساعة من علمهم بها.'
        fr: 'Quiconque crée un lotissement ou un groupe d’habitations sans autorisation préalable, ou procède à un morcellement contraire à l’article 58, est puni d’une amende de 100 000 à 5 000 000 de dirhams. Céder, louer, partager ou offrir à la vente ou à la location des lots d’un lotissement non autorisé ou dont les travaux n’ont pas fait l’objet d’une réception provisoire, ou servir d’intermédiaire, est puni d’un à cinq ans d’emprisonnement et d’une amende de 100 000 à 200 000 dirhams. Les peines sont doublées en cas de récidive dans l’année qui suit le jour où le premier jugement est devenu insusceptible de recours. Le maître d’ouvrage, l’entrepreneur, l’architecte, l’ingénieur spécialisé et l’ingénieur géomètre-topographe sont complices et punis de la même peine s’ils ne signalent pas l’infraction dans les 48 heures où ils en ont connaissance.'
      cites: [/ma/loi/25-90/art_65, /ma/loi/25-90/art_68, /ma/loi/25-90/art_71, /ma/loi/25-90/art_3-71]
  ends: {office: commune, paper: {ar: 'الإذن بالتقسيم، أو شهادة رئيس مجلس الجماعة بأن العملية خارج نطاق القانون؛ ويذكر أحدهما في العقد', fr: 'L’autorisation de morcellement, ou l’attestation du président du conseil communal que l’opération sort du champ de la loi ; l’acte mentionne l’une ou l’autre'}, cites: [/ma/loi/25-90/art_61, /ma/loi/25-90/art_62]}
  next: [journeys/build, journeys/inherit, journeys/buy]

- key: build
  for: [titled, pending, untitled, unknown]
  title: {ar: 'أريد أن أبني: من مذكرة المعلومات التعميرية إلى رخصة السكن', fr: 'Construire : de la note de renseignements urbanistiques au permis d’habiter'}
  lead:
    ar: 'يمنع البناء دون رخصة في الجماعات والمراكز المحددة ومناطقها المحيطة، وفي مناطق أخرى يعينها القانون. يسلم الرخصة رئيس مجلس الجماعة، وإذا سكت شهرين من إيداع الطلب اعتبرت مسلمة. وتسقط إذا مرت سنة دون الشروع في أشغال الأسس، ولا يستعمل المبنى إلا بعد رخصة السكن أو شهادة المطابقة.'
    fr: 'Construire sans permis est interdit dans les communes, les centres délimités et leurs zones périphériques, et dans d’autres zones que la loi désigne. Le permis est délivré par le président du conseil communal ; s’il se tait deux mois après le dépôt de la demande, le permis est réputé accordé. Il devient caduc si les travaux de fondation n’ont pas commencé dans l’année, et le bâtiment ne s’utilise qu’après le permis d’habiter ou le certificat de conformité.'
  day: {ar: 'متى أودعت طلب رخصة البناء؟', fr: 'Quand avez-vous déposé la demande de permis de construire ?'}
  steps:
    - title: {ar: 'أين تلزم رخصة البناء', fr: 'Où le permis de construire est exigé'}
      answer: {ar: 'في الجماعات والمراكز المحددة ومناطقها المحيطة، وعلى طول السكك الحديدية والطرق والساحل، وداخل التجزئات المأذون فيها؛ وكذلك لكل تغيير يمس واجهة بناية.', fr: 'Dans les communes, les centres délimités et leurs zones périphériques, le long des voies ferrées, des routes et du littoral, et dans les lotissements autorisés ; et pour toute modification d’une façade.'}
      body:
        ar: 'يمنع البناء دون رخصة داخل الجماعات والمراكز المحددة والمناطق المحيطة بها كما تعرفها المادة الأولى، وتمتد المناطق المحيطة بالمدن إلى خمسة عشر كيلومترا من الدائرة البلدية، وكذلك في المناطق ذات الصبغة الخاصة. وخارج هذه الدوائر، تلزم الرخصة على طول السكك الحديدية وطرق المواصلات غير الجماعية إلى عمق كيلومتر واحد، وعلى طول حدود الملك العام البحري إلى عمق خمسة كيلومترات، وداخل التجزئات المأذون فيها. وتلزم الرخصة أيضا لتغيير بناء قائم إذا مس العناصر المنصوص عليها في الضوابط، ولكل تغيير في واجهة بناية؛ أما الأشغال الأخرى في هذه المناطق فتلزمها رخصة إصلاح يسلمها رئيس المجلس الجماعي. ويجوز أن يفرض مرسوم الرخصة خارج هذه الدوائر، في كل تراب المملكة أو بعضه أو لبعض أصناف المباني.'
        fr: 'Construire sans permis est interdit dans les communes, les centres délimités et leurs zones périphériques tels que les définit l’article premier — la zone périphérique d’une ville s’étend sur quinze kilomètres à partir du périmètre municipal —, ainsi que dans les zones à caractère spécial. Hors de ces périmètres, le permis est exigé le long des voies ferrées et des routes autres que communales sur un kilomètre de profondeur, le long du domaine public maritime sur cinq kilomètres, et dans les lotissements autorisés. Il l’est aussi pour modifier un bâtiment existant lorsque la modification touche les éléments visés par les règlements, et pour toute modification d’une façade ; les autres travaux dans ces zones demandent une autorisation de réfection délivrée par le président du conseil communal. Un décret peut imposer le permis hors de ces périmètres, sur tout ou partie du territoire ou pour certaines catégories de constructions.'
      cites: [/ma/loi/12-90/art_40, /ma/loi/12-90/art_1, /ma/loi/12-90/art_42]
    - title: {ar: 'مذكرة المعلومات التعميرية', fr: 'La note de renseignements urbanistiques'}
      answer: {ar: 'تسلمها الوكالة الحضرية في يومين مفتوحين على الأكثر، وتبين ما تسمح به وثيقة التعمير في الأرض.', fr: 'L’agence urbaine la délivre en deux jours ouvrables au plus ; elle dit ce que le document d’urbanisme permet sur le terrain.'}
      body:
        ar: 'تسلم الوكالة الحضرية، بناء على طلب يودع مقابل وصل مؤرخ وموقع، مذكرة تحدد الاستعمال المخصص للعقار وفق وثائق التعمير السارية. ويمكن لأي شخص طلبها إذا وجدت وثيقة تعمير مصادق عليها؛ وفي غيابها لا يطلبها إلا المالك أو من يدلي بموافقته أو بوثيقة تبرر ذلك. وتبين المذكرة وثيقة التعمير المطبقة، وتخصيص المنطقة، والاستعمالات الممنوعة، والعلو الأقصى للمباني، وشروط إقامتها بالنسبة للحدود، وشروط الولوج ومواقف السيارات. وتسلم في أجل لا يتعدى يومين مفتوحين، بناء على المعطيات التي يدلي بها الطالب، ولا تعد بأي حال موافقة مبدئية على مشروع.'
        fr: 'Sur demande déposée contre un récépissé daté et signé, l’agence urbaine délivre une note qui fixe l’usage du terrain selon les documents d’urbanisme en vigueur. Toute personne peut la demander lorsqu’un document d’urbanisme approuvé existe ; à défaut, seuls le propriétaire ou qui produit son accord ou un document qui le justifie peuvent la demander. La note indique le document d’urbanisme applicable, l’affectation de la zone, les usages interdits, la hauteur maximale, l’implantation par rapport aux limites, les conditions d’accès et de stationnement. Elle est délivrée en deux jours ouvrables au plus, sur la base des données du demandeur, et ne vaut en aucun cas accord de principe pour un projet.'
      cites: [/ma/decret/2-18-577/art_6, /ma/decret/2-18-577/art_7, /ma/decret/2-18-577/art_8]
    - title: {ar: 'المهندس المعماري', fr: 'L’architecte'}
      answer: {ar: 'في الجماعات والمراكز المحددة ومناطقها المحيطة، لا تسلم رخصة البناء دون مهندس معماري حر مقيد في جدول الهيئة.', fr: 'Dans les communes, les centres délimités et leurs zones périphériques, pas de permis de construire sans un architecte libéral inscrit au tableau de l’Ordre.'}
      body:
        ar: 'في الجماعات والمراكز المحددة والمناطق المحيطة بها والمناطق ذات الصبغة الخاصة، تجب الاستعانة بمهندس معماري حر وبمهندسين مختصين في كل بناء جديد، وفي كل تغيير على بناء قائم يستوجب رخصة البناء، والاستعانة بمهندس معماري مقيد في جدول هيئة المهندسين المعماريين شرط للحصول على الرخصة. ويضع المهندس المعماري تصميم المبنى والوثائق التي تقدم إلى الجماعة، ويتابع تنفيذ الأشغال ومطابقتها للتصاميم ولبيانات الرخصة إلى حين تسليم رخصة السكن أو شهادة المطابقة. ويضع المهندسون المختصون الوثائق التقنية ويتتبعون الأشغال المتعلقة بها. وإذا كانت مساحة الأرضيات مجتمعة 150 مترا مربعا أو أقل، اقتصر وجوب الاستعانة بالمهندس المعماري على تصميم المبنى.'
        fr: 'Dans les communes, les centres délimités, leurs zones périphériques et les zones à caractère spécial, un architecte libéral et des ingénieurs spécialisés sont obligatoires pour toute construction nouvelle et pour toute modification d’un bâtiment existant soumise à permis ; le recours à un architecte inscrit au tableau de l’Ordre est une condition du permis. L’architecte conçoit le bâtiment, établit les pièces déposées à la commune, et suit l’exécution des travaux et leur conformité aux plans et au permis jusqu’au permis d’habiter ou au certificat de conformité. Les ingénieurs spécialisés établissent les documents techniques et suivent les travaux qui s’y rapportent. Lorsque la surface de planchers cumulée est de 150 mètres carrés ou moins, l’architecte n’est obligatoire que pour la conception.'
      cites: [/ma/loi/12-90/art_50, /ma/loi/12-90/art_53, /ma/loi/12-90/art_54]
    - title: {ar: 'شروط منح الرخصة', fr: 'Les conditions du permis'}
      answer: {ar: 'أن يطابق المشروع وثائق التعمير والضوابط، وأن تكون الأرض موصولة بشبكتي الصرف الصحي والماء الصالح للشرب.', fr: 'Que le projet respecte les documents d’urbanisme et les règlements, et que le terrain soit raccordé à l’assainissement et à l’eau potable.'}
      body:
        ar: 'تسلم رخصة البناء بعد التحقق من أن المبنى يستوفي الشروط التشريعية والتنظيمية، خصوصا ما في تصاميم التنطيق وتصاميم التهيئة، ودون إخلال بالرخص الأخرى التي تفرضها نصوص خاصة وبالآراء والتأشيرات المقررة. ولا تسلم إذا كانت الأرض غير موصولة بشبكة الصرف الصحي أو بشبكة توزيع الماء الصالح للشرب، إلا إذا توفرت في طريقة الصرف والتزويد ضمانات النظافة والصحة بعد رأي المصالح المختصة. وخارج دوائر الجماعات والمراكز المحددة والمناطق ذات الصبغة الخاصة، إذا لم يحدد تصميم التهيئة أو تصميم التنطيق غرض الأرض، تشترط مساحة دنيا للبقعة ومساحة مبنية وعلو يحددها نص تنظيمي، ويقام المبنى على بعد 10 أمتار من حد الطريق العام و5 أمتار من حدود العقارات المجاورة.'
        fr: 'Le permis est délivré après vérification que la construction remplit les conditions légales et réglementaires, notamment celles des plans de zonage et des plans d’aménagement, sans préjudice des autres autorisations prévues par des textes particuliers ni des avis et visas requis. Il n’est pas délivré si le terrain n’est raccordé ni à l’assainissement ni au réseau d’eau potable, sauf si le mode d’assainissement et d’alimentation offre les garanties d’hygiène et de salubrité, après avis des services compétents. Hors des périmètres des communes, des centres délimités et des zones à caractère spécial, lorsque le plan d’aménagement ou de zonage ne fixe pas l’affectation du terrain, une surface minimale de la parcelle, une surface bâtie et une hauteur fixées par voie réglementaire s’imposent, et le bâtiment est implanté à 10 mètres de la limite de la voie publique et à 5 mètres des propriétés voisines.'
      cites: [/ma/loi/12-90/art_43, /ma/loi/12-90/art_47, /ma/loi/12-90/art_46]
    - title: {ar: 'إيداع الملف', fr: 'Le dépôt du dossier'}
      answer: {ar: 'يقدم الطلب مالك العقار أو من يدلي بموافقته، ويودع بمكتب ضبط الجماعة أو الشباك الوحيد مقابل وصل مرقم ومؤرخ.', fr: 'La demande est présentée par le propriétaire ou par qui produit son accord ; elle se dépose au bureau d’ordre de la commune ou du guichet unique contre un récépissé numéroté et daté.'}
      body:
        ar: 'لا يمكن أن يقدم طلب الرخصة إلا مالك العقار المعني أو من يدلي بموافقته أو بوثيقة تبرر ذلك، كقرار إعلان المنفعة العامة. ويودع الملف بمكتب ضبط الجماعة، أو بمكتب ضبط الشباك الوحيد لرخص التعمير حيث يوجد، من طرف صاحب الشأن أو المهندس واضع تصور المشروع أو من انتدب لذلك، مقابل وصل إيداع مرقم ومؤرخ. ويعد الوصل شهادة باستلام الملف، بشرط أن يتضمن الوثائق الأساسية؛ ولا يستلم أي ملف ينقصه بعضها. أما الوثائق التكميلية فيمكن إرفاقها قبل تسليم الرخصة، وغياب إحداها لا يكون سببا لرفض الطلب.'
        fr: 'Seuls le propriétaire du terrain, ou qui produit son accord ou un document qui le justifie, comme un acte déclaratif d’utilité publique, peuvent demander le permis. Le dossier se dépose au bureau d’ordre de la commune, ou à celui du guichet unique des autorisations d’urbanisme là où il existe, par l’intéressé, l’architecte auteur du projet ou un mandataire, contre un récépissé numéroté et daté. Le récépissé vaut accusé de réception du dossier, à condition qu’il contienne les pièces essentielles ; un dossier incomplet en pièces essentielles n’est pas reçu. Les pièces complémentaires peuvent être jointes avant la délivrance du permis, et l’absence de l’une d’elles n’est jamais un motif de refus.'
      cites: [/ma/decret/2-18-577/art_5, /ma/decret/2-18-577/art_34, /ma/decret/2-18-577/art_37]
    - title: {ar: 'دراسة الملف', fr: 'L’instruction du dossier'}
      answer: {ar: 'مسكن لا يتجاوز 15.50 مترا وسفليا وثلاثة طوابق مشروع صغير يدرس فور إيداعه؛ وفي المشاريع الكبرى تبت اللجنة داخل خمسة عشر يوما مفتوحة.', fr: 'Un logement de 15,50 m au plus, rez-de-chaussée et trois étages, est un petit projet examiné dès son dépôt ; pour un grand projet, la commission statue dans les quinze jours ouvrables.'}
      body:
        ar: 'يصنف الضابط العام للبناء المشاريع إلى كبرى وصغرى. فمشاريع البناء المعدة للسكن التي لا يتجاوز علوها 15.50 مترا ولا مستوياتها سفليا وثلاثة طوابق، أو 18.50 مترا وسفليا وأربعة طوابق داخل تجزئة تم تسلم أشغال تجهيزها، مشاريع صغرى تعرض على لجنة الدراسة بمجرد إيداعها ويتداول بشأنها في حينه. وتدخل في المشاريع الكبرى، من بين أخرى، التجزئات وتقسيم العقارات والمباني المخصصة للأنشطة الاقتصادية وتسوية البنايات غير القانونية وكل مشروع لم يرد في قائمة المشاريع الصغرى. وفيها تحيل الجماعة الملف على لجنة الدراسة داخل ثلاثة أيام مفتوحة، وتبت اللجنة داخل خمسة عشر يوما مفتوحة تحتسب من تسلم الجماعة للملف.'
        fr: 'Le règlement général de construction classe les projets en grands et petits. Un projet de logement d’une hauteur de 15,50 m au plus et d’au plus un rez-de-chaussée et trois étages — 18,50 m et quatre étages dans un lotissement dont les équipements ont été réceptionnés — est un petit projet : il passe en commission d’instruction dès son dépôt et y est examiné sur-le-champ. Sont notamment de grands projets les lotissements, les morcellements, les bâtiments d’activités économiques, la régularisation des constructions irrégulières et tout projet absent de la liste des petits projets. Pour ceux-là, la commune transmet le dossier à la commission dans les trois jours ouvrables, et la commission statue dans les quinze jours ouvrables à compter de la réception du dossier par la commune.'
      cites: [/ma/decret/2-18-577/art_19, /ma/decret/2-18-577/art_18, /ma/decret/2-18-577/annex]
    - title: {ar: 'القرار، أو سكوت الرئيس', fr: 'La décision, ou le silence du président'}
      answer: {ar: 'يقرر رئيس مجلس الجماعة بعد الرأي الملزم للوكالة الحضرية؛ وإذا سكت شهرين من إيداع الطلب اعتبرت الرخصة مسلمة.', fr: 'Le président du conseil communal décide après l’avis conforme de l’agence urbaine ; s’il se tait deux mois après le dépôt de la demande, le permis est réputé accordé.'}
      body:
        ar: 'يسلم رخصة البناء رئيس مجلس الجماعة، ويوجه نسخة منها إلى السلطة الإدارية المحلية بعد تسليمها. ويقرر على ضوء آراء أعضاء لجنة الدراسة، ولا تسلم الرخصة في أي حال دون الرأي الملزم للوكالة الحضرية الذي يتقيد الرئيس بمضمونه وجوبا. وإذا أبدت اللجنة ملاحظات، وجه الرئيس إلى صاحب الشأن رسالة مضمونة داخل يومين مفتوحين من توصله بمحضرها لإدخال التعديلات، ولا تحتسب الآجال من جديد إلا من تاريخ إيداع التصاميم أو الوثائق المعدلة مقابل وصل. وفي حالة سكوت رئيس مجلس الجماعة، تعتبر رخصة البناء مسلمة عند انقضاء شهرين من تاريخ إيداع الطلب.'
        fr: 'Le permis de construire est délivré par le président du conseil communal, qui en adresse une copie à l’autorité administrative locale dès sa délivrance. Il décide au vu des avis des membres de la commission d’instruction, et le permis n’est en aucun cas délivré sans l’avis conforme de l’agence urbaine, que le président est tenu de suivre. Si la commission formule des observations, le président adresse à l’intéressé une lettre recommandée dans les deux jours ouvrables de la réception du procès-verbal, pour qu’il apporte les modifications ; les délais ne recommencent alors à courir qu’à partir du dépôt des plans ou pièces modifiés contre récépissé. Si le président du conseil communal garde le silence, le permis est réputé accordé à l’expiration de deux mois à compter du dépôt de la demande.'
      cites: [/ma/loi/12-90/art_41, /ma/decret/2-18-577/art_39, /ma/decret/2-18-577/art_41, /ma/loi/12-90/art_48]
      delay: {months: 2, on_day: true, from: {ar: 'من تاريخ إيداع الطلب', fr: 'à compter du dépôt de la demande'}}
      tool: tools/permit
    - title: {ar: 'سنة لبدء الأسس، ثم الورش', fr: 'Un an pour les fondations, puis le chantier'}
      answer: {ar: 'تسقط الرخصة، صريحة كانت أو ضمنية، إذا مرت سنة دون الشروع في أشغال الأسس.', fr: 'Le permis, exprès ou tacite, devient caduc si les travaux de fondation n’ont pas commencé dans l’année.'}
      body:
        ar: 'تسقط رخصة البناء، صريحة كانت أم ضمنية، إذا انقضت سنة من تاريخ تسليمها، أو من انتهاء أجل الشهرين في حالة السكوت، دون الشروع في أشغال أسس المبنى المنصوص عليها في التصميم المرخص. وتلزم الرخصة صاحبها، قبل انطلاق الأشغال، بإيداع تصريح بافتتاح الورش بمقر الجماعة مقابل وصل مؤرخ ومرقم، يوقعه المهندس المعماري المشرف حين تكون الاستعانة به واجبة، وبوضع سياج حول الورش ولوحة عند مدخله تبين رقم الرخصة وتاريخها وعدد الطوابق والمساحة المغطاة واسم صاحب المشروع والمهندس. وطيلة الأشغال، توضع داخل الورش الوثائق المرخصة الحاملة لعبارة «غير قابل للتغيير». وعند الانتهاء، يودع بالجماعة تصريح بإغلاق الورش وانتهاء الأشغال يشهد فيه المهندس المعماري أن الأشغال أنجزت وفق التصاميم المرخصة.'
        fr: 'Le permis, exprès ou tacite, devient caduc si, un an après sa délivrance ou après la fin des deux mois de silence, les travaux de fondation prévus au plan autorisé n’ont pas commencé. Avant l’ouverture du chantier, le permis oblige son titulaire à déposer à la commune, contre un récépissé daté et numéroté, une déclaration d’ouverture de chantier signée par l’architecte lorsque celui-ci est obligatoire, et à clôturer le chantier avec, à l’entrée, un panneau portant le numéro et la date du permis, le nombre d’étages, la surface couverte, le nom du maître d’ouvrage et celui de l’architecte. Pendant les travaux, les plans autorisés portant la mention «ne varietur» restent sur le chantier. À la fin, une déclaration de fermeture du chantier et d’achèvement des travaux est déposée à la commune, l’architecte y attestant que les travaux sont conformes aux plans autorisés.'
      cites: [/ma/loi/12-90/art_49, /ma/loi/12-90/art_1-54]
      delay: {months: 12, from: {ar: 'من تسليم الرخصة أو من انقضاء الشهرين', fr: 'à compter de la délivrance du permis ou de la fin des deux mois'}}
      tool: tools/permit
    - title: {ar: 'رخصة السكن أو شهادة المطابقة', fr: 'Le permis d’habiter ou le certificat de conformité'}
      answer: {ar: 'لا يستعمل المبنى بعد انتهاء الأشغال إلا برخصة السكن، أو بشهادة المطابقة إذا كان لغير السكن.', fr: 'Une fois les travaux finis, le bâtiment ne s’utilise qu’avec le permis d’habiter, ou le certificat de conformité s’il n’est pas destiné à l’habitation.'}
      body:
        ar: 'يسلم رئيس مجلس الجماعة رخصة السكن أو شهادة المطابقة بطلب من المالك يعد تصريحا بانتهاء الأشغال، يودع بمكتب ضبط الجماعة أو الشباك الوحيد مقابل وصل مرقم ومؤرخ. وتحرر بعد معاينة تتحقق من أن الأشغال أنجزت وفق ما يجب؛ وإذا تولى مهندس معماري إدارة الأشغال، اكتفى الرئيس بشهادته على أنها أنجزت وفق التصاميم المرخصة. ويخبر الرئيس صاحب الشأن بتاريخ انعقاد لجنة المعاينة داخل ثلاثة أيام مفتوحة من الإيداع. وإذا لم تسلم الرخصة أو الشهادة داخل شهر من التصريح بانتهاء البناء، جاز للمالك أن يطلب من العامل أن يحل محل رئيس الجماعة، بعد استنفاد الإجراءات المنصوص عليها في المادة 76 من القانون التنظيمي المتعلق بالجماعات.'
        fr: 'Le président du conseil communal délivre le permis d’habiter ou le certificat de conformité sur demande du propriétaire valant déclaration d’achèvement des travaux, déposée au bureau d’ordre de la commune ou du guichet unique contre un récépissé numéroté et daté. Ils sont établis après une visite qui vérifie que les travaux ont été bien exécutés ; lorsqu’un architecte a dirigé les travaux, le président s’en tient à son attestation de conformité aux plans autorisés. Le président informe l’intéressé de la date de la commission de visite dans les trois jours ouvrables du dépôt. Si le permis ou le certificat n’est pas délivré dans le mois de la déclaration d’achèvement, le propriétaire peut demander au gouverneur de se substituer au président de la commune, après épuisement de la procédure de l’article 76 de la loi organique relative aux communes.'
      cites: [/ma/loi/12-90/art_55, /ma/decret/2-18-577/art_48, /ma/decret/2-18-577/art_50]
      delay: {months: 1, from: {ar: 'من التصريح بانتهاء البناء', fr: 'à compter de la déclaration d’achèvement'}}
      tool: tools/permit
  ends: {office: commune, paper: {ar: 'رخصة البناء مع الوثائق الحاملة لعبارة «غير قابل للتغيير»، ثم رخصة السكن أو شهادة المطابقة', fr: 'Le permis de construire avec les plans portant la mention «ne varietur», puis le permis d’habiter ou le certificat de conformité'}, cites: [/ma/decret/2-18-577/art_44, /ma/loi/12-90/art_55]}
  next: [journeys/nopermit, journeys/divide, journeys/plan]

- key: nopermit
  for: [titled, pending, untitled, unknown]
  title: {ar: 'البناء دون رخصة: المعاينة والأوامر والعقوبات', fr: 'Construire sans permis : constat, ordres et sanctions'}
  lead:
    ar: 'البناء دون رخصة أو خلافا لها، واستعمال المبنى دون رخصة السكن، مخالفات يعاينها ضباط الشرطة القضائية ومراقبو التعمير. يأمر المراقب بإيقاف الأشغال، وقد يمنح أجلا لإنهاء المخالفة يليه الهدم، وتحكم المحكمة عند الإدانة بالغرامة وبالهدم على نفقة المخالف.'
    fr: 'Construire sans permis ou contre son permis, et utiliser le bâtiment sans permis d’habiter, sont des infractions constatées par les officiers de police judiciaire et les contrôleurs de l’urbanisme. Le contrôleur ordonne l’arrêt des travaux et peut accorder un délai pour mettre fin à l’infraction, suivi de la démolition ; en cas de condamnation, le tribunal prononce l’amende et la démolition aux frais du contrevenant.'
  steps:
    - title: {ar: 'ما يعد مخالفة', fr: 'Ce qui est une infraction'}
      answer: {ar: 'البناء أو الشروع فيه دون رخصة، أو خلافا لوثائقها، أو في منطقة لا يباح فيها، أو فوق ملك الدولة أو الجماعات الترابية أو أراضي الجماعات السلالية؛ واستعمال المبنى دون رخصة السكن.', fr: 'Construire ou commencer à construire sans permis, contre ses plans, dans une zone non constructible, ou sur un bien de l’État, des collectivités territoriales ou des collectivités soulaliyates ; et utiliser le bâtiment sans permis d’habiter.'}
      body:
        ar: 'يعد مخالفة لقانون التعمير إنجاز بناء أو الشروع فيه من غير رخصة سابقة، أو دون احترام الوثائق المكتوبة والمرسومة للرخصة، أو في منطقة غير قابلة لذلك بموجب النظم المقررة، أو فوق ملك عام أو خاص للدولة والجماعات الترابية أو أرض تابعة للجماعات السلالية دون الرخصة الواجبة. ويعد مخالفة أيضا استعمال البناية دون رخصة السكن أو شهادة المطابقة، والإخلال بمسك دفتر الورش، والأعمال الممنوعة في الأراضي التي يشملها قرار تخطيط حدود طريق عامة. والرخصة لازمة كذلك لكل تغيير يمس واجهة بناية، ولتغيير بناء قائم إذا مس العناصر المنصوص عليها في الضوابط.'
        fr: 'Est une infraction en matière d’urbanisme le fait de construire ou de commencer à construire sans permis préalable, sans respecter les pièces écrites et graphiques du permis, dans une zone où la réglementation l’interdit, ou sur un bien du domaine public ou privé de l’État et des collectivités territoriales ou une terre des collectivités soulaliyates sans l’autorisation requise. Sont aussi des infractions l’utilisation d’un bâtiment sans permis d’habiter ou certificat de conformité, le défaut de tenue du cahier de chantier et les travaux interdits sur les terrains frappés par un plan d’alignement de voie publique. Le permis est également exigé pour toute modification d’une façade et pour toute modification d’un bâtiment existant touchant les éléments visés par les règlements.'
      cites: [/ma/loi/12-90/art_64, /ma/loi/12-90/art_40]
    - title: {ar: 'من يعاين، وكيف', fr: 'Qui constate, et comment'}
      answer: {ar: 'ضباط الشرطة القضائية ومراقبو التعمير، من تلقاء أنفسهم أو بشكاية من أي شخص؛ ويوجه المحضر إلى وكيل الملك وتسلم نسخة منه للمخالف.', fr: 'Les officiers de police judiciaire et les contrôleurs de l’urbanisme, d’office ou sur la plainte de toute personne ; le procès-verbal va au procureur du Roi, et une copie au contrevenant.'}
      body:
        ar: 'يعاين المخالفات ويحرر محاضرها ضباط الشرطة القضائية، ومراقبو التعمير التابعون للوالي أو العامل أو الإدارة المخولة لهم صفة ضابط الشرطة القضائية، ولهؤلاء أن يطلبوا تسخير القوة العمومية. ويعمل المراقب من تلقاء نفسه، أو بطلب من السلطة الإدارية المحلية أو رئيس المجلس الجماعي أو مدير الوكالة الحضرية، أو بناء على شكاية من أي شخص. ولا تعاين مخالفة داخل محل معتمر إلا بإذن كتابي من النيابة العامة المختصة. ويوجه المراقب أصل المحضر إلى وكيل الملك داخل ثلاثة أيام على الأكثر من المعاينة، ونسخا منه إلى السلطة الإدارية المحلية ورئيس المجلس الجماعي ومدير الوكالة الحضرية والمخالف.'
        fr: 'Les infractions sont constatées par procès-verbal par les officiers de police judiciaire et par les contrôleurs de l’urbanisme relevant du wali, du gouverneur ou de l’administration et dotés de la qualité d’officier de police judiciaire, qui peuvent requérir la force publique. Le contrôleur agit d’office, à la demande de l’autorité administrative locale, du président du conseil communal ou du directeur de l’agence urbaine, ou sur la plainte de toute personne. Une infraction dans un local habité ne se constate que sur autorisation écrite du ministère public compétent. Le contrôleur adresse l’original du procès-verbal au procureur du Roi dans les trois jours au plus du constat, et une copie à l’autorité administrative locale, au président du conseil communal, au directeur de l’agence urbaine et au contrevenant.'
      cites: [/ma/loi/12-90/art_65, /ma/loi/12-90/art_66]
    - title: {ar: 'الأمر بإيقاف الأشغال', fr: 'L’ordre d’arrêt des travaux'}
      answer: {ar: 'إذا كانت الأشغال جارية، يأمر المراقب أو ضابط الشرطة القضائية بإيقافها في الحال؛ وإذا لم تتوقف، أمكن حجز المعدات وإغلاق الورش.', fr: 'Si les travaux sont en cours, le contrôleur ou l’officier de police judiciaire en ordonne l’arrêt immédiat ; s’ils continuent, le matériel peut être saisi et le chantier fermé.'}
      body:
        ar: 'مباشرة بعد المعاينة، إذا كانت أشغال البناء المكونة للمخالفة ما زالت جارية، يصدر المراقب أو ضابط الشرطة القضائية أمرا بإيقافها في الحال، يوجه إلى المخالف مرفقا بنسخة من المحضر، ويبلغ إلى السلطة الإدارية المحلية ورئيس المجلس الجماعي ومدير الوكالة الحضرية. وإذا لم ينفذ المخالف الأمر، يمكن للمراقب حجز المعدات والأدوات ومواد البناء وإغلاق الورش ووضع الأختام عليه، ويحرر بذلك محضرا يوجهه إلى وكيل الملك. ويمكن للمخالف أن يطلب من الجهة القضائية المختصة إعادة فتح الورش ورفع الحجز. وفي حالة الحكم بالإدانة، تأمر المحكمة بمصادرة الأشياء المحجوزة مع حفظ حقوق الأشخاص حسني النية.'
        fr: 'Dès le constat, si les travaux constituant l’infraction sont encore en cours, le contrôleur ou l’officier de police judiciaire en ordonne l’arrêt immédiat, par un ordre adressé au contrevenant avec une copie du procès-verbal et notifié à l’autorité administrative locale, au président du conseil communal et au directeur de l’agence urbaine. Si le contrevenant n’obéit pas, le contrôleur peut saisir le matériel, les outils et les matériaux, fermer le chantier et y apposer les scellés, et en dresse un procès-verbal adressé au procureur du Roi. Le contrevenant peut demander à la juridiction compétente la réouverture du chantier et la mainlevée de la saisie. En cas de condamnation, le tribunal ordonne la confiscation des objets saisis, sous réserve des droits des tiers de bonne foi.'
      cites: [/ma/loi/12-90/art_67]
    - title: {ar: 'أجل لإنهاء المخالفة، ثم الهدم', fr: 'Un délai pour mettre fin à l’infraction, puis la démolition'}
      answer: {ar: 'إذا أمكن تدارك المخالفة، يمنح المراقب أجلا بين عشرة أيام وشهر؛ وإذا لم ينفذ الأمر، تأمر السلطة الإدارية المحلية بالهدم على نفقة المخالف.', fr: 'Si l’infraction peut être réparée, le contrôleur accorde un délai de dix jours à un mois ; à défaut, l’autorité administrative locale ordonne la démolition aux frais du contrevenant.'}
      body:
        ar: 'إذا كانت المخالفة يمكن تداركها لأنها لا تمثل إخلالا خطيرا بالضوابط، يأمر المراقب المخالف باتخاذ التدابير اللازمة لإنهائها في أجل لا يقل عن عشرة أيام ولا يتجاوز شهرا. وإذا لم ينفذ الأمر عند انتهاء الأجل، تصدر السلطة الإدارية المحلية أمرا بالهدم يحدد أجل إنجازه؛ فإن لم ينجز، تولته لجنة إدارية يرأسها الوالي أو العامل داخل 48 ساعة على نفقة المخالف، وتحصل المصاريف بأمر بتحصيل المداخيل. وتطبق مقتضيات الهدم هذه على البناء دون رخصة، وعلى البناء المخالف للرخصة في العلو أو بزيادة طابق أو في المواقع أو المساحة أو المتانة أو المواد المحظورة أو الغرض. أما البناء دون رخصة فوق ملك الدولة أو الجماعات الترابية أو أراضي الجماعات السلالية، أو في منطقة غير قابلة للبناء بموجب وثائق التعمير، فتهدمه السلطة الإدارية المحلية تلقائيا وعلى نفقة المخالف. ولا يحول الهدم دون تحريك الدعوى العمومية، ولا يسقطها إذا كانت جارية.'
        fr: 'Si l’infraction peut être réparée parce qu’elle ne constitue pas une atteinte grave aux règles, le contrôleur ordonne au contrevenant de prendre les mesures pour y mettre fin dans un délai d’au moins dix jours et d’au plus un mois. Si l’ordre n’est pas exécuté à l’échéance, l’autorité administrative locale ordonne la démolition et en fixe le délai ; à défaut, une commission administrative présidée par le wali ou le gouverneur y procède dans les 48 heures aux frais du contrevenant, les frais étant recouvrés par ordre de recettes. Ces règles de démolition s’appliquent à la construction sans permis et à la construction contraire au permis par la hauteur, un étage en plus, l’implantation, la surface, la solidité, les matériaux interdits ou l’affectation. La construction sans autorisation sur un bien de l’État, des collectivités territoriales ou des collectivités soulaliyates, ou dans une zone non constructible selon les documents d’urbanisme, est démolie d’office par l’autorité administrative locale aux frais du contrevenant. La démolition n’empêche pas l’action publique et ne l’éteint pas si elle est engagée.'
      cites: [/ma/loi/12-90/art_68, /ma/loi/12-90/art_70, /ma/loi/12-90/art_69]
    - title: {ar: 'الغرامات', fr: 'Les amendes'}
      answer: {ar: 'البناء دون رخصة: من 10.000 إلى 100.000 درهم؛ وخلافا للرخصة: من 10.000 إلى 50.000 درهم، والحبس أو الغرامة حتى 100.000 درهم لزيادة طابق.', fr: 'Construire sans permis : de 10 000 à 100 000 dirhams ; contre le permis : de 10 000 à 50 000 dirhams, et la prison ou une amende jusqu’à 100 000 dirhams pour un étage en plus.'}
      body:
        ar: 'يعاقب بغرامة من 10.000 إلى 100.000 درهم من باشر بناء أو شيده دون رخصة سابقة أو في منطقة غير قابلة للبناء، ومن أدخل تغييرات على بناء قائم دون رخصة البناء؛ وإذا عاد إلى نفس المخالفة داخل السنة الموالية لصيرورة الحكم الأول مكتسبا لقوة الشيء المقضي به، عوقب بالحبس من شهر إلى ثلاثة أشهر. ومن شيد خلافا لرخصته بتغيير العلو أو الأحجام أو المواقع أو المساحة أو الغرض، يعاقب بغرامة من 10.000 إلى 50.000 درهم؛ وإذا زاد طابقا أو أكثر، فبالحبس من شهر إلى ثلاثة أشهر وبغرامة من 50.000 إلى 100.000 درهم أو بإحداهما فقط. وكل تغيير في واجهة بناية دون رخصة يعاقب عليه بغرامة من 2.000 إلى 20.000 درهم.'
        fr: 'Est puni d’une amende de 10 000 à 100 000 dirhams quiconque entreprend ou édifie une construction sans permis préalable ou dans une zone non constructible, ou modifie un bâtiment existant sans permis de construire ; en cas de récidive dans l’année qui suit le jour où le premier jugement est passé en force de chose jugée, la peine est d’un à trois mois d’emprisonnement. Le titulaire d’un permis qui construit contre celui-ci en changeant la hauteur, les volumes, l’implantation, la surface ou l’affectation est puni d’une amende de 10 000 à 50 000 dirhams ; s’il ajoute un ou plusieurs étages, d’un à trois mois d’emprisonnement et d’une amende de 50 000 à 100 000 dirhams, ou de l’une de ces deux peines. Toute modification d’une façade sans autorisation est punie d’une amende de 2 000 à 20 000 dirhams.'
      cites: [/ma/loi/12-90/art_71, /ma/loi/12-90/art_72, /ma/loi/12-90/art_73]
    - title: {ar: 'السكن قبل الرخصة، والبناء فوق ملك الدولة', fr: 'Occuper sans permis d’habiter, bâtir sur le bien de l’État'}
      answer: {ar: 'المالك الذي يستعمل مبناه دون رخصة السكن: من 2.000 إلى 10.000 درهم، ومن 10.000 إلى 100.000 درهم إذا وضعه في متناول الغير.', fr: 'Le propriétaire qui utilise son bâtiment sans permis d’habiter : de 2 000 à 10 000 dirhams, et de 10 000 à 100 000 dirhams s’il le met à la disposition d’autrui.'}
      body:
        ar: 'يعاقب بغرامة من 2.000 إلى 10.000 درهم مالك المبنى الذي يستعمله لنفسه دون رخصة السكن أو شهادة المطابقة، وبغرامة من 10.000 إلى 100.000 درهم إذا جعله في متناول الغير قبل الحصول عليها. ويعاقب بغرامة من 100.000 إلى 200.000 درهم على إقامة بناية فوق ملك عام أو خاص للدولة أو الجماعات الترابية أو فوق أراضي الجماعات السلالية دون الرخص المنصوص عليها في القوانين. ويعاقب بغرامة من 5.000 إلى 10.000 درهم على الإخلال بمسك دفتر الورش، وبضعفها إذا مست المخالفة الأنسجة التقليدية أو المعالم التاريخية ومحيطها.'
        fr: 'Le propriétaire qui utilise lui-même son bâtiment sans permis d’habiter ou certificat de conformité est puni d’une amende de 2 000 à 10 000 dirhams, et de 10 000 à 100 000 dirhams s’il le met à la disposition d’autrui avant de l’avoir obtenu. Édifier un bâtiment sur un bien du domaine public ou privé de l’État ou des collectivités territoriales, ou sur une terre des collectivités soulaliyates, sans les autorisations prévues par la loi, est puni d’une amende de 100 000 à 200 000 dirhams. Le défaut de tenue du cahier de chantier est puni d’une amende de 5 000 à 10 000 dirhams, doublée si l’infraction touche les tissus traditionnels ou les monuments historiques et leurs abords.'
      cites: [/ma/loi/12-90/art_75, /ma/loi/12-90/art_77, /ma/loi/12-90/art_76]
    - title: {ar: 'من يعاقب معه', fr: 'Qui est puni avec lui'}
      answer: {ar: 'رب العمل والمقاول والمهندس المعماري والمهندس المختص والمهندس المساح الطبوغرافي شركاء إذا لم يبلغوا عن المخالفة، ومعهم من أمر بها أو سهلها.', fr: 'Le maître d’ouvrage, l’entrepreneur, l’architecte, l’ingénieur spécialisé et l’ingénieur géomètre-topographe sont complices s’ils ne signalent pas l’infraction, comme ceux qui l’ont ordonnée ou facilitée.'}
      body:
        ar: 'علاوة على حالات المشاركة في الفصل 129 من مجموعة القانون الجنائي، يعد شريكا لمرتكب المخالفة ويعاقب بنفس العقوبة رب العمل والمقاول الذي أنجز الأشغال والمهندس المعماري والمهندس المختص والمهندس المساح الطبوغرافي، إذا لم يبلغوا عن المخالفة داخل الأجل الذي تحدده المادة من علمهم بارتكابها. ويعد شريكا كذلك كل من صدرت عنه أوامر نتجت عنها المخالفة، والأشخاص الذين سهلوا البناء المخالف للقانون أو ساهموا فيه. ويعاقب المشاركون بعقوبات الفاعلين الأصليين ما لم يتعلق الأمر بجريمة أشد.'
        fr: 'Outre les cas de l’article 129 du Code pénal, sont complices de l’auteur de l’infraction et punis de la même peine le maître d’ouvrage, l’entrepreneur qui a exécuté les travaux, l’architecte, l’ingénieur spécialisé et l’ingénieur géomètre-topographe, s’ils ne signalent pas l’infraction dans le délai fixé par l’article à compter du moment où ils en ont connaissance. Sont aussi complices ceux dont les ordres ont causé l’infraction et les personnes qui ont facilité la construction illégale ou y ont contribué. Les complices encourent les peines des auteurs principaux, sauf crime plus grave.'
      cites: [/ma/loi/12-90/art_78]
    - title: {ar: 'أمام المحكمة', fr: 'Devant le tribunal'}
      answer: {ar: 'عند الإدانة، تحكم المحكمة وجوبا بهدم البناء المخالف وإعادة الحالة على نفقة المخالف، وتضاعف العقوبات عند العود داخل سنة.', fr: 'En cas de condamnation, le tribunal ordonne obligatoirement la démolition et la remise en état aux frais du contrevenant ; les peines doublent en cas de récidive dans l’année.'}
      body:
        ar: 'دون إخلال بالعقوبات، يجب على المحكمة في حالة الإدانة أن تحكم، على نفقة المخالف، بهدم الأبنية موضوع المخالفة وإعادة الحالة إلى ما كانت عليه، وتتولى اللجنة الإدارية الهدم على نفقة المخالف بعد توصلها بالمقرر القضائي النهائي. وتضم الغرامات المحكوم بها عند تعدد الأفعال المرتكبة. وتضاعف العقوبات إذا عاد المخالف إلى اقتراف مخالفة مماثلة داخل السنة الموالية لصيرورة الحكم الأول مكتسبا لقوة الشيء المقضي به.'
        fr: 'Sans préjudice des peines, le tribunal doit, en cas de condamnation, ordonner aux frais du contrevenant la démolition des constructions en infraction et la remise des lieux en l’état ; la commission administrative procède à la démolition aux frais du contrevenant après réception de la décision judiciaire définitive. Les amendes prononcées pour plusieurs faits se cumulent. Les peines sont doublées si le contrevenant commet une infraction semblable dans l’année qui suit le jour où le premier jugement est passé en force de chose jugée.'
      cites: [/ma/loi/12-90/art_1-80, /ma/loi/12-90/art_79, /ma/loi/12-90/art_80]
      delay: {months: 12, from: {ar: 'من صيرورة الحكم الأول مكتسبا لقوة الشيء المقضي به', fr: 'à compter du jour où le premier jugement est passé en force de chose jugée'}}
    - title: {ar: 'رخصة التسوية', fr: 'L’autorisation de régularisation'}
      answer: {ar: 'يجوز لرئيس المجلس الجماعي، بطلب من المعني، أن يسلم رخصة تسوية لبناية غير قانونية بعد موافقة الوكالة الحضرية.', fr: 'Le président du conseil communal peut, sur demande de l’intéressé, délivrer une autorisation de régularisation d’une construction irrégulière, après accord de l’agence urbaine.'}
      body:
        ar: 'يجوز لرئيس المجلس الجماعي، بناء على طلب يقدمه المعني بالأمر، أن يسلم رخصة تسوية بنايات غير قانونية، بعد موافقة الوكالة الحضرية المعنية، وفق إجراءات وكيفيات يحددها نص تنظيمي. وتحل رخصة التسوية محل رخصة السكن أو شهادة المطابقة. ويدرج الضابط العام للبناء مشاريع تسوية البنايات غير القانونية، كيفما كان نوعها، ضمن مسطرة المشاريع الكبرى، سواء أنجزت دون رخصة بناء أو دون احترام المستندات التي سلمت على أساسها.'
        fr: 'Le président du conseil communal peut, sur demande de l’intéressé, délivrer une autorisation de régularisation de constructions irrégulières, après accord de l’agence urbaine concernée, selon une procédure fixée par voie réglementaire. L’autorisation de régularisation tient lieu de permis d’habiter ou de certificat de conformité. Le règlement général de construction range la régularisation des constructions irrégulières, quelle qu’en soit la nature, dans la procédure des grands projets, qu’elles aient été bâties sans permis ou sans respecter les pièces du permis.'
      cites: [/ma/loi/12-90/art_40, /ma/loi/12-90/art_55, /ma/decret/2-18-577/annex]
      next: journeys/build
  ends: {office: court, paper: {ar: 'نسخة محضر المعاينة الموجهة إلى المخالف، والأوامر المبلغة إليه', fr: 'La copie du procès-verbal de constat adressée au contrevenant, et les ordres qui lui ont été notifiés'}, cites: [/ma/loi/12-90/art_66, /ma/loi/12-90/art_67]}
  next: [journeys/build, journeys/plan]

- key: plan
  for: [titled, pending, untitled, unknown]
  title: {ar: 'أرضي في تصميم التهيئة', fr: 'Mon terrain dans un plan d’aménagement'}
  lead:
    ar: 'تصميم التهيئة يحدد ما تستعمل له كل منطقة، والطرق والمساحات الخضراء ومواقع التجهيزات العامة. والنص القاضي بالموافقة عليه يعتبر إعلانا بالمنفعة العامة لإنجاز الطرق والمساحات الخضراء والملاعب والتجهيزات العامة، وتنتهي آثار هذا الإعلان بعد عشر سنوات من نشره في الجريدة الرسمية.'
    fr: 'Le plan d’aménagement fixe l’usage de chaque zone, les voies, les espaces verts et les emplacements des équipements publics. Le texte qui l’approuve vaut déclaration d’utilité publique pour réaliser les voies, les espaces verts, les terrains de sport et les équipements publics ; les effets de cette déclaration prennent fin dix ans après sa publication au Bulletin officiel.'
  steps:
    - title: {ar: 'ما يحدده تصميم التهيئة', fr: 'Ce que fixe le plan d’aménagement'}
      answer: {ar: 'تخصيص المناطق، والمناطق التي يمنع فيها البناء، والطرق والمساحات الخضراء، ومواقع التجهيزات العامة، وضوابط البناء.', fr: 'L’affectation des zones, les zones où toute construction est interdite, les voies et espaces verts, les emplacements des équipements publics et les règles de construction.'}
      body:
        ar: 'يوضع تصميم التهيئة لجماعة أو مركز أو منطقة كلها أو بعضها. ويحدد كلا أو بعضا مما يلي: تخصيص المناطق بحسب الغرض (سكنية، صناعية، تجارية، سياحية، زراعية، غابوية)، والمناطق التي يحظر فيها البناء، وحدود الطرق والساحات ومواقف السيارات، والمساحات الخضراء العامة وميادين الألعاب، والمساحات المخصصة للنشاطات الرياضية، ومواقع التجهيزات العامة كالسكك الحديدية والتجهيزات الصحية والتعليمية والمباني الإدارية والمساجد والمقابر، وضوابط استعمال الأراضي والبناء، والارتفاقات، والقطاعات الواجب إعادة هيكلتها أو تجديدها. ويشتمل على وثائق من رسوم بيانية، وعلى نظام يحدد ضوابط استعمال الأراضي والارتفاقات والالتزامات وقواعد البناء.'
        fr: 'Le plan d’aménagement est établi pour tout ou partie d’une commune, d’un centre ou d’une zone. Il fixe tout ou partie de ce qui suit : l’affectation des zones selon leur usage (habitat, industrie, commerce, tourisme, agriculture, forêt), les zones où toute construction est interdite, les limites des voies, places et parcs de stationnement, les espaces verts publics et aires de jeux, les espaces réservés aux activités sportives, les emplacements des équipements publics tels que les chemins de fer, les équipements sanitaires et scolaires, les bâtiments administratifs, les mosquées et les cimetières, les règles d’utilisation du sol et de construction, les servitudes, et les secteurs à restructurer ou à rénover. Il comprend des documents graphiques et un règlement qui fixe les règles d’utilisation du sol, les servitudes, les obligations et les règles de construction.'
      cites: [/ma/loi/12-90/art_18, /ma/loi/12-90/art_19, /ma/loi/12-90/art_20]
    - title: {ar: 'قرار الدراسة: تأجيل الطلبات', fr: 'La décision d’étude : les demandes en attente'}
      answer: {ar: 'من نشر قرار دراسة التصميم، يؤجل رئيس مجلس الجماعة البت في طلبات البناء والتجزئة في الرقعة المعنية، ستة أشهر قابلة للتجديد مرة.', fr: 'Dès la publication de la décision d’étude du plan, le président du conseil communal sursoit à statuer sur les demandes de construire et de lotir dans la zone, pour six mois renouvelables une fois.'}
      body:
        ar: 'قبل وضع تصميم التهيئة، يجوز أن يصدر رئيس مجلس الجماعة، بعد مداولة المجلس، قرارا بالقيام بدراسته يعين حدود الرقعة التي يشملها. ويستمر مفعول هذا القرار ستة أشهر من نشره في الجريدة الرسمية، ويجوز تجديده مرة واحدة لمدة مساوية. وفور نشره، يؤجل رئيس مجلس الجماعة البت في جميع الطلبات الرامية إلى إحداث تجزئة أو مجموعة سكنية أو إقامة بناء في الرقعة المعنية. غير أنه يمكنه الإذن فيها بعد موافقة الإدارة إذا كان المشروع يتلاءم مع مخطط توجيه التهيئة العمرانية، أو مع ما يصلح له القطاع فعلا عند عدم وجوده.'
        fr: 'Avant l’établissement du plan d’aménagement, le président du conseil communal peut, après délibération du conseil, décider de son étude et fixer les limites du territoire concerné. Cette décision produit effet six mois à compter de sa publication au Bulletin officiel et peut être renouvelée une fois pour la même durée. Dès sa publication, le président du conseil communal sursoit à statuer sur toute demande de lotissement, de groupe d’habitations ou de construction dans le territoire concerné. Il peut toutefois les autoriser, après accord de l’administration, si le projet est conforme au schéma directeur d’aménagement urbain ou, à défaut, à la vocation effective du secteur.'
      cites: [/ma/loi/12-90/art_21, /ma/loi/12-90/art_22]
    - title: {ar: 'البحث العلني: شهر', fr: 'L’enquête publique : un mois'}
      answer: {ar: 'مشروع التصميم يعرض على العموم في بحث علني يستمر شهرا لإبداء الملاحظات، ويدرسها مجلس الجماعة قبل عرضها على الإدارة.', fr: 'Le projet de plan est soumis au public dans une enquête d’un mois pour recueillir ses observations, que le conseil communal examine avant de les transmettre à l’administration.'}
      body:
        ar: 'يحال مشروع تصميم التهيئة، قبل موافقة الإدارة عليه، إلى مجلس الجماعة أو مجالس الجماعات المعنية، ولها أن تبدي اقتراحاتها داخل شهرين من إحالته إليها، وسكوتها بعد الأجل يحمل على أنه ليس لها اقتراح. ويكون المشروع محل بحث علني يستمر شهرا ويجري خلال المدة التي يدرسه فيها المجلس، غرضه إطلاع العموم على المشروع وتمكينه من إبداء ملاحظاته. وعلى رئيس مجلس الجماعة أن يوفر وسائل النشر والإشهار قبل بدء البحث. ويدرس المجلس الملاحظات المعبر عنها خلال البحث قبل عرضها على الإدارة.'
        fr: 'Avant son approbation par l’administration, le projet de plan d’aménagement est soumis au conseil communal ou aux conseils communaux concernés, qui peuvent faire leurs propositions dans les deux mois ; leur silence passé ce délai vaut absence de proposition. Le projet fait l’objet d’une enquête publique d’un mois, menée pendant son examen par le conseil, pour le faire connaître au public et lui permettre de présenter ses observations. Le président du conseil communal assure les moyens de publicité avant l’ouverture de l’enquête. Le conseil examine les observations recueillies pendant l’enquête avant de les soumettre à l’administration.'
      cites: [/ma/loi/12-90/art_24, /ma/loi/12-90/art_25]
      delay: {months: 1, from: {ar: 'من بدء البحث العلني', fr: 'à compter de l’ouverture de l’enquête publique'}}
    - title: {ar: 'بين البحث والمصادقة', fr: 'Entre l’enquête et l’approbation'}
      answer: {ar: 'من اختتام البحث، لا يؤذن في بناء أو غرس أو تجزئة يخالف المشروع؛ وإذا لم ينشر نص المصادقة داخل اثني عشر شهرا صار المشروع غير لازم.', fr: 'Dès la clôture de l’enquête, aucune construction, plantation ou lotissement contraire au projet ne peut être autorisé ; si le texte d’approbation n’est pas publié dans les douze mois, le projet cesse de s’imposer.'}
      body:
        ar: 'ابتداء من تاريخ اختتام البحث العلني وإلى صدور النص القاضي بالمصادقة على تصميم التهيئة، لا يجوز الإذن في أي عمل من أعمال البناء أو الغرس أو إحداث تجزئات أو مجموعات سكنية إذا كان يخالف أحكام المشروع. وينتهي من التاريخ نفسه العمل بتصميم التهيئة أو التنطيق الساري إذاك. غير أنه إذا لم ينشر نص المصادقة خلال اثني عشر شهرا من اختتام البحث العلني، صارت أحكام المشروع غير لازمة التطبيق. ويتم تغيير تصميم التهيئة وفق الإجراءات والشروط المقررة لوضعه والموافقة عليه.'
        fr: 'De la clôture de l’enquête publique jusqu’au texte approuvant le plan d’aménagement, aucune construction, plantation, lotissement ou groupe d’habitations contraire au projet ne peut être autorisé. Le plan d’aménagement ou le zonage alors en vigueur cesse de s’appliquer à la même date. Toutefois, si le texte d’approbation n’est pas publié dans les douze mois de la clôture de l’enquête, les dispositions du projet cessent de s’imposer. Le plan d’aménagement est modifié selon la procédure et les conditions prévues pour son établissement et son approbation.'
      cites: [/ma/loi/12-90/art_27, /ma/loi/12-90/art_26]
      delay: {months: 12, from: {ar: 'من اختتام البحث العلني', fr: 'à compter de la clôture de l’enquête publique'}}
    - title: {ar: 'المصادقة: منفعة عامة لعشر سنوات', fr: 'L’approbation : une utilité publique pour dix ans'}
      answer: {ar: 'نص المصادقة يعتبر إعلانا بالمنفعة العامة لإنجاز الطرق والمساحات الخضراء والرياضية والتجهيزات العامة وإعادة الهيكلة، وتنتهي آثاره بعد عشر سنوات من نشره.', fr: 'Le texte d’approbation vaut déclaration d’utilité publique pour réaliser les voies, les espaces verts et sportifs, les équipements publics et la restructuration ; ses effets prennent fin dix ans après sa publication.'}
      body:
        ar: 'يعتبر النص القاضي بالموافقة على تصميم التهيئة بمثابة إعلان بأن المنفعة العامة تستوجب القيام بالعمليات اللازمة لإنجاز الطرق والساحات، والمساحات الخضراء وميادين الألعاب، والمساحات الرياضية، ومواقع التجهيزات العامة، ودوائر القطاعات الواجب إعادة هيكلتها أو تجديدها. وتنتهي آثار هذا الإعلان عند انقضاء عشر سنوات من نشر نص الموافقة في الجريدة الرسمية، ولا يجوز إعلان المنفعة العامة للغرض نفسه، في المناطق المخصصة لهذه التجهيزات، قبل انصرام هذه السنوات العشر. وعندما يستعيد المالكون التصرف في أراضيهم بانتهاء هذه الآثار، يجب أن يكون استعمالها مطابقا للغرض المخصصة له المنطقة التي تقع فيها.'
        fr: 'Le texte approuvant le plan d’aménagement vaut déclaration d’utilité publique des opérations nécessaires à la réalisation des voies et places, des espaces verts et aires de jeux, des espaces sportifs, des emplacements d’équipements publics et des secteurs à restructurer ou à rénover. Les effets de cette déclaration prennent fin dix ans après la publication du texte d’approbation au Bulletin officiel, et l’utilité publique ne peut être déclarée de nouveau pour le même objet, dans les zones réservées à ces équipements, avant la fin de ces dix ans. Lorsque les propriétaires recouvrent la libre disposition de leurs terrains à la fin de ces effets, l’usage qu’ils en font doit être conforme à l’affectation de la zone où ils se trouvent.'
      cites: [/ma/loi/12-90/art_28, /ma/loi/12-90/art_19]
    - title: {ar: 'في انتظار التجهيز: استعمال مؤقت', fr: 'En attendant l’équipement : un usage temporaire'}
      answer: {ar: 'بإذن من الجماعة، يمكن استعمال أرض مخصصة لتجهيز عام استعمالا مؤقتا لا يعوق إنجازه، على أن يعيدها المالك إلى حالتها عند بدء الأشغال.', fr: 'Avec l’autorisation de la commune, un terrain réservé à un équipement public peut recevoir un usage temporaire qui n’en gêne pas la réalisation, le propriétaire devant le remettre en l’état au début des travaux.'}
      body:
        ar: 'استثناء من آثار إعلان المنفعة العامة، يجوز بإذن من الجماعة التي تقع فيها الأراضي المخصصة للطرق والمساحات الخضراء والمساحات الرياضية والتجهيزات العامة أن تستعمل بصورة مؤقتة لغرض غير الغرض المنصوص عليه في تصميم التهيئة. ولا تسلم الجماعة هذا الإذن إلا إذا كان الاستعمال المؤقت لا يعوق إنجاز التجهيزات المقررة في التصميم. وعلى المالك في جميع الحالات، حين مباشرة إنجاز هذه التجهيزات، أن يعيد الأرض إلى الحالة التي كانت عليها. وتتخذ مجالس الجماعات، بتنسيق مع الإدارة، جميع التدابير اللازمة لتنفيذ تصميم التهيئة واحترام أحكامه.'
        fr: 'Par exception aux effets de la déclaration d’utilité publique, les terrains réservés aux voies, espaces verts, espaces sportifs et équipements publics peuvent, avec l’autorisation de la commune où ils se trouvent, recevoir à titre temporaire un usage autre que celui prévu par le plan d’aménagement. La commune ne délivre cette autorisation que si l’usage temporaire envisagé ne gêne pas la réalisation des équipements prévus. Dans tous les cas, le propriétaire doit remettre le terrain dans son état antérieur dès le début de la réalisation de ces équipements. Les conseils communaux, en coordination avec l’administration, prennent toutes les mesures nécessaires à l’exécution et au respect du plan d’aménagement.'
      cites: [/ma/loi/12-90/art_28, /ma/loi/12-90/art_31]
    - title: {ar: 'التصميم بمثابة مقرر تخل', fr: 'Le plan valant acte de cessibilité'}
      answer: {ar: 'يمكن أن يعين التصميم نفسه الأراضي المراد نزع ملكيتها للتجهيزات العامة، فتطبق مسطرة القانون 7.81، مع بحث مدته شهر.', fr: 'Le plan peut lui-même désigner les terrains à exproprier pour les équipements publics ; la procédure de la loi 7-81 s’applique alors, avec une enquête d’un mois.'}
      body:
        ar: 'يمكن أن يكون تصميم التهيئة بمثابة قرار تعين فيه الأراضي المراد نزع ملكيتها لأنها لازمة لإنجاز الطرق والمساحات الخضراء والرياضية والتجهيزات العامة. ولهذه الغاية ينص التصميم على العقارات المراد نزع ملكيتها مع بيان مشتملاتها ومساحتها وأسماء من يحتمل أن يكونوا مالكين لها. وتطبق عليه أحكام القانون 7.81 المتعلق بنزع الملكية فيما يخص الإجراءات والآثار، غير أن مدة البحث المنصوص عليها في الفصل 10 من ذلك القانون، وهي شهران يبتدئان من النشر في الجريدة الرسمية، تقتصر على شهر البحث العلني.'
        fr: 'Le plan d’aménagement peut valoir acte désignant les terrains à exproprier parce qu’ils sont nécessaires aux voies, espaces verts et sportifs et équipements publics. Il indique alors les immeubles à exproprier, leur consistance, leur superficie et les noms de leurs propriétaires présumés. La loi 7-81 sur l’expropriation s’y applique quant à la procédure et aux effets, mais la durée de l’enquête prévue à son article 10, deux mois à compter de la publication au Bulletin officiel, est réduite au mois de l’enquête publique.'
      cites: [/ma/loi/12-90/art_29, /ma/loi/7-81/art_10]
      next: journeys/expropriation
    - title: {ar: 'قرارات تخطيط حدود الطرق', fr: 'Les arrêtés d’alignement des voies'}
      answer: {ar: 'قرار تخطيط حدود الطرق العامة يعتبر إعلانا بالمنفعة العامة لعشر سنوات، أو لسنتين إذا عين الأراضي المراد نزع ملكيتها، ولا بناء جديد في الأرض التي يشملها الطريق.', fr: 'L’arrêté d’alignement vaut déclaration d’utilité publique pour dix ans, ou deux ans s’il désigne les terrains à exproprier, et aucune construction nouvelle n’est permise sur l’emprise de la voie.'}
      body:
        ar: 'يجوز لرؤساء مجالس الجماعات، بعد مداولة المجلس، إصدار قرارات بإحداث طرق وساحات ومواقف سيارات عامة أو تغييرها أو حذفها، مصحوبة بخريطة، ويمكن أن تعين فيها الأراضي المراد نزع ملكيتها. وتخضع هذه القرارات لبحث علني مدته شهر، وشهران إذا عينت الأراضي المراد نزع ملكيتها، ولا تسلم خلاله وإلى نشر القرار رخصة بناء على الأراضي المعنية، على ألا يتجاوز هذا المنع ستة أشهر. ويعتبر القرار إعلانا بالمنفعة العامة يستمر عشر سنوات، وسنتين فقط إذا عين الأراضي المراد نزع ملكيتها. ومن نشره، لا يجوز في الأراضي التي يشملها الطريق أي بناء جديد أو تعلية أو تغيير لحالة الأرض، ولا تباشر في المباني القائمة إلا إصلاحات الصيانة بإذن رئيس مجلس الجماعة.'
        fr: 'Les présidents des conseils communaux peuvent, après délibération du conseil, prendre des arrêtés créant, modifiant ou supprimant des voies, places et parcs de stationnement publics, accompagnés d’un plan, et pouvant désigner les terrains à exproprier. Ces arrêtés sont soumis à une enquête publique d’un mois, de deux mois s’ils désignent les terrains à exproprier ; pendant l’enquête et jusqu’à la publication de l’arrêté, aucun permis de construire n’est délivré sur les terrains concernés, sans que cette interdiction dépasse six mois. L’arrêté vaut déclaration d’utilité publique pour dix ans, deux ans seulement s’il désigne les terrains à exproprier. Dès sa publication, aucune construction nouvelle, surélévation ou modification de l’état du sol n’est permise sur l’emprise de la voie, et seuls des travaux d’entretien, autorisés par le président du conseil communal, peuvent être faits dans les bâtiments existants.'
      cites: [/ma/loi/12-90/art_32, /ma/loi/12-90/art_33, /ma/loi/12-90/art_34]
    - title: {ar: 'التعويض عن أراضي التجهيزات والطرق', fr: 'L’indemnité pour les terrains des équipements et des voies'}
      answer: {ar: 'تعويض التجهيزات غير الطرق يحدد وفق القانون 7.81؛ وفي الطرق الجماعية يساهم المالك المجاور مجانا في حدود عشرة أمتار من واجهته، على ألا تتعدى ربع بقعته.', fr: 'Pour les équipements autres que les voies, l’indemnité suit la loi 7-81 ; pour les voies communales, le riverain contribue gratuitement à hauteur d’une bande de dix mètres le long de sa façade, sans dépasser le quart de sa parcelle.'}
      body:
        ar: 'تحدد تعويضات أصحاب الأراضي اللازمة للتجهيزات وفق القانون 7.81، إلا الطرق فتحدد وفق المادتين 37 و38. وتتملك الجماعة العقارات الواقعة في مساحة الطرق العامة الجماعية برضى مالكيها أو بنزع ملكيتها. ويساهم مالك كل بقعة مجاورة للطريق المقرر إحداثها مجانا في إنجازها في حدود قيمة جزء من أرضه يعادل مستطيلا عرضه عشرة أمتار وطوله طول واجهته على الطريق، على ألا تتعدى المساهمة قيمة ربع البقعة. وإذا بقي من البقعة جزء غير قابل للبناء وجب على الجماعة أن تتملكه إذا طلب المالك ذلك، ويكون المالك دائنا للجماعة أو مدينا لها بالفرق بين مساهمته وقيمة ما أخذ منه. ويحدد التعويض وفق القانون 7.81 بمراعاة حدود كل عقار عند افتتاح البحث السابق لإعلان المنفعة العامة.'
        fr: 'Les indemnités dues aux propriétaires des terrains nécessaires aux équipements sont fixées selon la loi 7-81, sauf pour les voies, régies par les articles 37 et 38. La commune acquiert les immeubles situés dans l’emprise des voies publiques communales, à l’amiable ou par expropriation. Le propriétaire de chaque parcelle riveraine de la voie à créer contribue gratuitement à sa réalisation à hauteur de la valeur d’une partie de son terrain égale à un rectangle de dix mètres de large sur la longueur de sa façade, sans que cette contribution dépasse la valeur du quart de la parcelle. S’il reste de la parcelle une partie inconstructible, la commune doit l’acquérir à la demande du propriétaire, qui devient créancier ou débiteur de la commune de la différence entre sa contribution et la valeur des surfaces prises. L’indemnité est fixée selon la loi 7-81, d’après les limites de chaque immeuble à l’ouverture de l’enquête qui a précédé la déclaration d’utilité publique.'
      cites: [/ma/loi/12-90/art_30, /ma/loi/12-90/art_37, /ma/loi/12-90/art_38]
  ends: {office: commune, paper: {ar: 'نص المصادقة على تصميم التهيئة المنشور في الجريدة الرسمية، ونظامه ورسومه البيانية', fr: 'Le texte d’approbation du plan d’aménagement publié au Bulletin officiel, avec son règlement et ses documents graphiques'}, cites: [/ma/loi/12-90/art_20, /ma/loi/12-90/art_28]}
  next: [journeys/expropriation]

- key: expropriation
  for: [titled, pending, untitled, collective, unknown]
  title: {ar: 'نزع الملكية: من إعلان المنفعة العامة إلى التعويض', fr: 'L’expropriation pour cause d’utilité publique : de la déclaration à l’indemnité'}
  lead:
    ar: 'لا تنزع ملكية عقار إلا لمنفعة عامة معلنة، وبحكم قضائي، ووفق مسطرة القانون 7.81: مقرر بإعلان المنفعة العامة، ثم مشروع مقرر التخلي ينشر في الجريدة الرسمية ويودع بمكتب الجماعة شهرين للملاحظات، ثم حكم بنقل الملكية وتحديد التعويض. ويمكن الاتفاق بالمراضاة على الثمن الذي حددته اللجنة.'
    fr: 'Un immeuble n’est exproprié que pour une utilité publique déclarée, par un jugement, selon la procédure de la loi 7-81 : la déclaration d’utilité publique, puis le projet d’acte de cessibilité publié au Bulletin officiel et déposé deux mois au bureau de la commune pour les observations, puis le jugement qui transfère la propriété et fixe l’indemnité. Un accord amiable sur le prix fixé par la commission reste possible.'
  day: {ar: 'متى نشر مشروع مقرر التخلي في الجريدة الرسمية؟', fr: 'Quand le projet d’acte de cessibilité a-t-il été publié au Bulletin officiel ?'}
  steps:
    - title: {ar: 'لا نزع إلا لمنفعة عامة وبحكم', fr: 'Seulement pour l’utilité publique, et par un jugement'}
      answer: {ar: 'لا يحكم بنزع الملكية إلا إذا أعلنت المنفعة العامة، ولا يتم إلا بحكم قضائي ووفق هذا القانون.', fr: 'L’expropriation n’est prononcée que si l’utilité publique a été déclarée, et seulement par un jugement, selon cette loi.'}
      body:
        ar: 'نزع ملكية العقارات كلا أو بعضا، أو ملكية الحقوق العينية العقارية، لا يجوز الحكم به إلا إذا أعلنت المنفعة العامة، ولا يجرى إلا وفق الكيفيات المقررة في القانون 7.81، مع مراعاة الاستثناءات التي تدخلها عليه تشريعات خاصة. ويتم نزع الملكية لأجل المنفعة العامة بحكم قضائي. ولا يجوز نزع ملكية المباني الدينية المعدة لإقامة الشعائر، ولا المقابر، ولا العقارات التابعة للملك العام، ولا المنشآت العسكرية.'
        fr: 'L’expropriation de tout ou partie d’un immeuble, ou de droits réels immobiliers, ne peut être prononcée que si l’utilité publique a été déclarée, et ne se fait que selon les formes de la loi 7-81, sous réserve des exceptions qu’y apportent des lois particulières. L’expropriation pour cause d’utilité publique est prononcée par un jugement. Ne peuvent être expropriés ni les édifices religieux affectés au culte, ni les cimetières, ni les immeubles du domaine public, ni les ouvrages militaires.'
      cites: [/ma/loi/7-81/art_1, /ma/loi/7-81/art_2, /ma/loi/7-81/art_4]
    - title: {ar: 'إعلان المنفعة العامة ومقرر التخلي', fr: 'La déclaration d’utilité publique et l’acte de cessibilité'}
      answer: {ar: 'مقرر إداري يعين المنطقة، ثم تعيين الأملاك بمقرر التخلي داخل سنتين؛ وخلال سنتين لا بناء ولا غرس دون موافقة نازع الملكية.', fr: 'Un acte administratif désigne la zone, puis l’acte de cessibilité désigne les biens dans les deux ans ; pendant deux ans, ni construction ni plantation sans l’accord de l’expropriant.'}
      body:
        ar: 'تعلن المنفعة العامة بمقرر إداري يعين المنطقة التي يمكن نزع ملكيتها، وقد تشمل، إلى جانب العقارات اللازمة للأشغال، الجزء الباقي منها والعقارات المجاورة إذا كان نزع ملكيتها ضروريا للهدف المنشود أو كانت الأشغال ستزيد قيمتها زيادة ملحوظة. ويمكن لمقرر الإعلان أن يعين مباشرة الأملاك المنزوعة، وإلا عينت بمقرر إداري يدعى «مقرر التخلي». ويجب أن يصدر مقرر التخلي داخل سنتين من نشر مقرر إعلان المنفعة العامة في الجريدة الرسمية، وإذا انصرم الأجل تعين تجديد الإعلان. ولا يجوز، خلال سنتين من نشر مقرر الإعلان في الجريدة الرسمية، إقامة أي بناء أو غرس أو تحسين في المنطقة المحددة فيه دون موافقة نازع الملكية.'
        fr: 'L’utilité publique est déclarée par un acte administratif qui désigne la zone susceptible d’être expropriée ; outre les immeubles nécessaires aux travaux, elle peut comprendre le reste de ces immeubles et les immeubles voisins, si leur expropriation est nécessaire au but poursuivi ou si les travaux doivent en accroître sensiblement la valeur. La déclaration peut désigner directement les biens à exproprier ; sinon, ils sont désignés par un acte administratif appelé « acte de cessibilité ». L’acte de cessibilité doit intervenir dans les deux ans de la publication de la déclaration d’utilité publique au Bulletin officiel ; passé ce délai, la déclaration doit être renouvelée. Pendant deux ans à compter de la publication de la déclaration au Bulletin officiel, aucune construction, plantation ou amélioration ne peut être faite dans la zone sans l’accord de l’expropriant.'
      cites: [/ma/loi/7-81/art_6, /ma/loi/7-81/art_7, /ma/loi/7-81/art_15]
    - title: {ar: 'اقرأ اسمك في الجريدة', fr: 'Lire votre nom au Bulletin officiel'}
      answer: {ar: 'مقرر إعلان المنفعة العامة ومشروع مقرر التخلي ينشران في الجريدة الرسمية وفي جرائد الإعلانات القانونية، ويعلقان أو يودعان بمكتب الجماعة.', fr: 'La déclaration d’utilité publique et le projet d’acte de cessibilité sont publiés au Bulletin officiel et dans des journaux d’annonces légales, et affichés ou déposés au bureau de la commune.'}
      body:
        ar: 'ينشر مقرر إعلان المنفعة العامة بكامله في الجريدة الرسمية (الجزء الأول)، مع إعلان في جريدة أو أكثر مأذون لها بنشر الإعلانات القانونية، ويعلق نصه الكامل بمكاتب الجماعة التي تقع فيها المنطقة. وينشر مشروع مقرر التخلي في الجريدة الرسمية (الجزء الثاني) وفي جريدة أو أكثر مأذون لها بنشر الإعلانات القانونية، ويودع مشفوعا بتصميم لدى مكتب الجماعة حيث يمكن للمعنيين الاطلاع عليه. ويخضع مقرر التخلي بعد اتخاذه لنفس تدابير الإشهار المقررة لإعلان المنفعة العامة، ويمكن أن تتمم هذه التدابير بكل وسيلة إشهار أخرى ملائمة.'
        fr: 'La déclaration d’utilité publique est publiée en entier au Bulletin officiel (première partie), avec un avis dans un ou plusieurs journaux habilités à recevoir les annonces légales, et son texte entier est affiché dans les bureaux de la commune où se trouve la zone. Le projet d’acte de cessibilité est publié au Bulletin officiel (deuxième partie) et dans un ou plusieurs journaux habilités à recevoir les annonces légales, et déposé avec un plan au bureau de la commune, où les intéressés peuvent le consulter. L’acte de cessibilité, une fois pris, reçoit la même publicité que la déclaration d’utilité publique, et ces mesures peuvent être complétées par tout autre moyen de publicité approprié.'
      cites: [/ma/loi/7-81/art_8, /ma/loi/7-81/art_10, /ma/loi/7-81/art_13]
      tool: tools/find
    - title: {ar: 'البحث الإداري: شهران', fr: 'L’enquête administrative : deux mois'}
      answer: {ar: 'شهران من نشر المشروع في الجريدة الرسمية لإبداء الملاحظات بمكتب الجماعة وللتعريف بأصحاب الحقوق في العقار.', fr: 'Deux mois à compter de la publication du projet au Bulletin officiel pour présenter des observations au bureau de la commune et faire connaître les titulaires de droits sur l’immeuble.'}
      body:
        ar: 'يجب إجراء بحث إداري قبل اتخاذ مقرر التخلي: يمكن للمعنيين الاطلاع على المشروع بمكتب الجماعة وإبداء ملاحظاتهم خلال شهرين يبتدئان من تاريخ نشره في الجريدة الرسمية. وعلى المعنيين، داخل الأجل نفسه، أن يعرفوا بمستأجري الأراضي الزراعية والمكترين وغيرهم ممن بيدهم حقوق في العقارات، وإلا بقوا وحدهم مدينين لهم بما قد يطالبون به من تعويضات؛ وعلى كل شخص آخر أن يعرف بنفسه داخل الأجل وإلا سقط كل حق له. ولمالك بناية شمل نزع الملكية جزءا منها أن يطالب باقتناء مجموعها بتصريح خاص يوجهه إلى نازع الملكية قبل انصرام الشهرين، وكذلك المالك الذي لا يبقى له من أرضه إلا قطعة معترف بأنها غير قابلة للاستعمال، مع التحفظات التي يقررها القانون.'
        fr: 'Une enquête administrative précède l’acte de cessibilité : les intéressés peuvent consulter le projet au bureau de la commune et présenter leurs observations dans les deux mois de sa publication au Bulletin officiel. Dans le même délai, ils doivent faire connaître les locataires de terres agricoles, les preneurs à bail et tous ceux qui ont des droits sur les immeubles, faute de quoi ils restent seuls débiteurs des indemnités que ceux-ci pourraient réclamer ; toute autre personne doit se faire connaître dans ce délai, sous peine de perdre tout droit. Le propriétaire d’un bâtiment exproprié en partie peut en demander l’acquisition totale par une déclaration spéciale adressée à l’expropriant avant la fin des deux mois ; de même, sous les réserves que fixe la loi, le propriétaire à qui il ne reste qu’une parcelle reconnue inutilisable.'
      cites: [/ma/loi/7-81/art_10, /ma/loi/7-81/art_11, /ma/loi/7-81/art_23]
      tool: tools/clock?p=inquiry
      delay: {on_day: true, months: 2, from: {ar: 'من تاريخ نشر مشروع مقرر التخلي في الجريدة الرسمية', fr: 'à compter de la publication du projet d’acte de cessibilité au Bulletin officiel'}}
    - title: {ar: 'التقييد في المحافظة العقارية', fr: 'L’inscription à la conservation foncière'}
      answer: {ar: 'يودع المشروع بالمحافظة العقارية فيقيد في الرسم العقاري، أو في سجل التعرضات إن كان العقار في طور التحفيظ، أو في سجل خاص بكتابة الضبط إن لم يكن محفظا.', fr: 'Le projet est déposé à la conservation foncière et inscrit sur le titre foncier, ou au registre des oppositions si l’immeuble est en cours d’immatriculation, ou dans un registre spécial du greffe s’il n’est pas immatriculé.'}
      body:
        ar: 'يودع مشروع مقرر التخلي لدى المحافظة على الأملاك العقارية التي يتبع لها موقع العقار، ويسلم المحافظ نازع الملكية شهادة تثبت تقييده في الرسوم العقارية المعنية، أو في سجل التعرضات إذا كان العقار في طور التحفيظ، مع أسماء المتعرضين ونوع الحقوق المطالب بها والتحملات المثقل بها العقار. وإذا كان العقار غير محفظ ولا في طور التحفيظ، قيد المشروع في السجل الخاص لدى كتابة الضبط بالمحكمة الإدارية المنصوص عليه في الفصل 455 من قانون المسطرة المدنية. ويطلب نازع الملكية من المحافظ شهادة بقائمة الأشخاص الذين بأيديهم حقوق عينية مقيدة في السجلات العقارية. وفي العقار المحفظ، يمكن لنازع الملكية، بناء على الأمر بالإذن في الحيازة، أن يطلب تقييدا أوليا في الرسم العقاري يحفظ حقه مؤقتا.'
        fr: 'Le projet d’acte de cessibilité est déposé à la conservation foncière dont relève l’immeuble ; le conservateur remet à l’expropriant un certificat attestant son inscription sur les titres fonciers concernés, ou au registre des oppositions si l’immeuble est en cours d’immatriculation, avec les noms des opposants, la nature des droits réclamés et les charges qui grèvent l’immeuble. Si l’immeuble n’est ni immatriculé ni en cours d’immatriculation, le projet est inscrit sur le registre spécial tenu au greffe du tribunal administratif, prévu à l’article 455 du code de procédure civile. L’expropriant demande au conservateur un certificat listant les titulaires de droits réels inscrits sur les livres fonciers. Pour un immeuble immatriculé, l’expropriant peut, sur l’ordonnance de prise de possession, requérir une prénotation sur le titre foncier qui conserve provisoirement son droit.'
      cites: [/ma/loi/7-81/art_12, /ma/loi/7-81/art_11, /ma/loi/7-81/art_25]
    - title: {ar: 'الاتفاق بالمراضاة', fr: 'L’accord amiable'}
      answer: {ar: 'إذا اتفق الطرفان على الثمن الذي حددته اللجنة بعد نشر مقرر التخلي، أبرم الاتفاق ورتب آثار نقل الملكية من إيداعه بالمحافظة.', fr: 'Si les parties s’accordent sur le prix fixé par la commission après la publication de l’acte de cessibilité, l’accord est conclu et produit les effets du transfert dès son dépôt à la conservation foncière.'}
      body:
        ar: 'إذا اتفق نازع الملكية والمنزوعة ملكيته على الثمن الذي حددته اللجنة بعد نشر مقرر التخلي وعلى كيفيات التفويت، أدرج الاتفاق في محضر أمام السلطة الإدارية المحلية لموقع العقار إن كان المنزوعة ملكيته يقيم به، وإلا أبرم بعقد عرفي أو عدلي يبلغ إلى السلطة الإدارية المحلية. ويرتب الاتفاق، من تاريخ إيداعه لدى المحافظة على الأملاك العقارية، آثار نقل الملكية، ويسحب الدعوى عند الاقتضاء من القضاء. ويمكن الاتفاق كذلك على الحيازة وحدها، فيخصم التعويض الاحتياطي من التعويض عن نزع الملكية، ولا يمس قبضه حق المعنيين في إثبات كل مطالبهم بعد ذلك أمام القضاء. ويجوز للأوصياء وممثلي القاصرين والمحاجير والمتغيبين إبرام هذه الاتفاقات بعد إذن القاضي المختص عند الاقتضاء، ويأذن القاضي بناء على خبرة تحدد القيمة التجارية للعقار.'
        fr: 'Si l’expropriant et l’exproprié s’accordent sur le prix fixé par la commission après la publication de l’acte de cessibilité et sur les modalités de la cession, l’accord est consigné dans un procès-verbal devant l’autorité administrative locale du lieu de l’immeuble si l’exproprié y réside ; sinon, il est conclu par acte sous seing privé ou adoulaire et notifié à l’autorité administrative locale. Dès son dépôt à la conservation foncière, l’accord produit les effets du transfert de propriété et dessaisit, le cas échéant, la juridiction. Un accord peut aussi porter sur la seule prise de possession : l’indemnité provisionnelle est alors déduite de l’indemnité d’expropriation, et l’avoir perçue ne prive pas les intéressés de faire valoir ensuite toutes leurs prétentions en justice. Les tuteurs et représentants des mineurs, des interdits et des absents peuvent conclure ces accords, avec l’autorisation du juge compétent le cas échéant, donnée sur une expertise qui fixe la valeur vénale de l’immeuble.'
      cites: [/ma/loi/7-81/art_42, /ma/loi/7-81/art_44]
    - title: {ar: 'المحكمة الإدارية: الحيازة ونقل الملكية', fr: 'Le tribunal administratif : prise de possession et transfert de propriété'}
      answer: {ar: 'نازع الملكية يطلب حكما بنقل الملكية وتحديد التعويض، وأمرا بالحيازة مقابل دفع أو إيداع التعويض الذي يقترحه.', fr: 'L’expropriant demande un jugement de transfert de propriété fixant l’indemnité, et une ordonnance de prise de possession contre paiement ou consignation de l’indemnité qu’il propose.'}
      body:
        ar: 'بعد استيفاء إجراءات مقرر التخلي، يودع نازع الملكية لدى المحكمة الإدارية التي يقع العقار في دائرتها طلبا بنقل الملكية وتحديد التعويضات، وطلبا آخر تبت فيه بصفة استعجالية لحيازة العقار مقابل إيداع أو دفع التعويض المقترح، ويحدد في الطلبين مبلغ التعويض الذي يقترحه. وإذا لم يودع طلبه داخل سنتين من نشر مقرر التخلي أو تبليغه، لا يحكم بنزع الملكية إلا بإعلان جديد للمنفعة العامة. ولا يرفض رئيس المحكمة الإدارية الإذن في الحيازة إلا بسبب بطلان المسطرة، وينص الأمر على دفع التعويض الاحتياطي إلى ذوي الحقوق أو إيداعه. ويحدد الحكم بنقل الملكية التعويض بعد التذكير بالمبلغ الذي اقترحه نازع الملكية، وينص على أدائه أو إيداعه، ويودع القراران لدى المحافظة العقارية.'
        fr: 'Une fois remplies les formalités de l’acte de cessibilité, l’expropriant saisit le tribunal administratif du lieu de l’immeuble d’une demande de transfert de propriété et de fixation des indemnités, et d’une autre, jugée en référé, de prise de possession contre consignation ou paiement de l’indemnité proposée ; les deux demandes indiquent le montant qu’il propose. S’il n’a pas saisi le tribunal dans les deux ans de la publication ou de la notification de l’acte de cessibilité, l’expropriation ne peut être prononcée qu’en vertu d’une nouvelle déclaration d’utilité publique. Le président du tribunal administratif ne peut refuser la prise de possession que pour nullité de la procédure, et l’ordonnance prévoit le paiement de l’indemnité provisionnelle aux ayants droit ou sa consignation. Le jugement de transfert fixe l’indemnité après avoir rappelé le montant proposé par l’expropriant et en ordonne le paiement ou la consignation ; les deux décisions sont déposées à la conservation foncière.'
      cites: [/ma/loi/7-81/art_18, /ma/loi/7-81/art_17, /ma/loi/7-81/art_24]
    - title: {ar: 'كيف يحدد التعويض', fr: 'Comment l’indemnité est fixée'}
      answer: {ar: 'الضرر الحالي والمحقق الناشئ مباشرة عن نزع الملكية، بقيمة العقار يوم قرار نزع الملكية، دون أن تتجاوز قيمته يوم نشر مقرر التخلي.', fr: 'Le préjudice actuel et certain directement causé par l’expropriation, à la valeur de l’immeuble au jour de la décision d’expropriation, sans dépasser sa valeur au jour de la publication de l’acte de cessibilité.'}
      body:
        ar: 'لا يشمل التعويض إلا الضرر الحالي والمحقق الناشئ مباشرة عن نزع الملكية، ولا يمتد إلى ضرر غير محقق أو محتمل أو غير مباشر. ويحدد بقيمة العقار يوم صدور قرار نزع الملكية، دون اعتبار البناءات والأغراس والتحسينات المنجزة دون موافقة نازع الملكية منذ نشر أو تبليغ المقرر المعين للأملاك. ولا يتجاوز قيمة العقار يوم نشر مقرر التخلي، ولا تحسب فيها الزيادات الناتجة عن المضاربات منذ مقرر المنفعة العامة؛ غير أنه إذا لم يودع نازع الملكية مقاليه داخل ستة أشهر من نشر مقرر التخلي، صار الحد قيمة العقار يوم آخر إيداع لأحدهما. ويغير التعويض بحسب ما تحدثه الأشغال من فائض قيمة أو ناقصها في الجزء الذي لم تنزع ملكيته، ويحدد مقدار خاص لكل عنصر. وإذا وجدت حقوق انتفاع أو استعمال أو سكنى حدد تعويض واحد عن مجموع قيمة العقار يمارس فيه المعنيون حقوقهم، ويتحمل نازع الملكية تعويض المكترين المصرح بهم في البحث أو المقيدين في السجلات العقارية، أو تمكينهم من عقار آخر إن أمكن.'
        fr: 'L’indemnité ne couvre que le préjudice actuel et certain directement causé par l’expropriation ; elle ne peut s’étendre à un préjudice incertain, éventuel ou indirect. Elle est fixée d’après la valeur de l’immeuble au jour de la décision d’expropriation, sans tenir compte des constructions, plantations et améliorations faites sans l’accord de l’expropriant depuis la publication ou la notification de l’acte désignant les biens. Elle ne peut dépasser la valeur de l’immeuble au jour de la publication de l’acte de cessibilité, sans les hausses dues à la spéculation depuis la déclaration d’utilité publique ; mais si l’expropriant n’a pas déposé ses requêtes dans les six mois de la publication de l’acte de cessibilité, la limite devient la valeur au jour du dernier dépôt. L’indemnité est modifiée selon la plus-value ou la moins-value que les travaux donnent à la partie non expropriée, et chaque élément fait l’objet d’un montant distinct. En présence d’usufruit, d’usage, d’habitation ou de droits semblables, une indemnité unique est fixée sur la valeur totale de l’immeuble, et les intéressés exercent leurs droits sur elle ; l’expropriant indemnise les locataires déclarés à l’enquête ou inscrits sur les livres fonciers, ou les reloge dans un autre immeuble si c’est possible.'
      cites: [/ma/loi/7-81/art_20, /ma/loi/7-81/art_21, /ma/loi/7-81/art_22]
    - title: {ar: 'الأداء والطعن', fr: 'Paiement et recours'}
      answer: {ar: 'إذا لم يؤد التعويض أو يودع داخل شهر من تبليغ الحكم ترتبت فوائد قانونية؛ والحكم يستأنف في التعويض وحده داخل 30 يوما من تبليغه.', fr: 'Si l’indemnité n’est ni payée ni consignée dans le mois de la notification du jugement, des intérêts au taux légal courent ; le jugement n’est susceptible d’appel que sur l’indemnité, dans les 30 jours de sa notification.'}
      body:
        ar: 'إذا لم تدفع المبالغ الواجبة أو تودع داخل شهر من يوم تبليغ أو نشر الحكم بالحيازة أو بنزع الملكية، ترتبت عليها بحكم القانون فوائد بالسعر القانوني المعمول به في المعاملات المدنية، وكذلك إذا لم يرفع الحظر عن المبالغ المودعة داخل شهرين من الإدلاء برسوم صحيحة أو برفع اليد. ولا يمكن التعرض على الأمر بالحيازة ولا على الحكم بنقل الملكية، ولا يستأنف الأمر بالحيازة؛ أما الحكم بنقل الملكية وتحديد التعويض فيستأنف فيما يتعلق بتحديد التعويض فقط. ويقدم الاستئناف إلى كتابة ضبط المحكمة الإدارية داخل 30 يوما من تبليغ الحكم، ولا يترتب عليه وقف التنفيذ.'
        fr: 'Si les sommes dues ne sont ni payées ni consignées dans le mois qui suit la notification ou la publication de la décision de prise de possession ou d’expropriation, elles portent de plein droit intérêt au taux légal des affaires civiles ; de même si la consignation n’est pas levée dans les deux mois de la production de titres réguliers ou de la mainlevée. L’ordonnance de prise de possession et le jugement de transfert ne sont pas susceptibles d’opposition, et l’ordonnance ne peut être frappée d’appel ; le jugement de transfert fixant l’indemnité n’est susceptible d’appel que sur l’indemnité. L’appel est déposé au greffe du tribunal administratif dans les 30 jours de la notification du jugement et n’est pas suspensif.'
      cites: [/ma/loi/7-81/art_31, /ma/loi/7-81/art_32, /ma/loi/7-81/art_33]
      delay: {days: 30, from: {ar: 'من تبليغ الحكم بنقل الملكية', fr: 'à compter de la notification du jugement de transfert'}}
    - title: {ar: 'إذا تراجع نازع الملكية أو غير الغرض', fr: 'Si l’expropriant renonce ou change d’usage'}
      answer: {ar: 'التراجع قبل الحكم يرفع القيود ويعيد الحيازة للمالك؛ وبعد نزع الملكية، يمكن للمالكين السابقين خلال خمس سنوات استرداد العقار بثمنه الأصلي إذا بيع دون تحقيق الغرض.', fr: 'Une renonciation avant le jugement lève les servitudes et rend la possession au propriétaire ; après l’expropriation, les anciens propriétaires peuvent, pendant cinq ans, reprendre l’immeuble à son prix d’origine s’il est revendu sans que le but soit atteint.'}
      body:
        ar: 'إذا تراجع نازع الملكية، لأي سبب وفي أي مرحلة قبل الحكم بنقل الملكية، عن نزع ملكية عقار كلا أو بعضا، استصدر مقررا معدلا لإعلان المنفعة العامة أو لمقرر التخلي تتخذ بشأنه تدابير الإشهار نفسها. ويترتب على نشره في الجريدة الرسمية بحكم القانون رفع القيود المفروضة على العقار، وسحب الدعوى من قاضي نزع الملكية، وإعادة الحيازة إلى المالكين في العقار أو الجزء المسقط. وبعد نزع الملكية، لا يستعمل العقار لأشغال أو عمليات غير التي بررت نزع ملكيته إلا بعد الإذن بتغيير التخصيص بمقرر إداري. ولا يبيع نازع الملكية عقارا اقتناه بنزع الملكية منذ أقل من خمس سنوات إلا بالسمسرة العمومية، ويجوز للمالكين السابقين خلال الأجل نفسه استرداده بثمنه الأصلي بشرط دفعه داخل عشرين يوما؛ ولا يطبق ذلك إذا تحقق الغرض المعلن أو بيع العقار لمن يلتزم بتخصيصه لذلك الغرض.'
        fr: 'Si l’expropriant renonce, pour quelque raison et à quelque stade que ce soit avant le jugement de transfert, à exproprier tout ou partie d’un immeuble, il fait prendre un acte modifiant la déclaration d’utilité publique ou l’acte de cessibilité, qui reçoit la même publicité. Sa publication au Bulletin officiel lève de plein droit les servitudes qui grevaient l’immeuble, dessaisit le juge de l’expropriation et rend la possession aux propriétaires pour l’immeuble ou la partie abandonnée. Après l’expropriation, l’immeuble ne peut servir à d’autres travaux ou opérations que ceux qui l’ont justifiée qu’après une autorisation de changement d’affectation par acte administratif. L’expropriant ne peut vendre un immeuble exproprié depuis moins de cinq ans que par adjudication publique, et les anciens propriétaires peuvent, dans le même délai, le reprendre à son prix d’origine s’ils le paient dans les vingt jours ; il en va autrement si le but déclaré a été atteint ou si l’immeuble est vendu à quelqu’un qui s’oblige à l’affecter à ce but.'
      cites: [/ma/loi/7-81/art_43, /ma/loi/7-81/art_39, /ma/loi/7-81/art_40]
    - title: {ar: 'الاحتلال المؤقت', fr: 'L’occupation temporaire'}
      answer: {ar: 'لمنفذ الأشغال العامة أن يحتل أرضا مؤقتا، دون دور السكنى، ولمدة لا تتجاوز خمس سنوات، وبتعويض يحدده قاضي نزع الملكية عند عدم الاتفاق.', fr: 'L’exécutant de travaux publics peut occuper temporairement un terrain, hors habitations, pour cinq ans au plus, contre une indemnité fixée par le juge de l’expropriation à défaut d’accord.'}
      body:
        ar: 'يخول الاحتلال المؤقت منفذ الأشغال العامة حيازة أرض مؤقتا للقيام فيها بالدراسات والأعمال التحضيرية، أو لإيداع الآلات والمواد وإقامة الأوراش والطرق، أو لاستخراج بعض المواد. ولا يمكن أن يشمل دور السكنى والساحات والبساتين والحدائق المجاورة لها المحيطة بها سياجات، ولا المباني الدينية والمقابر. ولا يمكن الإذن في الاحتلال المؤقت لإيداع الآلات أو استخراج المواد لمدة تتجاوز خمس سنوات، فإذا امتد بعدها دون اتفاق وجب على الإدارة القيام بنزع الملكية وفق هذا القانون. وعند عدم الاتفاق على التعويض، يعرض الطرف المستعجل القضية على قاضي نزع الملكية خلال الشهر التالي لانتهاء الاحتلال أو خلال الشهر الأخير من كل سنة احتلال، فيحدده بحسب الضرر اللاحق بسطح الأرض وقيمة المواد المستخرجة وزائد القيمة الذي قد تكسبه الأرض.'
        fr: 'L’occupation temporaire permet à l’exécutant de travaux publics de prendre provisoirement possession d’un terrain pour y faire des études et travaux préparatoires, y déposer du matériel et des matériaux, y installer chantiers et chemins, ou en extraire des matériaux. Elle ne peut porter sur les maisons d’habitation, ni sur les cours, vergers et jardins clos attenants, ni sur les édifices religieux et les cimetières. L’occupation pour dépôt ou extraction ne peut être autorisée pour plus de cinq ans ; si elle se prolonge au-delà sans accord, l’administration doit exproprier selon cette loi. À défaut d’accord sur l’indemnité, la partie la plus diligente saisit le juge de l’expropriation dans le mois qui suit la fin de l’occupation, ou dans le dernier mois de chaque année d’occupation, et il la fixe d’après le dommage causé à la surface, la valeur des matériaux extraits et la plus-value que le terrain peut acquérir.'
      cites: [/ma/loi/7-81/art_50, /ma/loi/7-81/art_53, /ma/loi/7-81/art_57]
  ends: {office: court, paper: {ar: 'الأمر بالإذن في الحيازة، والحكم بنقل الملكية وتحديد التعويض', fr: 'L’ordonnance de prise de possession et le jugement de transfert de propriété fixant l’indemnité'}, cites: [/ma/loi/7-81/art_24, /ma/loi/7-81/art_26]}
  next: [journeys/plan, journeys/collective]

- key: collective
  for: [collective]
  title: {ar: 'أراضي الجماعات السلالية: الانتفاع والتوزيع والحماية', fr: 'Les terres des collectivités ethniques : jouissance, répartition et protection'}
  lead:
    ar: 'تتصرف الجماعات السلالية في أملاكها حسب أعرافها تحت وصاية الدولة. ولأعضائها، ذكورا وإناثا، الانتفاع بها وفق توزيع جماعة النواب، ويطعن في مقرر التوزيع أمام مجلس الوصاية الإقليمي داخل ثلاثين يوما من تبليغه. ولا تكتسب هذه الأملاك بالحيازة ولا بالتقادم، ولا تفوت إلا في الحالات التي يحددها القانون.'
    fr: 'Les collectivités ethniques gèrent leurs biens selon leurs usages, sous la tutelle de l’État. Leurs membres, hommes et femmes, en ont la jouissance selon la répartition de la jemâa des naibs, et la décision de répartition peut être contestée devant le conseil de tutelle provincial dans les trente jours de sa notification. Ces biens ne s’acquièrent ni par la possession ni par la prescription, et ne sont aliénés que dans les cas fixés par la loi.'
  day: {ar: 'متى بلغت بمقرر التوزيع؟', fr: 'Quand la décision de répartition vous a-t-elle été notifiée ?'}
  steps:
    - title: {ar: 'الجماعة السلالية ومن يدبرها', fr: 'La collectivité ethnique et qui la gère'}
      answer: {ar: 'تتصرف الجماعة في أملاكها حسب أعرافها تحت وصاية الدولة، وتمثلها جماعة نواب يختارهم أعضاؤها، ذكورا وإناثا، لست سنوات.', fr: 'La collectivité gère ses biens selon ses usages sous la tutelle de l’État ; elle est représentée par une jemâa des naibs que ses membres, hommes et femmes, choisissent pour six ans.'}
      body:
        ar: 'يمكن للجماعات السلالية أن تتصرف في أملاكها حسب الأعراف السائدة فيها التي لا تتعارض مع النصوص الجاري بها العمل، تحت وصاية الدولة ووفق شروط القانون 62.17. وتختار الجماعة من بين أعضائها المتمتعين بحقوقهم المدنية، ذكورا وإناثا، نوابا يكونون جماعة النواب، لتمثيلها أمام المحاكم والإدارات والأغيار والقيام بالتصرفات القانونية التي تهمها. ويختار النواب بالانتخاب أو باتفاق الأعضاء لمدة ست سنوات قابلة للتجديد مرة واحدة، وإذا تعذر الاختيار عينهم عامل العمالة أو الإقليم بقرار.'
        fr: 'Les collectivités ethniques peuvent disposer de leurs biens selon les usages en vigueur chez elles qui ne contredisent pas les textes applicables, sous la tutelle de l’État et aux conditions de la loi 62-17. La collectivité choisit parmi ses membres jouissant de leurs droits civils, hommes et femmes, des naibs qui forment la jemâa des naibs, pour la représenter devant les tribunaux, les administrations et les tiers et accomplir les actes juridiques qui la concernent. Les naibs sont choisis par élection ou par accord des membres pour six ans, renouvelables une fois ; à défaut, le gouverneur de la préfecture ou de la province les désigne par arrêté.'
      cites: [/ma/loi/62-17/art_4, /ma/loi/62-17/art_9, /ma/loi/62-17/art_10]
    - title: {ar: 'الأعضاء: انتفاع شخصي وواجبات', fr: 'Les membres : une jouissance personnelle et des devoirs'}
      answer: {ar: 'الأعضاء، ذكورا وإناثا، ينتفعون بأملاك الجماعة استغلالا شخصيا ومباشرا، ومن أضر بها قد يحرم من الانتفاع، ويستأنف مقرر الحرمان داخل خمسة عشر يوما.', fr: 'Les membres, hommes et femmes, ont la jouissance des biens de la collectivité pour une exploitation personnelle et directe ; qui leur porte atteinte peut en être privé, et la décision de privation peut être contestée dans les quinze jours.'}
      body:
        ar: 'يتمتع أعضاء الجماعة السلالية، ذكورا وإناثا، بالانتفاع بأملاكها وفق التوزيع الذي تقوم به جماعة النواب، ولا يخول لهم هذا الانتفاع إلا الاستغلال الشخصي والمباشر. وعليهم المحافظة على أملاك جماعتهم، فلا يعرقلون التحديد الإداري والتحفيظ، ولا يترامون على أملاكها أو على نصيب عضو آخر، ولا يستغلونها دون إذن جماعة النواب، ولا يعرقلون تنفيذ المقررات والعقود المبرمة بطريقة قانونية. ومن خالف ذلك وجهت إليه السلطة المحلية إنذارا كتابيا، فإن لم يمتثل جاز لجماعة النواب، بعد الاستماع إليه، أن تحرمه من الانتفاع مدة أقصاها سنة، وخمس سنوات عند التمادي أو العود. ويستأنف المقرر أمام مجلس الوصاية الإقليمي داخل خمسة عشر يوما من تبليغه، ويوقف الاستئناف التنفيذ إلى أن يبت المجلس داخل ثلاثين يوما على الأكثر.'
        fr: 'Les membres de la collectivité ethnique, hommes et femmes, ont la jouissance de ses biens selon la répartition faite par la jemâa des naibs, et cette jouissance ne leur donne droit qu’à une exploitation personnelle et directe. Ils doivent préserver les biens de leur collectivité : ne pas entraver la délimitation administrative ni l’immatriculation, ne pas empiéter sur ses biens ou sur la part d’un autre membre, ne pas les exploiter sans l’autorisation de la jemâa des naibs, ne pas entraver l’exécution des décisions et des contrats régulièrement conclus. Le contrevenant reçoit de l’autorité locale une mise en demeure écrite ; s’il n’y obéit pas, la jemâa des naibs peut, après l’avoir entendu, le priver de la jouissance pour un an au plus, et pour cinq ans en cas de persistance ou de récidive. La décision peut être contestée devant le conseil de tutelle provincial dans les quinze jours de sa notification ; ce recours suspend l’exécution jusqu’à ce que le conseil statue, dans un délai de trente jours au plus.'
      cites: [/ma/loi/62-17/art_6, /ma/loi/62-17/art_7, /ma/loi/62-17/art_8]
      delay: {days: 15, from: {ar: 'من تبليغ مقرر الحرمان', fr: 'à compter de la notification de la décision de privation'}}
    - title: {ar: 'توزيع الانتفاع والطعن فيه', fr: 'La répartition de la jouissance et son recours'}
      answer: {ar: 'جماعة النواب توزع الانتفاع بين الأعضاء ذكورا وإناثا، وتبلغ السلطة المحلية المقرر، ويطعن فيه أمام مجلس الوصاية الإقليمي داخل ثلاثين يوما من تبليغه.', fr: 'La jemâa des naibs répartit la jouissance entre les membres, hommes et femmes ; l’autorité locale notifie la décision, qui peut être contestée devant le conseil de tutelle provincial dans les trente jours de sa notification.'}
      body:
        ar: 'توزع جماعة النواب الانتفاع بأراضي الجماعة السلالية بين أعضائها، ذكورا وإناثا، وفق الشروط والكيفيات التي يحددها نص تنظيمي. والانتفاع حق شخصي لا يتقادم ولا يحجز، ولا يتنازل عنه إلا لفائدة الجماعة السلالية المعنية. وتبلغ السلطة المحلية مقررات التوزيع إلى المعنيين، ويمكن لهم أو للسلطة المحلية الطعن فيها أمام مجلس الوصاية الإقليمي داخل ثلاثين يوما من تبليغها. ومجلس الوصاية الإقليمي، الذي يترأسه عامل العمالة أو الإقليم، هو الذي يبت في الطعون في مقررات جماعات النواب، وفي النزاعات بين الجماعة وأعضائها، ويصادق على لائحة أعضاء كل جماعة.'
        fr: 'La jemâa des naibs répartit la jouissance des terres de la collectivité ethnique entre ses membres, hommes et femmes, selon les conditions et modalités fixées par voie réglementaire. La jouissance est un droit personnel imprescriptible et insaisissable, qui ne peut être cédé qu’à la collectivité concernée. L’autorité locale notifie les décisions de répartition aux intéressés, qui peuvent, comme l’autorité locale, les contester devant le conseil de tutelle provincial dans les trente jours de leur notification. Le conseil de tutelle provincial, présidé par le gouverneur de la préfecture ou de la province, statue sur les recours contre les décisions des jemâas des naibs et sur les litiges entre la collectivité et ses membres, et approuve la liste des membres de chaque collectivité.'
      cites: [/ma/loi/62-17/art_16, /ma/loi/62-17/art_33]
      tool: tools/clock?p=share
      delay: {on_day: true, days: 30, from: {ar: 'من تاريخ تبليغ مقرر التوزيع', fr: 'à compter de la notification de la décision de répartition'}}
    - title: {ar: 'الأرض ملكا للأعضاء، والأراضي المسقية', fr: 'La terre en propriété aux membres, et les terres irriguées'}
      answer: {ar: 'الأراضي الفلاحية خارج دوائر الري وغير المشمولة بوثائق التعمير يمكن تقسيمها وإسنادها ملكا لعضو أو أكثر، ذكورا وإناثا.', fr: 'Les terres agricoles situées hors des périmètres d’irrigation et non couvertes par des documents d’urbanisme peuvent être partagées et attribuées en propriété à un ou plusieurs membres, hommes et femmes.'}
      body:
        ar: 'يمكن تقسيم الأراضي الفلاحية التابعة للجماعات، الواقعة خارج دوائر الري وغير المشمولة بوثائق التعمير، وإسنادها على وجه الملكية المفرزة أو المشاعة لفائدة عضو أو عدة أعضاء بالجماعة السلالية، ذكورا وإناثا، وتسري على هذا الإسناد أحكام القانون 34.94 المتعلق بالحد من تقسيم الأراضي الفلاحية. أما أراضي الجماعات السلالية الواقعة في دوائر الري فيحكمها الظهير 1.69.30، الذي استثنى منه القانون 64.17 أجزاءها المشمولة بوثائق التعمير. وبمقتضى هذا التعديل، يبلغ النائب أو النواب لائحة ذوي الحقوق إلى السلطة المحلية وإلى المعنيين داخل ثلاثين يوما من حصرها، ولا يطعن فيها إلا لدى مجلس الوصاية الإقليمي.'
        fr: 'Les terres agricoles des collectivités, situées hors des périmètres d’irrigation et non couvertes par des documents d’urbanisme, peuvent être partagées et attribuées en propriété divise ou indivise à un ou plusieurs membres de la collectivité ethnique, hommes et femmes ; la loi 34-94 relative à la limitation du morcellement des terres agricoles s’applique à ces attributions. Les terres des collectivités ethniques situées dans les périmètres d’irrigation relèvent du dahir 1-69-30, dont la loi 64-17 a exclu les parties couvertes par des documents d’urbanisme. Depuis cette modification, le ou les naibs notifient la liste des ayants droit à l’autorité locale et aux intéressés dans les trente jours de son arrêt, et elle ne peut être contestée que devant le conseil de tutelle provincial.'
      cites: [/ma/loi/62-17/art_17, /ma/loi/64-17/art_1, /ma/loi/64-17/art_2]
    - title: {ar: 'أرض لا تكتسب بالحيازة', fr: 'Une terre qui ne s’acquiert pas par la possession'}
      answer: {ar: 'أملاك الجماعات السلالية لا تكتسب بالحيازة ولا بالتقادم ولا تحجز، وكل تفويت خارج ما يسمح به القانون باطل.', fr: 'Les biens des collectivités ethniques ne s’acquièrent ni par la possession ni par la prescription et sont insaisissables ; toute aliénation hors des cas permis par la loi est nulle.'}
      body:
        ar: 'لا تكتسب أملاك الجماعات السلالية بالحيازة ولا بالتقادم، ولا يمكن أن تكون موضوع حجز. ولا تفوت إلا في الحالات ووفق الشروط الواردة في القانون 62.17 ونصوصه التطبيقية، تحت طائلة بطلان التفويت. ويمكن أن تكون موضوع نزع الملكية من أجل المنفعة العامة طبقا للتشريع الجاري به العمل. ويعاقب بالحبس من ستة أشهر إلى سنة وبغرامة من 5.000 إلى 20.000 درهم، أو بإحداهما، مع إرجاع الحالة إلى ما كانت عليه، كل من اعتدى أو احتل بدون موجب عقارا تابعا لجماعة سلالية. ويعاقب بالحبس من سنة إلى خمس سنوات وبغرامة من 10.000 إلى 100.000 درهم من أعد أو شارك في إعداد وثائق لتفويت عقار جماعي أو التنازل عنه أو الانتفاع به خلافا للقانون، أو وثائق تنفي عنه الصبغة الجماعية.'
        fr: 'Les biens des collectivités ethniques ne s’acquièrent ni par la possession ni par la prescription et ne peuvent faire l’objet d’une saisie. Ils ne peuvent être aliénés que dans les cas et aux conditions de la loi 62-17 et de ses textes d’application, à peine de nullité. Ils peuvent faire l’objet d’une expropriation pour cause d’utilité publique selon la législation en vigueur. Quiconque empiète sur un immeuble d’une collectivité ethnique ou l’occupe sans titre est puni de six mois à un an d’emprisonnement et de 5 000 à 20 000 dirhams d’amende, ou de l’une de ces peines, avec remise des lieux en l’état. Quiconque établit ou participe à établir des documents d’aliénation, de cession ou de jouissance d’un immeuble collectif contraires à la loi, ou des documents niant son caractère collectif, est puni d’un à cinq ans d’emprisonnement et de 10 000 à 100 000 dirhams d’amende.'
      cites: [/ma/loi/62-17/art_15, /ma/loi/62-17/art_35, /ma/loi/62-17/art_36]
      next: journeys/expropriation
    - title: {ar: 'الكراء والتفويت للغير', fr: 'La location et l’aliénation à des tiers'}
      answer: {ar: 'تكرى أراضي الجماعة بالمنافسة على أساس دفتر تحملات، ولا تفوت أو تبادل إلا للجهات التي يحددها القانون وبعد مصادقة مجلس الوصاية المركزي.', fr: 'Les terres de la collectivité se louent par concurrence sur la base d’un cahier des charges, et ne sont aliénées ou échangées qu’au profit des personnes prévues par la loi, après approbation du conseil de tutelle central.'}
      body:
        ar: 'تكرى عقارات الجماعات السلالية عن طريق المنافسة، وعند الاقتضاء بالمراضاة، على أساس دفتر تحملات ولمدة تتناسب مع طبيعة المشروع، ولا يسري عليها القانون 49.16 المتعلق بالكراء التجاري. ويمكن إبرام عقود التفويت بالمراضاة واتفاقات الشراكة والمبادلة لفائدة الدولة والمؤسسات العمومية والجماعات الترابية والجماعات السلالية الأخرى، وإبرامها بالمنافسة، أو بالمراضاة عند الاقتضاء، لفائدة الفاعلين العموميين والخواص. ولا تبرم هذه العقود والاتفاقات إلا بعد مصادقة مجلس الوصاية المركزي، الذي يترأسه وزير الداخلية أو من يمثله ويصادق على عمليات الاقتناء والتفويت والمبادلة والشراكة.'
        fr: 'Les immeubles des collectivités ethniques sont loués par voie de concurrence, à défaut de gré à gré, sur la base d’un cahier des charges et pour une durée adaptée au projet ; la loi 49-16 sur les baux commerciaux ne s’y applique pas. Les cessions de gré à gré, partenariats et échanges peuvent être conclus au profit de l’État, des établissements publics, des collectivités territoriales et d’autres collectivités ethniques, et, par concurrence ou à défaut de gré à gré, au profit d’opérateurs publics et privés. Ces contrats ne sont conclus qu’après approbation du conseil de tutelle central, présidé par le ministre de l’Intérieur ou son représentant, qui approuve les acquisitions, aliénations, échanges et partenariats.'
      cites: [/ma/loi/62-17/art_19, /ma/loi/62-17/art_20, /ma/loi/62-17/art_32]
    - title: {ar: 'أموال الجماعة وتوزيعها', fr: 'Les fonds de la collectivité et leur distribution'}
      answer: {ar: 'تدبر سلطة الوصاية أموال الجماعة بتنسيق مع جماعة النواب، ويمكن توزيعها على الأعضاء ذكورا وإناثا بطلب من جماعة النواب وبعد مصادقة مجلس الوصاية المركزي.', fr: 'L’autorité de tutelle gère les fonds de la collectivité en coordination avec la jemâa des naibs ; ils peuvent être distribués aux membres, hommes et femmes, à la demande de la jemâa des naibs et après approbation du conseil de tutelle central.'}
      body:
        ar: 'تدبر سلطة الوصاية، بتنسيق مع جماعات النواب، الموارد المالية المتأتية من المعاملات الواردة على أملاك الجماعات السلالية، وتمسك حساباتها. وتستعمل هذه الموارد لتغطية مصاريف تدبير الأملاك وتصفية وضعيتها القانونية، لا سيما بالتحفيظ والتحديد الإداري والدفاع عنها أمام المحاكم. ويمكن أن توزع كلا أو بعضا على أعضاء الجماعة السلالية، ذكورا وإناثا، إذا طلبت ذلك جماعة النواب وبعد مصادقة مجلس الوصاية المركزي.'
        fr: 'L’autorité de tutelle, en coordination avec les jemâas des naibs, gère les ressources financières tirées des opérations sur les biens des collectivités ethniques et en tient les comptes. Ces ressources couvrent les frais de gestion des biens et d’apurement de leur situation juridique, notamment par l’immatriculation, la délimitation administrative et leur défense en justice. Elles peuvent être distribuées en tout ou partie aux membres de la collectivité, hommes et femmes, si la jemâa des naibs le demande et après approbation du conseil de tutelle central.'
      cites: [/ma/loi/62-17/art_23, /ma/loi/62-17/art_24, /ma/loi/62-17/art_27]
    - title: {ar: 'التحديد الإداري: الافتتاح', fr: 'La délimitation administrative : l’ouverture'}
      answer: {ar: 'مرسوم يحدد تاريخ افتتاح التحديد وينشر في الجريدة الرسمية ثلاثين يوما على الأقل قبله، ومن نشره يمنع كل تصرف في الأرض تحت طائلة البطلان.', fr: 'Un décret fixe la date d’ouverture de la délimitation et est publié au Bulletin officiel au moins trente jours avant ; dès sa publication, tout acte sur la terre est interdit à peine de nullité.'}
      body:
        ar: 'يحدد بمرسوم باقتراح من وزير الداخلية تاريخ افتتاح عمليات التحديد الإداري، ويبين لكل عقار اسم الجماعة المالكة واسمه وموقعه وحدوده ومساحته التقريبية، وعند الاقتضاء أسماء المجاورين والقطع المحصورة والتحملات. وينشر المرسوم في الجريدة الرسمية ثلاثين يوما على الأقل قبل بدء العمليات، وتشهره السلطة المحلية، وتعلق نسخة منه في مقرات السلطة المحلية والمحكمة الابتدائية والمحافظة العقارية والمسح العقاري والمصالح المعنية. ومن نشر المرسوم إلى نشر مرسوم المصادقة، يمنع تحت طائلة البطلان كل تصرف في الأراضي موضوع التحديد إلا ما يسمح به القانون 62.17، ولا يقبل مطلب تحفيظ من الغير إلا تأكيدا لتعرض.'
        fr: 'Un décret pris sur proposition du ministre de l’Intérieur fixe la date d’ouverture des opérations de délimitation administrative et indique pour chaque immeuble la collectivité propriétaire, son nom, sa situation, ses limites et sa superficie approximative, et le cas échéant les riverains, les enclaves et les charges. Le décret est publié au Bulletin officiel au moins trente jours avant le début des opérations, porté à la connaissance du public par l’autorité locale et affiché aux sièges de l’autorité locale, du tribunal de première instance, de la conservation foncière, du cadastre et des services concernés. De sa publication à celle du décret d’homologation, tout acte portant sur les terres en délimitation est interdit à peine de nullité, sauf ce que permet la loi 62-17, et aucune réquisition d’immatriculation d’un tiers n’est reçue, sauf pour confirmer une opposition.'
      cites: [/ma/loi/63-17/art_2, /ma/loi/63-17/art_3, /ma/loi/63-17/art_4]
      tool: tools/find
    - title: {ar: 'التعرض على التحديد والمصادقة عليه', fr: 'L’opposition à la délimitation et son homologation'}
      answer: {ar: 'يقدم التعرض في عين المكان أو للسلطة المحلية داخل ثلاثة أشهر من نشر إعلان الإيداع، ثم يؤكد بمطلب تحفيظ داخل ثلاثة أشهر أخرى، وإلا صار لاغيا.', fr: 'L’opposition est faite sur place ou auprès de l’autorité locale dans les trois mois de la publication de l’avis de dépôt, puis confirmée par une réquisition d’immatriculation dans les trois mois suivants, faute de quoi elle tombe.'}
      body:
        ar: 'بعد أن تودع لجنة التحديد المحضر والتصميم المؤقت لدى السلطة المحلية وينشر إعلان الإيداع في الجريدة الرسمية، يمكن خلال ثلاثة أشهر من نشره تقديم التعرضات إلى السلطة المحلية مقابل وصل، أو بتصريح شفوي يحرر به محضر، ولا يقبل أي تعرض بعد مضي الأجل. ولا ينتج التعرض أثرا إلا إذا قدم المتعرض، على نفقته، مطلب تحفيظ تأكيدا له لدى المحافظة العقارية خلال الأشهر الثلاثة الموالية لانقضاء أجل التعرضات، وإلا صار لاغيا. ويصادق على التحديد، كليا أو جزئيا، بمرسوم ينشر في الجريدة الرسمية، ويترتب على المصادقة تحديد الوضعية القانونية للعقار وحدوده ومشتملاته بصفة نهائية.'
        fr: 'Une fois le procès-verbal et le plan provisoire de la commission déposés auprès de l’autorité locale et l’avis de dépôt publié au Bulletin officiel, les oppositions peuvent être présentées à l’autorité locale, contre récépissé ou par déclaration orale consignée dans un procès-verbal, dans les trois mois de cette publication ; aucune opposition n’est reçue après ce délai. L’opposition ne produit d’effet que si l’opposant dépose à ses frais, à la conservation foncière, une réquisition d’immatriculation qui la confirme dans les trois mois suivant l’expiration du délai d’opposition ; sinon, elle devient caduque. La délimitation est homologuée, en tout ou partie, par un décret publié au Bulletin officiel, et l’homologation fixe définitivement la situation juridique de l’immeuble, ses limites et sa consistance.'
      cites: [/ma/loi/63-17/art_9, /ma/loi/63-17/art_10, /ma/loi/63-17/art_12]
      delay: {months: 3, from: {ar: 'من نشر إعلان إيداع محضر التحديد في الجريدة الرسمية', fr: 'à compter de la publication au Bulletin officiel de l’avis de dépôt du procès-verbal'}}
  ends: {office: council, paper: {ar: 'مقرر جماعة النواب بتوزيع الانتفاع، ومقرر مجلس الوصاية الإقليمي في الطعن', fr: 'La décision de la jemâa des naibs répartissant la jouissance, et la décision du conseil de tutelle provincial sur le recours'}, cites: [/ma/loi/62-17/art_16, /ma/loi/62-17/art_33]}
  next: [journeys/expropriation]
