      fr: 'Le nombre d’actes de mariage chaque année, en milliers, dont les mariages de mineurs.'
    cites: [/ma/loi/70-03/art_65]
    unit: thousands
    table: 'Tableau 1.39 : Actes de mariage selon le type'
    lines:
