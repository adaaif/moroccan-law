      - {year: 2024, judicial: 65475, agreement: 23396, from: ed2026, page: 46}
    notes:
      - {ar: 'لا يفسر المصدر قفزة 2019 (من 53257 إلى 91106).', fr: 'La source n’explique pas le bond de 2019 (de 53 257 à 91 106).'}
      - {ar: 'التطليق للشقاق وحده 64565 من 65475 سنة 2024.', fr: 'La discorde seule compte pour 64 565 des 65 475 divorces judiciaires de 2024.'}

  - key: marriages
    title: {ar: رسوم الزواج, fr: Les actes de mariage}
    lead:
