  ed2026: {title: 'Les indicateurs sociaux du Maroc, édition 2026', url: 'https://www.hcp.ma/file/248623/', path: sources/hcp/hcp_indicateurs_sociaux_2026.pdf, sha256: 5274142b6336d35064f34ff4316dcd939d7dabe9c64d55ec01b843b76175f10e}

series:
  - key: minors
    title: {ar: 'زواج القاصرين: الطلبات والأذون', fr: 'Mariage des mineurs : demandes et autorisations'}
    lead:
      ar: 'طلبات الإذن بزواج من هم دون 18 سنة المسجلة لدى قضاة الأسرة، وما قبل منها، حسب المادة 20.'
      fr: 'Les demandes d’autorisation de marier une personne de moins de 18 ans enregistrées par les juges de la famille, et celles acceptées, selon l’article 20.'
    cites: [/ma/loi/70-03/art_20]
    table: 'Tableau 1.40 : Demandes enregistrées de mariage de mineurs'
    lines:
      - {key: requests, label: {ar: الطلبات, fr: Demandes}}
      - {key: granted, label: {ar: المقبولة, fr: Acceptées}}
    years:
      - {year: 2018, requests: 32104, granted: 26240, from: ed2026, page: 45}
      - {year: 2019, requests: 33368, granted: 24426, from: ed2026, page: 45}
      - {year: 2020, requests: 21373, granted: 16359, from: ed2023, page: 43}
      - {year: 2021, requests: 28303, granted: 21433, from: ed2024, page: 43}
      - {year: 2022, requests: 20605, granted: 13841, from: ed2024, page: 43}
      - {year: 2023, requests: 18297, granted: 13538, from: ed2026, page: 45}
      - {year: 2024, requests: 15425, granted: 9842, from: ed2026, page: 45}
    notes:
      - {ar: 'أرقام 2019 كما نشرت لا تتطابق: المقبولة (24426) والمرفوضة (6942) مجموعها 31368، والمجموع المنشور 33368.', fr: 'Les chiffres de 2019 tels que publiés ne concordent pas : acceptées (24 426) et refusées (6 942) font 31 368, pour un total publié de 33 368.'}
      - {ar: 'أكثر من 99% من الطلبات تخص فتيات.', fr: 'Plus de 99 % des demandes concernent des filles.'}

  - key: divorce
    title: {ar: 'الطلاق بالاتفاق والتطليق', fr: 'Divorce par consentement et divorce judiciaire'}
    lead:
      ar: 'رسوم الطلاق بالاتفاق التي يوثقها العدول، وأحكام التطليق المحكوم بها (أغلبها للشقاق).'
      fr: 'Les actes de divorce par consentement mutuel dressés par les adouls, et les divorces judiciaires prononcés (presque tous pour discorde).'
    cites: [/ma/loi/70-03/art_114, /ma/loi/70-03/art_97]
    table: 'Tableaux 1.41 et 1.42 : Actes de divorce selon le type ; Divorces judiciaires prononcés'
    lines:
      - {key: judicial, label: {ar: التطليق المحكوم به, fr: Divorces judiciaires prononcés}}
      - {key: agreement, label: {ar: الطلاق بالاتفاق, fr: Par consentement mutuel}}
    years:
      - {year: 2018, judicial: 53257, agreement: 19696, from: ed2026, page: 46}
      - {year: 2019, judicial: 91106, agreement: 21213, from: ed2026, page: 46}
