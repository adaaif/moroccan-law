# The family in numbers (F13 of the family plan): the Ministry of Justice's yearly counts as the HCP prints them in
# «Les indicateurs sociaux du Maroc». Each year is read from the edition named in `from`, on its printed page, copied
# by hand on 20 Oct 2026 and read twice. The files are kept under CORPUS_DIR/sources/hcp/ with their hashes; a
# published inconsistency is shown, not repaired.

files:
