# The family topic's page (F3 of the family plan; the family-papers review, 26 Oct 2026): what is happening, said
# the way people say it, each door leading to its journey or page, in a life's order (G2: marrying, a birth, kafala,
# separating, the children after, unpaid nafaqa, a death, abroad, protection); the reader's answer to the one question
# reorders them (G3). A door's `sign` is the office where its passage ends (G1): the adouls' act (act), the civil-status
# record (record), the family court (court), the consulate (consul); protection has no paper, a shield in ink (shield).
# A door's `means` is the law's own phrase for its words: a question that is one of them is searched as that phrase
# first (G15).
doors_title: {ar: شنو وقع ليك؟, fr: 'Que vous arrive-t-il ?'}

# The question (G3), in the family's plural: the same for women and men. Each answer leads with its door (`first`) and
# shows the figures that are its own, each with the articles that set it.
profile:
  question: {ar: شنو وضعكم؟, fr: 'Quelle est votre situation ?'}
  we: {ar: حنا, fr: Nous}
  options:
    - key: engaged
      first: marry
      main: true
      label: {ar: غادي نتزوجو, fr: Nous allons nous marier}
      law: {ar: 'الزواج في مدونة الأسرة (المواد 4 إلى 69): الأهلية، والصداق، والملف، والعقد عند العدلين.', fr: 'Le mariage dans le Code de la famille (art. 4 à 69) : la capacité, la dot, le dossier, l’acte chez les adouls.'}
      facts:
        - {value: '18', label: {ar: 'سنة لكل واحد منكما: سن الزواج', fr: 'ans pour chacun : l’âge du mariage'}, cites: [/ma/loi/70-03/art_19]}
        - {value: {ar: الصداق, fr: La dot}, label: {ar: 'ملك للزوجة، ولا يتفق على إسقاطه', fr: 'appartient à l’épouse ; on ne convient pas de la supprimer'}, cites: [/ma/loi/70-03/art_29, /ma/loi/70-03/art_13]}
        - {value: {ar: الأموال, fr: Les biens}, label: {ar: 'لكل واحد ذمته؛ ويمكن الاتفاق على ما سيكتسب في وثيقة مستقلة', fr: 'chacun son patrimoine ; un accord sur les acquêts dans un document à part'}, cites: [/ma/loi/70-03/art_49]}
      to: journeys/marry
    - key: married
      first: birth
      label: {ar: مزوجين, fr: Nous sommes mariés}
      law: {ar: 'حقوق الزوجين وواجباتهما في المواد 51 إلى 53، وأموالهما في المادة 49.', fr: 'Les droits et devoirs des époux aux art. 51 à 53 ; leurs biens à l’art. 49.'}
      facts:
        - {value: {ar: الذمة, fr: Patrimoine}, label: {ar: 'لكل واحد منكما ذمة مالية مستقلة', fr: 'chacun des époux a le sien'}, cites: [/ma/loi/70-03/art_49]}
        - {value: {ar: الشرط, fr: La condition}, label: {ar: 'شرط الزوجة ألا يتزوج عليها يمنع التعدد', fr: 'la condition de l’épouse interdit la polygamie'}, cites: [/ma/loi/70-03/art_40]}
        - {value: '30', label: {ar: 'يوما للتصريح بمولود من اليوم الموالي لولادته', fr: 'jours pour déclarer une naissance, dès le lendemain'}, cites: [/ma/decret/2-22-04/art_40]}
    - key: young
      first: birth
      main: true
      label: {ar: عندنا ولاد صغار, fr: Nous avons de jeunes enfants}
      law: {ar: 'التصريح بالولادة في القانون 36.21 ومرسومه 2.22.04، والدعم المباشر في القانون 58.23.', fr: 'La déclaration de naissance dans la loi 36-21 et son décret 2-22-04 ; l’aide directe dans la loi 58-23.'}
      facts:
        - {value: '30', label: {ar: 'يوما للتصريح بالولادة', fr: 'jours pour déclarer la naissance'}, cites: [/ma/decret/2-22-04/art_40]}
        - {value: '6', label: {ar: 'أشهر لطلب منحة الولادة', fr: 'mois pour demander la prime de naissance'}, cites: [/ma/loi/58-23/art_3]}
        - {value: '21', label: {ar: 'سنة: يحسب الولد في الدعم المباشر حتى يبلغها', fr: 'ans : l’enfant compte pour l’aide directe jusque-là'}, cites: [/ma/loi/58-23/art_2]}
      to: tools/support
    - key: separated
      first: children
      main: true
      label: {ar: تفارقنا وعندنا ولاد, fr: Nous sommes séparés et avons des enfants}
      law: {ar: 'الحضانة في المواد 163 إلى 186، ونفقة الأولاد في المواد 187 إلى 202 من مدونة الأسرة.', fr: 'La garde aux art. 163 à 186 et la pension des enfants aux art. 187 à 202 du Code de la famille.'}
      facts:
        - {value: '18', label: {ar: 'سنة: الحضانة حتى الرشد، للذكر والأنثى', fr: 'ans : la garde jusqu’à la majorité, garçon ou fille'}, cites: [/ma/loi/70-03/art_166]}
        - {value: '15', label: {ar: 'سنة: يختار الولد من يحضنه من أبيه أو أمه', fr: 'ans : l’enfant choisit lequel de ses parents le garde'}, cites: [/ma/loi/70-03/art_166]}
        - {value: '25', label: {ar: 'سنة: النفقة لمن يتابع دراسته', fr: 'ans : la pension pour celui qui étudie'}, cites: [/ma/loi/70-03/art_198]}
      to: pages/child
    - key: bereaved
      first: death
      main: true
      label: {ar: توفى لينا شي حد, fr: Un proche est décédé}
      law: {ar: 'التصريح بالوفاة في المرسوم 2.22.04، والتركة والوصية والميراث في الكتابين الخامس والسادس من مدونة الأسرة.', fr: 'La déclaration du décès dans le décret 2-22-04 ; la succession, le testament et l’héritage aux livres V et VI du Code de la famille.'}
      facts:
        - {value: '30', label: {ar: 'يوما للتصريح بالوفاة من اليوم الموالي لها', fr: 'jours pour déclarer le décès, dès le lendemain'}, cites: [/ma/decret/2-22-04/art_40]}
        - {value: {ar: '4 أشهر و10 أيام', fr: '4 mois et 10 jours'}, label: {ar: 'عدة المتوفى عنها غير الحامل', fr: 'la retraite de la veuve non enceinte'}, cites: [/ma/loi/70-03/art_132]}
        - {value: {ar: الثلث, fr: Le tiers}, label: {ar: 'حد الوصية من مال الميت', fr: 'la limite du testament'}, cites: [/ma/loi/70-03/art_277]}
      to: journeys/heirs
    - key: abroad
      first: abroad
      label: {ar: ساكنين برا المغرب, fr: Nous vivons à l’étranger}
      law: {ar: 'زواج المغاربة بالخارج في المادتين 14 و15 من مدونة الأسرة، والتصريح بالولادة والوفاة في المرسوم 2.22.04.', fr: 'Le mariage des Marocains à l’étranger aux art. 14 et 15 du Code ; les déclarations de naissance et de décès dans le décret 2-22-04.'}
      facts:
        - {value: '3', label: {ar: 'أشهر لإيداع نسخة عقد زواج أبرم حسب قانون بلد الإقامة', fr: 'mois pour déposer la copie d’un mariage conclu selon la loi locale'}, cites: [/ma/loi/70-03/art_15]}
        - {value: '1', label: {ar: 'سنة للتصريح بولادة أو وفاة بالخارج', fr: 'an pour déclarer une naissance ou un décès à l’étranger'}, cites: [/ma/decret/2-22-04/art_40]}
      to: pages/abroad

