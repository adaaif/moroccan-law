# What people say of the reform (G6), from the Ulema's accepted questions: each answered by the article in force, and
# leading to the reform's page. Drafts until a person checks them with the reform (reform/reform).
beliefs:
  - claim: {ar: الأم إلا تزوجات كتبقى عندها الحضانة, fr: 'La mère qui se remarie garde ses enfants'}
    truth: {ar: 'ماشي بعد: من بعد 7 سنين ديال الولد، زواجها يقدر يسقطها إلا فحالات (المادة 175). البقاء مقترح معلن.', fr: 'Pas encore : passé 7 ans, son remariage peut lui faire perdre la garde, sauf exceptions (art. 175). Son maintien est une proposition annoncée.'}
    to: reform/reform
  - claim: {ar: سن الزواج ولا 17 عام, fr: 'L’âge du mariage est passé à 17 ans'}
    truth: {ar: 'ماشي بعد: 18 عام، وقبلها غير بإذن القاضي (المادتان 19 و20).', fr: 'Pas encore : 18 ans, et avant seulement avec l’autorisation du juge (art. 19 et 20).'}
    to: reform/reform
  - claim: {ar: الولاية على الولاد ولات للأب والأم بجوج, fr: 'La tutelle des enfants revient aux deux parents'}
    truth: {ar: 'ماشي بعد: النائب الشرعي هو الأب، ومن بعدو الأم (المادة 231).', fr: 'Pas encore : le représentant légal est le père, puis la mère (art. 231).'}
    to: reform/reform

# The order a reviewer opens the topic in (G16): the passages most people meet first; the five ways, the children and
# nafaqa; then kafala, abroad and protection; the inheritance cases last, with an adoul.
waves:
  1: [journeys/birth, journeys/marry, checklists/marriage-file, checklists/birth, journeys/heirs, tools/dates, tools/support]
  2: [pages/ways, journeys/divorce-agreement, journeys/khul, journeys/talaq, journeys/shiqaq, checklists/talaq-request, pages/child, pages/money, pages/numbers, series/minors, series/divorce, series/marriages, reform/reform]
  3: [journeys/kafala, checklists/kafala, pages/abroad, pages/protection, tools/inheritance]
