# The places' list, as a person keeps it (PL1 of the places review, 1 Nov 2026). `manage.py make_gazetteer` joins
# it to the kept sources (the UN's M49 names, Natural Earth's Morocco edition, the 2024 census decree's tables read on
# their pages, GeoNames) and writes places.json beside it. Every spelling below is one the Bulletin printed.
# Matching folds both sides (أ إ آ ٱ → ا, ى → ي, ة → ه, no tatweel or harakat) and lets a name carry و ب ل ف ك or لل.

countries:
  # Each state's spellings beyond its UN name: from the agreements post's words and the places pilot (31 Oct 2026), and
  # the old Bulletin's (6 Nov 2026, BH4 of the posts-from-No.-1 review): «فرانسا», «الدولة الفرنسوية», «اصبانيا», «انكلترا»,
  # «اطاليا», «هولاندا», counted in its 1913–1955 texts. An adjective alone («الفرنساوي») names no state (C4); with
  # «الدولة» or «الجمهورية» it is the state's name.
  # A word that is also a common word never stands alone here: «مالي» is «financial», «قطر» a diameter, «بنين» sons,
  # «سيلان» a leak, «عمان» the capital of Jordan; they come with «جمهورية», «دولة» or «سلطنة».
