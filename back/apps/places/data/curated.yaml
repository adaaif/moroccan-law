  # A name that is also a person's first name counts only beside a state word (1956–69 lists of civil servants print
  # «مارك بن اسرائيل»): the state as «دولة إسرائيل», «إسرائيل» after مع، و، ب، ل, or in a title.
  # «بليز» is also Blaise («زقاق بليز باسكال»).
  ctx: [ISR, BLZ]
  # A spelling that is also a word, a man's name or a Moroccan place counts only beside a state word, with و ب ل, or in a
  # title, as `ctx` (BH12 of the posts-from-No.-1 review, read on every state named before 1956): «بيرو» the bureau and
  # «دي بيرو», «كوريا ماركوس» and «الشيلي» men, «ايران اثنان» two ares and «اسيف ايران» a stream, «للولاة البحرين» the
  # sailors, «برونى ألفريد», «عزيب بوتان», «اغيل توغو», «هيلو دومينيكا», «فانسانت رواندا», «بنمـا» and «ملاوي» in civil lists
