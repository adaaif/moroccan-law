# «الإعدام في القانون المغربي»: the blog's twentieth post (S12 of the first-principles review, 6 Nov 2026: «Yes», C4
# as recommended: documentary, every line a quoted article; built 7 Nov 2026). No position: every sentence is an article
# or a report the Bulletin printed. The penal code is read in our copy (Adala's, 2024) and each article that names
# the death penalty is found on the page of its first printing (BO 2640 bis, 5 June 1963) or of the law that added it
# (03.03, BO 5112); the procedure is the code of criminal procedure as printed (BO 5078, 2003) and as amended (03.23, BO
# 7437, 2025); the figures are the CNDH's annual reports, printed in the Bulletin. A person checks every quote on its
# page before the post is published.
slug: death-penalty
number: 20
status: draft
date: null
counted_on: 2026-11-07
title:
  ar: "الإعدام في القانون المغربي: 30 فصلا في القانون الجنائي، وظهير من 1959 على بيع طعام خطر"
  fr: "La peine de mort dans la loi marocaine : 30 articles du code pénal, et un dahir de 1959 sur la vente d’aliments dangereux"
lead:
  ar: "يعاقب القانون الجنائي بالإعدام في 30 فصلا، 28 منها مكتوبة منذ صدوره سنة 1962. ويعاقب به قانون القضاء العسكري في 5 مواد، وظهير من 1961 على تخريب السكك الحديدية إذا نتج عنه قتل، وظهير من 1959 على صنع طعام خطر على الصحة أو بيعه، ولو قبل صدوره. ولم يُنفَّذ حكم بالإعدام منذ 1993، كما كتب المجلس الوطني لحقوق الإنسان في تقريره المنشور بالجريدة الرسمية، وكان في السجون 86 محكوما به في نهاية 2024."
  fr: "Le code pénal punit de mort dans 30 articles, dont 28 y sont écrits depuis sa promulgation en 1962. Le code de justice militaire la prévoit dans 5 articles, un dahir de 1961 pour le sabotage d’une voie ferrée qui tue, et un dahir de 1959 pour qui fabrique ou vend un aliment dangereux pour la santé, même avant sa publication. Aucune exécution n’a eu lieu depuis 1993, écrit le Conseil national des droits de l’Homme dans son rapport publié au Bulletin officiel ; 86 condamnés à mort étaient en prison fin 2024."

