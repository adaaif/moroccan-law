# From the sentence to the burial, as the code of criminal procedure (22.01) and the prisons' decree (2.00.485) write it,
# in that order. `was`: what the 1962 penal code or the 1959 dahir said first.
steps:
  - {key: unanimity, akn: /akn/ma/act/loi/22-01, art: "430", issue: 7437, page: 6969, since: 2025,
     words: "لا يمكن النطق بعقوبة الإعدام إلا بإجماع القضاة الذين تتألف منهم هيئة الحكم، ويشار إلى الإجماع في منطوق الحكم"}
  - {key: minister, akn: /akn/ma/act/loi/22-01, art: "601", issue: 5078, page: 482,
     words: "يتعين على النيابة العامة أن تنهي إلى علم وزير العدل كل قرار بعقوبة الإعدام بمجرد صدوره"}
  - {key: proposal, akn: /akn/ma/act/loi/22-01, art: "596", issue: 7437, page: 7002, since: 2025,
     words: "يتعين عليه تقديم مقترحات للعفو التلقائي بالنسبة للأشخاص المحكوم عليهم بالإعدام"}
  - {key: cell, akn: /akn/ma/act/decret/2-00-485, art: "143", issue: 4848, page: 3042,
     words: "يخضع المحكوم عليهم بالإعدام لنظام الاعتقال الانفرادي حسب الإمكان"}
  - {key: never, akn: /akn/ma/act/decret/2-00-485, art: "145", issue: 4848, page: 3043,
     words: "يمنع في أي حال من الأحوال تبليغ المحكوم عليه بالإعدام بقرار رفض طلب العفو"}
  - {key: pardon, akn: /akn/ma/act/loi/22-01, art: "602", issue: 5078, page: 482,
     words: "لا يمكن تنفيذ عقوبة الإعدام إلا بعد رفض طلب العفو"}
  - {key: pregnant, akn: /akn/ma/act/loi/22-01, art: "602", issue: 5078, page: 482,
     words: "إذا كانت المحكوم عليها امرأة ثبت حملها، فإنها لا تعدم إلا بعد مرور سنتين على وضع حملها",
     was: {issue: 2640, bis: true, page: 1255, art: "21", year: 1962, words: "لا تعدم الا بعد أن تضع حملها باربعين يوما"}}
  - {key: order, akn: /akn/ma/act/loi/22-01, art: "602", issue: 5078, page: 482,
     words: "تنفذ عقوبة الإعدام بأمر من وزير العدل رميا بالرصاص، وتقوم بذلك السلطة العسكرية"}
  - {key: witnesses, akn: /akn/ma/act/loi/22-01, art: "603", issue: 5078, page: 483,
     words: "لا يكون التنفيذ علنيا إلا إذا قرر وزير العدل ذلك"}
  - {key: posted, akn: /akn/ma/act/loi/22-01, art: "605", issue: 5078, page: 483,
     words: "تعلق مباشرة بعد التنفيذ نسخة من هذا المحضر بباب المؤسسة السجنية التي وقع فيها التنفيذ وتبقى معلقة لمدة أربع وعشرين ساعة"}
  - {key: press, akn: /akn/ma/act/loi/22-01, art: "606", issue: 5078, page: 483,
     words: "لا يمكن أن ينشر عن طريق الصحافة أي بيان أو مستند يتعلق بالتنفيذ ما عدا المحضر المذكور، وإلا تعرض المخالف لغرامة تتراوح بين 10.000 و60.000 درهم",
     was: {issue: 2435, page: 1951, art: "8", year: 1959, akn: /akn/ma/act/dahir/1-59-023, words: "بغرامة يتراوح قدرها بين 20.000 و 2.000.000 من الفرنكات"}}
  - {key: body, akn: /akn/ma/act/loi/22-01, art: "607", issue: 5078, page: 484,
     words: "تسلم جثة المحكوم عليه إثر التنفيذ إلى عائلته إذا طلبت ذلك، على أن تلتزم بدفنه في غير علانية"}
