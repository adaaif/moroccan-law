title:
  ar: ستة دساتير في صفحة واحدة
  fr: Six constitutions sur une page
lead:
  ar: من 110 فصول في 1962 إلى 180 في 2011. وضعنا الدساتير الستة جنبا إلى جنب، فصلا بفصل، ونظرنا في كل فصل ماذا بقي منه في الدستور الذي جاء بعده.
  fr: De 110 articles en 1962 à 180 en 2011. Nous avons posé les six constitutions côte à côte, article par article, et regardé ce que chacune a gardé de la précédente.

