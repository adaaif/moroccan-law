title:
  ar: "نزع الملكية: 912 مرسوما منذ 2020، قرابة نصفها من أجل الماء"
  fr: "L’expropriation : 912 décrets depuis 2020, près de la moitié pour l’eau"
lead:
  ar: "كلما احتاجت الدولة أرضا لطريق أو سد أو مدرسة، نشرت الجريدة الرسمية مرسوما «بإعلان أن المنفعة العامة تقضي» بالمشروع «وبنزع ملكية» الأرض اللازمة له. منذ 2020 نُشر منها 912، أي نحو 134 في السنة، أكثر من أي عقد قبله. وقرابة نصفها من أجل الماء: السدود والماء الصالح للشرب والتطهير، بعد ثلثها في العقد السابق."
  fr: "Chaque fois que l’État a besoin d’un terrain pour une route, un barrage ou une école, le Bulletin officiel publie un décret « déclarant d’utilité publique » le projet « et frappant d’expropriation » les terrains nécessaires. Depuis 2020, il en a publié 912, environ 134 par an, plus qu’en aucune décennie avant. Près de la moitié sont pour l’eau : barrages, eau potable, assainissement, contre un tiers la décennie précédente."

