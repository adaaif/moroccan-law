# The law and the Constitution, as printed.
law: {number: "7.81", issue: 3685, page: 980, date: "1983-06-15", akn: /akn/ma/act/loi/7-81,
      words: "إن نزع ملكية العقارات كلا أو بعضا أو ملكية الحقوق العينية العقارية لا يجوز الحكم به إلا إذا أعلنت المنفعة العامة، ولا يمكن إجراؤه إلا طبق الكيفيات المقررة في هذا القانون"}
constitution: {year: 2011, art: "35", issue: 5964, bis: true, page: 3607, akn: /akn/ma/act/dahir/1-11-91,
               words: "يضمن القانون حق الملكية. ويمكن الحد من نطاقها وممارستها بموجب القانون، إذا اقتضت ذلك متطلبات التنمية الاقتصادية والاجتماعية للبلاد. ولا يمكن نزع الملكية إلا في الحالات ووفق الإجراءات التي ينص عليها القانون."}
