# Where the Bulletin stops writing the price. From 1 February 1995 order 43.95 ties the purchase prices to world prices
# each month and the sale prices follow them «وتنشرها الوزارة المكلفة بالطاقة», until order 1144.02 fixes them again from
# 16 July 2002. From 16 January 2014 decision 3.01.14 revises them on the 1st and 16th of each month; order 4554.14
# (30 December 2014) says how the public learns them.
away:
  - key: ministry
    from: 1995-02-01
    to: 2002-07-16
    text: {number: "43.95", issue: 4292, page: 224, akn: /akn/ma/act/arrete/43-95}
    words:
      ar: "تراجع الأسعار الأساسية القصوى التي تباع بها المحروقات السائلة للجمهور على أساس أسعار الشراء … وتنشرها الوزارة المكلفة بالطاقة."
      fr: "Les prix de base maximaux de vente au public des carburants sont révisés sur la base des prix d’achat … et publiés par le ministère chargé de l’énergie."
  - key: means
    from: 2014-01-16
    text: {number: "4554.14", issue: 6321, bis: true, page: 8778, akn: /akn/ma/act/arrete/4554-14}
    words:
      ar: "تحسب الأسعار الأساسية القصوى التي تباع بها المحروقات السائلة للجمهور في اليومين الأول والسادس عشر من كل شهر … يتم إعلام الجمهور بالأسعار الأساسية القصوى لبيع المحروقات السائلة بكل وسيلة من وسائل الاتصال الملائمة."
      fr: "Les prix de base maximaux de vente au public des carburants sont calculés le 1er et le 16 de chaque mois … Le public est informé de ces prix par tout moyen de communication approprié."
