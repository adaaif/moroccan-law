# «الخبز والغازوال، يوم كانت الجريدة الرسمية تكتب ثمنهما»: the blog's fifteenth post (S2 and S3 of
# the first-principles review, 6 Nov 2026: «Yes» to both, built as one post). Every price is read in its order's article as the corpus
# holds it (6 Nov 2026); where the text layer lost a table or a cell (the sugar orders, 1980's sugar and butter, the
# 1984 base order) on the printed page's image. A person checks every figure on its page before the post is published.
# The figures (manage.py blog_figures bread-gasoil) tie each order to its page and address, and take the minimum wage
# from the sixth post's checked steps.
slug: bread-gasoil
number: 15
status: draft
date: null
counted_on: 2026-11-06
title:
  ar: الخبز والغازوال، يوم كانت الجريدة الرسمية تكتب ثمنهما
  fr: Le pain et le gasoil, quand le Bulletin officiel en écrivait le prix
lead:
  ar: في 28 ماي 1981 نشرت الجريدة الرسمية خمسة قرارات رفعت ثمن الخبز والسكر والزيت والزبدة والدقيق. وفي 10 يونيو نشرت خمسة قرارات أخرى أرجعت من 45 إلى 69 في المائة من كل زيادة. ومن 1975 إلى 2014 كتبت 23 ثمنا للتر الغازوال، ثم قال قرار إن الجمهور يُخبَر به «بكل وسيلة من وسائل الاتصال الملائمة».
  fr: Le 28 mai 1981, le Bulletin officiel publiait cinq arrêtés qui relevaient le prix du pain, du sucre, de l’huile, du beurre et de la farine. Le 10 juin, il en publiait cinq autres qui retiraient de 45 à 69 % de chaque hausse. De 1975 à 2014, il a écrit 23 prix du litre de gasoil ; puis un arrêté a dit que le public en serait informé « par tout moyen de communication approprié ».

# The three issues that printed the basket: 3 September 1980, 28 May 1981, 10 June 1981. `from`: the day the orders
# say they apply (in May each order's last article says 29 May, the bread's on page 631; in June, 7 June).
issues:
  - {key: sep80, issue: 3540, date: 1980-09-03, from: 1980-09-05}
  - {key: may81, issue: 3578, bis: true, date: 1981-05-28, from: 1981-05-29}
  - {key: jun81, issue: 3580, date: 1981-06-10, from: 1981-06-07}

