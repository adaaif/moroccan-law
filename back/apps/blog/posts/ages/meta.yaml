# Seven ages that moved, each step with the text that wrote it, read on its page. Majority: 21 in book IV of the 1958 code
# (chapter 137), 20 by law 13.92, 18 by law 63.02 (the family code of 2004 keeps it, art. 209). The girl's marriage: 15 in
# the 1957 code (chapter 8; the boy's 18), 18 for both in 2004. Criminal majority: 16 in the penal code as printed in
# 1963 (chapter 140), 18 in the criminal procedure of 2003 (art. 458). No prison for a minor: under 12 in 2003 (art.
# 473), under 14 for a crime and 16 for an offence by law 03.23 (2025). School: 6 to 15 by law 04.00 (2000), 4 to 16 by
# the framework law (2019). The civil servant's retirement: 60 by law 012.71 (1971), 63 by law 72.14 (2016).
