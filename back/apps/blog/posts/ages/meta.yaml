# «حياتك بأعمار القانون»: the blog's sixteenth post (S9 of the first-principles review, 6 Nov 2026: «Yes»; built 7
# Nov 2026). Every age is read in its article as the corpus holds it (7 Nov 2026), and its page is the Bulletin's: where
# the site holds a code only as Adala's consolidation (the family code, the labour code, the road code, the CNSS dahir,
# the voters' and the domestic workers' laws), the article was found on the issue that printed it, its words matched on
# the page's text. An age a later law wrote is that law's page (the moped at 14 by law 116.14, the minor's prison and
# the debtor's at 60 by law 03.23). A person checks every age on its page before the post is published.
slug: ages
number: 16
status: draft
date: null
counted_on: 2026-11-07
title:
  ar: "حياتك بأعمار القانون"
  fr: "Votre vie aux âges de la loi"
lead:
  ar: "من الولادة إلى الخامسة والستين، تكتب القوانين المغربية أعمارا تبدأ عندها أشياء وتنتهي أخرى. قرأنا 35 منها في 14 نصا، كل سن في مادتها وعلى صفحتها من الجريدة الرسمية. 28 منها قبل السادسة والعشرين، وواحدة فقط بين 26 و54. وسبعة أعمار تغيرت منذ 1957."
  fr: "De la naissance à 65 ans, les lois marocaines écrivent des âges où des choses commencent et d’autres finissent. Nous en avons lu 35 dans 14 textes, chaque âge dans son article et sur sa page du Bulletin officiel. 28 tombent avant 26 ans, un seul entre 26 et 54. Et sept âges ont changé depuis 1957."

