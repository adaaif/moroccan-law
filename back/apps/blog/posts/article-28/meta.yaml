title:
  ar: "الفصل 28، كما طبعته الجريدة الرسمية سنة 1967"
  fr: "L’article 28, tel que le Bulletin officiel l’a imprimé en 1967"
lead:
  ar: "يمنع الفصل 28 بيع المشروبات الكحولية أو تقديمها مجانا «الى المغاربة المسلمين». ليس قانونا صوّت عليه البرلمان: هو فصل من قرار للمدير العام للديوان الملكي بتاريخ 17 يوليوز 1967، من 47 فصلا، اتُّخذ بتفويض من مرسوم ملكي. يخاطب مستغل المؤسسة المرخص لها، ويعاقبه بالحبس من شهر إلى ستة أشهر وبغرامة من 300 إلى 1.500 درهم. وفي 1913، كان أول ظهير في الموضوع يمنع على المسلمين أنفسهم دخول الخمارات للشرب."
  fr: "L’article 28 interdit de vendre ou d’offrir gratuitement des boissons alcooliques « aux Marocains musulmans ». Ce n’est pas une loi votée par le Parlement : c’est l’article d’un arrêté du directeur général du Cabinet royal du 17 juillet 1967, qui en compte 47, pris sur délégation d’un décret royal. Il s’adresse à l’exploitant d’un établissement autorisé, puni d’un à six mois de prison et de 300 à 1 500 dirhams d’amende. En 1913, le premier dahir sur le sujet interdisait aux musulmans eux-mêmes d’entrer dans les débits pour y boire."

