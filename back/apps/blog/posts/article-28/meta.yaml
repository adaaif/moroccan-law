# Article 44: what the order repealed, as printed (p. 1662).
repealed: "تلغى جميع المقتضيات المتعلقة بنفس الموضوع ولاسيما : القانون الصادر في 10 ذي الحجة 1347 (18 مايو 1929) ببيع أنواع الكحول والمشروبات الكحولية الى المغاربة المسلمين ؛ القرار الوزيرى الصادر في 10 محرم 1354 (15 أبريل 1935) بالمصادقة على النظام المتعلق باستغلال المؤسسات المستهلكة فيها المشروبات الكحولية وبتطبيقه ؛ القرار الوزيرى الصادر في 23 صفر 1356 (5 مايو 1937) بتنظيم أماكن بيع المشروبات والاكلات الخفيفة وأماكن بيع الماحيا حسبما وقع تغييره أو تتميمه ؛ القانون الصادر في 27 شوال 1372 (10 يوليوز 1953) بتنظيم أماكن بيع المشروبات."

