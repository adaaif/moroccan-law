# «الفصل 28، كما طبعته الجريدة الرسمية سنة 1967»: the blog's seventeenth post (S13 of the first-principles review, 6
# Nov 2026: «Yes»; built 7 Nov 2026). The order is read whole on the site (7 Nov 2026: 47 articles, BO 2856, pp.
# 1658–1663) and its article 28 on the printed page (p. 1661); the 1913 dahir on its pages (BO 8, pp. 56–58), where
# our text layer is too rough to quote. The tone is the review's (C4, S13): the text, its date, its penalties,
# nothing else. Officials are named only before 1956 (C2). A person checks every quote and figure on its page before the
# post is published.
