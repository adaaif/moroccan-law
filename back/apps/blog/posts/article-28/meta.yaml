# Article 28 as printed (p. 1661), word for word, its three paragraphs; where it stands on the page's image, as shares of
# the image (left, top, right, bottom) and the image's height over its width, read on the image; our translation
# (the official French text of 1967 is not held here). `marks`: the words a note opens, as printed.
art28:
  page: 1661
  crop: {left: 0.0689, top: 0.4101, right: 0.5107, bottom: 0.5696, ratio: 1.2650}
  ar:
    - "يمنع على مستغل كل مؤسسة تتوقف على رخصة أن يبيع أو يقدم مجانا مشروبات كحولية أو ممزوجة بالكحول الى المغاربة المسلمين."
    - "ويعاقب عن المخالفات للمقتضيات السابقة بالحبس لمدة تتراوح بين شهر واحد وستة أشهر وبغرامة تتراوح بين 300 و 1.500 درهم أو باحدى هاتين العقوبتين فقط."
    - "وفي حالة العود الى المخالفة يمكن أن تضاعف عقوبة الحبس والغرامة المنصوص عليهما أعلاه."
  fr:
    - "Il est interdit à l’exploitant de tout établissement soumis à licence de vendre ou d’offrir gratuitement des boissons alcooliques ou alcoolisées aux Marocains musulmans."
    - "Les infractions aux dispositions qui précèdent sont punies d’un emprisonnement d’un à six mois et d’une amende de 300 à 1 500 dirhams, ou de l’une de ces deux peines seulement."
    - "En cas de récidive, l’emprisonnement et l’amende prévus ci-dessus peuvent être portés au double."
