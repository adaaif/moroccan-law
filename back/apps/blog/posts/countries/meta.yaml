title:
  ar: "العالم في الجريدة الرسمية"
  fr: "Le monde au Bulletin officiel"
lead:
  ar: "في 1913–1919 ذكرت الجريدة الرسمية فرنسا في 50 نصا من كل ألف، وفي 2020–2025 في 6. وصارت أوكرانيا، التي لم تذكرها قبل 1997، أكثر البلدان ذكرا، أغلبها بلوائح معادلة الشهادات الجامعية. عددنا كل بلد في 183.327 نصا منذ العدد الأول: ذكرت الجريدة الرسمية 190 بلدا مرة على الأقل، و10 بلدان لم تعد قائمة."
  fr: "En 1913–1919, le Bulletin officiel citait la France dans 50 textes sur mille ; en 2020–2025, dans 6. L’Ukraine, qu’il ne citait pas avant 1997, est devenue le pays le plus cité, surtout par les listes d’équivalence des diplômes. Nous avons compté chaque pays dans 183 327 textes depuis le numéro 1 : le Bulletin a cité 190 pays au moins une fois, et 10 pays qui n’existent plus."
