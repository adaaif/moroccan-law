title:
  ar: "من التوقيع إلى الجريدة: كم ينتظر القانون؟"
  fr: "De la signature au Bulletin : combien de temps attend une loi ?"
lead:
  ar: "نصف القوانين يُنشر في 18 يوما أو أقل بعد ظهير تنفيذه. لكن القوانين التي توافق على اتفاقية دولية تنتظر أكثر، وانتظر أحدها ثماني سنوات ونصفا. قسنا المدة بين التوقيع والنشر لكل نص منذ 1956."
  fr: "La moitié des lois paraissent dans les 18 jours qui suivent leur dahir de promulgation. Celles qui approuvent un accord international attendent davantage, l’une huit ans et demi. Nous avons mesuré le délai entre signature et publication de chaque texte depuis 1956."
