title:
  ar: "حالة الطوارئ الصحية: إعلان و33 مرسوما، من مارس 2020 إلى فبراير 2023"
  fr: "L’état d’urgence sanitaire : une déclaration et 33 décrets, de mars 2020 à février 2023"
lead:
  ar: "في 24 مارس 2020 نشرت الجريدة الرسمية مرسوما بقانون يحدد أحكام حالة الطوارئ الصحية، ومرسوما يعلنها في سائر التراب الوطني إلى 20 أبريل. ثم مددتها 33 مرسوما، شهرا بعد شهر، حتى 28 فبراير 2023 في الساعة السادسة مساء: قرابة ثلاث سنوات. ومخالفة أوامر السلطات تعاقب بالحبس من شهر إلى ثلاثة أشهر وبغرامة من 300 إلى 1.300 درهم، أو بمصالحة بـ300 درهم تؤدى في الحين."
  fr: "Le 24 mars 2020, le Bulletin officiel publie un décret-loi édictant les dispositions de l’état d’urgence sanitaire, et un décret qui le déclare sur tout le territoire jusqu’au 20 avril. Puis 33 décrets l’ont prolongé, mois après mois, jusqu’au 28 février 2023 à six heures du soir : près de trois ans. Enfreindre les ordres des autorités est puni d’un à trois mois de prison et d’une amende de 300 à 1 300 dirhams, ou d’une transaction de 300 dirhams payée sur-le-champ."

# The texts: a decree that extends the emergency, or that changes such a decree's term.
