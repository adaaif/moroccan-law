# «من غرينيتش إلى غرينيتش»: the blog's thirteenth post (S6 of the first-principles review, 6 Nov 2026: «Yes», C1
# left as recommended: the clock first). Every move below was read in its text's article on the printed page (6 Nov
# 2026): the day and hour as the text words them, local legal time before the move. A person checks each one on its page
# before the post is published. The figures (manage.py blog_figures clock) tie each text to its issue, its printed page
# and, when the site has cut it, its address; and read Ramadan's first day from the Bulletin's own Hijri dates.
slug: clock
number: 13
status: draft
date: null
counted_on: 2026-11-06
title:
  ar: من غرينيتش إلى غرينيتش، 51 نصا حرّكت ساعة المغرب
  fr: De Greenwich à Greenwich, les 51 textes qui ont déplacé l’heure du Maroc
lead:
  ar: في 26 أكتوبر 1913 جعل ظهير شريف توقيت غرينيتش ساعة المغرب القانونية. وفي 20 شتنبر 2026، في الساعة الثانية صباحا، عادت إليه. وبين التاريخين حرّكت الجريدة الرسمية الساعة 75 مرة. قرأنا النصوص الواحد والخمسين كلها، ورسمنا كل يوم من أيامها.
  fr: Le 26 octobre 1913, un dahir fit de l’heure de Greenwich l’heure légale du Maroc. Le 20 septembre 2026, à deux heures du matin, le Royaume y est revenu. Entre les deux, le Bulletin officiel a déplacé l’horloge 75 fois. Nous avons lu les cinquante et un textes et dessiné chacun de leurs jours.

# Before the legal time: the French edition's chronicle of 10 October 1913 (BO 50, p. 417) and of 2 January 1914 (BO 62,
# pp. 9 and 10), quoted as printed.
before:
  rabat: {issue: 50, edition: translation_fr, page: 417, minutes: 27, seconds: 30, date: 1913-10-03,
          fr: "L’heure officielle de Rabat retardait, en effet de 27’ 30” sur celle de Casablanca."}
  safi: {issue: 62, edition: translation_fr, page: 10,
         fr: "La municipalité de Saffi a fait placer des horloges sur le fronton des portes de l’enceinte de Saffi. Ces horloges marquent l’heure officielle du Maroc qui est celle du Bureau horaire de Greenwich."}
  eiffel: {issue: 62, edition: translation_fr, page: 9,
           fr: "Un dispositif spécial a été établi à Casablanca (local du service topographique) pour la réception des signaux horaires de la Tour Eiffel (heure légale)."}

# The legal time begins with the dahir of 26 October 1913; before it the post draws no day.
legal_from: 1913-10-26

