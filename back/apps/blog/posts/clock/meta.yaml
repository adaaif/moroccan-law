  d212126:
    ar: "تضاف عند حلول الساعة الثانية صباحا من يوم الأحد الأخير من شهر أبريل من كل سنة، ستون (60) دقيقة … يمكن لرئيس الحكومة، ولفترة محددة، أن يقرر توقيف العمل بهذا التوقيت."
    fr: "soixante minutes sont ajoutées à deux heures du matin le dernier dimanche d’avril de chaque année … Le Chef du gouvernement peut, pour une période déterminée, décider de suspendre cet horaire."
  h34712:
