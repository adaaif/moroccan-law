  d218855:
    ar: "تضاف ستون (60) دقيقة إلى الساعة القانونية المحددة في تراب المملكة … يمكن لرئيس الحكومة، ولفترة محددة، توقيف العمل بالتوقيت المشار إليه في المادة الأولى أعلاه، عند الاقتضاء … ويعمل به ابتداء من 28 أكتوبر 2018."
    fr: "soixante minutes sont ajoutées à l’heure légale du Royaume ; le Chef du gouvernement peut, pour une période déterminée, suspendre cet horaire si besoin. Le décret s’applique à partir du 28 octobre 2018."
  c9019:
    ar: "التصريح بأن مقتضيات المرسوم الملكي رقم 67. 455 … بشأن الساعة القانونية، لا تكتسي طابعا تشريعيا بالرغم من ورودها في نص تشريعي بل يشملها اختصاص السلطة التنظيمية"
    fr: "déclarer que les dispositions du décret royal n° 455-67 relatif à l’heure légale n’ont pas un caractère législatif, bien qu’elles figurent dans un texte législatif, et relèvent du pouvoir réglementaire"
  h31919:
