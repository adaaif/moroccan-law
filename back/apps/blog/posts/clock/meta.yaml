# The words of each text that matter, as printed (Arabic), and in French: the French BO's own words for 1913 and 1918,
# ours after (the French edition of the later texts is not read).
words:
  d1913:
    ar: "التوقيت القانوني بتراب الحماية الفرنسية بالمغرب، هو توقيت الزمن المتوسط لخط غرينيتش."
    fr: "L’heure légale sur le territoire du Protectorat de la France au Maroc, est l’heure du temps moyen du méridien de Greenwich."
    translated: true
  d1918a:
    ar: "تقدم لستين دقيقة ابتداء من 16 مايو سنة 1918 … ويقع هذا التغير في منتصف الليل بين الخامس عشر والسادس عشر من مايو"
    fr: "L’heure légale … sera avancée de 60 minutes à partir du 16 mai 1918."
  d1918b:
    ar: "ويعمل بالساعة القانونية القديمة المشار اليها في منتصف الليل الرابع عشر والخامس عشر من يوليو"
    fr: "Le retour à l’heure légale ancienne sera effectué dans la nuit du 14 au 15 juillet, à minuit."
  d1939:
    ar: "تستقدم بستين دقيقة ابتداء من 27 رجب عام 1358 الموافق 12 شتنبر سنة 1939 وذلك الى ان يصدر امر يخالف ذلك"
    fr: "avancée de soixante minutes à partir du 12 septembre 1939, jusqu’à ce qu’un ordre contraire soit donné"
  d1940:
    ar: "تقدم بستين دقيقة (60) ابتداء من 25 يبراير 1940 … والى ان يصدر امر يخالف ذلك"
    fr: "avancée de soixante minutes à partir du 25 février 1940, jusqu’à ce qu’un ordre contraire soit donné"
  d1945a:
    ar: "سيعاد الى اجراء العمل بها في ليلة 18 نونبر سنة 1945 على الساعة الثالثة صباحا"
    fr: "l’heure légale sera rétablie dans la nuit du 18 novembre 1945, à trois heures du matin"
  d1945b:
    ar: "يأذن جنابنا الشريف بالغاء ظهيرنا الشريف المورخ في 15 شوال عام 1364 الموافق 22 شتنبر سنة 1945 الصادر في تعيين تاريخ اعادة اجراء العمل بالساعة القانونية"
    fr: "le dahir du 22 septembre 1945 fixant la date du rétablissement de l’heure légale est abrogé"
  d1946:
    ar: "باعادة اجراء العمل بالساعة القانونية … وذلك في ليلة 30 شتنبر 1946 على الساعة الاولى صباحا"
    fr: "l’heure légale est rétablie dans la nuit du 30 septembre 1946, à une heure du matin"
  d1950a:
    ar: "حيث أن كمية الامطار التي نزلت في فصل الربيع كانت جد ضئيلة وأدت الى حالة حرجة فيما يخص انتاج القوى الكهربائية المائية … وحيث أن تغيير الساعة القانونية بتقديمها على الساعة الشمسية بستين دقيقة سيؤدي الى الخفض من استهلاك كمية القوى الكهربائية"
    fr: "Considérant que les pluies du printemps ont été très faibles et ont créé une situation critique pour la production d’énergie hydroélectrique … et que l’avance de l’heure légale de soixante minutes sur l’heure solaire réduira la consommation d’électricité"
  d1950b:
    ar: "وسيقع هذا التغيير ليلة 29 اكتوبر على الساعة الواحدة صباحا"
    fr: "ce changement aura lieu dans la nuit du 29 octobre, à une heure du matin"
  r45567:
    ar: "الساعة القانونية في تراب المملكة هي التوقيت الزمني المتوسط لخط كرينويتش. غير أن هذه الساعة يمكن أن تضاف اليها كل سنة ستون دقيقة ابتداء من تاريخ يحدد بموجب مرسوم … تضاف الى التوقيت في هذه السنة ستون دقيقة ابتداء من 3 يونيه 1967 في الساعة الثانية عشرة زوالا."
    fr: "L’heure légale sur le territoire du Royaume est le temps moyen du méridien de Greenwich ; soixante minutes peuvent toutefois y être ajoutées chaque année à partir d’une date fixée par décret. Cette année, soixante minutes sont ajoutées à partir du 3 juin 1967, à midi."
  r72667:
    ar: "يتم في الليلة الفاصلة بين يوم 30 شتنبر ويوم فاتح أكتوبر 1967، وعليه ففي التاريخ المحدد المذكور عند منتصف الليل تؤخر الساعة بستين دقيقة."
    fr: "le retour à l’heure normale a lieu dans la nuit du 30 septembre au 1er octobre 1967 : à minuit, l’horloge est retardée de soixante minutes"
  d274459:
    ar: "تضاف اليها ستون دقيقة ابتداء من 3 جمادى الثانية 1394 (24 يونيه 1974)"
