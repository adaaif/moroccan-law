# «محمد المقري: 11.679 نصا بتوقيع واحد»: the blog's twenty-fifth post (S20 of the first-principles review, 6 Nov
# 2026: «Yes», C2 as recommended: officials named when their office ended before 1956; built 7 Nov 2026). Every text
# whose closing, as the Bulletin printed it, carries the Grand Vizier's name: the vizirial orders he signed and the
# dahirs registered at the Grand Vizierate under his name, counted by year (figures.json, manage.py blog_figures mokri),
# with the Residents General who authorised their publication. The story stops in 1956. A person checks every quote on
# its page before the post is published.
slug: mokri
number: 25
status: draft
date: null
counted_on: 2026-11-07
title:
  ar: "محمد المقري: 11.679 نصا بتوقيع واحد، من 1913 إلى 1955"
  fr: "Mohammed El Mokri : 11 679 textes sous une même signature, de 1913 à 1955"
lead:
  ar: "في الجريدة الرسمية للحماية، يُختم القرار الوزيري بتوقيع الصدر الأعظم، ويُسجَّل الظهير الشريف «في الوزارة الكبرى» تحت اسمه. وطوال 39 سنة، من 1917 إلى 1955، كان الاسم نفسه: محمد المقري. عددنا 11.679 نصا تحمله، أولها ظهير سنة 1913 وآخرها قرار وقّعه سنة 1955. وتعاقب في تلك السنين أحد عشر مقيما عاما أذنوا بنشرها."
  fr: "Au Bulletin officiel du Protectorat, l’arrêté viziriel se clôt sur la signature du Grand Vizir, et le dahir est « enregistré au Grand Vizirat » sous son nom. Pendant 39 ans, de 1917 à 1955, ce fut le même nom : Mohammed El Mokri. Nous avons compté 11 679 textes qui le portent, le premier un dahir de 1913, le dernier un arrêté signé en 1955. Onze résidents généraux qui en autorisaient la publication se sont succédé dans ces années."

