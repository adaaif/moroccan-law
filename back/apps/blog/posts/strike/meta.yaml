# The Court's conclusion, as printed.
ruling: "تصرح بأن القانون التنظيمي رقم 97.15 بتحديد شروط وكيفيات ممارسة حق الإضراب ليس فيه ما يخالف الدستور، مع مراعاة الملاحظات المتعلقة بالمواد 1 و5 و12"

