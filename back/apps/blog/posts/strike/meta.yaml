# The 2011 Constitution's own deadline for its organic laws: article 86, as printed (BO 5964 bis).
deadline:
  art: "86"
  issue: 5964
  bis: true
  page: 3616
  words: "تعرض مشاريع القوانين التنظيمية المنصوص عليها في هذا الدستور وجوبا قصد المصادقة عليها من قبل البرلمان، في أجل لا يتعدى مدة الولاية التشريعية الأولى التي تلي صدور الأمر بتنفيذ هذا الدستور."

