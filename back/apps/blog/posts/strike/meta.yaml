title:
  ar: "«حق الإضراب مضمون»: جملة في ستة دساتير، وقانون بعد 62 سنة"
  fr: "« Le droit de grève est garanti » : une phrase dans six constitutions, une loi 62 ans plus tard"
lead:
  ar: "كتب دستور 1962 «حق الإضراب مضمون»، ووعد بقانون تنظيمي يبين شروط ممارسته. وأعادت الدساتير الخمسة التي تلته الجملة الأولى حرفا بحرف. أودع مشروع القانون لدى مجلس النواب في 6 أكتوبر 2016، وصوّت عليه المجلس أول مرة في 24 دجنبر 2024، ونشرته الجريدة الرسمية في 24 مارس 2025: القانون التنظيمي 97.15، في 33 مادة."
  fr: "La Constitution de 1962 écrivait « le droit de grève est garanti » et promettait une loi organique pour en fixer les conditions. Les cinq constitutions suivantes ont repris la première phrase mot pour mot. Le projet de loi a été déposé à la Chambre des représentants le 6 octobre 2016, voté par elle une première fois le 24 décembre 2024, et publié au Bulletin officiel le 24 mars 2025 : la loi organique 97-15, en 33 articles."

