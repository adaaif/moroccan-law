# Who may not strike (art. 22) and when it may be stopped (art. 19), as printed.
nostrike: "موظفي إدارة الدفاع الوطني وموظفي وزارة الخارجية وموظفي وزارة الداخلية وأعوان السلطة والعسكريين وأفراد القوة العمومية وضباط الشرطة القضائية، وسائر الموظفين والأعوان المخول لهم حمل السلاح والموظفين الدبلوماسيين والقنصليين"
stop: "يمكن لرئيس الحكومة، في حالة حدوث آفات أو كوارث طبيعية أو أزمة وطنية حادة التي من شأنها المساس بالنظام العام وحقوق المواطنين، أن يأمر بصفة استثنائية، بمنع الإضراب أو وقفه لمدة محددة بموجب قرار معلل."
bulletin: "المرفق المكلف بنشر الجريدة الرسمية"

