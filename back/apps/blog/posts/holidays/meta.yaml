title:
  ar: أعيادنا بمرسوم، كيف كبرت لائحة العطل
  fr: Nos fêtes par décret, comment la liste des jours fériés s’est allongée
lead:
  ar: في 1977 كانت لائحة الأعياد المؤدى عنها الأجر في المقاولات ثمانية أيام. وهي اليوم أربعة عشر، آخرها عيد الوحدة، 31 أكتوبر، منذ 2026. قرأنا كل مرسوم غيّر اللائحة، يوما بيوم.
  fr: En 1977, la liste des fêtes chômées et payées dans les entreprises comptait huit jours. Elle en compte aujourd’hui quatorze, la dernière la fête de l’Unité, le 31 octobre, depuis 2026. Nous avons lu chaque décret qui a changé la liste, jour par jour.

