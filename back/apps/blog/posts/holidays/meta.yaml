# «أعيادنا بمرسوم: كيف كبرت لائحة العطل»: the blog's seventh post (B5 of the blog-first-post review, built 31 Oct 2026 in
# the order chosen). The lists were read in each text's first article as the corpus holds it (31 Oct 2026); the figures
# (manage.py blog_figures holidays) tie each text to its issue, page and address.
# Before 1957 (BH5 and BH15 of the posts-from-No.-1 review, 6 Nov 2026), to read when the post looks back: 16 Arabic titles of
# 1913–1955 name holidays or paid leave, among them «ظهير شريف يتعلق بايام الاعياد خلال مدة الحرب» (1939), «ظهير شريف في
# احداث عطلة سنوية يتمتع بها المستخدمون بالصناعة والتجارة والمهن الحرة مع قبض اجورهم فيها» (1937), «ظهير شريف يتعلق
# بالعطلات المدفوعة اجرتها في سنة 1941», a 1929 vizirial order on «ايام الاعياد» for port handling; whether the Arabic
# edition printed a whole list of holidays before 1957 is to be read on the pages.
