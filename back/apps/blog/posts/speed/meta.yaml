# «السرعة في الجريدة الرسمية»: the blog's twenty-second post (S22 of the first-principles review, 6 Nov 2026: «Yes»;
# built 7 Nov 2026). Every speed the Bulletin wrote for a road, from the cars its 1913 news pages timed to the 2010
# code, each read on its page; and the ministers' orders that set a limit section by section, counted (figures.json).
# Officials are named only before 1956 (C2 as recommended). A person checks every quote on its page before the post is
# published.
slug: speed
