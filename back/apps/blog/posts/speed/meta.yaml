title:
  ar: "السرعة في الجريدة الرسمية: من 12 كلم في الساعة فوق القناطر إلى 120 في الطريق السيار"
  fr: "La vitesse au Bulletin officiel : de 12 km/h sur les ponts à 120 sur l’autoroute"
lead:
  ar: "في 1913، نشرت الجريدة الرسمية أن سيارة قطعت الطريق من آسفي إلى مراكش في خمس ساعات، بـ35 كيلومترا في الساعة. وفي 1923 كتب قرار وزيري أول حدود للسرعة، حسب وزن العربة. وفي 1924 حدد قرار السرعة في 12 كيلومترا في الساعة فوق قناطر طريق فاس تازة. ثم كتب الوزراء حدا لكل مقطع من الطريق، حتى 120 كيلومترا في الساعة بين الدار البيضاء والرباط سنة 1983. ومنذ 2010، تحدد مدونة السير 60 في المدن و100 خارجها و120 في الطريق السيار."
  fr: "En 1913, le Bulletin officiel rapportait qu’une automobile avait relié Safi à Marrakech en cinq heures, à 35 kilomètres à l’heure. En 1923, un arrêté viziriel écrit les premières limites de vitesse, selon le poids du véhicule. En 1924, un arrêté limite la vitesse à 12 kilomètres à l’heure sur les ponts de la route de Fès à Taza. Puis les ministres ont fixé une limite par tronçon, jusqu’à 120 km/h entre Casablanca et Rabat en 1983. Depuis 2010, le code de la route fixe 60 en ville, 100 hors agglomération et 120 sur l’autoroute."

