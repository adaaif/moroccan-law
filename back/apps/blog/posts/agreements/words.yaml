# A law (or the dahir that promulgates it) that approves a treaty before its ratification.
approve_law: ["يوافق بموجبه", "بالموافقة من حيث المبدا", "القاضي بالموافقة", "يقضي بالموافقة", "الموافقة من حيث المبدا"]
# Where an agreement's title dates it; a protocol's or an amendment's title dates the instrument it changes, so those
# are not aged.
