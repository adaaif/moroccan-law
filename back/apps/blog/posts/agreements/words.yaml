# The words that sort the agreements of «المغرب والعالم في الجريدة الرسمية» (the blog's tenth post, B8), as the
# Bulletin's titles write them. Each word is matched whole, any letter case, after the title is folded (أ إ آ → ا,
# ى → ي, no tatweel), alone or after و ب ل, a word in «ال» also as «لل» («للبنك»). The partner is looked for after the
# title's «بين», Morocco's own names taken out: the lenders first, then the organisations, then the states, so
# «الصندوق الكويتي» is the Kuwait Fund and not Kuwait. A state's region: the Arab League's members as «arab», the rest
# of Africa as «africa». Read and written by a person; corrections go here.

# A text that is Morocco's contract with a company or a body at home, though its title says «اتفاق».
domestic: ["النفطي", "النفطية", "الهيدروكاربورات", "الهيدروكاربون", "الهيدروكاربونات", "الاحياء البحرية", "مزرعة", "الامتياز",
           "الاتفاقية الجماعية", "اتفاقية الشغل الجماعية", "اتفاقيات الشغل الجماعية", "التدبير المفوض", "صندوق الايداع والتدبير",
           "صندوق الايداع والتسيير", "الشركة المدعوة", "الشركة المسماة", "اتفاقية الاستثمار", "اتفاقية استثمار",
           "الشراكة بين القطاعين", "بين المهني", "بين المهنية", "المجلس الجماعي", "التطهير"]
# A title with no partner named that is still an international instrument.
