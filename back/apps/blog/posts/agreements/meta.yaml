title:
  ar: "المغرب والعالم في الجريدة الرسمية"
  fr: "Le Maroc et le monde au Bulletin officiel"
lead:
  ar: "منذ 1956 وافقت الدولة على 1.115 اتفاق قرض أو ضمان مع الخارج، بمرسوم في الغالب، أكثرها مع البنك الدولي. ونشرت الجريدة الرسمية 994 اتفاقية حتى 2018، كان عمر نصف ما نشرته منها بعد 2010 اثنتي عشرة سنة أو أكثر. ومنذ 2010 صارت الدول الإفريقية أول من يوافق البرلمان على اتفاقيات المغرب معها، قبل أوروبا والدول العربية."
  fr: "Depuis 1956, l’État a approuvé 1 115 accords de prêt ou de garantie avec l’étranger, presque toujours par décret, la Banque mondiale en tête. Le Bulletin a publié 994 accords jusqu’en 2018 ; la moitié de ceux publiés après 2010 avaient douze ans ou plus. Depuis 2010, les États africains sont les premiers partenaires des accords que le Parlement approuve, devant l’Europe et le monde arabe."
