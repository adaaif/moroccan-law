title:
  ar: من يكتب القواعد التي نعيش بها؟
  fr: Qui écrit les règles de notre vie ?
lead:
  ar: في سبعين سنة نشرت الجريدة الرسمية 160.525 نصا، أكثر من نصفها قرارات وزراء. ونصف هذه القرارات معادلة شهادة أو تفويض توقيع. أما القوانين التي يصوّت عليها البرلمان فأقل من نص في كل خمسين.
  fr: En soixante-dix ans, le Bulletin officiel a publié 160 525 textes, dont plus de la moitié sont des arrêtés de ministres. La moitié de ces arrêtés fixent l’équivalence d’un diplôme ou délèguent une signature. Les lois votées par le Parlement font moins d’un texte sur cinquante.

