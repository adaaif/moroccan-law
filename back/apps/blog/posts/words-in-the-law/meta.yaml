# «كلمات دخلت القانون»: the blog's third post (B6 of the blog-first-post review, built 31 Oct 2026 in the order chosen).
# The counts are in figures.json (manage.py blog_figures words-in-the-law): the texts whose articles, as first
# published, carry a word, year by year; counted on the search copy since the scan reads every article.
slug: words-in-the-law
number: 3
status: draft
date: null
counted_on: 2026-11-01
span: [1956, 2025]
title:
  ar: كلمات دخلت القانون، وكلمات خرجت منه
  fr: Les mots qui sont entrés dans la loi, et ceux qui en sont sortis
lead:
  ar: "«الأمازيغية» أول مرة في 1983، في إجازة الآداب، وأول نص خاص بها في 2001. و«الأنترنت» في 1998، و«كوفيد» في 2020. و«فرنك» كان في قرابة ثلث النصوص سنة الاستقلال، ثم غاب. عددنا 24 كلمة في 158.320 نصا من الجريدة الرسمية منذ 1956، وتتبعنا محطات كل واحدة منها."
  fr: "« Amazighe » paraît en 1983, dans la licence ès lettres, et son premier texte propre date de 2001. « Internet » en 1998, « Covid » en 2020. « Franc » figurait dans près d’un texte sur trois l’année de l’indépendance, puis a disparu. Nous avons compté 24 mots dans 158 320 textes du Bulletin officiel depuis 1956, et suivi les étapes de chacun."

# The words, in the forms counted (a form found anywhere in an article: «الإرهاب» also finds «الإرهابية»), folded on
# both sides (services/words.py: the hamza on an alef, the madda, a final yā and the elongations), so «الامازيغية» as
# printed in 1983 is found. A group is a part of the post; the order inside a group is the order of the picture. Left out
# for their second meanings: «المناصفة» (also «half and half» in agreements since 2001), «الرقمي» (also «numeric»),
# «كوفيد» alone (a 1958 list of medicines).
#
# `since`: counted from that day only. `misread`: an article whose reading carries the word where its page does not,
# left out of the count with what the page says (the reading itself waits for /corrections).
#
# `stops` (each read on its printed page on 31 Oct 2026, to give each word its context: the first time the state takes
# up its cause, as the 2001 BO does for one): `first` the first mention, `subject` the first text whose subject the
# word is, `step` a later text that changed its story. `text` and `art` (or `eid`) name
# the article; a text the site holds only in Adala's or the SGG's copy names its `issue` and `page`; a text not cut yet names
# its `issue`, `page` and `title` as printed and opens its issue. `open`: what the stops do not reach yet.
