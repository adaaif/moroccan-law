# «ماركيز، قرارا بعد قرار»: the blog's fourteenth post (S1 of the first-principles review, 6 Nov 2026: «Yes», C1 as
# recommended, the clock then Marquise). Each price is the row of the soft pack of twenty as each order prints it, read
# in the corpus's text and, where the text was unsure (1992, 1996, 2024), on the printed page's image (6 Nov 2026). The
# pack kept one line through its names: «مركيز ف.س» (1956), «ماركيز (K.S.F.)» (1961), «ماركيز» (1976–2003), «ماركيز
# سويل» (2004), «ماركيز سوبل فول فلافور» (2008), renamed «ماركيز كلاسيك» by the order of BO 6364 bis (2015); the box,
# light, menthol, 100 mm, ten-cigarette and «MQS» packs are other rows, left out. A person checks every price on its
# page before the post is published. The figures (manage.py blog_figures marquise) tie each order to its page and
# address, and take the minimum wage from the sixth post's checked steps.
slug: marquise
number: 14
status: draft
date: null
counted_on: 2026-11-06
title:
  ar: ماركيز، قرارا بعد قرار، من 140 فرنكا إلى 31 درهما، وساعة و44 دقيقة من العمل
  fr: Marquise, arrêté après arrêté, de 140 francs à 31 dirhams, et toujours 1 h 44 de travail
lead:
  ar: في 1960 حدد قرار لوزير الاقتصاد الوطني والمالية ثمن علبة ماركيز في 140 فرنكا. وفي 2026 صادق قرار لوزيرة الاقتصاد والمالية على 31 درهما، فتضاعف الثمن 22 مرة. لكن بالحد الأدنى للأجر، كانت العلبة تكلف ساعة و44 دقيقة من العمل في 1960، وما زالت تكلفها في 2026. قرأنا سطر ماركيز في 36 قرارا.
  fr: En 1960, un arrêté du ministre de l’Économie nationale et des Finances fixait le paquet de Marquise à 140 francs. En 2026, un arrêté de la ministre de l’Économie et des Finances homologue 31 dirhams, soit 22 fois plus. Mais au salaire minimum, le paquet coûtait 1 h 44 de travail en 1960, et il les coûte toujours en 2026. Nous avons lu la ligne Marquise dans 36 arrêtés.

