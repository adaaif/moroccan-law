title:
  ar: "15 يوما: الأجل المفضل في القانون المغربي"
  fr: "Quinze jours : le délai préféré de la loi marocaine"
lead:
  ar: "عددنا كل أجل في نصوص القانون القائمة: «داخل أجل خمسة عشر يوما»، «خلال ستة أشهر»، «في أجل لا يتعدى ثلاثين يوما». أكثرها 15 يوما، ثم 30 يوما، ثم ستة أشهر، ثم ثلاثة أشهر. ويعدّ القانون بالساعات أيضا: 24 ساعة لأداء أجر العامل باليوم بعد فصله."
  fr: "Nous avons compté chaque délai des textes de loi en vigueur : « dans un délai de quinze jours », « dans les six mois », « dans un délai n’excédant pas trente jours ». Le plus fréquent : 15 jours, puis trente jours, six mois, trois mois. La loi compte aussi en heures : 24 heures pour payer le salaire d’un ouvrier à la journée après son licenciement."

# The texts of law read, and the words that make a number a limit (within three words before it: «في أجل لا يتجاوز ستة
# أشهر»). «لا يتجاوز» alone is left out: it is mostly an age («لا يتجاوز سنه 45 سنة»).
rules: [law, organic_law, dahir, decree, decree_law, order]
limit_words: "أجل|اجل|آجال|خلال|داخل|ظرف|مهلة"

