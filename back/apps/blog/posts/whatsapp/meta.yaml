# «القانون يعرف البرقية، ولا يعرف واتساب»: the blog's nineteenth post (S16 of the first-principles review, 6 Nov
# 2026: «Yes»; built 7 Nov 2026). The counts are in figures.json (manage.py blog_figures whatsapp): the texts of law
# whose Arabic carries each word, and the Bulletin's pages that print each network's name, counted on the search copy
# since the scan reads every article and every page. Every quote below was read on its printed page; a person checks
# each against the page's image before the post is published.
slug: whatsapp
number: 19
status: draft
date: null
counted_on: 2026-11-07
title:
  ar: "القانون يعرف البرقية، ولا يعرف واتساب"
  fr: "La loi connaît le télégramme, pas WhatsApp"
lead:
  ar: "ما زالت نصوص القانون تكتب «البرقية» و«الفاكس» و«التلكس» و«الآلة الكاتبة». وفي 2023 طلب مرسوم الصفقات العمومية من كل متنافس رقم فاكسه. أما «واتساب» و«تيك توك» و«فيسبوك»، فلم يكتبها قط ظهير ولا قانون ولا مرسوم ولا قرار وزير: دخلت الجريدة الرسمية في آراء المجالس وتقاريرها، وفي كلام قيل على الهواء نقلته الهيأة العليا للاتصال السمعي البصري."
  fr: "Les textes de loi écrivent encore « télégramme », « télécopie », « télex » et « machine à écrire ». En 2023, le décret sur les marchés publics demandait encore à chaque concurrent son numéro de fax. « WhatsApp », « TikTok » et « Facebook », eux, n’ont jamais été écrits par un dahir, une loi, un décret ou un arrêté : ils sont entrés au Bulletin officiel par les avis et les rapports des conseils, et par des paroles dites à l’antenne que la HACA a citées."

# The texts of law: dahirs, laws, organic laws, decree-laws, decrees and orders (not the decisions of a council or a
# regulator, the reports, the opinions). A text counts when any of its Arabic versions (as printed, or as amended) carries
# the word; the Arabic a model translated from the official French (BO 7410 and the Protectorate's French-only texts) does
# not count. «Standing»: not marked repealed in what the site has read.
rules: [dahir, law, organic_law, decree_law, decree, order]

# The machines the law still writes, each as Postgres reads a regular expression. «برقية» alone is also a family name
# («الخليل برقية» delegates a minister's signature in 2025), so only its forms with an article or a preposition count, and
# «برقيات»; «البرق» (also lightning) does not.
machines:
  - key: telegram
    ar: "البرقية"
    fr: "le télégramme"
    re: "(^|[^ء-ي])(ال|وال|بال|لل)(برقية|برقيات)|(^|[^ء-ي])(ب|و|ل)?برقيات|(^|[^ء-ي])ببرقية|(^|[^ء-ي])(ال|وال|بال|لل|و|ب|ل)?(تلغراف|تلغرافية|تلغرافي|تلغرافيا)"
    # The 1980s' peak: each new post office opened by an order that lists «العمليات البريدية والتلغرافية والتليفونية».
    example: {akn: /akn/ma/act/loi/3-23, art: "2", issue: 7437, page: 6973, date: "2025-09-08", number: "03.23",
              words: "كما له أن يأمر بنشر برقيات البحث على الصعيد الوطني في حق الأشخاص المشتبه في ارتكابهم جنح معاقب عليها بعقوبات حبسية"}
  - key: typewriter
    ar: "الآلة الكاتبة"
    fr: "la machine à écrire"
    re: "الآلة الكاتبة|الالة الكاتبة|الآلات الكاتبة|الالات الكاتبة|آلة كاتبة|الة كاتبة|آلات كاتبة|الات كاتبة"
    example: {akn: /akn/ma/act/dahir/1-06-64, issue: 5732, page: 2395, date: "2009-05-07", number: "1.06.64",
              words: "يعد المصدر بيان الفاتورة الأورومتوسطية منسوخا على الآلة الكاتبة، أو بالكتابة بحروف طباعة"}
  - key: fax
    ar: "الفاكس"
    fr: "le fax"
    re: "(^|[^ء-ي])(ال|وال|بال|لل|و|ب|ل)?(فاكس|ناسوخ)([^ء-ي]|$)"
    example: {akn: /akn/ma/act/decret/2-22-431, art: "29", issue: 7176, page: 2885, date: "2023-03-09", number: "2.22.431",
              words: "الاسم العائلي والشخصي للمتنافس ومحل سكناه وكذا أرقام الهاتف والفاكس والعنوان الإلكتروني للمتنافس"}
  - key: telex
    ar: "التلكس"
    fr: "le télex"
    re: "(^|[^ء-ي])(ال|وال|بال|لل|و|ب|ل)?تلكس([^ء-ي]|$)"
    example: {akn: /akn/ma/act/dahir/1-10-62, issue: 6410, bis: true, page: 9160, date: "2015-11-05", number: "1.10.62",
              words: "يتيح استبدال أوامر الدفع البريدية المرسلة على ركيزة ورقية أو بالبرق أو بالتلكس بأوامر بريدية تنقلها الشبكة الإلكترونية"}

# The words the law has for the new means, counted the same way.
generics:
  - {key: internet, re: "(^|[^ء-ي])(ال|وال|بال|لل|و|ب|ل)?(أنترنيت|انترنيت|إنترنت|انترنت|أنترنت|إنترنيت)([^ء-ي]|$)"}
  - {key: email, re: "البريد الإلكتروني|البريد الالكتروني|بريد إلكتروني|بريد الكتروني"}
  - {key: social, re: "(شبكات|شبكة|مواقع|موقع|وسائل|وسيلة|منصات|منصة|وسائط|تطبيقات|حسابات|صفحات) التواصل الاجتماعي"}

