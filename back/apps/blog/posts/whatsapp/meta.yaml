# How the law says it without naming it, as printed.
naming:
  formula:
    akn: /akn/ma/act/loi-organique/53-25
    art: "1"
    issue: 7478
    page: 789
    date: "2026-01-29"
    number: "53.25"
    phrase: "شبكات البث المفتوح"
    words: "كل شخص أقدم، بأي وسيلة بما في ذلك شبكات التواصل الاجتماعي أو شبكات البث المفتوح أو أدوات الذكاء الاصطناعي أو أي منصة إلكترونية أو تطبيق يعتمد على الأنترنيت أو الأنظمة المعلوماتية، بنشر أو إذاعة أو نقل أو بث أو توزيع أخبار زائفة أو إشاعات"
    parts:
      - "شبكات التواصل الاجتماعي"
      - "شبكات البث المفتوح"
      - "أدوات الذكاء الاصطناعي"
      - "أي منصة إلكترونية"
      - "تطبيق يعتمد على الأنترنيت"
      - "الأنظمة المعلوماتية"
  group: {akn: /akn/ma/act/arrete/2026/47-26, art: "9", issue: 7524, page: 4245, date: "2026-07-09", number: "47.26",
          words: "شريطة أن يتم ذلك بين المترشح وأي زميل له على حدة، وليس في إطار مجموعة محدثة في تطبيقات التواصل الاجتماعي"}
  doctor: {akn: /akn/ma/act/decret/2-21-225, art: "26", issue: 7002, page: 5171, date: "2021-07-08", number: "2.21.225",
           words: "عندما يحدث الطبيب موقعا إلكترونيا أو أي فضاء رقمي آخر، على شبكات التواصل الاجتماعي لأغراض مهنية، يخبر بذلك المجلس الجهوي المعني"}
  council: {issue: 7354, page: 8034, date: "2024-11-21",
            words: "ملاءمة الإطار القانوني الوطني مع المعايير الدولية المتعلقة بحقوق الطفل، لا سيما بما يواكب الديناميات المطردة للبيئة الرقمية"}
