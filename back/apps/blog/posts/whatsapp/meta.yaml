# What our copy shows that the Bulletin does not: left out of the counts, each read on its page. `swallowed`: report
# pages the cutter filed under the order printed before them (the order's own pages do not carry the word); `misread`: a
# word the reading put where the page prints a name; `name`: a person called Messenger; `telegraph`: the 1957 post office
# below, the telegraph's «التيليغرام». Any other text of law or page
# that carries a network's name is listed in figures.json's `checks` for a person to read.
not_law:
  - {akn: /akn/ma/act/arrete/394-19, words: [facebook, twitter, youtube], why: swallowed, issue: 6778}
  - {akn: /akn/ma/act/arrete/3266-21, words: [facebook], why: swallowed, issue: 7070}
  - {akn: /akn/ma/act/arrete/463-24, words: [facebook], why: swallowed, issue: 7281}
  - {akn: /akn/ma/act/arrete/1681-24, words: [facebook, instagram], why: swallowed, issue: 7322}
  - {akn: /akn/ma/act/dahir/1-69-349, words: [twitter], why: misread, issue: 3026, page: 2659}
not_pages:
