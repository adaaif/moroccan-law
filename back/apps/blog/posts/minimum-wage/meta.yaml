  ar: الحد الأدنى للأجر، مرسوما بعد مرسوم
  fr: Le salaire minimum, décret après décret
lead:
  ar: من 80 فرنكا و80 سنتيما للساعة في 1960 إلى 17,92 درهما في 2026. قرأنا كل نص رفع الحد الأدنى للأجر منذ الاستقلال، مبلغا بمبلغ، في الصناعة والتجارة وفي الفلاحة.
  fr: De 80 francs 80 de l’heure en 1960 à 17,92 dirhams en 2026. Nous avons lu chaque texte qui a relevé le salaire minimum depuis l’indépendance, montant par montant, dans l’industrie et le commerce, et dans l’agriculture.

# Every raise, as its articles print it: «hourly» outside agriculture (industry, commerce, liberal professions), in
