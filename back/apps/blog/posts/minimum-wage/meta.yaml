# «الحد الأدنى للأجر، مرسوما بعد مرسوم»: the blog's sixth post (B10 of the blog-first-post review, built 31 Oct 2026 in
# the order chosen). The amounts were read in each decree's articles as the corpus holds them (31 Oct 2026); the figures
# (manage.py blog_figures minimum-wage) tie each decree to its issue, page and article.
# Before 1960 (BH5 and BH14 of the posts-from-No.-1 review, 6 Nov 2026), to read when the post goes back to 1936: the old
# Bulletin says «أقل الأجرة», never «الحد الأدنى للأجر». The dahir of 18 June 1936 «يتعلق باقل الاجرة التي تدفع للعملة
# والمستخدمين» is printed in BO 1238 (17 July 1936, the file's eighth page, under the Resident General's visa) and was
# never cut as a text of its own; dahirs amending it: three in 1937, one in 1938, one in 1952 (their titles name it).
