title:
  ar: دجنبر، شهر الأعداد المكررة، ومارس، شهر القوانين
  fr: Décembre, le mois des numéros bis ; mars, celui des lois
lead:
  ar: بين 1996 و2025 نشرت الجريدة الرسمية في دجنبر 21.643 صفحة، أكثر من أي شهر، و26 عددا مكررا. أما القوانين فتُنشر أكثر في مارس، وأقل في أكتوبر، الشهر الذي تُفتتح فيه دورة البرلمان. ورمضان لا يغيّر شيئا يُذكر.
  fr: De 1996 à 2025, le Bulletin officiel a publié en décembre 21 643 pages, plus que tout autre mois, et 26 numéros bis. Les lois, elles, paraissent surtout en mars, et le moins en octobre, le mois où s’ouvre la session du Parlement. Le ramadan ne change presque rien.
