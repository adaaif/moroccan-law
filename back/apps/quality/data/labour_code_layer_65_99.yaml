# The Labour Code (law 65.99) read against the pages of the file it came from, the Ministry of Justice's PDF (Adala,
# sources/adala/labour_65_99.pdf), on 10 Nov 2026. Its text was set word by word against the Bulletin's own pages
# (BO 5167 of 8 December 2003, from p. 3969: `witness_pages`), which found 153 small differences in 585 witnessed
# articles; each was then read on the printed page of the Ministry's file by two reading helpers (crops at 300 to 660
# dpi, one-dot differences read twice). 91 are the text layer's slips, put right below, nearly all «لا» turned into
# «ال»: «ثالثة أشهر» for «ثلاثة أشهر» (15 times), «على خالف ذلك» for «خلاف», «شغال» for «شغلا», «مشغال» for «مشغلا»,
# «عمال بالمادة» for «عملا». Article 477 ran the other way: the site said «شخص ثلاث» where the page prints «ثالث», a
# third person. One more, article 354's «العالوة», was seen on the same page line.
# 48 were the Bulletin reading's own slips, spacing or a hamza's seat, and 14 are places where the file prints the
# site's words and the Bulletin's reading is another real word (or the Ministry's own edition misprints: «تشغليهم» in
# arts 24, 379, 509 and 527, «لأجراء» in art. 126): left as the file prints them, listed in the review's notes (kept
# outside the repository).
# Applied by `manage.py apply_page_reading <this file>`; a reload of the text applies them again.
