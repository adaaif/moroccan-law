- arts:
  - 73
  wrong: إذا تعلق الأمر بالتلبس بجناية طبقا لمقتضيات المادة 56 من هذا القانون، ولم تكن لمقتضيات المادة الجريمة من الجرائم
    التي يكون التحقيق فيها إلزاميا 83 بعده، استفسر ً طبقاً الوكيل العام للملك أو أحد نوابه المعين من قبله المشتبه فيه عن هويته
    وأجرى استنطاقه بعد إشعاره أن من حقه تنصيب محام عنه حالاً وإلا عي من طرف رئيس غرفة الجنايات ن له تلقائياً أثناء المحاكمة
    في إطار المساعدة القضائية.
  right: إذا تعلق الأمر بالتلبس بجناية طبقا لمقتضيات المادة 56 من هذا القانون، ولم تكن الجريمة من الجرائم التي يكون التحقيق
    فيها إلزامياً طبقاً لمقتضيات المادة 83 بعده، استفسر الوكيل العام للملك أو أحد نوابه المعين من قبله المشتبه فيه عن هويته
    وأجرى استنطاقه بعد إشعاره أن من حقه تنصيب محام عنه حالاً وإلا عين له تلقائياً من طرف رئيس غرفة الجنايات أثناء المحاكمة
    في إطار المساعدة القضائية.
- arts:
  - 73
  wrong: يحق للمحامي أن يحضر هذا الاستنطاق كما يحق له، بعد الانتهاء منه، أن يلتمس إجراء فحص طبي على موكله، وأن يدلي نيابة
    عنه بوثائق أو إثباتات كتابية وله حق طرح الأسئلة أن يعرض تقديم كفالة مالية أو شخصية مقابل وإبداء الملاحظات وتقديم الطلبات.
    ويمكنه أيضاً إطلاق سراحه، وتطبق عندئذ المقتضيات المتعلقة بالكفالة المشار إليها في المادة 74-1 أدناه.
  right: يحق للمحامي أن يحضر هذا الاستنطاق كما يحق له، بعد الانتهاء منه، أن يلتمس إجراء فحص طبي على موكله، وأن يدلي نيابة
    عنه بوثائق أو إثباتات كتابية وله حق طرح الأسئلة وإبداء الملاحظات وتقديم الطلبات. ويمكنه أيضاً أن يعرض تقديم كفالة مالية
    أو شخصية مقابل إطلاق سراحه، وتطبق عندئذ المقتضيات المتعلقة بالكفالة المشار إليها في المادة 74-1 أدناه.
