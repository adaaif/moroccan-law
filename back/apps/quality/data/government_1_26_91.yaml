  wrong: "وبر 2026) :\nوزيرا للداخلية ؛\nوزيرا للشؤون الخارجية والتعاون الإفريقي والمغاربة المقيمين بالخارج ؛\nوزيرا للعدل ؛\nوزيرا للأوقاف والشؤون الإسلامية ؛\nأمينا عاما للحكومة ؛\nوزيرا للاقتصاد والمالية والنجاعة العمومية ؛\nوزيرا للتجهيز والماء والغابات ؛\nوزيرا للتربية الوطنية والتعليم الأولي والتكوين المهني والتأهيل ؛\nوزيرا للصحة والحماية الاجتماعية ؛\nوزيرا للفلاحة والصيد البحري والسيادة الغذائية ؛\nوزيرا للصناعة والتجارة والاستثمار والإدماج الاقتصادي ؛\nوزيرا للشباب والثقافة والرياضة ؛\nوزيرا للتعليم العالي والبحث العلمي والابتكار ؛\nوزيرا للنقل واللوجيستيك ؛\nوزيرة للطاقة والمعادن والتنمية المستدامة ؛\nوزيرا للتشغيل والحوار الاجتماعي ؛\nالسيد سمير بلفقيه ........................................\nالسيد أحمد رحو ........................................\nالسيد جلال شرف ........................................\nالسيدة نجوى ككوس ........................................\nالسيد عبد اللطيف لوديي ........................................\nالسيدة قلوب فيطح ........................................\nالسيد عمر حجيرة ........................................\nالسيد أحمد المهدي مزواري ........................................\nالسيد كمال الهشومي ........................................\nالسيدة ماديحة خير ........................................\nالسيدة فاطمة سعدي ........................................\nالسيد صلاح الدين عبقري ........................................\nالسيد رشيد حموني ........................................\nالسيدة عائشة كلاع ........................................\nالسيد عبد الجبار الرشيدي ........................................"
  right: "يعين ابتداء من 4 جمادى الأولى 1448 (16 أكتوبر 2026) :\n| السيد عبد الوافي لفتيت | وزيرا للداخلية ؛ |\n| السيد ناصر بوريطة | وزيرا للشؤون الخارجية والتعاون الإفريقي والمغاربة المقيمين بالخارج ؛ |\n| السيد عبد اللطيف وهبي | وزيرا للعدل ؛ |\n| السيد أحمد التوفيق | وزيرا للأوقاف والشؤون الإسلامية ؛ |\n| السيد حسن طارق | أمينا عاما للحكومة ؛ |\n| السيد فوزي لقجع | وزيرا للاقتصاد والمالية والنجاعة العمومية ؛ |\n| السيد نزار بركة | وزيرا للتجهيز والماء والغابات ؛ |\n| السيد محمد نبيل بنعبد الله | وزيرا للتربية الوطنية والتعليم الأولي والتكوين المهني والتأهيل ؛ |\n| السيد يونس بجيجو | وزيرا للصحة والحماية الاجتماعية ؛ |\n| السيد خليد حاتمي | وزيرا للفلاحة والصيد البحري والسيادة الغذائية ؛ |\n| السيد رياض مزور | وزيرا للصناعة والتجارة والاستثمار والإدماج الاقتصادي ؛ |\n| السيد محمد المهدي بنسعيد | وزيرا للشباب والثقافة والرياضة ؛ |\n| السيد عز الدين المداوي | وزيرا للتعليم العالي والبحث العلمي والابتكار ؛ |\n| السيد عبد الصمد قيوح | وزيرا للنقل واللوجيستيك ؛ |\n| السيدة شرفات اليدري أفيلال | وزيرة للطاقة والمعادن والتنمية المستدامة ؛ |\n| السيد عبد الرحيم شهيد | وزيرا للتشغيل والحوار الاجتماعي ؛ |\n| السيد سمير بلفقيه | وزيرا لإعداد التراب الوطني والتعمير والإسكان وسياسة المدينة، ناطقا رسميا باسم الحكومة ؛ |\n| السيد أحمد رحو | وزيرا للذكاء الاصطناعي والتحول الرقمي وإصلاح الإدارة ؛ |\n| السيد جلال شرف | وزيرا للسياحة والصناعة التقليدية والاقتصاد التضامني ؛ |\n| السيدة نجوى ككوس | وزيرة للأسرة والتنمية الاجتماعية والمساواة ؛ |\n| السيد عبد اللطيف لوديي | وزيرا منتدبا لدى رئيسة الحكومة مكلفا بإدارة الدفاع الوطني ؛ |\n| السيدة قلوب فيطح | وزيرة منتدبة لدى رئيسة الحكومة مكلفة بالعلاقات مع البرلمان والمجتمع المدني ؛ |\n| السيد عمر حجيرة | وزيرا منتدبا لدى وزير الصناعة والتجارة والاستثمار والإدماج الاقتصادي مكلفا بالتجارة الخارجية ؛ |\n| السيد أحمد المهدي مزواري | وزيرا منتدبا لدى وزير الفلاحة والصيد البحري والسيادة الغذائية مكلفا بالصيد البحري ؛ |\n| السيد كمال الهشومي | وزيرا منتدبا لدى وزير التربية الوطنية والتعليم الأولي والتكوين المهني والتأهيل مكلفا بالتعليم الأولي ومحاربة الهدر المدرسي ؛ |\n| السيدة ماديحة خيير | وزيرة منتدبة لدى وزير التربية الوطنية والتعليم الأولي والتكوين المهني والتأهيل مكلفة بالتكوين المهني والتأهيل ؛ |\n| السيدة فاطمة سعدي | وزيرة منتدبة لدى وزير إعداد التراب الوطني والتعمير والإسكان وسياسة المدينة مكلفة بالإسكان وسياسة المدينة ؛ |\n| السيد صلاح الدين عبقري | وزيرا منتدبا لدى وزير الشباب والثقافة والرياضة مكلفا بالشباب ؛ |\n| السيد رشيد حموني | وزيرا منتدبا لدى وزيرة الأسرة والتنمية الاجتماعية والمساواة مكلفا بالإدماج الاجتماعي ؛ |\n| السيدة عائشة كلاع | وزيرة منتدبة لدى وزير الذكاء الاصطناعي والتحول الرقمي وإصلاح الإدارة مكلفة بإصلاح الإدارة ؛ |\n| السيد عبد الجبار الرشيدي | وزيرا منتدبا لدى وزير السياحة والصناعة التقليدية والاقتصاد التضامني مكلفا بالصناعة التقليدية والاقتصاد التضامني. |"
- arts:
