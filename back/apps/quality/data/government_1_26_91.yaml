  wrong: "ينشر ظهيرنا الشريف هذا\nوقعته بالعطف :\nرئيسة الحكومة،\nالإمضاء : فاطمة الزهراء المنصوري.\nوزيرا لإعداد التراب الوطني والتعمير والإسكان وسياسة المدينة، ناطقا رسميا باسم الحكومة ؛\nوزيرا للذكاء الاصطناعي والتحول الرقمي وإصلاح الإدارة ؛\nوزيرا للسياحة والصناعة التقليدية والاقتصاد التضامني ؛\nوزيرة للأسرة والتنمية الاجتماعية والمساواة ؛\nوزيرا منتدبا لدى رئيسة الحكومة مكلفا بإدارة الدفاع الوطني ؛\nوزيرة منتدبة لدى رئيسة الحكومة مكلفة بالعلاقات مع البرلمان والمجتمع المدني ؛\nوزيرا منتدبا لدى وزير الصناعة والتجارة والاستثمار والإدماج الاقتصادي مكلفا بالتجارة الخارجية ؛\nوزيرا منتدبا لدى وزير الفلاحة والصيد البحري والسيادة الغذائية مكلفا بالصيد البحري ؛\nوزيرا منتدبا لدى وزير التربية الوطنية والتعليم الأولي والتكوين المهني والتأهيل مكلفا بالتعليم الأولي ومحاربة الهدر المدرسي ؛\nوزيرة منتدبة لدى وزير التربية الوطنية والتعليم الأولي والتكوين المهني والتأهيل مكلفة بالتكوين المهني والتأهيل ؛\nوزيرة منتدبة لدى وزير إعداد التراب الوطني والتعمير والإسكان وسياسة المدينة مكلفة بالإسكان وسياسة المدينة ؛\nوزيرا منتدبا لدى وزير الشباب والثقافة والرياضة مكلفا بالشباب ؛\nوزيرا منتدبا لدى وزيرة الأسرة والتنمية الاجتماعية والمساواة مكلفا بالإدماج الاجتماعي ؛\nوزيرة منتدبة لدى وزير الذكاء الاصطناعي والتحول الرقمي وإصلاح الإدارة مكلفة بإصلاح الإدارة ؛\nوزيرا منتدبا لدى وزير السياحة والصناعة التقليدية والاقتصاد التضامني مكلفا بالصناعة التقليدية والاقتصاد التضامني.\nفي الجريدة الرسمية."
  right: ينشر ظهيرنا الشريف هذا في الجريدة الرسمية.
