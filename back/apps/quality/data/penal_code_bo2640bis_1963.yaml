    آخر مسكون أو معد للسكنى ، سواء كان مملوكا له أو لغيره ، يعاقب بالاعدام .
    ويعاقب بنفس العقوبة من أوقد النار عمدا في ناقلات أو طائرات أو عربات بها أشخاص أو في عربات ليس بها أحد ولكنها تكون جزءا من قافلة بها أشخاص .

    الفصل 581
    يعاقب بالسجن من عشر الى عشرين سنة من أوقد النار عمدا في شيء غير مملوك له من الاشياء الآتية :
    ـ مبنى أو بيت أو مسكن أو خيمة أو مأوى ، ثابت أو متنقل ، أو باخرة أو سفينة أو ورش أو متجر ، اذا كان غير مسكون ولا معد للسكنى .
    ـ ناقلة أو طائرة ليس بها أشخاص .
    ـ غابات أو أخشاب مقطوعة أو أخشاب موضوعة في حزم أو أكوام .
    ـ مزروعات قائمة أو تبن أو قش أو محصولات موضوعة في حزم أو أكوام .
    ـ عربات خاوية أو عامرة ببضائع أو منقولات أخرى ، اذا لم تكن جزءا من قافلة .

    الفصل 582
    من أوقد النار عمدا أو أمر بذلك في شيء مملوك له من الاشياء المعدودة في الفصل السابق ، وسبب بذلك لغيره ضررا أيا كان عن عمد ، يعاقب بالسجن من خمس سنوات الى عشر .
    وتطبق نفس العقوبة على من أوقد النار ، بناء على أمر المالك ، في هذه الحالة .

    الفصل 583
    من أوقد النار عمدا في شيء ، أيا كان مملوكا له أو لا ، موضوع بشكل يسمح بانتقال الحريق ، فحرق بسبب هذا الاتصال مالا مملوكا للغير من الاموال المعدودة في الفصل 581 ، يعاقب بالسجن من خمس الى عشر سنوات .

    الفصل 584
