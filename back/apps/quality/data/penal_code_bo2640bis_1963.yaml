    يعد مرتكبا لجريمة التفالس ويعاقب بالعقوبات المقررة فی هذا الفرع للتفالس البسيط أو للتفالس بالتدليس ، علی حسب الاحوال ، التاجر المتوقف عن الدفع الذی يرتكب ، اهمالا أو عمدا ، أحد الاعمال المعاقب عليها والتی من شأنها الاضراز بحقوق دائنيه.

    الفصل 557
    يعد مرتكبا للتفالس البسيط ، ويعاقب بالحبس من ثلاثة أشهر الى ثلاث سنوات ، التاجر المتوقف عن الدفع فی الحالات الآتية :
    1) اذا أنفق نفقات باهظة فی معيشته أو فی القمار أو المراهنات.
