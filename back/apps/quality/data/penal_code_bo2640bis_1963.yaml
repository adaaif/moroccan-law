    الفصل 550
    اذا ارتكب خيانة الامانة أحد الاشخاص الذين يحصلون من الجمهور على مبالغ أو قيم على سبيل الوديعة أو الوكالة أو الرهن ، سواء بصفتهم الشخصية أو بصفتهم مديرين أو مسيرين أو عملاء لشركات أو مؤسسات تجارية أو صناعية ، فان عقوبة الحبس المقررة في الفصل 547 ترفع الى الضعف ، كما يرفع الحد الاقصى للغرامة الى مائة ألف درهم .

