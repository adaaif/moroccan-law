    الا أن الايداع القضائى فى مؤسسة لمعالجة الامراض العقلية ، أو الوضع القضائى فى مؤسسة للعلاج ، ينفذان حتما قبل غيرهما .

    الفصل 92

    اذا صدر على شخص ، خلال تنفيذه لتدبير سالب للحرية ، أو مقيد لها ، حكم بعقوبة سالبة للحرية ، مـن أجل جناية أو جنحة أخـرى فانه يوقف تنفيذ التدبير الوقائى كيفما كان ، ماعدا الوضع القضائى فى مؤسسة للعلاج ، وتنفذ على المحكوم عليه العقوبة الجديدة .

    الباب الثانى

    فى أسباب انقضاء تدابير الوقاية والاعفاء منها أو ايقافها

    (الفصول 93 – 104)

    الفصل 93

    مع مراعاة مقتضيات الفصلين 103 و 104 فان اسباب انقضاء تدابير الوقاية أو الاعفاء منها أو ايقافها هى :

    1) موت المحكوم عليه .
    2) العفو الشامل .
    3) الغاء القانون الجنائى المحكوم بمقتضاه .
    4) العـفـو .
    5) التـقـادم .
    6) الافراج الشرطى .
    7) اعادة الاعتبار .
    8) الصلح ، عندما ينص القانون على ذلك صراحة .

    على أن وقف تنفيذ العقوبة لا أثر له فى تدابير الوقاية .

    الفصل 94

    موت المحكوم عليه لا يحول دون تنفيذ تدابير الوقاية العينية .

    الفصل 95

    القانون المتعلق بالعفو الشامل عن الجريمة أو عن العقوبة الاصلية يوقف تنفيذ التدابير الوقائية الشخصية ، دون التـدابير العينية ، مالم يوجد نص صريح على خلاف ذلك .

    الفصل 96

    الغاء القانون الجنائى يضع حدا لتنفيذ تدابير الوقاية بالشروط المنصوص عليها فى الفصل 9 .

    الفصل 97

    العفو الخاص بالعقوبـة الاصلية لا يسرى على تـدابير الوقاية ، الا اذا ورد نص صريح فى قرار العفو على خلاف ذلك .

    الفصل 98

    تقادم العقوبة الاصلية لا ينتج عنه تقادم تدابير الوقاية .

    الفصل 99

    التدبير الوقائى الذى لم ينفذ يسقط بالتقادم لمضى خمسة أعوام تبدأ اما من تاريخ تمام تنفيذ العقوبة السالبة للحرية تنفيذا فعليا ، او دفع مبلغ الغرامة واما من تاريخ تمام تقادم العقوبة .

    الا أنـه اذا كانت مـدة التدبير الوقائى المحكوم به تزيـد على خمس سنوات فان مدة التقادم تكون مساوية لمدة التدبير المحكوم به .
