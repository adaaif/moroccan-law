    (الفصول 49 - 60)

    الفصل 49

    تنفذ على المحكوم عليه العقوبات الصادرة ضده بتمامها ، الا اذا طرأ سبب من أسباب الانقضاء أو الاعفاء أو الايقاف الآتى بيانها :
    1) موت المحكوم عليه
    2) العفو الشامل
    3) الغاء القانون الجنائى المحكوم بمقتضاه
    4) العفو
    5) التقادم
    6) ايقاف تنفيذ العقوبة
    7) الافراج الشرطى
    8) الصلح ، اذا أجازه القانون بنص صريح

    الفصل 50

    موت المحكوم عليه لا يحول دون تنفيذ الجزاءات المالية على تركته

    الفصل 51

    لا يكون العفو الشامل الا بنص تشريعى صريح
    ويحدد هذا النص ما يترتب عن العفو من آثار دون المساس بحقوق الغير.

    الفصل 52

    باستثناء الحالة المنصوص عليها فى الفصل 7 ، بخصوص تطبيق القوانين المؤقتة فان الغاء قانون جنائى يحول دون تنفيذ العقوبة المحكوم بها بموجبه والتى لم يشرع بعد فى تنفيذها ، كما يجعل حدا للعقوبة الجارى تنفيذها.

    الفصل 53

    العفو حق من حقوق الملك ، ويباشر وفق الترتيبات التى تضمنها الظهير رقم 1-57.387 الصادر فى 16 رجب 1377 موافق 6 ببراير 1958 بخصوص العفو.

    واذا قدم طلب العفو عن محكوم عليه ، معتقل من اجل جنحة أو مخالفة ، جاز لوزير العدل ، بصفة استثنائية ، أن يأمر بالافراج عنه ريثما يبت فى الطلب.

    الفصل 54

    يترتب على تقادم العقوبة تخلص المحكوم عليه من مفعول الحكم ، وفق الشروط المبينة فى الفصول 688 الى 693 من المسطرة الجنائية

    الفصل 55

    فى حالة الحكم بعقوبة الحبس أو الغرامة ، فى غير مواد المخالفات ، اذا لم يكن قد سبق الحكم على المتهم بالحبس من أجل جناية أو جنحة عادية ، يجوز للمحكمة أن تأمر بايقاف تنفيذ تلك العقوبة ، على أن تعلل ذلك.

    الفصل 56

    يصبح الحكم بايقاف التنفيذ كان لم يكن ، بعد مضى خمس سنوات من اليوم الذى صار فيه الحكم حائزا لقوة الشيء المحكوم به ، اذا لم
