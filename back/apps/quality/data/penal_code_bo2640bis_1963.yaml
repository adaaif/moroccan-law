    الجريدة الرسمية 1258 عدد 2640 مكرر - 12 محرم 1383 (5 يونيه 1963)

    يرتكب المحكوم عليه، خلال تلك الفترة، جناية أو جنحة عادية حكم عليه من أجلها بالحبس أو بعقوبة أشد.

    وبعكس ذلك اذا ارتكب جناية أو جنحة داخل أجل الخمس سنوات المنصوص عليه فى الفقرة السابقة فان الحكم بالحبس أو بعقوبة أشد بسبب تلك الجناية أو الجنحة ولو صدر الحكم بعد انصرام الاجل المذكور يترتب عنه حتما بقوة القانون عندما يصير نهائيا الغاء وقف تنفيذ الحكم.

    وتنفذ العقوبة الاولى قبل العقوبة الثانية ، دون ادماج.

    الفصل 57

    ايقاف التنفيذ لا يسرى على أداء صائر الدعوى والتعويضات المدنية كما أنه لا يسرى على العقوبات الاضافية أو فقدان الاهلية المترتب عن الحكم الزجرى.

    غير أن العقوبات الاضافية وحالة فقدان الاهلية ينتهيى مفعولهما حتما يوم يصبح الحكم كأن لم يكن ، وفقا لمقتضيات الفقرة الاولى من الفصل السابق.

    الفصل 58

    اذا كان المحكوم عليه حاضرا بالجلسة ، تعين على القاضى الرئيس بمجرد النطق بالحكم بايقاف التنفيذ ، أن ينذره بأنه اذا حكم عليه مرة أخرى فى الاحوال المبينة فى الفصل 56 فسوف تنفذ عليه فعلا هذه العقوبة ، بالاضافة الى العقوبة التى قد يحكم بها عليه فيما بعد دون أى ادماج. كما أنه سوف يتعرض للعقوبات المشددة بموجب حالة العود.

    الفصل 59

    الافراج المقيد بشروط هو اطلاق سراح المحكوم عليه قبل الاوان نظرا لحسن سيرته داخل السجن ، على أن يظل مستقيم السيرة فى المستقبل ، أما اذا ثبت عليه سوء السلوك ، أو اذا أخل بالشروط التى حددها القرار بالافراج المقيد ، فانه يعاد الى السجن لتتميم ما تبقى من عقوبته.

    ويطبق الافراج المقيد حسب الفصول 663 الى 672 من المسطرة الجنائية.

    الفصل 60

    ليس رد الاعتبار سببا من أسباب انقضاء العقوبة أو الاعفاء منها أو ايقافها ، وانما يمحو فيما يخص المستقبل فقط ، آثار الحكم الزجرى وحالات فقدان الاهلية المترتبة عن هذا الحكم ، وذلك وفق مقتضيات الفصول 730 الى 747 من المسطرة الجنائية.

