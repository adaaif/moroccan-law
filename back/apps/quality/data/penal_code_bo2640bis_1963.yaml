    الفصل 587

    من وضع عمدا شحنة متفجرة في طريق عام أو خاص يعاقب بالسجن من عشرين الى ثلاثين سنة.

    الفصل 588

    اذا نتج عن الجرائم المشار اليها في أحد الفصلين 586 أو 587 موت شخص أو أكثر ، فان الجاني يعاقب بالاعدام . واذا نتج عن الجريمة جروح أو عاهة مستديمة ، فالعقوبة هي السجن المؤبد.

    الفصل 589

    يتمتع بعذر معف من العقاب ، بالشروط المقررة في الفصلين 143 و 145 ، أحد الجناة في الجرائم المشار اليها في الفصول 585 الى 587 ، اذا أخبر بها السلطات الادارية أو القضائية وكشف عن شخصية الجناة الآخرين وكان ذلك قبل تمام الجريمة وقبل أية متابعة ؛ وكذلك اذا مكن من القبض على بقية الجناة ولو كان ذلك بعد ابتداء المتابعة . الا أنه يجوز أن يحكم عليه بالمنع من الاقامة من عشر الى عشرين سنة.

    الفصل 590

    من خرب أو هدم عمدا بأية وسيلة كانت ، كلا أو بعضا من مبان أو قناطر ، أو خواجز أو سدود أو طرق أو منشآت المواني‌ء أو منشآت صناعية ، يعلم أنها مملوكة لغيره ، وكذلك من تسبب في انفجار آلة بخارية ، أو تخريب محرك آلي في منشآت صناعية ، يعاقب بالسجن من خمس سنوات الى عشر.

    واذا نتج عن الجريمة المشار اليها في الفقرة السابقة قتل انسان أو جروح أو عاهة مستديمة للغير ، فان الجاني يعاقب بالاعدام في حالة القتل وبالسجن من عشر الى عشرين سنة في الحالات الاخرى.

