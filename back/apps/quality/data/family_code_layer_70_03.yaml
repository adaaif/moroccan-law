# by BO 5328 of 23 June 2005): left as the file prints them, listed in the review's notes (kept outside the repository).
# Article 397's «والمح عليها» is cut on the Ministry's own page (the Bulletin reads «والمحال»): left, not a layer slip.
# Applied by `manage.py apply_page_reading <this file>`; a reload of the text applies them again.
