  - 'الباب الأول المكرر: في العقوبات البديلة'
  - 'الفرع 2: العمل لأجل المنفعة العامة'
  read_on: '2026-10-27'
  from: الفصل .35-9 -
  table: 'تطبق على أنشطة العمل لأجل المنفعة العامة المقتضيات التشريعية والتنظيمية المتعلقة بحماية أمن وصحة العاملين.

    تتحمل الدولة مسؤولية تعويض الأضرار التي تسبب فيها المحكوم عليه والتي لها علاقة مباشرة بتنفيذ عقوبة العمل لأجل المنفعة العامة. ويحق لها الرجوع على المحكوم عليه للمطالبة بما تم أداؤه.'
- file: adala_89
  article: 35-8
  after: '35'
  label: الفصل 35-8
  headings:
  - 'الكتاب الأول: في العقوبات والتدابير الوقائية'
  - 'الجزء الأول: في العقوبات'
  - 'الباب الأول المكرر: في العقوبات البديلة'
  - 'الفرع 2: العمل لأجل المنفعة العامة'
  read_on: '2026-10-27'
  from: الفصل .35-8 -
  table: 'إذا قررت المحكمة الحكم على الحدث بعقوبة حبسية وفقا للمادة 482 من القانون المتعلق بالمسطرة الجنائية، فيمكنها أن تستبدلها بعقوبة العمل لأجل المنفعة العامة مع مراعاة أحكام الفصل 35-5 أعلاه.

    يجب على قاضي الأحداث أن يتأكد من مدى ملاءمة العمل لأجل المنفعة العامة مع القدرة الجسدية للحدث ومصلحته الفضلى ولحاجيات تكوينه وإعادة إدماجه.'
- file: adala_89
