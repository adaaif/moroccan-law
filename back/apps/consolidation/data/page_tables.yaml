  read_on: '2026-10-27'
  from: 'الفرع :1 أحكام عامة'
  table: 'العقوبات البديلة هي العقوبات التي يحكم بها بديلا للعقوبات السالبة للحرية في الجنح التي لا تتجاوز العقوبة المحكوم بها من أجلها خمس سنوات حبسا نافذا.

    لا يحكم بالعقوبات البديلة في حالة العود.

    تحُولُ العقوبة البديلة دون تنفيذ العقوبة السالبة للحرية على المحكوم عليه، في حالة تنفيذه للالتزامات المفروضة عليه بمقتضاها، وفقا للشروط والأحكام المنصوص عليها في هذا الباب.

    تسري على العقوبات البديلة المقتضيات القانونية المقررة للعقوبة الأصلية للجريمة بما فيها قواعد تفريد العقاب. ولا يحول تنفيذ العقوبة البديلة دون تنفيذ العقوبات الإضافية والتدابير الوقائية.'
