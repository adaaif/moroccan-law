  after: '35'
  label: الفصل 35-4
  headings:
  - 'الكتاب الأول: في العقوبات والتدابير الوقائية'
  - 'الجزء الأول: في العقوبات'
  - 'الباب الأول المكرر: في العقوبات البديلة'
  - 'الفرع 1: أحكام عامة'
  read_on: '2026-10-27'
  from: الفصل .35-4 -
  table: 'إذا قررت المحكمة الحكم بالعقوبة الحبسية المشار إليها في الفقرة الأولى من الفصل 35-1 أعلاه، فإنه يمكنها أن تستبدلها بعقوبة بديلة أو أكثر إما تلقائيا أو بناء على ملتمس النيابة العامة أو طلب المحكوم
    عليه أو دفاعه أو النائب الشرعي للحدث أو مدير المؤسسة السجنية أو من يعنيه الأمر. وفي هذه الحالة يجب عليها :

    - أن تحدد العقوبة الحبسية الأصلية ؛

    - أن تحدد العقوبة البديلة والالتزامات الناتجة عنها ؛

    - أن تشعر المحكوم عليه بأنه في حالة عدم تنفيذه للالتزامات المفروضة عليه، فإنه سيتم تنفيذ العقوبة الحبسية الأصلية المحكوم بها عليه.

    يمكن للمحكمة إجراء بحث اجتماعي حول المعني بالأمر قبل النطق بالحكم، إذا اقتضى الأمر ذلك.

    تراعي المحكمة عند إصدار العقوبات البديلة ما هو ضروري لتحقيق أهداف العقوبة في إعادة تأهيل المحكوم عليه وتقويم سلوكه واستجابته لإعادة الإدماج والحد من حالات العود.

    يؤدي الشروع في تنفيذ العقوبة البديلة إلى وقف سريان تقادم العقوبة الحبسية الأصلية، ولا يبدأ في احتساب مدة التقادم إلا من تاريخ صدور الأمر بتنفيذ العقوبة الأصلية أو ما تبقى منها المشار إليه في البند 1
    من المادة 647-3 من القانون المتعلق بالمسطرة الجنائية.'
