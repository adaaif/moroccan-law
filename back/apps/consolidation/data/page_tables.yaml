    يجرى الاختبار المنصوص عليه في 1 من المادة 10 من القانون رقم 52.05 السالف الذكر المسمى «الاختبار النظري» في هذا المرسوم، بواسطة برامج وحوامل معلوماتية تحدد بقرار لوزير التجهيز والنقل.
    ويجرى هذا الاختبار تحت مراقبة مشرف يعينه وزير التجهيز والنقل أو الشخص الذي يفوضه لهذا الغرض.
    يجوز للمترشح، حسب اختياره، اجتياز الاختبار النظري سواء باللغة العربية أو بالدارجة المغربية أو بالأمازيغية أو باللغة الفرنسية. وفي حالة عدم معرفة المترشح باللغات المذكورة، يجوز له اجتياز الاختبار النظري بمساعدة مترجم محلف على نفقته، وتحدد كيفيات تطبيق هذه الفقرة بمقرر لوزير التجهيز والنقل، عند الاقتضاء.
    يجوز للمترشح الأصم أو الأبكم القادر على السياقة أن يجتاز الاختبار النظري بمساعدة مترجم في لغة الإشارة على نفقته.
    تحدد بقرار لوزير التجهيز والنقل مواضيع الاختبار النظري وكيفيات تقييم المترشحين حسب كل صنف من أصناف رخصة السياقة.
