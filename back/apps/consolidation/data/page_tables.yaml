    توجه النيابة العامة المختصة إلى المصالح الجهوية أو الإقليمية التابعة لوزارة التجهيز والنقل لمكان ارتكاب المخالفات نسخا من المقرارات القضائية داخل أجل 15 يوما، يحتسب ابتداء من التاريخ الذي اكتسبت فيه هذه المقرارات قوة الشيء المقضي به.
    في حالة أداء الغرامة التصالحية والجزافية داخل أجل 15 يوما المنصوص عليه في الفقرة الثانية من المادة 228 من القانون رقم 52.05 السالف الذكر، توجه المصالح المكلفة بمعاينة المخالفات لأحكام القانون المذكور والنصوص المتخذة لتطبيقه إلى المصالح الجهوية أو الإقليمية التابعة لوزارة التجهيز والنقل لمكان ارتكاب المخالفات نسخا من المحاضر أو من إيصالات أداء الغرامة، داخل أجل لا يتعدى 48 ساعة، يحتسب ابتداء من تاريخ الأداء.
    في حالة عدم أداء الغرامة التصالحية والجزافية داخل أجل 15 يوما المشار إليه أعلاه، توجه المصالح المكلفة بمعاينة المخالفات الأحكام القانون المذكور وللنصوص المتخذة لتطبيقه إلى المصالح الجهوية أو الإقليمية التابعة لوزارة التجهيز والنقل لمكان ارتكاب المخالفة، نسخا من المحاضر داخل أجل أقصاه 48 ساعة، يحتسب بعد انقضاء أجل 15 يوما المشار إليه أعلاه..
    في حالة أداء ثلثي الحد الأقصى للغرامة، كما هو منصوص عليه في المادة 234 من القانون رقم 52.05 السالف الذكر، يجب على وكيل الملك أن يوجه داخل أجل 15 يوما من تاريخ صدور المقرر إلى المصالح الجهوية أو الإقليمية لوزارة التجهيز والنقل لمكان ارتكاب المخالفات نسخا مما يلي:
    - طلب سحب الشكاية؛
    - وصل أداء الغرامة المذكورة؛
    - مقرر حفظ القضية أو المقرر القضائي الصادر عن المحكمة المختصة التي رفعت إليها القضية.
    غير أنه يجب على النيابة العامة والمصالح المذكورة، في حالة توفرها على التجهيزات اللازمة، أن توجه فورا في شكل إلكتروني المراجع ومحتوى الإيصالات والمحاضر والمقررات المنصوص عليها في هذه المادة، عبر الولوج إلى وجيهة من الجذاذية الوطنية لرخصة السياقة.
