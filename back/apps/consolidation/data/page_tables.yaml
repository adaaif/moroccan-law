    يمكن تغيير البيانات التي يجب أن يتضمنها الحامل المحررة فيه رخصة السياقة والمنصوص عليها في المادة 37 من القانون رقم 52.05 السالف الذكر أو تتميمها بقرار لوزير التجهيز والنقل.
    تتولى المصلحة المكلفة بتسليم رخص السياقة تلقي إشعار تغيير الهوية أو العنوان وتحيين البيانات المتعلقة بهما المنصوص عليه في الفقرة الرابعة من المادة 38 من القانون السالف الذكر رقم 52.05، وتحدد كيفيات تطبيق هذه الفقرة، عند الاقتضاء، بقرار لوزير التجهيز والنقل.
