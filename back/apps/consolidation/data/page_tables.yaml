  - 'الفرع 2: العمل لأجل المنفعة العامة'
  read_on: '2026-10-27'
  from: الفصل .35-6 -
  table: 'يكون العمل لأجل المنفعة العامة غير مؤدى عنه، وينجز لمدة تتراوح بين 40 و3600 ساعة لفائدة مصالح الدولة أو الجماعات الترابية أو مؤسسات أو هيئات حماية الحقوق والحريات والحكامة الجيدة أو المؤسسات العمومية
    أو المؤسسات الخيرية أو دور العبادة، أو غيرها من المؤسسات أو الجمعيات أو المنظمات غير الحكومية العاملة لفائدة الصالح العام.

    تعتبِر المحكمة لتحديد عدد ساعات العمل لأجل المنفعة العامة المحكوم بها، موازاة كل يوم من مدة العقوبة الحبسية المحكوم بها لثلاث ساعات من العمل، مع مراعاة الحدين الأدنى والأقصى لعدد ساعات العمل المنصوص
    عليها في الفقرة الأولى أعلاه.

    يراعى في العمل، عند الاقتضاء، توافقه مع جنس وسن ومهنة أو حرفة المحكوم عليه، أو مع مؤهلاته وقدراته، كما يمكن أن يكون مكملا لنشاطه المهني أو الحرفي المعتاد.'
- file: adala_89
