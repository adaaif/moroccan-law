    يكون ملف الترشح، في حالة الرسوب في الامتحان الأول صالحا لاجتياز امتحان ثان.
    لا يجوز للمترشح اجتياز الاختبار التطبيقي إلا إذا اجتاز بنجاح الاختبار النظري.
    في حالة النجاح في الاختبار النظري والرسوب في الاختبار التطبيقي في الامتحان الأول، يخضع المترشح في الامتحان الثاني للاختبار التطبيقي فقط.
    يؤدي الرسوب في الامتحان الأول إلى الإرجاء إلى الامتحان الثاني.
    يؤدي الرسوب في الامتحان الثاني إلى إلغاء ملف الترشح. وفي هذه الحالة، يجب على المترشح أن يكون ملفا جديدا إذا رغب في التقدم من جديد لاجتياز امتحان الحصول على رخصة السياقة.
    يحدد الأجل الأدنى لإرجاء أحد اختبارات امتحان الحصول على رخصة السياقة أو إجراء امتحان جديد عقب إلغاء ملف الترشح الأول، بقرار لوزير التجهيز والنقل.
