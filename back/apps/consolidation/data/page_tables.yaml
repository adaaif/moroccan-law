  table: يلتزم المحكوم عليه بتنفيذ العقوبات المقيدة لبعض الحقوق أو فرض تدابير رقابية أو علاجية أو تأهيلية، داخل أجل لا يتجاوز ستة أشهر من تاريخ صدور المقرر التنفيذي المشار إليه في المادة 647-2 من القانون
    المتعلق بالمسطرة الجنائية، ويمكن تمديد هذا الأجل لمدة مماثلة مرة واحدة، بناء على طلب المحكوم عليه أو من له مصلحة في ذلك، بقرار صادر عن قاضي تطبيق العقوبات، إذا اقتضى الأمر ذلك.
- file: adala_89
  article: 35-12
  after: '35'
  label: الفصل 35-12
  headings:
  - 'الكتاب الأول: في العقوبات والتدابير الوقائية'
  - 'الجزء الأول: في العقوبات'
  - 'الباب الأول المكرر: في العقوبات البديلة'
  - 'الفرع 4: تقييد بعض الحقوق أو فرض تدابير رقابية أو علاجية أو تأهيلية'
  read_on: '2026-10-27'
  from: الفصل .35-12 -
  table: 'العقوبات المقيدة لبعض الحقوق أو فرض تدابير رقابية أو علاجية أو تأهيلية والتي يمكن الحكم بواحدة أو أكثر منها، هي :

    1 - مزاولة المحكوم عليه نشاطا مهنيا محددا أو تتبعه دراسة أو تأهيلا مهنيا محددا ؛

    2 - إقامة المحكوم عليه بمكان محدد والتزامه بعدم مغادرته، أو بعدم مغادرته في أوقات معينة، أو منعه من ارتياد أماكن معينة، أو من عدم ارتيادها في أوقات معينة ؛

    3 - فرض رقابة يلزم بموجبها المحكوم عليه، بالتقدم في مواعيد محددة، إما إلى المؤسسة السجنية وإما إلى مقر الشرطة أو الدرك الملكي أو مكتب المساعدة الاجتماعية بالمحكمة ؛

    4 - التعهد بعدم التعرض أو الاتصال بالأشخاص ضحايا الجريمة بأي وسيلة كانت ؛

    5 - خضوع المحكوم عليه لعلاج نفسي أو علاج ضد الإدمان؛

    6 - تعويض أو إصلاح المحكوم عليه للأضرار الناتجة عن الجريمة.'
- file: adala_89
  article: 35-11
  after: '35'
  label: الفصل 35-11
  headings:
  - 'الكتاب الأول: في العقوبات والتدابير الوقائية'
  - 'الجزء الأول: في العقوبات'
  - 'الباب الأول المكرر: في العقوبات البديلة'
  - 'الفرع 4: تقييد بعض الحقوق أو فرض تدابير رقابية أو علاجية أو تأهيلية'
  read_on: '2026-10-27'
  from: الفصل .35-11 -
  table: 'يمكن للمحكمة أن تحكم بالعقوبة المقيدة لبعض الحقوق أو فرض تدابير رقابية أو علاجية أو تأهيلية بديلا للعقوبات السالبة للحرية.

    تستهدف هذه العقوبات اختبار المحكوم عليه للتأكد من استعداده لتقويم سلوكه واستجابته لإعادة الإدماج.'
- file: adala_89
  article: 35-10
  after: '35'
  label: الفصل 35-10
  headings:
  - 'الكتاب الأول: في العقوبات والتدابير الوقائية'
  - 'الجزء الأول: في العقوبات'
  - 'الباب الأول المكرر: في العقوبات البديلة'
  - 'الفرع 3: المراقبة الإلكترونية'
  read_on: '2026-10-27'
  from: الفصل .35-10 -
  table: 'يمكن للمحكمة أن تحكم بالمراقبة الإلكترونية بديلا للعقوبة السالبة للحرية.

    يتم الخضوع للمراقبة الإلكترونية من خلال مراقبة حركة وتنقل المحكوم عليه إلكترونيا بواحدة أو أكثر من وسائل المراقبة الإلكترونية المعتمدة.

    يحدد مكان ومدة المراقبة الإلكترونية من طرف المحكمة ويراعى في تحديدها خطورة الجريمة والظروف الشخصية والمهنية للمحكوم عليه وسلامة الضحايا، وعدم المساس بالحقوق الشخصية للأشخاص المتواجدين رفقته.

    تقييد بعض الحقوق أو فرض تدابير رقابية أوعلاجية أو تأهيلية'
- file: adala_89
  article: 35-9
  after: '35'
  label: الفصل 35-9
  headings:
