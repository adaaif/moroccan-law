  table: 'تحدد العقوبات البديلة في :

    1- العمل لأجل المنفعة العامة ؛

    2 - المراقبة الإلكترونية ؛

    3 - تقييد بعض الحقوق أو فرض تدابير رقابية أو علاجية أو تأهيلية ؛

    4 - الغرامة اليومية.'
