    هذا الأجل لمدة مماثلة مرة واحدة بقرار صادر عن قاضي تطبيق العقوبات، بناء على طلب مبرر من المحكوم عليه أو بطلب من دفاعه أو من له مصلحة في ذلك.
- file: adala_89
