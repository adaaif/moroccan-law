  label: الفصل 35-15
  headings:
  - 'الكتاب الأول: في العقوبات والتدابير الوقائية'
  - 'الجزء الأول: في العقوبات'
  - 'الباب الأول المكرر: في العقوبات البديلة'
  - 'الفرع 5: الغرامة اليومية'
  read_on: '2026-10-27'
  from: الفصل .35-15 -
  table: 'يحدد مبلغ الغرامة اليومية بين 100 و2.000 درهم عن كل يوم من العقوبة الحبسية المحكوم بها.

    تراعي المحكمة في تحديد الغرامة اليومية الإمكانيات المادية للمحكوم عليه أو ذويه وتحملاته المالية وخطورة الجريمة المرتكبة والضرر المترتب عنها.

    يلتزم المحكوم عليه بأداء المبلغ المحدد له في أجل لا يتجاوز ستة أشهر من تاريخ صدور المقرر التنفيذي المشار إليه في المادة 647-2 من القانون المتعلق بالمسطرة الجنائية، ويمكن تمديد هذا الأجل لمدة مماثلة
    مرة واحدة بقرار صادر عن قاضي تطبيق العقوبات بناء على طلب من المحكوم عليه، أو من له مصلحة في ذلك.'
- file: adala_89
  article: 35-14
  after: '35'
  label: الفصل 35-14
  headings:
  - 'الكتاب الأول: في العقوبات والتدابير الوقائية'
  - 'الجزء الأول: في العقوبات'
  - 'الباب الأول المكرر: في العقوبات البديلة'
  - 'الفرع 5: الغرامة اليومية'
  read_on: '2026-10-27'
  from: الفصل .35-14 -
  table: 'يمكن للمحكمة أن تحكم بعقوبة الغرامة اليومية بديلا للعقوبة الحبسية النافذة.

    تتمثل الغرامة اليومية في مبلغ مالي تحدده المحكمة عن كل يوم من المدة الحبسية المحكوم بها.

    يمكن الحكم بعقوبة الغرامة اليومية على الأحداث في حالة موافقة وليهم أو من يمثلهم.

    لا يمكن الحكم بعقوبة الغرامة اليومية إلا بعد الإدلاء بما يفيد وجود صلح أو تنازل صادر عن الضحية أو ذويه أو قيام المحكوم عليه بتعويض أو إصلاح الأضرار الناتجة عن الجريمة.'
- file: adala_89
