articles:
  '2':
    - 'تستفيد كل فئة أو مجموعة من الفئات التالية من نظام للتأمين الإجباري الأساسي عن المرض يكون خاصا بها :'
    - '- موظفو وأعوان الدولة والجماعات المحلية والمؤسسات العمومية ؛'
    - '- الأشخاص الخاضعين لنظام الضمان الاجتماعي الجاري به العمل في القطاع الخاص ؛'
    - '- أصحاب المعاشات بالقطاعين العام والخاص ؛'
    - '- المهنيون والعمال المستقلون والأشخاص غير الأجراء الذين يزاولون نشاطا خاصا وذوو المعاشات منهم ؛'
    - '- الأشخاص غير القادرين على تحمل واجبات الاشتراك المنصوص عليهم في الكتاب الثالث من هذا القانون ؛'
    - '- قدماء المقاومين وأعضاء جيش التحرير وطلبة التعليم العالي العام والخاص في حالة عدم استفادتهم منه طبقا لأحكام المادة 5 بعده ؛'
    - '- الأشخاص القادرون على تحمل واجبات الاشتراك الذين لا يزاولون أي نشاط مأجور أو غير مأجور.'
  '4':
    - 'يحدد هذا القانون القواعد العامة المشتركة بين جميع الأنظمة، والقواعد الخاصة بنظام التأمين الإجباري الأساسي عن المرض الخاص بالمأجورين وأصحاب المعاشات بالقطاعين العام والخاص وكذا الأحكام الخاصة بنظام التأمين الإجباري الأساسي عن المرض الخاص بالأشخاص غير القادرين على تحمل واجبات الاشتراك.'
    - 'وتحدد بموجب تشريعات خاصة، القواعد التي يخضع لها نظاما التأمين الإجباري الأساسي عن المرض، الخاص بالطلبة والخاص بالمهنيين والعمال المستقلين والأشخاص غير الأجراء الذين يزاولون نشاطا خاصا.'
    - 'وتحدد بموجب تشريع خاص القواعد والشروط التي يمكن بموجبها لقدماء المقاومين وأعضاء جيش التحرير الاستفادة من نظام التأمين الإجباري الأساسي عن المرض في حالة عدم استفادتهم منه بأي صفة أخرى.'
    - 'كما تحدد بموجب تشريع خاص القواعد والشروط التي يمكن بموجبها للأشخاص القادرين على تحمل واجبات الاشتراك المنصوص عليهم في المادة 2 أعلاه الاستفادة من نظام التأمين الإجباري الأساسي عن المرض.'
  '5':
    - 'يشمل التأمين الإجباري الأساسي عن المرض، بالإضافة إلى الشخص الخاضع لإجبارية التأمين الأساسي عن المرض برسم النظام الذي ينتمي إليه، أفراد عائلته الموجودين تحت كفالته، شريطة أن لا يكونوا من المستفيدين بصفة شخصية من تأمين آخر مماثل.'
    - 'ويعتبر في حكم أفراد العائلة الموجودين تحت الكفالة كل من :'
    - '- زوج أو زوجة أو زوجات المؤمن ؛'
    - '- الأولاد المتكفل بهم من لدن المؤمن والبالغين من العمر 21 سنة على الأكثر، مع مراعاة أحكام البند السادس من المادة 2 أعلاه ؛'
    - '- الأطفال المتكفل بهم طبقا للتشريع الجاري به العمل.'
    - 'غير أن حد السن يمكن تمديده إلى 26 سنة بالنسبة للأولاد الذين يتابعون دراسات عليا، شريطة الإدلاء بما يثبت ذلك.'
    - 'ويعتبر في حكم الشخص المتكفل به دونما تحديد للسن، أولاد المؤمن في وضعية إعاقة والأطفال المتكفل بهم الموجودون في نفس الوضعية الذين يستحيل عليهم القيام بصورة كلية دائمة ونهائية، بمزاولة أي نشاط مأجور.'
  '118':
    - 'يقبل للاستفادة من نظام التأمين الإجباري الأساسي عن المرض الخاص بالأشخاص غير القادرين على تحمل واجبات الاشتراك، الفئات التالية، ما لم تثبت قدرتهم على تحمل واجبات الاشتراك :'
    - '- نزلاء المؤسسات الخيرية ودور الأيتام والملاجئ أو مؤسسات إعادة التربية وأي مؤسسة عمومية أو خاصة لا تسعى إلى الحصول على ربح، وتعمل على إيواء أطفال مهملين، أو أشخاص بالغين لا أسرة لهم ؛'
    - '- نزلاء المؤسسات السجنية ؛'
    - '- الأشخاص الذين لا يتوفرون على سكن قار.'
    - 'تحدد كيفيات تطبيق هذه المادة بنص تنظيمي.'
  '125':
    - 'يمول نظام التأمين الإجباري الأساسي عن المرض الخاص بالأشخاص غير القادرين على تحمل واجبات الاشتراك بصفة رئيسية من لدن الدولة والجماعات المحلية، كما يمول عن طريق :'
    - '- العائدات المالية ؛'
    - '- الهبات والوصايا ؛'
    - '- جميع الموارد الأخرى المرصدة لهذا النظام، عملا بنصوص تشريعية وتنظيمية خاصة.'
  '144':
    - 'إذا قدمت الخدمات المنصوص عليها في المادة 7 من هذا القانون لمستفيد كان ضحية حادثة، أو أصيب بجروح تسبب فيها الغير، فإن الهيئة المكلفة بتدبير نظام التأمين الإجباري الأساسي عن المرض تحل بقوة القانون محل المستفيد المذكور في دعواه ضد الغير المسؤول، للمطالبة بإرجاع المبالغ المدفوعة بغير حق إلى الضحية أو إرجاع مصاريف الخدمات المقدمة له بموجب المادة 7 السالفة الذكر.'
  '145':
    - 'يجب على الشخص الضحية أو ذوي حقوقه في حالة إقامة دعوى قضائية على الغير المسؤول لأجل التعويض عن الضرر اللاحق بهم، الإشارة في كل مراحل المسطرة إلى أن الشخص الضحية يستفيد من التأمين الإجباري الأساسي عن المرض.'
    - 'إذا لم تتم الإشارة إلى ذلك، ولم يقم الشخص الضحية أو ذوو حقوقه بإرجاع المبالغ المقبوضة بغير حق، جاز للنيابة العامة أو الهيئة المكلفة بالتدبير، خلال أجل أربع سنوات ابتداء من التاريخ الذي أصبح فيه الحكم نهائيا، طلب إبطال الحكم من حيث الجوهر.'
