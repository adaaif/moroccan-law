# The headers every answer of the site carries. deploy/nginx.conf includes this file in its main server and again in
# each location that says add_header (nginx drops the server's add_header lines in a location that has one of its own).
# deploy.sh --system installs it as /etc/nginx/law-headers.conf.

# Once on https, the browser asks this address by https alone for a month (no preload, no other host name): a password
# typed after someone typed the bare name no longer travels in clear. Sent with plain http too, where browsers ignore it.
add_header Strict-Transport-Security "max-age=2592000" always;
# Who may hold the page in a frame: the site itself; /embed/ any site; /connect none ($law_framing, nginx.conf).
add_header X-Frame-Options $law_xfo always;
# A file is what its type says: a picture or a text sent back is never run as a script or a stylesheet.
add_header X-Content-Type-Options "nosniff" always;

# Enforced: no plugin, no <base> that would send the page's relative addresses elsewhere, and who may frame the page.
add_header Content-Security-Policy "object-src 'none'; base-uri 'none'$law_frame_ancestors" always;
# The whole policy, reported in the browser's console but not enforced. Scripts from the site itself, with WebAssembly
# (the citation reader) and Cloudflare's Turnstile (the check past a day's reading); everything else from the site
# itself; styles inline too (React's style attributes). It is not enforced yet, for two reasons:
# - the landing pages the deploy draws (the home, the topics, the blog: web/scripts/prerender.mjs) carry the small inline
#   scripts with which React reveals the parts that loaded apart; refused, those parts stay hidden until the app's code
#   has come, which on a slow phone is the whole first screen;
# - Turnstile was tried with Cloudflare's test keys only, and the sign-in with Google (a trip to Google's own page and
#   back, which no directive here governs) not with the live client.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-src 'self' https://challenges.cloudflare.com; worker-src 'self'; manifest-src 'self'; form-action 'self'; object-src 'none'; base-uri 'none'$law_frame_ancestors" always;
