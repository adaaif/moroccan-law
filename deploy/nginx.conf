# The site behind a Cloudflare tunnel (cloudflared → 127.0.0.1:8041), a template: deploy.sh writes @DOMAIN@ (the site's
# address) and @ROOT@ (the folder on the server) in before installing it as /etc/nginx/sites-available/law. www.@DOMAIN@
# leads to it with a 302 (a 301 is kept by browsers for good). A server's other names come as server blocks of their own
# in /etc/nginx/law-sites/ (deploy/private/nginx-*.conf), included below. While GATE_PASSWORD is set, nothing is served
# without the gate's cookie: nginx asks Django (/gate/check/) before every file, and Django refuses every API call itself
# (apps.gate); with the gate open nginx asks nothing ($law_gate below). The assistants' sign-in (/oauth/, /.well-known/)
# carries its own authorization and is never behind the gate; their MCP server (/mcp, the law-mcp service) is: with
# the site closed, the law is not read through it either.

# Request limits, each keyed on the visitor as nginx resolved it from CF-Connecting-IP (set_real_ip_from below): an IPv4
# address whole, an IPv6 one by its /64 (a phone or a home is given a whole /64 and may change the rest at will).
# Mobile operators put thousands of phones behind one IPv4 address, so each limit sits far above one honest reader: a
# page view fires a burst of API calls, served at once (nodelay), and the API's limit is several times Django's own for
# the views it throttles (240 a minute an address). Past a limit, 429. The machine's own requests (deploy.sh's checks,
# the prerender over ssh) come from 127.0.0.1 with no CF-Connecting-IP: an empty key is never counted.
# Search engines' crawlers ask a few pages a second from each of many addresses, well under these.
map $remote_addr $law_visitor {
    127.0.0.1   "";
    ::1         "";
    "~^(?<law_v6>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):"        $law_v6;
    "~^(?<law_v6>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4})::"                     $law_v6:0;
    "~^(?<law_v6>[0-9a-f]{1,4}:[0-9a-f]{1,4})::"                                  $law_v6:0:0;
    "~^(?<law_v6>[0-9a-f]{1,4})::(?<law_v6b>[0-9a-f]{1,4})(:[0-9a-f]{1,4}){4}$"   $law_v6:0:0:$law_v6b;
    "~^(?<law_v6>[0-9a-f]{1,4})::"                                                $law_v6:0:0:0;
    default     $remote_addr;
}
limit_req_zone $law_visitor zone=law_api:10m rate=30r/s;          # /api/ and /admin/
limit_req_zone $law_visitor zone=law_pages:10m rate=10r/s;        # the pages Django draws: /ma/, /bo/, /search, /words
limit_req_zone $law_visitor zone=law_oauth:1m rate=5r/s;          # the assistants' sign-in: /oauth/, /.well-known/
# The MCP server: a few platform addresses carry every user of an assistant, and Django holds its own shares per
# platform, address and account (apps/mcp/services/origin.py): this is only a floodgate, far above them.
limit_req_zone $law_visitor zone=law_mcp:4m rate=50r/s;
limit_req_zone $law_visitor zone=law_gate_tries:1m rate=12r/m;    # the gate's password (a new name: its key changed)
# The admin's sign-in: each password tried is a full hash on a worker. Only the tries count (a POST), five at once, then
# one each ten seconds. Django's own brake counts the tries on each account.
map $request_method $law_signin {
    POST    $law_visitor;
    default "";
}
limit_req_zone $law_signin zone=law_signin:1m rate=6r/m;

# Search engines: $law_index is what a page says to them, "noindex, nofollow" while INDEXING is not 'open' in the
# server's .env, empty once it is (an empty add_header is not sent). deploy.sh writes
# the file from that line at every deploy: `map $host $law_index { default "…"; }`. What is never indexed (the API, the
# admin, the MCP, searches, the discussion's and the accounts' pages) says noindex itself, whatever the switch.
include /etc/nginx/law-indexing.conf;

# The gate: $law_gate is «open» while GATE_PASSWORD is empty in the server's .env, «closed» once it is set.
# deploy.sh writes the file from that line at every deploy: `map $host $law_gate { default "…"; }`. Open, nginx asks
# Django nothing before a file, so the files and the prepared pages are served while Django restarts.
# To close the site: set GATE_PASSWORD in .env and deploy; restarting law-web alone shuts the API, not the files.
include /etc/nginx/law-gate.conf;

# A visitor who came by plain http: Cloudflare names the visitor's scheme in CF-Visitor ({"scheme":"http"}), and the
# servers below send them to https, GET and HEAD with a 301, any other method with a 308, which keeps the method and the
# body. X-Forwarded-Proto is not read: through the tunnel it may name the scheme of the hop to this machine, always http,
# and a wrong reading would send every visitor round in a loop. A request that did not come through Cloudflare
# (deploy.sh's checks, the prerender over ssh) has no CF-Visitor and is answered as it is.
map "$http_cf_visitor $request_method" $law_to_https {
    default                                         "";
    '~"scheme"\s*:\s*"http".* (GET|HEAD)$'          301;
    '~"scheme"\s*:\s*"http"'                        308;
}

# Who may hold a page of the site in a frame (deploy/nginx-headers.conf says it on every answer): the site itself
# (unset, the default), unless the location sets $law_framing otherwise: «any» for /embed/ (an article for another
# site's page), «none» for the consent page /connect (clickjacking).
map $law_framing $law_xfo {
    default SAMEORIGIN;
    none    DENY;
    any     "";
}
map $law_framing $law_frame_ancestors {
    default "; frame-ancestors 'self'";
    none    "; frame-ancestors 'none'";
    any     "";
}

# The access log (the analytics review, 15 Nov 2026): the last place that holds a reader's address beside the page
# asked, kept as a security record for 7 days (deploy/logrotate-nginx, its own folder: the stock rule's
# /var/log/nginx/*.log never reaches it) and read once a night by `count_machines` (back/apps/analytics/services/
# machines.py, whose parser reads exactly this line, and whose test reads this format). nginx's combined format but for
# three fields:
#   - the request: its method, its address as asked cut at «?» ($request_uri, the original: $uri is what try_files and
#     the named locations made of it, /index.html for most pages), and its protocol. A search's words, a link's
#     parameters, a token in a query are never written;
#   - the referring page, cut at «?» too;
#   - the user of HTTP basic authentication, which the site never asks for, written «-» whatever a request sends (it
#     would stand outside quotes, and nginx does not escape a space).
# nginx escapes «"», «\» and every byte outside printable ASCII as \xXX (escape=default), so a field in quotes never
# holds a quote; an address or a referer that is missing is «-», an empty User-Agent "". /search?q=… from
# https://example.org/a?b=c is written:
#   2001:db8::7 - - [14/Nov/2026:08:01:02 +0000] "GET /search HTTP/1.1" 200 5120 "https://example.org/a" "Mozilla/5.0 …"
# Each server of the site names the log itself (access_log … law): a server's own access_log replaces those it would
# inherit, while one said here, at the http level, is added to nginx.conf's stock access_log (/var/log/nginx/access.log,
# combined, query strings and all), and every request is written to both. A server block of a server's own names
# (deploy/private/nginx-*.conf) must name it too, or it writes the stock log. nginx's error log (the stock
# /var/log/nginx/error.log) is not this one: a request refused (429) or not answered by Django is written there with its
# address, its whole request line and its referer.
map $request_uri $law_log_path {
    ""                          "-";
    "~^(?<law_log_p>[^?]*)"     $law_log_p;
}
map $http_referer $law_log_referer {
    ""                          "-";
    "~^(?<law_log_r>[^?]*)"     $law_log_r;
}
log_format law escape=default '$remote_addr - - [$time_local] "$request_method $law_log_path $server_protocol" '
                              '$status $body_bytes_sent "$law_log_referer" "$http_user_agent"';

upstream law_django {
    server 127.0.0.1:8040;
    keepalive 16;
}

# The www name leads to the address.
server {
    listen 127.0.0.1:8041;
    server_name www.@DOMAIN@;
    access_log /var/log/nginx/law/access.log law;
    # The reader's address in the log is the one Cloudflare saw; the machine's own requests stay 127.0.0.1.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    # Addresses that a site formerly at this name used and that search engines may still list (/art/…, dates): gone,
    # and said as gone (410), so they are dropped. No address of this site begins with /art/ or with a year.
    location ^~ /art/ { return 410; }
    location ~ ^/(19|20)[0-9][0-9]/[0-9][0-9]?/[0-9][0-9]?(/|$) { return 410; }
    location / { return 302 https://@DOMAIN@$request_uri; }
}

# A server's other names (redirects, an older address kept for a while): one file each, from deploy/private/.
include /etc/nginx/law-sites/*.conf;

server {
    listen 127.0.0.1:8041 default_server;
    server_name @DOMAIN@;
    access_log /var/log/nginx/law/access.log law;

    # The reader's address is the one Cloudflare saw (the gate's tries, the API's limits, the request limits above).
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    limit_req_status 429;
    # Plain http to https ($law_to_https above); Strict-Transport-Security then keeps the browser on https
    # (deploy/nginx-headers.conf).
    if ($law_to_https = 301) { return 301 https://$server_name$request_uri; }
    if ($law_to_https = 308) { return 308 https://$server_name$request_uri; }

    absolute_redirect off;                          # «/gate/…», never nginx's own http://…:8041
    root @ROOT@/app/web/dist;
    # What a request may carry: 64 KB, so that no request makes a worker read megabytes before Django looks at it. The
    # API, the assistants' sign-in and the gate take JSON or a form of a few kilobytes (a post is 3,000 characters); the
    # few addresses that take more say so below, each sized to what Django itself accepts there.
    client_max_body_size 64k;

    # The headers every answer carries (deploy/nginx-headers.conf: framing, types, the content policy). nginx drops the
    # server's add_header lines in a location that has one of its own, so each such location includes the file again
    # (back/apps/seo/tests/test_addresses.py checks it). Django's own X-Frame-Options and nosniff are set aside: nginx
    # says them for every answer, Django's and the files alike, with one value. $law_framing is set by the two locations
    # that differ (/embed/, /connect) and left unset elsewhere, where the maps read it as the site's own: set here, the
    # gate's subrequest (auth_request, which shares the request's variables) would set it back after the location did.
    uninitialized_variable_warn off;
    include /etc/nginx/law-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location = /_gate {
        internal;
        if ($law_gate = open) { return 204; }
        proxy_pass http://law_django/gate/check/;
        proxy_pass_request_body off;
        # A proxy_set_header here drops the server's: Host and the rest are said again (Django refuses an unknown host).
        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    error_page 401 = @gate;
    location @gate {
        return 302 /gate/?next=$uri;
    }

    location /gate/ {
        limit_req zone=law_gate_tries burst=10 nodelay;
        proxy_pass http://law_django;
    }
    location /fonts/ {                              # the gate page's own type
        expires 30d;
    }
    location = /admin/login/ {
        limit_req zone=law_signin burst=5 nodelay;
        limit_req zone=law_api burst=120 nodelay;
        proxy_pass http://law_django;
    }
    location /api/ {                                # Django holds its own gate
        limit_req zone=law_api burst=120 nodelay;
        proxy_pass http://law_django;
        proxy_read_timeout 60s;
        # The citations read in a pasted document (at most 300, apps/search/api/views.py): about 75 KB of JSON.
        location = /api/search/resolve/ {
            client_max_body_size 256k;
            proxy_pass http://law_django;
        }
        # A voice or a picture, and a reviewer's covered copy of one (apps.media: a picture up to 12 MB, a voice 6 MB).
        location ~ ^/api/discussion/(voices|pictures)/$ {
            client_max_body_size 16m;
            proxy_pass http://law_django;
        }
        location ~ ^/api/discussion/review/contributions/[0-9]+/pictures/[0-9a-f-]+/$ {
            client_max_body_size 16m;
            proxy_pass http://law_django;
        }
    }
    # The database's files (apps/opendata/views.py): Django decides who may have one, counts it and answers with an empty
    # body and X-Accel-Redirect: /_open/<edition>/<file> (OPEN_DATA_ACCEL=/_open in .env). nginx then sends the file from
    # the editions' folder (OPEN_DATA_DIR, data/open by default), with the type, name and Cache-Control Django gave, and
    # answers a Range: a download cut off resumes where it stopped. Never asked for directly (internal).
    location ^~ /_open/ {
        internal;
        alias @ROOT@/data/open/;
    }
    location /admin/ {
        limit_req zone=law_api burst=120 nodelay;
        client_max_body_size 3m;                    # Django refuses a form over 2.5 MB itself (DATA_UPLOAD_MAX_MEMORY_SIZE)
        proxy_pass http://law_django;
        proxy_read_timeout 60s;
    }
    # robots.txt, the sitemaps and IndexNow's key, Django's (apps.seo): written from SITE_URL, the sitemaps nightly.
    location = /robots.txt { limit_req zone=law_pages burst=40 nodelay; proxy_pass http://law_django; }
    location = /sitemap.xml { limit_req zone=law_pages burst=40 nodelay; proxy_pass http://law_django; }
    location ^~ /sitemaps/ { limit_req zone=law_pages burst=40 nodelay; proxy_pass http://law_django; }
    location = /indexnow.txt { limit_req zone=law_pages burst=40 nodelay; proxy_pass http://law_django; }
    # The addresses of a site formerly at this name (see the www server above): gone.
    location ^~ /art/ { return 410; }
    location ~ ^/(19|20)[0-9][0-9]/[0-9][0-9]?/[0-9][0-9]?(/|$) { return 410; }
    # A Bulletin issue and the words, each with its own head, an issue drawn with its texts; /texts/<id> said as the
    # text's own address.
    location ~ ^/bo/[a-z_]+/[0-9]+(-[a-z]+)?$ {
        auth_request /_gate;
        limit_req zone=law_pages burst=40 nodelay;
        include /etc/nginx/law-headers.conf;
        add_header X-Robots-Tag $law_index always;
        proxy_pass http://law_django;
    }
    location ~ ^/words(/[^/]+)?$ {
        auth_request /_gate;
        limit_req zone=law_pages burst=40 nodelay;
        include /etc/nginx/law-headers.conf;
        add_header X-Robots-Tag $law_index always;
        proxy_pass http://law_django;
    }
    location ~ ^/texts/[0-9]+$ {
        auth_request /_gate;
        limit_req zone=law_pages burst=40 nodelay;
        proxy_pass http://law_django;
    }
    # Never in a search engine: the discussion's pages (a case someone wrote about must not follow them on a search
    # engine; /talk is its posts and comments), the explanations people write (/explain), people's pages, accounts and
    # their doors, the reviewers' desks and letters. Crawlable, so a crawler sees
    # the noindex.
    location ~ ^/(discussion|talk|explain|people|questions|me|saved|login|register|account|auth|forgot|reset|review|letters)(/|$)|^/topics/[^/]+/review {
        auth_request /_gate;
        gzip_static on;
        include /etc/nginx/law-headers.conf;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }
    # An article inside another site's frame (/embed/ma/…): the one page any site may frame. Never indexed either.
    location ^~ /embed/ {
        auth_request /_gate;
        gzip_static on;
        set $law_framing any;
        include /etc/nginx/law-headers.conf;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }
    # The assistants' sign-in (apps.oauth): the metadata where clients look, and the OAuth endpoints. Claude gives them
    # 10 seconds.
    location ~ ^/(oauth|\.well-known)/ {
        limit_req zone=law_oauth burst=20 nodelay;
        proxy_pass http://law_django;
        proxy_read_timeout 15s;
    }
    # The MCP server (apps.mcp, law-mcp under uvicorn): stateless, plain JSON answers.
    location = /mcp {
        # Behind the gate while it is closed, refused in the API's error shape rather than led to the password page; open,
        # the gate's question is answered by nginx itself (/_gate) and costs nothing.
        auth_request /_gate;
        error_page 401 = @gate_locked;
        limit_req zone=law_mcp burst=200 nodelay;
        client_max_body_size 256k;                  # a call checks 50 references at most (apps/mcp/server.py)
        proxy_pass http://127.0.0.1:8042;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location @gate_locked {
        default_type application/json;
        return 401 '{"errors": [{"field": "gate", "code": "locked"}]}';
    }
    # The consent page: the app's shell, never inside any frame, the site's own included (clickjacking).
    location = /connect {
        auth_request /_gate;
        set $law_framing none;
        include /etc/nginx/law-headers.conf;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }
    location /static/ {
        auth_request /_gate;
        alias @ROOT@/app/back/staticfiles/;
    }
    # The brand's files carried the site's earlier name in their addresses until 15 Nov 2026, and pages a search engine
    # holds still ask for them: they are sent to today's. Remove after 15 Feb 2027.
    location ~ ^/brand/qanoun-(mark|icon|stamp)\.svg$ { return 302 /brand/$1.svg; }
    location = /brand/qanoun-ar.svg { return 302 /brand/wordmark-ar.svg; }

    location /assets/ {
        auth_request /_gate;
        expires 1y;
        include /etc/nginx/law-headers.conf;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /sw.js {
        auth_request /_gate;
        include /etc/nginx/law-headers.conf;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    # A law's address: its prerendered page when the deploy wrote one (the named
    # texts, gzipped beside it), else Django's shell with that law's own head (apps/corpus/services/heads.py).
    location /ma/ {
        auth_request /_gate;
        limit_req zone=law_pages burst=40 nodelay;           # counted here, the file or @law alike
        gzip_static on;
        include /etc/nginx/law-headers.conf;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $law_index always;
        try_files $uri/index.html @law;
    }
    # Every other law, drawn with its words by the app's components (Django asks law-ssr).
    location @law {
        include /etc/nginx/law-headers.conf;
        add_header X-Robots-Tag $law_index always;
        proxy_pass http://law_django;
    }
    # The home drawn at the deploy, beside the shell, which every
    # other address without a file of its own is answered with.
    location = / {
        auth_request /_gate;
        gzip_static on;
        include /etc/nginx/law-headers.conf;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $law_index always;
        try_files /home.html /index.html;
    }
    # A search's address gets its own head from Django (the question, its first door's line and card). Never indexed:
    # one of endless pages.
    location = /search {
        auth_request /_gate;
        limit_req zone=law_pages burst=40 nodelay;
        include /etc/nginx/law-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://law_django;
    }
    # The app's other pages (web/src/app/App.tsx; back/apps/seo/tests keeps this line and the one above to its routes).
    # One the deploy wrote has its file, with its own title, description and canonical address (scripts/prerender.mjs):
    # served, and offered to search engines. One without a file is the shell, the same bytes at every address: the app
    # draws it in the browser, and it is never offered (a search engine files the shells, the same bytes at every
    # address, as copies of one another).
    location ~ ^/(about|ai|blog|bo|budget|check|codes|constitution|corrections|data|library|new|open-source|pages|places|privacy|rules|situations|topics)(/|$) {
        auth_request /_gate;
        # The landing pages drawn at the deploy (the topics, their journeys, tools and pages, the blog) have their .gz.
        gzip_static on;
        # The page asked again each time: a kept copy would name the build before a deploy.
        # An add_header here drops the server's own, so the robots' word is said again, as in every other location.
        include /etc/nginx/law-headers.conf;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $law_index always;
        try_files $uri $uri/index.html @shell;
    }
    location @shell {
        gzip_static on;
        include /etc/nginx/law-headers.conf;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }
    # Anything else is a file of the build, or nothing, and nothing is said as 404: the shell's 200 kept the addresses
    # of the site that held this name before listed, and answered every probe (/.env, /wordpress) as a page. The shell
    # still comes with it, so a person reads the app's «لم نجد هذه الصفحة».
    location / {
        auth_request /_gate;
        gzip_static on;
        include /etc/nginx/law-headers.conf;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $law_index always;
        error_page 404 /index.html;
        try_files $uri $uri/index.html =404;
    }
}
