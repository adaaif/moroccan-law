# ── The name, the wordmark and the icons: not licensed ──────────────────────────────────────────────────────────────
[[annotations]]
path = [
  "web/public/brand/**",
  "web/public/icons/**",
  "web/public/favicon.ico",
  "web/public/apple-touch-icon.png",
  "back/apps/corpus/data/wordmark.svg",
]
